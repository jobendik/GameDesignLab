<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grapple Gliders - Neon Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-size: 20px;
            font-weight: bold;
        }
        .score-container {
            color: #00f3ff;
        }
        .height-container {
            color: #ff00ff;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: auto; /* Enable clicking */
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }
        h1 {
            font-size: 40px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00f3ff;
            background: linear-gradient(to right, #00f3ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 30px;
        }
        button {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 15px 40px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        button:hover {
            background: #00f3ff;
            color: black;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
        }
        .hidden {
            display: none !important;
        }
        #tutorial {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            pointer-events: none;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-container">SCORE: <span id="score">0</span></div>
            <div class="height-container">ALT: <span id="altitude">0</span>m</div>
        </div>
        <div id="tutorial">Left Click to Grapple • Right Click to Dash</div>
    </div>

    <div id="message-box">
        <h1>Grapple<br>Gliders</h1>
        <p>Ascend to escape the Glitch.</p>
        <button id="start-btn">Start Simulation</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- GAME CONFIGURATION ---
        const GRAVITY = 0.4;
        const FRICTION = 0.99; // Air resistance
        const HOOK_SPEED = 35;
        const SWING_FORCE = 0.08; // How snappy the spring is
        const SWING_DAMPING = 0.995; // Energy loss on swing
        const DASH_FORCE = 15;
        const DASH_COOLDOWN = 120; // Frames
        const CAMERA_SMOOTHING = 0.1;
        
        // --- ASSETS & AUDIO (Synthesized) ---
        // In a real game, these would be proper SFX.
        // We will visualize sound with screen shake/particles for now.

        // --- STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let lastTime = 0;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let maxAltitude = 0;
        let frameCount = 0;
        
        // Camera
        let camera = { x: 0, y: 0, zoom: 1 };
        let screenShake = 0;

        // Input
        let mouse = { x: 0, y: 0, isDown: false, rightDown: false };
        
        // Entities
        let player;
        let obstacles = [];
        let particles = [];
        let lavaY = 0;
        let lavaSpeed = 1.0;
        let bots = [];

        // --- CLASSES ---

        class Vector {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vector(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vector(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vector(this.x * n, this.y * n); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { let m = this.mag(); return m === 0 ? new Vector(0,0) : new Vector(this.x/m, this.y/m); }
            dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
        }

        class Player {
            constructor(isBot = false) {
                this.pos = new Vector(0, -200);
                this.vel = new Vector(0, 0);
                this.radius = 12;
                this.color = isBot ? '#ff0055' : '#00f3ff';
                this.isBot = isBot;
                
                // Grapple State
                this.hook = {
                    active: false,
                    pos: new Vector(0,0), // The tip of the hook (or anchor point)
                    length: 0,
                    state: 'IDLE' // IDLE, SHOOTING, ATTACHED
                };

                this.dashCooldown = 0;
                this.dead = false;
            }

            update() {
                if (this.dead) return;

                // Physics
                this.vel.y += GRAVITY;
                this.vel = this.vel.mult(FRICTION);
                this.pos = this.pos.add(this.vel);

                // Bot Logic
                if (this.isBot) this.updateBotAI();

                // Hook Logic
                if (this.hook.state === 'SHOOTING') {
                    // Hook travels
                    let dir = this.hook.targetDir;
                    this.hook.pos = this.hook.pos.add(dir.mult(HOOK_SPEED));
                    
                    // Max range check (800px)
                    if (this.pos.dist(this.hook.pos) > 800) {
                        this.hook.state = 'IDLE'; // Missed
                    }

                    // Collision Check
                    for (let obs of obstacles) {
                        if (rectCircleColliding(obs, {x: this.hook.pos.x, y: this.hook.pos.y, r: 5})) {
                            this.hook.state = 'ATTACHED';
                            this.hook.length = this.pos.dist(this.hook.pos);
                            
                            // JUICE: Sparks
                            createExplosion(this.hook.pos.x, this.hook.pos.y, 10, '#ffff00');
                            if (!this.isBot) triggerShake(5);
                            break;
                        }
                    }
                } else if (this.hook.state === 'ATTACHED') {
                    // Swing Physics (Spring/Tension)
                    let toAnchor = this.hook.pos.sub(this.pos);
                    let dist = toAnchor.mag();
                    
                    // If we are further than the rope length, pull back
                    // "Elastic" feel
                    if (dist > this.hook.length) {
                        let pullDir = toAnchor.norm();
                        // The further out, the harder the pull (Hooke's law-ish)
                        let stretch = dist - this.hook.length;
                        let force = pullDir.mult(stretch * SWING_FORCE); 
                        
                        this.vel = this.vel.add(force);
                        // Damping when swinging to prevent infinite energy
                        this.vel = this.vel.mult(SWING_DAMPING);
                    }
                    
                    // Input to shorten rope (climb)
                    // if (mouse.isDown) this.hook.length -= 2; 
                    
                    // While attached, slight gravity reduction to feel "swingy" not "heavy"
                    this.vel.y -= GRAVITY * 0.1; 
                }

                // Dash Cooldown
                if (this.dashCooldown > 0) this.dashCooldown--;

                // Lava Death
                if (this.pos.y > lavaY) {
                    this.die();
                }
            }

            shootHook(targetX, targetY) {
                if (this.hook.state !== 'IDLE') return;
                
                this.hook.state = 'SHOOTING';
                this.hook.pos = new Vector(this.pos.x, this.pos.y);
                
                let target = new Vector(targetX, targetY);
                this.hook.targetDir = target.sub(this.pos).norm();
            }

            releaseHook() {
                if (this.hook.state === 'ATTACHED') {
                    // JUICE: Small boost on release to feel "pro"
                    // Add vector based on swing direction
                    this.vel = this.vel.mult(1.05); 
                }
                this.hook.state = 'IDLE';
            }

            dash() {
                if (this.dashCooldown > 0) return;
                
                // Dash towards mouse or velocity direction
                let dir;
                if (!this.isBot) {
                    // Dash towards mouse
                    let mouseWorld = screenToWorld(mouse.x, mouse.y);
                    dir = new Vector(mouseWorld.x, mouseWorld.y).sub(this.pos).norm();
                } else {
                    dir = new Vector(0, -1);
                }

                this.vel = this.vel.add(dir.mult(DASH_FORCE));
                this.dashCooldown = DASH_COOLDOWN;
                
                // JUICE: Dash particles
                createExplosion(this.pos.x, this.pos.y, 20, this.color);
                if (!this.isBot) triggerShake(10);
            }

            updateBotAI() {
                // Simple AI: If falling and no hook, shoot up. If hooked, release after a while.
                if (this.hook.state === 'IDLE' && this.vel.y > -5) {
                    // Find nearest obstacle above
                    let bestObs = null;
                    let minDist = Infinity;
                    for (let obs of obstacles) {
                        // Look for obstacles above us and within range
                        if (obs.y < this.pos.y && Math.abs(obs.x - this.pos.x) < 500 && obs.y > this.pos.y - 600) {
                            let d = this.pos.dist(new Vector(obs.x + obs.w/2, obs.y + obs.h/2));
                            if (d < minDist) {
                                minDist = d;
                                bestObs = obs;
                            }
                        }
                    }

                    if (bestObs && Math.random() < 0.05) {
                         this.shootHook(bestObs.x + bestObs.w/2, bestObs.y + bestObs.h/2);
                    }
                } else if (this.hook.state === 'ATTACHED') {
                    // If swinging up, release at apex
                    if (this.vel.y < -5 && Math.random() < 0.05) {
                        this.releaseHook();
                    }
                }
                
                // Bot Respawn logic if stuck/dead
                 if (this.pos.y > lavaY + 500 || this.pos.y < player.pos.y - 2000) {
                     this.pos.x = player.pos.x + (Math.random()*400 - 200);
                     this.pos.y = player.pos.y - 400;
                     this.vel = new Vector(0, -10);
                     this.hook.state = 'IDLE';
                 }
            }
            
            die() {
                this.dead = true;
                createExplosion(this.pos.x, this.pos.y, 50, this.color);
                if (!this.isBot) {
                    triggerShake(20);
                    gameOver();
                }
            }

            draw() {
                if (this.dead) return;

                // Draw Rope
                if (this.hook.state !== 'IDLE') {
                    ctx.beginPath();
                    ctx.moveTo(this.pos.x, this.pos.y);
                    ctx.lineTo(this.hook.pos.x, this.hook.pos.y);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = this.hook.state === 'ATTACHED' ? this.color : '#ffffff';
                    ctx.stroke();

                    // Rope Glow
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                // Draw Player Body
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Eyes (Direction indicator)
                let lookDir = this.vel.norm().mult(8);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.pos.x + lookDir.x, this.pos.y + lookDir.y, 4, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- WORLD GENERATION ---

        function generateObstacle(minY) {
            // Generate obstacles above the minY
            let x = (Math.random() * 2000) - 1000; // -1000 to 1000 range relative to center
            let y = minY - (Math.random() * 300);
            let w = 60 + Math.random() * 200;
            let h = 30 + Math.random() * 80;
            
            // Random Neon Color
            const colors = ['#00f3ff', '#ff00ff', '#bd00ff', '#00ff66'];
            let color = colors[Math.floor(Math.random() * colors.length)];

            obstacles.push({x, y, w, h, color});
        }

        function cleanupWorld() {
            // Remove obstacles too far below lava to save memory
            obstacles = obstacles.filter(o => o.y < lavaY + 800);
        }

        // --- PARTICLES ---
        class Particle {
            constructor(x, y, color) {
                this.pos = new Vector(x, y);
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 2;
                this.vel = new Vector(Math.cos(angle)*speed, Math.sin(angle)*speed);
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.01;
                this.color = color;
            }
            update() {
                this.pos = this.pos.add(this.vel);
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.pos.x, this.pos.y, 3, 3);
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, count, color) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // --- ENGINE UTILS ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function screenToWorld(sx, sy) {
            // Reverse the camera transform
            let x = (sx - width/2) / camera.zoom + camera.x;
            let y = (sy - height/2) / camera.zoom + camera.y;
            return {x, y};
        }

        function rectCircleColliding(rect, circle) {
            let distX = Math.abs(circle.x - rect.x - rect.w/2);
            let distY = Math.abs(circle.y - rect.y - rect.h/2);

            if (distX > (rect.w/2 + circle.r)) { return false; }
            if (distY > (rect.h/2 + circle.r)) { return false; }

            if (distX <= (rect.w/2)) { return true; } 
            if (distY <= (rect.h/2)) { return true; }

            let dx = distX - rect.w/2;
            let dy = distY - rect.h/2;
            return (dx*dx + dy*dy <= (circle.r*circle.r));
        }

        function triggerShake(amount) {
            screenShake = amount;
        }

        // --- GAME LOOP ---

        function init() {
            player = new Player();
            bots = [new Player(true), new Player(true), new Player(true)];
            bots.forEach((b, i) => b.pos.x = (i-1)*150);
            
            obstacles = [];
            particles = [];
            score = 0;
            lavaY = 600;
            lavaSpeed = 1.0;
            maxAltitude = 0;
            
            // Floor for start
            obstacles.push({x: -2000, y: 100, w: 4000, h: 50, color: '#fff'});
            
            // Initial Generation
            for(let i=0; i<30; i++) {
                generateObstacle(0 - (i*100));
            }

            resize();
            window.addEventListener('resize', resize);
            
            // Input Listeners
            window.addEventListener('mousedown', e => {
                if (gameState !== 'PLAYING') return;
                e.preventDefault();
                if (e.button === 0) { // Left
                    mouse.isDown = true;
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                    let m = screenToWorld(mouse.x, mouse.y);
                    player.shootHook(m.x, m.y);
                    document.getElementById('tutorial').style.opacity = '0';
                }
                if (e.button === 2) { // Right
                    player.dash();
                }
            });

            window.addEventListener('mouseup', e => {
                if (e.button === 0) {
                    mouse.isDown = false;
                    player.releaseHook();
                }
            });

            window.addEventListener('mousemove', e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            window.addEventListener('contextmenu', e => e.preventDefault());

            // Key listeners
            window.addEventListener('keydown', e => {
                 if (e.code === 'Space') {
                     if (gameState === 'PLAYING') player.dash();
                     if (gameState === 'GAMEOVER') startGame();
                 }
            });

            // Touch Support
            window.addEventListener('touchstart', e => {
                if (gameState !== 'PLAYING') return;
                // e.preventDefault(); // allow default sometimes
                let t = e.touches[0];
                mouse.x = t.clientX;
                mouse.y = t.clientY;
                let m = screenToWorld(mouse.x, mouse.y);
                player.shootHook(m.x, m.y);
                document.getElementById('tutorial').style.opacity = '0';
            }, {passive: false});

            window.addEventListener('touchend', e => {
                player.releaseHook();
            });

            document.getElementById('start-btn').addEventListener('click', startGame);

            requestAnimationFrame(loop);
        }

        function startGame() {
            gameState = 'PLAYING';
            document.getElementById('message-box').classList.add('hidden');
            init(); // Reset vars
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('message-box').classList.remove('hidden');
            document.querySelector('#message-box h1').innerText = "DISCONNECTED";
            document.querySelector('#message-box p').innerText = `Altitude Reached: ${Math.floor(maxAltitude)}m`;
            document.getElementById('start-btn').innerText = "Retry Link";
        }

        function loop(timestamp) {
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === 'PLAYING') {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            frameCount++;
            
            // Update Lava
            lavaY -= lavaSpeed;
            // Lava accelerates slightly over time
            if (frameCount % 600 === 0) lavaSpeed += 0.2;

            // Player
            player.update();
            bots.forEach(b => b.update());

            // Camera Follow
            let targetY = player.pos.y - 100; // Look slightly above player
            let targetX = player.pos.x;
            
            // Smooth Camera
            camera.x += (targetX - camera.x) * CAMERA_SMOOTHING;
            camera.y += (targetY - camera.y) * CAMERA_SMOOTHING;
            
            // Dynamic Zoom based on speed
            let speed = player.vel.mag();
            let targetZoom = Math.max(0.6, 1.2 - (speed / 80)); // Zoom out as we speed up
            camera.zoom += (targetZoom - camera.zoom) * 0.05;

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // World Gen
            // If the highest obstacle is lower than the top of the screen (in world space), gen more
            let screenTopY = screenToWorld(0, 0).y;
            let highestObsY = obstacles[obstacles.length-1].y;
            if (highestObsY > screenTopY - 1000) {
                generateObstacle(highestObsY);
            }
            cleanupWorld();

            // Screen Shake Decay
            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.5) screenShake = 0;

            // Score
            let currentAlt = Math.abs(Math.min(0, player.pos.y)) / 10;
            if (currentAlt > maxAltitude) maxAltitude = currentAlt;
            score = Math.floor(maxAltitude * 10);
            
            document.getElementById('score').innerText = score;
            document.getElementById('altitude').innerText = Math.floor(currentAlt);
        }

        function draw() {
            // Background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Grid (Parallax)
            ctx.save();
            let parX = camera.x * 0.5;
            let parY = camera.y * 0.5;
            
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 1;
            let gridSize = 100;
            let offsetX = width/2 - (parX % gridSize);
            let offsetY = height/2 - (parY % gridSize);
            
            ctx.beginPath();
            for(let x=offsetX - gridSize; x<width; x+=gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for(let y=offsetY - gridSize; y<height; y+=gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.restore();


            ctx.save();
            // Apply Camera
            ctx.translate(width/2, height/2);
            ctx.scale(camera.zoom, camera.zoom);
            
            // Screen Shake
            let sx = (Math.random() - 0.5) * screenShake;
            let sy = (Math.random() - 0.5) * screenShake;
            ctx.translate(-camera.x + sx, -camera.y + sy);

            // Draw Obstacles
            for(let obs of obstacles) {
                // Neon glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = obs.color;
                
                ctx.strokeStyle = obs.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                
                // Fill slightly transparent
                ctx.fillStyle = obs.color + '22'; // Hex alpha
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                
                ctx.shadowBlur = 0;
            }

            // Draw Lava (Glitch)
            ctx.fillStyle = '#ff0000';
            ctx.globalAlpha = 0.8;
            // Draw big rect for lava
            ctx.fillRect(camera.x - width/camera.zoom, lavaY, (width/camera.zoom)*3, (height/camera.zoom)*2); 
            
            // Lava Top Line (Glitchy)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            let startX = camera.x - (width/camera.zoom);
            let endX = camera.x + (width/camera.zoom);
            ctx.moveTo(startX, lavaY);
            for(let x = startX; x < endX; x+= 50) {
                ctx.lineTo(x, lavaY + (Math.random()*20 - 10));
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // Draw Particles
            for(let p of particles) p.draw();

            // Draw Bots
            bots.forEach(b => b.draw());

            // Draw Player
            player.draw();

            // Mouse Cursor Hint (Raycast visual)
            if (gameState === 'PLAYING') {
                let m = screenToWorld(mouse.x, mouse.y);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(m.x, m.y, 5, 0, Math.PI*2);
                ctx.fill();
                
                // Dotted line to mouse
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.setLineDash([5, 10]);
                ctx.beginPath();
                ctx.moveTo(player.pos.x, player.pos.y);
                ctx.lineTo(m.x, m.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();
        }

        // Start
        init();

    </script>
</body>
</html>
