const Mic          = _mk('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>');

/* ================= GAME CODE ================= */

/**
 * UTILITIES & CONSTANTS
 */
const GAME_WIDTH = 600;
const GAME_HEIGHT = 800;
const GRAVITY_SCALE = 1;
const PLATE_THICKNESS = 20;
const SCREW_RADIUS = 12;
const HOLE_RADIUS = 14;

// Colors
const COLORS = {
  woodLight: '#e4c49f',
  woodDark: '#8b5e3c',
  woodBorder: '#5c3a21',
  screwGold: '#facc15',
  screwSilver: '#94a3b8',
  holeEmpty: '#3e2723',
  background: '#2c1810',
};

// Physics Categories
const CATEGORY_PLATE = 0x0001;
const CATEGORY_WALL = 0x0002; // Not really used, but good practice

/**
 * LEVELS CONFIGURATION
 * Plates define their size, position (center), and where their holes are relative to that center.
 * Screws define which board hole index they occupy initially.
 * Board Holes define the grid on the backboard.
 */
const LEVELS = [
  {
    id: 1,
    name: "The First Drop",
    boardHoles: [
      { id: 'h1', x: 200, y: 200 }, { id: 'h2', x: 400, y: 200 },
      { id: 'h3', x: 200, y: 400 }, { id: 'h4', x: 400, y: 400 },
      { id: 'h5', x: 300, y: 600 },
    ],
    screws: [
      { id: 's1', holeId: 'h1' },
      { id: 's2', holeId: 'h2' },
    ],
    plates: [
      {
        id: 'p1', x: 300, y: 200, width: 300, height: 60, angle: 0,
        holes: [{ x: -100, y: 0 }, { x: 100, y: 0 }] // Relative to center
      }
    ]
  },
  {
    id: 2,
    name: "The Cross",
    boardHoles: [
      { id: 'h1', x: 300, y: 200 },
      { id: 'h2', x: 300, y: 300 },
      { id: 'h3', x: 300, y: 400 }, // Center
      { id: 'h4', x: 300, y: 500 },
      { id: 'h5', x: 200, y: 400 },
      { id: 'h6', x: 400, y: 400 },
      { id: 'h7', x: 100, y: 400 }, // Spares
      { id: 'h8', x: 500, y: 400 }, // Spares
    ],
    screws: [
      { id: 's1', holeId: 'h1' },
      { id: 's2', holeId: 'h5' },
      { id: 's3', holeId: 'h6' },
      { id: 's4', holeId: 'h4' },
    ],
    plates: [
      {
        id: 'vertical', x: 300, y: 350, width: 60, height: 400, angle: 0,
        holes: [{ x: 0, y: -150 }, { x: 0, y: 150 }, { x: 0, y: 50 }] // Pinning top and bottom
      },
      {
        id: 'horizontal', x: 300, y: 400, width: 300, height: 60, angle: 0,
        holes: [{ x: -100, y: 0 }, { x: 100, y: 0 }]
      }
    ]
  },
  {
    id: 3,
    name: "Balance Beam",
    boardHoles: [
      { id: 'h1', x: 200, y: 200 }, { id: 'h2', x: 400, y: 200 },
      { id: 'h3', x: 300, y: 300 },
      { id: 'h4', x: 150, y: 500 }, { id: 'h5', x: 450, y: 500 },
      { id: 'h6', x: 300, y: 600 }
    ],
    screws: [
      { id: 's1', holeId: 'h3' }, // Center pivot
      { id: 's2', holeId: 'h1' }, // Top left holder
    ],
    plates: [
      {
        id: 'beam', x: 300, y: 300, width: 400, height: 60, angle: 0.2,
        holes: [{ x: 0, y: 0 }, { x: -150, y: 0 }, { x: 150, y: 0 }]
      },
      {
        id: 'blocker', x: 200, y: 200, width: 80, height: 80, angle: 0,
        holes: [{ x: 0, y: 0 }]
      }
    ]
  },
  {
    id: 4,
    name: "The Trap",
    boardHoles: [
      { id: 'h1', x: 200, y: 150 }, { id: 'h2', x: 400, y: 150 },
      { id: 'h3', x: 300, y: 300 },
      { id: 'h4', x: 300, y: 500 },
      { id: 'h5', x: 200, y: 600 }, { id: 'h6', x: 400, y: 600 },
    ],
    screws: [
      { id: 's1', holeId: 'h1' }, { id: 's2', holeId: 'h2' },
      { id: 's3', holeId: 'h3' },
    ],
    plates: [
      {
        id: 'diag1', x: 300, y: 300, width: 350, height: 60, angle: 0.785, // 45 deg
        holes: [{ x: 0, y: 0 }, { x: -100, y: 0 }]
      },
      {
        id: 'diag2', x: 300, y: 300, width: 350, height: 60, angle: -0.785, // -45 deg
        holes: [{ x: 0, y: 0 }, { x: 100, y: 0 }]
      },
      {
        id: 'top', x: 300, y: 150, width: 300, height: 60, angle: 0,
        holes: [{ x: -100, y: 0 }, { x: 100, y: 0 }]
      }
    ]
  }
];

function App() {
  const [levelIndex, setLevelIndex] = useState(0);
  const [gameWon, setGameWon] = useState(false);
  const [selectedScrew, setSelectedScrew] = useState(null);
  const [platesLeft, setPlatesLeft] = useState(0);
  const [message, setMessage] = useState("");
  
  // Refs for engine persistence
  const engineRef = useRef(null);
  const renderLoopRef = useRef(null);
  const runnerRef = useRef(null);
  
  // Refs for DOM elements to update directly (high performance)
  const plateRefs = useRef({});
  const gameAreaRef = useRef(null);

  // Sound placeholders (visual feedback mainly)
  const playSound = (type) => {
    // In a real app, use Audio API. Here we just use logic.
  };

  /**
   * INITIALIZE ENGINE
   */
  useEffect(() => {
    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Events = Matter.Events;

    // Create engine
    const engine = Engine.create();
    engine.world.gravity.y = GRAVITY_SCALE;
    engineRef.current = engine;

    // Create runner
    const runner = Runner.create();
    runnerRef.current = runner;

    // Start running
    Runner.run(runner, engine);

    // Collision Event to detect plates falling off screen
    Events.on(engine, 'afterUpdate', () => {
      if (!engineRef.current) return;
      
      const bodies = Matter.Composite.allBodies(engineRef.current.world);
      let platesInView = 0;

      bodies.forEach(body => {
        // Sync Visuals
        if (plateRefs.current[body.label]) {
          const el = plateRefs.current[body.label];
          el.setAttribute('transform', `translate(${body.position.x}, ${body.position.y}) rotate(${body.angle * (180 / Math.PI)})`);
        }

        // Check if fallen (Win condition check)
        if (body.position.y < GAME_HEIGHT + 200) {
          platesInView++;
        } else {
          // Optimization: Remove bodies that fell far below
           if (body.position.y > GAME_HEIGHT + 1000 && !body.isStatic) {
             Matter.World.remove(engineRef.current.world, body);
           }
        }
      });
      
      // Update React state less frequently to avoid lag, or just use ref
      // We'll trust the visual loop for motion, but need state for win condition
      // Doing this check every frame is fine for logic, but setting state should be throttled
      // Instead, we compare with a ref to see if count changed
    });

    // Cleanup
    return () => {
      Runner.stop(runner);
      Engine.clear(engine);
    };
  }, []);

  // Separate loop for state-based win checking to avoid React render thrashing
  useEffect(() => {
    const checkWinInterval = setInterval(() => {
      if (!engineRef.current) return;
      const bodies = Matter.Composite.allBodies(engineRef.current.world);
      const activePlates = bodies.filter(b => b.label.startsWith('plate-') && b.position.y < GAME_HEIGHT + 100);
      setPlatesLeft(activePlates.length);
      
      if (activePlates.length === 0 && !gameWon) {
        setGameWon(true);
      }
    }, 500);
    return () => clearInterval(checkWinInterval);
  }, [gameWon]);


  /**
   * LOAD LEVEL
   */
  const loadLevel = useCallback((index) => {
    if (!engineRef.current) return;
    const world = engineRef.current.world;
    const level = LEVELS[index];

    // Clear world
    Matter.World.clear(world);
    Matter.Engine.clear(engineRef.current);
    engineRef.current.world.gravity.y = GRAVITY_SCALE; // Reset gravity

    setSelectedScrew(null);
    setGameWon(false);
    setMessage("");

    // Create Plates
    level.plates.forEach(p => {
      const body = Matter.Bodies.rectangle(p.x, p.y, p.width, p.height, {
        label: `plate-${p.id}`,
        frictionAir: 0.01,
        friction: 0.5,
        restitution: 0.2,
        density: 0.01,
        angle: p.angle || 0,
        collisionFilter: {
          category: CATEGORY_PLATE,
        },
        render: { visible: false } // We use React to render
      });
      
      // Attach metadata for holes
      body.plugin = {
        holes: p.holes || []
      };

      Matter.World.add(world, body);
    });

    // Initialize Screws (as constraints)
    // We store screw state in React, but mirror it in physics
    const initialScrews = level.screws.map(s => ({...s}));
    
    // Apply constraints for initial screws
    initialScrews.forEach(screw => {
      const hole = level.boardHoles.find(h => h.id === screw.holeId);
      if (hole) {
        applyScrewConstraint(world, screw.id, hole.x, hole.y);
      }
    });

    // We store active screws in a Ref for physics logic to access easily without stale closures
    // But for rendering UI, we need State.
    // Using a hybrid approach:
    // We will re-run the "apply constraints" logic whenever the 'screws' state changes? 
    // No, better to manage constraints imperatively during moves.

    // Let's set the initial React state for screws
    // We will render screws purely from React state.
    // Physics constraints are hidden backend.
  }, []);


  // Apply constraints for a screw at a specific location
  const applyScrewConstraint = (world, screwId, x, y) => {
    // 1. Find all bodies
    const bodies = Matter.Composite.allBodies(world);
    
    bodies.forEach(body => {
      if (!body.label.startsWith('plate-')) return;

      // 2. Check if this body has a hole at (x,y)
      // Since body moves/rotates, we transform the world point (x,y) into the body's local space
      const localPoint = {
        x: (x - body.position.x) * Math.cos(-body.angle) - (y - body.position.y) * Math.sin(-body.angle),
        y: (x - body.position.x) * Math.sin(-body.angle) + (y - body.position.y) * Math.cos(-body.angle)
      };

      // Check distance to any defined hole
      const holes = body.plugin.holes || [];
      const matchingHole = holes.find(h => {
        const dx = h.x - localPoint.x;
        const dy = h.y - localPoint.y;
        return (dx*dx + dy*dy) < (HOLE_RADIUS * HOLE_RADIUS);
      });

      if (matchingHole) {
        // 3. Pin it!
        const constraint = Matter.Constraint.create({
          label: `constraint-${screwId}-${body.label}`,
          bodyA: body,
          pointA: { x: matchingHole.x, y: matchingHole.y }, // Local offset on body
          pointB: { x: x, y: y }, // World position (where the screw is)
          stiffness: 1, // Rigid
          length: 0,
          render: { visible: false }
        });
        Matter.World.add(world, constraint);
      }
    });
  };

  const removeScrewConstraint = (world, screwId) => {
    const constraints = Matter.Composite.allConstraints(world);
    const toRemove = constraints.filter(c => c.label && c.label.includes(`constraint-${screwId}`));
    toRemove.forEach(c => Matter.World.remove(world, c));
  };

  // React State for Screws needs to match the level config
  const [currentScrews, setCurrentScrews] = useState([]);

  useEffect(() => {
    if (LEVELS[levelIndex]) {
      setCurrentScrews(LEVELS[levelIndex].screws.map(s => ({ ...s })));
      loadLevel(levelIndex);
    }
  }, [levelIndex, loadLevel]);


  /**
   * INTERACTION HANDLERS
   */

  const handleScrewClick = (screw) => {
    if (selectedScrew && selectedScrew.id === screw.id) {
      setSelectedScrew(null); // Deselect
    } else {
      setSelectedScrew(screw);
      setMessage("");
    }
  };

  const handleHoleClick = (targetHole) => {
    if (!selectedScrew) return;
    if (!engineRef.current) return;

    // 1. Is hole occupied?
    const isOccupied = currentScrews.find(s => s.holeId === targetHole.id);
    if (isOccupied) {
      setMessage("Hole is occupied!");
      return;
    }

    // 2. Is hole physically blocked by a plate (where there is NO hole)?
    const world = engineRef.current.world;
    const bodies = Matter.Composite.allBodies(world);
    
    // We use Matter.Query.point to see if we are clicking on a body
    const bodiesAtPoint = Matter.Query.point(bodies, { x: targetHole.x, y: targetHole.y });
    
    let blocked = false;

    // For every body covering this point, check if we are hitting a hole or solid wood
    for (let body of bodiesAtPoint) {
      if (!body.label.startsWith('plate-')) continue;

      // Transform world point to local
      const localPoint = {
        x: (targetHole.x - body.position.x) * Math.cos(-body.angle) - (targetHole.y - body.position.y) * Math.sin(-body.angle),
        y: (targetHole.x - body.position.x) * Math.sin(-body.angle) + (targetHole.y - body.position.y) * Math.cos(-body.angle)
      };

      const holes = body.plugin.holes || [];
      const isOverHole = holes.some(h => {
        const dx = h.x - localPoint.x;
        const dy = h.y - localPoint.y;
        return (dx*dx + dy*dy) < (HOLE_RADIUS * HOLE_RADIUS * 1.5); // Slight tolerance
      });

      if (!isOverHole) {
        blocked = true;
        break; // Blocked by at least one plate
      }
    }

    if (blocked) {
      setMessage("Blocked by plate!");
      return;
    }

    // 3. EXECUTE MOVE
    const oldScrewId = selectedScrew.id;
    
    // Remove old constraints
    removeScrewConstraint(world, oldScrewId);

    // Update State
    const updatedScrews = currentScrews.map(s => {
      if (s.id === oldScrewId) {
        return { ...s, holeId: targetHole.id };
      }
      return s;
    });
    setCurrentScrews(updatedScrews);

    // Add new constraints (Physics)
    // We need to wait for state? No, do it immediately for physics
    applyScrewConstraint(world, oldScrewId, targetHole.x, targetHole.y);

    setSelectedScrew(null);
    setMessage("");
  };

  const nextLevel = () => {
    if (levelIndex < LEVELS.length - 1) {
      setLevelIndex(prev => prev + 1);
    } else {
      setMessage("All levels completed!");
    }
  };

  const restartLevel = () => {
    // Force reload
    // We can just set level index to same, but useEffect depends on it
    // So we manually call loadLevel and reset screws
    setCurrentScrews(LEVELS[levelIndex].screws.map(s => ({ ...s })));
    loadLevel(levelIndex);
  };

  /**
   * RENDERERS
   */
  const currentLevelData = LEVELS[levelIndex];

  return (
    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-slate-100 font-sans p-4 select-none">
      
      {/* HUD */}
      <div className="w-full max-w-xl flex justify-between items-center mb-4 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <div className="flex flex-col">
          <span className="text-xs text-slate-400 uppercase tracking-wider">Level {levelIndex + 1}</span>
          <h1 className="text-xl font-bold text-amber-400">{currentLevelData?.name}</h1>
        </div>
        
        <div className="flex gap-4">
           <button 
            onClick={restartLevel}
            className="p-2 bg-slate-700 hover:bg-slate-600 rounded-full transition-colors"
            title="Restart Level"
          >
            <RotateCcw size={20} />
          </button>
          <div className="flex items-center gap-2 px-3 py-1 bg-slate-900 rounded-lg border border-slate-700">
            <span className="text-slate-400 text-sm">Plates:</span>
            <span className={`font-mono font-bold ${platesLeft === 0 ? 'text-green-400' : 'text-white'}`}>
              {platesLeft}
            </span>
          </div>
        </div>
      </div>

      {/* GAME AREA */}
      <div 
        className="relative shadow-2xl overflow-hidden rounded-xl border-4 border-slate-800 bg-[#2c1810]"
        style={{ width: '100%', maxWidth: '500px', aspectRatio: `${GAME_WIDTH}/${GAME_HEIGHT}` }}
        ref={gameAreaRef}
      >
        {/* The SVG scales to fit the container */}
        <svg 
          viewBox={`0 0 ${GAME_WIDTH} ${GAME_HEIGHT}`} 
          className="w-full h-full block"
          preserveAspectRatio="xMidYMid slice"
        >
          <defs>
            {/* Wood Texture Pattern */}
            <pattern id="woodPattern" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="#8b5e3c"/>
              <path d="M0 20 Q50 0 100 20 M0 40 Q50 60 100 40 M0 70 Q50 50 100 70" stroke="#70482d" strokeWidth="2" fill="none" opacity="0.3"/>
              <circle cx="20" cy="30" r="1" fill="#4a3020" opacity="0.5"/>
              <circle cx="80" cy="80" r="1.5" fill="#4a3020" opacity="0.5"/>
            </pattern>
            {/* Screw Thread Gradient */}
            <linearGradient id="screwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#fef08a" />
              <stop offset="50%" stopColor="#eab308" />
              <stop offset="100%" stopColor="#a16207" />
            </linearGradient>
            <radialGradient id="holeShadow" cx="50%" cy="50%" r="50%">
               <stop offset="70%" stopColor="#1a0f0a" stopOpacity="0.8"/>
               <stop offset="100%" stopColor="#2c1810" stopOpacity="0"/>
            </radialGradient>
            <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
              <feOffset dx="2" dy="2" result="offsetblur"/>
              <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
              </feComponentTransfer>
              <feMerge> 
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/> 
              </feMerge>
            </filter>
          </defs>

          {/* Background Holes */}
          {currentLevelData?.boardHoles.map(hole => (
            <g 
              key={hole.id} 
              onClick={() => handleHoleClick(hole)}
              className="cursor-pointer hover:opacity-80 transition-opacity"
            >
              <circle cx={hole.x} cy={hole.y} r={HOLE_RADIUS + 2} fill="#3e2723" />
              <circle cx={hole.x} cy={hole.y} r={HOLE_RADIUS} fill="black" opacity="0.6" />
              {/* Highlight valid move targets */}
              {selectedScrew && !currentScrews.find(s => s.holeId === hole.id) && (
                <circle 
                  cx={hole.x} 
                  cy={hole.y} 
                  r={HOLE_RADIUS + 5} 
                  fill="none" 
                  stroke="#fbbf24" 
                  strokeWidth="2"
                  className="animate-pulse" 
                />
              )}
            </g>
          ))}

          {/* Plates - Rendered via React state initially, updated via Ref for physics */}
          {currentLevelData?.plates.map(plate => (
            <g 
              key={plate.id} 
              ref={el => (plateRefs.current[`plate-${plate.id}`] = el)}
              // Initial Transform
              transform={`translate(${plate.x}, ${plate.y}) rotate(${plate.angle * 180 / Math.PI})`}
              filter="url(#dropShadow)"
            >
              {/* The Plate Shape - centered at 0,0 because the group handles the position */}
              <rect 
                x={-plate.width / 2} 
                y={-plate.height / 2} 
                width={plate.width} 
                height={plate.height} 
                rx="10" 
                fill="url(#woodPattern)"
                stroke="#5c3a21"
                strokeWidth="2"
              />
              {/* Visual Holes on the plate */}
              {plate.holes.map((h, i) => (
                <g key={i} transform={`translate(${h.x}, ${h.y})`}>
                  <circle r={HOLE_RADIUS} fill="#2c1810" />
                  <circle r={HOLE_RADIUS} fill="black" opacity="0.3" />
                </g>
              ))}
            </g>
          ))}

          {/* Screws */}
          {currentScrews.map(screw => {
            // Find current position based on hole ID
            // Since screws move instantly between holes in this game logic (teleport), we just look up the hole
            const hole = currentLevelData?.boardHoles.find(h => h.id === screw.holeId);
            if (!hole) return null;

            const isSelected = selectedScrew?.id === screw.id;

            return (
              <g 
                key={screw.id} 
                transform={`translate(${hole.x}, ${hole.y})`}
                onClick={() => handleScrewClick(screw)}
                className="cursor-pointer"
                style={{ transition: 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
              >
                {/* Selection Glow */}
                {isSelected && (
                  <circle r={SCREW_RADIUS + 8} fill="#fbbf24" opacity="0.5" className="animate-ping" />
                )}
                
                {/* Screw Head */}
                <circle r={SCREW_RADIUS} fill="url(#screwGrad)" stroke="#713f12" strokeWidth="1" />
                
                {/* Screw Slot (Cross) */}
                <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#713f12" strokeWidth="3" strokeLinecap="round" />
                <path d="M-6 -6 L6 6 M-6 6 L6 -6" stroke="#fef08a" strokeWidth="1" strokeLinecap="round" opacity="0.5" />
              </g>
            );
          })}
        </svg>

        {/* Victory Overlay */}
        {gameWon && (
          <div className="absolute inset-0 bg-black/70 flex flex-col items-center justify-center animate-in fade-in duration-500 z-50">
            <Trophy className="text-yellow-400 w-24 h-24 mb-4 drop-shadow-lg animate-bounce" />
            <h2 className="text-4xl font-bold text-white mb-2">Level Clear!</h2>
            <p className="text-slate-300 mb-8">All plates removed.</p>
            <div className="flex gap-4">
              <button 
                onClick={restartLevel}
                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold transition text-white"
              >
                Replay
              </button>
              {levelIndex < LEVELS.length - 1 ? (
                <button 
                  onClick={nextLevel}
                  className="px-6 py-3 bg-green-600 hover:bg-green-500 rounded-lg font-bold transition text-white flex items-center gap-2"
                >
                  Next Level <Play size={20} fill="currentColor" />
                </button>
              ) : (
                <div className="px-6 py-3 bg-amber-600 rounded-lg font-bold text-white">
                  All Levels Done!
                </div>
              )}
            </div>
          </div>
        )}

        {/* Message Toast */}
        {message && (
          <div className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-red-500/90 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-lg animate-bounce">
            <AlertCircle size={16} />
            {message}
          </div>
        )}
      </div>

      <div className="mt-8 text-slate-400 text-sm max-w-md text-center">
        <p>Tap a screw to unscrew it. Tap an empty hole to move it there.</p>
        <p>Clear all wood plates to win.</p>
      </div>
    </div>
  );
}

/* ================= MOUNT ================= */
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
