<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Neon Pinball Rush - Mobile Prototype</title>
<style>
  :root{
    --bg:#070712;
    --ink:#eff7ff;
    --muted:#9eb0d9;
    --cyan:#52fff3;
    --green:#46ff8d;
    --pink:#ff2f8d;
    --gold:#ffd166;
    --violet:#9d62ff;
  }
  html,body{
    margin:0; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 16%, #1c2147 0%, #0a0b17 54%, #03040a 100%);
    color:var(--ink);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  #game{display:block; width:100vw; height:100vh; touch-action:none; cursor:pointer;}
  #hint{
    position:fixed; left:12px; right:12px; bottom:10px; text-align:center;
    color:rgba(255,255,255,.52); font-size:11px; pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.7);
  }
  @media (orientation:landscape){#hint{display:block}}
  @media (orientation:portrait){#hint{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">Best i portrettmodus på mobil</div>
<script>
(() => {
  "use strict";

  // ============================================================
  // NEON PINBALL RUSH
  // Mobile-first pinball roguelite prototype.
  // Everything is procedural canvas + generated audio.
  // Controls: left half = left flipper, right half = right flipper.
  // ============================================================

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha:false });

  const W = 390;
  const H = 700;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;

  let dpr = 1;
  let scale = 1;
  let ox = 0;
  let oy = 0;

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const rand = (a,b)=>a+Math.random()*(b-a);
  const irand = (a,b)=>Math.floor(rand(a,b+1));
  const len = (x,y)=>Math.hypot(x,y);
  const dist = (a,b,c,d)=>Math.hypot(a-c,b-d);
  const sign = v => v < 0 ? -1 : 1;

  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    scale = Math.min(innerWidth / W, innerHeight / H);
    ox = (innerWidth - W * scale) * 0.5;
    oy = (innerHeight - H * scale) * 0.5;
  }
  addEventListener("resize", resize, { passive:true });
  resize();

  function screenToWorld(clientX, clientY){
    return { x:(clientX - ox) / scale, y:(clientY - oy) / scale };
  }

  // ============================================================
  // Audio.
  // ============================================================

  let audioCtx = null;
  let audioOn = true;
  function initAudio(){
    if (!audioOn || audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(_){ audioOn = false; }
  }

  function tone(kind="flip"){
    if (!audioCtx || !audioOn) return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    let f0=180, f1=100, dur=.08, wave="sine", vol=.055;
    if (kind === "flip") { f0=160; f1=105; dur=.055; wave="triangle"; vol=.045; }
    if (kind === "bumper") { f0=420; f1=980; dur=.10; wave="triangle"; vol=.07; }
    if (kind === "target") { f0=760; f1=1240; dur=.08; wave="square"; vol=.045; }
    if (kind === "jackpot") { f0=520; f1=1560; dur=.28; wave="triangle"; vol=.085; }
    if (kind === "drain") { f0=180; f1=62; dur=.30; wave="sawtooth"; vol=.08; }
    if (kind === "level") { f0=260; f1=1180; dur=.36; wave="triangle"; vol=.09; }
    if (kind === "coin") { f0=960; f1=1440; dur=.07; wave="sine"; vol=.04; }
    o.type = wave;
    o.frequency.setValueAtTime(f0, now);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), now + dur);
    g.gain.setValueAtTime(.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + .008);
    g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + dur + .03);
  }

  // ============================================================
  // Persistent meta.
  // ============================================================

  const SAVE_KEY = "neon_pinball_rush_proto_v1";
  const meta = { bestScore:0, bestLevel:1, runs:0, totalStars:0 };
  try { Object.assign(meta, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch(_){}
  function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch(_){} }

  // ============================================================
  // State.
  // ============================================================

  let state = "menu";
  let last = performance.now();
  let acc = 0;
  let time = 0;
  let shake = 0;
  let flash = 0;
  let slow = 0;
  let buttons = [];

  const input = { left:false, right:false, launched:false };

  let run, ball, leftFlipper, rightFlipper;
  let walls = [], bumpers = [], targets = [], gates = [], stars = [], lanes = [];
  let particles = [], texts = [], shockRings = [];
  let upgrades = [];
  let comboTimer = 0;
  let messageTimer = 0;
  let graceTimer = 0;

  const board = {
    left:34, right:356, top:96, bottom:654,
    drainY:714,
    portalX:195, portalY:122
  };

  function newRun(){
    meta.runs++;
    save();
    run = {
      level:1,
      score:0,
      levelScore:0,
      goal:1100,
      balls:3,
      multiplier:1,
      combo:0,
      jackpot:0,
      portalOpen:false,
      stats:{
        flipperPower:1,
        bumperValue:1,
        ballSaver:0,
        magnet:0,
        portalBonus:1,
        slowmo:0,
        targetValue:1,
        multGain:1
      }
    };
    setupLevel(1);
    resetBall(true);
    state = "play";
    addText(W/2, 172, "ROUND 1", "#ffffff", 28, 1.0);
  }

  function setupLevel(level){
    run.level = level;
    run.levelScore = 0;
    run.goal = Math.floor(950 + level * 360 + Math.min(level, 10) * 110);
    run.portalOpen = false;
    run.combo = 0;
    run.multiplier = Math.max(1, Math.floor(1 + (level-1) * 0.15));
    comboTimer = 0;
    graceTimer = 1.8;

    walls = [];
    bumpers = [];
    targets = [];
    gates = [];
    stars = [];
    lanes = [];
    particles = [];
    texts = [];
    shockRings = [];

    createOuterRails();
    createLevelLayout(level);
    createFlippers();
  }

  function resetBall(first=false){
    ball = {
      x: W/2,
      y: H-118,
      r: 8.8,
      vx: first ? 0 : rand(-80,80),
      vy: first ? 0 : -520,
      spin: 0,
      trail:[],
      saved:false,
      stuck:0,
      glow:0
    };
    input.launched = !first;
    messageTimer = first ? 2.4 : 1.2;
  }

  function createOuterRails(){
    // Outer walls and return lanes. They deliberately leave an open center drain.
    addSeg(34, 124, 34, 548, "outer", .92, 7, "#52fff3");
    addSeg(356, 124, 356, 548, "outer", .92, 7, "#52fff3");
    addSeg(56, 102, 334, 102, "outer", .92, 7, "#52fff3");

    // Rounded-ish top shoulders built from segments.
    addSeg(34, 124, 61, 104, "outer", .92, 7, "#52fff3");
    addSeg(356, 124, 329, 104, "outer", .92, 7, "#52fff3");

    // Lower return lanes guide the ball back to the flippers.
    addSeg(34, 548, 118, 616, "outer", .90, 8, "#46ff8d");
    addSeg(356, 548, 272, 616, "outer", .90, 8, "#46ff8d");
    addSeg(56, 586, 118, 631, "guide", .86, 5, "#9d62ff");
    addSeg(334, 586, 272, 631, "guide", .86, 5, "#9d62ff");

    // Small safety posts beside the drain.
    addCircleWall(138, 617, 7, "post", .90, "#ffd166");
    addCircleWall(252, 617, 7, "post", .90, "#ffd166");
  }

  function createLevelLayout(level){
    const variant = (level - 1) % 5;
    const difficulty = Math.min(1, level / 10);

    // No long horizontal blockers. All layouts keep a readable central route to the portal.
    if (variant === 0) {
      addBumper(195, 278, 20, 95, "#52fff3");
      addBumper(128, 355, 18, 80, "#ff2f8d");
      addBumper(262, 355, 18, 80, "#46ff8d");
      addGate(195, 208, 74, "JACKPOT GATE", "#ffd166");
      addTargetArc(195, 214, 76, 205, 335, 7, "#ff4f9d");
      addLane(88, 214, 122, 342, .88, "#ff2f8d");
      addLane(302, 214, 268, 342, .88, "#ff2f8d");
    } else if (variant === 1) {
      addBumper(155, 252, 17, 85, "#52fff3");
      addBumper(235, 252, 17, 85, "#52fff3");
      addBumper(195, 343, 22, 120, "#ffd166");
      addGate(195, 172, 88, "RUSH GATE", "#46ff8d");
      addTargetLine(88, 420, 302, 420, 7, "#ff2f8d");
      addLane(78, 272, 122, 196, .92, "#9d62ff");
      addLane(312, 272, 268, 196, .92, "#9d62ff");
      addLane(110, 486, 70, 420, .85, "#52fff3");
      addLane(280, 486, 320, 420, .85, "#52fff3");
    } else if (variant === 2) {
      addBumper(112, 278, 17, 90, "#46ff8d");
      addBumper(278, 278, 17, 90, "#46ff8d");
      addBumper(195, 380, 19, 105, "#52fff3");
      addTargetArc(195, 247, 110, 190, 350, 9, "#ffd166");
      addGate(195, 474, 94, "MULTI GATE", "#ff2f8d");
      addLane(111, 167, 142, 310, .90, "#52fff3");
      addLane(279, 167, 248, 310, .90, "#52fff3");
      addLane(139, 520, 101, 455, .86, "#9d62ff");
      addLane(251, 520, 289, 455, .86, "#9d62ff");
    } else if (variant === 3) {
      addBumper(195, 238, 18, 90, "#ff2f8d");
      addBumper(135, 315, 17, 90, "#52fff3");
      addBumper(255, 315, 17, 90, "#52fff3");
      addBumper(195, 423, 18, 100, "#46ff8d");
      addTargetLine(96, 180, 294, 180, 8, "#ffd166");
      addTargetLine(110, 505, 280, 505, 5, "#ff2f8d");
      addGate(195, 360, 78, "SKILL GATE", "#52fff3");
      addLane(76, 240, 116, 372, .90, "#9d62ff");
      addLane(314, 240, 274, 372, .90, "#9d62ff");
    } else {
      addBumper(104, 245, 16, 90, "#ffd166");
      addBumper(286, 245, 16, 90, "#ffd166");
      addBumper(150, 382, 18, 95, "#52fff3");
      addBumper(240, 382, 18, 95, "#52fff3");
      addTargetArc(195, 295, 94, 0, 360, 10, "#ff2f8d");
      addGate(195, 198, 104, "STAR GATE", "#46ff8d");
      addLane(79, 178, 120, 322, .90, "#9d62ff");
      addLane(311, 178, 270, 322, .90, "#9d62ff");
      addLane(118, 500, 160, 445, .84, "#52fff3");
      addLane(272, 500, 230, 445, .84, "#52fff3");
    }

    const starCount = Math.min(18, 8 + level * 2);
    for (let i=0;i<starCount;i++){
      // Keep the very top portal mouth clear.
      let x, y, tries = 0;
      do {
        x = rand(64, 326); y = rand(156, 530); tries++;
      } while ((dist(x,y,195,122) < 70 || nearObject(x,y,26)) && tries < 40);
      stars.push({x,y,r:4.6,taken:false,phase:rand(0,TAU),vx:0,vy:0});
    }

    // A few extra targets as difficulty rises, but never blocking movement.
    if (difficulty > .35) {
      for (let i=0;i<Math.floor(level/3);i++) {
        addTarget(rand(80,310), rand(235,500), "#ff4f9d");
      }
    }
  }

  function nearObject(x,y,margin){
    for (const b of bumpers) if (dist(x,y,b.x,b.y) < b.r + margin) return true;
    for (const tg of targets) if (dist(x,y,tg.x,tg.y) < tg.r + margin) return true;
    return false;
  }

  function createFlippers(){
    leftFlipper = makeFlipper("left", 126, 626, 82, 11 * DEG, -42 * DEG);
    rightFlipper = makeFlipper("right", 264, 626, 82, 169 * DEG, 222 * DEG);
  }

  function makeFlipper(side, px, py, length, restAngle, activeAngle){
    return {
      side, px, py, length,
      angle:restAngle, prevAngle:restAngle,
      restAngle, activeAngle,
      radius:10,
      angularVelocity:0,
      glow:0
    };
  }

  function addSeg(x1,y1,x2,y2,type="wall",rest=.88,thick=5,color="#52fff3"){
    walls.push({x1,y1,x2,y2,type,rest,thick,color,flash:0});
  }

  function addCircleWall(x,y,r,type="post",rest=.9,color="#52fff3"){
    bumpers.push({x,y,r,baseR:r,score:0,power:0,kind:type,color,phase:rand(0,TAU),flash:0,hitCooldown:0});
  }

  function addBumper(x,y,r,score,color){
    bumpers.push({x,y,r,baseR:r,score,power:760,kind:"bumper",color,phase:rand(0,TAU),flash:0,hitCooldown:0});
  }

  function addTarget(x,y,color){
    targets.push({x,y,r:8.4,hp:1,dead:false,color,phase:rand(0,TAU),flash:0});
  }

  function addTargetLine(x1,y1,x2,y2,count,color){
    for (let i=0;i<count;i++){
      const u = count === 1 ? .5 : i/(count-1);
      addTarget(lerp(x1,x2,u), lerp(y1,y2,u), color);
    }
  }

  function addTargetArc(cx,cy,r,a0,a1,count,color){
    for (let i=0;i<count;i++){
      const u = count === 1 ? .5 : i/(count-1);
      const a = lerp(a0*DEG, a1*DEG, u);
      addTarget(cx + Math.cos(a)*r, cy + Math.sin(a)*r, color);
    }
  }

  function addGate(x,y,w,label,color){
    gates.push({x,y,w,h:16,label,color,phase:rand(0,TAU),cooldown:0});
  }

  function addLane(x1,y1,x2,y2,rest,color){
    lanes.push({x1,y1,x2,y2,rest,thick:7,color,flash:0});
    addSeg(x1,y1,x2,y2,"lane",rest,7,color);
  }

  // ============================================================
  // Input.
  // ============================================================

  function pointerDown(ev){
    ev.preventDefault();
    initAudio();
    const src = ev.touches && ev.touches.length ? ev.touches[0] : ev;
    const p = screenToWorld(src.clientX, src.clientY);

    if (state === "menu") {
      newRun();
      return;
    }
    if (state === "upgrade") {
      for (const b of buttons) {
        if (hitRect(p,b)) {
          b.apply();
          tone("level");
          setupLevel(run.level + 1);
          resetBall(false);
          state = "play";
          addText(W/2, 170, "ROUND " + run.level, "#ffffff", 28, 1.0);
          return;
        }
      }
      return;
    }
    if (state === "gameover") {
      newRun();
      return;
    }
    if (state !== "play") return;

    if (!input.launched) {
      launchBall(p.x < W/2 ? -1 : 1);
      return;
    }

    if (p.x < W/2) input.left = true;
    else input.right = true;
  }

  function pointerMove(ev){
    if (state !== "play" || !input.launched) return;
    const src = ev.touches && ev.touches.length ? ev.touches[0] : ev;
    if (!src) return;
    const p = screenToWorld(src.clientX, src.clientY);
    input.left = p.x < W/2;
    input.right = p.x >= W/2;
  }

  function pointerUp(ev){
    ev.preventDefault();
    input.left = false;
    input.right = false;
  }

  canvas.addEventListener("pointerdown", pointerDown, { passive:false });
  canvas.addEventListener("pointermove", pointerMove, { passive:false });
  canvas.addEventListener("pointerup", pointerUp, { passive:false });
  canvas.addEventListener("pointercancel", pointerUp, { passive:false });

  addEventListener("keydown", e => {
    initAudio();
    if (e.key === " " && state === "menu") newRun();
    if (state === "play" && !input.launched && (e.key === " " || e.key === "ArrowUp")) launchBall(Math.random()<.5?-1:1);
    if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") input.left = true;
    if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") input.right = true;
    if (e.key === "r" || e.key === "R") newRun();
  });
  addEventListener("keyup", e => {
    if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") input.left = false;
    if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") input.right = false;
  });

  function hitRect(p,r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }

  function launchBall(dir){
    input.launched = true;
    ball.vx = dir * rand(80, 130);
    ball.vy = -690;
    ball.x = W/2;
    ball.y = H-118;
    addBurst(ball.x, ball.y, 34, "#52fff3", 1.1);
    shockRings.push({x:ball.x,y:ball.y,r:8,max:68,life:.45,color:"#52fff3"});
    tone("level");
  }

  // ============================================================
  // Update.
  // ============================================================

  function update(dt){
    time += dt;
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt);
    slow = Math.max(0, slow - dt);
    graceTimer = Math.max(0, graceTimer - dt);
    comboTimer = Math.max(0, comboTimer - dt);
    messageTimer = Math.max(0, messageTimer - dt);

    if (comboTimer <= 0 && run) run.combo = 0;

    updateFx(dt);

    if (state === "play") {
      updatePlay(dt);
    }
  }

  function updatePlay(dt){
    updateFlipper(leftFlipper, input.left, dt);
    updateFlipper(rightFlipper, input.right, dt);

    for (const b of bumpers) { b.flash = Math.max(0,b.flash-dt*4); b.hitCooldown=Math.max(0,b.hitCooldown-dt); }
    for (const tg of targets) tg.flash = Math.max(0,tg.flash-dt*4);
    for (const g of gates) g.cooldown = Math.max(0, g.cooldown - dt);
    for (const l of lanes) l.flash = Math.max(0,l.flash-dt*4);
    for (const w of walls) w.flash = Math.max(0,w.flash-dt*4);

    if (!input.launched) {
      ball.x = W/2 + Math.sin(time*2.1)*4;
      ball.y = H-118;
      ball.vx = 0; ball.vy = 0;
      return;
    }

    // Fixed substeps for stable pinball behavior across refresh rates.
    acc += dt;
    const step = 1 / 120;
    let loops = 0;
    while (acc >= step && loops < 6) {
      physicsStep(step);
      acc -= step;
      loops++;
    }
  }

  function updateFlipper(f, active, dt){
    f.prevAngle = f.angle;
    const target = active ? f.activeAngle : f.restAngle;
    const speed = active ? 18 : 11;
    f.angle = lerp(f.angle, target, 1 - Math.exp(-speed * dt));
    f.angularVelocity = (f.angle - f.prevAngle) / Math.max(dt, .0001);
    f.glow = active ? Math.min(1, f.glow + dt*10) : Math.max(0, f.glow - dt*7);
  }

  function physicsStep(dt){
    const gravity = 875;
    const damping = 0.9992;

    ball.vy += gravity * dt;
    ball.vx *= damping;
    ball.vy *= damping;

    // Very tiny magnet: not enough to play for you, only enough to make stars satisfying.
    if (run.stats.magnet > 0) {
      for (const s of stars) {
        if (s.taken) continue;
        const d = dist(ball.x, ball.y, s.x, s.y);
        if (d < 38 + run.stats.magnet) {
          const nx = (ball.x - s.x) / Math.max(d, 0.001);
          const ny = (ball.y - s.y) / Math.max(d, 0.001);
          s.vx += nx * 470 * dt;
          s.vy += ny * 470 * dt;
        }
      }
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.trail.push({x:ball.x,y:ball.y,life:.34});
    if (ball.trail.length > 22) ball.trail.shift();
    for (const tr of ball.trail) tr.life -= dt;
    ball.trail = ball.trail.filter(tr => tr.life > 0);

    // Rails and walls.
    for (const w of walls) collideBallSegment(w, dt);

    // Bumpers/posts.
    for (const b of bumpers) collideBumper(b, dt);

    // Dynamic flippers last, so active hits feel crisp.
    collideFlipper(leftFlipper, dt);
    collideFlipper(rightFlipper, dt);

    // Targets, gates, stars, portal.
    collideTargets();
    collideGates(dt);
    updateStars(dt);
    collidePortal();

    // Clamp velocity to avoid tunneling but preserve fast arcade energy.
    const speed = len(ball.vx, ball.vy);
    const maxSpeed = 1180;
    if (speed > maxSpeed) {
      ball.vx = ball.vx / speed * maxSpeed;
      ball.vy = ball.vy / speed * maxSpeed;
    }

    // Anti-stuck: if ball is crawling in the lower safe area, gently shake it loose.
    if (len(ball.vx, ball.vy) < 38 && ball.y > 585) ball.stuck += dt; else ball.stuck = 0;
    if (ball.stuck > 1.2) {
      ball.vx += rand(-130,130);
      ball.vy -= 190;
      ball.stuck = 0;
      addText(ball.x, ball.y-22, "NUDGE", "#52fff3", 13, .45);
    }

    if (ball.y > board.drainY) drainBall();
  }

  function collideBallSegment(seg, dt){
    const ax = seg.x1, ay = seg.y1, bx = seg.x2, by = seg.y2;
    const abx = bx - ax, aby = by - ay;
    const ab2 = abx*abx + aby*aby;
    let u = ((ball.x - ax)*abx + (ball.y - ay)*aby) / Math.max(ab2, .001);
    u = clamp(u, 0, 1);
    const cx = ax + abx * u, cy = ay + aby * u;
    let dx = ball.x - cx, dy = ball.y - cy;
    let d = len(dx,dy);
    const minD = ball.r + seg.thick * .5;
    if (d >= minD) return;

    if (d < .001) { dx = -aby; dy = abx; d = len(dx,dy); }
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * minD;
    ball.y = cy + ny * minD;

    const vn = ball.vx*nx + ball.vy*ny;
    if (vn < 0) {
      ball.vx -= (1 + seg.rest) * vn * nx;
      ball.vy -= (1 + seg.rest) * vn * ny;
      // Slight tangent damping keeps it from jittering forever.
      const tx = -ny, ty = nx;
      const vt = ball.vx*tx + ball.vy*ty;
      ball.vx -= vt * tx * .012;
      ball.vy -= vt * ty * .012;
      if (Math.abs(vn) > 120) {
        seg.flash = 1;
        if (Math.random() < .24) wallSpark(cx,cy,seg.color);
      }
    }
  }

  function collideBumper(b, dt){
    const dx = ball.x - b.x, dy = ball.y - b.y;
    const d = len(dx,dy);
    const minD = ball.r + b.r;
    if (d >= minD) return;
    const nx = d > .001 ? dx/d : 0;
    const ny = d > .001 ? dy/d : -1;
    ball.x = b.x + nx * minD;
    ball.y = b.y + ny * minD;
    const vn = ball.vx*nx + ball.vy*ny;
    if (vn < 0) {
      const rest = b.kind === "bumper" ? 1.26 : b.rest || .9;
      ball.vx -= (1 + rest) * vn * nx;
      ball.vy -= (1 + rest) * vn * ny;
    }
    if (b.kind === "bumper" && b.hitCooldown <= 0) {
      const power = b.power * (1 + Math.min(.35, run.level*.015));
      ball.vx += nx * power * dt * 8.5;
      ball.vy += ny * power * dt * 8.5;
      b.flash = 1;
      b.hitCooldown = .11;
      const points = Math.round(b.score * run.stats.bumperValue);
      score(points, b.x, b.y, b.color, "BUMPER");
      addBurst(b.x,b.y,26,b.color,1.25);
      shockRings.push({x:b.x,y:b.y,r:b.r,max:b.r+38,life:.32,color:b.color});
      shake = Math.max(shake, .10);
      tone("bumper");
      maybeOpenPortal();
    }
  }

  function collideFlipper(f, dt){
    const ex = f.px + Math.cos(f.angle) * f.length;
    const ey = f.py + Math.sin(f.angle) * f.length;
    const capsule = {x1:f.px, y1:f.py, x2:ex, y2:ey, rest:.86, thick:f.radius*2, color:f.glow>.2?"#ffd166":"#ff2f8d"};

    const beforeVX = ball.vx, beforeVY = ball.vy;
    collideBallSegment(capsule, dt);

    // Add active mechanical impulse only when the moving flipper actually touches the ball.
    const touched = Math.abs(beforeVX - ball.vx) + Math.abs(beforeVY - ball.vy) > 18;
    if (touched) {
      const active = f.side === "left" ? input.left : input.right;
      if (active) {
        const centerSign = f.side === "left" ? 1 : -1;
        const strength = 350 * run.stats.flipperPower * clamp(Math.abs(f.angularVelocity) / 9, .55, 1.35);
        ball.vx += centerSign * strength * .52;
        ball.vy -= strength * .92;
        f.glow = 1;
        shake = Math.max(shake, .075);
        addBurst(ball.x, ball.y, 12, "#ffd166", .9);
        if (run.stats.slowmo > 0 && Math.abs(ball.y - f.py) < 44) slow = Math.max(slow, .08);
      }
    }
  }

  function collideTargets(){
    for (const tg of targets) {
      if (tg.dead) continue;
      const d = dist(ball.x, ball.y, tg.x, tg.y);
      if (d > ball.r + tg.r) continue;
      const nx = (ball.x - tg.x) / Math.max(d, .001);
      const ny = (ball.y - tg.y) / Math.max(d, .001);
      ball.x = tg.x + nx * (ball.r + tg.r);
      ball.y = tg.y + ny * (ball.r + tg.r);
      const vn = ball.vx*nx + ball.vy*ny;
      if (vn < 0) {
        ball.vx -= 1.75 * vn * nx;
        ball.vy -= 1.75 * vn * ny;
      }
      tg.dead = true;
      tg.flash = 1;
      score(Math.round(130 * run.stats.targetValue), tg.x, tg.y, tg.color, "TARGET");
      addBurst(tg.x,tg.y,22,tg.color,1.2);
      tone("target");
      shake = Math.max(shake, .08);
      maybeOpenPortal();
    }
  }

  function collideGates(dt){
    for (const g of gates) {
      if (g.cooldown > 0) continue;
      const insideX = Math.abs(ball.x - g.x) < g.w * .5;
      const insideY = Math.abs(ball.y - g.y) < g.h * .9 + ball.r;
      if (!insideX || !insideY) continue;
      g.cooldown = .8;
      run.multiplier = Math.min(9, run.multiplier + 1);
      run.jackpot += 1;
      const pts = 160 * run.multiplier;
      score(pts, g.x, g.y, g.color, "x" + run.multiplier);
      addBurst(g.x, g.y, 34, g.color, 1.3);
      shockRings.push({x:g.x,y:g.y,r:10,max:72,life:.42,color:g.color});
      tone(run.jackpot % 3 === 0 ? "jackpot" : "target");
      if (run.jackpot % 3 === 0) {
        score(550 * run.multiplier, g.x, g.y - 22, "#ffd166", "JACKPOT");
        flash = Math.max(flash,.18);
      }
      maybeOpenPortal();
    }
  }

  function updateStars(dt){
    for (const s of stars) {
      if (s.taken) continue;
      s.phase += dt * 5;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(.03, dt);
      s.vy *= Math.pow(.03, dt);
      if (dist(ball.x, ball.y, s.x, s.y) < ball.r + s.r + 2) {
        s.taken = true;
        score(35, s.x, s.y, "#ffd166", "+STAR");
        meta.totalStars += 1;
        addBurst(s.x,s.y,9,"#ffd166",.8);
        tone("coin");
      }
    }
  }

  function collidePortal(){
    if (!run.portalOpen) return;
    const x = board.portalX, y = board.portalY;
    const pr = 28 + Math.sin(time*8)*2;
    if (dist(ball.x, ball.y, x, y) < ball.r + pr) {
      completeLevel();
    }
  }

  function drainBall(){
    if (graceTimer > 0 || (run.stats.ballSaver > 0 && !ball.saved)) {
      ball.saved = true;
      graceTimer = 1.6;
      ball.x = W/2;
      ball.y = H-104;
      ball.vx = rand(-100,100);
      ball.vy = -640;
      addText(W/2, H-170, "BALL SAVER!", "#52fff3", 22, .95);
      addBurst(W/2, H-116, 36, "#52fff3", 1.1);
      tone("level");
      return;
    }
    run.balls--;
    tone("drain");
    shake = .28;
    flash = .15;
    if (run.balls <= 0) {
      endRun();
    } else {
      resetBall(true);
      addText(W/2, 332, "BALL LOST", "#ff2f8d", 26, 1.1);
    }
  }

  function completeLevel(){
    run.portalOpen = false;
    const bonus = Math.round(600 * run.level * run.stats.portalBonus + run.balls * 250);
    score(bonus, board.portalX, board.portalY, "#ffd166", "LEVEL BONUS");
    addBurst(board.portalX, board.portalY, 82, "#52fff3", 1.6);
    addBurst(board.portalX, board.portalY, 42, "#ffd166", 1.4);
    shockRings.push({x:board.portalX,y:board.portalY,r:12,max:150,life:.75,color:"#52fff3"});
    flash = .35;
    shake = .38;
    tone("level");
    generateUpgrades();
    state = "upgrade";
    input.left = false; input.right = false;
    meta.bestScore = Math.max(meta.bestScore, run.score);
    meta.bestLevel = Math.max(meta.bestLevel, run.level + 1);
    save();
  }

  function endRun(){
    meta.bestScore = Math.max(meta.bestScore, run.score);
    meta.bestLevel = Math.max(meta.bestLevel, run.level);
    save();
    state = "gameover";
    input.left = false; input.right = false;
    addBurst(ball.x, ball.y, 60, "#ff2f8d", 1.4);
  }

  function score(base, x, y, color, label){
    const comboBonus = Math.min(3.0, 1 + run.combo * .05);
    const points = Math.round(base * run.multiplier * comboBonus);
    run.score += points;
    run.levelScore += points;
    run.combo++;
    comboTimer = 1.65;
    const text = label ? `${label} +${points}` : `+${points}`;
    addText(x, y - 18, text, color, label === "JACKPOT" ? 22 : 13, label === "JACKPOT" ? .85 : .55);
    if (run.combo > 5 && run.combo % 6 === 0) {
      addText(W/2, 92, `${run.combo} COMBO`, "#ffd166", 18, .65);
      addBurst(x,y,18,"#ffd166",1.0);
    }
  }

  function maybeOpenPortal(){
    if (run.portalOpen) return;
    if (run.levelScore >= run.goal) {
      run.portalOpen = true;
      addText(board.portalX, board.portalY + 50, "PORTAL OPEN", "#52fff3", 22, 1.0);
      addBurst(board.portalX, board.portalY, 52, "#52fff3", 1.3);
      shockRings.push({x:board.portalX,y:board.portalY,r:14,max:112,life:.55,color:"#52fff3"});
      tone("jackpot");
      flash = Math.max(flash,.12);
    }
  }

  function generateUpgrades(){
    const pool = [
      {name:"Power Flippers", icon:"↗", desc:"Stronger shots from both flippers", apply:()=>run.stats.flipperPower += .18},
      {name:"Bumper Fever", icon:"✦", desc:"Bumpers score 35% more", apply:()=>run.stats.bumperValue += .35},
      {name:"Ball Saver", icon:"♥", desc:"First drain each round is rescued", apply:()=>run.stats.ballSaver += 1},
      {name:"Star Magnet", icon:"◉", desc:"Stars drift toward the ball", apply:()=>run.stats.magnet += 26},
      {name:"Portal Bonus", icon:"⌁", desc:"Bigger level-complete bonus", apply:()=>run.stats.portalBonus += .35},
      {name:"Target Hunter", icon:"◆", desc:"Targets score 45% more", apply:()=>run.stats.targetValue += .45},
      {name:"Slow-Mo Skill", icon:"◷", desc:"Tiny hit-stop on strong flipper shots", apply:()=>run.stats.slowmo += 1},
      {name:"Extra Ball", icon:"●", desc:"Gain one more ball right now", apply:()=>run.balls += 1},
      {name:"Multiplier Grip", icon:"×", desc:"Start future rounds with more multiplier", apply:()=>run.stats.multGain += .25}
    ];
    upgrades = [];
    const used = new Set();
    while (upgrades.length < 3) {
      const i = irand(0, pool.length - 1);
      if (used.has(i)) continue;
      used.add(i);
      upgrades.push(pool[i]);
    }
  }

  // ============================================================
  // FX.
  // ============================================================

  function updateFx(dt){
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(.025, dt);
      p.vy *= Math.pow(.025, dt);
      p.vy += (p.g || 0) * dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const tx of texts) {
      tx.life -= dt;
      tx.x += tx.vx * dt;
      tx.y += tx.vy * dt;
    }
    texts = texts.filter(tx => tx.life > 0);

    for (const r of shockRings) {
      r.life -= dt;
      r.r = lerp(r.r, r.max, 1 - Math.exp(-10*dt));
    }
    shockRings = shockRings.filter(r => r.life > 0);
  }

  function addBurst(x,y,n,color,scale=1){
    for (let i=0;i<n;i++){
      const a = Math.random()*TAU;
      const sp = rand(60,260) * scale;
      particles.push({
        x,y,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        r:rand(1.2,4.2)*scale,
        life:rand(.22,.74),
        maxLife:.74,
        color,
        g:rand(10,90)
      });
    }
  }

  function wallSpark(x,y,color){
    for (let i=0;i<6;i++){
      particles.push({x:x+rand(-2,2),y:y+rand(-2,2),vx:rand(-85,85),vy:rand(-85,45),r:rand(1,2.5),life:rand(.12,.28),maxLife:.28,color,g:80});
    }
  }

  function addText(x,y,text,color,size,life){
    texts.push({x,y,text,color,size,life,maxLife:life,vx:rand(-10,10),vy:-42});
  }

  // ============================================================
  // Rendering.
  // ============================================================

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#03040a";
    ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);

    let sx = 0, sy = 0;
    if (shake > 0) { sx = rand(-1,1) * shake * 13; sy = rand(-1,1) * shake * 13; }

    ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(ox+sx),dpr*(oy+sy));
    drawBackdrop();

    if (state === "menu") drawMenu();
    if (state === "play") drawPlay();
    if (state === "upgrade") drawUpgrade();
    if (state === "gameover") drawGameOver();

    drawFrame();
    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = flash * .42;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }

  function drawBackdrop(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#181a3a");
    g.addColorStop(.52,"#0b0d21");
    g.addColorStop(1,"#05060e");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // Animated dark wave texture.
    ctx.save();
    ctx.globalAlpha = .14;
    ctx.strokeStyle = "#2c345c";
    ctx.lineWidth = 1;
    for (let y=-20;y<H+20;y+=15){
      ctx.beginPath();
      for (let x=-10;x<W+10;x+=8){
        const yy = y + Math.sin(x*.08 + time*1.1 + y*.025)*3.2;
        if (x === -10) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    ctx.restore();

    // Soft neon orbs.
    for (let i=0;i<18;i++){
      const x = (i*83 + Math.sin(time*.25+i)*30) % W;
      const y = (i*61 + time*8) % H;
      ctx.save();
      ctx.globalAlpha = .035 + (i%4)*.015;
      ctx.fillStyle = i%2 ? "#52fff3" : "#ff2f8d";
      ctx.beginPath(); ctx.arc(x,y, 18+(i%3)*11, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawPlay(){
    drawBoard();
    drawPortal();
    drawGates();
    drawTargets();
    drawStars();
    drawBumpers();
    drawFlipperAim();
    drawFlippers();
    drawBall();
    drawFx();
    drawHUD();
    drawControls();
  }

  function drawBoard(){
    ctx.save();
    // Board glass.
    roundedRect(18,78,W-36,604,30);
    const glass = ctx.createLinearGradient(0,80,0,682);
    glass.addColorStop(0,"rgba(36,42,83,.72)");
    glass.addColorStop(1,"rgba(8,10,25,.88)");
    ctx.fillStyle = glass;
    ctx.fill();
    ctx.strokeStyle = "rgba(82,255,243,.22)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Fine grid inside playfield.
    ctx.save();
    roundedRect(28,92,W-56,574,24);
    ctx.clip();
    ctx.globalAlpha = .12;
    ctx.strokeStyle = "#52fff3";
    ctx.lineWidth = 1;
    for (let x=38;x<W-28;x+=28){ ctx.beginPath(); ctx.moveTo(x,96); ctx.lineTo(x,664); ctx.stroke(); }
    for (let y=104;y<664;y+=28){ ctx.beginPath(); ctx.moveTo(28,y); ctx.lineTo(W-28,y); ctx.stroke(); }
    ctx.globalAlpha = .06;
    ctx.fillStyle = "#ffffff";
    for (let y=104;y<664;y+=56) ctx.fillRect(28,y,W-56,18);
    ctx.restore();

    // Draw collision rails.
    for (const w of walls) {
      drawNeonSegment(w.x1,w.y1,w.x2,w.y2,w.thick,w.flash>0?"#ffffff":w.color,w.flash);
    }
    ctx.restore();
  }

  function drawNeonSegment(x1,y1,x2,y2,thick,color,flash=0){
    ctx.save();
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = 12 + flash*16;
    ctx.lineWidth = thick + 5;
    ctx.strokeStyle = colorAlpha(color,.32 + flash*.28);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.shadowBlur = 4 + flash*8;
    ctx.lineWidth = thick;
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.lineWidth = Math.max(1,thick*.28);
    ctx.strokeStyle = "rgba(255,255,255,.78)";
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }

  function drawPortal(){
    const open = run && run.portalOpen;
    const x = board.portalX, y = board.portalY;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(time * (open ? 2.4 : .8));
    const r = open ? 30 + Math.sin(time*8)*3 : 18 + Math.sin(time*4)*1.5;
    ctx.globalAlpha = open ? 1 : .28;
    ctx.shadowColor = open ? "#52fff3" : "#647089";
    ctx.shadowBlur = open ? 28 : 8;
    const rg = ctx.createRadialGradient(0,0,1,0,0,r);
    rg.addColorStop(0,open?"#ffffff":"#7b8194");
    rg.addColorStop(.34,open?"#52fff3":"#34394e");
    rg.addColorStop(1,"rgba(82,255,243,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    ctx.lineWidth = open ? 4 : 2;
    ctx.strokeStyle = open ? "#ffffff" : "rgba(255,255,255,.26)";
    ctx.beginPath(); ctx.arc(0,0,r+5,0,TAU*.78); ctx.stroke();
    ctx.rotate(-time*3.7);
    ctx.strokeStyle = open ? "#ffd166" : "rgba(255,255,255,.18)";
    ctx.beginPath(); ctx.arc(0,0,r+13,TAU*.12,TAU*.52); ctx.stroke();
    ctx.restore();

    if (!open) {
      ctx.save();
      ctx.textAlign="center";
      ctx.font="800 10px Inter,system-ui,sans-serif";
      ctx.fillStyle="rgba(255,255,255,.45)";
      ctx.fillText("LOCKED", x, y+44);
      ctx.restore();
    }
  }

  function drawGates(){
    for (const g of gates) {
      const pulse = (Math.sin(time*5+g.phase)+1)*.5;
      ctx.save();
      ctx.translate(g.x,g.y);
      ctx.shadowColor = g.color;
      ctx.shadowBlur = 12 + pulse*8;
      roundedRect(-g.w/2,-g.h/2,g.w,g.h,8);
      ctx.fillStyle = colorAlpha(g.color,.14 + pulse*.08);
      ctx.fill();
      ctx.strokeStyle = g.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "900 8px Inter,system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.82)";
      ctx.fillText(g.label,0,3);
      ctx.restore();
    }
  }

  function drawBumpers(){
    for (const b of bumpers) {
      ctx.save();
      ctx.translate(b.x,b.y);
      const pulse = (Math.sin(time*5+b.phase)+1)*.5;
      const rr = b.r + (b.kind === "bumper" ? pulse*1.5 + b.flash*5 : b.flash*2);
      ctx.shadowColor = b.color;
      ctx.shadowBlur = b.kind === "bumper" ? 18 + b.flash*22 : 10;
      const grad = ctx.createRadialGradient(-rr*.25,-rr*.35,2,0,0,rr);
      grad.addColorStop(0,"#ffffff");
      grad.addColorStop(.22,b.color);
      grad.addColorStop(1, b.kind === "bumper" ? "#172044" : "#202032");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,.62)";
      ctx.stroke();
      if (b.kind === "bumper") {
        ctx.globalAlpha = .55;
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = b.color;
        ctx.beginPath(); ctx.arc(0,0,rr+7+Math.sin(time*7+b.phase)*2,0,TAU); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawTargets(){
    for (const tg of targets) {
      if (tg.dead) continue;
      const pulse = (Math.sin(time*6+tg.phase)+1)*.5;
      ctx.save();
      ctx.translate(tg.x,tg.y);
      ctx.rotate(time*1.4 + tg.phase);
      ctx.shadowColor = tg.color;
      ctx.shadowBlur = 12 + pulse*8;
      ctx.fillStyle = tg.color;
      ctx.beginPath();
      for (let i=0;i<6;i++){
        const a = i*TAU/6;
        const r = i%2===0 ? tg.r+4 : tg.r*.72;
        const x = Math.cos(a)*r, y = Math.sin(a)*r;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(-2,-2,2.4,0,TAU); ctx.fill();
      ctx.restore();
    }
  }

  function drawStars(){
    for (const s of stars) {
      if (s.taken) continue;
      ctx.save();
      ctx.translate(s.x, s.y + Math.sin(time*5+s.phase)*1.7);
      ctx.rotate(time*1.8+s.phase);
      ctx.shadowColor = "#ffd166";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      for (let i=0;i<10;i++){
        const a = -Math.PI/2 + i*TAU/10;
        const r = i%2===0 ? s.r+2 : s.r*.55;
        const x = Math.cos(a)*r, y = Math.sin(a)*r;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawFlippers(){
    drawOneFlipper(leftFlipper, input.left);
    drawOneFlipper(rightFlipper, input.right);
  }

  function drawOneFlipper(f, active){
    const ex = f.px + Math.cos(f.angle) * f.length;
    const ey = f.py + Math.sin(f.angle) * f.length;
    const color = active ? "#ffd166" : "#ff2f8d";
    ctx.save();
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = 14 + f.glow*14;
    ctx.lineWidth = 20;
    ctx.strokeStyle = colorAlpha(color, .22 + f.glow*.18);
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.lineWidth = 12;
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.fillStyle = "#52fff3";
    ctx.shadowColor = "#52fff3";
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(f.px,f.py,6,0,TAU); ctx.fill();
    ctx.restore();
  }

  function drawFlipperAim(){
    // Visual aim assist: not automation. It simply tells the player the rough outgoing shot lane
    // when a flipper is held. This makes mobile pinball feel less random.
    if (input.left) drawAimRay(leftFlipper, "left");
    if (input.right) drawAimRay(rightFlipper, "right");
  }

  function drawAimRay(f, side){
    const ex = f.px + Math.cos(f.angle) * f.length;
    const ey = f.py + Math.sin(f.angle) * f.length;
    const angle = side === "left" ? -62*DEG : -118*DEG;
    ctx.save();
    ctx.globalAlpha = .72;
    ctx.setLineDash([7,7]);
    ctx.lineCap = "round";
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffd166";
    ctx.shadowColor = "#ffd166";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex + Math.cos(angle)*132, ey + Math.sin(angle)*132);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawBall(){
    if (!ball) return;
    for (let i=0;i<ball.trail.length;i++){
      const tr = ball.trail[i];
      const a = clamp(tr.life/.34,0,1);
      ctx.save();
      ctx.globalAlpha = a*.28;
      ctx.fillStyle = i%2 ? "#52fff3" : "#ffffff";
      ctx.beginPath(); ctx.arc(tr.x,tr.y,ball.r*(.45+i/ball.trail.length*.24),0,TAU); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(ball.x,ball.y);
    ctx.rotate(time*5 + ball.spin);
    ctx.shadowColor = "#52fff3";
    ctx.shadowBlur = 22 + ball.glow*12;
    const g = ctx.createRadialGradient(-4,-5,1,0,0,ball.r+2);
    g.addColorStop(0,"#ffffff");
    g.addColorStop(.23,"#bffeff");
    g.addColorStop(.62,"#52fff3");
    g.addColorStop(1,"#1960ff");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,ball.r,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,0,ball.r+1,0,TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(8,15,32,.35)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,ball.r*.62,0,TAU*.78); ctx.stroke();
    ctx.restore();
  }

  function drawFx(){
    for (const r of shockRings) {
      ctx.save();
      ctx.globalAlpha = clamp(r.life/.7,0,1);
      ctx.shadowColor = r.color;
      ctx.shadowBlur = 12;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke();
      ctx.restore();
    }

    for (const p of particles) {
      const a = clamp(p.life/(p.maxLife || .74),0,1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a,0,TAU); ctx.fill();
      ctx.restore();
    }

    for (const tx of texts) {
      const a = clamp(tx.life/tx.maxLife,0,1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `1000 ${tx.size}px Inter,system-ui,sans-serif`;
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(0,0,0,.56)";
      ctx.strokeText(tx.text, tx.x, tx.y);
      ctx.shadowColor = tx.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = tx.color;
      ctx.fillText(tx.text, tx.x, tx.y);
      ctx.restore();
    }
  }

  function drawHUD(){
    ctx.save();
    roundedRect(15,14,W-30,64,19);
    ctx.fillStyle = "rgba(5,7,18,.78)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.font = "1000 18px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("PINBALL RUSH", 29, 39);
    ctx.font = "800 11px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#9eb0d9";
    ctx.fillText("ROUND " + run.level + "   BALLS " + run.balls, 29, 60);

    ctx.textAlign = "right";
    ctx.font = "1000 18px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffd166";
    ctx.fillText(String(run.score), W-29, 39);
    ctx.font = "900 11px Inter,system-ui,sans-serif";
    ctx.fillStyle = run.portalOpen ? "#52fff3" : "#9eb0d9";
    ctx.fillText(run.portalOpen ? "PORTAL OPEN" : `${Math.min(run.levelScore,run.goal)} / ${run.goal}`, W-29, 60);

    // Progress bar.
    const px = 29, py = 83, pw = W-58, ph = 7;
    roundedRect(px,py,pw,ph,5); ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill();
    roundedRect(px,py,pw*clamp(run.levelScore/run.goal,0,1),ph,5);
    const pg = ctx.createLinearGradient(px,py,px+pw,py);
    pg.addColorStop(0,"#52fff3"); pg.addColorStop(.58,"#ffd166"); pg.addColorStop(1,"#ff2f8d");
    ctx.fillStyle = pg; ctx.fill();

    if (run.combo > 1 && comboTimer > 0) {
      ctx.textAlign = "center";
      ctx.font = "1000 13px Inter,system-ui,sans-serif";
      ctx.fillStyle = "#ffd166";
      ctx.fillText(`COMBO ${run.combo}   x${run.multiplier}`, W/2, 111);
    }

    if (!input.launched && messageTimer > 0) {
      drawCenterToast("TAP TO LAUNCH", "Then hold left / right to flip", "#52fff3");
    } else if (messageTimer > 0) {
      drawCenterToast("LEFT SIDE = LEFT FLIPPER", "RIGHT SIDE = RIGHT FLIPPER", "#ffd166");
    }
    ctx.restore();
  }

  function drawCenterToast(title, sub, color){
    ctx.save();
    ctx.textAlign = "center";
    roundedRect(56, 292, W-112, 68, 22);
    ctx.fillStyle = "rgba(5,7,18,.72)";
    ctx.fill();
    ctx.strokeStyle = colorAlpha(color,.45);
    ctx.stroke();
    ctx.font = "1000 18px Inter,system-ui,sans-serif";
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillText(title, W/2, 318);
    ctx.shadowBlur = 0;
    ctx.font = "800 11px Inter,system-ui,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.76)";
    ctx.fillText(sub, W/2, 340);
    ctx.restore();
  }

  function drawControls(){
    ctx.save();
    ctx.globalAlpha = .18 + (input.left ? .13 : 0);
    ctx.fillStyle = "#52fff3";
    ctx.beginPath(); ctx.arc(70, H-56, 42, 0, TAU); ctx.fill();
    ctx.globalAlpha = .18 + (input.right ? .13 : 0);
    ctx.fillStyle = "#ff2f8d";
    ctx.beginPath(); ctx.arc(W-70, H-56, 42, 0, TAU); ctx.fill();
    ctx.globalAlpha = .76;
    ctx.font = "1000 11px Inter,system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.72)";
    ctx.fillText("LEFT", 70, H-52);
    ctx.fillText("RIGHT", W-70, H-52);
    ctx.restore();
  }

  function drawMenu(){
    ctx.save();
    ctx.textAlign = "center";

    // Logo ball and pinball table shape.
    ctx.save();
    ctx.translate(W/2, 158);
    for (let i=0;i<4;i++){
      ctx.rotate(time*.18+i*.7);
      ctx.globalAlpha = .22;
      ctx.strokeStyle = i%2 ? "#ff2f8d" : "#52fff3";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0,0,104-i*16, 39+i*5, 0, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = "#52fff3";
    ctx.shadowBlur = 30;
    const g = ctx.createRadialGradient(-10,-12,3,0,0,42);
    g.addColorStop(0,"#ffffff"); g.addColorStop(.3,"#52fff3"); g.addColorStop(1,"#245eff");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,42+Math.sin(time*4)*2,0,TAU); ctx.fill();
    ctx.restore();

    ctx.font = "1000 34px Inter,system-ui,sans-serif";
    ctx.shadowColor = "#52fff3"; ctx.shadowBlur = 18; ctx.fillStyle = "#ffffff";
    ctx.fillText("NEON", W/2, 246);
    ctx.shadowColor = "#ff2f8d";
    ctx.fillText("PINBALL RUSH", W/2, 286);
    ctx.shadowBlur = 0;

    ctx.font = "800 14px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#9eb0d9";
    wrapText("Mobile-first pinball roguelite. Hit targets, open the portal, choose upgrades, chase the jackpot.", W/2, 318, 302, 20);

    const bx = 42, by = 408, bw = W-84, bh = 76;
    ctx.save();
    ctx.shadowColor = "#52fff3"; ctx.shadowBlur = 26;
    roundedRect(bx,by,bw,bh,26);
    const bg = ctx.createLinearGradient(bx,by,bx+bw,by+bh);
    bg.addColorStop(0,"#52fff3"); bg.addColorStop(1,"#ff2f8d");
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.65)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = "#07101f";
    ctx.font = "1000 23px Inter,system-ui,sans-serif";
    ctx.fillText("PLAY PROTOTYPE", W/2, by+34);
    ctx.font = "800 12px Inter,system-ui,sans-serif";
    ctx.fillText("tap left / right side to control flippers", W/2, by+56);
    ctx.restore();

    roundedRect(48, 514, W-96, 82, 22);
    ctx.fillStyle = "rgba(5,7,18,.68)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.stroke();
    ctx.font = "900 13px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("BEST SCORE  " + meta.bestScore, W/2, 546);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("BEST ROUND  " + meta.bestLevel + "     STARS  " + meta.totalStars, W/2, 574);

    ctx.font = "800 11px Inter,system-ui,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.52)";
    ctx.fillText("Keyboard: A/D or arrows. Touch: left/right screen halves.", W/2, 652);
    ctx.restore();
  }

  function drawUpgrade(){
    // Still draw a frozen board underneath the upgrade cards.
    drawBoard(); drawPortal(); drawGates(); drawTargets(); drawStars(); drawBumpers(); drawBall(); drawFx();

    ctx.save();
    roundedRect(18, 44, W-36, 610, 30);
    ctx.fillStyle = "rgba(5,7,18,.90)";
    ctx.fill();
    ctx.strokeStyle = "rgba(82,255,243,.30)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.font = "1000 28px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#52fff3";
    ctx.shadowBlur = 16;
    ctx.fillText("ROUND CLEARED", W/2, 104);
    ctx.shadowBlur = 0;
    ctx.font = "900 13px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffd166";
    ctx.fillText(`Score ${run.score}   Balls ${run.balls}`, W/2, 132);
    ctx.fillStyle = "#9eb0d9";
    ctx.fillText("Choose one upgrade", W/2, 162);

    buttons = [];
    for (let i=0;i<upgrades.length;i++){
      const u = upgrades[i];
      const r = {x:34, y:218+i*104, w:W-68, h:82, apply:u.apply};
      buttons.push(r);
      ctx.save();
      const pulse = 1 + Math.sin(time*4+i)*.008;
      ctx.translate(W/2, r.y+r.h/2);
      ctx.scale(pulse,pulse);
      roundedRect(-r.w/2,-r.h/2,r.w,r.h,24);
      const cg = ctx.createLinearGradient(-r.w/2,-r.h/2,r.w/2,r.h/2);
      cg.addColorStop(0,"rgba(82,255,243,.17)");
      cg.addColorStop(.58,"rgba(157,98,255,.12)");
      cg.addColorStop(1,"rgba(255,47,141,.17)");
      ctx.fillStyle = cg; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = "1000 30px Inter,system-ui,sans-serif";
      ctx.fillStyle = "#ffd166";
      ctx.textAlign = "center";
      ctx.fillText(u.icon, -126, 10);
      ctx.textAlign = "left";
      ctx.font = "1000 16px Inter,system-ui,sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(u.name, -90, -9);
      ctx.font = "800 12px Inter,system-ui,sans-serif";
      ctx.fillStyle = "#9eb0d9";
      ctx.fillText(u.desc, -90, 17);
      ctx.restore();
    }

    ctx.textAlign = "center";
    ctx.font = "800 12px Inter,system-ui,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.58)";
    ctx.fillText("Next board keeps the same simple controls, but adds more chaos.", W/2, 606);
    ctx.restore();
  }

  function drawGameOver(){
    drawBoard(); drawFx();
    ctx.save();
    roundedRect(30, 126, W-60, 400, 30);
    ctx.fillStyle = "rgba(5,7,18,.91)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,47,141,.4)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.font = "1000 32px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ff2f8d";
    ctx.shadowColor = "#ff2f8d"; ctx.shadowBlur = 18;
    ctx.fillText("BALLS LOST", W/2, 188);
    ctx.shadowBlur = 0;
    ctx.font = "1000 18px Inter,system-ui,sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("Score: " + run.score, W/2, 242);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("Reached Round " + run.level, W/2, 273);
    ctx.fillStyle = "#9eb0d9";
    ctx.font = "800 13px Inter,system-ui,sans-serif";
    ctx.fillText("Best: " + meta.bestScore + "   Best Round: " + meta.bestLevel, W/2, 304);

    const bx = 62, by = 372, bw = W-124, bh = 70;
    ctx.save();
    ctx.shadowColor = "#52fff3"; ctx.shadowBlur = 18;
    roundedRect(bx,by,bw,bh,24);
    const bg = ctx.createLinearGradient(bx,by,bx+bw,by+bh);
    bg.addColorStop(0,"#52fff3"); bg.addColorStop(1,"#ff2f8d");
    ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = "#07101f";
    ctx.font = "1000 21px Inter,system-ui,sans-serif";
    ctx.fillText("PLAY AGAIN", W/2, by+42);
    ctx.restore();

    ctx.font = "800 11px Inter,system-ui,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.58)";
    ctx.fillText("Tap anywhere", W/2, 484);
    ctx.restore();
  }

  function drawFrame(){
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.08)";
    ctx.lineWidth = 2;
    roundedRect(7,7,W-14,H-14,28);
    ctx.stroke();
    ctx.restore();
  }

  function roundedRect(x,y,w,h,r){
    r = Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function wrapText(text,x,y,maxWidth,lineHeight){
    const words = text.split(" ");
    let line = "";
    for (const word of words) {
      const test = line + word + " ";
      if (ctx.measureText(test).width > maxWidth && line.length > 0) {
        ctx.fillText(line.trim(), x, y);
        line = word + " "; y += lineHeight;
      } else line = test;
    }
    ctx.fillText(line.trim(), x, y);
  }

  function colorAlpha(hex, alpha){
    if (!hex || hex[0] !== "#" || hex.length !== 7) return hex;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ============================================================
  // Main loop.
  // ============================================================

  function loop(now){
    let dt = Math.min(.033, (now - last) / 1000);
    last = now;
    if (slow > 0) dt *= .42;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
