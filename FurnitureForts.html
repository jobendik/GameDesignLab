<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Furniture Forts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        #timer {
            text-align: center; font-size: 40px; color: white; font-weight: bold; margin-top: 20px;
            text-shadow: 0 4px 0 #000;
        }
        .phase-text { font-size: 16px; color: #f1c40f; letter-spacing: 2px; text-transform: uppercase; }
        
        #toolbar {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; pointer-events: auto;
            transition: opacity 0.5s;
        }
        .spawn-btn {
            width: 60px; height: 60px; background: #fff; border: 4px solid #333; border-radius: 10px;
            cursor: grab; display: flex; justify-content: center; align-items: center; font-size: 24px;
            box-shadow: 0 5px 0 #000; transition: transform 0.1s;
        }
        .spawn-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #000; }
        
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 40px; text-align: center; color: white;
            border-radius: 20px; border: 4px solid white; display: none; pointer-events: auto;
        }
        button {
            padding: 10px 30px; font-size: 20px; cursor: pointer; background: #f1c40f; border: none; 
            font-weight: bold; margin-top: 20px; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="timer">
            <div class="phase-text" id="phase-label">BUILD PHASE</div>
            <span id="time-display">20</span>
        </div>
        <div id="toolbar">
            <div class="spawn-btn" onmousedown="spawnItem('box')" title="Crate">📦</div>
            <div class="spawn-btn" onmousedown="spawnItem('plank')" title="Plank">➖</div>
            <div class="spawn-btn" onmousedown="spawnItem('fridge')" title="Fridge">❄️</div>
            <div class="spawn-btn" onmousedown="spawnItem('wheel')" title="Wheel">⚫</div>
        </div>
    </div>

    <div id="game-over">
        <h1 id="go-title">TV DESTROYED</h1>
        <p>The living room has fallen.</p>
        <button onclick="restartGame()">Try Again</button>
    </div>

    <script>
        // Matter.js module aliases
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events,
              Body = Matter.Body;

        // Game State
        let engine, render, runner;
        let width, height;
        let tvBox;
        let gamePhase = 'BUILD'; // BUILD, SIEGE, END
        let timeLeft = 20;
        let timerInterval;
        let siegeInterval;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;

            // Create engine
            engine = Engine.create();
            engine.world.gravity.y = 1.2; // Heavy gravity for juice

            // Create renderer
            render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#2c3e50',
                    showAngleIndicator: false
                }
            });

            // Create ground
            const ground = Bodies.rectangle(width / 2, height - 20, width, 60, { 
                isStatic: true,
                render: { fillStyle: '#27ae60' }
            });
            const leftWall = Bodies.rectangle(-50, height/2, 100, height * 2, { isStatic: true });
            const rightWall = Bodies.rectangle(width + 50, height/2, 100, height * 2, { isStatic: true });

            // Create The Sacred TV (Objective)
            // Placed on a small platform so players must build AROUND/UNDER it or support it
            const podium = Bodies.rectangle(width / 2, height - 150, 200, 20, { 
                isStatic: true,
                render: { fillStyle: '#7f8c8d' } 
            });
            
            tvBox = Bodies.rectangle(width / 2, height - 200, 60, 50, {
                render: { fillStyle: '#f1c40f', strokeStyle: '#fff', lineWidth: 2 },
                density: 0.005,
                friction: 0.8
            });

            Composite.add(engine.world, [ground, leftWall, rightWall, podium, tvBox]);

            // Mouse Control (Draggable)
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: false }
                }
            });
            Composite.add(engine.world, mouseConstraint);
            render.mouse = mouse;

            // Start
            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            startBuildPhase();
            
            // Collision detection for Game Over
            Events.on(engine, 'collisionStart', (event) => {
                const pairs = event.pairs;
                for (let i = 0; i < pairs.length; i++) {
                    const bodyA = pairs[i].bodyA;
                    const bodyB = pairs[i].bodyB;
                    // If TV hits ground (the floor object)
                    if ((bodyA === tvBox && bodyB === ground) || (bodyB === tvBox && bodyA === ground)) {
                        triggerGameOver();
                    }
                }
            });
        }

        // --- GAME LOGIC ---

        function startBuildPhase() {
            gamePhase = 'BUILD';
            timeLeft = 20;
            document.getElementById('phase-label').innerText = "BUILD DEFENSES";
            document.getElementById('phase-label').style.color = "#f1c40f";
            document.getElementById('toolbar').style.opacity = '1';
            document.getElementById('toolbar').style.pointerEvents = 'auto';

            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').innerText = timeLeft;
                if (timeLeft <= 0) startSiegePhase();
            }, 1000);
        }

        function startSiegePhase() {
            gamePhase = 'SIEGE';
            timeLeft = 15;
            document.getElementById('phase-label').innerText = "SURVIVE THE SIEGE";
            document.getElementById('phase-label').style.color = "#e74c3c";
            // Hide build tools
            document.getElementById('toolbar').style.opacity = '0.3';
            document.getElementById('toolbar').style.pointerEvents = 'none';

            // Launch Projectiles
            let count = 0;
            siegeInterval = setInterval(() => {
                fireCannonball();
                count++;
            }, 800);

            // Timer for survival
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').innerText = timeLeft;
                if (timeLeft <= 0) victory();
            }, 1000);
        }

        function fireCannonball() {
            // Randomly pick left or right side
            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? -50 : width + 50;
            const startY = height - 100 - (Math.random() * 400); // Random height
            
            const ball = Bodies.circle(startX, startY, 20 + Math.random() * 20, {
                density: 0.05, // Heavy
                restitution: 0.8, // Bouncy
                render: { fillStyle: '#e74c3c' }
            });

            // Calculate force towards TV
            const dx = tvBox.position.x - startX;
            const dy = tvBox.position.y - startY;
            const forceMag = 0.04 + Math.random() * 0.02; // Power
            
            Body.applyForce(ball, ball.position, {
                x: (dx > 0 ? 1 : -1) * forceMag,
                y: (dy / Math.abs(dx)) * forceMag - 0.01 // Aim slightly up
            });

            Composite.add(engine.world, ball);

            // Cleanup ball after 5s
            setTimeout(() => {
                Composite.remove(engine.world, ball);
            }, 5000);
        }

        function spawnItem(type) {
            if (gamePhase !== 'BUILD') return;
            
            let body;
            const x = width / 2 + (Math.random() * 100 - 50);
            const y = 100;
            const color = '#ecf0f1';
            const border = '#bdc3c7';

            if (type === 'box') {
                body = Bodies.rectangle(x, y, 60, 60, { 
                    render: { fillStyle: '#e67e22', strokeStyle: '#d35400', lineWidth: 3 } 
                });
            } else if (type === 'plank') {
                body = Bodies.rectangle(x, y, 200, 20, { 
                    render: { fillStyle: '#8e44ad', strokeStyle: '#5e2d73', lineWidth: 3 } 
                });
            } else if (type === 'fridge') {
                body = Bodies.rectangle(x, y, 50, 100, { 
                    render: { fillStyle: '#3498db', strokeStyle: '#2980b9', lineWidth: 3 },
                    density: 0.02 // Heavier
                });
            } else if (type === 'wheel') {
                body = Bodies.circle(x, y, 40, { 
                    render: { fillStyle: '#95a5a6', strokeStyle: '#7f8c8d', lineWidth: 3 },
                    restitution: 0.9 
                });
            }

            if (body) {
                Composite.add(engine.world, body);
            }
        }

        function triggerGameOver() {
            if (gamePhase === 'END') return;
            gamePhase = 'END';
            clearInterval(timerInterval);
            clearInterval(siegeInterval);
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('go-title').innerText = "TV BROKEN";
            document.getElementById('go-title').style.color = "#e74c3c";
        }

        function victory() {
            if (gamePhase === 'END') return;
            gamePhase = 'END';
            clearInterval(timerInterval);
            clearInterval(siegeInterval);
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('go-title').innerText = "ROOM SECURE";
            document.getElementById('go-title').style.color = "#2ecc71";
            document.querySelector('#game-over p').innerText = "The TV survived the siege!";
        }

        function restartGame() {
            location.reload();
        }

        window.onload = init;
        window.onresize = () => location.reload();

    </script>
</body>
</html>
