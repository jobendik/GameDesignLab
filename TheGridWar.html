<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRID WAR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', Courier, monospace; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through */
        }
        
        .score-box {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            border: 2px solid #333;
            text-shadow: 0 0 10px currentColor;
        }

        #blue-score { color: #00f0ff; border-color: #00f0ff; }
        #red-score { color: #ff0055; border-color: #ff0055; }

        /* Splash Screen */
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }
        
        h1 { font-size: 4rem; margin-bottom: 0; text-transform: uppercase; letter-spacing: 5px; background: linear-gradient(90deg, #00f0ff, #ff0055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { margin-bottom: 40px; color: #aaa; }
        
        button {
            padding: 20px 50px;
            font-size: 24px;
            background: #00f0ff;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px #00f0ff;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        /* Live Counter Fake */
        #live-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="blue-score" class="score-box">YOU: 0%</div>
        <div id="red-score" class="score-box">THEM: 0%</div>
    </div>

    <div id="live-counter">🟢 1,420 Live Players (Simulated)</div>

    <div id="splash">
        <h1>GRID WAR</h1>
        <p>Click and drag to claim territory. Don't let them win.</p>
        <button id="start-btn">JOIN THE FIGHT</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    // --- SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const splash = document.getElementById('splash');
    const startBtn = document.getElementById('start-btn');
    
    // Audio Context (Synthesizer)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    let width, height;
    const cellSize = 20; // Size of the pixels
    let cols, rows;
    let grid = [];
    let particles = [];
    let isMouseDown = false;
    let gameRunning = false;
    let enemyInterval;
    
    // Colors
    const COLOR_EMPTY = '#1a1a1a';
    const COLOR_BLUE = '#00f0ff'; // Player
    const COLOR_RED = '#ff0055';  // Enemy (Bot)

    // --- INITIALIZATION ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        cols = Math.ceil(width / cellSize);
        rows = Math.ceil(height / cellSize);
        // Only init grid if it doesn't exist to prevent reset on mobile resize
        if(grid.length === 0) initGrid();
    }
    
    function initGrid() {
        grid = new Array(cols).fill(0).map(() => new Array(rows).fill(0));
        // 0 = empty, 1 = blue, 2 = red
    }

    window.addEventListener('resize', () => {
        // We don't want to wipe progress on simple resize events (common on mobile url bar scroll)
        // But we need to handle canvas dimension changes.
        // For this simple demo, we just update width/height variables. 
        // A full implementation would copy the grid to the new dimensions.
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // Re-calc cols/rows but don't reset array to keep game state mostly intact visually
        // New areas will be undefined/glitchy without a copy loop, but fine for a demo.
    });
    
    // Initial call
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cols = Math.ceil(width / cellSize);
    rows = Math.ceil(height / cellSize);
    initGrid();

    // --- INPUT ---
    startBtn.addEventListener('click', () => {
        splash.style.display = 'none';
        if (gameRunning) return;
        gameRunning = true;
        
        try {
            audioCtx = new AudioContext(); // Init audio on user gesture
        } catch(e) {
            console.log("Audio not supported or blocked");
        }
        
        loop();
        // Start Enemy AI loop
        enemyInterval = setInterval(enemyAI, 50); 
    });

    // Mouse Events
    window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        if (!gameRunning) return;
        paint(e.clientX, e.clientY, 1);
        playSound('kick');
    });
    
    window.addEventListener('mouseup', () => isMouseDown = false);
    
    window.addEventListener('mousemove', (e) => {
        if (!gameRunning || !isMouseDown) return;
        paint(e.clientX, e.clientY, 1);
    });

    // Touch Events (Mobile Support)
    window.addEventListener('touchstart', (e) => {
        isMouseDown = true;
        if (!gameRunning) return;
        const touch = e.touches[0];
        paint(touch.clientX, touch.clientY, 1);
        playSound('kick');
        // Prevent scrolling
        if(e.target === canvas) e.preventDefault(); 
    }, {passive: false});

    window.addEventListener('touchend', () => isMouseDown = false);

    window.addEventListener('touchmove', (e) => {
        if (!gameRunning || !isMouseDown) return;
        const touch = e.touches[0];
        paint(touch.clientX, touch.clientY, 1);
        // Prevent scrolling
        if(e.target === canvas) e.preventDefault();
    }, {passive: false});
    
    // --- GAME LOGIC ---
    function paint(x, y, type) {
        const col = Math.floor(x / cellSize);
        const row = Math.floor(y / cellSize);
        
        if (col >= 0 && col < cols && row >= 0 && row < rows) {
            // Safety check for resize edges
            if(!grid[col]) grid[col] = new Array(rows).fill(0);
            
            if (grid[col][row] !== type) {
                grid[col][row] = type;
                spawnParticles(x, y, type === 1 ? COLOR_BLUE : COLOR_RED);
                if(type === 1 && Math.random() > 0.8) playSound('pop');
            }
        }
    }

    // --- ENEMY AI (The "Viral" Simulation) ---
    function enemyAI() {
        if (!gameRunning) return;
        
        // The enemy grows aggressively from random red spots or edges
        for (let i = 0; i < 20; i++) { // Speed of enemy
            let rC = Math.floor(Math.random() * cols);
            let rR = Math.floor(Math.random() * rows);
            
            // Safety check
            if(!grid[rC]) continue;

            // AI Logic: If empty, small chance to take. If near Red, high chance to expand.
            let hasRedNeighbor = false;
            
            // Simple neighbor check
            if (rC > 0 && grid[rC-1] && grid[rC-1][rR] === 2) hasRedNeighbor = true;
            if (rC < cols-1 && grid[rC+1] && grid[rC+1][rR] === 2) hasRedNeighbor = true;
            if (rR > 0 && grid[rC][rR-1] === 2) hasRedNeighbor = true;
            if (rR < rows-1 && grid[rC][rR+1] === 2) hasRedNeighbor = true;

            // Random seeding or expansion
            if (hasRedNeighbor || Math.random() < 0.001) {
                grid[rC][rR] = 2;
                
                // Visual flare for AI
                if (Math.random() > 0.9) {
                    // spawnParticles(rC * cellSize, rR * cellSize, COLOR_RED); // Reduced particles for performance
                }
            }
        }
    }

    // --- VISUALS ---
    function spawnParticles(x, y, color) {
        // Limit particles
        if(particles.length > 100) return;

        for (let i = 0; i < 3; i++) {
            particles.push({
                x: x + cellSize/2,
                y: y + cellSize/2,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Clear background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, width, height);

        let blueCount = 0;
        let redCount = 0;
        let total = cols * rows;

        // Draw Grid
        for (let c = 0; c < cols; c++) {
            if(!grid[c]) continue; // Safety
            for (let r = 0; r < rows; r++) {
                const cellVal = grid[c][r];
                if (cellVal !== 0) {
                    ctx.fillStyle = cellVal === 1 ? COLOR_BLUE : COLOR_RED;
                    // Draw pixel slightly smaller for grid effect
                    ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
                    
                    if (cellVal === 1) blueCount++;
                    else redCount++;
                } else {
                    // Draw faint grid (optional, can be expensive on large screens)
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
                }
            }
        }

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        // Update Score
        // Simple protection against divide by zero
        total = total || 1; 
        document.getElementById('blue-score').innerText = `YOU: ${Math.floor((blueCount/total)*100)}%`;
        document.getElementById('red-score').innerText = `THEM: ${Math.floor((redCount/total)*100)}%`;
    }

    function loop() {
        if (!gameRunning) return;
        updateParticles();
        draw();
        requestAnimationFrame(loop);
    }

    // --- SOUND (Synthesis) ---
    function playSound(type) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'kick') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    }

</script>
</body>
</html>
