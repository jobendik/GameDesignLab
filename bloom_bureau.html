<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pip's Bloom Bureau</title>
<style>
  :root{
    --bg0:#1b0f2e; --bg1:#41205f; --cream:#fff6d8; --ink:#28102c;
    --gold:#ffd45c; --pink:#ff6fae; --mint:#5ff0b8; --sky:#63d7ff; --bad:#ff726f;
    --panel:rgba(255,247,219,.92); --panel2:rgba(67,31,90,.82);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#12091f;font-family:"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--cream);touch-action:none;user-select:none;}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#160b27;}
  #ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);}
  .top{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 8px);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;}
  .bank{background:linear-gradient(180deg,rgba(255,246,216,.98),rgba(255,211,117,.94));border:3px solid #7d3b4a;box-shadow:0 6px 0 rgba(42,12,43,.45),0 0 24px rgba(255,212,92,.18);border-radius:18px;padding:8px 12px;color:#391934;min-width:0;}
  .bank .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;opacity:.72;}
  .bank .money{font-size:28px;line-height:1;font-weight:1000;text-shadow:0 2px 0 rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bank .rate{font-size:12px;font-weight:900;opacity:.78;margin-top:3px;}
  .pillCol{display:flex;gap:6px;flex-direction:column;align-items:flex-end;}
  .pill{background:var(--panel2);border:2px solid rgba(255,246,216,.7);border-radius:999px;color:var(--cream);padding:7px 10px;font-size:12px;font-weight:1000;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  #goalPanel{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 86px);display:flex;gap:7px;pointer-events:none;}
  .goal{flex:1;min-width:0;background:rgba(47,21,66,.75);border:2px solid rgba(255,246,216,.55);border-radius:15px;padding:7px;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  .goal b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{height:7px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:5px;}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--mint),var(--gold),var(--pink));border-radius:99px;transition:width .25s ease;}
  #nextPanel{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 143px);background:rgba(255,246,216,.93);border:3px solid #7d3b4a;border-radius:19px;color:#351632;padding:8px 10px;box-shadow:0 6px 0 rgba(42,12,43,.38);}
  #nextPanel .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:1000;}
  #nextPanel .title{font-size:13px;color:#642044;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #nextPanel .cost{color:#a83f4e;}
  #shop{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 9px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;pointer-events:auto;}
  button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;}
  .buy{min-height:58px;border-radius:18px;padding:8px 7px;background:linear-gradient(180deg,#fff9db,#ffc95d);border:3px solid #7d3b4a;color:#351632;font-weight:1000;box-shadow:0 6px 0 #61263d,0 0 18px rgba(255,212,92,.12);position:relative;overflow:hidden;}
  .buy:active{transform:translateY(3px);box-shadow:0 3px 0 #61263d;}
  .buy[disabled]{filter:saturate(.45) brightness(.72);opacity:.83;cursor:default;}
  .buy .t{font-size:12px;line-height:1.05;display:block;}
  .buy .c{font-size:11px;line-height:1.1;display:block;margin-top:4px;color:#8f3145;}
  .buy.afford:after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.55),transparent 60%);animation:shine 1.45s linear infinite;}
  @keyframes shine{from{transform:translateX(-60%) rotate(10deg)}to{transform:translateX(60%) rotate(10deg)}}
  #sideButtons{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 177px);display:flex;flex-direction:column;gap:7px;pointer-events:auto;}
  .roundBtn{background:rgba(255,246,216,.94);color:#351632;border:3px solid #7d3b4a;border-radius:999px;min-width:52px;height:44px;padding:0 10px;font-size:12px;font-weight:1000;box-shadow:0 5px 0 rgba(42,12,43,.45);}
  .banner{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.9);background:linear-gradient(180deg,#fff9db,#ffd45c);color:#421538;border:4px solid #7d3b4a;border-radius:24px;padding:12px 18px;font-size:18px;font-weight:1000;text-align:center;box-shadow:0 9px 0 rgba(42,12,43,.45),0 0 40px rgba(255,212,92,.55);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:90vw;}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .modalWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(23,8,35,.58);backdrop-filter:blur(4px);z-index:20;padding:18px;}
  .modalWrap.hidden{display:none;}
  .modal{width:min(430px,94vw);background:linear-gradient(180deg,#fff9db,#ffe6a8);color:#351632;border:4px solid #7d3b4a;border-radius:28px;padding:18px;box-shadow:0 12px 0 rgba(42,12,43,.45),0 0 60px rgba(255,111,174,.22);text-align:center;}
  .modal h2{font-size:25px;line-height:1;margin-bottom:8px;}
  .modal p{font-size:14px;line-height:1.35;margin:8px 0;font-weight:800;color:#5c2a49;}
  .modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}
  .modalActions.one{grid-template-columns:1fr;}
  .modal button{min-height:48px;border-radius:16px;background:#ffcf5a;border:3px solid #7d3b4a;color:#351632;font-weight:1000;box-shadow:0 5px 0 #61263d;}
  .modal .secondary{background:#fff6d8;}
  .tapHint{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);background:rgba(255,246,216,.96);color:#351632;border:3px solid #7d3b4a;border-radius:999px;padding:10px 14px;font-size:15px;font-weight:1000;box-shadow:0 7px 0 rgba(42,12,43,.45);animation:bob 1s ease-in-out infinite;pointer-events:none;}
  .tapHint.hidden{display:none;}
  @keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
  @media (min-width:760px){
    #ui{max-width:520px;left:50%;transform:translateX(-50%);}
    #game{left:50%;transform:translateX(-50%);width:min(100vw,520px);}
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Pip's Bloom Bureau game canvas"></canvas>
<div id="ui">
  <div class="top">
    <div class="bank"><div class="label">Petals in Pip's pouch</div><div id="money" class="money">0</div><div id="rate" class="rate">0 / sec</div></div>
    <div class="pillCol"><div id="prestigePill" class="pill">🌟 0</div><div id="boostPill" class="pill">1×</div></div>
  </div>
  <div id="goalPanel"></div>
  <div id="sideButtons"><button id="boostBtn" class="roundBtn">2×</button><button id="prestigeBtn" class="roundBtn">Reset</button><button id="muteBtn" class="roundBtn">🔊</button></div>
  <div id="nextPanel"><div class="row"><span id="nextTitle" class="title">Next: hire a helper</span><span id="nextCost" class="cost">0</span></div><div class="bar"><i id="nextBar"></i></div></div>
  <div id="shop">
    <button id="buyZone" class="buy"><span class="t">Grow Plot</span><span class="c">0</span></button>
    <button id="buyWorker" class="buy"><span class="t">Hire Helper</span><span class="c">0</span></button>
    <button id="unlockZone" class="buy"><span class="t">New Garden</span><span class="c">0</span></button>
  </div>
  <div id="banner" class="banner"></div>
  <div id="tapHint" class="tapHint">Tap the glowing bloom!</div>
</div>
<div id="modalWrap" class="modalWrap hidden"><div class="modal"><h2 id="modalTitle">Welcome back!</h2><p id="modalBody">You earned petals.</p><div id="modalActions" class="modalActions"></div></div></div>
<script>
(function(){
"use strict";

/*
HOW TO TUNE PIP'S BLOOM BUREAU
- zones[].baseReward controls the value jump between garden tiers. 5-10x jumps make each new garden feel like graduation.
- zones[].unlockCost controls time-to-expansion. Raise it if the first new garden arrives before 5 minutes; lower it if it arrives after 8 minutes.
- zoneUpgradeGrowth / workerCostGrowth use geometric cost curves. 1.07 is smoother but grindier; 1.15 creates steeper walls and more ad pressure.
- worker.baseCost controls time-to-first-automation. With the current curve and active tapping, the first helper appears at about 2 minutes.
- manual.tapIntervalForSim is only for the headless tuning simulation, not a hard limit in-game.
- prestige.scale controls how late prestige appears. Lower = earlier soft reset; higher = longer first run.
*/
const CFG = Object.freeze({
  title:"Pip's Bloom Bureau",
  saveKey:"pips-bloom-bureau-v1",
  saveVersion:1,
  maxDt:0.05,
  autosaveSec:12,
  offlineCapSec:3*60*60,
  offlineMinSec:45,
  particleCap:180,
  floatCap:80,
  coinCap:80,
  boostDurationSec:90,
  mascot:{name:"Pip Pollenpaw", species:"tiny fox-bee florist"},
  manual:{basePower:1, levelBonus:0.20, baseCost:90, costGrowth:1.12, comboWindow:1.15, comboBonus:0.08, maxComboBonus:0.60, tapIntervalForSim:1.6},
  worker:{baseCost:120, costGrowth:1.13, cycleSec:7.5, outputMult:1.0, speedUpgradeBonus:0.03},
  zoneUpgradeGrowth:1.11,
  zoneLevelBonus:0.22,
  prestige:{scale:65000, tokenMult:0.10, minRunEarned:18000},
  daily:{baseReward:125, growth:1.45, maxShownStreak:7},
  zones:[
    {id:"dew", name:"Dewdrop Daisies", icon:"🌼", baseReward:7, upCost:65, unlockCost:0, color:"#ffde68", accent:"#5ff0b8"},
    {id:"berry", name:"Jamberry Lanterns", icon:"🍓", baseReward:45, upCost:500, unlockCost:2600, color:"#ff6fae", accent:"#63d7ff"},
    {id:"mush", name:"Mooncap Mushrooms", icon:"🍄", baseReward:300, upCost:3800, unlockCost:24000, color:"#b18cff", accent:"#ffd45c"},
    {id:"star", name:"Starfruit Trees", icon:"⭐", baseReward:2100, upCost:32000, unlockCost:190000, color:"#63d7ff", accent:"#ff6fae"}
  ]
});

const $ = (id)=>document.getElementById(id);
const canvas = $("game");
const ctx = canvas && canvas.getContext ? canvas.getContext("2d", {alpha:false}) : null;
const ui = {
  money:$("money"), rate:$("rate"), prestigePill:$("prestigePill"), boostPill:$("boostPill"), goalPanel:$("goalPanel"),
  nextTitle:$("nextTitle"), nextCost:$("nextCost"), nextBar:$("nextBar"), buyZone:$("buyZone"), buyWorker:$("buyWorker"), unlockZone:$("unlockZone"),
  boostBtn:$("boostBtn"), prestigeBtn:$("prestigeBtn"), muteBtn:$("muteBtn"), banner:$("banner"), tapHint:$("tapHint"),
  modalWrap:$("modalWrap"), modalTitle:$("modalTitle"), modalBody:$("modalBody"), modalActions:$("modalActions")
};

let W=innerWidth||360, H=innerHeight||640, DPR=1;
let lastTs=0, raf=0, autosaveT=0, uiT=0, hidden=false, gameStarted=false;
let particles=[], floats=[], coins=[];
let pointer={x:0,y:0,down:false};
let selectedZone=0;
let shake=0;
let bannerTimer=0;
let audio=null;

function makeState(){
  return {
    version:CFG.saveVersion,
    money:0, displayMoney:0, lifetimeEarned:0, runEarned:0,
    manualLevel:0, zoneLevels:CFG.zones.map(()=>0), zonesUnlocked:1,
    workers:[], nextWorkerId:1, workerSpeedLevel:0,
    prestigeTokens:0, lastSave:Date.now(), lastDailyDay:"", dailyStreak:0,
    boostUntil:0, tutorialStep:0, muted:false,
    mascot:{x:0,y:0,tx:0,ty:0,wobble:0}, lastTapTime:-999, combo:0,
    stats:{manualHarvests:0, purchases:0, unlocks:0, milestones:0}
  };
}
let S = makeState();

const CG = {
  ready:false, loading:false, sdk:null,
  async init(){
    if(this.ready || this.loading) return;
    this.loading=true;
    try{
      if(!window.CrazyGames || !window.CrazyGames.SDK){
        const shouldLoad = /crazygames\.com$/i.test(location.hostname||"") || /useCrazySdk=1/.test(location.search||"");
        if(shouldLoad){ await this.loadScript("https://sdk.crazygames.com/crazygames-sdk-v3.js"); }
      }
      if(window.CrazyGames && window.CrazyGames.SDK){
        this.sdk=window.CrazyGames.SDK;
        if(this.sdk.init) await this.sdk.init();
        this.ready=true;
      }
    }catch(e){ this.ready=false; this.sdk=null; }
    this.loading=false;
  },
  loadScript(src){ return new Promise((res,rej)=>{ try{ const s=document.createElement("script"); s.src=src; s.async=true; s.onload=res; s.onerror=rej; document.head.appendChild(s); }catch(e){ rej(e); } }); },
  call(path){ try{ const parts=path.split("."); let o=this.sdk; for(const p of parts){ if(!o || !o[p]) return; o=o[p]; } const r=o.call(parts.length>1?this.sdk[parts[0]]:this.sdk); if(r&&r.catch) r.catch(()=>{}); }catch(e){} },
  loadingStart(){ if(this.ready) this.call("game.loadingStart"); },
  loadingStop(){ if(this.ready) this.call("game.loadingStop"); },
  gameplayStart(){ if(this.ready) this.call("game.gameplayStart"); },
  gameplayStop(){ if(this.ready) this.call("game.gameplayStop"); },
  happytime(){ if(this.ready) this.call("game.happytime"); },
  requestRewarded(onSuccess,onFail){
    if(!this.ready || !this.sdk || !this.sdk.ad || !this.sdk.ad.requestAd){ onSuccess("local-sdk-absent"); return; }
    try{
      setPausedForAd(true);
      this.sdk.ad.requestAd("rewarded",{
        adStarted:()=>setPausedForAd(true),
        adFinished:()=>{ setPausedForAd(false); onSuccess("ad-finished"); },
        adError:()=>{ setPausedForAd(false); if(onFail) onFail(); }
      });
    }catch(e){ setPausedForAd(false); if(onFail) onFail(); }
  },
  // TODO: confirm exact CrazyGames leaderboard setup, encryption key handling and invited-game availability before enabling score submission.
  submitLeaderboardScore(){ return false; }
};

function setPausedForAd(v){ hidden=!!v; if(v) CG.gameplayStop(); else CG.gameplayStart(); }

function safeStorageGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function safeStorageSet(k,v){ try{localStorage.setItem(k,v);return true;}catch(e){return false;} }
function safeStorageRemove(k){ try{localStorage.removeItem(k);return true;}catch(e){return false;} }

function migrate(raw){
  if(!raw) return makeState();
  try{
    const data=JSON.parse(raw);
    const fresh=makeState();
    const merged=Object.assign(fresh,data||{});
    merged.version=CFG.saveVersion;
    merged.zoneLevels=CFG.zones.map((_,i)=>Number(merged.zoneLevels&&merged.zoneLevels[i]||0));
    merged.zonesUnlocked=clamp(Math.floor(merged.zonesUnlocked||1),1,CFG.zones.length);
    merged.workers=Array.isArray(merged.workers)?merged.workers.slice(0,80).map((w,i)=>({
      id:w.id||i+1, zone:clamp(Math.floor(w.zone||0),0,merged.zonesUnlocked-1), t:Number(w.t||Math.random()*CFG.worker.cycleSec), x:Number(w.x||0), y:Number(w.y||0), mood:Number(w.mood||Math.random()*6)
    })):[];
    merged.nextWorkerId=Math.max(Number(merged.nextWorkerId||1), merged.workers.length+1);
    merged.mascot=Object.assign(fresh.mascot, merged.mascot||{});
    merged.stats=Object.assign(fresh.stats, merged.stats||{});
    return merged;
  }catch(e){ return makeState(); }
}
function save(){ S.lastSave=Date.now(); safeStorageSet(CFG.saveKey, JSON.stringify(S)); }
function load(){ S=migrate(safeStorageGet(CFG.saveKey)); S.displayMoney=S.money; selectedZone=Math.min(S.zonesUnlocked-1, selectedZone); }
function hardReset(){ safeStorageRemove(CFG.saveKey); S=makeState(); selectedZone=0; particles=[]; floats=[]; coins=[]; save(); closeModal(); celebrate("Fresh garden!", false); refreshUI(true); }

function dayIndex(d){ return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/86400000); }
function dayKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function maybeDaily(){
  const now=new Date(); const today=dayKey(now);
  if(S.lastDailyDay===today) return;
  const last=S.lastDailyDay ? dayIndex(new Date(S.lastDailyDay+"T00:00:00")) : 0;
  const cur=dayIndex(now);
  if(!S.lastDailyDay) S.dailyStreak=0;
  else if(cur-last>1) S.dailyStreak=0;
  const nextStreak=clamp(S.dailyStreak+1,1,999);
  const reward=Math.floor(CFG.daily.baseReward*Math.pow(CFG.daily.growth, Math.min(nextStreak-1, CFG.daily.maxShownStreak-1))*(1+S.prestigeTokens*CFG.prestige.tokenMult));
  showModal("Daily bloom bonus", `Day ${nextStreak} streak. Claim ${fmt(reward)} petals and keep Pip's garden warm.`, [
    {label:"Claim", primary:true, action:()=>{ S.dailyStreak=nextStreak; S.lastDailyDay=today; earn(reward, W*.5, H*.42, "daily", true); closeModal(); save(); celebrate("Streak +"+nextStreak, true); }},
    {label:"Later", action:()=>closeModal()}
  ]);
}
function maybeOffline(){
  const now=Date.now(); const away=Math.max(0,(now-(S.lastSave||now))/1000);
  const capped=Math.min(away, CFG.offlineCapSec);
  const rate=getPassiveRate();
  const amount=Math.floor(rate*capped*0.75);
  if(away>=CFG.offlineMinSec && amount>0){
    const mins=Math.floor(capped/60);
    showModal("Welcome back!", `Pip's helpers worked for ${mins} min and gathered ${fmt(amount)} petals while you were away.`, [
      {label:"Claim", primary:true, action:()=>{ earn(amount,W*.5,H*.42,"offline",true); closeModal(); save(); maybeDaily(); }},
      {label:"Double", action:()=>{ CG.requestRewarded(()=>{ earn(amount*2,W*.5,H*.42,"offline",true); closeModal(); save(); maybeDaily(); },()=>{ toast("No ad available"); }); }}
    ]);
  } else maybeDaily();
}

function initAudio(){
  if(audio) return audio;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    const ac=new AC();
    const master=ac.createGain(); master.gain.value=0.18; master.connect(ac.destination);
    audio={ac,master,muted:false};
    return audio;
  }catch(e){return null;}
}
function beep(type="tap", power=1){
  if(S.muted) return;
  const a=initAudio(); if(!a) return;
  if(a.ac.state==="suspended") a.ac.resume().catch(()=>{});
  const now=a.ac.currentTime;
  const osc=a.ac.createOscillator(); const gain=a.ac.createGain();
  let f=360, dur=.08, wave="sine";
  if(type==="earn"){ f=540+S.combo*32; dur=.09; wave="triangle"; }
  if(type==="buy"){ f=260; dur=.15; wave="square"; }
  if(type==="unlock"){ f=220; dur=.38; wave="sawtooth"; }
  if(type==="milestone"){ f=420; dur=.5; wave="triangle"; }
  osc.type=wave; osc.frequency.setValueAtTime(f,now); osc.frequency.exponentialRampToValueAtTime(f*(type==="unlock"?2.6:1.35), now+dur);
  gain.gain.setValueAtTime(0.0001,now); gain.gain.exponentialRampToValueAtTime(0.18*power,now+.012); gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  osc.connect(gain); gain.connect(a.master); osc.start(now); osc.stop(now+dur+.02);
}

function resize(){
  W=window.innerWidth||360; H=window.innerHeight||640; DPR=Math.min(2.5, window.devicePixelRatio||1);
  if(canvas){ canvas.width=Math.max(1,Math.floor(W*DPR)); canvas.height=Math.max(1,Math.floor(H*DPR)); canvas.style.width=W+"px"; canvas.style.height=H+"px"; }
  if(ctx) ctx.setTransform(DPR,0,0,DPR,0,0);
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ return 1-Math.pow(1-clamp(t,0,1),3); }
function fmt(n){
  n=Number(n)||0;
  if(n<1000) return Math.floor(n).toString();
  const units=["K","M","B","T","Qa","Qi"]; let u=-1;
  while(n>=1000 && u<units.length-1){ n/=1000; u++; }
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+units[u];
}
function cost(base,growth,n){ return Math.floor(base*Math.pow(growth,n)); }
function zoneReward(i){ return CFG.zones[i].baseReward*(1+(S.zoneLevels[i]||0)*CFG.zoneLevelBonus); }
function prestigeMult(){ return 1+S.prestigeTokens*CFG.prestige.tokenMult; }
function boostMult(){ return Date.now()<S.boostUntil ? 2 : 1; }
function manualMult(){ return (CFG.manual.basePower+S.manualLevel*CFG.manual.levelBonus)*prestigeMult()*boostMult(); }
function workerCycle(){ return Math.max(2.1, CFG.worker.cycleSec/(1+S.workerSpeedLevel*CFG.worker.speedUpgradeBonus)); }
function getPassiveRate(){
  let r=0; const cyc=workerCycle();
  for(const w of S.workers){ const z=clamp(w.zone||0,0,S.zonesUnlocked-1); r+=zoneReward(z)*CFG.worker.outputMult*prestigeMult()*boostMult()/cyc; }
  return r;
}
function currentZoneUpgradeCost(i=selectedZone){ return cost(CFG.zones[i].upCost, CFG.zoneUpgradeGrowth, S.zoneLevels[i]||0); }
function workerCost(){ return cost(CFG.worker.baseCost, CFG.worker.costGrowth, S.workers.length); }
function manualCost(){ return cost(CFG.manual.baseCost, CFG.manual.costGrowth, S.manualLevel); }
function nextUnlockCost(){ return S.zonesUnlocked<CFG.zones.length ? CFG.zones[S.zonesUnlocked].unlockCost : Infinity; }
function prestigeGain(){ if(S.runEarned<CFG.prestige.minRunEarned) return 0; return Math.floor(Math.sqrt(S.runEarned/CFG.prestige.scale)); }

function earn(amount,x,y,source,big){
  amount=Math.max(0,Number(amount)||0); if(amount<=0) return;
  S.money+=amount; S.lifetimeEarned+=amount; S.runEarned+=amount;
  spawnFloat("+"+fmt(amount),x,y,big?1.4:1);
  spawnCoins(x,y, big?10:4, amount);
  if(source!=="passive") beep("earn", big?1.2:.9);
}
function spend(amount){ amount=Math.floor(amount); if(S.money+1e-9<amount) return false; S.money-=amount; S.stats.purchases++; beep("buy",1); return true; }

function buyZoneUpgrade(){ const c=currentZoneUpgradeCost(); if(!spend(c)) return false; S.zoneLevels[selectedZone]++; pulseAtZone(selectedZone,1); celebrate(CFG.zones[selectedZone].name+" leveled!", false); save(); refreshUI(true); return true; }
function buyManual(){ const c=manualCost(); if(!spend(c)) return false; S.manualLevel++; celebrate("Pip pounces faster!", false); save(); refreshUI(true); return true; }
function hireWorker(){ const c=workerCost(); if(!spend(c)) return false; const z=Math.min(S.zonesUnlocked-1, S.workers.length%S.zonesUnlocked); S.workers.push({id:S.nextWorkerId++,zone:z,t:Math.random()*workerCycle(),x:W*.5,y:H*.58,mood:Math.random()*6}); S.stats.milestones++; pulseAtZone(z,1.4); celebrate("New helper hired!", true); save(); refreshUI(true); return true; }
function unlockZone(){ if(S.zonesUnlocked>=CFG.zones.length) return false; const c=nextUnlockCost(); if(!spend(c)) return false; S.zonesUnlocked++; selectedZone=S.zonesUnlocked-1; S.stats.unlocks++; shake=8; burst(W*.5, zoneY(selectedZone), CFG.zones[selectedZone].color, 44); celebrate("Unlocked "+CFG.zones[selectedZone].name+"!", true); CG.happytime(); save(); refreshUI(true); return true; }
function doPrestige(){ const gain=prestigeGain(); if(gain<=0) return; const oldLifetime=S.lifetimeEarned; const oldTokens=S.prestigeTokens; S=makeState(); S.lifetimeEarned=oldLifetime; S.prestigeTokens=oldTokens+gain; S.lastDailyDay=dayKey(new Date()); S.dailyStreak=Math.max(1,S.dailyStreak||1); selectedZone=0; closeModal(); celebrate("+"+gain+" Star Seeds!", true); CG.happytime(); save(); refreshUI(true); }

function zoneY(i){ const top=H*.27, gap=Math.min(105, H*.135); return top+i*gap; }
function zoneX(i){ return W*.48+(i%2?W*.08:-W*.06); }
function canvasToGame(e){ const r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0,width:W,height:H}; return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)}; }
function nearestUnlockedZone(x,y){ let best=0, bd=Infinity; for(let i=0;i<S.zonesUnlocked;i++){ const dx=x-zoneX(i), dy=y-zoneY(i); const d=dx*dx+dy*dy; if(d<bd){bd=d; best=i;} } return best; }
function manualHarvest(x,y){
  if(!gameStarted){ gameStarted=true; CG.gameplayStart(); }
  initAudio();
  const z=nearestUnlockedZone(x,y); selectedZone=z;
  const now=performance.now()/1000;
  S.combo = (now-S.lastTapTime)<CFG.manual.comboWindow ? Math.min(8,S.combo+1) : 0;
  S.lastTapTime=now; S.stats.manualHarvests++;
  const comboBonus=1+Math.min(CFG.manual.maxComboBonus, S.combo*CFG.manual.comboBonus);
  const amount=zoneReward(z)*manualMult()*comboBonus;
  const zx=zoneX(z), zy=zoneY(z);
  S.mascot.tx=zx; S.mascot.ty=zy-32; S.mascot.wobble=1;
  earn(amount,zx,zy-26,"manual", S.combo>=5);
  burst(zx,zy,CFG.zones[z].color, S.combo>=5?24:13);
  shake=Math.max(shake,S.combo>=5?4:1.5);
  if(S.tutorialStep<1){ S.tutorialStep=1; if(ui.tapHint) ui.tapHint.classList.add("hidden"); }
  if(S.stats.manualHarvests===1) celebrate("Great first bloom!", false);
  if(S.stats.manualHarvests===10) celebrate("Combo gardener!", true);
  refreshUI(false);
}

function pulseAtZone(i,scale){ burst(zoneX(i),zoneY(i),CFG.zones[i].accent,Math.floor(18*scale)); shake=Math.max(shake,2*scale); }
function burst(x,y,color,count){
  for(let i=0;i<count && particles.length<CFG.particleCap;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*170;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.45+Math.random()*.55,max:1,size:2+Math.random()*5,color});
  }
}
function spawnFloat(text,x,y,scale){ floats.push({text,x,y,vy:-38-20*Math.random(),life:1,max:1,scale}); if(floats.length>CFG.floatCap) floats.shift(); }
function spawnCoins(x,y,n,value){ for(let i=0;i<n && coins.length<CFG.coinCap;i++) coins.push({x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*20,life:.55+Math.random()*.35,value}); }
function celebrate(text,big){
  if(ui.banner){ ui.banner.textContent=text; ui.banner.classList.add("show"); bannerTimer=big?2.1:1.35; }
  beep(big?"milestone":"buy", big?1.2:1);
  if(big){ shake=Math.max(shake,5); }
}
function toast(text){ celebrate(text,false); }

function update(dt){
  if(hidden) return;
  autosaveT+=dt; uiT+=dt; if(autosaveT>CFG.autosaveSec){ autosaveT=0; save(); }
  if(bannerTimer>0){ bannerTimer-=dt; if(bannerTimer<=0 && ui.banner) ui.banner.classList.remove("show"); }
  selectedZone=clamp(selectedZone,0,S.zonesUnlocked-1);
  const now=Date.now();
  if(now>S.boostUntil && ui.boostPill){}
  const m=S.mascot;
  if(!m.tx){ m.x=zoneX(0); m.y=zoneY(0)-38; m.tx=m.x; m.ty=m.y; }
  m.x=lerp(m.x,m.tx,1-Math.pow(.001,dt)); m.y=lerp(m.y,m.ty,1-Math.pow(.001,dt)); m.wobble=Math.max(0,m.wobble-dt*3);
  for(const w of S.workers){
    const cyc=workerCycle(); w.t=(w.t+dt)%cyc; w.zone=clamp(w.zone,0,S.zonesUnlocked-1); w.mood=(w.mood||0)+dt;
    if(w.t<dt){ const z=w.zone; const x=zoneX(z)+(Math.random()-.5)*50; const y=zoneY(z)-22; earn(zoneReward(z)*CFG.worker.outputMult*prestigeMult()*boostMult(), x,y,"passive",false); burst(x,y,CFG.zones[z].accent,6); }
  }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; p.vy+=240*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.life<=0) particles.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y+=f.vy*dt; if(f.life<=0) floats.splice(i,1); }
  for(let i=coins.length-1;i>=0;i--){ const c=coins[i]; c.life-=dt; const t=1-c.life/.9; c.x=lerp(c.x,26,t*.05); c.y=lerp(c.y,34,t*.05); if(c.life<=0) coins.splice(i,1); }
  shake=Math.max(0,shake-dt*18);
  S.displayMoney=lerp(S.displayMoney,S.money,1-Math.pow(.0001,dt));
  if(uiT>.22){ uiT=0; refreshUI(false); }
}

  ui.nextTitle.textContent="Next: "+next.title; ui.nextCost.textContent=fmt(Math.max(0,next.cost-S.money))+" away"; ui.nextBar.style.width=Math.floor(clamp(S.money/next.cost,0,1)*100)+"%";
}

function draw(){
  if(!ctx) return;
  ctx.save();
  const sx=shake?(Math.random()-.5)*shake:0, sy=shake?(Math.random()-.5)*shake:0; ctx.translate(sx,sy);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#261041"); g.addColorStop(.55,"#5d2b73"); g.addColorStop(1,"#f39b62"); ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,H+20);
  drawBackground();
  for(let i=CFG.zones.length-1;i>=0;i--) drawZone(i);
  drawWorkers();
  drawMascot();
  drawParticles();
  drawFloating();
  drawCoins();
  ctx.restore();
}
function drawBackground(){
  ctx.globalAlpha=.22;
  for(let i=0;i<20;i++){ const x=(i*97+performance.now()*0.012)%W; const y=(i*53)%H; ctx.fillStyle=i%2?"#fff6d8":"#63d7ff"; ctx.beginPath(); ctx.arc(x,y,1.2+(i%3),0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.fillStyle="rgba(255,246,216,.08)";
  for(let y=H*.18;y<H;y+=58){ ctx.beginPath(); ctx.ellipse(W*.5,y,W*.58,10,0,0,Math.PI*2); ctx.fill(); }
}
function drawZone(i){
  const z=CFG.zones[i], unlocked=i<S.zonesUnlocked, x=zoneX(i), y=zoneY(i), t=performance.now()/1000;
  ctx.save();
  ctx.globalAlpha=unlocked?1:.32;
  ctx.translate(x,y);
  const wob=Math.sin(t*2+i)*2;
  ctx.fillStyle=unlocked?"rgba(255,246,216,.26)":"rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(0,18,Math.min(170,W*.38),42,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=unlocked?z.color:"#5b4b67"; ctx.strokeStyle=unlocked?"#fff6d8":"#8b7b91"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,10+wob,Math.min(128,W*.30),32,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  for(let p=0;p<5;p++){
    const px=(p-2)*38 + Math.sin(t*2+p+i)*3; const py=0+Math.cos(t*2+p)*3;
    ctx.fillStyle=unlocked?z.accent:"#777"; ctx.beginPath(); ctx.arc(px,py,9+Math.sin(t*4+p)*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=unlocked?"#fff6d8":"#aaa"; ctx.beginPath(); ctx.arc(px-3,py-3,3,0,Math.PI*2); ctx.fill();
  }
  ctx.font="bold 20px Trebuchet MS"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#351632"; ctx.fillText(z.icon,0,5);
  ctx.font="900 12px Trebuchet MS"; ctx.fillStyle=unlocked?"#fff6d8":"#c8bad4"; ctx.strokeStyle="rgba(36,11,43,.65)"; ctx.lineWidth=4; ctx.strokeText(z.name,0,58); ctx.fillText(z.name,0,58);
  if(i===selectedZone && unlocked){ ctx.strokeStyle="rgba(255,246,216,.95)"; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(0,10,Math.min(145,W*.33),41,0,0,Math.PI*2); ctx.stroke(); }
  if(!unlocked){ ctx.font="900 13px Trebuchet MS"; ctx.fillStyle="#fff6d8"; ctx.fillText("Unlock " + fmt(z.unlockCost),0,12); }
  ctx.restore();
}
function drawMascot(){
  const m=S.mascot; const t=performance.now()/1000; const scale=1+m.wobble*.18+Math.sin(t*5)*.025;
  const x=m.x||zoneX(0), y=m.y||zoneY(0)-38;
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,1/scale);
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(0,35,34,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ff9f4f"; ctx.strokeStyle="#642044"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,28,24,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#fff6d8"; ctx.beginPath(); ctx.ellipse(3,9,17,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ff9f4f"; ctx.beginPath(); ctx.moveTo(-20,-16); ctx.lineTo(-35,-35); ctx.lineTo(-8,-23); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(20,-16); ctx.lineTo(34,-35); ctx.lineTo(8,-23); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#351632"; ctx.beginPath(); ctx.arc(-8,-3,3.5,0,Math.PI*2); ctx.arc(10,-3,3.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#351632"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(2,6,8,0.15,Math.PI-.15); ctx.stroke();
  ctx.fillStyle="rgba(99,215,255,.55)"; ctx.beginPath(); ctx.ellipse(-24,2,11,23,Math.sin(t*12)*.2,0,Math.PI*2); ctx.ellipse(25,2,11,23,-Math.sin(t*12)*.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawWorkers(){
  const cyc=workerCycle();
  for(const w of S.workers){
    const z=clamp(w.zone,0,S.zonesUnlocked-1); const p=(w.t%cyc)/cyc; const zx=zoneX(z), zy=zoneY(z); const bx=28+Math.min(W*.24,112), by=48;
    const q=p<.5 ? easeOut(p/.5) : easeOut((p-.5)/.5);
    const x=p<.5?lerp(bx,zx,q):lerp(zx,bx,q); const y=p<.5?lerp(by,zy-24,q):lerp(zy-24,by,q);
    ctx.save(); ctx.translate(x,y+Math.sin((performance.now()/300)+(w.mood||0))*4);
    ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(0,18,13,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffd45c"; ctx.strokeStyle="#642044"; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0,0,14,10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#642044"; ctx.fillRect(-6,-9,3,18); ctx.fillRect(3,-9,3,18);
    ctx.fillStyle="rgba(255,246,216,.6)"; ctx.beginPath(); ctx.ellipse(-8,-9,8,5,-.7,0,Math.PI*2); ctx.ellipse(8,-9,8,5,.7,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawParticles(){ for(const p of particles){ const a=clamp(p.life/.8,0,1); ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; }
function drawFloating(){ ctx.textAlign="center"; ctx.textBaseline="middle"; for(const f of floats){ const a=clamp(f.life/f.max,0,1); ctx.globalAlpha=a; ctx.font="900 "+Math.floor(19*(f.scale||1))+"px Trebuchet MS"; ctx.lineWidth=4; ctx.strokeStyle="rgba(53,22,50,.75)"; ctx.fillStyle="#fff6d8"; ctx.strokeText(f.text,f.x,f.y); ctx.fillText(f.text,f.x,f.y); } ctx.globalAlpha=1; }
function drawCoins(){ for(const c of coins){ ctx.globalAlpha=clamp(c.life/.8,0,1); ctx.fillStyle="#ffd45c"; ctx.strokeStyle="#8f3145"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(c.x,c.y,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); } ctx.globalAlpha=1; }

function frame(ts){

function onPointerDown(e){

function economySimulation(seconds=900){
  const st={money:0,total:0,manualLevel:0,zoneLevels:CFG.zones.map(()=>0),unlocked:1,workers:0};
  let t=0,nextTap=0; const dt=.25, purchases=[]; const first={};
  const zReward=i=>CFG.zones[i].baseReward*(1+st.zoneLevels[i]*CFG.zoneLevelBonus);
  const pRate=()=>{ let r=0; for(let w=0; w<st.workers; w++){ const zi=Math.max(0, st.unlocked-1-(w%Math.min(st.unlocked,2))); r+=zReward(zi)*CFG.worker.outputMult/CFG.worker.cycleSec; } return r; };
  const buy=(kind,name,c)=>{ st.money-=c; purchases.push({t:+t.toFixed(1),kind,name,cost:Math.floor(c),money:Math.floor(st.money)}); if(kind==="worker") first.firstWorker ??= t; if(kind==="unlock") first.firstExpansion ??= t; if(kind!=="worker"&&kind!=="unlock") first.firstUpgrade ??= t; };
  while(t<seconds){
    const pe=pRate()*dt; st.money+=pe; st.total+=pe;
    if(t>=nextTap){ const e=zReward(st.unlocked-1)*(CFG.manual.basePower+st.manualLevel*CFG.manual.levelBonus); st.money+=e; st.total+=e; first.firstReward ??= t; nextTap=t+CFG.manual.tapIntervalForSim; }
    let choice=null;
    const wCost=cost(CFG.worker.baseCost,CFG.worker.costGrowth,st.workers);
    if(st.workers===0 && st.money>=wCost) choice=["worker","worker",wCost];
    const uCost=st.unlocked<CFG.zones.length?CFG.zones[st.unlocked].unlockCost:Infinity;
    if(!choice && st.money>=uCost) choice=["unlock","unlock",uCost];
    if(!choice){
      const opts=[];
      opts.push(["manual","manual",cost(CFG.manual.baseCost,CFG.manual.costGrowth,st.manualLevel)]);
      opts.push(["worker","worker",wCost]);
      for(let i=0;i<st.unlocked;i++) opts.push(["zone","zone"+i,cost(CFG.zones[i].upCost,CFG.zoneUpgradeGrowth,st.zoneLevels[i])]);
      const aff=opts.filter(o=>o[2]<=st.money); if(aff.length) choice=aff.sort((a,b)=>a[2]-b[2])[0];
    }
    if(choice){ buy(choice[0],choice[1],choice[2]); if(choice[0]==="manual") st.manualLevel++; else if(choice[0]==="worker") st.workers++; else if(choice[0]==="unlock") st.unlocked++; else if(choice[0]==="zone") st.zoneLevels[Number(choice[1].replace("zone",""))]++; }
    t+=dt;
  }
  const gaps=purchases.slice(1).map((p,i)=>+(p.t-purchases[i].t).toFixed(1));
  return {first, purchases:purchases.slice(0,80), purchaseCount:purchases.length, maxGap:gaps.length?Math.max(...gaps):0, gaps:gaps.slice(0,60), passiveAfterFirstWorker:purchases.some(p=>p.kind==="worker")};
}

function bootSmokeTest(){
  const sim=economySimulation(900);
  const st=makeState(); st.workers.push({id:1,zone:0,t:0,x:0,y:0,mood:0});
  return {syntax:"loaded", economy:sim, sdkAbsent:!(window.CrazyGames&&window.CrazyGames.SDK)};
}
window.__BLOOM_TEST__={CFG,economySimulation,bootSmokeTest,makeState};

async function boot(){
  resize(); load(); addEvents(); refreshUI(true); draw();
  CG.init().then(()=>{ CG.loadingStart(); CG.loadingStop(); }).catch(()=>{});
  maybeOffline();
  raf=requestAnimationFrame(frame);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot,{once:true}); else boot();
})();
</script>
