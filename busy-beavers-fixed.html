<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Busy Beavers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  :root{
    --cream:#fff6e6; --cream2:#ffedcf; --ink:#4a3526; --ink2:#6b4f37;
    --wood:#a06a3a; --wood-d:#7a4f29; --green:#46b94e; --green-d:#2f8a37;
    --gold:#ffb938; --gold-d:#e69412; --red:#e7604c; --sky:#bfe7ff;
    --panel:#fffaf0; --shadow:0 8px 0 rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#6cb544;
    font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  canvas{display:block;position:fixed;inset:0;}
  #hud{position:fixed;left:0;right:0;top:0;z-index:10;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;}
  .chips{display:flex;flex-direction:column;gap:8px;}
  .chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:3px solid var(--wood-d);
    border-radius:16px;padding:7px 13px 7px 8px;box-shadow:0 5px 0 rgba(0,0,0,.14);}
  .chip .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;}
  .chip .ic.coin{background:var(--gold);border:2px solid #fff3cf;color:#7a4f00;font-weight:700;}
  .chip .ic.pack{background:var(--wood);border:2px solid #d4a16a;}
  .chip .ic.pack .sq{width:13px;height:13px;background:#ffd9a0;border-radius:3px;}
  .chip b{font-size:21px;font-weight:700;line-height:1;color:var(--ink);}
  .chip small{display:block;font-size:9.5px;letter-spacing:.12em;color:#9a7a59;font-weight:600;text-transform:uppercase;}
  .col-r{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto;}
  .btn{font-family:inherit;font-weight:700;border:none;cursor:pointer;color:#fff;border-radius:16px;
    transition:transform .07s, filter .07s;}
  .btn:active{transform:translateY(3px) scale(.98);filter:brightness(.94);}
  #frenzy{display:flex;flex-direction:column;align-items:center;gap:1px;background:linear-gradient(#ffce4d,#f0a01e);
    border:3px solid #fff0c4;border-radius:18px;padding:8px 14px;box-shadow:0 6px 0 var(--gold-d);color:#6b3f00;}
  #frenzy .t{font-size:15px;font-weight:700;letter-spacing:.04em;}
  #frenzy .s{font-size:10px;font-weight:600;opacity:.85;}
  #frenzy.active{background:linear-gradient(#7ad17f,#3f9c47);border-color:#d7ffd9;box-shadow:0 6px 0 #2c7a33;color:#0c3a12;}
  #frenzy.glow{animation:fg 1s infinite alternate;}
  @keyframes fg{from{box-shadow:0 6px 0 var(--gold-d),0 0 0 rgba(255,200,60,.0);}to{box-shadow:0 6px 0 var(--gold-d),0 0 22px rgba(255,200,60,.7);}}
  #mute{width:44px;height:44px;border-radius:50%;background:var(--panel);border:3px solid var(--wood-d);
    box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;color:var(--ink);}
  #shopFab{position:fixed;right:16px;bottom:18px;z-index:10;width:74px;height:74px;border-radius:50%;
    background:linear-gradient(#56c6e8,#2f93c4);border:4px solid #d6f3ff;box-shadow:0 7px 0 #237aa3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
  #shopFab .ic{font-size:28px;line-height:1;}
  #shopFab .lb{font-size:10px;font-weight:700;letter-spacing:.06em;}
  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(40,26,15,.55);backdrop-filter:blur(4px);padding:18px;}
  .modal.show{display:flex;}
  .panel{width:min(440px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border:5px solid var(--wood-d);
    border-radius:26px;box-shadow:var(--shadow);}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--cream2);
    border-bottom:4px solid #e9cfa3;border-radius:21px 21px 0 0;}
  .phead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--ink);}
  .x{width:38px;height:38px;border-radius:12px;border:none;background:#eddfca;color:var(--ink2);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;}
  .x:active{transform:scale(.94);}
  .pbody{padding:14px;display:flex;flex-direction:column;gap:11px;}
  .row{display:flex;align-items:center;gap:12px;background:var(--cream);border:3px solid #ecd6ad;border-radius:16px;padding:10px;}
  .row .em{width:48px;height:48px;flex:0 0 auto;background:#fff;border:3px solid #ecd6ad;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .row .mid{flex:1;min-width:0;}
  .row .nm{font-size:16px;font-weight:700;color:var(--ink);line-height:1.1;}
  .row .lv{font-size:12px;font-weight:600;color:#9a7a59;}
  .row .lv b{color:var(--green-d);}
  .buy{flex:0 0 auto;font-family:inherit;font-weight:700;font-size:15px;color:#fff;border:none;cursor:pointer;
    border-radius:13px;padding:11px 15px;min-width:84px;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .07s,filter .07s;}
  .buy:active{transform:translateY(3px);filter:brightness(.95);}
  .buy.cant{background:#cbb89c;box-shadow:0 4px 0 #a8916f;}
  .buy.max{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#6b3f00;}
  .buy .c{display:flex;align-items:center;gap:4px;justify-content:center;}
  .center{text-align:center;}
  #intro .panel,#offline .panel{padding-bottom:20px;}
  .big{font-size:46px;font-weight:700;letter-spacing:.01em;margin:6px 0 0;color:var(--ink);}
  .big .a{color:var(--green-d);}
  .tag{font-size:13px;font-weight:600;color:#9a7a59;letter-spacing:.06em;margin:2px 0 0;}
  .bigbtn{display:block;width:calc(100% - 28px);margin:16px auto 4px;padding:16px;border-radius:18px;
    background:linear-gradient(#56c64f,#2f9a37);box-shadow:0 6px 0 #237a2b;color:#fff;font-size:20px;font-weight:700;letter-spacing:.04em;border:none;cursor:pointer;font-family:inherit;}
  .bigbtn:active{transform:translateY(3px);filter:brightness(.95);}
  .bigbtn.gold{background:linear-gradient(#ffce4d,#f0a01e);box-shadow:0 6px 0 var(--gold-d);color:#6b3f00;}
  .mascot{font-size:64px;line-height:1;margin-top:8px;}
  .lil{font-size:12px;color:#9a7a59;font-weight:500;margin-top:10px;line-height:1.4;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="chips">
    <div class="chip"><div class="ic coin">$</div><div><b id="ui-money">0</b></div></div>
    <div class="chip"><div class="ic pack"><div class="sq"></div></div><div><small>Logs</small><b id="ui-pack">0 / 12</b></div></div>
  </div>
  <div class="col-r">
    <button id="frenzy" class="btn glow"><span class="t">▶ 2× FRENZY</span><span class="s" id="frenzy-s">Watch ad · 60s</span></button>
    <button id="mute">🔊</button>
  </div>
</div>

<div id="shopFab"><span class="ic">🪓</span><span class="lb">UPGRADE</span></div>

<div class="modal" id="shop">
  <div class="panel">
    <div class="phead"><h2>🦫 Beaver Camp</h2><button class="x" id="shop-x">✕</button></div>
    <div class="pbody" id="shop-rows"></div>
  </div>
</div>

<div class="modal" id="intro">
  <div class="panel center">
    <div class="mascot">🦫</div>
    <h1 class="big">BUSY <span class="a">BEAVERS</span></h1>
    <div class="tag">Chop · Haul · Build your lumber empire</div>
    <button class="bigbtn" id="intro-play">▶ START CHOPPING</button>
    <div class="lil">Move with the joystick or WASD. Chopping, hauling and selling happen automatically — hire beavers to do it for you.</div>
  </div>
</div>

<div class="modal" id="offline">
  <div class="panel center">
    <div class="mascot">💤</div>
    <h2 class="big" style="font-size:30px">Welcome back!</h2>
    <div class="tag">Your beavers kept working</div>
    <div class="big a" id="off-amt">$0</div>
    <button class="bigbtn" id="off-collect">Collect</button>
    <button class="bigbtn gold" id="off-double">▶ Watch ad · Collect 2×</button>
  </div>
</div>

<script>
"use strict";
(function(){
/* ============ TUNING (the economy is the game) ============ */
const CFG = {
  player:{ speed:255, chop:18, capacity:12, magnet:115 },
  worker:{ speed:150, chop:11, capacity:8, magnet:85 },
  sellTick:0.05,            // seconds per log sold while in yard
  logsPerTree:4,
  frenzyMult:2, frenzyDur:60,
  zoneW:1150, zoneH:1300,
  offlineMax:7200,          // cap offline at 2h
  offlineEff:0.5,
  caps:{ logs:320, particles:520, floats:40, workers:32 },
};
const TREES = [
  { name:'Oak',     value:2,  hp:90,  regrow:5, leaf:'#4f9d3a', leaf2:'#3d7a2c', trunk:'#9a6531', kind:'round', scale:1.0 },
  { name:'Pine',    value:5,  hp:150, regrow:6, leaf:'#2f8d54', leaf2:'#236b40', trunk:'#8a5a2b', kind:'pine',  scale:1.05 },
  { name:'Birch',   value:12, hp:240, regrow:7, leaf:'#7bc24f', leaf2:'#5fa23a', trunk:'#e8e2d2', kind:'round', scale:1.1 },
  { name:'Redwood', value:30, hp:430, regrow:9, leaf:'#3f8f49', leaf2:'#2f7137', trunk:'#b5532e', kind:'round', scale:1.35 },
];
const ZONES = [
  { tree:0, cost:0,     treeCount:26 },
  { tree:1, cost:600,   treeCount:26 },
  { tree:2, cost:6500,  treeCount:26 },
  { tree:3, cost:55000, treeCount:24 },
];
const UPG = [
  { key:'power',   em:'🪓', name:'Axe Power',    base:60,  growth:1.55, max:40 },
  { key:'speed',   em:'👟', name:'Move Speed',   base:55,  growth:1.5,  max:25 },
  { key:'capacity',em:'🎒', name:'Big Backpack', base:80,  growth:1.5,  max:40 },
  { key:'price',   em:'💰', name:'Lumber Price', base:120, growth:1.6,  max:40 },
  { key:'worker',  em:'🦫', name:'Hire Beaver',  base:150, growth:1.9,  max:32 },
  { key:'wspeed',  em:'⚡', name:'Beaver Boost', base:130, growth:1.6,  max:30 },
];

/* ============ UTILS ============ */
const TAU=Math.PI*2;
const rnd=(a=1,b)=> b===undefined? Math.random()*a : a+Math.random()*(b-a);
const rndi=(a,b)=> Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=> v<a?a:v>b?b:v;
const lerp=(a,b,t)=> a+(b-a)*t;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function fmt(n){ n=Math.floor(n); if(n<1000)return ''+n; if(n<1e6)return (n/1e3).toFixed(n<1e4?1:0)+'K'; if(n<1e9)return (n/1e6).toFixed(n<1e7?1:0)+'M'; return (n/1e9).toFixed(2)+'B'; }

/* ============ STORAGE (guarded) ============ */
const STORE='busybeavers_v1';
function save(){ try{ const d={ money:G.money, up:G.up, zones:G.zonesUnlocked, rate:G.incomeRate, totalEarned:G.totalEarned, t:Date.now() }; localStorage.setItem(STORE,JSON.stringify(d)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(STORE); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ============ CRAZYGAMES SDK (guarded) ============ */
const SDK=(window.CrazyGames&&window.CrazyGames.SDK)?window.CrazyGames.SDK:null;
let sdkReady=false;
(async function(){ try{ if(SDK&&SDK.init){ await SDK.init(); sdkReady=true; } }catch(e){ sdkReady=false; } })();
const sdkStart=function(){ try{ SDK&&SDK.game&&SDK.game.gameplayStart&&SDK.game.gameplayStart(); }catch(e){} };
const sdkStop =function(){ try{ SDK&&SDK.game&&SDK.game.gameplayStop&&SDK.game.gameplayStop(); }catch(e){} };
const sdkHappy=function(){ try{ SDK&&SDK.game&&SDK.game.happytime&&SDK.game.happytime(); }catch(e){} };
function sdkRewarded(cb){ try{ if(SDK&&SDK.ad&&SDK.ad.requestAd){ SDK.ad.requestAd('rewarded',{adFinished:function(){cb(true);},adError:function(){cb(false);},adStarted:function(){sdkStop();}}); } else cb(false); }catch(e){ cb(false); } }

/* ============ AUDIO (procedural) ============ */
const AU={ctx:null,master:null,muted:false,last:{}};
function auInit(){ if(AU.ctx)return; try{ const AC=window.AudioContext||window.webkitAudioContext; AU.ctx=new AC(); AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.55; AU.master.connect(AU.ctx.destination);}catch(e){} }
function auResume(){ try{ AU.ctx&&AU.ctx.state==='suspended'&&AU.ctx.resume(); }catch(e){} }
function tone(f,dur,type,vol,slide){ if(!AU.ctx||AU.muted)return; const t=AU.ctx.currentTime; const o=AU.ctx.createOscillator(),g=AU.ctx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g);g.connect(AU.master); o.start(t);o.stop(t+dur+0.02); }
function noise(dur,vol,freq){ if(!AU.ctx||AU.muted)return; const t=AU.ctx.currentTime; const n=Math.floor(AU.ctx.sampleRate*dur); const b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); const s=AU.ctx.createBufferSource();s.buffer=b; const f=AU.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900; const g=AU.ctx.createGain();g.gain.value=vol||0.25; s.connect(f);f.connect(g);g.connect(AU.master); s.start(t); }
function thr(k,ms){ const t=performance.now(); if((AU.last[k]||0)+ms>t)return false; AU.last[k]=t; return true; }
const sfx={
  chop:function(){ if(thr('chop',70)){ noise(0.06,0.16,700); tone(160,0.07,'triangle',0.10,90);} },
  fell:function(){ noise(0.3,0.2,500); tone(110,0.3,'sine',0.14,55); },
  coin:function(){ if(thr('coin',45)){ tone(880,0.05,'square',0.05,1320); tone(1320,0.06,'square',0.04,1760);} },
  buy:function(){ [523,659,784].forEach(function(f,i){ setTimeout(function(){tone(f,0.12,'triangle',0.12);},i*55); }); },
  unlock:function(){ [392,523,659,784,1046].forEach(function(f,i){ setTimeout(function(){tone(f,0.16,'triangle',0.14);},i*70); }); },
  err:function(){ tone(180,0.12,'sawtooth',0.08,120); },
};

/* ============ CANVAS ============ */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
canvas.addEventListener('contextlost',function(e){ e.preventDefault(); },false);
canvas.addEventListener('contextrestored',function(){ resize(); },false);
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){ W=innerWidth;H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize);
if(window.visualViewport){ window.visualViewport.addEventListener('resize',resize); window.visualViewport.addEventListener('scroll',resize); }
resize();

/* ============ STATE ============ */
const MENU=0,PLAY=1;
let state=MENU;
const G={ money:0, totalEarned:0, up:{power:1,speed:1,capacity:1,price:1,worker:1,wspeed:1},
  zonesUnlocked:1, frenzy:0, incomeRate:0, _gain:0, _gainT:0, started:false };
const cam={x:0,y:0};
const shake={mag:0};
let trees=[], logs=[], workers=[], parts=[], floats=[], decos=[];
let player=null;
let worldMaxX=CFG.zoneW;
const joy={active:false,id:null,ox:0,oy:0,dx:0,dy:0,max:60};
const keys=Object.create(null);

/* derived stats */
function chopPower(){ return CFG.player.chop + (G.up.power-1)*8; }
function moveSpeed(){ return CFG.player.speed + (G.up.speed-1)*18; }
function capacity(){ return CFG.player.capacity + (G.up.capacity-1)*4; }
function sellMult(){ return 1 + (G.up.price-1)*0.25; }
function workerSpeed(){ return CFG.worker.speed + (G.up.wspeed-1)*20; }
function workerChop(){ return CFG.worker.chop + (G.up.wspeed-1)*4; }
function workerCap(){ return CFG.worker.capacity + (G.up.capacity-1)*4; }
function frenzyMul(){ return G.frenzy>0?CFG.frenzyMult:1; }

/* ============ WORLD ============ */
const sellZone={ x:CFG.zoneW*0.5, y:CFG.zoneH*0.58, r:92 };
function spawnZoneTrees(zi){
  const z=ZONES[zi], t=z.tree, x0=zi*CFG.zoneW;
  for(let i=0;i<z.treeCount;i++){
    let tx,ty,ok=false,tries=0;
    while(!ok&&tries++<40){
      tx=x0+rnd(90,CFG.zoneW-90); ty=rnd(90,CFG.zoneH-90);
      ok=true;
      if(zi===0 && Math.hypot(tx-sellZone.x,ty-sellZone.y)<200) ok=false;
      for(const o of trees){ if(o.zone===zi && Math.hypot(tx-o.x,ty-o.y)<92){ ok=false; break; } }
    }
    const d=TREES[t];
    trees.push({ x:tx,y:ty,zone:zi,type:t,hp:d.hp,maxhp:d.hp,dead:false,regrow:0,wob:0,targeted:0,reveal: zi===0?1:0 });
  }
  for(let i=0;i<16;i++){ decos.push({ x:x0+rnd(40,CFG.zoneW-40), y:rnd(40,CFG.zoneH-40), k:rndi(0,2), s:rnd(0.8,1.3), zone:zi }); }
}
function unlockZone(zi){
  if(zi>=ZONES.length||zi<G.zonesUnlocked) return;
  G.zonesUnlocked=zi+1; worldMaxX=G.zonesUnlocked*CFG.zoneW;
  spawnZoneTrees(zi);
  // reveal animation handled per-tree (reveal grows)
  for(let i=0;i<40;i++){ const a=rnd(TAU),sp=rnd(60,260); addPart(zi*CFG.zoneW+CFG.zoneW*0.5, CFG.zoneH*0.5, Math.cos(a)*sp, Math.sin(a)*sp, rnd(0.5,1.0), rnd(4,9), pickConfetti()); }
  floatTxt(player.x, player.y-46, 'NEW FOREST!', '#ffd54a', 30);
  shake.mag=Math.max(shake.mag,10); sfx.unlock(); sdkHappy(); save();
}
function pickConfetti(){ return ['#ffd54a','#46b94e','#56c6e8','#e7604c','#ffffff'][rndi(0,4)]; }

function initWorld(){
  trees=[]; logs=[]; workers=[]; parts=[]; floats=[]; decos=[];
  worldMaxX=G.zonesUnlocked*CFG.zoneW;
  for(let zi=0; zi<G.zonesUnlocked; zi++) spawnZoneTrees(zi);
  player={ x:sellZone.x, y:sellZone.y+150, facing:1, carry:[], chopT:0, swing:0, sellT:0 };
  // restore workers from upgrade level
  const wn=G.up.worker-1;
  for(let i=0;i<wn;i++) addWorker();
  cam.x=player.x; cam.y=player.y;
}
function addWorker(){
  if(workers.length>=CFG.caps.workers) return;
  const sp=sellZone;
  workers.push({ x:sp.x+rnd(-60,60), y:sp.y+rnd(-60,60), facing:1, state:'seek', target:null,
    carry:[], chopT:0, swing:0, t:rnd(0,1) });
}

/* ============ FX ============ */
function addPart(x,y,vx,vy,life,size,color){ if(parts.length>=CFG.caps.particles)parts.shift(); parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,color:color}); }
function floatTxt(x,y,txt,color,size){ if(floats.length>=CFG.caps.floats)floats.shift(); floats.push({x:x,y:y,txt:txt,color:color,size:size||20,life:0.9,max:0.9}); }

/* ============ ECONOMY ============ */
function addMoney(a){ G.money+=a; G.totalEarned+=a; G._gain+=a; }
function upgCost(u){ return Math.floor(u.base*Math.pow(u.growth, G.up[u.key]-1)); }
function buyUpgrade(key){
  const u=UPG.find(function(x){return x.key===key;}); const lvl=G.up[key];
  if(lvl>=u.max){ sfx.err(); return; }
  const cost=upgCost(u);
  if(G.money<cost){ sfx.err(); flashRow(key); return; }
  G.money-=cost; G.up[key]++;
  if(key==='worker') addWorker();
  sfx.buy(); floatTxt(player.x,player.y-50,'UPGRADED!','#56c6e8',22);
  refreshShop(); save();
}

/* ============ LOGS / COLLECTION ============ */
function dropLogs(tree){
  const v=TREES[tree.type].value;
  for(let i=0;i<CFG.logsPerTree;i++){
    if(logs.length>=CFG.caps.logs) logs.shift();
    const a=rnd(TAU),sp=rnd(40,120);
    logs.push({ x:tree.x+rnd(-12,12), y:tree.y+rnd(-12,12), vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, value:v, target:null });
  }
}
function collectorCap(c){ return c===player?capacity():workerCap(); }
function collectorMag(c){ return c===player?CFG.player.magnet:CFG.worker.magnet; }
function updateLogs(dt){
  for(let i=logs.length-1;i>=0;i--){
    const L=logs[i];
    if(L.target){ const c=L.target; if(c.carry.length>=collectorCap(c)){ L.target=null; } }
    if(!L.target){
      L.vx*=0.86; L.vy*=0.86; L.x+=L.vx*dt; L.y+=L.vy*dt;
      let best=null,bd=1e18;
      if(player.carry.length<capacity()){ const d=(player.x-L.x)*(player.x-L.x)+(player.y-L.y)*(player.y-L.y); if(d<CFG.player.magnet*CFG.player.magnet&&d<bd){bd=d;best=player;} }
      for(const w of workers){ if(w.carry.length<workerCap()){ const d=(w.x-L.x)*(w.x-L.x)+(w.y-L.y)*(w.y-L.y); if(d<CFG.worker.magnet*CFG.worker.magnet&&d<bd){bd=d;best=w;} } }
      if(best)L.target=best;
    } else {
      const c=L.target, dx=c.x-L.x, dy=c.y-L.y, d=Math.hypot(dx,dy)||0.001;
      const sp=Math.min(640,260+ (collectorMag(c)-d)*5);
      L.x+=dx/d*sp*dt; L.y+=dy/d*sp*dt;
      if(d<16){ if(c.carry.length<collectorCap(c)) c.carry.push(L.value); logs.splice(i,1); }
    }
  }
}

/* ============ TREES ============ */
function nearestTree(x,y,range,untargeted){
  let best=null,bd=range*range;
  for(const t of trees){ if(t.dead||t.zone>=G.zonesUnlocked)continue; if(untargeted&&t.targeted)continue;
    const d=(t.x-x)*(t.x-x)+(t.y-y)*(t.y-y); if(d<bd){bd=d;best=t;} }
  return best;
}
function chopTree(t,power){
  if(t.dead)return; t.hp-=power; t.wob=0.22;
  const d=TREES[t.type];
  for(let i=0;i<2;i++) addPart(t.x+rnd(-10,10),t.y-rnd(0,30),rnd(-60,60),rnd(-120,-30),rnd(0.3,0.6),rnd(3,6), Math.random()<0.5?d.leaf:d.trunk);
  sfx.chop();
  if(t.hp<=0) fellTree(t);
}
function fellTree(t){
  t.dead=true; t.regrow=TREES[t.type].regrow; t.targeted=0;
  dropLogs(t); sfx.fell(); shake.mag=Math.max(shake.mag,3.5);
  const d=TREES[t.type];
  for(let i=0;i<10;i++){ const a=rnd(TAU),sp=rnd(40,170); addPart(t.x,t.y-20,Math.cos(a)*sp,Math.sin(a)*sp,rnd(0.4,0.8),rnd(3,7), Math.random()<0.5?d.leaf:d.trunk); }
}
function updateTrees(dt){
  for(const t of trees){
    if(t.reveal<1) t.reveal=Math.min(1,t.reveal+dt*1.6);
    if(t.wob>0){ t.wob-=dt*1.4; if(t.wob<0)t.wob=0; }
    if(t.dead){ t.regrow-=dt; if(t.regrow<=0){ t.dead=false; t.hp=t.maxhp; t.reveal=0.4; } }
    if(t.targeted>0) t.targeted-=dt;   // targeting decays
  }
}

/* ============ PLAYER ============ */
function updatePlayer(dt){
  let ix=0,iy=0;
  if(joy.active){ ix=joy.dx/joy.max; iy=joy.dy/joy.max; }
  else { if(keys['a']||keys['arrowleft'])ix-=1; if(keys['d']||keys['arrowright'])ix+=1; if(keys['w']||keys['arrowup'])iy-=1; if(keys['s']||keys['arrowdown'])iy+=1; }
  const il=Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il;}
  if(il>0.05){ player.x+=ix*moveSpeed()*dt; player.y+=iy*moveSpeed()*dt; if(Math.abs(ix)>0.05)player.facing=ix>0?1:-1; }
  player.x=clamp(player.x,40,worldMaxX-40); player.y=clamp(player.y,40,CFG.zoneH-40);

  const tnear=nearestTree(player.x,player.y,84,false);
  if(tnear && player.carry.length<capacity()){
    player.facing=tnear.x>player.x?1:-1;
    player.chopT-=dt; if(player.chopT<=0){ player.swing=0.18; chopTree(tnear,chopPower()); player.chopT=0.32; }
  } else player.chopT=0;
  if(player.swing>0)player.swing-=dt;

  // sell at yard
  if(Math.hypot(player.x-sellZone.x,player.y-sellZone.y)<sellZone.r && player.carry.length>0){
    player.sellT-=dt; if(player.sellT<=0){ const v=player.carry.shift(); const got=v*sellMult()*frenzyMul(); addMoney(got);
      floatTxt(player.x,player.y-40,'+$'+fmt(got),'#3fb950',18); sfx.coin();
      addPart(player.x,player.y-10,rnd(-40,40),rnd(-130,-50),0.5,4,'#ffd54a'); player.sellT=CFG.sellTick; }
  } else player.sellT=0.15;

  // unlock pad
  if(G.zonesUnlocked<ZONES.length){
    const zi=G.zonesUnlocked, padx=zi*CFG.zoneW, pady=CFG.zoneH*0.5;
    if(Math.hypot(player.x-padx,player.y-pady)<78 && G.money>=ZONES[zi].cost){ G.money-=ZONES[zi].cost; unlockZone(zi); }
  }
}

/* ============ WORKERS ============ */
function moveTo(w,tx,ty,dt){ const dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy)||0.001; if(d>2){ w.x+=dx/d*workerSpeed()*dt; w.y+=dy/d*workerSpeed()*dt; if(Math.abs(dx)>1)w.facing=dx>0?1:-1; } return d; }
function updateWorkers(dt){
  for(const w of workers){
    if(w.swing>0)w.swing-=dt;
    if(w.state==='seek'){
      if(w.carry.length>=workerCap()){ w.state='haul'; }
      else { if(!w.target||w.target.dead){ w.target=nearestTree(w.x,w.y,99999,true); }
        if(w.target){ w.target.targeted=0.6; const d=moveTo(w,w.target.x,w.target.y,dt); if(d<72)w.state='chop'; }
        else { w.t+=dt; moveTo(w, sellZone.x+Math.sin(w.t*1.3)*130, sellZone.y+Math.cos(w.t*1.7)*130, dt); } }
    } else if(w.state==='chop'){
      if(!w.target||w.target.dead||w.carry.length>=workerCap()){ w.target=null; w.state=w.carry.length>0?'haul':'seek'; }
      else { w.target.targeted=0.6; const d=moveTo(w,w.target.x,w.target.y,dt);
        if(d<70){ w.chopT-=dt; if(w.chopT<=0){ w.swing=0.18; w.facing=w.target.x>w.x?1:-1; chopTree(w.target,workerChop()); w.chopT=0.4; if(w.target.dead){ w.state='linger'; w.lingerT=0.9; } } } }
    } else if(w.state==='linger'){
      w.lingerT-=dt; if(w.carry.length>=workerCap()||w.lingerT<=0){ w.state=w.carry.length>0?'haul':'seek'; w.target=null; }
    } else if(w.state==='haul'){
      const d=moveTo(w,sellZone.x,sellZone.y,dt);
      if(d<sellZone.r*0.85){ if(w.carry.length>0){ let sum=0; for(const v of w.carry)sum+=v; const got=sum*sellMult()*frenzyMul(); addMoney(got);
        floatTxt(w.x,w.y-40,'+$'+fmt(got),'#3fb950',16); if(thr('wcoin',55))sfx.coin();
        for(let i=0;i<3;i++)addPart(w.x,w.y-10,rnd(-50,50),rnd(-120,-40),0.5,4,'#ffd54a'); }
        w.carry=[]; w.state='seek'; w.target=null; }
    }
  }
}

/* ============ FX UPDATE ============ */
function updateParts(dt){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.vy+=240*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; } }
function updateFloats(dt){ for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y-=46*dt; if(f.life<=0)floats.splice(i,1); } }

/* ============ INPUT ============ */
function hitFab(){ return false; }
canvas.addEventListener('pointerdown',function(e){ auInit(); auResume(); if(state!==PLAY)return; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} joy.active=true; joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=0; joy.dy=0; });
canvas.addEventListener('pointermove',function(e){ if(!joy.active||e.pointerId!==joy.id)return; let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy; const d=Math.hypot(dx,dy); if(d>joy.max){dx=dx/d*joy.max;dy=dy/d*joy.max;} joy.dx=dx;joy.dy=dy; });
function endJoy(e){ if(e.pointerId===joy.id){ joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; } }
canvas.addEventListener('pointerup',endJoy); canvas.addEventListener('pointercancel',endJoy);
addEventListener('keydown',function(e){ const k=e.key.toLowerCase(); keys[k]=true; if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright'||k===' ')e.preventDefault(); });
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });

/* ============ MAIN UPDATE ============ */
let saveT=0;
function update(dt){
  updatePlayer(dt);
  updateWorkers(dt);
  updateTrees(dt);
  updateLogs(dt);
  updateParts(dt); updateFloats(dt);

  if(G.frenzy>0){ G.frenzy-=dt; if(G.frenzy<=0){ G.frenzy=0; frenzyReset(); } updateFrenzyClock(); }

  cam.x=lerp(cam.x,player.x,Math.min(1,dt*6)); cam.y=lerp(cam.y,player.y,Math.min(1,dt*6));
  const halfW=W/2,halfH=H/2;
  cam.x = worldMaxX>W ? clamp(cam.x,halfW,worldMaxX-halfW) : worldMaxX/2;
  cam.y = CFG.zoneH>H ? clamp(cam.y,halfH,CFG.zoneH-halfH) : CFG.zoneH/2;
  shake.mag*=0.86; if(shake.mag<0.1)shake.mag=0;

  G._gainT+=dt; if(G._gainT>=1){ G.incomeRate=lerp(G.incomeRate,G._gain/G._gainT,0.4); G._gain=0; G._gainT=0; }
  saveT+=dt; if(saveT>=5){ saveT=0; save(); }
  syncHUD();
}

/* ============ RENDER ============ */
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function render(){
  const camX=cam.x+(shake.mag?rnd(-shake.mag,shake.mag):0);
  const camY=cam.y+(shake.mag?rnd(-shake.mag,shake.mag):0);
  const sX=function(x){return x-camX+W/2;}, sY=function(y){return y-camY+H/2;};
  // grass
  ctx.fillStyle='#6cb544'; ctx.fillRect(0,0,W,H);
  // checker
  const gs=120, x0=Math.floor((camX-W/2)/gs)*gs, y0=Math.floor((camY-H/2)/gs)*gs;
  ctx.fillStyle='rgba(0,0,0,0.045)';
  for(let x=x0;x<camX+W/2+gs;x+=gs)for(let y=y0;y<camY+H/2+gs;y+=gs){ if(((x/gs)+(y/gs))%2===0) ctx.fillRect(sX(x),sY(y),gs,gs); }
  // locked zones fog
  for(let zi=G.zonesUnlocked; zi<ZONES.length; zi++){ const zx=sX(zi*CFG.zoneW); ctx.fillStyle='rgba(22,46,18,0.62)'; ctx.fillRect(zx,sY(0),CFG.zoneW,CFG.zoneH); }
  // world fence
  ctx.lineWidth=12; ctx.strokeStyle='#5e4023'; ctx.lineJoin='round';
  rr(sX(0),sY(0),worldMaxX,CFG.zoneH,26); ctx.stroke();
  ctx.lineWidth=4; ctx.strokeStyle='#7a542f'; rr(sX(0),sY(0),worldMaxX,CFG.zoneH,26); ctx.stroke();
  // decorations
  for(const d of decos){ if(d.zone>=G.zonesUnlocked)continue; const x=sX(d.x),y=sY(d.y); if(x<-40||x>W+40||y<-40||y>H+40)continue; drawDeco(x,y,d); }
  // sell zone
  drawSellZone(sX(sellZone.x),sY(sellZone.y));
  // unlock pad
  if(G.zonesUnlocked<ZONES.length) drawPad(G.zonesUnlocked, sX(G.zonesUnlocked*CFG.zoneW), sY(CFG.zoneH*0.5));
  // logs (ground)
  ctx.lineWidth=1;
  for(const L of logs){ const x=sX(L.x),y=sY(L.y); if(x<-20||x>W+20||y<-20||y>H+20)continue; drawLog(x,y); }
  // z-sorted trees + beavers
  const ents=[];
  for(const t of trees){ if(t.zone>=G.zonesUnlocked)continue; const x=sX(t.x); if(x<-120||x>W+120)continue; const y=sY(t.y); if(y<-160||y>H+120)continue; ents.push({y:t.y,d:t,kind:'tree',sx:x,sy:y}); }
  ents.push({y:player.y,d:player,kind:'beaver',sx:sX(player.x),sy:sY(player.y)});
  for(const w of workers){ const x=sX(w.x),y=sY(w.y); if(x<-60||x>W+60||y<-60||y>H+60)continue; ents.push({y:w.y,d:w,kind:'worker',sx:x,sy:y}); }
  ents.sort(function(a,b){return a.y-b.y;});
  for(const e of ents){ if(e.kind==='tree')drawTree(e.d,e.sx,e.sy); else drawBeaver(e.sx,e.sy,e.d.facing,e.d.swing,e.d.carry.length,e.kind==='worker'); }
  // particles
  for(const p of parts){ const x=sX(p.x),y=sY(p.y); ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; ctx.fillRect(x-p.size/2,y-p.size/2,p.size,p.size); } ctx.globalAlpha=1;
  // floats
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floats){ const a=clamp(f.life/f.max,0,1); ctx.font='700 '+f.size+'px Fredoka, sans-serif'; ctx.lineWidth=4; ctx.strokeStyle=hexA('#3a2a18',a*0.75); ctx.strokeText(f.txt,sX(f.x),sY(f.y)); ctx.fillStyle=hexA(f.color,a); ctx.fillText(f.txt,sX(f.x),sY(f.y)); }
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.22)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // frenzy tint
  if(G.frenzy>0){ ctx.fillStyle=hexA('#ffd54a',0.06+0.03*Math.sin(performance.now()*0.008)); ctx.fillRect(0,0,W,H); }
  if(joy.active) drawJoy();
}
function drawDeco(x,y,d){
  if(d.k===0){ ctx.fillStyle='#3f8f3a'; ctx.beginPath(); ctx.arc(x,y,10*d.s,0,TAU); ctx.arc(x-8*d.s,y+3,8*d.s,0,TAU); ctx.arc(x+8*d.s,y+3,8*d.s,0,TAU); ctx.fill(); }
  else if(d.k===1){ ctx.fillStyle='#9aa0a6'; ctx.strokeStyle='#7c8288'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x,y,10*d.s,7*d.s,0,0,TAU); ctx.fill(); ctx.stroke(); }
  else { ctx.strokeStyle='#3f8f3a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-10*d.s); ctx.stroke(); ctx.fillStyle=['#ff7eb6','#ffd54a','#ff8a5c'][Math.floor(d.x)%3]; ctx.beginPath(); ctx.arc(x,y-12*d.s,4*d.s,0,TAU); ctx.fill(); }
}
function drawSellZone(x,y){
  const pulse=Math.sin(performance.now()*0.003)*6;
  ctx.fillStyle='rgba(255,185,56,0.18)'; ctx.beginPath(); ctx.arc(x,y,sellZone.r+pulse,0,TAU); ctx.fill();
  ctx.setLineDash([14,10]); ctx.lineWidth=4; ctx.strokeStyle='rgba(230,148,18,0.7)'; ctx.beginPath(); ctx.arc(x,y,sellZone.r+pulse,0,TAU); ctx.stroke(); ctx.setLineDash([]);
  // wooden platform
  ctx.fillStyle='#8a5a2b'; ctx.strokeStyle='#6e4521'; ctx.lineWidth=3; rr(x-46,y-8,92,44,10); ctx.fill(); ctx.stroke();
  for(let i=0;i<4;i++){ ctx.strokeStyle='#6e4521'; ctx.beginPath(); ctx.moveTo(x-46,y-8+ (i+1)*8.8); ctx.lineTo(x+46,y-8+ (i+1)*8.8); ctx.stroke(); }
  // coin
  ctx.fillStyle='#ffce4d'; ctx.strokeStyle='#e69412'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y-26,16,0,TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#a86b00'; ctx.font='700 19px Fredoka, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',x,y-25);
  // label
  ctx.fillStyle='#fff'; ctx.font='700 15px Fredoka, sans-serif'; ctx.lineWidth=4; ctx.strokeStyle='rgba(60,40,20,.6)'; ctx.strokeText('LUMBER YARD',x,y-52); ctx.fillText('LUMBER YARD',x,y-52);
}
function drawPad(zi,x,y){
  const afford=G.money>=ZONES[zi].cost;
  // post
  ctx.fillStyle='#7a542f'; rr(x-4,y-6,8,54,3); ctx.fill();
  // sign
  ctx.fillStyle=afford?'#46b94e':'#caa06a'; ctx.strokeStyle=afford?'#2f8a37':'#a8916f'; ctx.lineWidth=3; rr(x-58,y-58,116,52,12); ctx.fill(); ctx.stroke();
  // lock
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x-34,y-38,7,Math.PI,TAU); ctx.stroke(); ctx.fillStyle='#fff'; rr(x-42,y-34,16,14,3); ctx.fill();
  // price
  ctx.fillStyle='#fff'; ctx.font='700 18px Fredoka, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('$'+fmt(ZONES[zi].cost),x-18,y-31);
  ctx.font='600 10px Fredoka, sans-serif'; ctx.textAlign='center'; ctx.fillText(afford?'WALK HERE TO OPEN':'NEW FOREST',x,y-13);
}
function drawLog(x,y){ ctx.save(); ctx.translate(x,y); ctx.rotate(0.6); ctx.fillStyle='#9a6531'; ctx.strokeStyle='#6e4521'; ctx.lineWidth=1.5; rr(-9,-4,18,8,3); ctx.fill(); ctx.stroke(); ctx.fillStyle='#caa06a'; ctx.beginPath(); ctx.arc(9,0,2.4,0,TAU); ctx.fill(); ctx.restore(); }
function drawTree(t,x,y){
  const d=TREES[t.type], sc=t.scale!==undefined?1:1, rev=t.reveal;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(x,y+26,30*d.scale,13*d.scale,0,0,TAU); ctx.fill();
  if(t.dead){ ctx.fillStyle='#7a4f29'; ctx.beginPath(); ctx.ellipse(x,y+14,18,9,0,0,TAU); ctx.fill(); ctx.fillStyle='#9a6531'; ctx.beginPath(); ctx.ellipse(x,y+11,15,7,0,0,TAU); ctx.fill(); ctx.strokeStyle='#6e4521'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y+11,6,0,TAU); ctx.stroke(); return; }
  ctx.save(); ctx.translate(x,y+26); ctx.scale(rev,rev); ctx.translate(0,-26);
  if(t.wob>0) ctx.rotate(Math.sin(performance.now()*0.04)*0.06*(t.wob/0.22));
  // trunk
  ctx.fillStyle=d.trunk; ctx.strokeStyle=hexA('#000',0.12); ctx.lineWidth=2; rr(-7*d.scale,-6,14*d.scale,34,4); ctx.fill();
  // leaves
  if(d.kind==='pine'){ ctx.fillStyle=d.leaf; ctx.strokeStyle=d.leaf2; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ const yy=-18-i*22*d.scale, wdt=(38-i*9)*d.scale; ctx.beginPath(); ctx.moveTo(0,yy-26*d.scale); ctx.lineTo(wdt,yy+4); ctx.lineTo(-wdt,yy+4); ctx.closePath(); ctx.fill(); ctx.stroke(); } }
  else { ctx.fillStyle=d.leaf; ctx.strokeStyle=d.leaf2; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-44*d.scale,30*d.scale,0,TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-22*d.scale,-26*d.scale,24*d.scale,0,TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(22*d.scale,-26*d.scale,24*d.scale,0,TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-30*d.scale,26*d.scale,0,TAU); ctx.fill(); }
  ctx.restore();
  if(t.hp<t.maxhp){ const pct=t.hp/t.maxhp; ctx.fillStyle='rgba(0,0,0,.45)'; rr(x-26,y-78,52,8,4); ctx.fill(); ctx.fillStyle=pct>0.5?'#5fe06b':'#ff7a59'; rr(x-24,y-77,48*pct,6,3); ctx.fill(); }
}
function drawBeaver(x,y,facing,swing,carry,worker){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(0,22,19,8,0,0,TAU); ctx.fill();
  // tail
  ctx.save(); ctx.fillStyle='#6e4a2b'; ctx.strokeStyle='#56391f'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(-facing*15,11,11,7,0,0,TAU); ctx.fill(); ctx.stroke(); ctx.restore();
  // body
  const bodyC=worker?'#a8763f':'#9a6a3c';
  ctx.fillStyle=bodyC; ctx.strokeStyle='#6e4a2b'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(0,3,16,18,0,0,TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#caa06a'; ctx.beginPath(); ctx.ellipse(0,8,9,11,0,0,TAU); ctx.fill();
  // backpack bump
  if(carry>0){ const g=Math.min(1,carry/12); ctx.fillStyle='#8a5a2b'; ctx.strokeStyle='#6e4521'; ctx.lineWidth=2; rr(-facing*14-7,-2,14,16+g*10,4); ctx.fill(); ctx.stroke(); }
  // head
  ctx.fillStyle=bodyC; ctx.strokeStyle='#6e4a2b'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,-13,12.5,0,TAU); ctx.fill(); ctx.stroke();
  // ears
  ctx.fillStyle=bodyC; ctx.beginPath(); ctx.arc(-8,-22,4,0,TAU); ctx.arc(8,-22,4,0,TAU); ctx.fill(); ctx.strokeStyle='#6e4a2b'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(-8,-22,4,0,TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(8,-22,4,0,TAU); ctx.stroke();
  // muzzle
  ctx.fillStyle='#dcb781'; ctx.beginPath(); ctx.ellipse(0,-9,8,6,0,0,TAU); ctx.fill();
  // teeth
  ctx.fillStyle='#fff'; rr(-3.4,-6,3,4,1); ctx.fill(); rr(0.4,-6,3,4,1); ctx.fill();
  // nose
  ctx.fillStyle='#4a3526'; ctx.beginPath(); ctx.arc(0,-12,2.4,0,TAU); ctx.fill();
  // eyes
  ctx.beginPath(); ctx.arc(-5,-17,1.9,0,TAU); ctx.arc(5,-17,1.9,0,TAU); ctx.fill();
  // hat
  if(worker){ ctx.fillStyle='#ffb938'; ctx.strokeStyle='#e69412'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-21,11,Math.PI,TAU); ctx.fill(); ctx.stroke(); rr(-13,-22,26,4,2); ctx.fill(); ctx.stroke(); }
  else { ctx.fillStyle='#e7604c'; ctx.strokeStyle='#c4452f'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-20,11,Math.PI,TAU*0.5+Math.PI); ctx.fill(); ctx.beginPath(); ctx.arc(0,-23,11,Math.PI,TAU); ctx.fill(); ctx.stroke(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-34,3.5,0,TAU); ctx.fill(); }
  // arm + axe
  ctx.save(); ctx.scale(facing,1); ctx.translate(12,3);
  if(swing>0){ const p=swing/0.18; ctx.rotate(-Math.sin(p*Math.PI)*1.4+0.3); } else ctx.rotate(0.4);
  ctx.fillStyle='#caa06a'; ctx.strokeStyle='#6e4a2b'; ctx.lineWidth=1.5; rr(0,-4,15,8,4); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8a5a2b'; rr(12,-18,5,34,2); ctx.fill();
  ctx.fillStyle='#b8c0c8'; ctx.strokeStyle='#8a929a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(9,-16); ctx.lineTo(24,-22); ctx.lineTo(27,-8); ctx.lineTo(13,-4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function drawJoy(){ const ox=joy.ox,oy=joy.oy; ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(ox,oy,joy.max,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ox,oy,joy.max,0,TAU); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(ox+joy.dx,oy+joy.dy,20,0,TAU); ctx.fill(); }

/* ============ UI ============ */
function $(id){ return document.getElementById(id); }
function syncHUD(){ $('ui-money').textContent=fmt(G.money); $('ui-pack').textContent=player.carry.length+' / '+capacity(); }
function buildShop(){
  const wrap=$('shop-rows'); wrap.innerHTML='';
  UPG.forEach(function(u){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<div class="em">'+u.em+'</div><div class="mid"><div class="nm">'+u.name+'</div><div class="lv" id="lv-'+u.key+'"></div></div>';
    const btn=document.createElement('button'); btn.className='buy'; btn.id='buy-'+u.key;
    btn.addEventListener('click',function(){ buyUpgrade(u.key); });
    row.appendChild(btn); wrap.appendChild(row);
    u._btn=btn;
  });
  refreshShop();
}
function refreshShop(){
  UPG.forEach(function(u){
    const lvl=G.up[u.key]; const lvEl=$('lv-'+u.key); const btn=u._btn;
    if(u.key==='worker'){ lvEl.innerHTML='Beavers: <b>'+(lvl-1)+'</b>'; } else { lvEl.innerHTML='Level <b>'+lvl+'</b>'; }
    if(lvl>=u.max){ btn.className='buy max'; btn.innerHTML='MAX'; }
    else { const cost=upgCost(u); btn.className='buy'+(G.money>=cost?'':' cant'); btn.innerHTML='<span class="c">$'+fmt(cost)+'</span>'; }
  });
}
function flashRow(){}
function setMuteIcon(){ $('mute').textContent=AU.muted?'🔇':'🔊'; }

/* ============ FRENZY ============ */
function frenzyActivate(){
  if(G.frenzy>0)return;
  sdkRewarded(function(ok){
    if(!(ok||!sdkReady)) return;
    G.frenzy=CFG.frenzyDur;
    const b=$('frenzy'); b.classList.remove('glow'); b.classList.add('active'); b.querySelector('.t').textContent='🔥 FRENZY';
    $('frenzy-s').textContent=Math.ceil(G.frenzy)+'s left';
    for(let i=0;i<30;i++){ const a=rnd(TAU),sp=rnd(60,240); addPart(player.x,player.y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(0.4,0.8),rnd(4,8),pickConfetti()); }
    floatTxt(player.x,player.y-50,'2× FRENZY!','#ffd54a',26); sfx.unlock(); sdkHappy();
  });
}
function updateFrenzyClock(){ if(G.frenzy>0) $('frenzy-s').textContent=Math.ceil(G.frenzy)+'s left'; }
function frenzyReset(){ const b=$('frenzy'); b.classList.add('glow'); b.classList.remove('active'); b.querySelector('.t').textContent='▶ 2× FRENZY'; $('frenzy-s').textContent='Watch ad · 60s'; }

/* ============ OFFLINE ============ */
let offlinePending=0;
function computeOffline(s){ if(!s||!s.t)return 0; const el=clamp((Date.now()-s.t)/1000,0,CFG.offlineMax); return Math.floor((s.rate||0)*el*CFG.offlineEff); }
function showOffline(a){ $('off-amt').textContent='$'+fmt(a); $('offline').classList.add('show'); }
function grantOffline(mult){ const a=offlinePending*mult; G.money+=a; G.totalEarned+=a; offlinePending=0; $('offline').classList.remove('show'); sfx.coin(); syncHUD(); save(); }

/* ============ LOOP ============ */
let last=performance.now();
function frame(t){ requestAnimationFrame(frame); let dt=(t-last)/1000; last=t; if(dt>0.1)dt=0.1; if(dt<0)dt=0; if(state===PLAY)update(dt); render(); }

/* ============ BOOT ============ */
function boot(){
  const s=load();
  if(s){ G.money=s.money||0; G.up=Object.assign({power:1,speed:1,capacity:1,price:1,worker:1,wspeed:1}, s.up||{}); G.zonesUnlocked=clamp(s.zones||1,1,ZONES.length); G.incomeRate=s.rate||0; G.totalEarned=s.totalEarned||0; }
  offlinePending=computeOffline(s);
  initWorld();
  buildShop(); syncHUD(); setMuteIcon();
  $('intro').classList.add('show');

  $('intro-play').addEventListener('click',function(){ auInit(); auResume(); $('intro').classList.remove('show'); state=PLAY; G.started=true; sdkStart(); last=performance.now(); if(offlinePending>0) showOffline(offlinePending); });
  $('shopFab').addEventListener('click',function(){ refreshShop(); $('shop').classList.add('show'); });
  $('shop-x').addEventListener('click',function(){ $('shop').classList.remove('show'); });
  $('frenzy').addEventListener('click',function(){ auInit(); auResume(); frenzyActivate(); });
  $('mute').addEventListener('click',function(){ auInit(); AU.muted=!AU.muted; if(AU.master)AU.master.gain.value=AU.muted?0:0.55; setMuteIcon(); });
  $('off-collect').addEventListener('click',function(){ grantOffline(1); });
  $('off-double').addEventListener('click',function(){ sdkRewarded(function(ok){ grantOffline((ok||!sdkReady)?2:1); }); });

  document.addEventListener('visibilitychange',function(){ if(document.hidden){ save(); sdkStop(); } else { if(state===PLAY)sdkStart(); } });
  addEventListener('beforeunload',save);

  requestAnimationFrame(frame);
}
boot();
})();
</script>
