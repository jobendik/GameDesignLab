<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Tom Run", instructions:"Swipe up to jump, down to slide, left/right to change lane.", restart:start});
let lanes,hero,obs,t,score,speed;
function start(){lanes=3;hero={lane:1,y:0,vy:0,sliding:0};obs=[];t=0;score=0;speed=260;Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{
    if(Math.abs(dx)>Math.abs(dy)){hero.lane=Lab.clamp(hero.lane+(dx>0?1:-1),0,lanes-1);}
    else{if(dy<0&&hero.y===0){hero.vy=-700;}else if(dy>0){hero.sliding=0.6;}}
  }];
  Lab.loop((dt)=>{t+=dt;score=Math.floor(t*20);Lab.setScore(score);speed+=4*dt;
    hero.vy+=1500*dt;hero.y+=hero.vy*dt;if(hero.y>0){hero.y=0;hero.vy=0;}
    if(hero.sliding>0)hero.sliding-=dt;
    if(Math.random()<dt*1.6)obs.push({lane:Lab.randInt(0,lanes-1),z:0,kind:Lab.choose(["jump","slide","wall"])});
    for(const o of obs){o.z+=speed*dt;
      if(o.z>Lab.H*0.7&&o.z<Lab.H*0.8&&o.lane===hero.lane){
        if(o.kind==="jump"&&hero.y===0){Lab.gameover({title:"Tripped",message:"Score: "+score});return;}
        if(o.kind==="slide"&&hero.sliding<=0){Lab.gameover({title:"Smacked",message:"Score: "+score});return;}
        if(o.kind==="wall"&&hero.y===0&&hero.sliding<=0){Lab.gameover({title:"Smacked",message:"Score: "+score});return;}
      }
    }
    obs=obs.filter(o=>o.z<Lab.H);
    draw();
  });
}
function laneX(l,z){const cx=Lab.W/2;const spread=Lab.W*0.4*(z/Lab.H+0.2);return cx+(l-1)*spread;}
function draw(){const c=Lab.ctx;c.fillStyle="#2a4a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.strokeStyle="#fff";for(let l=0;l<=lanes;l++){c.beginPath();c.moveTo(Lab.W/2+(l-1.5)*30,180);c.lineTo(laneX(l-0.5,Lab.H),Lab.H);c.stroke();}
  for(const o of obs){const x=laneX(o.lane,o.z);const sc=0.2+o.z/Lab.H;
    c.fillStyle=o.kind==="jump"?"#888":o.kind==="slide"?"#fc5":"#f55";c.fillRect(x-30*sc,o.z-40*sc+180,60*sc,40*sc);}
  const hx=laneX(hero.lane,Lab.H*0.7);
  c.fillStyle="#fc5";c.fillRect(hx-20,Lab.H*0.7+180-50+hero.y,40,50-(hero.sliding>0?20:0));
}
start();
</script></body></html>
