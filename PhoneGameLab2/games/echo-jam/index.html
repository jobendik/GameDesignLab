(function(){ "use strict";

const SYM = { momo: "circle", nori: "tri", pip: "star", bun: "heart", bolt: "diamond" };
const TWIST = {

  swap: { n: "Swap!", say: "Watch who hops!", col: "#5fd39a" }, add: { n: "New note!", say: "Just the new note…", col: "#3ec5ff" },

/* ---------- layout ---------- */
