<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sliding Pets", instructions:"Drag blocks to slide them. Get the red one out the right.", restart:start});
const N=6;let blocks,sel;
function start(){blocks=[
  {r:2,c:0,len:2,h:false,key:true,col:"#f55"},
  {r:0,c:0,len:3,h:true,col:"#5cf"},
  {r:3,c:1,len:2,h:true,col:"#fc5"},
  {r:1,c:3,len:2,h:false,col:"#5f8"},
  {r:4,c:4,len:2,h:true,col:"#a4f"},
  {r:2,c:4,len:2,h:false,col:"#fa5"}
];sel=null;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{const s=size(),o=off();for(const b of blocks){const w=b.h?b.len*s:s,h=b.h?s:b.len*s;
    if(x>=o.x+b.c*s&&x<=o.x+b.c*s+w&&y>=o.y+b.r*s&&y<=o.y+b.r*s+h){sel={b,sx:x,sy:y,or:b.r,oc:b.c};return;}}}];
  Lab.input.onMove=[(x,y)=>{if(!sel)return;const s=size();
    if(sel.b.h){const nc=sel.oc+Math.round((x-sel.sx)/s);trySet(sel.b,sel.b.r,nc);}
    else{const nr=sel.or+Math.round((y-sel.sy)/s);trySet(sel.b,nr,sel.b.c);}
  }];
  Lab.input.onUp=[()=>{sel=null;
    const key=blocks[0];if(key.c+key.len>=N){Lab.win("Out!");}}];
  Lab.loop(()=>draw());
}
function trySet(b,nr,nc){const w=b.h?b.len:1,h=b.h?1:b.len;if(nr<0||nc<0||nr+h>N||nc+w>N)return;
  for(const o of blocks){if(o===b)continue;const ow=o.h?o.len:1,oh=o.h?1:o.len;
    if(nc<o.c+ow&&nc+w>o.c&&nr<o.r+oh&&nr+h>o.r)return;}
  b.r=nr;b.c=nc;}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#2a2030";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();c.strokeStyle="#444";for(let i=0;i<=N;i++){c.beginPath();c.moveTo(o.x+i*s,o.y);c.lineTo(o.x+i*s,o.y+N*s);c.stroke();c.beginPath();c.moveTo(o.x,o.y+i*s);c.lineTo(o.x+N*s,o.y+i*s);c.stroke();}
  for(const b of blocks){const w=b.h?b.len*s:s,h=b.h?s:b.len*s;c.fillStyle=b.col;c.fillRect(o.x+b.c*s+4,o.y+b.r*s+4,w-8,h-8);}
}
start();
</script></body></html>
