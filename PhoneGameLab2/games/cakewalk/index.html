<title>Cakewalk</title>

</head><body><script>
(function(){ "use strict";
/* CAKEWALK — Momo the frog is the bakery's waiter: Bun tosses cake layers out of the kitchen hatch and Momo catches
 * them on the plate he balances on his head. Core idea kept: build a tall cake out of falling layers.
 * The verb is new: nothing is "dropped on a timer" — you WALK the tower under each layer. Every layer is a springy
 * follower of the one below, so the stack lags when Momo sets off and whips when he stops; a layer whose centre slides
 * past the edge underneath takes everything above it to the floor. Gentle steps keep a tall cake; a dash saves a far
 * layer and risks the lot. Sloppy catches sit off-centre and eat the margin, perfect catches calm the sway.
 * Each cake is a recipe (N layers, then the cherry) that is served to the shelf; neat cakes win a heart back.
 * Later: jelly layers (wobblier), wide wafers (steadier), a pepper pot to step away from (ACHOO!), two things in the air.
 * World is laid out in units (1 u = S px), origin on the floor, so a resize never disturbs the cake.              */
let demo = false;
Lab.init({
  title: "Cakewalk", tagline: "Catch the cake on Momo's head. Walk gently!", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Drag to walk Momo under the falling layer", "Sudden moves make the tower sway", "Catch the cherry to serve the cake"],
  theme: { bg: "#bfe6d8", bg2: "#eaf7ef", fg: "#34304a", muted: "#5d7078", accent: "#ff7a59", accent2: "#36a873", light: true },
  orient: "any", music: { style: "march", key: "F", bpm: 104, vol: .3 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, rand = Lab.rand, shade = Lab.color.shade, INK = Pals.ink;
const MOMO = 74, PLATE = -86, PLW = 104, VMAX = 560, K0 = 400, ZETA = .45, STEP = 1 / 120;
const FLAV = ["#ff9bb0", "#ffe3a1", "#b9774a", "#a6e3c4", "#a9b8ff", "#ffb37a"];
const TYPES = { sponge: { w: 96, h: 24, k: 1 }, jelly: { w: 92, h: 24, k: .55 }, wafer: { w: 122, h: 14, k: 1.3 }, cherry: { w: 22, h: 22 }, pepper: { w: 24, h: 34 } };
let S, VW, floorY, sillY, wide;
let momo, stack, falls, debris, decals, shelf, serving, recipe, bun, phase, hearts, score, cake, served, combo, bestCombo, perfects,
  danger, worst, creakT, acc, lastPepper, clock, endT, auto;

const px = x => x * S, py = y => floorY + y * S;
function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function layout() {
  const P = Lab.play; wide = P.w > P.h * 1.15;
  S = Math.min(P.w / 390, P.h / (wide ? 480 : 700)); VW = Lab.W / S; floorY = P.y + P.h - 46 * S;
  sillY = Math.max((P.y + 108 * S - floorY) / S, -600);
  Lab.sprite.clear("cw");
}
Lab.onResize(() => { if (!stack) return; const o = VW; layout(); const d = (VW - o) / 2; momo.x = clamp(momo.x + d, 40, VW - 40); momo.tx = momo.x; for (const L of stack) L.x += d; for (const f of falls) f.x += d; for (const f of debris) f.x += d; decals.length = 0; });

function start() { demo = false; reset(); Lab.setScore(0);
  Lab.input.onDown = [x => { momo.tx = x / S; }];
  Lab.input.onMove = [x => { if (Lab.input.down) momo.tx = x / S; }];
  Lab.expose({
    get score() { return score; }, get hearts() { return hearts; }, get cake() { return cake; }, get served() { return served; }, get phase() { return phase; },
    get danger() { return danger; }, get combo() { return combo; }, get need() { return recipe.length; }, get momoX() { return momo.x * S; }, get topX() { return topX() * S; },
    get stack() { return stack.map(L => ({ x: L.x * S, off: L.off, type: L.type })); },
    get falls() { return falls.map(f => ({ kind: f.kind, x: f.x * S, y: py(f.y), land: landX(f) * S, live: !f.bounced && !f.free })); },
    toss(kind, landPx, T) { toss(kind === "layer" ? { kind, type: "sponge", col: 0 } : { kind }, landPx / S, T || .9); },
    hold(on) { auto = !on; bun.hold = null; }, setCake(n) { cake = n; recipe = makeRecipe(); stack.length = 0; }, floorY: () => floorY, S: () => S,
  });
  Lab.loop(frame);
}
function reset() {
  layout();
  momo = { x: VW / 2, tx: VW / 2, v: 0, sq: 0, joyT: 0, sadT: 0, dizzyT: 0 };
  stack = []; falls = []; debris = []; decals = []; shelf = []; serving = null; phase = "play"; hearts = 3; score = 0; cake = 0; served = 0; combo = 0; bestCombo = 0; perfects = 0;
  danger = 0; worst = -1; creakT = 0; acc = 0; lastPepper = true; clock = 0; endT = 0; auto = true;
  recipe = makeRecipe(); bun = { hold: null, wind: 0, dur: 1, gap: .7, aim: 0, thrown: 0, oopsT: 0, joyT: 0, sq: 0 };
}
function makeRecipe() {
  const n = Math.min(3 + cake, wide ? 7 : 8), r = []; let col = -1;
  for (let i = 0; i < n; i++) { let k; do k = Lab.randInt(0, FLAV.length - 1); while (k === col); col = k;
    r.push({ kind: "layer", col, type: i && cake >= 1 && Lab.chance(.2 + cake * .03) ? "jelly" : i && cake >= 2 && Lab.chance(.2) ? "wafer" : "sponge" }); }
  return r;
}
const surf = () => stack.reduce((a, L) => a - L.h, PLATE);
const topX = () => stack.length ? stack[stack.length - 1].x : momo.x, topW = () => stack.length ? stack[stack.length - 1].w : PLW;
function surfFor(f) { let s = surf(); for (const o of falls) if (o !== f && o.kind === "layer" && !o.bounced && (!f || o.y > f.y)) s -= o.h; return s; }

const flightT = () => Math.max(1.0, 1.75 - cake * .1);

function toss(it, tx, T) {
  const d = TYPES[it.kind === "layer" ? it.type : it.kind], by = sillY - 70, A = 26;
  const f = { kind: it.kind, type: it.type, col: it.col, w: d.w, h: d.h, x: VW / 2, y: by, rot: 0, air: 0, bounced: false, free: false, T: T || flightT() };
  const dy = Math.max(30, surfFor(null) - f.h / 2 - by), u = (Math.sqrt(2 * A) + Math.sqrt(2 * A + 2 * dy)) / f.T;
  f.g = u * u; f.vy = -Math.sqrt(2 * f.g * A); f.vx = (tx - f.x) / f.T; falls.push(f);
  snd("whoosh", { pitch: it.kind === "pepper" ? 1.5 : 1.1, vol: .5 }); bun.thrown = .45; bun.sq = -.2;
  if (it.kind === "pepper") { bun.oopsT = 1.1; if (!demo) fx.text(px(VW / 2), py(sillY - 96), "Oops, pepper!", { color: "#e2553f", size: 15 * Math.max(S, .8) }); }
}
function director(dt) {
  if (phase !== "play" || !auto) return;
  if (bun.hold) { bun.wind -= dt; if (bun.wind <= 0) { toss(bun.hold, bun.aim); bun.hold = null; bun.gap = .28; } return; }
  bun.gap -= dt; if (bun.gap > 0) return;
  const air = falls.filter(f => !f.bounced && !f.free); if (air.length >= (cake >= 3 ? 2 : 1) || air.length && air[0].air < air[0].T * .55) return;
  const have = stack.length + air.filter(f => f.kind === "layer").length, N = recipe.length, T = flightT();
  let it, aim;
  if (cake >= 2 && !lastPepper && stack.length >= 2 && have <= N && Lab.chance(Math.min(.3, .1 + cake * .03))) { it = { kind: "pepper" }; aim = topX() + rand(-12, 12); }
  else if (have < N) it = recipe[have]; else if (!air.some(f => f.kind === "cherry")) it = { kind: "cherry" }; else return;
  if (!aim) { const R = cake === 0 ? 20 + have * 34 : Math.min(330, 110 + cake * 30, T * 235), c = VW / 2; aim = clamp(topX() + rand(-R, R), Math.max(64, c - 400), Math.min(VW - 64, c + 400)); }
  lastPepper = it.kind === "pepper"; bun.hold = it; bun.aim = aim; bun.dur = bun.wind = Math.max(.3, .55 - cake * .03);
}

function springs(h) {
  let dg = 0; worst = -1;
  for (let i = 0; i < stack.length; i++) {
    const L = stack[i], bx = i ? stack[i - 1].x : momo.x, K = K0 * TYPES[L.type].k / (1 + i * .1), D = 2 * Math.sqrt(K) * ZETA;
    L.v += (K * (bx + L.off - L.x) - D * L.v) * h; L.x += L.v * h;
    const lim = Math.min(L.w, i ? stack[i - 1].w : PLW) * .5, rel = Math.abs(L.x - bx) / lim;

  }
  danger = dg;
}
function spill(L, y, dir, kick) { debris.push({ kind: "layer", type: L.type, col: L.col, w: L.w, h: L.h, x: L.x, y, vx: L.v * .5 + dir * rand(70, 190) * kick, vy: -rand(40, 200) * kick, rot: 0, vr: dir * rand(1.5, 5) }); }
function topple(i) {
  const dir = Math.sign(stack[i].x - (i ? stack[i - 1].x : momo.x)) || 1; let y = surf();
  const gone = stack.splice(i); for (let j = gone.length - 1; j >= 0; j--) { y += gone[j].h; spill(gone[j], y - gone[j].h / 2, dir, 1); }

  combo = 0; momo.sadT = 1.2; bun.oopsT = 1.3; bun.gap = 1; bun.hold = null; snd("crunch"); snd("slide", { pitch: .7 }); Lab.shake(8, .3); Lab.buzz(30);
  if (!demo) fx.text(px(momo.x), py(surf() - 40), "Whoops!", { color: "#e2553f", size: 22 * Math.max(S, .8) });

}
function loseHeart() { if (demo) return; hearts--; if (hearts <= 0 && phase === "play") { phase = "end"; endT = 0; let y = PLATE; for (const L of stack) { y -= L.h; spill(L, y + L.h / 2, Lab.chance(.5) ? 1 : -1, .6); } stack = []; momo.dizzyT = 9; momo.sq = .3; snd("splash", { pitch: .7 }); Lab.shake(12, .5); } }

function landOn(f) {
  const dx = f.x - topX(), tw = topW();
  if (f.kind === "pepper") { if (Math.abs(dx) < (tw + f.w) * .45) { sneeze(f); return true; } return false; }
  const tol = f.kind === "cherry" ? tw * .46 : Math.min(tw, f.w) * .46;
  if (Math.abs(dx) <= tol) { catchIt(f, dx); return true; }
  if (Math.abs(dx) < (tw + f.w) / 2) { f.bounced = true; f.vx = Math.sign(dx) * 150 + f.vx * .3; f.vy = -190; if (stack.length) stack[stack.length - 1].v -= Math.sign(dx) * 50; snd("knock", { pitch: 1.2 }); fx.text(px(f.x), py(f.y) - 14, "so close!", { color: "#8a6f7d", size: 13 * Math.max(S, .8) }); }

}
function catchIt(f, dx) {

  momo.sq = .22; for (const L of stack) L.sq = Math.max(L.sq, .14);
  if (perfect) { combo++; perfects++; bestCombo = Math.max(bestCombo, combo); momo.joyT = .7; bun.joyT = .8; for (const L of stack) L.v *= .45; } else combo = 0;
  if (f.kind === "cherry") { score += 20 + (perfect ? 15 : 0); serve(); snd("pop", { pitch: 1.5 }); return; }
  const gain = 10 + stack.length * 2 + (perfect ? 10 + 5 * Math.min(combo, 8) : 0);
  score += gain; if (!demo) { Lab.setScore(score); if (perfect) Lab.bumpScore(); }
  stack.push({ type: f.type, col: f.col, w: f.w, h: f.h, x: topX() + (perfect ? 0 : dx * .85), off: perfect ? 0 : dx * .85, v: f.vx * .22, sq: .34 });
  snd("thud", { pitch: 1.35 - stack.length * .06 }); if (f.type === "jelly") snd("boing", { pitch: 1.3, vol: .5 }); Lab.buzz(10);
  fx.burst(X, Y, { n: perfect ? 12 : 5, colors: [FLAV[f.col], "#fff"], speed: perfect ? 190 : 110, life: .45, size: 3 * S, gravity: 500, shape: perfect ? "star" : "circle" });
  if (perfect) { if (!demo) Lab.audio.combo(combo, { vol: .22 }); fx.ring(X, Y, { r0: 10, r1: 60 * S, color: "#fff", width: 4 }); }
  if (!demo) fx.text(X, Y - 26 * S, perfect ? (combo > 1 ? "Perfect ×" + combo : "Perfect!") + "  +" + gain : "+" + gain, { color: perfect ? "#ff7a59" : "#5d7078", size: (perfect ? 19 : 15) * Math.max(S, .8) });
}
function sneeze(f) {
  const dir = Lab.chance(.5) ? 1 : -1; stack.forEach((L, i) => { L.v += dir * (430 + i * 70); L.sq = .2; }); momo.dizzyT = .9; momo.sq = .3; combo = 0;
  snd("whoosh", { pitch: 1.8 }); snd("boing", { pitch: .8 }); Lab.shake(6, .25);
  fx.burst(px(f.x), py(f.y), { n: 16, colors: ["#8a7f72", "#d9cfc0"], speed: 170, life: .6, size: 2.5 * S, gravity: 120 }); if (!demo) fx.text(px(momo.x), py(-MOMO - 6), "ACHOO!", { color: "#e2553f", size: 22 * Math.max(S, .8) });
}
function serve() {
  const n = stack.length, neat = n ? clamp(1 - stack.reduce((a, L) => a + Math.abs(L.off), 0) / n / 40, 0, 1) : 1, bonus = Math.round((40 + n * 20) * (.5 + neat) / 5) * 5;
  score += bonus; served++; phase = "serve"; momo.joyT = 1.4; bun.joyT = 1.6; bun.hold = null;
  serving = { layers: stack.map(L => ({ type: L.type, col: L.col, w: L.w, h: L.h, off: L.x - momo.x })), t: 0, x0: momo.x, slot: (served - 1) % slots() };
  stack = []; if (demo) return;
  Lab.setScore(score); Lab.bumpScore(); snd("levelup"); Lab.buzz(20);
  fx.text(px(momo.x), py(PLATE - n * 24 - 50), "Served!  +" + bonus, { color: "#ff7a59", size: 24 * Math.max(S, .8), life: 1.4 });
  if (neat >= .8 && hearts < 3) { hearts++; Lab.toast("Neat cake — a heart back!", 1400, { y: .3 }); } else Lab.toast("Neatness " + Math.round(neat * 100) + "%", 1100, { y: .3 });

const slots = () => Math.max(2, Math.min(8, Math.floor((VW / 2 - 84) / 42) * 2));
function slotX(i) { const side = i % 2 ? 1 : -1, j = i >> 1; return VW / 2 + side * (104 + j * 42); }

function update(dt) {
  clock += dt;
  const k = demo ? 0 : Lab.input.axisX(); if (k) momo.tx = clamp(momo.x + k * 150, 40, VW - 40);
  if (demo) { const f = falls.filter(o => !o.bounced && o.kind !== "pepper").sort((a, b) => b.y - a.y)[0]; let goal = f ? momo.x + landX(f) - topX() : VW / 2; momo.tx = Lab.approach(momo.tx, clamp(goal, 50, VW - 50), 250 * dt); }
  const des = phase === "end" ? 0 : clamp((clamp(momo.tx, 40, VW - 40) - momo.x) * 9, -VMAX, VMAX); momo.v = Lab.damp(momo.v, des, 10, dt); momo.x = clamp(momo.x + momo.v * dt, 40, VW - 40);
  momo.sq = Lab.damp(momo.sq, 0, 9, dt); momo.joyT -= dt; momo.sadT -= dt; momo.dizzyT -= dt; bun.thrown -= dt; bun.oopsT -= dt; bun.joyT -= dt; bun.sq = Lab.damp(bun.sq, 0, 8, dt);

      else { splat(f.x, f.kind === "cherry" ? "#e2334f" : FLAV[f.col], f.w); if (!f.free && phase === "play") { combo = 0; momo.sadT = 1; bun.oopsT = 1; bun.gap = .5; loseHeart(); } } }
  }

  for (const d of debris) { d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; if (d.y + d.h / 2 >= 0) { d.dead = true; splat(d.x, FLAV[d.col], d.w); } }
  debris = debris.filter(d => !d.dead); for (const d of decals) d.a -= dt * .12; decals = decals.filter(d => d.a > 0);

function splat(x, col, w) {

/* ---------- drawing ---------- */

    g.translate(pad, pad); const c = FLAV[col], r = Math.min(8 * S, h * .4), rnd = Lab.rng(col * 13 + wu);

    if (type === "jelly") { draw.rect(g, 0, 0, w, h, r * 1.3, Lab.color.alpha(shade(c, -.08), .82), shade(c, -.3), 1.5 * S); draw.rect(g, 5 * S, 3 * S, w - 10 * S, 4 * S, 2 * S, "rgba(255,255,255,.6)"); g.fillStyle = "rgba(255,255,255,.35)"; for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(w * (.12 + rnd() * .76), h * (.5 + rnd() * .3), (1.5 + rnd() * 2) * S, 0, TAU); g.fill(); } return; }
    draw.rect(g, 0, 0, w, h, r, shade(c, -.1), shade(c, -.38), 1.5 * S); draw.rect(g, 1.5 * S, h * .52, w - 3 * S, 3 * S, 1, "rgba(255,255,255,.75)");

  });
}
function drawItem(c, o, X, Y, sc, rot, sq) {
