<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Castle Craft", instructions:"Tap palette to pick a block. Tap canvas to place it. Build your castle!", restart:start});
let blocks,sel;
const PAL=[{c:"#bfa172",t:"wall"},{c:"#7a4f2c",t:"door"},{c:"#f55",t:"flag"},{c:"#3df58a",t:"bush"},{c:"#5cf",t:"window"}];
function start(){blocks=[];sel=0;Lab.setScore(blocks.length);
  Lab.input.onTap=[(x,y)=>{
    if(y>Lab.H-80){const i=Math.floor(x/(Lab.W/PAL.length));if(i>=0&&i<PAL.length){sel=i;return;}}
    blocks.push({x:Math.round(x/30)*30-15,y:Math.round(y/30)*30-15,type:sel});Lab.setScore(blocks.length);Lab.beep(500,.04);
  }];
  Lab.input.onSwipe=[(dx,dy,dt,x,y)=>{if(y>Lab.H-80)return;
    // undo last by long swipe down
    if(dy>60 && Math.abs(dx)<30) blocks.pop();}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#2a2240";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#0d4";c.fillRect(0,Lab.H-110,Lab.W,30);
  for(const b of blocks){const p=PAL[b.type];c.fillStyle=p.c;
    if(p.t==="bush"){c.beginPath();c.arc(b.x+15,b.y+15,15,0,Lab.TAU);c.fill();}
    else if(p.t==="flag"){c.fillRect(b.x+13,b.y,4,30);c.fillRect(b.x+17,b.y,14,10);}
    else c.fillRect(b.x,b.y,30,30);}
  for(let i=0;i<PAL.length;i++){const x=i*(Lab.W/PAL.length);c.fillStyle=PAL[i].c;c.fillRect(x+8,Lab.H-70,Lab.W/PAL.length-16,60);
    if(i===sel){c.strokeStyle="#fff";c.lineWidth=3;c.strokeRect(x+8,Lab.H-70,Lab.W/PAL.length-16,60);}}
  c.fillStyle="#fff8";c.font="11px sans-serif";c.textAlign="center";c.fillText("swipe down to undo",Lab.W/2,Lab.H-78);
}
start();
</script></body></html>
