(function(){ "use strict";
/* BUN VOYAGE — Bun's bakery stall sits under the balloon route. Pals drift over in hot-air balloons calling for their

 *     it smacks the basket bottom. So you LEAD a moving, bobbing basket by the lob's hang time.

 *   - Wind (from round 2) drifts the lob — the preview arc ignores it, the bunting and arrow show it.
 *   - Combo ×1…×5 for deliveries in a row, swish bonus for the dead centre, higher baskets pay more.
 *   Rounds: 2 → 3 bakes, more and faster balloons, double orders (round 3), gusts and goose flocks that knock bakes away (4+).
 * Identity: sunny pastel morning, striped pink awning, wicker baskets, balloons striped in each passenger's colours.

  theme: { bg: "#8fd6f5", bg2: "#fff2d6", fg: "#4a3160", muted: "#7d6a8f", accent: "#ff7fa8", accent2: "#b9a3ff", light: true },
  orient: "any", music: { style: "bounce", key: "E", vol: .4 }, restart: start,

const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, INK = Pals.ink;

Lab.onResize(() => { if (balloons) { const oy = [yTop, yBot]; layout(); for (const b of balloons) b.y0 = lerp(yTop, yBot, clamp((b.y0 - oy[0]) / Math.max(1, oy[1] - oy[0]), 0, 1)); } });

/* ---------- state ---------- */

  Lab.hint("Touch the top of the lob, let go to throw", {});
  Lab.expose({
    get score() { return score; }, get hearts() { return hearts; }, set hearts(v) { hearts = v; }, get round() { return round; }, get delivered() { return delivered; }, get combo() { return combo; }, get total() { return total; },
    get cur() { return cur; }, get next() { return next; }, get swaps() { return swaps; }, swap: () => swap(), get bun() { return [bunX, bunY]; }, get cool() { return cool; }, get wind() { return wind; }, get quota() { return quota; },
    balloons: () => balloons.map(b => ({ id: b.id, who: b.who, x: b.x, y: b.y, vx: b.vx, want: b.want.slice(), got: b.got, done: b.done })),

    setCur(t) { cur = t; }, setWind(w) { wind = windTo = w; windT = 999; }, pause(v) { spawnT = v ? 1e9 : 1; birdT = v ? 1e9 : 5; }, lob: (x, y) => lob(x, y), hand,

const nextX = () => bunX + Math.min(P.w - 20, 300 * S) / 2 - 34 * S;

}

/* ---------- lobbing ---------- */

/* ---------- art ---------- */

  const mood = b.no > 0 ? "angry" : b.joy > 0 ? "joy" : b.sad > 0 ? "sad" : "happy";

  c.strokeStyle = "#8a5a2f"; c.lineWidth = 1.5; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-24 * S, -13 * S + i * 6.5 * S); c.lineTo(24 * S, -13 * S + i * 6.5 * S); c.stroke(); }
  c.fillStyle = "#d9a66a"; draw.rr(c, -26 * S, -15 * S, 52 * S, 5 * S, 2.5 * S); c.fill();
  for (let i = 0; i < b.got; i++) { const s = bakeSprite(b.want[i]); c.drawImage(s, -14 * S + i * 12 * S - s.w * .35, -24 * S, s.w * .7, s.h * .7); }
  c.restore();

}

  for (let i = 0; i < 9; i++) { const u = (i + .5) / 9, px = sx - w / 2 + u * w, py = y - 150 * S + Math.sin(u * Math.PI) * 11 * S, fl = k * 9 * S + Math.sin(clock * 6 + i) * 2 * S * (.3 + Math.abs(k)); c.fillStyle = ["#ff7fa8", "#ffd23f", "#b9a3ff", "#7fd1ff"][i % 4]; c.beginPath(); c.moveTo(px - 6 * S, py); c.lineTo(px + 6 * S, py); c.lineTo(px + fl, py + 14 * S); c.fill(); }

}
function render(t) {
  const c = Lab.ctx; draw.bg(c, "#8fd6f5", "#fff2d6", "#c6ecfb");
  draw.glow(c, W * .82, P.y + 60 * S, 120 * S, "#fff6c2", .7); draw.circle(c, W * .82, P.y + 60 * S, 26 * S, "#fff3b0");

    c.strokeStyle = cool > 0 ? "rgba(255,255,255,.5)" : "#ff7fa8"; c.lineWidth = 3; c.beginPath(); c.arc(aim[0], aim[1], 14 * S, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(aim[0] - 20 * S, aim[1]); c.lineTo(aim[0] - 8 * S, aim[1]); c.moveTo(aim[0] + 8 * S, aim[1]); c.lineTo(aim[0] + 20 * S, aim[1]); c.stroke();
  }

  const thr = bun.throwT > 0, mood = over ? "sad" : bun.sad > 0 ? "sad" : bun.joy > 0 ? "joy" : showAim ? "think" : bun.hot > .3 ? "scared" : "happy";
  const lk = showAim ? [clamp((aim[0] - bunX) / 150, -1, 1), -1] : parcels.length ? [clamp((parcels[0].x - bunX) / 150, -1, 1), clamp((parcels[0].y - bunY) / 200, -1, 1)] : [0, -.6];
  const an = Pals.draw(c, "bun", bunX, bunY, 62 * S, { t: clock, mood, look: lk, arms: thr ? "up" : bun.joy > 0 ? "cheer" : "hold", squash: clamp(bun.sq, -.3, .3), hot: bun.hot || 0, tilt: thr ? .12 : 0 });
  if (!thr && cool <= .25 && !over && an) { const s = bakeSprite(cur), [hx, hy] = an.handR; c.drawImage(s, (an.handL[0] + hx) / 2 - s.w / 2, Math.max(an.handL[1], hy) - s.h * .45, s.w, s.h); }

  if (combo > 1) draw.text(c, "combo ×" + Math.min(combo, 5), bunX - 70 * S, bunY - 40 * S, { size: 15 * S + 2, color: "#ff5d8f", weight: 800, stroke: "#fff" });
}
