<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Spooky Train", instructions:"Drag up/down to switch tracks. Avoid ghosts.", restart:start});
let train,tracks,ghosts,t,score;
function start(){tracks=3;train={lane:1};ghosts=[];t=0;score=0;Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{if(Math.abs(dy)>Math.abs(dx)){train.lane=Lab.clamp(train.lane+(dy<0?-1:1),0,tracks-1);Lab.beep(500,.04);}}];
  Lab.loop((dt)=>{t+=dt;score=Math.floor(t*10);Lab.setScore(score);
    if(Math.random()<dt*1.6)ghosts.push({lane:Lab.randInt(0,tracks-1),x:Lab.W+30,vx:-Lab.rand(220,320)});
    for(const g of ghosts){g.x+=g.vx*dt;if(g.lane===train.lane && Math.abs(g.x-120)<30){Lab.gameover({title:"Boo!",message:"Score: "+score});return;}}
    ghosts=ghosts.filter(g=>g.x>-40);
    draw();
  });
}
function laneY(l){return 220+l*((Lab.H-280)/tracks);}
function draw(){const c=Lab.ctx;c.fillStyle="#0a0a18";c.fillRect(0,0,Lab.W,Lab.H);
  for(let l=0;l<tracks;l++){c.strokeStyle="#444";c.beginPath();c.moveTo(0,laneY(l));c.lineTo(Lab.W,laneY(l));c.stroke();}
  for(const g of ghosts){c.fillStyle="#9af";c.beginPath();c.arc(g.x,laneY(g.lane),18,0,Lab.TAU);c.fill();
    c.fillStyle="#000";c.beginPath();c.arc(g.x-6,laneY(g.lane)-3,3,0,Lab.TAU);c.fill();c.beginPath();c.arc(g.x+6,laneY(g.lane)-3,3,0,Lab.TAU);c.fill();}
  c.fillStyle="#f55";c.fillRect(100,laneY(train.lane)-18,50,36);
  c.fillStyle="#000";c.fillRect(90,laneY(train.lane)+10,10,8);
}
start();
</script></body></html>
