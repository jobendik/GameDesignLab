(function(){ "use strict";
/* SAY CHEESE — Photo Day at the Pocket Pals club. Bun is behind the camera; group after group climbs the risers and

 *  - Countdown shrinks from 7 s to 3.2 s. A wrong tap startles that pal ("Hey!") and burns 0.8 s.
 *  - Streak: clean photos (no wrong taps) raise the multiplier up to ×3. Points = (50 + time left) × streak.
 *  - A photo with a spoiler still in it is BLURRY and costs one of three film rolls; Bun circles who it was.

const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, INK = Pals.ink;

/* ---------- tick ---------- */
