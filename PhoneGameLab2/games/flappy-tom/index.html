<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Flappy Tom", instructions:"Tap to flap. Don't hit the pipes.", restart:start});
let bird,pipes,score,t;
function start(){bird={x:Lab.W/3,y:Lab.H/2,vy:0,r:16};pipes=[];score=0;t=1;Lab.setScore(0);
  Lab.input.onTap=[()=>{bird.vy=-340;Lab.beep(800,.04);}];
  Lab.loop((dt)=>{bird.vy+=900*dt;bird.y+=bird.vy*dt;t-=dt;
    if(t<=0){t=1.4;const gap=140;const gy=Lab.rand(180,Lab.H-180-gap);pipes.push({x:Lab.W+30,gy,gap,scored:false});}
    for(const p of pipes){p.x-=140*dt;
      if(!p.scored && p.x+24<bird.x){p.scored=true;score++;Lab.setScore(score);Lab.beep(1100,.05);}
      if(Math.abs(p.x-bird.x)<24+bird.r && (bird.y<p.gy||bird.y>p.gy+p.gap)){Lab.gameover({title:"Crash!",message:"Score: "+score});return;}}
    pipes=pipes.filter(p=>p.x>-60);
    if(bird.y>Lab.H-30||bird.y<20){Lab.gameover({title:"Fell!",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a4f78";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of pipes){c.fillStyle="#3a3";c.fillRect(p.x,0,24,p.gy);c.fillRect(p.x,p.gy+p.gap,24,Lab.H-p.gy-p.gap);}
  c.fillStyle="#fc5";c.beginPath();c.arc(bird.x,bird.y,bird.r,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
