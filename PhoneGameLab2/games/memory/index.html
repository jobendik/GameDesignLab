<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Memory", instructions:"Flip 2 cards to find pairs.", restart:start});
const N=4;let cards,flipped,locked,moves;
function start(){const vals=[];for(let i=0;i<N*N/2;i++){vals.push(i);vals.push(i);}
  for(let i=vals.length-1;i>0;i--){const j=Lab.randInt(0,i);[vals[i],vals[j]]=[vals[j],vals[i]];}
  cards=vals.map(v=>({v,faceUp:false,matched:false}));flipped=[];locked=false;moves=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{if(locked)return;const i=hit(x,y);if(i<0)return;
    const card=cards[i];if(card.faceUp||card.matched)return;card.faceUp=true;flipped.push(i);
    Lab.beep(500+card.v*60,.05);
    if(flipped.length===2){moves++;Lab.setScore(moves);
      if(cards[flipped[0]].v===cards[flipped[1]].v){cards[flipped[0]].matched=cards[flipped[1]].matched=true;flipped=[];
        if(cards.every(c=>c.matched))Lab.win("Done in "+moves+" moves");}
      else{locked=true;setTimeout(()=>{cards[flipped[0]].faceUp=false;cards[flipped[1]].faceUp=false;flipped=[];locked=false;},700);}}
  }];
  Lab.loop(()=>draw());
}
function hit(x,y){const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>=N||c<0||c>=N)return -1;return r*N+c;}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#1a223a";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();
  for(let i=0;i<cards.length;i++){const r=Math.floor(i/N),col=i%N;
    const card=cards[i];const x=o.x+col*s+4,y=o.y+r*s+4,w=s-8;
    if(card.matched){c.fillStyle="#2a3a5a";c.fillRect(x,y,w,w);continue;}
    if(card.faceUp){c.fillStyle=`hsl(${card.v*40},70%,55%)`;c.fillRect(x,y,w,w);
      c.fillStyle="#fff";c.font="28px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(card.v+1,x+w/2,y+w/2);}
    else{c.fillStyle="#3a4a7a";c.fillRect(x,y,w,w);
      c.fillStyle="#5a6acc";c.fillRect(x+10,y+10,w-20,w-20);}}
}
start();
</script></body></html>
