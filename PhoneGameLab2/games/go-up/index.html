<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Go Up", instructions:"Drag to steer. Land on platforms to climb.", restart:start});
let hero,plats,score;
function start(){hero={x:Lab.W/2,y:Lab.H-100,vy:0,r:14};plats=[];
  for(let i=0;i<7;i++)plats.push({x:Lab.rand(40,Lab.W-100),y:Lab.H-i*90,w:80,vx:Lab.choose([-60,60])});
  score=0;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)hero.x=Lab.clamp(x,hero.r,Lab.W-hero.r);}];
  Lab.loop((dt)=>{
    hero.vy+=900*dt;hero.y+=hero.vy*dt;
    for(const p of plats){p.x+=p.vx*dt;if(p.x<0||p.x+p.w>Lab.W)p.vx*=-1;}
    for(const p of plats){if(hero.vy>0 && hero.y+hero.r>=p.y && hero.y+hero.r<=p.y+12 && hero.x>p.x && hero.x<p.x+p.w){hero.vy=-580;Lab.beep(600,.04);}}
    // scroll
    if(hero.y<Lab.H/2){const dy=Lab.H/2-hero.y;hero.y+=dy;for(const p of plats)p.y+=dy;score+=Math.floor(dy);Lab.setScore(score);}
    plats=plats.filter(p=>p.y<Lab.H+30);
    while(plats.length<7){const top=Math.min(...plats.map(p=>p.y));plats.push({x:Lab.rand(40,Lab.W-100),y:top-90,w:80,vx:Lab.choose([-60,60])});}
    if(hero.y>Lab.H+30){Lab.gameover({title:"Fell!",message:"Height: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#101a30";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of plats){c.fillStyle="#5cf";c.fillRect(p.x,p.y,p.w,10);}
  c.fillStyle="#fc5";c.beginPath();c.arc(hero.x,hero.y,hero.r,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
