<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bumper Park", instructions:"Drag to drive. Ram opponents off the arena!", restart:start});
const W=()=>Lab.W,H=()=>Lab.H;
let me,bots,score;
function start(){
  me={x:Lab.W/2,y:Lab.H/2,vx:0,vy:0,r:24,col:"#5cf",alive:true};
  bots=[];for(let i=0;i<4;i++)bots.push({x:Lab.rand(80,Lab.W-80),y:Lab.rand(180,Lab.H-80),vx:0,vy:0,r:24,col:`hsl(${i*80+40},80%,60%)`,alive:true});
  score=0;Lab.setScore(0);
  Lab.input.onMove=[(x,y,dx,dy)=>{if(Lab.input.down){me.vx+=dx*0.6;me.vy+=dy*0.6;}}];
  Lab.loop((dt)=>{
    const arena={x:40,y:160,w:Lab.W-80,h:Lab.H-220};
    const all=[me,...bots];
    for(const o of all){if(!o.alive)continue;
      if(o!==me){o.vx+=Lab.rand(-40,40)*dt;o.vy+=Lab.rand(-40,40)*dt;}
      o.vx*=0.98;o.vy*=0.98;o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(o.x<arena.x||o.x>arena.x+arena.w||o.y<arena.y||o.y>arena.y+arena.h){o.alive=false;if(o===me){Lab.gameover({title:"Knocked out!",message:"Score: "+score});return;}else{score++;Lab.setScore(score);Lab.beep(600,.1);}}
    }
    // collisions
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];if(!a.alive||!b.alive)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<a.r+b.r && d>0){const nx=dx/d,ny=dy/d;const p=2*(a.vx*nx+a.vy*ny-b.vx*nx-b.vy*ny)/2;
        a.vx-=p*nx;a.vy-=p*ny;b.vx+=p*nx;b.vy+=p*ny;
        const overlap=(a.r+b.r-d)/2; a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;}
    }
    if(bots.every(b=>!b.alive)){Lab.win("All KO'd! Score: "+score);return;}
    draw(arena);
  });
}
function draw(arena){const c=Lab.ctx;c.fillStyle="#08111c";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#16263a";c.fillRect(arena.x,arena.y,arena.w,arena.h);
  c.strokeStyle="#fff5";c.strokeRect(arena.x,arena.y,arena.w,arena.h);
  for(const o of [me,...bots])if(o.alive){c.fillStyle=o.col;c.beginPath();c.arc(o.x,o.y,o.r,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
