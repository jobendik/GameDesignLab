<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Hole Chase", instructions:"Drag the hole. Swallow circles smaller than you to grow.", restart:start});
let hole,items,t;
function start(){hole={x:Lab.W/2,y:Lab.H/2,r:24};items=[];for(let i=0;i<30;i++)spawn();t=30;Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){hole.x=Lab.clamp(x,hole.r,Lab.W-hole.r);hole.y=Lab.clamp(y,hole.r+140,Lab.H-hole.r);}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Time!",message:"Size: "+Math.floor(hole.r)});return;}
    for(let i=items.length-1;i>=0;i--){const it=items[i];if(Lab.dist(hole.x,hole.y,it.x,it.y)<hole.r){
      if(it.r<hole.r){hole.r+=it.r*0.1;Lab.setScore(Math.floor(hole.r));items.splice(i,1);spawn();Lab.beep(700,.04);}}}
    draw();
  });
}
function spawn(){items.push({x:Lab.rand(40,Lab.W-40),y:Lab.rand(180,Lab.H-40),r:Lab.rand(10,40),c:`hsl(${Lab.randInt(0,360)},60%,55%)`});}
function draw(){const c=Lab.ctx;c.fillStyle="#3a2218";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  for(const it of items){c.fillStyle=it.c;c.beginPath();c.arc(it.x,it.y,it.r,0,Lab.TAU);c.fill();}
  c.fillStyle="#000";c.beginPath();c.arc(hole.x,hole.y,hole.r,0,Lab.TAU);c.fill();
  c.strokeStyle="#222";c.beginPath();c.arc(hole.x,hole.y,hole.r,0,Lab.TAU);c.stroke();
}
start();
</script></body></html>
