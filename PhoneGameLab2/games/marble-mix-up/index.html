<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Marble Mix Up", instructions:"Tap to fire. Match 3+ same-color marbles in the line.", restart:start});
let marbles,bullet,shooter,t,score;
function start(){marbles=[];for(let i=0;i<10;i++)marbles.push({s:i*30,c:Lab.randInt(0,3)});shooter={x:Lab.W/2,y:Lab.H-50,c:Lab.randInt(0,3)};bullet=null;t=0;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{if(bullet)return;const a=Math.atan2(y-shooter.y,x-shooter.x);if(a>-0.05)return;
    bullet={x:shooter.x,y:shooter.y,vx:Math.cos(a)*600,vy:Math.sin(a)*600,c:shooter.c};shooter.c=Lab.randInt(0,3);}];
  Lab.loop((dt)=>{t+=dt;for(const m of marbles)m.s+=20*dt;
    if(marbles.length && marbles[marbles.length-1].s>Math.PI*180){Lab.gameover({title:"Marbles in!",message:"Score: "+score});return;}
    if(bullet){bullet.x+=bullet.vx*dt;bullet.y+=bullet.vy*dt;
      for(let i=0;i<marbles.length;i++){const p=pos(marbles[i].s);if(Lab.dist(p.x,p.y,bullet.x,bullet.y)<20){
        marbles.splice(i,0,{s:marbles[i].s,c:bullet.c});for(let k=i+1;k<marbles.length;k++)marbles[k].s+=30;
        bullet=null;checkMatches(i);break;}}
      if(bullet&&(bullet.y<0||bullet.x<0||bullet.x>Lab.W))bullet=null;}
    if(!marbles.length){Lab.win("Score: "+score);return;}
    draw();
  });
}
function checkMatches(idx){const c=marbles[idx].c;let L=idx,R=idx;while(L>0&&marbles[L-1].c===c)L--;while(R<marbles.length-1&&marbles[R+1].c===c)R++;
  if(R-L>=2){marbles.splice(L,R-L+1);score+=10*(R-L+1);Lab.setScore(score);Lab.beep(1000,.1);}}
function pos(s){const cx=Lab.W/2,cy=240,R=Math.min(Lab.W,Lab.H)*0.32;const a=s/180;return {x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R};}
function draw(){const c=Lab.ctx;c.fillStyle="#10141f";c.fillRect(0,0,Lab.W,Lab.H);
  const cols=["#f55","#5cf","#fc5","#5f8"];
  // path
  c.strokeStyle="#222a44";c.lineWidth=24;c.beginPath();for(let s=0;s<Math.PI*180;s+=10){const p=pos(s);if(s===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y);}c.stroke();c.lineWidth=1;
  for(const m of marbles){const p=pos(m.s);c.fillStyle=cols[m.c];c.beginPath();c.arc(p.x,p.y,14,0,Lab.TAU);c.fill();}
  c.fillStyle=cols[shooter.c];c.beginPath();c.arc(shooter.x,shooter.y,16,0,Lab.TAU);c.fill();
  if(bullet){c.fillStyle=cols[bullet.c];c.beginPath();c.arc(bullet.x,bullet.y,12,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
