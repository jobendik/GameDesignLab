<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Race Car", instructions:"Drag left/right to steer. Avoid traffic.", restart:start});
let car,cars,road,score,t;
function start(){car={x:Lab.W/2,y:Lab.H-100};cars=[];road=0;score=0;t=0;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)car.x=Lab.clamp(x,40,Lab.W-40);}];
  Lab.loop((dt)=>{t+=dt;road+=300*dt;score=Math.floor(road/10);Lab.setScore(score);
    if(Math.random()<dt*1.6)cars.push({x:Lab.rand(40,Lab.W-40),y:-40,vy:Lab.rand(200,300)});
    for(const o of cars){o.y+=o.vy*dt;if(Math.abs(o.x-car.x)<40&&Math.abs(o.y-car.y)<60){Lab.gameover({title:"Crash!",message:"Score: "+score});return;}}
    cars=cars.filter(o=>o.y<Lab.H+40);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#222";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";const off=road%80;
  for(let y=-80;y<Lab.H;y+=80){c.fillRect(Lab.W/2-2,y+off,4,40);}
  c.fillStyle="#5cf";c.fillRect(car.x-22,car.y-30,44,60);
  for(const o of cars){c.fillStyle="#f55";c.fillRect(o.x-22,o.y-30,44,60);}
}
start();
</script></body></html>
