<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Berry Bounce", instructions:"Tap to drop the berry. Bounce off platforms into the basket.", restart:start});
let berry,platforms,basket,scored,drop;
function start(){
  berry={x:Lab.W/2,y:140,r:18,vx:0,vy:0};
  platforms=[]; for(let i=0;i<3;i++) platforms.push({x:Lab.rand(60,Lab.W-160),y:280+i*120,w:Lab.rand(80,140),h:10,a:Lab.rand(-.3,.3)});
  basket={x:Lab.rand(40,Lab.W-110),y:Lab.H-80,w:70};
  drop=false;scored=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(!drop)drop=true;}];
  Lab.loop((dt)=>{
    if(drop){
      berry.vy+=900*dt; berry.x+=berry.vx*dt; berry.y+=berry.vy*dt;
      for(const p of platforms){
        const px=p.x+p.w/2, py=p.y;
        const rx=(berry.x-px)*Math.cos(-p.a)-(berry.y-py)*Math.sin(-p.a);
        const ry=(berry.x-px)*Math.sin(-p.a)+(berry.y-py)*Math.cos(-p.a);
        if(Math.abs(rx)<p.w/2 && ry>-berry.r && ry<6 && berry.vy>0){
          const nx=Math.sin(p.a), ny=-Math.cos(p.a);
          const vdot=berry.vx*nx+berry.vy*ny;
          berry.vx-=2*vdot*nx*0.8; berry.vy-=2*vdot*ny*0.8;
          berry.y=py-berry.r*Math.cos(p.a);
          Lab.beep(600,.04);
        }
      }
      if(berry.y>Lab.H-90 && berry.x>basket.x && berry.x<basket.x+basket.w){
        scored++; Lab.setScore(scored); Lab.beep(1000,.1); reset();
      }
      if(berry.y>Lab.H+30){Lab.gameover({title:"Missed",message:"Caught: "+scored});}
    }
    draw();
  });
}
function reset(){berry.x=Lab.W/2;berry.y=140;berry.vx=berry.vy=0;drop=false;
  basket.x=Lab.rand(40,Lab.W-110);
  for(const p of platforms){p.x=Lab.rand(60,Lab.W-160);p.a=Lab.rand(-.3,.3);}}
function draw(){const c=Lab.ctx;c.fillStyle="#1a2235";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of platforms){c.save();c.translate(p.x+p.w/2,p.y);c.rotate(p.a);c.fillStyle="#7af";c.fillRect(-p.w/2,0,p.w,p.h);c.restore();}
  c.fillStyle="#8b5a2b";c.fillRect(basket.x,basket.y,basket.w,30);
  c.fillStyle="#e44";c.beginPath();c.arc(berry.x,berry.y,berry.r,0,Lab.TAU);c.fill();
  c.fillStyle="#5a2";c.fillRect(berry.x-3,berry.y-berry.r-6,6,8);
}
start();
</script></body></html>
