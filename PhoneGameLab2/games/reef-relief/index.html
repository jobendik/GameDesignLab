(function(){ "use strict";
/* REEF RELIEF — Nori the penguin runs a little salvage boat. A grabber claw swings under the keel like a pendulum;

 *          Hauling the heavy drum itself plugs the leak: slow now, more time later.
 *          SEA CREATURES must not be grabbed: fish, turtles and jellies wander between you and the junk. A grab is let go

  tyre: { r: 21, w: 1.5, val: 60, bed: 1 }, net: { r: 22, w: 1.9, val: 80, bed: 1 }, drum: { r: 23, w: 2.6, val: 100, bed: 1 },

const SEAS = [
  { sky: ["#9fe0ff", "#eafaff"], top: "#66d4e4", deep: "#14679b", sand: "#f3d9a0", sun: "#fff3b0", fg: "#1e2850" },
  { sky: ["#74cdf7", "#d6f5ff"], top: "#4fcbc2", deep: "#0f5f86", sand: "#f6e3b4", sun: "#fffbe0", fg: "#1e2850" },
  { sky: ["#ff9f7a", "#ffe3b8"], top: "#77b9d8", deep: "#2d4d92", sand: "#ecc9a2", sun: "#fff1c1", fg: "#3b2340" },
  { sky: ["#252a66", "#5a58a6"], top: "#3d74b4", deep: "#131a4c", sand: "#b7aed0", sun: "#fdf6c3", fg: "#f4f1ff", night: 1 },

Lab.onResize(layout);

function setup() {

  claw = { st: "swing", ph: 0, th: 0, vth: 0, len: 40, open: 1, item: null, t: 0, stretch: 0 };
  nori = { joy: 0, oops: 0, wow: 0, sq: 0, strain: 0, crank: 0 }; boat = { dip: 0, tilt: 0 }; bub = []; fly = []; trash = []; crit = [];

}

    sp: kind === "fish" ? Lab.rand(38, 76) : kind === "turtle" ? Lab.rand(18, 28) : Lab.rand(5, 10), ph: Lab.rand(0, TAU), oy: 0, dart: 0, free: 0, col: Lab.choose(FISHC) });

/* ---------- claw ---------- */

}
/* What is at (x,y) for a claw of the current size? Creatures first: they swim in front of the junk. */
