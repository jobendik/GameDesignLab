<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Busy Bugs", instructions:"Tap bugs before they reach the picnic.", restart:start});
let bugs,food,t,score,life;
function start(){bugs=[];food={x:Lab.W/2,y:Lab.H/2,r:50};t=0;score=0;life=3;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{for(const b of bugs){if(!b.dead&&Lab.dist(x,y,b.x,b.y)<18){b.dead=true;score++;Lab.setScore(score);Lab.beep(800,.04);}}}];
  Lab.loop((dt)=>{
    t+=dt;if(Math.random()<dt*(1.2+t*0.05)){
      const a=Lab.rand(0,Lab.TAU),d=Math.max(Lab.W,Lab.H);
      bugs.push({x:food.x+Math.cos(a)*d,y:food.y+Math.sin(a)*d,sp:Lab.rand(50,110),dead:false});}
    for(const b of bugs){if(b.dead)continue;
      const dx=food.x-b.x,dy=food.y-b.y,d=Math.hypot(dx,dy);
      b.x+=dx/d*b.sp*dt;b.y+=dy/d*b.sp*dt;
      if(d<food.r){b.dead=true;life--;Lab.toast("-1",500);if(life<=0){Lab.gameover({title:"Picnic ruined",message:"Saved: "+score});return;}}
    }
    bugs=bugs.filter(b=>!b.dead||b.x<-50);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#1c3a1c";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Life: "+life,12,Lab.H-12);
  c.fillStyle="#fc5";c.beginPath();c.arc(food.x,food.y,food.r,0,Lab.TAU);c.fill();
  for(const b of bugs)if(!b.dead){c.fillStyle="#222";c.beginPath();c.arc(b.x,b.y,12,0,Lab.TAU);c.fill();
    c.fillStyle="#f50";c.fillRect(b.x-2,b.y-2,4,4);}
}
start();
</script></body></html>
