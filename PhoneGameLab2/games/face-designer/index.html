<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Face Designer", instructions:"Pick a color. Drag to paint make-up on the face.", restart:start});
let strokes,sel,colors;
function start(){strokes=[];sel=0;colors=["#f48","#5cf","#fc5","#5f8","#a4f","#fff","#000"];Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{if(y>Lab.H-70){const i=Math.floor(x/(Lab.W/colors.length));if(i>=0&&i<colors.length){sel=i;return;}}
    strokes.push({c:colors[sel],pts:[{x,y}]});}];
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down && y<Lab.H-70 && strokes.length){strokes[strokes.length-1].pts.push({x,y});}}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#10141f";c.fillRect(0,0,Lab.W,Lab.H);
  // face
  const cx=Lab.W/2, cy=Lab.H/2;
  c.fillStyle="#fea";c.beginPath();c.ellipse(cx,cy,Math.min(Lab.W,Lab.H)*0.35,Math.min(Lab.W,Lab.H)*0.42,0,0,Lab.TAU);c.fill();
  // strokes (clip to face)
  c.save();c.beginPath();c.ellipse(cx,cy,Math.min(Lab.W,Lab.H)*0.35,Math.min(Lab.W,Lab.H)*0.42,0,0,Lab.TAU);c.clip();
  for(const s of strokes){c.strokeStyle=s.c;c.lineWidth=8;c.lineCap="round";c.beginPath();
    for(let i=0;i<s.pts.length;i++){const p=s.pts[i];if(i===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y);}c.stroke();}
  c.restore();
  // facial features overlay
  c.fillStyle="#000";c.beginPath();c.arc(cx-40,cy-30,6,0,Lab.TAU);c.arc(cx+40,cy-30,6,0,Lab.TAU);c.fill();
  c.strokeStyle="#000";c.lineWidth=2;c.beginPath();c.arc(cx,cy+30,30,0,Math.PI);c.stroke();
  // palette
  c.fillStyle="#0a1424";c.fillRect(0,Lab.H-70,Lab.W,70);
  for(let i=0;i<colors.length;i++){c.fillStyle=colors[i];const x=i*(Lab.W/colors.length);c.fillRect(x+8,Lab.H-60,Lab.W/colors.length-16,50);
    if(i===sel){c.strokeStyle="#fff";c.lineWidth=3;c.strokeRect(x+8,Lab.H-60,Lab.W/colors.length-16,50);}}
}
start();
</script></body></html>
