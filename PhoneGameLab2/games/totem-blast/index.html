<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Totem Blast", instructions:"Tap groups of same-color blocks before the tower rises!", restart:start});
const W=6;let stack,t,score;
function start(){stack=[];for(let r=0;r<6;r++){const row=[];for(let c=0;c<W;c++)row.push(Lab.randInt(0,3));stack.push(row);}
  t=0;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||c<0||c>=W||r>=stack.length)return;
    const v=stack[r][c];const group=flood(r,c,v);if(group.length<2)return;
    for(const [gr,gc] of group)stack[gr][gc]=-1;score+=group.length*10;Lab.setScore(score);Lab.beep(900,.06);}];
  Lab.loop((dt)=>{t+=dt;if(t>3){t=0;const row=[];for(let c=0;c<W;c++)row.push(Lab.randInt(0,3));stack.unshift(row);
    if(stack.length>10){Lab.gameover({title:"Topped out!",message:"Score: "+score});return;}}
    draw();
  });
}
function flood(r,c,v){const seen=new Set();const stk=[[r,c]];const out=[];while(stk.length){const [cr,cc]=stk.pop();const k=cr+","+cc;if(seen.has(k))continue;seen.add(k);if(cr<0||cc<0||cr>=stack.length||cc>=W||stack[cr][cc]!==v)continue;out.push([cr,cc]);stk.push([cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]);}return out;}
function size(){return Math.min(Lab.W/W,(Lab.H-260)/10);}
function off(){const s=size();return {x:(Lab.W-s*W)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#3a2a1a";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();const cols=["#f55","#5cf","#fc5","#5f8"];
  for(let r=0;r<stack.length;r++)for(let cc=0;cc<W;cc++){const v=stack[r][cc];if(v<0)continue;c.fillStyle=cols[v];c.fillRect(o.x+cc*s+2,o.y+r*s+2,s-4,s-4);}
}
start();
</script></body></html>
