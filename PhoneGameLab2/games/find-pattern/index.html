<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Find Pattern", instructions:"Watch the sequence, then tap it back.", restart:start});
let seq,player,phase,showIdx,showT,score;
function start(){seq=[Lab.randInt(0,3)];player=[];phase="show";showIdx=0;showT=0;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{if(phase!=="input")return;const i=tile(x,y);if(i<0)return;
    Lab.beep(400+i*120,.1);player.push(i);
    const k=player.length-1;
    if(player[k]!==seq[k]){Lab.gameover({title:"Wrong!",message:"Score: "+score});return;}
    if(player.length===seq.length){score++;Lab.setScore(score);player=[];seq.push(Lab.randInt(0,3));phase="show";showIdx=0;showT=0.5;}
  }];
  Lab.loop((dt)=>{
    if(phase==="show"){showT-=dt;
      if(showT<=0){if(showIdx<seq.length){flash=seq[showIdx];showIdx++;showT=0.55;Lab.beep(400+flash*120,.18);}else{phase="input";flash=-1;}}
    }
    draw();
  });
}
let flash=-1;
function tile(x,y){const s=Math.min(Lab.W,Lab.H-260)/2;const o={x:(Lab.W-s*2)/2,y:200};
  const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>1||c<0||c>1)return -1;return r*2+c;}
function draw(){const c=Lab.ctx;c.fillStyle="#101a26";c.fillRect(0,0,Lab.W,Lab.H);
  const cols=["#f55","#5cf","#fc5","#5f8"];
  const s=Math.min(Lab.W,Lab.H-260)/2;const o={x:(Lab.W-s*2)/2,y:200};
  for(let i=0;i<4;i++){const r=Math.floor(i/2),cc=i%2;
    c.fillStyle=i===flash?"#fff":cols[i];c.fillRect(o.x+cc*s+6,o.y+r*s+6,s-12,s-12);}
}
start();
</script></body></html>
