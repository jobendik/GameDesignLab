<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Goal!", instructions:"Tap when the moving cursor is over a target inside the goal.", restart:start});
let targets,cursor,sp,t,score,shotsLeft;
function start(){
  targets=[];for(let i=0;i<5;i++)targets.push({x:80+i*((Lab.W-160)/4),y:200+(i%2)*50,r:30,hit:false});
  cursor={x:0};sp=300;t=0;score=0;shotsLeft=8;Lab.setScore(0);
  Lab.input.onTap=[()=>{shotsLeft--;
    for(const tr of targets){if(!tr.hit && Math.abs(cursor.x-tr.x)<tr.r && Math.abs(280-tr.y)<tr.r+20){tr.hit=true;score++;Lab.setScore(score);Lab.beep(1000,.08);break;}}
    if(shotsLeft<=0||targets.every(t=>t.hit))Lab.gameover({title:"Done",message:"Hits: "+score});}];
  Lab.loop((dt)=>{cursor.x=Lab.W/2+Math.sin(Lab.now()*sp/100)*(Lab.W/2-30);draw();});
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a5a25";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.fillRect(40,160,Lab.W-80,140);c.fillStyle="#0a0a0a";c.fillRect(50,170,Lab.W-100,120);
  for(const tr of targets){c.fillStyle=tr.hit?"#5f8":"#f55";c.beginPath();c.arc(tr.x,tr.y,tr.r,0,Lab.TAU);c.fill();
    c.fillStyle="#fff";c.beginPath();c.arc(tr.x,tr.y,tr.r*0.6,0,Lab.TAU);c.fill();
    c.fillStyle=tr.hit?"#5f8":"#f55";c.beginPath();c.arc(tr.x,tr.y,tr.r*0.3,0,Lab.TAU);c.fill();}
  c.strokeStyle="#ff5";c.lineWidth=3;c.beginPath();c.moveTo(cursor.x,Lab.H-100);c.lineTo(cursor.x,Lab.H-60);c.stroke();
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Shots: "+shotsLeft,12,Lab.H-12);
}
start();
</script></body></html>
