(function(){ "use strict";

 *   only keeps the night if the obvious shortest routes would bump — so every night has a "gotcha" and a way through.

  theme: { bg: "#1d1b48", bg2: "#3a2f6b", fg: "#fff4dc", muted: "#c9bfe6", accent: "#ffc857", accent2: "#7fd1ff" },
  orient: "any", music: { style: "dream", key: "F", vol: .38 }, restart: start,

const TIPS = { 1: "Draw a path from each pal\nto the house with their face!", 2: "Paths may cross… but two pals\ncan't stand on one stone!", 3: "Nobody squeezes past head-on.\nPlan around each other!",
  4: "Tap a pal to make them\nwait a beat before walking.", 5: "Fireflies! Walk through them\nfor bonus points.", 7: "Four pals now. Count the beats\nalong each path.", 10: "Five pals! The whole gang.\nTake your time.", 12: "Last night of the fair.\nYou've got this!" };
