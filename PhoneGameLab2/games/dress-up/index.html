<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Dress Up", instructions:"Drag accessories onto the character. Free play!", restart:start});
let items,placed,drag;
function start(){
  items=[
    {type:"hat",x:60,y:Lab.H-90,c:"#5cf"},
    {type:"glasses",x:120,y:Lab.H-90,c:"#000"},
    {type:"bowtie",x:180,y:Lab.H-90,c:"#f55"},
    {type:"hat",x:240,y:Lab.H-90,c:"#fc5"},
    {type:"glasses",x:300,y:Lab.H-90,c:"#a4f"},
  ];
  placed=[];drag=null;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{for(const it of items){if(Math.hypot(x-it.x,y-it.y)<28){drag={...it};return;}}
    for(let i=placed.length-1;i>=0;i--){const p=placed[i];if(Math.hypot(x-p.x,y-p.y)<28){drag=p;placed.splice(i,1);return;}}}];
  Lab.input.onMove=[(x,y)=>{if(drag){drag.x=x;drag.y=y;}}];
  Lab.input.onUp=[()=>{if(drag){placed.push(drag);Lab.setScore(placed.length);drag=null;}}];
  Lab.loop(()=>draw());
}
function drawItem(c,it){c.fillStyle=it.c;
  if(it.type==="hat"){c.fillRect(it.x-26,it.y-2,52,8);c.fillRect(it.x-16,it.y-22,32,22);}
  else if(it.type==="glasses"){c.lineWidth=3;c.strokeStyle=it.c;c.beginPath();c.arc(it.x-10,it.y,10,0,Lab.TAU);c.arc(it.x+10,it.y,10,0,Lab.TAU);c.stroke();c.lineWidth=1;}
  else if(it.type==="bowtie"){c.beginPath();c.moveTo(it.x-20,it.y-12);c.lineTo(it.x,it.y);c.lineTo(it.x-20,it.y+12);c.closePath();c.fill();
    c.beginPath();c.moveTo(it.x+20,it.y-12);c.lineTo(it.x,it.y);c.lineTo(it.x+20,it.y+12);c.closePath();c.fill();}
}
function draw(){const c=Lab.ctx;c.fillStyle="#102030";c.fillRect(0,0,Lab.W,Lab.H);
  // character
  const cx=Lab.W/2, cy=Lab.H/2;
  c.fillStyle="#fea";c.beginPath();c.arc(cx,cy,80,0,Lab.TAU);c.fill();
  c.fillStyle="#000";c.beginPath();c.arc(cx-25,cy-10,7,0,Lab.TAU);c.arc(cx+25,cy-10,7,0,Lab.TAU);c.fill();
  c.strokeStyle="#000";c.lineWidth=3;c.beginPath();c.arc(cx,cy+20,20,0,Math.PI);c.stroke();c.lineWidth=1;
  c.fillStyle="#7a4";c.fillRect(cx-60,cy+80,120,80);
  for(const it of placed)drawItem(c,it);
  // tray
  c.fillStyle="#0a1828";c.fillRect(0,Lab.H-130,Lab.W,130);
  for(const it of items)drawItem(c,it);
  if(drag)drawItem(c,drag);
}
start();
</script></body></html>
