<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Planet Hop", instructions:"Tap to launch. Land on next planet to chain.", restart:start});
let planets,player,attached,score;
function start(){planets=[{x:Lab.W/2,y:Lab.H-200,r:50}];for(let i=1;i<6;i++)planets.push({x:Lab.rand(80,Lab.W-80),y:planets[i-1].y-Lab.rand(120,160),r:Lab.rand(30,55)});
  player={px:planets[0],a:0,r:80,vx:0,vy:0,flying:false};score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(!player.flying){
    const p=player.px;const x=p.x+Math.cos(player.a)*(p.r+20),y=p.y+Math.sin(player.a)*(p.r+20);
    player.x=x;player.y=y;player.vx=-Math.sin(player.a)*500;player.vy=Math.cos(player.a)*500;player.flying=true;}}];
  Lab.loop((dt)=>{
    if(!player.flying){player.a+=2*dt;
      const p=player.px;player.x=p.x+Math.cos(player.a)*(p.r+20);player.y=p.y+Math.sin(player.a)*(p.r+20);
    } else {
      player.x+=player.vx*dt;player.y+=player.vy*dt;
      for(const p of planets){if(p===player.px)continue;if(Lab.dist(p.x,p.y,player.x,player.y)<p.r+12){player.px=p;player.flying=false;player.a=Math.atan2(player.y-p.y,player.x-p.x);score++;Lab.setScore(score);Lab.beep(800,.06);break;}}
      if(player.y<0||player.y>Lab.H||player.x<0||player.x>Lab.W){Lab.gameover({title:"Lost in space",message:"Score: "+score});return;}
    }
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#05071a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of planets){c.fillStyle="#5cf";c.beginPath();c.arc(p.x,p.y,p.r,0,Lab.TAU);c.fill();}
  c.fillStyle="#fc5";c.beginPath();c.arc(player.x,player.y,10,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
