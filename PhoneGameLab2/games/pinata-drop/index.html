<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Piñata Drop", instructions:"Drag basket to catch candy. Avoid bones.", restart:start});
let basket,items,t,score,life;
function start(){basket={x:Lab.W/2,w:100};items=[];t=15;score=0;life=3;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)basket.x=Lab.clamp(x,basket.w/2,Lab.W-basket.w/2);}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.win("Score: "+score);return;}
    if(Math.random()<dt*3.5)items.push({x:Lab.rand(40,Lab.W-40),y:120,vy:Lab.rand(220,320),bone:Math.random()<0.2});
    for(const i of items){i.y+=i.vy*dt;
      if(i.y>Lab.H-80&&Math.abs(i.x-basket.x)<basket.w/2){i.dead=true;
        if(i.bone){life--;Lab.beep(200,.1);if(life<=0){Lab.gameover({title:"Done",message:"Score: "+score});return;}}
        else{score++;Lab.setScore(score);Lab.beep(1000,.04);}}}
    items=items.filter(i=>!i.dead && i.y<Lab.H+30);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a1a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Life: "+life+"  Time: "+Math.ceil(t),12,Lab.H-12);
  c.fillStyle="#fc5";c.fillRect(Lab.W/2-50,60,100,50);c.fillStyle="#f48";c.fillRect(Lab.W/2-40,50,80,30);
  for(const i of items){c.fillStyle=i.bone?"#eee":`hsl(${(i.x*7|0)%360},80%,60%)`;c.beginPath();c.arc(i.x,i.y,10,0,Lab.TAU);c.fill();}
  c.fillStyle="#7a4f2c";c.fillRect(basket.x-basket.w/2,Lab.H-80,basket.w,40);
}
start();
</script></body></html>
