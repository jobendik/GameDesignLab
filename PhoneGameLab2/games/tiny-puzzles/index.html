<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Tiny Puzzles", instructions:"Tap tiles to rotate. Align arrows pointing right.", restart:start});
const N=4;let grid;
function start(){grid=Array.from({length:N},()=>Array.from({length:N},()=>Lab.randInt(0,3)));Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{const s=size(),o=off();const r=Math.floor((y-o.y)/s),c=Math.floor((x-o.x)/s);if(r<0||r>=N||c<0||c>=N)return;grid[r][c]=(grid[r][c]+1)%4;Lab.beep(700,.04);
    if(grid.flat().every(v=>v===0))Lab.win("Aligned!");}];
  Lab.loop(()=>draw());
}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#1a1a30";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){c.fillStyle=grid[r][col]===0?"#3a6a4a":"#2a3a5a";c.fillRect(o.x+col*s+4,o.y+r*s+4,s-8,s-8);
    c.save();c.translate(o.x+col*s+s/2,o.y+r*s+s/2);c.rotate(grid[r][col]*Math.PI/2);
    c.fillStyle="#fff";c.beginPath();c.moveTo(-s*0.25,-s*0.15);c.lineTo(s*0.15,-s*0.15);c.lineTo(s*0.15,-s*0.3);c.lineTo(s*0.35,0);c.lineTo(s*0.15,s*0.3);c.lineTo(s*0.15,s*0.15);c.lineTo(-s*0.25,s*0.15);c.closePath();c.fill();c.restore();}
}
start();
</script></body></html>
