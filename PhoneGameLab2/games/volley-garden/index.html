<title>Volley Garden</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* VOLLEY GARDEN — back-garden kickabout. Momo and Bun toss the ball in from the flowerbeds, Pip strikes it FIRST TIME,
 * and Nori (precise, competitive) keeps goal in a wooden garden goal.
 * Core idea kept: swipe to shoot past the goalkeeper.  What makes it its own game (vs. the Postage Stamp free kicks):
 *   the ball is never still. Every chance is a cross on a different flight — rolled, lobbed, bounced, looped high —
 *   and you strike it as it reaches the chalk ring. The swipe gives direction + pace, the moment gives contact:
 *   dead-centre of the ring = SWEET (true, fast), early/late = scuffed (sprays, balloons over the bar).
 *   Ball still in the air = VOLLEY (double points). Consecutive goals multiply.
 * Nori READS you: he remembers your last shots and leans toward your favourite side before the cross comes in.
 * 75-second match in four spells (warm-up, bouncers, high balls + golden balls, Nori's finest). Full time ends it. */
let demo = false;
Lab.init({
  title: "Volley Garden", tagline: "Momo crosses, Pip volleys. Can you beat Nori?", category: "Sports", kicker: "Pocket Pals",
  howto: ["Momo and Bun toss the ball in", "Swipe up as it reaches the chalk ring", "Aim past Nori. Volleys score double!"],
  theme: { bg: "#9fd88a", bg2: "#eaf7c8", fg: "#2b3a2a", muted: "#56684f", accent: "#ff8a3d", accent2: "#2f3d73", light: true },
  orient: "any", music: { style: "bounce", key: "F", vol: .34 }, restart: start,
  attract(dt, t) { if (!demo || !ball) { demo = true; reset(); } demoAI(dt); update(dt); render(t); },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, shade = Lab.color.shade, INK = Pals.ink;
const MATCH = 75, SPELLS = [{ at: 0, n: "Warm-up" }, { at: 18, n: "Bouncers!" }, { at: 38, n: "High balls" }, { at: 58, n: "Nori's finest" }];
let S, W, H, cx, goalY, goalW, barH, strikeY, R, wide;
let ball, pip, keeper, side, clock, score, streak, bestStreak, goals, volleys, sweets, saves, shots, nextT, spell, hist, sw, cool, over, endT, lastWhy, tickT, net, says;

function layout() {
  W = Lab.W; H = Lab.H; const P = Lab.play; wide = P.w > P.h * 1.1;
  S = Math.min(W / 390, P.h / (wide ? 560 : 720));
  cx = W / 2; goalW = 300 * S * (wide ? 1.2 : 1); barH = goalW * .36;
  goalY = P.y + Math.max(barH + 70 * S, P.h * (wide ? .36 : .4)); strikeY = P.y + P.h * (wide ? .75 : .74); R = 48 * S;
  side = { L: { who: "momo", x: Math.max(34 * S, cx - goalW * (wide ? 1.05 : .62)), y: strikeY - 92 * S, act: 0 }, R: { who: "bun", x: Math.min(W - 34 * S, cx + goalW * (wide ? 1.05 : .62)), y: strikeY - 92 * S, act: 0 } };
  Lab.sprite.clear("vg:");
}
Lab.onResize(() => { if (ball) { const px = pip ? (pip.x - cx) / goalW : 0; layout(); pip.x = cx + px * goalW; pip.tx = pip.x; keeper.x = cx; if (ball.ph !== "none") ball.ph = "gone"; } });
const k = y => clamp(lerp(.6, 1, (y - goalY) / (strikeY - goalY)), .5, 1.15);
const say = (who, txt) => { if (!demo) says = { who, txt, t: 0 }; };

function reset() {
  layout();
  ball = { ph: "none" }; pip = { x: cx, tx: cx, kick: 0, turn: 0, sq: 0, sad: 0 };
  keeper = { x: cx, tgt: cx, dive: 0, dir: 0, st: "ready", react: 0, joy: 0, sad: 0, look: 0 };
  clock = MATCH; score = 0; streak = 0; bestStreak = 0; goals = 0; volleys = 0; sweets = 0; saves = 0; shots = 0;
  nextT = 1.1; spell = 0; hist = []; sw = null; cool = 0; over = false; endT = 0; lastWhy = ""; tickT = 0; net = { x: 0, a: 0 }; says = null;
}
function start() {
  demo = false; reset(); Lab.setScore(0);
  Lab.input.onDown = [(x, y) => { sw = { x, y, t: performance.now(), fired: false }; }];
  Lab.input.onMove = [(x, y) => { if (!sw || sw.fired) return; const dx = x - sw.x, dy = y - sw.y; if (dy < -60 * Math.min(1, S + .2) || Math.hypot(dx, dy) > 90) fire(dx, dy); }];
  Lab.input.onUp = [(x, y) => { if (sw && !sw.fired) { const dx = x - sw.x, dy = y - sw.y; if (dy < -14 && Math.hypot(dx, dy) > 22) fire(dx, dy); } sw = null; }];
  Lab.input.onKey = [key => { const a = { ArrowLeft: -.42, a: -.42, ArrowRight: .42, d: .42, ArrowUp: 0, w: 0, " ": 0, Space: 0 }[key]; if (a != null) shoot(a, 1.6); }];

  Lab.expose({
    get score() { return score; }, get ball() { return ball; }, get keeper() { return keeper; }, get clock() { return clock; }, set clock(v) { clock = v; },
    get goals() { return goals; }, get saves() { return saves; }, get shots() { return shots; }, get streak() { return streak; }, get volleys() { return volleys; }, get spell() { return spell; },
    get over() { return over; }, get why() { return lastWhy; }, quality, strikable, cross, geom() { return { cx, goalY, goalW, barH, strikeY, R }; },
    keeperSkill(v) { keeper.fixed = v; },

}

/* ---------- crosses ---------- */
function diff() { return clamp((MATCH - clock) / MATCH, 0, 1); }
function cross(type, tx, fromSide) {

  if (!type) { const pool = sp === 0 ? ["roll", "lob", "lob"] : sp === 1 ? ["roll", "lob", "bounce", "bounce"] : sp === 2 ? ["lob", "bounce", "high", "high"] : ["lob", "bounce", "high", "roll"]; type = Lab.choose(pool); }
  const sd = fromSide || (Lab.chance(.5) ? "L" : "R"), from = side[sd];
  if (tx == null) tx = cx + rand(-.3, .3) * goalW;
  const x0 = from.x, y0 = from.y - 18 * S, T = lerp(1.3, .82, d) * (type === "roll" ? 1.12 : type === "high" ? 1.1 : 1), G = 1500 * S;
  const b = { ph: "cross", type, x: x0, y: y0, z: type === "roll" ? 0 : 40 * S, vx: (tx - x0) / T, vy: (strikeY - y0) / T, vz: 0, G, tx, t: 0, T, spin: 0, gold: sp >= 2 && Lab.chance(.2), struck: false };
  if (type === "lob" || type === "high") { const zA = (type === "high" ? 64 : 28) * S; b.vz = (zA - b.z + G * T * T / 2) / T; }

  if (!demo) Lab.sfx(type === "roll" ? "slide" : "whoosh", { pitch: type === "high" ? .8 : 1.1, vol: .7 });

}
function strikable() { return ball.ph === "cross" && !ball.struck && Math.hypot(ball.x - ball.tx, (ball.y - strikeY) * 1.4) < R && ball.z < 82 * S; }
function quality() { return ball.ph === "cross" ? clamp(1 - Math.hypot(ball.x - ball.tx, (ball.y - strikeY) * 1.4) / R, 0, 1) : 0; }

/* ---------- shooting ---------- */
function fire(dx, dy) { sw.fired = true; const ms = Math.max(30, performance.now() - sw.t), len = Math.hypot(dx, dy); shoot(Math.atan2(dx, -dy), len / ms); }
function shoot(ang, spd) {

  if (!strikable()) { if (!demo) { Lab.sfx("swish", { pitch: 1.3, vol: .6 }); } return; }

  let zA = header ? rand(.45, .95) * barH : volley ? rand(.12, .5) * barH + z0 * .4 : rand(0, .22) * barH;
  if (!sweet) zA += rand(0, 1 - q) * barH * (header ? .9 : .75);

  shots++;

    if (sweet) { Lab.hitstop(.05); fx.burst(ball.x, ball.y - ball.z, { n: 12, colors: ["#fff", "#ffe37a"], speed: 220, life: .35, size: 3, shape: "star" }); fx.text(ball.x, ball.y - ball.z - 24 * S, header ? "HEADER!" : "SWEET!", { color: "#fff6c2", size: 20 * Math.max(.8, S) }); }

}
function resolve() {
  const b = ball, half = goalW / 2, kh = keeperSize(), reach = kh * (keeper.dive > .4 ? .95 : .62), dx = Math.abs(b.xt - keeper.x), kHigh = kh * (1.35 + keeper.dive * .35);

}
function goal() {
  const b = ball, corner = Math.abs(b.xt - cx) > goalW * .33, mult = Math.min(5, 1 + streak);
  let pts = 10 + (b.sweet ? 5 : 0) + (corner ? 5 : 0); if (b.volley) pts *= 2; if (b.gold) pts *= 2; pts *= mult;
  streak++; bestStreak = Math.max(bestStreak, streak); goals++; if (b.volley) volleys++; if (b.sweet) sweets++; lastWhy = "goal";
  score += pts; Lab.setScore(score); Lab.bumpScore();

  fx.burst(sx, sy, { n: 22 + mult * 4, colors: b.gold ? ["#ffd23f", "#fff3a0", "#ff8a3d"] : ["#ff8a3d", "#ffd23f", "#fff", "#5fd39a"], speed: 260, life: .8, gravity: 300, size: 4, shape: "square" });
  fx.text(sx, sy - 30 * S, "+" + pts, { color: "#fff", size: 24 * Math.max(.8, S) + mult * 2 });
  Lab.banner(b.volley ? (b.header ? "HEADER GOAL!" : "VOLLEY!") : "GOAL!", { color: b.gold ? "#ffd23f" : "#ff8a3d", ms: 900, y: .22 });

function keeperSize() { return barH * .62; }

/* ---------- update ---------- */

/* ---------- drawing ---------- */
function bgSprite() {

      const cols = ["#ff8fb8", "#ffd23f", "#ffffff", "#b9a3ff"]; for (let i = 0; i < 9; i++) { const a = i * .7, r = 60 * S * ((i * 37 % 10) / 10), x = fx0 - d * Math.abs(Math.cos(a)) * r * .9, y = strikeY + 62 * S + Math.sin(a) * 22 * S; g.fillStyle = "#4e9a4c"; g.fillRect(x - 1, y, 2, 10 * S); g.fillStyle = cols[i % 4]; g.beginPath(); g.arc(x, y, 5 * S, 0, TAU); g.fill(); g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(x, y, 1.8 * S, 0, TAU); g.fill(); } }
  });
}
