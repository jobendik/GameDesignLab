<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Fruit Boom", instructions:"Swipe to slice fruit. Avoid bombs.", restart:start});
let fruits,trail,score,t;
function start(){fruits=[];trail=[];score=0;t=0;Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){trail.push({x,y,t:Lab.now()});}}];
  Lab.loop((dt)=>{t+=dt;
    if(Math.random()<dt*1.5){const bomb=Math.random()<0.18;
      fruits.push({x:Lab.rand(40,Lab.W-40),y:Lab.H+30,vx:Lab.rand(-60,60),vy:-Lab.rand(560,720),r:24,bomb,c:bomb?"#222":`hsl(${Lab.randInt(0,360)},80%,55%)`});}
    for(const f of fruits){f.vy+=600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;}
    const now=Lab.now();trail=trail.filter(p=>now-p.t<0.25);
    for(const f of fruits){if(f.dead)continue;
      for(let i=1;i<trail.length;i++){
        const a=trail[i-1],b=trail[i];
        if(seg(a,b,f)){f.dead=true;if(f.bomb){Lab.gameover({title:"BOOM",message:"Score: "+score});return;}else{score++;Lab.setScore(score);Lab.beep(900,.05);}break;}}}
    fruits=fruits.filter(f=>!f.dead && f.y<Lab.H+60);
    draw();
  });
}
function seg(a,b,f){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((f.x-a.x)*dx+(f.y-a.y)*dy)/l2));
  const px=a.x+dx*t,py=a.y+dy*t;return Math.hypot(px-f.x,py-f.y)<f.r;}
function draw(){const c=Lab.ctx;c.fillStyle="#102030";c.fillRect(0,0,Lab.W,Lab.H);
  for(const f of fruits){c.fillStyle=f.c;c.beginPath();c.arc(f.x,f.y,f.r,0,Lab.TAU);c.fill();
    if(f.bomb){c.strokeStyle="#f55";c.beginPath();c.arc(f.x,f.y,f.r,0,Lab.TAU);c.stroke();}}
  c.strokeStyle="#fff";c.lineWidth=3;c.beginPath();for(let i=0;i<trail.length;i++){const p=trail[i];if(i===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y);}c.stroke();c.lineWidth=1;
}
start();
</script></body></html>
