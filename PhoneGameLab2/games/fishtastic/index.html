<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Fishtastic", instructions:"Drag to swim. Catch the fish matching the target color.", restart:start});
let me,fish,target,t,score;
function start(){me={x:Lab.W/2,y:Lab.H/2,r:18};fish=[];target=Lab.randInt(0,3);t=30;score=0;Lab.setScore(0);
  for(let i=0;i<8;i++)spawn();
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){me.x=x;me.y=Lab.clamp(y,140,Lab.H-40);}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Time!",message:"Caught: "+score});return;}
    for(const f of fish){f.x+=f.vx*dt;if(f.x<-30)f.x=Lab.W+30;if(f.x>Lab.W+30)f.x=-30;}
    for(const f of fish){if(!f.dead && Lab.dist(me.x,me.y,f.x,f.y)<28){f.dead=true;
      if(f.col===target){score++;Lab.setScore(score);Lab.beep(900,.08);target=Lab.randInt(0,3);}else{score=Math.max(0,score-1);Lab.beep(200,.1);Lab.setScore(score);}}}
    fish=fish.filter(f=>!f.dead);while(fish.length<8)spawn();
    draw();
  });
}
function spawn(){fish.push({x:Lab.rand(0,Lab.W),y:Lab.rand(160,Lab.H-40),vx:Lab.choose([-80,-50,50,80,120]),col:Lab.randInt(0,3)});}
function draw(){const c=Lab.ctx;c.fillStyle="#0a3a55";c.fillRect(0,0,Lab.W,Lab.H);
  const cols=["#f55","#5cf","#fc5","#5f8"];
  c.fillStyle="#fff";c.font="16px sans-serif";c.textAlign="center";c.fillText("Catch: ",Lab.W/2-30,150);c.fillStyle=cols[target];c.fillRect(Lab.W/2+10,138,20,20);
  for(const f of fish){c.fillStyle=cols[f.col];const d=f.vx>0?1:-1;
    c.beginPath();c.ellipse(f.x,f.y,16,10,0,0,Lab.TAU);c.fill();
    c.beginPath();c.moveTo(f.x-16*d,f.y);c.lineTo(f.x-26*d,f.y-8);c.lineTo(f.x-26*d,f.y+8);c.closePath();c.fill();}
  c.fillStyle="#fff";c.beginPath();c.arc(me.x,me.y,me.r,0,Lab.TAU);c.fill();
  c.fillStyle="#000";c.fillText("⏱ "+Math.ceil(t),Lab.W/2,Lab.H-14);
}
start();
</script></body></html>
