<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Hungry Fish", instructions:"Drag the fish to the food past the rocks.", restart:start});
let fish,food,rocks,level;
function start(){level=level||1;
  fish={x:60,y:Lab.H/2,r:18};food={x:Lab.W-60,y:Lab.rand(200,Lab.H-100),r:18};
  rocks=[];for(let i=0;i<3+level;i++)rocks.push({x:Lab.rand(120,Lab.W-120),y:Lab.rand(200,Lab.H-80),r:Lab.rand(24,40)});
  Lab.setScore(level);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){fish.x=x;fish.y=y;
    for(const r of rocks)if(Lab.dist(fish.x,fish.y,r.x,r.y)<fish.r+r.r){Lab.gameover({title:"Bonk!",message:"Level: "+level});return;}
    if(Lab.dist(fish.x,fish.y,food.x,food.y)<fish.r+food.r){level++;Lab.beep(1000,.1);start();}
  }}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#0a3a55";c.fillRect(0,0,Lab.W,Lab.H);
  for(const r of rocks){c.fillStyle="#555";c.beginPath();c.arc(r.x,r.y,r.r,0,Lab.TAU);c.fill();}
  c.fillStyle="#f55";c.beginPath();c.arc(food.x,food.y,food.r,0,Lab.TAU);c.fill();
  c.fillStyle="#fc5";c.beginPath();c.ellipse(fish.x,fish.y,fish.r,fish.r*0.7,0,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
