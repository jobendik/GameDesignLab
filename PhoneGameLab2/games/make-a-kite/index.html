<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Make a Kite", instructions:"Paint your kite, then tap FLY to launch through the wind.", restart:start});
let phase,strokes,sel,kite,clouds,fly;
const COLORS=["#f55","#5cf","#fc5","#5f8","#a4f"];
function start(){phase="paint";strokes=[];sel=0;kite=null;clouds=[];Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{if(phase==="paint"){
    if(y>Lab.H-60){const i=Math.floor(x/(Lab.W/(COLORS.length+1)));
      if(i<COLORS.length)sel=i;else{phase="fly";initFly();}return;}
    strokes.push({c:COLORS[sel],pts:[{x,y}]});}}];
  Lab.input.onMove=[(x,y)=>{if(phase==="paint"&&Lab.input.down&&y<Lab.H-60&&strokes.length){strokes[strokes.length-1].pts.push({x,y});}
    else if(phase==="fly"&&Lab.input.down){kite.tx=x;kite.ty=y;}}];
  Lab.loop((dt)=>{
    if(phase==="fly"){
      kite.x=Lab.lerp(kite.x,kite.tx,3*dt);kite.y=Lab.lerp(kite.y,kite.ty,3*dt);
      for(const c of clouds)c.x-=c.v*dt;clouds=clouds.filter(c=>c.x>-80);
      if(Math.random()<dt*1.2)clouds.push({x:Lab.W+40,y:Lab.rand(120,Lab.H-100),v:Lab.rand(80,160),r:Lab.rand(30,50)});
      for(const c of clouds)if(Lab.dist(c.x,c.y,kite.x,kite.y)<c.r+20){Lab.gameover({title:"Tangled!",message:"Flight: "+fly.score});return;}
      fly.score+=Math.floor(dt*30);Lab.setScore(fly.score);
    }
    draw();
  });
}
function initFly(){kite={x:80,y:Lab.H/2,tx:80,ty:Lab.H/2};fly={score:0};clouds=[];}
function draw(){const c=Lab.ctx;c.fillStyle=phase==="fly"?"#5ad":"#101830";c.fillRect(0,0,Lab.W,Lab.H);
  if(phase==="paint"){
    const kx=Lab.W/2,ky=Lab.H/2;
    c.fillStyle="#fff";c.beginPath();c.moveTo(kx,ky-80);c.lineTo(kx+60,ky);c.lineTo(kx,ky+80);c.lineTo(kx-60,ky);c.closePath();c.fill();
    c.save();c.beginPath();c.moveTo(kx,ky-80);c.lineTo(kx+60,ky);c.lineTo(kx,ky+80);c.lineTo(kx-60,ky);c.closePath();c.clip();
    for(const s of strokes){c.strokeStyle=s.c;c.lineWidth=10;c.lineCap="round";c.beginPath();
      for(let i=0;i<s.pts.length;i++){const p=s.pts[i];if(i===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y);}c.stroke();}
    c.restore();
    c.fillStyle="#0a1424";c.fillRect(0,Lab.H-60,Lab.W,60);
    for(let i=0;i<COLORS.length;i++){c.fillStyle=COLORS[i];c.fillRect(i*(Lab.W/(COLORS.length+1))+6,Lab.H-54,Lab.W/(COLORS.length+1)-12,48);
      if(i===sel){c.strokeStyle="#fff";c.lineWidth=3;c.strokeRect(i*(Lab.W/(COLORS.length+1))+6,Lab.H-54,Lab.W/(COLORS.length+1)-12,48);}}
    c.fillStyle="#3df58a";c.fillRect(COLORS.length*(Lab.W/(COLORS.length+1))+6,Lab.H-54,Lab.W/(COLORS.length+1)-12,48);
    c.fillStyle="#000";c.font="14px sans-serif";c.textAlign="center";c.fillText("FLY",COLORS.length*(Lab.W/(COLORS.length+1))+(Lab.W/(COLORS.length+1))/2,Lab.H-26);
  } else {
    for(const cl of clouds){c.fillStyle="#fff";c.beginPath();c.arc(cl.x,cl.y,cl.r,0,Lab.TAU);c.fill();}
    c.fillStyle="#fff";c.beginPath();c.moveTo(kite.x,kite.y-30);c.lineTo(kite.x+22,kite.y);c.lineTo(kite.x,kite.y+30);c.lineTo(kite.x-22,kite.y);c.closePath();c.fill();
    c.save();c.beginPath();c.moveTo(kite.x,kite.y-30);c.lineTo(kite.x+22,kite.y);c.lineTo(kite.x,kite.y+30);c.lineTo(kite.x-22,kite.y);c.closePath();c.clip();
    for(const s of strokes){c.strokeStyle=s.c;c.lineWidth=8;c.lineCap="round";c.beginPath();
      for(let i=0;i<s.pts.length;i++){const p=s.pts[i];const dx=p.x-Lab.W/2,dy=p.y-Lab.H/2;if(i===0)c.moveTo(kite.x+dx*0.35,kite.y+dy*0.35);else c.lineTo(kite.x+dx*0.35,kite.y+dy*0.35);}c.stroke();}
    c.restore();
  }
}
start();
</script></body></html>
