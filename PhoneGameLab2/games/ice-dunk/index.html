(function(){ "use strict";
/* ICE DUNK — Nori the penguin IS the ball. Seen from above: a frozen pond ringed with snowbanks, a fishing hole
 * somewhere up the ice, a clock. Drag to aim, let go, and Nori belly-slides: he keeps his line, loses a little speed,
 * banks off snow, ice blocks and snowman bumpers, scoops up fish on the way and DUNKS himself into the hole — then swims
 * back under the ice and pops up at the start with his catch.

 * Different from the arced, gravity-driven sibling (Blacktop Buzzer): no gravity at all — it is angles, banks and
 * routes.  Hooks: every bank before the dunk multiplies it (bank ×2, double bank ×3, trick shot ×4); fish on the ice
 * make a longer route worth it; a streak of dunks adds a second multiplier.  The guide only shows the first stretch.

  howto: ["Drag to aim, let go to slide", "Dunk into the hole to win back time", "Bank off the snow for bonus points"],
  theme: { bg: "#bfe0f7", bg2: "#f2fbff", accent: "#2f6fd6", accent2: "#ffa62b", fg: "#1e2850", muted: "#56658c", light: true },

/* ---------- sliding ---------- */

}
function frame(dt, t) { update(dt); render(t); }
function attract(dt, t) {

/* ---------- art ---------- */
function bgSprite() {
  const W = Lab.W + 80, H = Lab.H + 80, o = 40;
  return Lab.sprite("idbg" + W + "x" + H, W, H, g => {
    draw.vgrad(g, 0, 0, W, H, ["#eaf6ff", "#d3e9fb"]);
    const rnd = Lab.rng(5), k = 20 * S, L = rink.L + o, T = rink.T + o, w = rink.w, h = rink.h;
    for (let i = 0; i < 60; i++) { g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.ellipse(rnd() * W, rnd() * H, 30 + rnd() * 50, 8 + rnd() * 10, 0, 0, TAU); g.fill(); }
    for (let i = 0; i < 14; i++) { const x = rnd() * W, y = rnd() * H, s = (20 + rnd() * 16) * S; if (x > L - k - s && x < L + w + k + s && y > T - k - s * 2 && y < T + h + k) continue; g.fillStyle = "rgba(60,90,140,.12)"; g.beginPath(); g.ellipse(x, y + s * .1, s * .7, s * .18, 0, 0, TAU); g.fill(); for (let j = 0; j < 3; j++) { g.fillStyle = j % 2 ? "#4f9b86" : "#5fae96"; g.beginPath(); g.moveTo(x, y - s * (1.7 - j * .1)); g.lineTo(x + s * (.4 + j * .14), y - s * (1.1 - j * .5)); g.lineTo(x - s * (.4 + j * .14), y - s * (1.1 - j * .5)); g.fill(); } g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x, y - s * 1.7); g.lineTo(x + s * .2, y - s * 1.35); g.lineTo(x - s * .2, y - s * 1.35); g.fill(); }
    // snowbank + ice
    draw.rect(g, L - k, T - k + 5 * S, w + k * 2, h + k * 2, 30 * S, "rgba(70,110,170,.2)"); draw.rect(g, L - k, T - k, w + k * 2, h + k * 2, 30 * S, "#ffffff");
    draw.rr(g, L, T, w, h, 14 * S); g.save(); g.clip(); draw.vgrad(g, L, T, w, h, ["#bfe6fb", "#9fd3f5"]);
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.5; g.lineCap = "round";
    for (let i = 0; i < 26; i++) { const x = L + rnd() * w, y = T + rnd() * h, r = 40 + rnd() * 120, a = rnd() * TAU; g.beginPath(); g.arc(x, y, r, a, a + .25 + rnd() * .5); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.moveTo(L + w * .1, T); g.lineTo(L + w * .42, T); g.lineTo(L + w * .16, T + h); g.lineTo(L - w * .16, T + h); g.fill(); g.beginPath(); g.moveTo(L + w * .62, T); g.lineTo(L + w * .7, T); g.lineTo(L + w * .44, T + h); g.lineTo(L + w * .36, T + h); g.fill();
    g.strokeStyle = "rgba(60,120,190,.35)"; g.lineWidth = 5 * S; draw.rr(g, L, T, w, h, 14 * S); g.stroke(); g.restore();
    // home spot
    g.strokeStyle = "rgba(47,111,214,.35)"; g.lineWidth = 3 * S; g.setLineDash([8 * S, 7 * S]); g.beginPath(); g.arc(home.x + o, home.y + o + 4 * S, 34 * S, 0, TAU); g.stroke(); g.setLineDash([]);
  });
}
function drawHoleAt(c, x, y, r, t, a) {
  c.save(); c.globalAlpha = a; c.fillStyle = "#e9f7ff"; c.beginPath(); c.ellipse(x, y, r + 5 * S, r * .9 + 5 * S, 0, 0, TAU); c.fill();
  c.fillStyle = "#1f58a8"; c.beginPath(); c.ellipse(x, y, r, r * .9, 0, 0, TAU); c.fill(); c.fillStyle = "#0e3a7c"; c.beginPath(); c.ellipse(x, y + r * .12, r * .82, r * .68, 0, 0, TAU); c.fill();
  c.strokeStyle = "rgba(190,230,255,.6)"; c.lineWidth = 1.5 * S; const ph = (t * .7) % 1; c.beginPath(); c.ellipse(x, y + r * .1, r * .75 * ph, r * .6 * ph, 0, 0, TAU); c.globalAlpha = a * (1 - ph); c.stroke(); c.restore();
}
function drawFish(c, x, y, s, ang, gold, wig) {
  c.save(); c.translate(x, y); c.rotate(ang); const col = gold ? "#ffd23f" : "#ffa62b";
  c.fillStyle = Lab.color.shade(col, -.15); c.beginPath(); c.moveTo(-s * .7, 0); c.lineTo(-s * 1.35, -s * .5 + wig * s * .3); c.lineTo(-s * 1.35, s * .5 + wig * s * .3); c.fill();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, s, s * .56, 0, 0, TAU); c.fill(); c.fillStyle = "rgba(255,255,255,.45)"; c.beginPath(); c.ellipse(s * .1, -s * .2, s * .55, s * .16, 0, 0, TAU); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(s * .5, -s * .08, s * .13, 0, TAU); c.fill(); c.restore();
}
function guide(c, t) {
  const b = { x: home.x, y: home.y, vx: Math.cos(aim.ang) * V0 * S, vy: Math.sin(aim.ang) * V0 * S }; let left = 300 * S, after = -1, n = 0, lx = b.x, ly = b.y, d = (t * 60) % 22;
  c.fillStyle = "rgba(30,60,120,.55)";
  while (left > 0 && n++ < 400) {
    const hit = step(b, STEP * 2, false), seg = Math.hypot(b.x - lx, b.y - ly); left -= seg; d += seg; lx = b.x; ly = b.y;
    if (hit && after < 0) { after = 0; left = Math.min(left, 78 * S); draw.circle(c, b.x, b.y, 5 * S, null, "rgba(30,60,120,.6)", 2); }
    if (d >= 22 * S) { d = 0; c.globalAlpha = after >= 0 ? .45 : .85; c.beginPath(); c.arc(b.x, b.y, (after >= 0 ? 2.6 : 3.4) * S, 0, TAU); c.fill(); }

function render(t) {
  const c = Lab.ctx, bg = bgSprite(), n = nori, size = 56 * S; c.drawImage(bg, -40, -40, bg.w, bg.h);
  // spectators peeking over the top snowbank
  const sy = rink.T - 29 * S, sm = cheerT > 0 ? "joy" : n.wow > 0 ? "wow" : sadT > 0 ? "sad" : time < 8 && !demo ? "scared" : "happy", sl = [clamp((n.x - home.x) / (rink.w * .4), -1, 1), .8];
  Pals.draw(c, "momo", rink.L + 34 * S, sy - (cheerT > .8 ? Math.sin((1.2 - cheerT) / .4 * Math.PI) * 8 * S : 0), 38 * S, { mood: sm, t, look: sl, arms: cheerT > 0 ? "cheer" : "down", shadow: false });
  Pals.draw(c, "olli", rink.R - 34 * S, sy - (cheerT > .6 && cheerT < 1 ? Math.sin((1 - cheerT) / .4 * Math.PI) * 8 * S : 0), 38 * S, { mood: sm, t: t + 1, look: sl, arms: cheerT > 0 ? "cheer" : "down", shadow: false });
  draw.rect(c, rink.L - 20 * S, rink.T - 20 * S, rink.w + 40 * S, 22 * S, 11 * S, "#ffffff");
  // clock
  const low = time < 8 && !demo, cx = rink.L + rink.w / 2, cy = rink.T - 30 * S, pul = low ? 1 + .08 * Math.sin(t * 12) : 1 + timeFlash * .12;
  if (!demo) { draw.rect(c, cx - 44 * S * pul, cy - 15 * S * pul, 88 * S * pul, 30 * S * pul, 15 * S, low ? "#ff5d73" : timeFlash > 0 ? "#2bb673" : "#2f3d73"); draw.text(c, Lab.fmtTime(time), cx, cy + 1, { size: 18 * S * pul, color: "#fff", weight: 700 }); }
  // ice things
  if (oldHole) drawHoleAt(c, oldHole.x, oldHole.y, oldHole.r * S * (1 - oldHole.t), t, 1 - oldHole.t);
  const hr = hole.r * S * ease.outBack(hole.born); if (hr > 1) { drawHoleAt(c, hole.x, hole.y, hr, t, 1); const fxp = hole.x + hr + 8 * S, fy = hole.y; draw.line(c, fxp, fy + 6 * S, fxp, fy - 30 * S, "#7a5a3a", 2.5 * S); c.fillStyle = "#ffa62b"; c.beginPath(); c.moveTo(fxp, fy - 30 * S); c.lineTo(fxp + 16 * S + Math.sin(t * 5) * 2, fy - 24 * S); c.lineTo(fxp, fy - 17 * S); c.fill(); }
  draw.shadow(c, home.x, home.y + 6 * S, 20 * S, 9 * S, .1);
  for (const tr of trail) { c.fillStyle = `rgba(255,255,255,${.5 * (1 - tr.t / .9)})`; c.beginPath(); c.arc(tr.x, tr.y, 7 * S, 0, TAU); c.fill(); }
  for (const f of fishes) if (!f.taken) { const s = 11 * S * ease.outBack(f.born); if (f.gold) draw.glow(c, f.x, f.y, 26 * S, "#ffe066", .5 + .2 * Math.sin(t * 5)); draw.shadow(c, f.x, f.y + 7 * S, s, s * .3, .12); drawFish(c, f.x, f.y + Math.abs(Math.sin(f.t * 5)) * -3 * S, s, Math.sin(f.t * 5) * .25 + (f.u > .5 ? Math.PI : 0), f.gold, Math.sin(f.t * 10)); }
  for (const b of blocks) { const w = b.w * S * ease.outBack(b.born), h = b.h * S * ease.outBack(b.born), k = b.hitT || 0; draw.rect(c, b.x - w / 2, b.y - h / 2 + 5 * S, w, h, 8 * S, "rgba(40,90,160,.25)"); draw.rect(c, b.x - w / 2, b.y - h / 2 - k * 2, w, h, 8 * S, "#d9f1ff", "#7fbfe8", 2.5); draw.rect(c, b.x - w / 2 + 5 * S, b.y - h / 2 + 4 * S - k * 2, w - 10 * S, h * .32, 5 * S, "rgba(255,255,255,.75)"); if (b.amp) { c.fillStyle = "rgba(47,111,214,.5)"; for (const d of [-1, 1]) { c.beginPath(); c.moveTo(b.x + d * (w / 2 - 9 * S), b.y + 5 * S); c.lineTo(b.x + d * (w / 2 - 16 * S), b.y + 1 * S); c.lineTo(b.x + d * (w / 2 - 16 * S), b.y + 9 * S); c.fill(); } } }
  for (const b of bumpers) { const r = b.r * S * ease.outBack(b.born) * (1 + ease.pulse(b.hit) * .25); draw.shadow(c, b.x, b.y + r * .8, r, r * .3, .14); draw.circle(c, b.x, b.y, r, "#ffffff", "#a9d2ef", 2.5); c.fillStyle = INK; for (const d of [-1, 1]) { c.beginPath(); c.arc(b.x + d * r * .32, b.y - r * .15, r * .1, 0, TAU); c.fill(); } c.fillStyle = "#ffa62b"; c.beginPath(); c.moveTo(b.x - r * .1, b.y + r * .05); c.lineTo(b.x + r * .42, b.y + r * .18); c.lineTo(b.x - r * .1, b.y + r * .3); c.fill(); draw.rect(c, b.x - r * .5, b.y - r * 1.02, r, r * .3, r * .1, "#ff6b8b"); }
  // aim guide
  const aiming = (aim.on || kbT > 0) && !over && !demo;
  if (aiming) guide(c, t);
  // Nori
  if (n.state === "slide") {
    const sp = Math.hypot(n.vx, n.vy) / (V0 * S); draw.shadow(c, n.x + 3 * S, n.y + 6 * S, size * .42, size * .32, .14);
    Pals.draw(c, "nori", n.x, n.y, size, { mood: n.wow > 0 ? "wow" : sp > .5 ? "joy" : "focus", t, tilt: n.ang + Math.PI / 2, squash: n.sq - sp * .16, arms: "up", shadow: false });
  } else if (n.state === "dive") { const k = clamp(n.t / .28, 0, 1); Pals.draw(c, "nori", lerp(n.fromX, n.hx, k), lerp(n.fromY, n.hy, k), size * (1 - k * .9), { mood: "joy", t, tilt: n.ang + Math.PI / 2 + k * 3, shadow: false, arms: "up" }); }
  else if (n.state === "swim") { const k = ease.inOutQuad(clamp(n.t / .42, 0, 1)); c.fillStyle = "rgba(30,70,140,.22)"; c.beginPath(); c.ellipse(lerp(n.hx, home.x, k), lerp(n.hy, home.y, k), 18 * S, 11 * S, Math.atan2(home.y - n.hy, home.x - n.hx), 0, TAU); c.fill(); }
  else {

    const mood = over ? "sad" : n.state === "dizzy" ? "dizzy" : n.state === "hop" ? "sad" : n.joy > 0 ? "joy" : aiming ? "focus" : low ? "scared" : "happy";
    if (n.state === "pop" || n.joy > .5) drawHoleAt(c, home.x, home.y + 14 * S, 22 * S * (n.state === "pop" ? 1 : clamp((n.joy - .5) * 4, 0, 1)), t, 1);
    Pals.draw(c, "nori", n.x + (n.state === "dizzy" ? Math.sin(t * 30) * 2 : 0), n.y - size * .28 * pop - hopZ + (1 - pop) * size * .4, size * pop, { mood, t, look: aiming ? [Math.cos(aim.ang), Math.sin(aim.ang)] : [clamp((hole.x - n.x) / (rink.w * .4), -1, 1), -.8], squash: n.sq + (aiming && ready ? .06 + aim.pull * .16 : 0), tilt: n.state === "dizzy" ? Math.sin(t * 9) * .25 : aiming && ready ? Math.cos(aim.ang) * .18 : 0, arms: n.joy > 0 ? "cheer" : aiming ? "up" : "down", shadow: n.state !== "hop" });
    if (n.joy > 0 && n.state !== "pop") drawFish(c, n.x + 9 * S, n.y - size * .28 + 1 * S, 8 * S, .5 + Math.sin(t * 22) * .2, false, Math.sin(t * 30));
    if (n.state === "dizzy") for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; draw.star(c, n.x + Math.cos(a) * 20 * S, n.y - size * .72 + Math.sin(a) * 6 * S, 5 * S, "#ffd23f", 5, .5); }
  }
  if (streak >= 3 && !demo) draw.text(c, "streak ×" + (1 + Math.min(2, Math.floor(streak / 3))), rink.L + rink.w / 2 - 62 * S, rink.T - 30 * S, { size: 13 * S, color: "#e0661a", weight: 700, align: "right" });
}
Lab.boot();
})();
