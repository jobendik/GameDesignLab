<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"2048", instructions:"Swipe to slide tiles. Merge equal numbers to reach 2048.", restart:start});
let grid, score, size=4;
function start(){
  grid=Array.from({length:size},()=>Array(size).fill(0));
  spawn(); spawn(); score=0; Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{
    const dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?"R":"L") : (dy>0?"D":"U");
    if(move(dir)){ spawn(); if(!canMove()) Lab.gameover({title:"No moves",message:"Score: "+score}); }
  }];
  Lab.loop(()=>draw());
}
function spawn(){const e=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!grid[r][c])e.push([r,c]);if(!e.length)return;const [r,c]=Lab.choose(e);grid[r][c]=Math.random()<0.9?2:4;}
function rotate(g){const n=g.length,r=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++)for(let j=0;j<n;j++)r[j][n-1-i]=g[i][j];return r;}
function slideRow(row){const a=row.filter(x=>x);let changed=row.some((v,i)=>v!==(a[i]||0));
  for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a[i+1]=0;changed=true;}
  const b=a.filter(x=>x);while(b.length<size)b.push(0);return {row:b,changed};}
function move(dir){let g=grid.map(r=>r.slice());let times={L:0,U:1,R:2,D:3}[dir];
  for(let i=0;i<times;i++)g=rotate(g);let any=false;
  for(let r=0;r<size;r++){const {row,changed}=slideRow(g[r]);g[r]=row;if(changed)any=true;}
  for(let i=0;i<(4-times)%4;i++)g=rotate(g);
  if(any){grid=g;Lab.setScore(score);Lab.beep(500,.04);}return any;}
function canMove(){for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(!grid[r][c])return true;if(c<size-1&&grid[r][c]===grid[r][c+1])return true;if(r<size-1&&grid[r][c]===grid[r+1][c])return true;}return false;}
function draw(){const c=Lab.ctx;c.fillStyle="#1c1c2c";c.fillRect(0,0,Lab.W,Lab.H);
  const S=Math.min(Lab.W,Lab.H-200)-40,pad=10,off={x:(Lab.W-S)/2,y:160};
  c.fillStyle="#2a2a3e";c.fillRect(off.x,off.y,S,S);
  const cell=(S-pad*5)/4;
  for(let r=0;r<size;r++)for(let col=0;col<size;col++){
    const x=off.x+pad+col*(cell+pad),y=off.y+pad+r*(cell+pad),v=grid[r][col];
    c.fillStyle=v?`hsl(${Math.log2(v)*20},70%,55%)`:"#3a3a52";c.fillRect(x,y,cell,cell);
    if(v){c.fillStyle="#fff";c.font=`bold ${cell*0.35}px sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(v,x+cell/2,y+cell/2);}
  }}
start();
</script></body></html>
