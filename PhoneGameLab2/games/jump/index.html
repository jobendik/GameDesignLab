<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Jump", instructions:"Tap to jump platforms. Time it right!", restart:start});
let hero,plats,scroll,score;
function start(){hero={x:80,y:Lab.H-150,vy:0,onGround:false};plats=[{x:0,y:Lab.H-110,w:200}];
  for(let i=1;i<6;i++)plats.push({x:plats[i-1].x+plats[i-1].w+Lab.rand(60,140),y:Lab.H-110+Lab.rand(-40,40),w:Lab.rand(80,160)});
  scroll=0;score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(hero.onGround){hero.vy=-460;hero.onGround=false;Lab.beep(700,.05);}}];
  Lab.loop((dt)=>{hero.vy+=900*dt;hero.y+=hero.vy*dt;scroll+=120*dt;
    for(const p of plats)p.x-=120*dt;
    hero.onGround=false;
    for(const p of plats){if(hero.x>p.x&&hero.x<p.x+p.w && hero.y>=p.y-2 && hero.y<=p.y+10 && hero.vy>=0){hero.y=p.y;hero.vy=0;hero.onGround=true;}}
    while(plats[plats.length-1].x<Lab.W){const last=plats[plats.length-1];plats.push({x:last.x+last.w+Lab.rand(60,160),y:Lab.H-110+Lab.rand(-50,50),w:Lab.rand(80,160)});}
    plats=plats.filter(p=>p.x+p.w>-20);
    score=Math.floor(scroll/30);Lab.setScore(score);
    if(hero.y>Lab.H){Lab.gameover({title:"Fell!",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#2a384a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of plats){c.fillStyle="#5f8";c.fillRect(p.x,p.y,p.w,12);}
  c.fillStyle="#fc5";c.fillRect(hero.x-12,hero.y-24,24,24);
}
start();
</script></body></html>
