<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Brick Blast", instructions:"Tap groups of 2+ same-colored bricks. 12 moves.", restart:start});
let grid,rows=10,cols=8,moves,score;
function start(){
  grid=Array.from({length:rows},()=>Array.from({length:cols},()=>Lab.randInt(0,3)));
  moves=12;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const cell=Math.min(Lab.W/cols,(Lab.H-220)/rows);
    const off={x:(Lab.W-cell*cols)/2,y:160};
    const col=Math.floor((x-off.x)/cell), r=Math.floor((y-off.y)/cell);
    if(r<0||r>=rows||col<0||col>=cols||grid[r][col]<0)return;
    const group=flood(r,col,grid[r][col]);
    if(group.length<2)return;
    for(const [rr,cc] of group) grid[rr][cc]=-1;
    score+=group.length*group.length; Lab.setScore(score); Lab.beep(700,.06);
    gravity(); moves--;
    if(moves<=0||done()) Lab.gameover({title:"Done",message:"Score: "+score});
  }];
  Lab.loop(()=>draw());
}
function flood(r,c,col){const out=[],q=[[r,c]],seen=new Set();
  while(q.length){const [rr,cc]=q.pop();const k=rr+","+cc;if(seen.has(k))continue;seen.add(k);
    if(!grid[rr]||grid[rr][cc]!==col)continue;out.push([rr,cc]);
    q.push([rr+1,cc],[rr-1,cc],[rr,cc+1],[rr,cc-1]);
  }return out;}
function gravity(){for(let c=0;c<cols;c++){let w=rows-1;
  for(let r=rows-1;r>=0;r--)if(grid[r][c]>=0){grid[w--][c]=grid[r][c];}
  while(w>=0)grid[w--][c]=-1;}}
function done(){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(grid[r][c]<0)continue;
  for(const [dr,dc] of [[1,0],[0,1]]){if(grid[r+dr]&&grid[r+dr][c+dc]===grid[r][c])return false;}}return true;}
function draw(){const c=Lab.ctx;c.fillStyle="#10131c";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Moves: "+moves,12,Lab.H-12);
  const cell=Math.min(Lab.W/cols,(Lab.H-220)/rows);
  const off={x:(Lab.W-cell*cols)/2,y:160};
  const pal=["#f55","#5cf","#fc5","#5f8"];
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const v=grid[r][col];if(v<0)continue;
    c.fillStyle=pal[v];c.fillRect(off.x+col*cell+2,off.y+r*cell+2,cell-4,cell-4);}
}
start();
</script></body></html>
