<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Ice Smash", instructions:"Tap ice blocks to shatter. Limited taps.", restart:start});
let grid,N,taps,score;
function start(){N=6;grid=Array.from({length:N},()=>Array.from({length:N},()=>1));taps=15;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);
    if(r<0||r>=N||c<0||c>=N||!grid[r][c])return;
    // crack 3x3 around
    let popped=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(grid[rr]&&grid[rr][cc]){grid[rr][cc]=0;popped++;}}
    score+=popped;Lab.setScore(score);Lab.beep(800,.05);taps--;
    if(grid.every(row=>row.every(v=>!v))){Lab.win("Cleared! Score: "+score);return;}
    if(taps<=0)Lab.gameover({title:"No taps left",message:"Score: "+score});
  }];
  Lab.loop(()=>draw());
}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#0c3050";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Taps: "+taps,12,Lab.H-12);
  const s=size(),o=off();
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){if(!grid[r][col])continue;
    c.fillStyle="#bff";c.fillRect(o.x+col*s+2,o.y+r*s+2,s-4,s-4);
    c.strokeStyle="#9df";c.strokeRect(o.x+col*s+2,o.y+r*s+2,s-4,s-4);}
}
start();
</script></body></html>
