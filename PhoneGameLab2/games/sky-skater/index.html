<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sky Skater", instructions:"Tap to jump gaps between sky rails.", restart:start});
let hero,rails,scroll,score;
function start(){hero={x:80,y:Lab.H-200,vy:0,onG:false};rails=[{x:0,w:240,y:Lab.H-160}];
  for(let i=1;i<8;i++)rails.push({x:rails[i-1].x+rails[i-1].w+Lab.rand(50,120),w:Lab.rand(100,200),y:Lab.H-160+Lab.rand(-40,40)});
  scroll=0;score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(hero.onG){hero.vy=-460;hero.onG=false;Lab.beep(800,.05);}}];
  Lab.loop((dt)=>{scroll+=180*dt;score=Math.floor(scroll/30);Lab.setScore(score);
    for(const r of rails)r.x-=180*dt;
    hero.vy+=1100*dt;hero.y+=hero.vy*dt;hero.onG=false;
    for(const r of rails){if(hero.x>r.x&&hero.x<r.x+r.w&&hero.y>=r.y-2&&hero.y<=r.y+12&&hero.vy>=0){hero.y=r.y;hero.vy=0;hero.onG=true;}}
    while(rails[rails.length-1].x<Lab.W){const l=rails[rails.length-1];rails.push({x:l.x+l.w+Lab.rand(60,140),w:Lab.rand(80,200),y:Lab.H-160+Lab.rand(-50,50)});}
    rails=rails.filter(r=>r.x+r.w>-20);
    if(hero.y>Lab.H){Lab.gameover({title:"Fell!",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a5";c.fillRect(0,0,Lab.W,Lab.H);
  for(const r of rails){c.fillStyle="#888";c.fillRect(r.x,r.y,r.w,12);}
  c.fillStyle="#f55";c.fillRect(hero.x-12,hero.y-24,24,24);
}
start();
</script></body></html>
