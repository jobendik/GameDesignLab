<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Hit The Road", instructions:"Swipe left/right to change lane. Dodge cars, grab coins.", restart:start});
let car,lane,others,coins,t,score;
function start(){lane=1;car={x:0,y:Lab.H-120};others=[];coins=[];t=0;score=0;Lab.setScore(0);
  Lab.input.onSwipe=[(dx)=>{if(dx<-20)lane=Math.max(0,lane-1);if(dx>20)lane=Math.min(2,lane+1);}];
  Lab.loop((dt)=>{t+=dt;car.x=lanesX()[lane];
    if(Math.random()<dt*1.2)others.push({x:lanesX()[Lab.randInt(0,2)],y:-50,vy:Lab.rand(260,360)});
    if(Math.random()<dt*0.8)coins.push({x:lanesX()[Lab.randInt(0,2)],y:-50,vy:240});
    for(const o of others)o.y+=o.vy*dt;for(const co of coins)co.y+=co.vy*dt;
    for(const o of others)if(Math.abs(o.x-car.x)<30 && Math.abs(o.y-car.y)<40){Lab.gameover({title:"Crash!",message:"Score: "+score});return;}
    for(const co of coins)if(!co.dead && Math.abs(co.x-car.x)<24 && Math.abs(co.y-car.y)<24){co.dead=true;score++;Lab.setScore(score);Lab.beep(1000,.05);}
    others=others.filter(o=>o.y<Lab.H+50);coins=coins.filter(c=>!c.dead && c.y<Lab.H+50);
    draw();
  });
}
function lanesX(){return [Lab.W*.25,Lab.W*.5,Lab.W*.75];}
function draw(){const c=Lab.ctx;c.fillStyle="#222";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#444";c.fillRect(Lab.W*0.1,0,Lab.W*0.8,Lab.H);
  c.strokeStyle="#fff";c.setLineDash([14,12]);
  for(let i=1;i<3;i++){c.beginPath();c.moveTo(lanesX()[0]+(lanesX()[1]-lanesX()[0])*(i?1:0),0);c.lineTo(lanesX()[0]+(lanesX()[1]-lanesX()[0])*i,Lab.H);c.stroke();}
  c.setLineDash([]);
  for(const o of others){c.fillStyle="#f55";c.fillRect(o.x-26,o.y-36,52,72);}
  for(const co of coins){c.fillStyle="#fc5";c.beginPath();c.arc(co.x,co.y,14,0,Lab.TAU);c.fill();}
  c.fillStyle="#5cf";c.fillRect(car.x-26,car.y-36,52,72);
}
start();
</script></body></html>
