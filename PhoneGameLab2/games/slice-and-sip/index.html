<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Slice and Sip", instructions:"Slice fruit so it falls into the blender below.", restart:start});
let fruits,slices,blender,trail,score;
function start(){fruits=[];slices=[];blender={x:Lab.W/2,w:140};trail=[];score=0;Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){trail.push({x,y,t:0});}}];
  Lab.loop((dt)=>{if(Math.random()<dt*1.5)fruits.push({x:Lab.rand(60,Lab.W-60),y:Lab.H,vx:Lab.rand(-80,80),vy:-Lab.rand(500,650),c:`hsl(${Lab.randInt(0,360)},80%,60%)`,r:22});
    for(const f of fruits){f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;}
    for(const t of trail){t.t+=dt;}trail=trail.filter(t=>t.t<0.25);
    for(let i=fruits.length-1;i>=0;i--){const f=fruits[i];
      for(const t of trail){if(Lab.dist(f.x,f.y,t.x,t.y)<f.r){slices.push({x:f.x,y:f.y,vx:Lab.rand(-100,100),vy:-Lab.rand(200,400),c:f.c,r:12});slices.push({x:f.x,y:f.y,vx:Lab.rand(-100,100),vy:-Lab.rand(200,400),c:f.c,r:12});fruits.splice(i,1);break;}}}
    for(let i=slices.length-1;i>=0;i--){const s=slices[i];s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
      if(s.y>Lab.H-60&&Math.abs(s.x-blender.x)<blender.w/2){score++;Lab.setScore(score);Lab.beep(900,.04);slices.splice(i,1);}
      else if(s.y>Lab.H+30)slices.splice(i,1);}
    fruits=fruits.filter(f=>f.y<Lab.H+60);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a1a3a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#aaa";c.fillRect(blender.x-blender.w/2,Lab.H-60,blender.w,40);
  c.fillStyle="#fc5";c.fillRect(blender.x-blender.w/2+8,Lab.H-56,blender.w-16,32);
  for(const f of fruits){c.fillStyle=f.c;c.beginPath();c.arc(f.x,f.y,f.r,0,Lab.TAU);c.fill();}
  for(const s of slices){c.fillStyle=s.c;c.beginPath();c.arc(s.x,s.y,s.r,0,Lab.TAU);c.fill();}
  if(trail.length>1){c.strokeStyle="#fff";c.lineWidth=3;c.beginPath();for(let i=0;i<trail.length;i++){const t=trail[i];if(i===0)c.moveTo(t.x,t.y);else c.lineTo(t.x,t.y);}c.stroke();c.lineWidth=1;}
}
start();
</script></body></html>
