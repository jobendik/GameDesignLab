  { name: "Golden Hour", bpm: 116, prog: ["Am", "F", "C", "G"], sky: ["#ffb36b", "#ff8a6b"], wall: "#c9715a", lit: .4 },

  ["D.DU.UD.", "D.D.DUDU", "DU.UDU..", "D.DUD.D.", "H---DUDU", "D.DU.UDU"],
  ["D.S.D.S.", "DUS.DUS.", "D.DUS.DU", "H---S.S.", "D.S.DUDU", "H-..DUS."],
  ["DUSUDUSU", "D.DUSUDU", "W.S.W.S.", "DUDUS.DU", "H---DUSU", "W.WUS.D."],
