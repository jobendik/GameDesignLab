<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Guitar Ace", instructions:"Tap notes as they reach the strum line.", restart:start});
let notes,strum,score,miss,t;
const COLS=4;
function start(){notes=[];score=0;miss=0;t=0;strum=Lab.H-100;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{const lane=Math.floor(x/(Lab.W/COLS));
    let best=null,bd=999;for(const n of notes){if(n.lane!==lane||n.hit)continue;const d=Math.abs(n.y-strum);if(d<bd){bd=d;best=n;}}
    if(best&&bd<40){best.hit=true;score++;Lab.setScore(score);Lab.beep(400+lane*120,.08);}else{Lab.beep(180,.05);}
  }];
  Lab.loop((dt)=>{t+=dt;
    if(Math.random()<dt*2)notes.push({lane:Lab.randInt(0,COLS-1),y:-30,hit:false});
    for(const n of notes)n.y+=240*dt;
    for(const n of notes)if(!n.hit && n.y>strum+30){n.gone=true;miss++;if(miss>=8){Lab.gameover({title:"Out of rhythm",message:"Score: "+score});return;}}
    notes=notes.filter(n=>!n.gone&&!n.hit);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#10141f";c.fillRect(0,0,Lab.W,Lab.H);
  const lw=Lab.W/COLS;const cols=["#f55","#5cf","#fc5","#5f8"];
  for(let i=0;i<COLS;i++){c.strokeStyle="#333";c.beginPath();c.moveTo((i+1)*lw,0);c.lineTo((i+1)*lw,Lab.H);c.stroke();}
  c.fillStyle="#fff5";c.fillRect(0,strum-3,Lab.W,6);
  for(const n of notes){c.fillStyle=cols[n.lane];c.fillRect(n.lane*lw+10,n.y-12,lw-20,24);}
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Miss: "+miss,12,Lab.H-12);
}
start();
</script></body></html>
