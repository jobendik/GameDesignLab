<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Happy Connect", instructions:"Drag through 3+ matching faces (neighbours, any direction).", restart:start});
const N=7;let grid,path,score,moves;
function start(){grid=Array.from({length:N},()=>Array.from({length:N},()=>Lab.randInt(0,3)));path=[];moves=15;score=0;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{const p=hit(x,y);if(p)path=[p];}];
  Lab.input.onMove=[(x,y)=>{if(!Lab.input.down||!path.length)return;const p=hit(x,y);if(!p)return;
    const last=path[path.length-1];if(p.r===last.r&&p.c===last.c)return;
    if(path.length>=2&&path[path.length-2].r===p.r&&path[path.length-2].c===p.c){path.pop();return;}
    if(Math.abs(p.r-last.r)<=1&&Math.abs(p.c-last.c)<=1&&grid[p.r][p.c]===grid[last.r][last.c])path.push(p);
  }];
  Lab.input.onUp=[()=>{if(path.length>=3){
    for(const p of path)grid[p.r][p.c]=-1;
    score+=path.length*10;Lab.setScore(score);
    for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(grid[r][c]>=0)grid[w--][c]=grid[r][c];while(w>=0)grid[w--][c]=Lab.randInt(0,3);}
    Lab.beep(900,.08);moves--;if(moves<=0)Lab.gameover({title:"Done",message:"Score: "+score});}path=[];}];
  Lab.loop(()=>draw());
}
function hit(x,y){const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>=N||c<0||c>=N)return null;return {r,c,x:o.x+c*s+s/2,y:o.y+r*s+s/2};}
function size(){return Math.min(Lab.W/N,(Lab.H-260)/N);}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#2a1640";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Moves: "+moves,12,Lab.H-12);
  const s=size(),o=off();const cols=["#fc5","#5cf","#f59","#5f8"];
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){const v=grid[r][col];if(v<0)continue;
    const cx=o.x+col*s+s/2,cy=o.y+r*s+s/2;
    c.fillStyle=cols[v];c.beginPath();c.arc(cx,cy,s*0.35,0,Lab.TAU);c.fill();
    c.fillStyle="#000";c.beginPath();c.arc(cx-s*0.1,cy-s*0.08,s*0.04,0,Lab.TAU);c.arc(cx+s*0.1,cy-s*0.08,s*0.04,0,Lab.TAU);c.fill();
    c.strokeStyle="#000";c.lineWidth=2;c.beginPath();c.arc(cx,cy+s*0.05,s*0.13,0,Math.PI);c.stroke();}
  c.strokeStyle="#fff";c.lineWidth=4;c.beginPath();for(let i=0;i<path.length;i++){const p=path[i];if(i===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y);}c.stroke();c.lineWidth=1;
}
start();
</script></body></html>
