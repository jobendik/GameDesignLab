<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Space Trails", instructions:"Draw paths from each ship to its matching planet.", restart:start});
let ships,planets,paths,drag,t;
const COLORS=["#f55","#5cf","#fc5"];
function start(){ships=[];planets=[];paths={};t=0;drag=null;
  for(let i=0;i<COLORS.length;i++){ships.push({c:COLORS[i],x:60+Math.random()*60,y:200+i*((Lab.H-300)/(COLORS.length))});
    planets.push({c:COLORS[i],x:Lab.W-60-Math.random()*60,y:200+i*((Lab.H-300)/(COLORS.length))+Lab.rand(-40,40)});}
  Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{for(const s of ships){if(Lab.dist(s.x,s.y,x,y)<22){drag={c:s.c,pts:[{x:s.x,y:s.y}],s};return;}}}];
  Lab.input.onMove=[(x,y)=>{if(drag)drag.pts.push({x,y});}];
  Lab.input.onUp=[(x,y)=>{if(drag){const p=planets.find(p=>p.c===drag.c);if(Lab.dist(p.x,p.y,x,y)<24){paths[drag.c]={pts:drag.pts,prog:0,s:drag.s,p};Lab.beep(900,.06);}drag=null;}}];
  Lab.loop((dt)=>{t+=dt;for(const c in paths){const path=paths[c];path.prog+=0.3*dt;if(path.prog>1)path.prog=1;
    // check crashes between ships
    for(const c2 in paths){if(c===c2)continue;const o=paths[c2];const a=ptOn(path),b=ptOn(o);if(Lab.dist(a.x,a.y,b.x,b.y)<20 && path.prog<1 && o.prog<1){Lab.gameover({title:"Crash!",message:""});return;}}}
    if(Object.keys(paths).length===COLORS.length && Object.values(paths).every(p=>p.prog>=1))Lab.win("All landed!");
    draw();
  });
}
function ptOn(p){const i=Math.min(p.pts.length-1,Math.floor(p.prog*p.pts.length));return p.pts[i];}
function draw(){const c=Lab.ctx;c.fillStyle="#03051a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const planet of planets){c.fillStyle=planet.c;c.beginPath();c.arc(planet.x,planet.y,22,0,Lab.TAU);c.fill();}
  for(const cl in paths){const p=paths[cl];c.strokeStyle=cl;c.lineWidth=3;c.beginPath();for(let i=0;i<p.pts.length;i++){const q=p.pts[i];if(i===0)c.moveTo(q.x,q.y);else c.lineTo(q.x,q.y);}c.stroke();
    const a=ptOn(p);c.fillStyle=cl;c.beginPath();c.arc(a.x,a.y,10,0,Lab.TAU);c.fill();}
  if(drag){c.strokeStyle=drag.c;c.lineWidth=3;c.beginPath();for(let i=0;i<drag.pts.length;i++){const q=drag.pts[i];if(i===0)c.moveTo(q.x,q.y);else c.lineTo(q.x,q.y);}c.stroke();}
  c.lineWidth=1;
  for(const s of ships){if(!paths[s.c]){c.fillStyle=s.c;c.beginPath();c.moveTo(s.x-12,s.y+12);c.lineTo(s.x+18,s.y);c.lineTo(s.x-12,s.y-12);c.closePath();c.fill();}}
}
start();
</script></body></html>
