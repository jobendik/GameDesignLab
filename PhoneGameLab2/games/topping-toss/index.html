(function(){ "use strict";
/* TOPPING TOSS — Bun is decorating a giant spinning donut, and Momo is peeking through the hole, very hungry.
 * Core idea kept: tap to throw something into a spinning ring, and never land on a piece that is already stuck.
 * The rule that makes it a different game: toppings MATCH. Land a topping touching two of its kind (three in a row
 * around the ring) and Momo's tongue zips out of the hole and gobbles the lot, freeing space. So you are pulled
 * toward the crowd (land snug beside your pairs) while a direct hit on a topping bonks it off (a heart).
 * Crowd the ring with set-ups and you'll run out of safe gaps; cash pairs in on consecutive tosses for a chain bonus.
 * You see the next topping and can swap it once per toss. Each donut is an order ("feed Momo 12"); donuts get new
 * spins (steady, surging, swaying, stop-and-go, sudden flips with a wobble warning), more kinds, candles that never
 * get eaten, and sprinkle stars that match anything.
 * Identity: a pastel bakery counter, a glazed donut that changes flavour each order, chunky toppings with distinct

let demo = false;
Lab.init({
  title: "Topping Toss", tagline: "Toss toppings on the spinning donut. Three of a kind and Momo gobbles them!", category: "Skill", kicker: "Pocket Pals",
  howto: ["Tap to toss a topping onto the donut", "Land beside two of a kind: Momo eats!", "Hit a topping head-on and it bonks off"],
  theme: { bg: "#ffd9e4", bg2: "#fff4e4", fg: "#4a2f3a", muted: "#8a6a74", accent: "#ff6f91", accent2: "#5fd39a", light: true },
  orient: "any", music: { style: "bounce", key: "A", vol: .34 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, INK = Pals.ink;
const KINDS = [{ n: "cherries", c: "#ff4f6d" }, { n: "blueberries", c: "#5a78e8" }, { n: "choc squares", c: "#8a5233" }, { n: "marshmallows", c: "#fff2f6" }, { n: "lemon stars", c: "#ffd23f" }];
const WILD = -1, CANDLE = -2;
const GLAZE = [["#ff9cc0", "#ff6f9c"], ["#9b6447", "#6e4430"], ["#fff0a8", "#f5d25a"], ["#b6f0d2", "#70d6a6"], ["#c9d8ff", "#8fa8ef"], ["#e7c9ff", "#bd8ef0"]];
const PATS = ["steady", "steady", "surge", "sway", "stopgo", "flip"];
let S, wide, D, R, Rm, TR, HW, bunP, bunSize, nextBox, cardR;

    cardR = { x: P.x + 14, y: P.y + 10, w: P.w - 28, h: 64 * S }; nextBox = { x: D.x + 120 * S, y: bunP.y + bunSize * .05, r: 31 * S };

Lab.onResize(() => { if (D) layout(); });

/* ---------- donut + toppings ---------- */

function rollX() { if (!roll) return 0; const u = roll.t; if (u < 1) return ease.inBack(clamp(u / .9, 0, 1)) * (Lab.W * .9 + R); if (u < 1.5) return -(Lab.W * .9 + R); return -(1 - ease.outBack(clamp((u - 1.5) / .7, 0, 1))) * (Lab.W * .9 + R); }

    else if (k === 4) { draw.star(g, c, c, r * 1.02, "#ffd23f", 5, .5); g.strokeStyle = "#d9a21a"; g.stroke(); draw.circle(g, c - r * .15, c - r * .1, r * .14, "rgba(255,255,255,.7)"); }

function drawTop(c, k, x, y, ang, o) {

function drawBun(c, t) {
