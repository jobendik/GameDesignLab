<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Snappy Frog", instructions:"Tap a fly to shoot tongue and eat it.", restart:start});
let frog,flies,tongue,score,t;
function start(){frog={x:Lab.W/2,y:Lab.H-100};flies=[];tongue=null;score=0;t=30;Lab.setScore(0);
  for(let i=0;i<4;i++)spawn();
  Lab.input.onTap=[(x,y)=>{if(tongue)return;tongue={x:frog.x,y:frog.y,tx:x,ty:y,p:0,target:null};
    for(const f of flies){if(Lab.dist(f.x,f.y,x,y)<24)tongue.target=f;}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.win("Score: "+score);return;}
    for(const f of flies){f.x+=Math.cos(f.a)*60*dt;f.y+=Math.sin(f.a)*60*dt;if(Math.random()<dt)f.a+=Lab.rand(-1,1);
      if(f.x<20||f.x>Lab.W-20)f.a=Math.PI-f.a;if(f.y<160||f.y>Lab.H-160)f.a=-f.a;}
    if(tongue){tongue.p+=4*dt;if(tongue.p>=1){if(tongue.target){const i=flies.indexOf(tongue.target);if(i>=0){flies.splice(i,1);score++;Lab.setScore(score);Lab.beep(1200,.05);spawn();}}tongue=null;}}
    draw();
  });
}
function spawn(){flies.push({x:Lab.rand(40,Lab.W-40),y:Lab.rand(180,Lab.H-160),a:Lab.rand(0,Math.PI*2)});}
function draw(){const c=Lab.ctx;c.fillStyle="#1a3a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  c.fillStyle="#5f8";c.beginPath();c.arc(frog.x,frog.y,28,0,Lab.TAU);c.fill();
  c.fillStyle="#fff";c.beginPath();c.arc(frog.x-10,frog.y-20,6,0,Lab.TAU);c.fill();c.beginPath();c.arc(frog.x+10,frog.y-20,6,0,Lab.TAU);c.fill();
  for(const f of flies){c.fillStyle="#222";c.beginPath();c.arc(f.x,f.y,6,0,Lab.TAU);c.fill();}
  if(tongue){const ex=Lab.lerp(tongue.x,tongue.tx,tongue.p),ey=Lab.lerp(tongue.y,tongue.ty,tongue.p);c.strokeStyle="#f99";c.lineWidth=4;c.beginPath();c.moveTo(tongue.x,tongue.y);c.lineTo(ex,ey);c.stroke();c.lineWidth=1;}
}
start();
</script></body></html>
