<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Snakes & Ladders", instructions:"Tap ROLL to play. First to 100.", restart:start});
const N=10;let pos,roll,turn,sn,la;
function start(){pos=[1,1];roll=null;turn=0;
  sn={17:7,38:20,49:11,67:46,89:53,99:78};
  la={4:14,9:31,28:38,40:59,51:67,71:91};
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{if(y>Lab.H-60){roll=Lab.randInt(1,6);pos[turn]+=roll;if(pos[turn]>100)pos[turn]=100;
    if(sn[pos[turn]])pos[turn]=sn[pos[turn]];if(la[pos[turn]])pos[turn]=la[pos[turn]];
    Lab.beep(800,.06);
    if(pos[turn]===100){Lab.win((turn===0?"You":"AI")+" win!");return;}turn=1-turn;
    if(turn===1)setTimeout(()=>Lab.input.onTap[0](0,Lab.H-10),500);}}];
  Lab.loop(()=>draw());
}
function cell(n){const r=Math.floor((n-1)/N),col=(n-1)%N;const row=N-1-r;const c=row%2===0?col:N-1-col;return {r:row,c};}
function draw(){const ct=Lab.ctx;ct.fillStyle="#0a1a3a";ct.fillRect(0,0,Lab.W,Lab.H);
  const s=Math.min(Lab.W,Lab.H-260)/N;const o={x:(Lab.W-s*N)/2,y:180};
  for(let n=1;n<=100;n++){const p=cell(n);ct.fillStyle=(p.r+p.c)%2?"#1a3a6a":"#244a7a";ct.fillRect(o.x+p.c*s,o.y+p.r*s,s,s);ct.fillStyle="#fff";ct.font="10px sans-serif";ct.textAlign="left";ct.fillText(n,o.x+p.c*s+2,o.y+p.r*s+10);}
  for(const k in sn){const a=cell(+k),b=cell(sn[k]);ct.strokeStyle="#f55";ct.lineWidth=3;ct.beginPath();ct.moveTo(o.x+a.c*s+s/2,o.y+a.r*s+s/2);ct.lineTo(o.x+b.c*s+s/2,o.y+b.r*s+s/2);ct.stroke();}
  for(const k in la){const a=cell(+k),b=cell(la[k]);ct.strokeStyle="#5f8";ct.lineWidth=3;ct.beginPath();ct.moveTo(o.x+a.c*s+s/2,o.y+a.r*s+s/2);ct.lineTo(o.x+b.c*s+s/2,o.y+b.r*s+s/2);ct.stroke();}
  ct.lineWidth=1;
  for(let i=0;i<2;i++){const p=cell(pos[i]);ct.fillStyle=i===0?"#fc5":"#5cf";ct.beginPath();ct.arc(o.x+p.c*s+s/2+(i?6:-6),o.y+p.r*s+s/2,s*0.25,0,Lab.TAU);ct.fill();}
  ct.fillStyle="#3df58a";ct.fillRect(Lab.W/2-60,Lab.H-50,120,40);ct.fillStyle="#000";ct.font="16px sans-serif";ct.textAlign="center";ct.textBaseline="middle";ct.fillText("ROLL"+(roll?": "+roll:""),Lab.W/2,Lab.H-30);
  ct.fillStyle="#fff";ct.font="12px sans-serif";ct.textAlign="left";ct.fillText("Turn: "+(turn===0?"You":"AI"),12,Lab.H-12);
}
start();
</script></body></html>
