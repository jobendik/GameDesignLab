<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Maze", instructions:"Swipe to move toward the exit.", restart:start});
const N=11;let grid,player,goal,score;
function start(){grid=genMaze(N);player={r:0,c:0};goal={r:N-1,c:N-1};score=score||0;Lab.setScore(score);
  Lab.input.onSwipe=[(dx,dy)=>{
    const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?[0,1]:[0,-1]):(dy>0?[1,0]:[-1,0]);
    move(dir[0],dir[1]);
  }];
  window.addEventListener("keydown",keyHandler);
  Lab.loop(()=>draw());
}
function keyHandler(e){const k={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(k)move(...k);}
function move(dr,dc){const cell=grid[player.r][player.c];const dirIdx=dr===-1?0:dr===1?2:dc===1?1:3;
  if(cell[dirIdx]){player.r+=dr;player.c+=dc;
    if(player.r===goal.r&&player.c===goal.c){score++;Lab.setScore(score);Lab.beep(1000,.1);start();}}}
function genMaze(n){const g=Array.from({length:n},()=>Array.from({length:n},()=>[0,0,0,0]));
  const seen=Array.from({length:n},()=>Array(n).fill(false));
  function dfs(r,c){seen[r][c]=true;const dirs=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
    for(let i=dirs.length-1;i>0;i--){const j=Lab.randInt(0,i);[dirs[i],dirs[j]]=[dirs[j],dirs[i]];}
    for(const [dr,dc,d,od] of dirs){const nr=r+dr,nc=c+dc;if(nr<0||nr>=n||nc<0||nc>=n||seen[nr][nc])continue;
      g[r][c][d]=1;g[nr][nc][od]=1;dfs(nr,nc);}}
  dfs(0,0);return g;}
function draw(){const c=Lab.ctx;c.fillStyle="#101418";c.fillRect(0,0,Lab.W,Lab.H);
  const s=Math.min(Lab.W,Lab.H-260)/N;const o={x:(Lab.W-s*N)/2,y:180};
  c.strokeStyle="#fff";c.lineWidth=2;
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){const cell=grid[r][col];const x=o.x+col*s,y=o.y+r*s;
    if(!cell[0]){c.beginPath();c.moveTo(x,y);c.lineTo(x+s,y);c.stroke();}
    if(!cell[1]){c.beginPath();c.moveTo(x+s,y);c.lineTo(x+s,y+s);c.stroke();}
    if(!cell[2]){c.beginPath();c.moveTo(x,y+s);c.lineTo(x+s,y+s);c.stroke();}
    if(!cell[3]){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+s);c.stroke();}}
  c.lineWidth=1;
  c.fillStyle="#5f8";c.fillRect(o.x+goal.c*s+s*0.25,o.y+goal.r*s+s*0.25,s*0.5,s*0.5);
  c.fillStyle="#fc5";c.beginPath();c.arc(o.x+player.c*s+s/2,o.y+player.r*s+s/2,s*0.3,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
