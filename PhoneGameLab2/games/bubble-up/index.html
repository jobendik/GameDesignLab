<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bubble Up", instructions:"Drag left/right. Rise upward, dodge spikes.", restart:start});
let hero,spikes,t,score;
function start(){
  hero={x:Lab.W/2,y:Lab.H-120,r:22};
  spikes=[];t=0;score=0;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)hero.x=Lab.clamp(x,hero.r,Lab.W-hero.r);}];
  Lab.loop((dt)=>{
    t+=dt;
    if(Math.random()<dt*2.5)spikes.push({x:Lab.rand(20,Lab.W-20),y:-30,vy:Lab.rand(140,260)});
    for(const s of spikes)s.y+=s.vy*dt;
    spikes=spikes.filter(s=>s.y<Lab.H+30);
    for(const s of spikes){if(Lab.dist(s.x,s.y,hero.x,hero.y)<hero.r+10){
      Lab.gameover({title:"Spiked!",message:"Score: "+score});return;}}
    score=Math.floor(t*10);Lab.setScore(score);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#0f1c2a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const s of spikes){c.fillStyle="#f66";c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.x-10,s.y-18);c.lineTo(s.x+10,s.y-18);c.closePath();c.fill();}
  c.fillStyle="rgba(180,220,255,.5)";c.beginPath();c.arc(hero.x,hero.y,hero.r+6,0,Lab.TAU);c.fill();
  c.fillStyle="#fea";c.beginPath();c.arc(hero.x,hero.y,hero.r,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
