<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Return to Sender</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* RETURN TO SENDER — moon jellies are drifting down onto Bun's garden, and Bolt has no blaster: only a tractor beam.
 * Core idea kept: a descending invader formation that must be stopped before it lands, while you dodge its fire.
 * The twist changes the verb: Bolt never shoots. HOLD to beam the lowest jelly above him down into his arms, slide to
 * aim, LET GO to fling it back up. A thrown jelly that hits one of its own colour pops the whole touching same-colour
 * patch (they all bounce home to the moon); a wrong colour only pops the one it hits. So every shot is ammo you choose:
 * which colour to pull, which column to send it to, and how long to hold it while the goo drips.
 * Matched throws in a row build a streak multiplier (x2..x5). Later waves add pot-helmet jellies (can't be beamed;
 * knock the pot off first), rainbow jellies (wild ammo / bridge colours), fizzy jellies (pop a 3x3 burst), divers that
 * peel off at Bolt (catch them in the beam!), a shooting-star saucer worth a heart, and every 5th wave Big Wobble,
 * a mother jelly that refills the formation until she's hit enough times.
 * Identity: a starry garden at night, glossy pastel jellies with belly symbols (not colour-only), Bolt's cyan beam,
 * Bun peeking from the cabbages. Funk music that tightens as the formation sinks.                                   */
let demo = false;
Lab.init({
  title: "Return to Sender", tagline: "No blaster, just a beam. Fling the jellies back where they came from!", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Hold to beam a jelly down to Bolt", "Slide and let go to fling it back up", "Same colour hit = the whole patch pops"],
  theme: { bg: "#1b1f4b", bg2: "#3d3a7a", fg: "#fff6e8", muted: "#b9b6e6", accent: "#3ec5ff", accent2: "#ff8fc7" },
  orient: "any", music: { style: "funk", key: "E", vol: .34 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, INK = Pals.ink;
const JC = [{ c: "#ff8fc7", s: "heart" }, { c: "#5fe0ae", s: "drop" }, { c: "#7cc4ff", s: "star" }, { c: "#ffd84d", s: "moon" }, { c: "#c4a3ff", s: "flower" }];
const RAIN = 5;
let S, cell, fw, fx0, fy0, ufoY, groundY, fenceY, bSize, bY, wide, hudY;
let grid, gc, gr, form, tow, held, shots, divers, drips, ufo, boss, bolt, beam, pressing, aimX, queueThrow, keyWas,
  wave, spec, hearts, score, streak, bestStreak, biggest, popped, phase, phaseT, clock, dripT, diveT, ufoT, bossT, spitT, told, bubble, clonkT, hum, dangerK;

function humSet(o) { if (hum && !demo) hum.set(o); }
function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function say(txt, dur) { if (!demo) bubble = { txt, t: 0, dur: dur || 2.6 }; }
function once(id, txt, dur) { if (!told[id]) { told[id] = 1; say(txt, dur || 3.4); } }

function layout() {
  const P = Lab.play; wide = P.w > P.h * 1.2;
  const cols = gc || (wide ? 9 : 7);
  cell = Math.min((P.w - 16) / (cols + 1.8), P.h / 12.4); S = cell / 44;
  fw = Math.min(P.w - 16, Math.max(cell * (cols + 1.8), wide ? P.w * .5 : 0)); fx0 = P.x + (P.w - fw) / 2;
  hudY = P.y + 16 * Math.max(S, .75); ufoY = P.y + 30 * Math.max(S, .75) + cell * .45; fy0 = ufoY + cell * .55;
  groundY = P.y + P.h - cell * .7; bSize = cell * 1.25; bY = groundY - bSize / 2; fenceY = groundY - bSize * 1.2;
  Lab.sprite.clear("jel"); Lab.sprite.clear("beam");
}
Lab.onResize(() => { layout(); if (bolt) bolt.x = clamp(bolt.x, fx0 + cell * .5, fx0 + fw - cell * .5); });

/* ---------- formation ---------- */
const jx = c => fx0 + form.ox + (c + .5) * cell, jy = r => fy0 + form.oy + form.off + (r + .5) * cell * .9;
function mkJ(k, type) { return { k, type: type || "n", helm: type === "helm", ph: rand(0, TAU), wob: 0, warn: 0 }; }
function waveSpec(n) {
  const b = n % 5 === 0;
  return { boss: b, rows: b ? 2 : Math.min(5, 3 + Math.floor((n - 1) / 2)), cols: n <= 1 ? 2 : n <= 3 ? 3 : n <= 7 ? 4 : 5,
    helm: n >= 3 ? Math.min(7, n - 1) : 0, rain: n >= 4 ? 1 + (n >= 8 ? 1 : 0) : 0, fizz: n >= 6 ? Math.min(3, n - 5) : 0,
    speed: .5 + Math.min(n, 14) * .055, drip: n === 1 ? 3.4 : Math.max(.75, 2.7 - n * .17), dive: n >= 3 ? Math.max(3.2, 9 - n * .45) : 0, ufo: n >= 2 && !b };
}
function buildWave(n, rows) {
  spec = waveSpec(n); gc = wide ? 9 : 7; layout(); gr = spec.rows;
  grid = [];
  for (let r = 0; r < gr; r++) { grid.push([]); for (let c = 0; c < gc; c++) {
    let k = Lab.randInt(0, spec.cols - 1);
    if (Lab.chance(Math.max(.3, .6 - n * .03))) { const nb = [r > 0 && grid[r - 1][c], c > 0 && grid[r][c - 1]].filter(Boolean); if (nb.length) k = Lab.choose(nb).k; }
    grid[r].push(mkJ(k)); } }
  if (rows) grid = rows.map(row => [...row].map(ch => ch === "." ? null : ch === "R" ? mkJ(RAIN, "rain") : ch === "H" ? mkJ(0, "helm") : ch === "F" ? mkJ(1, "fizz") : mkJ(+ch))), gr = grid.length, gc = grid[0].length;
  else {
    const spots = []; for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) spots.push([r, c]); Lab.shuffle(spots);
    const put = (m, type, minR) => { for (let i = 0; i < spots.length && m > 0; i++) { const [r, c] = spots[i]; if (r >= minR && grid[r][c].type === "n") { grid[r][c].type = type; if (type === "helm") grid[r][c].helm = true; if (type === "rain") grid[r][c].k = RAIN; m--; } } };
    put(spec.helm, "helm", gr > 3 ? 1 : 0); put(spec.rain, "rain", 0); put(spec.fizz, "fizz", 0);
  }
  layout();
  form = { ox: (fw - gc * cell) / 2, oy: -(fy0 - Lab.play.y + gr * cell + cell * (spec.boss ? 2 : 0)), drop: 0, dir: Lab.chance(.5) ? 1 : -1, off: spec.boss ? cell * 1.7 : 0 };
  boss = spec.boss ? { x: fx0 + fw / 2, hp: 5 + (n / 5 - 1) * 3, max: 5 + (n / 5 - 1) * 3, dir: 1, sq: 0, hit: 0 } : null;
  phase = "intro"; phaseT = 0; dripT = n === 1 ? 6 : 2.2; diveT = spec.dive || 99; ufoT = rand(9, 16); bossT = 3.5; spitT = 3;
}
function alive() { const a = []; for (let r = 0; r < gr; r++) for (let c = 0; c < gc; c++) if (grid[r][c]) a.push([r, c]); return a; }
function frontline() { const out = []; for (let c = 0; c < gc; c++) for (let r = gr - 1; r >= 0; r--) if (grid[r][c]) { out.push([r, c]); break; } return out; }

/* ---------- popping ---------- */
function popAt(r, c, delay, k) {
  const j = grid[r][c]; if (!j) return 0; grid[r][c] = null; popped++;
  const x = jx(c), y = jy(r);
  Lab.after(delay, () => {
    const col = j.k === RAIN ? "#fff" : JC[j.k].c;
    fx.burst(x, y, { n: 10, colors: [col, "#fff", col], speed: 160 * S, life: .5, size: 3.2 * S, gravity: 120 }); fx.burst(x, y, { n: 3, color: "#fff6c8", shape: "star", speed: 60 * S, life: 1, size: 6 * S, gravity: -160 });
    fx.ring(x, y, { r0: 4, r1: cell * .7, color: col, life: .3, width: 3 });
    if (!demo) Lab.audio.combo(k || 1);
    if (j.type === "fizz") { const n = blast(r, c, .05); addScore(n * 15, x, y + cell * .4, "#ffd84d"); }
  });
  return 1;
}
function blast(r, c, delay) {
  if (!demo) { Lab.after(delay, () => { snd("boom", { vol: .6, pitch: 1.3 }); Lab.shake(5, .2); }); }
  let n = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if (rr < 0 || cc < 0 || rr >= gr || cc >= gc || !grid[rr][cc]) continue;
    if (grid[rr][cc].helm) { grid[rr][cc].helm = false; continue; } n += popAt(rr, cc, delay + .06, 3); }
  return n;
}
function cluster(r, c, K) {
  const seen = new Set([r * 64 + c]), out = [[r, c, 0]];
  for (let i = 0; i < out.length; i++) { const [rr, cc, d] = out[i]; for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const r2 = rr + dr, c2 = cc + dc, key = r2 * 64 + c2;
    if (r2 < 0 || c2 < 0 || r2 >= gr || c2 >= gc || seen.has(key)) continue; const j = grid[r2][c2]; if (!j || j.helm) continue;
    if (j.k === K || j.k === RAIN) { seen.add(key); out.push([r2, c2, d + 1]); } } }
  return out;
}
function addScore(n, x, y, col) { if (n <= 0) return; score += n; Lab.setScore(score); if (!demo) { Lab.bumpScore(); fx.text(x, y, "+" + n, { color: col || "#fff6e8", size: 17 * Math.max(S, .8) }); } }
function hitJelly(r, c, sh) {
  const j = grid[r][c], x = jx(c), y = jy(r);
  if (j.helm) {
    j.helm = false; j.wob = 1; snd("knock", { pitch: 1.2 }); fx.sparks(x, y - cell * .3, -Math.PI / 2, { n: 8, color: "#e6ecf5" });
    fx.burst(x, y - cell * .35, { n: 5, color: "#b7c3d6", shape: "square", speed: 150 * S, life: .5, size: 3 * S, gravity: 400 });
    addScore(5, x, y - cell * .4); once("helm", "Pot's off! Now I can beam it."); return;
  }
  if (sh.type === "fizz") { const n = blast(r, c, 0); addScore(15 * n * mult(), x, y, "#ffd84d"); streak++; bump(n); return; }
  let K = j.k; if (K === RAIN) { K = sh.k === RAIN ? (frontNeighbourColour(r, c)) : sh.k; }
  const match = sh.k === RAIN || j.k === RAIN || sh.k === j.k;
  if (match) {
    const cl = cluster(r, c, K); let n = 0;
    cl.forEach(([rr, cc, d], i) => { n += popAt(rr, cc, d * .055, Math.min(14, i + 1)); });
    streak++; const pts = 10 * n * (n + 1) / 2 * mult(); addScore(pts, x, y - cell * .5, JC[K] ? JC[K].c : "#fff");
    if (n >= 3) { bolt.joy = 1.1; Lab.shake(2 + n * .4, .18); if (!demo) Lab.hitstop(.03); }
    if (n >= 6) { say(Lab.choose(["Whoa! Bye-bye!", "Back to the moon!", "Jelly jackpot!"])); if (!demo) Lab.banner(n + " popped!", { color: "#3ec5ff", ms: 900, y: .5 }); }
    if (streak >= 2) fx.text(sh.x, bY - bSize * .8, "x" + mult(), { color: "#3ec5ff", size: 20 * Math.max(S, .8) });
    bump(n);
  } else {
    popAt(r, c, 0, 1); if (streak >= 2) say("Streak lost!"); streak = 0; addScore(10, x, y);
    once("wrong", "Match the colour to pop more!");
  }
}
function frontNeighbourColour(r, c) { for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) { const j = grid[r + dr] && grid[r + dr][c + dc]; if (j && j.k !== RAIN) return j.k; } return 0; }
function mult() { return Math.min(5, 1 + Math.max(0, streak - 1)); }
function bump(n) { biggest = Math.max(biggest, n); bestStreak = Math.max(bestStreak, streak); }

/* ---------- run ---------- */
function reset() {
  wave = 1; hearts = 3; score = 0; streak = 0; bestStreak = 0; biggest = 0; popped = 0; clock = 0; told = {}; bubble = null; clonkT = 0; dangerK = 0;
  tow = null; held = null; shots = []; divers = []; drips = []; ufo = null; pressing = false; queueThrow = false; keyWas = false; gc = 0;
  layout(); bolt = { x: fx0 + fw / 2, sq: 0, joy: 0, hurt: 0, inv: 0, face: 1, vx: 0, wet: 0 }; aimX = bolt.x; beam = { on: 0, t: 0, ty: 0 };
  buildWave(1);
}
function start() {
  demo = false; reset(); Lab.setScore(0);
  hum = Lab.audio.loop({ type: "sine", f: 280, vol: 0 });
  Lab.input.onDown = [(x) => { pressing = true; aimX = x; }];
  Lab.input.onMove = [(x) => { if (Lab.input.down) aimX = x; }];
  Lab.input.onUp = [() => release()];
  Lab.music.intensity(.2);
  Lab.loop(frame);
  Lab.after(.8, () => once("hi", "Hold under a jelly to beam it down!", 3.6));
}
function release() { if (!pressing) return; pressing = false; if (held) fling(); else if (tow) queueThrow = true; }
function fling() {
  if (!held) return;
  shots.push({ x: held.x, y: held.y, k: held.k, type: held.type, vy: -cell * 24, t: 0 }); held = null; bolt.sq = -.22;
  snd("whoosh", { pitch: 1.2 }); queueThrow = false; once("fling", "Same colour pops the whole patch!", 3);
}
function hurt(why) {
  if (bolt.inv > 0 || phase === "over") return;
  hearts--; bolt.hurt = 1; bolt.inv = 1.6; bolt.wet = 1; streak = 0; Lab.shake(8, .3); Lab.flash("#5fe0ae", .2, .3); Lab.buzz(60); snd("hurt");
  fx.burst(bolt.x, bY - bSize * .3, { n: 14, color: "#7df0c0", speed: 200 * S, life: .6, size: 4 * S, gravity: 500 });
  if (hearts <= 0) end("Bolt got gooped!", "Too much jelly goo. He needs a bath.");
  else say(why || Lab.choose(["Ew, goo!", "Sticky!", "Bleh!"]));
}
function end(title, msg) {
  if (phase === "over") return; phase = "over"; phaseT = 0; pressing = false; tow = null; held = null;
  Lab.after(1.1, () => { Lab.gameover({ title, message: msg, score, stats: [["Waves cleared", wave - 1], ["Biggest pop", biggest], ["Best streak", "x" + Math.min(5, Math.max(1, bestStreak))]] }); });
}
function holdPos() { return [bolt.x, bY - bSize * 1.02 - cell * .32]; }

function frame(dt, t) {
  clock += dt; phaseT += dt;
  update(dt, t); render(t);
}
function update(dt, t) {
  const P = Lab.play, keys = Lab.input.keys;
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.dur) bubble = null; }
  for (const k of ["joy", "hurt"]) bolt[k] = Math.max(0, bolt[k] - dt); bolt.inv = Math.max(0, bolt.inv - dt); bolt.wet = Math.max(0, bolt.wet - dt * .4); clonkT = Math.max(0, clonkT - dt);
  bolt.sq = Lab.damp(bolt.sq, 0, 10, dt);
  // keyboard
  const kd = (keys.ArrowLeft || keys.a ? -1 : 0) + (keys.ArrowRight || keys.d ? 1 : 0), kh = !!(keys[" "] || keys.Space || keys.ArrowUp || keys.w);
  if (kd) aimX = bolt.x + kd * cell * 2.2;
  if (kh && !keyWas) { pressing = true; if (!kd) aimX = bolt.x; } if (!kh && keyWas) release(); keyWas = kh;
  if (phase === "over") { form.oy += cell * 2 * dt; return; }
  // Bolt movement
  const ox = bolt.x; aimX = clamp(aimX, fx0 + cell * .45, fx0 + fw - cell * .45);
  bolt.x = Lab.damp(bolt.x, aimX, 16, dt); bolt.vx = (bolt.x - ox) / Math.max(dt, 1e-4); if (Math.abs(bolt.vx) > 20) bolt.face = Math.sign(bolt.vx);
  if (Math.abs(bolt.vx) > cell * 9 && Lab.chance(dt * 20)) fx.puff(bolt.x - Math.sign(bolt.vx) * bSize * .3, groundY - 2, { n: 2, color: "rgba(220,220,255,.5)", size: 4 * S });
  // formation motion
  if (phase === "intro") { form.oy = Lab.damp(form.oy, 0, 4, dt); if (phaseT > 1.1) { phase = "play"; phaseT = 0; form.oy = 0; } }
  const live = alive(), total = gr * gc;
  if (phase === "play" && live.length) {
    let minC = gc, maxC = -1; for (const [, c] of live) { minC = Math.min(minC, c); maxC = Math.max(maxC, c); }
    const sp = cell * spec.speed * (1 + 1.3 * (1 - live.length / total)) * (spec.boss ? .7 : 1);
    form.ox += form.dir * sp * dt;
    const L = -minC * cell, R = fw - (maxC + 1) * cell;
    if (form.ox < L || form.ox > R) { form.ox = clamp(form.ox, L, R); form.dir *= -1; form.drop += cell * .3; }
    const d = Math.min(form.drop, cell * 1.4 * dt); form.oy += d; form.drop -= d;
    for (const [r, c] of live) if (jy(r) + cell * .38 >= fenceY) { end("They landed!", "The jellies plopped into Bun's cabbages."); return; }
  }
  let low = 0; for (const [r] of live) low = Math.max(low, jy(r)); dangerK = live.length ? clamp((low - fy0) / (fenceY - fy0), 0, 1) : 0;
  Lab.music.intensity(.2 + dangerK * .7);
  for (const [r, c] of live) { const j = grid[r][c]; j.wob = Lab.damp(j.wob, 0, 6, dt); if (j.warn > 0) { j.warn -= dt; if (j.warn <= 0) { drips.push({ x: jx(c), y: jy(r) + cell * .4, vx: 0, vy: cell * 2 }); snd("bubble", { pitch: .6, vol: .5 }); } } }
  // enemy goo
  if (phase === "play") {
    dripT -= dt; if (dripT <= 0) { dripT = spec.drip * rand(.75, 1.25); const f = frontline().filter(([r, c]) => grid[r][c].warn <= 0); if (f.length) { const [r, c] = Lab.chance(.4) ? f.reduce((a, b) => Math.abs(jx(a[1]) - bolt.x) < Math.abs(jx(b[1]) - bolt.x) ? a : b) : Lab.choose(f); grid[r][c].warn = .75; } }
    if (spec.dive) { diveT -= dt; if (diveT <= 0) { diveT = spec.dive * rand(.8, 1.2); const f = frontline().filter(([r, c]) => !grid[r][c].helm && grid[r][c].type !== "fizz"); if (f.length && divers.length < 2) { const [r, c] = Lab.choose(f), j = grid[r][c]; grid[r][c] = null; divers.push({ x: jx(c), y: jy(r), k: j.k, type: j.type, tx: bolt.x, t: 0, x0: jx(c) }); snd("swish", { pitch: .8 }); once("dive", "Incoming! Beam it to catch it!"); } } }
    if (spec.ufo && !ufo) { ufoT -= dt; if (ufoT <= 0) { const d = Lab.chance(.5) ? 1 : -1; ufo = { x: d > 0 ? fx0 - cell : fx0 + fw + cell, dir: d, t: 0 }; snd("chime", { pitch: 1.5 }); } }
    if (boss) {
      boss.x += boss.dir * cell * 1.1 * dt; if (boss.x < fx0 + cell * 1.4 || boss.x > fx0 + fw - cell * 1.4) { boss.x = clamp(boss.x, fx0 + cell * 1.4, fx0 + fw - cell * 1.4); boss.dir *= -1; }
      bossT -= dt; if (bossT <= 0) { bossT = 3.4; const empty = []; for (let c = 0; c < gc; c++) if (!grid[0][c]) empty.push(c); if (empty.length) { const c = Lab.choose(empty); grid[0][c] = mkJ(Lab.randInt(0, spec.cols - 1)); grid[0][c].wob = 1; boss.sq = .3; snd("boing", { pitch: .7 }); } }
      spitT -= dt; if (spitT <= 0 && !boss.warn) { boss.warn = .8; } if (boss.warn) { boss.warn -= dt; if (boss.warn <= 0) { boss.warn = 0; spitT = 2.8; for (const a of [-.25, 0, .25]) drips.push({ x: boss.x, y: fy0 + cell * .6, vx: a * cell * 3, vy: cell * 3 }); snd("splash", { pitch: 1.4, vol: .6 }); } }
      boss.sq = Lab.damp(boss.sq, 0, 8, dt); boss.hit = Math.max(0, boss.hit - dt);
    }
  }
  if (ufo) { ufo.t += dt; ufo.x += ufo.dir * cell * 2.6 * dt; if (ufo.x < fx0 - cell * 1.5 || ufo.x > fx0 + fw + cell * 1.5) { ufo = null; ufoT = rand(15, 24); } }
  // divers
  for (let i = divers.length - 1; i >= 0; i--) { const d = divers[i]; d.t += dt; d.y += cell * (2.4 + wave * .08) * dt; d.x = lerp(d.x0, d.tx, clamp(d.t / 1.6, 0, 1)) + Math.sin(d.t * 5) * cell * .5;
    if (Math.hypot(d.x - bolt.x, d.y - (bY - bSize * .1)) < bSize * .5 + cell * .3) { divers.splice(i, 1); splat(d.x, d.y, d.k); hurt("Oof! A diver!"); continue; }
    if (d.y > groundY - cell * .2) { divers.splice(i, 1); splat(d.x, groundY - 4, d.k); } }
  // drips
  const hp = holdPos();
  for (let i = drips.length - 1; i >= 0; i--) { const d = drips[i]; d.vy += cell * 6 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    const carried = held || (tow && tow.u > .6 ? tow : null);
    if (carried && Math.hypot(d.x - carried.x, d.y - carried.y) < cell * .45) { drips.splice(i, 1); splat(carried.x, carried.y, carried.k); held = null; tow = null; queueThrow = false; snd("splash", { vol: .7 }); say("My jelly! Splat."); continue; }
    if (Math.abs(d.x - bolt.x) < bSize * .42 && d.y > bY - bSize * .55 && d.y < bY + bSize * .45) { drips.splice(i, 1); hurt(); continue; }
    if (d.y > groundY) { drips.splice(i, 1); fx.burst(d.x, groundY - 2, { n: 6, color: "#7df0c0", speed: 90 * S, angle: -Math.PI / 2, spread: 1.6, life: .35, size: 3 * S, gravity: 500 }); } }
  // beam
  beam.on = pressing && !held && phase !== "over" ? Math.min(1, beam.on + dt * 10) : Math.max(0, beam.on - dt * 6); beam.t += dt;
  beam.ty = groundY - 9999;
  if (pressing && !held && !tow && Math.abs(bolt.x - aimX) < cell * .35) {
    let best = null, by = -1e9;
    for (const [r, c] of live) if (Math.abs(jx(c) - bolt.x) < cell * .48 && jy(r) > by) { by = jy(r); best = { r, c }; }
    for (const d of divers) if (Math.abs(d.x - bolt.x) < cell * .65 && d.y > by) { by = d.y; best = { d }; }

  c.save(); c.translate(x, y + h / 2); c.scale(k, k); c.translate(-x, -(y + h / 2));
  Pals.bubble(c, x, y, w, h, { tailX: bolt.x + (right ? 1 : -1) * bSize * .2, tailY: bY - bSize * .75 }); draw.text(c, bubble.txt, x, y + 1, { size: fs, color: INK, weight: 700 }); c.restore();
}

/* ---------- splash backdrop ---------- */
let demoBoot = false;
function attract(dt, t) {
  if (!demoBoot) { demoBoot = true; demo = true; reset(); phase = "play"; form.oy = 0; spec.drip = 99; spec.dive = 0; spec.ufo = false; }
  demo = true; clock += dt; const P = Lab.play;
  if (!tow && !held && !shots.length) { const f = frontline(); if (f.length && Math.sin(t * .9) > .6) { const [r, c] = f[(Math.floor(t * .9 / TAU) * 3) % f.length]; aimX = jx(c); pressing = true; } }
  if (held) { pressing = false; fling(); }
  if (!alive().length) { buildWave(1); phase = "play"; form.oy = 0; spec.drip = 99; spec.dive = 0; spec.ufo = false; }
  update(dt, t); render(t); demo = false;
}

Lab.expose({
  get score() { return score; }, get hearts() { return hearts; }, get wave() { return wave; }, get phase() { return phase; }, get streak() { return streak; },
  get cols() { return gc; }, get rows() { return gr; }, get held() { return held && { k: held.k, type: held.type }; }, get towing() { return !!tow; },
  get shots() { return shots.length; }, get boltX() { return bolt.x; }, get count() { return alive().length; }, get drips() { return drips.length; }, get boss() { return boss && { hp: boss.hp }; },
  grid() { return grid.map(row => row.map(j => j ? (j.helm ? "H" : j.k === RAIN ? "R" : String(j.k)) : ".")); },
  colX(c) { return jx(c); }, get groundY() { return groundY; }, get fenceY() { return fenceY; }, get bY() { return bY; },
  setWave(n, rows) { wave = n; buildWave(n, rows); form.oy = 0; phase = "play"; phaseT = 0; dripT = 99; diveT = 99; ufoT = 99; drips.length = 0; divers.length = 0; tow = null; held = null; shots.length = 0; },
  calm() { dripT = 1e9; diveT = 1e9; ufoT = 1e9; if (boss) { bossT = 1e9; spitT = 1e9; } },
  sink(dy) { form.oy += dy; }, drip(x) { drips.push({ x: x == null ? bolt.x : x, y: bY - bSize * 2.5, vx: 0, vy: cell * 4 }); },
});
Lab.boot();
})();
