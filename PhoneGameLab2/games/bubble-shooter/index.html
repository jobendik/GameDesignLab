<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bubble Shooter", instructions:"Tap above to shoot. Match 3+ same color.", restart:start});
let grid,rows=10,cols=8,bub,shooter,score;
function start(){
  grid=Array.from({length:rows},()=>Array(cols).fill(-1));
  for(let r=0;r<4;r++)for(let c=0;c<cols;c++)grid[r][c]=Lab.randInt(0,3);
  shooter={c:Lab.randInt(0,3)};bub=null;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{if(bub)return;
    const sx=Lab.W/2, sy=Lab.H-60;
    const a=Math.atan2(y-sy,x-sx);
    if(a>-0.1)return;
    bub={x:sx,y:sy,vx:Math.cos(a)*600,vy:Math.sin(a)*600,c:shooter.c};
    shooter.c=Lab.randInt(0,3);
  }];
  Lab.loop((dt)=>{
    if(bub){
      bub.x+=bub.vx*dt; bub.y+=bub.vy*dt;
      if(bub.x<R()||bub.x>Lab.W-R())bub.vx*=-1;
      const cell=R()*2;
      const col=Math.round((bub.x-R())/cell);
      const row=Math.round((bub.y-180-R())/cell);
      if(row<0||(grid[row]&&grid[row][col]>=0)||row>=rows-1){
        const r=Math.max(0,Math.min(rows-1,row));
        const c=Math.max(0,Math.min(cols-1,col));
        let pr=r,pc=c;
        if(grid[pr][pc]>=0){pr=Math.max(0,pr-1);}
        grid[pr][pc]=bub.c;
        const g=flood(pr,pc,bub.c);
        if(g.length>=3){for(const [rr,cc] of g)grid[rr][cc]=-1;score+=g.length*10;Lab.setScore(score);Lab.beep(900,.07);}
        bub=null;
        if(grid[rows-1].some(v=>v>=0))Lab.gameover({title:"Bubbles reached you!",message:"Score: "+score});
      }
    }
    draw();
  });
}
function R(){return Math.min(Lab.W/cols,(Lab.H-260)/rows)/2;}
function flood(r,c,col){const out=[],q=[[r,c]],s=new Set();
  while(q.length){const [rr,cc]=q.pop();const k=rr+","+cc;if(s.has(k))continue;s.add(k);
    if(!grid[rr]||grid[rr][cc]!==col)continue;out.push([rr,cc]);
    q.push([rr+1,cc],[rr-1,cc],[rr,cc+1],[rr,cc-1]);
  }return out;}
function draw(){const c=Lab.ctx;c.fillStyle="#13182d";c.fillRect(0,0,Lab.W,Lab.H);
  const r=R();const cell=r*2;
  const pal=["#f55","#5cf","#fc5","#5f8"];
  for(let R0=0;R0<rows;R0++)for(let C=0;C<cols;C++){const v=grid[R0][C];if(v<0)continue;
    c.fillStyle=pal[v];c.beginPath();c.arc(r+C*cell,180+r+R0*cell,r-2,0,Lab.TAU);c.fill();}
  c.fillStyle=pal[shooter.c];c.beginPath();c.arc(Lab.W/2,Lab.H-60,16,0,Lab.TAU);c.fill();
  if(bub){c.fillStyle=pal[bub.c];c.beginPath();c.arc(bub.x,bub.y,r-2,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
