<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Connect", instructions:"Drag from one colored dot to its pair, no crossings.", restart:start});
const N=5;let grid,pairs,paths,active,win;
function start(){
  grid=Array.from({length:N},()=>Array(N).fill(-1));
  pairs=[];const cols=["#f55","#5cf","#fc5","#5f8"];
  // simple hard-coded puzzle
  const pts=[[0,0,0,4,0],[1,1,1,3,3],[2,2,0,2,4],[3,3,2,4,2]];
  for(const [i,c,r1,c1,r2] of pts){const c2=pts[i][4];
    pairs.push({i:cols[i]});grid[c][r1]=i;grid[c1][r2]=i;}
  paths=Array.from({length:pairs.length},()=>[]);active=null;win=false;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{const p=hit(x,y);if(p&&grid[p.r][p.c]>=0){active={i:grid[p.r][p.c],pts:[p]};paths[active.i]=[p];}}];
  Lab.input.onMove=[(x,y)=>{if(!active)return;const p=hit(x,y);if(!p)return;
    const last=active.pts[active.pts.length-1];
    if(p.r===last.r&&p.c===last.c)return;
    if(Math.abs(p.r-last.r)+Math.abs(p.c-last.c)!==1)return;
    // disallow stepping on other-color cells unless endpoint of same
    if(grid[p.r][p.c]>=0 && grid[p.r][p.c]!==active.i)return;
    if(active.pts.some(q=>q.r===p.r&&q.c===p.c))return;
    // disallow stepping on other paths
    for(let k=0;k<paths.length;k++)if(k!==active.i)for(const q of paths[k])if(q.r===p.r&&q.c===p.c)return;
    active.pts.push(p);paths[active.i]=active.pts;
  }];
  Lab.input.onUp=[()=>{active=null;checkWin();}];
  Lab.loop(()=>draw());
}
function hit(x,y){const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>=N||c<0||c>=N)return null;return {r,c};}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:200};}
function checkWin(){let used=0;for(let i=0;i<paths.length;i++){const p=paths[i];if(p.length<2)return;
    const ends=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]===i)ends.push({r,c});
    const a=p[0],b=p[p.length-1];if(!((a.r===ends[0].r&&a.c===ends[0].c&&b.r===ends[1].r&&b.c===ends[1].c)||(a.r===ends[1].r&&a.c===ends[1].c&&b.r===ends[0].r&&b.c===ends[0].c)))return;
    used+=p.length;}
  if(used===N*N){win=true;Lab.win("Solved!");}
}
function draw(){const c=Lab.ctx;c.fillStyle="#0c1226";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();const cols=["#f55","#5cf","#fc5","#5f8"];
  for(let r=0;r<=N;r++){c.strokeStyle="#222a44";c.beginPath();c.moveTo(o.x,o.y+r*s);c.lineTo(o.x+s*N,o.y+r*s);c.stroke();
    c.beginPath();c.moveTo(o.x+r*s,o.y);c.lineTo(o.x+r*s,o.y+s*N);c.stroke();}
  for(let i=0;i<paths.length;i++){c.strokeStyle=cols[i];c.lineWidth=s*0.4;c.beginPath();
    for(let k=0;k<paths[i].length;k++){const p=paths[i][k];const x=o.x+p.c*s+s/2,y=o.y+p.r*s+s/2;if(k===0)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();c.lineWidth=1;}
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){const v=grid[r][col];if(v<0)continue;
    c.fillStyle=cols[v];c.beginPath();c.arc(o.x+col*s+s/2,o.y+r*s+s/2,s*0.32,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
