<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sky Race", instructions:"Drag to steer the glider. Pass through rings.", restart:start});
let glider,rings,t,score;
function start(){glider={x:Lab.W/2,y:Lab.H-150};rings=[];t=0;score=0;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)glider.x=Lab.clamp(x,30,Lab.W-30);}];
  Lab.loop((dt)=>{t+=dt;if(Math.random()<dt*1.5)rings.push({x:Lab.rand(60,Lab.W-60),y:-40,r:50,vy:Lab.rand(180,260),scored:false});
    for(const r of rings){r.y+=r.vy*dt;
      if(!r.scored && r.y>glider.y-10 && r.y<glider.y+20){r.scored=true;
        if(Math.abs(r.x-glider.x)<r.r){score++;Lab.setScore(score);Lab.beep(1000,.06);}
        else{Lab.gameover({title:"Missed ring",message:"Score: "+score});return;}}}
    rings=rings.filter(r=>r.y<Lab.H+60);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#5ad";c.fillRect(0,0,Lab.W,Lab.H);
  for(const r of rings){c.strokeStyle="#fc5";c.lineWidth=6;c.beginPath();c.arc(r.x,r.y,r.r,0,Lab.TAU);c.stroke();}
  c.lineWidth=1;
  c.fillStyle="#fff";c.beginPath();c.moveTo(glider.x,glider.y-20);c.lineTo(glider.x+30,glider.y+10);c.lineTo(glider.x-30,glider.y+10);c.closePath();c.fill();
}
start();
</script></body></html>
