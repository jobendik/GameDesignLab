<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Snake Trails", instructions:"Drag to steer. Eat dots, dodge enemy.", restart:start});
let snake,dots,enemy,score,target;
function start(){snake=[];for(let i=0;i<10;i++)snake.push({x:Lab.W/2-i*8,y:Lab.H/2});dots=[];for(let i=0;i<30;i++)dots.push({x:Lab.rand(20,Lab.W-20),y:Lab.rand(180,Lab.H-40)});
  enemy={x:80,y:80};score=0;target={x:Lab.W/2,y:Lab.H/2};Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){target.x=x;target.y=y;}}];
  Lab.loop((dt)=>{const h=snake[0];const a=Math.atan2(target.y-h.y,target.x-h.x);const nx=h.x+Math.cos(a)*180*dt,ny=h.y+Math.sin(a)*180*dt;
    snake.unshift({x:nx,y:ny});snake.pop();
    const ea=Math.atan2(h.y-enemy.y,h.x-enemy.x);enemy.x+=Math.cos(ea)*100*dt;enemy.y+=Math.sin(ea)*100*dt;
    for(let i=dots.length-1;i>=0;i--){if(Lab.dist(dots[i].x,dots[i].y,h.x,h.y)<14){dots.splice(i,1);snake.push({x:snake[snake.length-1].x,y:snake[snake.length-1].y});score++;Lab.setScore(score);Lab.beep(900,.04);
      dots.push({x:Lab.rand(20,Lab.W-20),y:Lab.rand(180,Lab.H-40)});}}
    if(Lab.dist(enemy.x,enemy.y,h.x,h.y)<16){Lab.gameover({title:"Eaten!",message:"Score: "+score});return;}
    if(h.x<0||h.x>Lab.W||h.y<160||h.y>Lab.H){Lab.gameover({title:"Edge",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#0a1a0a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const d of dots){c.fillStyle="#fc5";c.beginPath();c.arc(d.x,d.y,4,0,Lab.TAU);c.fill();}
  for(let i=0;i<snake.length;i++){c.fillStyle=i===0?"#5f8":"#3c6";c.beginPath();c.arc(snake[i].x,snake[i].y,8,0,Lab.TAU);c.fill();}
  c.fillStyle="#f55";c.beginPath();c.arc(enemy.x,enemy.y,12,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
