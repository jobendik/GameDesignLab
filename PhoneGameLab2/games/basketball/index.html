<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Basketball", instructions:"Drag-flick the ball toward the moving hoop. 30s.", restart:start});
let ball,hoop,inFlight,t,score,start0;
function start(){
  ball={x:Lab.W/2,y:Lab.H-100,r:24,vx:0,vy:0};
  hoop={x:Lab.W/2,y:200,w:90};
  inFlight=false;t=30;score=0;Lab.setScore(0);start0=null;
  Lab.input.onDown=[(x,y)=>{if(inFlight)return;start0={x,y,bx:ball.x,by:ball.y};}];
  Lab.input.onUp=[(x,y)=>{if(inFlight||!start0)return;
    ball.vx=(start0.x-x)*2.3;ball.vy=(start0.y-y)*2.3;
    inFlight=true;start0=null;}];
  Lab.loop((dt)=>{
    t-=dt;if(t<=0){Lab.gameover({title:"Time!",message:"Score: "+score});return;}
    if(inFlight){ball.vy+=900*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.y>hoop.y-2 && ball.y<hoop.y+10 && ball.x>hoop.x-hoop.w/2 && ball.x<hoop.x+hoop.w/2 && ball.vy>0){
        score++;Lab.setScore(score);Lab.beep(900,.1);reset();}
      if(ball.y>Lab.H+50||ball.x<-50||ball.x>Lab.W+50)reset();
    }
    hoop.x=Lab.W/2+Math.sin(Lab.now()*1.3)*Math.min(140,Lab.W/3);
    draw();
  });
}
function reset(){ball.x=Lab.W/2;ball.y=Lab.H-100;ball.vx=ball.vy=0;inFlight=false;}
function draw(){const c=Lab.ctx;c.fillStyle="#1b1b2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  c.strokeStyle="#ff7";c.lineWidth=4;c.beginPath();c.moveTo(hoop.x-hoop.w/2,hoop.y);c.lineTo(hoop.x+hoop.w/2,hoop.y);c.stroke();
  c.strokeStyle="#fff3";c.beginPath();c.moveTo(hoop.x-hoop.w/2,hoop.y);c.lineTo(hoop.x-hoop.w/2+10,hoop.y+30);c.moveTo(hoop.x+hoop.w/2,hoop.y);c.lineTo(hoop.x+hoop.w/2-10,hoop.y+30);c.stroke();
  c.fillStyle="#f93";c.beginPath();c.arc(ball.x,ball.y,ball.r,0,Lab.TAU);c.fill();
  if(start0){c.strokeStyle="#fff";c.beginPath();c.moveTo(start0.bx,start0.by);c.lineTo(start0.bx+(start0.x-Lab.input.x),start0.by+(start0.y-Lab.input.y));c.stroke();}
}
start();
</script></body></html>
