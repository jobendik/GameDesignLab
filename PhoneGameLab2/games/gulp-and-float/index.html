<title>Gulp & Float</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* GULP & FLOAT — Momo the frog rides a soap bubble from the lily pond up to the stars.
 * Core idea kept: float upward, steer sideways, dodge the prickly things that fall.
 * Twists:  FLOATY INERTIA — the bubble is a soft spring chasing your finger: it lags, overshoots and wobbles.
 *          GULP TO GROW — Momo's tongue snaps up fireflies near the bubble; every 3 gulps blow the bubble one size up.
 *          Size is the score multiplier (×1…×4) AND a spare layer — but a big bubble is a bigger, lazier target.
 *          A prickle pops one layer (back to ×1 gulps); the last pop ends the run. Near misses pay a "close!" bonus.
 *          Five altitude zones add new trouble: bramble arms, bumblebees and wind, hail curtains, falling stars.
 * Identity: an afternoon-to-night climb — mint pond, leafy thicket, golden treetops, pink cloud tops, indigo starlight. */
let demo = false;
Lab.init({
  title: "Gulp & Float", tagline: "Ride a bubble to the stars. Gulp fireflies, dodge the prickles.", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Drag to drift — the bubble is floaty", "Gulp fireflies: bigger bubble, bigger score", "A prickle pops a layer. Don't lose the last!"],
  theme: { bg: "#8fd8cf", bg2: "#e6fbf0", accent: "#2f9d6b", accent2: "#ffb52e", fg: "#1f3b3a", muted: "#44696a", light: true },
  orient: "portrait", music: { style: "chill", key: "G", vol: .4 }, restart: start, attract,
});
const { draw, fx } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, mix = Lab.color.mix, INK = Pals.ink;
const ZONES = [
  { n: "Lily Pond", at: 0, sky: ["#8fd8cf", "#e6fbf0"], leaf: ["#bfe8cf", "#7cc9a0"] },
  { n: "Bramble Thicket", at: 80, sky: ["#9ed59a", "#ecf8c8"], leaf: ["#a5d39a", "#4f9e63"] },
  { n: "Treetops", at: 200, sky: ["#ffc67a", "#fff0c4"], leaf: ["#f3d38a", "#d99a3a"] },
  { n: "Cloud Tops", at: 350, sky: ["#ff9fb5", "#ffdcc4"], leaf: ["#ffe6e2", "#ffffff"] },
  { n: "Starlight", at: 520, sky: ["#221f5c", "#6a4a9a"], leaf: ["#3a3480", "#57479f"] },
];
const RAD = [0, 32, 39, 46, 53], KS = [0, 30, 22, 16, 12], MPX = 28;
let S, P, L, R, bx, by, byT, vx, tx, tier, gulps, rShow, score, alt, flies, streak, bestStreak, maxTier, grazes, over, inv, hurtT, gulpT, wob,
  haz, bugs, winds, spawnT, flyT, zone, clock, hold, windLoop, fall, scroll, lastVine, inWind, night, popT, scareT;

function layout() { P = Lab.play; S = Math.min(Lab.W / 390, P.h / 700); L = P.x + 14 * S; R = P.x + P.w - 14 * S; byT = P.y + P.h * .66; Lab.sprite.clear("gf"); }
Lab.onResize(() => { if (haz) { layout(); bx = clamp(bx, L + 30 * S, R - 30 * S); tx = clamp(tx, L, R); by = byT; } });
function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function reset() {
  bx = tx = (L + R) / 2; by = P.y + P.h * .9; vx = 0; tier = 1; gulps = 0; rShow = RAD[1] * S; score = 0; alt = 0; flies = 0; streak = bestStreak = 0; maxTier = 1; grazes = 0;
  over = false; inv = 0; hurtT = gulpT = wob = popT = scareT = 0; haz = []; bugs = []; winds = []; spawnT = 4.6; flyT = .5; zone = 0; clock = 0; hold = false; fall = null; scroll = 0;
  lastVine = null; inWind = 0; night = false;
  for (let i = 0; i < 4; i++) bugs.push(mkFly(bx + Math.sin(i * 1.3) * 46 * S, byT - (150 + i * 78) * S));
}
function start() {
  demo = false; layout(); reset(); Lab.setScore(0); Lab.setTheme({ fg: "#1f3b3a", muted: "#44696a", light: true });
  windLoop = Lab.audio.loop({ noise: true, bp: 700, vol: 0 });
  Lab.input.onDown = [x => { tx = clamp(x, L, R); }];
  Lab.input.onMove = [x => { if (Lab.input.down) tx = clamp(x, L, R); }];
  Lab.hint("Drag to drift · gulp the fireflies");
  Lab.expose({
    get score() { return Math.floor(score); }, get alt() { return alt; }, set alt(v) { alt = v; }, get tier() { return tier; }, get gulps() { return gulps; }, get flies() { return flies; },
    get x() { return bx; }, get y() { return by; }, get vx() { return vx; }, get r() { return RAD[tier] * S; }, get over() { return over; }, get inv() { return inv; }, set inv(v) { inv = v; },
    get zone() { return zone; }, get grazes() { return grazes; }, get streak() { return streak; }, get hazards() { return haz.length; }, get field() { return { L, R, top: P.y, bot: P.y + P.h }; },
    hold(v) { hold = v; }, clear() { haz = []; bugs = []; winds = []; },
    thorn(x, vy) { const h = mkThorn(x, (vy || 200) * S, 0); h.warn = 0; h.y = by - 260 * S; return haz.push(h); },
    fly(dx, dy, gold) { return bugs.push(mkFly(bx + dx, by + dy, gold)); }, vine(side, len) { haz.push({ k: "vine", side, len: len * S, y: by - 220 * S, minD: 1e9 }); },
    wind(dir) { winds.push({ y: by - 60 * S, h: 120 * S, dir, f: 900 * S }); }, pattern(k) { pattern(k); },
  });
  Lab.loop(frame);
}

/* ---------- spawning ---------- */
function mkFly(x, y, gold) { return { x: clamp(x, L + 26 * S, R - 26 * S), y, ph: rand(0, TAU), gold: !!gold, pull: -1, px: 0, py: 0 }; }
function mkThorn(x, vy, warn, vxx, star) { return { k: "thorn", x: clamp(x, L + 10 * S, R - 10 * S), y: P.y - 26 * S, vx: vxx || 0, vy, rot: rand(0, TAU), warn, r: 10 * S, minD: 1e9, star: !!star }; }
function riseNow() { return (100 + Math.min(95, alt * .16)) * S * (1 + .05 * (tier - 1)); }
function openOf(v) { return v.gate ? [v.a, v.b] : v.side < 0 ? [L + v.len, R] : [L, R - v.len]; }
function addVine(side, len) {
  const w = R - L;
  if (lastVine && lastVine.d < 250 * S) { const o = openOf(lastVine); if (side < 0) len = Math.min(len, o[1] - 125 * S - L); else len = Math.min(len, R - o[0] - 125 * S); }
  if (len < 50 * S) return false;
  const v = { k: "vine", side, len: Math.min(len, w * .62), y: P.y - 40 * S, minD: 1e9, d: 0 }; haz.push(v); lastVine = v; return true;
}
function pattern(k) {
  const w = R - L, z = zone, fast = lerp(150, 250, Math.min(1, alt / 700)) * S;
  k = k || Lab.choose([["thorn"], ["vine", "vine", "gate", "thorn", "thorn"], ["bee", "bee", "wind", "vine", "thorn", "gate"], ["curtain", "stairs", "wind", "bee", "thorn", "vine"],
  ["comet", "comet", "curtain", "stairs", "bee", "gate", "wind", "vine"]][z]);
  if (k === "thorn") { haz.push(mkThorn(Lab.chance(.55) ? bx + rand(-30, 30) * S : rand(L, R), fast * rand(.8, 1.15), .75)); if (alt > 40 && Lab.chance(.4)) haz.push(mkThorn(rand(L, R), fast * rand(.7, 1), 1.1)); }
  else if (k === "vine") { const side = bx < (L + R) / 2 ? (Lab.chance(.7) ? -1 : 1) : (Lab.chance(.7) ? 1 : -1); if (addVine(side, w * rand(.34, .6)) && Lab.chance(.5)) { const v = lastVine; bugs.push(mkFly(side < 0 ? L + v.len + 30 * S : R - v.len - 30 * S, v.y + 14 * S, Lab.chance(.12))); } }
  else if (k === "gate") {
    if (lastVine && lastVine.d < 250 * S) return pattern("thorn");
    const gap = 150 * S, a = rand(L + 40 * S, R - 40 * S - gap); const v1 = { k: "vine", side: -1, len: a - L, y: P.y - 40 * S, minD: 1e9, d: 0 }, v2 = { k: "vine", side: 1, len: R - a - gap, y: P.y - 40 * S, minD: 1e9, d: 0, gate: true, a, b: a + gap };
    haz.push(v1, v2); lastVine = v2; bugs.push(mkFly(a + gap / 2, v1.y - 10 * S)); spawnT += .5;
  }
  else if (k === "bee") { const side = Lab.chance(.5) ? -1 : 1; haz.push({ k: "bee", side, x: side < 0 ? L - 24 * S : R + 24 * S, y: by - rand(300, 400) * S, vx: -side * rand(95, 140) * S, ph: rand(0, TAU), warn: .8, r: 11 * S, minD: 1e9 }); }
  else if (k === "wind") { winds.push({ y: P.y - 130 * S, h: 115 * S, dir: Lab.chance(.5) ? -1 : 1, f: 900 * S }); }
  else if (k === "curtain") {
    const gap = 150 * S, o = lastVine && lastVine.d < 300 * S ? openOf(lastVine) : [L, R], a = clamp(rand(o[0], o[1] - gap), L + 8 * S, R - gap - 8 * S);
    for (let x = L + 12 * S; x < R; x += 34 * S) if (x < a || x > a + gap) haz.push(mkThorn(x, fast * .72, .95)); bugs.push(mkFly(a + gap / 2, P.y - 60 * S, Lab.chance(.2))); spawnT += .9;
  }
  else if (k === "stairs") { const dir = Lab.chance(.5) ? 1 : -1, x0 = dir > 0 ? L + 20 * S : R - 20 * S; for (let i = 0; i < 5; i++) haz.push(mkThorn(x0 + dir * i * w * .17, fast * .9, .7 + i * .2)); spawnT += .7; }
  else if (k === "comet") { const side = Lab.chance(.5) ? -1 : 1; haz.push(mkThorn(side < 0 ? L + rand(0, w * .3) : R - rand(0, w * .3), fast * .8, .9, -side * rand(90, 170) * S, true)); if (Lab.chance(.5)) haz.push(mkThorn(rand(L, R), fast, 1.3)); }
}
function spawnFlies() {
  const n = Lab.randInt(2, 4), x0 = rand(L + 50 * S, R - 50 * S), bend = rand(-1, 1), gold = Lab.chance(alt > 60 ? .1 : 0);
  for (let i = 0; i < n; i++) bugs.push(mkFly(x0 + Math.sin(i * .9) * bend * 60 * S, P.y - (30 + i * 50) * S, gold && i === n - 1));
}

/* ---------- events ---------- */
function gulp(f) {
  flies++; streak++; bestStreak = Math.max(bestStreak, streak); gulpT = .4; wob = Math.max(wob, .35);
  let pts = (5 + Math.min(streak, 10)) * tier, grew = false;
  if (tier < 4) { gulps += f.gold ? 3 : 1; if (gulps >= 3) { tier++; gulps = 0; grew = true; maxTier = Math.max(maxTier, tier); } } else if (f.gold) pts += 60;
  score += pts; if (demo) return;
  fx.text(bx, by - rShow - 12 * S, "+" + pts, { color: f.gold ? "#ffd23f" : night ? "#fff" : "#1f6b4a", size: 18 * S });
  Lab.audio.combo(Math.min(streak, 12)); snd("bubble", { pitch: 1 + tier * .12, vol: .6 }); Lab.bumpScore();
  if (grew) { snd("powerup", { pitch: .8 + tier * .12 }); fx.ring(bx, by, { r0: rShow, r1: RAD[tier] * S * 1.9, color: "#fff", life: .5 }); Lab.banner("×" + tier + " BUBBLE", { color: "#ffd23f", ms: 800, y: .3 }); wob = 1; Lab.buzz(12); }
}
function hit(h) {
  if (inv > 0 || over || demo) return;
  streak = 0; fx.burst(bx, by, { n: 16, colors: ["#fff", "#c9f1ff", "#ffd0ea"], speed: 260 * S, life: .5, size: 4 * S, shape: "circle" }); fx.ring(bx, by, { r0: rShow * .6, r1: rShow * 1.8, color: "#fff", life: .35 });
  if (h.k === "thorn") h.dead = true;
  if (tier > 1) {
    tier--; gulps = 0; inv = 1.5; hurtT = .9; wob = 1; vx += (bx >= (h.k === "vine" ? (h.side < 0 ? L + h.len : R - h.len) : h.x) ? 1 : -1) * 240 * S;
    snd("pop", { pitch: .8 }); snd("hurt", { vol: .6 }); Lab.shake(7, .25); Lab.hitstop(.06); Lab.buzz(30); fx.text(bx, by - rShow - 16 * S, "POP!  ×" + tier, { color: "#ff6b6b", size: 20 * S });
  } else {
    over = true; popT = .001; fall = { x: bx, y: by, vx: vx * .4, vy: -280 * S, rot: 0 }; windLoop.set({ vol: 0 });
    snd("pop", { pitch: .55, vol: 1.3 }); Lab.audio.tone({ f: 880, f2: 200, type: "sine", dur: .9, vol: .16, delay: .15 }); Lab.shake(11, .35); Lab.hitstop(.1); Lab.buzz(60); Lab.music.intensity(0);
    Lab.after(1.25, () => Lab.gameover({ title: "Pop!", message: "Momo floated " + Math.floor(alt) + " m up to " + ZONES[zone].n + ".", score: Math.floor(score), stats: [["Height", Math.floor(alt) + " m"], ["Fireflies", flies], ["Biggest bubble", "×" + maxTier]] }));
  }
}
function segD(px, py, ax, ay, bx2, by2) { const dx = bx2 - ax, dy = by2 - ay, k = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1); return Math.hypot(px - ax - dx * k, py - ay - dy * k); }
function vinePts(v) { const x0 = v.side < 0 ? L - 16 * S : R + 16 * S, x1 = v.side < 0 ? L + v.len : R - v.len; return [x0, v.y, (x0 + x1) / 2, v.y - 14 * S, x1, v.y + 10 * S]; }

/* ---------- update ---------- */
function update(dt) {

  if (!over) { const dm = rise * dt / (MPX * S); alt += dm; score += dm * tier; scroll += rise * dt; if (lastVine) lastVine.d += rise * dt; }
  let z = 0; for (let i = 0; i < ZONES.length; i++) if (alt >= ZONES[i].at) z = i;
  if (z !== zone) {
    zone = z; if (!demo) { Lab.banner(ZONES[z].n.toUpperCase(), { color: "#fff", ms: 1500, y: .22 }); snd("levelup"); Lab.music.intensity(.2 + z * .2); }
    const nt = z >= 4; if (nt !== night) { night = nt; if (!demo) Lab.setTheme(nt ? { fg: "#ffffff", muted: "#cfc8ff", light: false } : { fg: "#1f3b3a", muted: "#44696a", light: true }); }
  }

  inWind = 0; let ax = (tx - bx) * KS[tier] - vx * 1.1 * Math.sqrt(KS[tier]);
  for (const w of winds) { w.y += rise * dt; if (by > w.y && by < w.y + w.h) { ax += w.dir * w.f; inWind = w.dir; } }
  if (!over) { vx += ax * dt; bx += vx * dt; }
  if (bx < L + r * .8) { bx = L + r * .8; if (vx < 0) { vx = -vx * .45; wob = Math.max(wob, .5); } } if (bx > R - r * .8) { bx = R - r * .8; if (vx > 0) { vx = -vx * .45; wob = Math.max(wob, .5); } }
  by = Lab.damp(by, byT + Math.sin(clock * 1.7) * 5 * S, 2.2, dt); rShow = Lab.damp(rShow, r, 9, dt);
  inv = Math.max(0, inv - dt); hurtT = Math.max(0, hurtT - dt); gulpT = Math.max(0, gulpT - dt); wob = Math.max(0, wob - dt * 1.6); scareT = Math.max(0, scareT - dt); if (popT) popT += dt;

  }

function autopilot() {

    else if (h.y < by + r && h.y > by - 230 * S && Math.abs(h.x - bx) < r + 34 * S) want = bx + (bx > h.x ? 1 : -1) * 80 * S;
  }

function frame(dt, t) { update(dt); render(); }
function attract(dt) { if (!demo) { demo = true; layout(); reset(); alt = 90; by = byT; spawnT = .5; } update(dt); render(); }

/* ---------- art ---------- */
function burr() {
  return Lab.sprite("gfburr", 44, 44, g => {
    g.translate(22, 22); g.lineJoin = "round"; g.fillStyle = "#b9503c"; g.strokeStyle = INK; g.lineWidth = 2; g.beginPath();
    for (let i = 0; i < 18; i++) { const a = i / 18 * TAU, rr = i % 2 ? 11 : 20; g[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#e07a55"; g.beginPath(); g.arc(-2, -3, 7, 0, TAU); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(-4.5, 0, 3.4, 0, TAU); g.arc(4.5, 0, 3.4, 0, TAU); g.fill(); g.fillStyle = INK; g.beginPath(); g.arc(-4, .6, 1.6, 0, TAU); g.arc(4, .6, 1.6, 0, TAU); g.fill();
    g.strokeStyle = INK; g.lineWidth = 1.8; g.beginPath(); g.moveTo(-8.5, -5); g.lineTo(-2, -2.6); g.moveTo(8.5, -5); g.lineTo(2, -2.6); g.stroke();
  });
}
function beeSprite() {
  return Lab.sprite("gfbee", 52, 40, g => {
    g.translate(26, 22); g.fillStyle = "rgba(255,255,255,.8)"; g.strokeStyle = "rgba(43,35,64,.35)"; g.lineWidth = 1.2; for (const d of [-1, 1]) { g.beginPath(); g.ellipse(d * 5 - 2, -11, 6, 9, d * .5, 0, TAU); g.fill(); g.stroke(); }

    g.fillStyle = "#ffcf3a"; g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); g.ellipse(0, 0, 14, 10.5, 0, 0, TAU); g.fill(); g.stroke();
    g.save(); g.clip(); g.fillStyle = INK; g.fillRect(-9, -12, 5, 24); g.fillRect(0, -12, 5, 24); g.restore();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(9, -2, 3.2, 0, TAU); g.fill(); g.fillStyle = INK; g.beginPath(); g.arc(9.8, -1.6, 1.6, 0, TAU); g.fill(); g.strokeStyle = INK; g.lineWidth = 1.6; g.beginPath(); g.moveTo(5.5, -7); g.lineTo(11.5, -4.6); g.stroke();
  });
}
function hsh(i) { const x = Math.sin(i * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); }
function zoneMix() { let i = zone, k = 0; if (i < ZONES.length - 1) k = clamp((alt - (ZONES[i + 1].at - 22)) / 22, 0, 1); const a = ZONES[i], b = ZONES[Math.min(i + 1, ZONES.length - 1)]; return { top: mix(a.sky[0], b.sky[0], k), bot: mix(a.sky[1], b.sky[1], k), l0: mix(a.leaf[0], b.leaf[0], k), l1: mix(a.leaf[1], b.leaf[1], k), k: i + k }; }
