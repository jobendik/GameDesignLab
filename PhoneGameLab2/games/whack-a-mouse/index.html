<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Whack-A-Mouse", instructions:"Tap mice, avoid bombs!", restart:start});
const N=3;let holes,t,score,life;
function start(){holes=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)holes.push({r,c,thing:null,t:0});t=20;score=0;life=3;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{for(const h of holes){const p=hpos(h);if(Lab.dist(p.x,p.y,x,y)<30 && h.thing){
      if(h.thing==="mouse"){score++;Lab.setScore(score);Lab.beep(900,.05);}
      else{life--;Lab.beep(200,.1);if(life<=0){Lab.gameover({title:"Boom!",message:"Score: "+score});return;}}
      h.thing=null;h.t=0;return;}}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.win("Score: "+score);return;}
    for(const h of holes){if(h.thing){h.t-=dt;if(h.t<=0)h.thing=null;}
      else if(Math.random()<dt*0.4){h.thing=Math.random()<0.7?"mouse":"bomb";h.t=1.2;}}
    draw();
  });
}
function hpos(h){const s=Math.min(Lab.W,Lab.H-260)/N;const o={x:(Lab.W-s*N)/2,y:180};return {x:o.x+h.c*s+s/2,y:o.y+h.r*s+s/2};}
function draw(){const c=Lab.ctx;c.fillStyle="#3a2a1a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Life: "+life+"  Time: "+Math.ceil(t),12,Lab.H-12);
  for(const h of holes){const p=hpos(h);c.fillStyle="#222";c.beginPath();c.arc(p.x,p.y,38,0,Lab.TAU);c.fill();
    if(h.thing==="mouse"){c.fillStyle="#aaa";c.beginPath();c.arc(p.x,p.y,28,0,Lab.TAU);c.fill();c.fillStyle="#000";c.beginPath();c.arc(p.x-8,p.y-6,3,0,Lab.TAU);c.fill();c.beginPath();c.arc(p.x+8,p.y-6,3,0,Lab.TAU);c.fill();}
    else if(h.thing==="bomb"){c.fillStyle="#000";c.beginPath();c.arc(p.x,p.y,28,0,Lab.TAU);c.fill();c.fillStyle="#f55";c.beginPath();c.arc(p.x,p.y-26,4,0,Lab.TAU);c.fill();}}
}
start();
</script></body></html>
