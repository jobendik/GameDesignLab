(function(){ "use strict";
/* TOP FROG — Momo starts as the smallest frog in the lily pond and eats its way up the pecking order.
 * Core idea kept: eat smaller critters to grow, flee bigger ones.
 * How it differs from an eat-and-grow slider (Big Drip): Momo SWIMS IN KICKS — press to coil (aim at the finger),
 *   release to kick; a longer press is a stronger kick — and EATS WITH HER TONGUE: any snack-sized critter ahead within
 *   reach is snapped up automatically, so good kicks line up chains of gulps (combo multiplier).
 * Hunters (perch, pike, catfish, turtle) STALK, WIND UP (shake + "!" + a dashed lunge line) and LUNGE — a kick
 *   sideways dodges. Outgrow a hunter and the pecking order flips: it sweats and flees from you.
 * From "Splashy Momo" a HERON visits: its shadow crosses the pond, a target follows Momo, locks, strikes. Hide under a
 *   lily pad (pads also hide you from hunters). Caught = spat out ("Bleh!"), smaller, one heart lost; three hearts.

Lab.init({
  title: "Top Frog", tagline: "Kick, snap, grow. Today's snack was yesterday's bully.", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Press to aim, release to kick", "Her tongue snaps up smaller critters", "Dodge lunges, hide from the heron"],
  theme: { bg: "#3c8f7a", bg2: "#bdebd6", fg: "#16372f", muted: "#2f6b5c", accent: "#ff8a3d", accent2: "#ff6b8a", light: true },
  orient: "any", music: { style: "funk", key: "D", vol: .36 }, restart: start,

});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, INK = Pals.ink, mix = Lab.color.mix, shade = Lab.color.shade;

const WS = 2200;
const K = {
  gnat: { r: 5, pts: 5, sp: 26, c: "#4a4560", n: "Gnat" }, tad: { r: 8, pts: 10, sp: 42, c: "#6b5640", flee: 1, n: "Tadpole" },
  minnow: { r: 11, pts: 15, sp: 64, c: "#b9cde0", flee: 1, n: "Minnow" }, beetle: { r: 15, pts: 25, sp: 38, c: "#40548f", flee: 1, n: "Beetle" },
  newt: { r: 20, pts: 40, sp: 52, c: "#ff8a3d", flee: 1, n: "Newt" }, perch: { r: 27, pts: 60, sp: 52, c: "#a7cf5e", hunt: 520, n: "Perch" },
  pike: { r: 37, pts: 100, sp: 58, c: "#7f9c70", hunt: 600, n: "Pike" }, cat: { r: 50, pts: 160, sp: 44, c: "#a0805e", hunt: 520, n: "Catfish" },

  { r: 38, n: "Big Momo", w: "#6aa98f" }, { r: 50, n: "Huge Momo", w: "#5f85a3" }, { r: 64, n: "Pond King", w: "#41558f" }];

function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function layout() { W = Lab.W; H = Lab.H; }
Lab.onResize(layout);
const baseZ = () => clamp(Math.min(W, H * .75) / 260, 1, 2.6);

const edible = k => K[k].r < M.r * .92;

/* ---------- setup ---------- */
function setup() {

}
function spawn(near) {

  const x = clamp(M.x + Math.cos(a) * d, 60, WS - 60), y = clamp(M.y + Math.sin(a) * d, 60, WS - 60);

function addCrit(kind, x, y, st) { const c = { id: nextId++, kind, x, y, a: Lab.rand(0, TAU), v: 0, st: st || "roam", t: Lab.rand(0, 2), ph: Lab.rand(0, TAU), la: 0, grab: false, sweat: 0 }; crit.push(c); return c; }
const viewR = () => Math.hypot(W, H) / 2 / (Z || 1);
function start() {

  Lab.input.onDown = [(x, y) => { M.hold = true; aim = [x, y]; M.charge = 0; }];
  Lab.input.onMove = [(x, y) => { if (M.hold) aim = [x, y]; }];
  Lab.input.onUp = [(x, y) => { if (M.hold) { aim = [x, y]; const [wx, wy] = toWorld(x, y), d = Math.hypot(wx - M.x, wy - M.y); kick(d > M.r * .8 ? Math.atan2(wy - M.y, wx - M.x) : M.a, M.charge); } M.hold = false; }];

  Lab.expose({
    get score() { return score; }, get hearts() { return hearts; }, get r() { return M.r; }, get m() { return M.m; }, set m(v) { M.m = v; grow(0); }, get tier() { return tier; }, get combo() { return combo; }, get eaten() { return eaten; },
    get momo() { return { x: M.x, y: M.y, vx: M.vx, vy: M.vy, a: M.a, inv: M.inv, hidden: M.hidden }; }, set inv(v) { M.inv = v; }, toScreen: (x, y) => toScreen(x, y),
    crit: () => crit.map(c => ({ id: c.id, kind: c.kind, x: c.x, y: c.y, st: c.st })), edible, threat, get heron() { return heron.st; },
    place(kind, dx, dy, st) { const c = addCrit(kind, M.x + dx, M.y + dy, st); if (st === "hold") c.v = 0; if (st === "lunge") { c.a = Math.atan2(-dy, -dx); c.t = .6; c.v = K[kind].hunt; } return c.id; },
    clear() { crit = []; }, setMomo(x, y, a) { M.x = x; M.y = y; M.vx = M.vy = 0; if (a != null) M.a = a; cam.x = x; cam.y = y; }, kick, heronNow() { heron.st = "idle"; heron.t = 0; },
    pads: () => pads.map(p => ({ x: p.x, y: p.y, r: p.r })), padHere() { pads.push({ x: M.x, y: M.y, r: 80, a: 0, spin: 0 }); }, noPads() { pads = []; },
  });

}
function kick(a, ch) {

  snd("swish", { pitch: 1.25 - Math.min(.6, (M.r - 14) / 100) + ch * .2, vol: .7 }); Lab.buzz(6);
  fx.ring(M.x - Math.cos(a) * M.r, M.y - Math.sin(a) * M.r, { r0: M.r * .4, r1: M.r * (1.2 + ch), color: "rgba(255,255,255,.7)", life: .45, width: 2.5 });

/* ---------- update ---------- */

      if (c.st === "stalk") { c.a += Lab.angleDiff(c.a, toM) * Math.min(1, dt * 3); c.v = Lab.damp(c.v, k.sp * 1.15, 3, dt); if (M.hidden || M.inv > 0 || d > sight * 1.6 || c.t < 0) { c.st = "roam"; c.t = 2; } else if (d < k.r + M.r + 150) { c.st = "wind"; c.t = .65; c.la = Math.atan2(M.y + M.vy * .25 - c.y, M.x + M.vx * .25 - c.x); snd("warn", { pitch: 1.4 - k.r / 100, vol: .5 }); } }

    if (!isT || c.st === "roam") {

      if (scared) { c.st = "flee"; c.a += Lab.angleDiff(c.a, toM + Math.PI) * Math.min(1, dt * 6); c.v = Lab.damp(c.v, k.sp * 1.7, 4, dt); if (k.hunt) c.sweat = .5; }

function gulp(c) {

function grow(dm) {

  if (demo) { tier = t; return; }

  else if (h.st === "shadow") { h.sx = 1 - h.t / 1.8; if (h.t <= 0) { h.st = "aim"; h.t = 1.1; h.x = M.x + Lab.rand(-80, 80); h.y = M.y + Lab.rand(-80, 80); } }
  else if (h.st === "aim") { h.x = Lab.damp(h.x, M.x, 3.2, dt); h.y = Lab.damp(h.y, M.y, 3.2, dt); if (h.t <= 0) { h.st = "lock"; h.t = .45; snd("tick", { pitch: 1.6 }); } }
