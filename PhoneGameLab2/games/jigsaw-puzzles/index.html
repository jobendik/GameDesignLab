<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Jigsaw Puzzles", instructions:"Drag pieces to swap. Get the image in order.", restart:start});
const N=3;let order,drag,score;
function start(){order=[];for(let i=0;i<N*N;i++)order.push(i);
  for(let i=order.length-1;i>0;i--){const j=Lab.randInt(0,i);[order[i],order[j]]=[order[j],order[i]];}
  drag=null;Lab.setScore(moves());
  Lab.input.onDown=[(x,y)=>{const i=hit(x,y);if(i>=0)drag={i,x,y};}];
  Lab.input.onMove=[(x,y)=>{if(drag){drag.x=x;drag.y=y;}}];
  Lab.input.onUp=[(x,y)=>{if(!drag)return;const j=hit(x,y);if(j>=0&&j!==drag.i){[order[drag.i],order[j]]=[order[j],order[drag.i]];}
    drag=null;Lab.setScore(moves());if(order.every((v,i)=>v===i))Lab.win("Solved!");}];
  Lab.loop(()=>draw());
}
function moves(){return order.filter((v,i)=>v!==i).length;}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function hit(x,y){const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>=N||c<0||c>=N)return -1;return r*N+c;}
function draw(){const c=Lab.ctx;c.fillStyle="#1a2238";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();
  for(let i=0;i<N*N;i++){const v=order[i],r=Math.floor(i/N),col=i%N;
    const sr=Math.floor(v/N),sc=v%N;
    c.fillStyle=`hsl(${v*40},70%,55%)`;c.fillRect(o.x+col*s+2,o.y+r*s+2,s-4,s-4);
    c.fillStyle="#fff";c.font="20px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(v+1,o.x+col*s+s/2,o.y+r*s+s/2);}
  if(drag){const v=order[drag.i];c.fillStyle=`hsla(${v*40},70%,55%,.7)`;c.fillRect(drag.x-s/2,drag.y-s/2,s,s);}
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Out of place: "+moves(),12,Lab.H-12);
}
start();
</script></body></html>
