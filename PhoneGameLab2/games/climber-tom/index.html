<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Climber Tom", instructions:"Tap to jump to the other wall. Avoid spikes.", restart:start});
let hero,side,spikes,t,score,scroll;
function start(){
  hero={y:Lab.H-120,vy:0,jump:false};side="L";scroll=0;
  spikes=[];for(let i=0;i<10;i++)spikes.push({y:-i*180-200,side:Math.random()<0.5?"L":"R"});
  score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(!hero.jump){hero.jump=true;hero.vx=side==="L"?500:-500;}}];
  Lab.loop((dt)=>{
    scroll+=60*dt;score=Math.floor(scroll/30);Lab.setScore(score);
    for(const s of spikes){s.y+=60*dt;if(s.y>Lab.H+40){s.y-=2000;s.side=Math.random()<0.5?"L":"R";}}
    if(hero.jump){const x=side==="L"?80:Lab.W-80;
      hero.tx=(hero.tx||x)+hero.vx*dt;
      const target=side==="L"?Lab.W-80:80;
      if((side==="L"&&hero.tx>=target)||(side==="R"&&hero.tx<=target)){side=side==="L"?"R":"L";hero.jump=false;hero.tx=null;}
    }
    // collide spikes
    for(const s of spikes){if(Math.abs(s.y-hero.y)<25 && s.side===side && !hero.jump){Lab.gameover({title:"Ouch!",message:"Height: "+score});return;}}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#221638";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#3a2a4a";c.fillRect(0,0,40,Lab.H);c.fillRect(Lab.W-40,0,40,Lab.H);
  for(const s of spikes){c.fillStyle="#f66";const x=s.side==="L"?40:Lab.W-40;
    c.beginPath();c.moveTo(x,s.y);c.lineTo(x+(s.side==="L"?20:-20),s.y-10);c.lineTo(x+(s.side==="L"?20:-20),s.y+10);c.closePath();c.fill();}
  const x=hero.jump?hero.tx:(side==="L"?80:Lab.W-80);
  c.fillStyle="#fc5";c.beginPath();c.arc(x,hero.y,18,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
