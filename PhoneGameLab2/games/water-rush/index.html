<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Water Rush", instructions:"Tap pipe tiles to rotate. Connect source to drain before water arrives.", restart:start});
const N=5;let grid,t,flowDist;
// pipe shape: array of open directions [N,E,S,W]
function start(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++){row.push({open:randomOpen(),flow:false});}grid.push(row);}
  grid[0][0].open=[0,1,0,1];grid[N-1][N-1].open=[0,1,0,1];
  t=12;flowDist=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{const s=size(),o=off();const r=Math.floor((y-o.y)/s),c=Math.floor((x-o.x)/s);if(r<0||c<0||r>=N||c>=N)return;
    if((r===0&&c===0)||(r===N-1&&c===N-1))return;grid[r][c].open.unshift(grid[r][c].open.pop());Lab.beep(600,.04);}];
  Lab.loop((dt)=>{t-=dt;if(t<0){checkFlow();if(connected())Lab.win("Connected!");else Lab.gameover({title:"Leak!",message:""});return;}Lab.setScore(Math.ceil(t));draw();});
}
function randomOpen(){const o=[0,0,0,0];const n=Lab.randInt(2,3);const idx=[0,1,2,3];for(let i=0;i<n;i++){const k=Lab.randInt(0,idx.length-1);o[idx[k]]=1;idx.splice(k,1);}return o;}
function connected(){const seen=new Set();const stk=[[0,0]];while(stk.length){const [r,c]=stk.pop();const k=r+","+c;if(seen.has(k))continue;seen.add(k);if(r===N-1&&c===N-1)return true;
    const cell=grid[r][c];const dirs=[[-1,0,0,2],[0,1,1,3],[1,0,2,0],[0,-1,3,1]];
    for(const [dr,dc,d,od] of dirs){if(!cell.open[d])continue;const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=N||nc>=N)continue;if(!grid[nr][nc].open[od])continue;stk.push([nr,nc]);}}return false;}
function checkFlow(){}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function draw(){const c=Lab.ctx;c.fillStyle="#0a2a4a";c.fillRect(0,0,Lab.W,Lab.H);
  const s=size(),o=off();
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){const x=o.x+cc*s,y=o.y+r*s;c.fillStyle="#1a3a5a";c.fillRect(x+2,y+2,s-4,s-4);
    const cell=grid[r][cc];c.strokeStyle="#5cf";c.lineWidth=10;
    if(cell.open[0]){c.beginPath();c.moveTo(x+s/2,y+s/2);c.lineTo(x+s/2,y);c.stroke();}
    if(cell.open[1]){c.beginPath();c.moveTo(x+s/2,y+s/2);c.lineTo(x+s,y+s/2);c.stroke();}
    if(cell.open[2]){c.beginPath();c.moveTo(x+s/2,y+s/2);c.lineTo(x+s/2,y+s);c.stroke();}
    if(cell.open[3]){c.beginPath();c.moveTo(x+s/2,y+s/2);c.lineTo(x,y+s/2);c.stroke();}c.lineWidth=1;}
  c.fillStyle="#3df58a";c.fillRect(o.x+2,o.y+2,s-4,s-4);
  c.fillStyle="#f55";c.fillRect(o.x+(N-1)*s+2,o.y+(N-1)*s+2,s-4,s-4);
}
start();
</script></body></html>
