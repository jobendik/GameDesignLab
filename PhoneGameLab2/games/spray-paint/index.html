<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Spray Paint", instructions:"Drag to spray. Tap color swatches.", restart:start});
let strokes,sel;
const COLORS=["#f55","#fc5","#5f8","#5cf","#a4f","#fff","#000"];
function start(){strokes=[];sel=0;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{if(y>Lab.H-60){const i=Math.floor(x/(Lab.W/COLORS.length));if(i<COLORS.length)sel=i;return;}strokes.push({c:COLORS[sel],pts:[{x,y}]});}];
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down&&y<Lab.H-60&&strokes.length){strokes[strokes.length-1].pts.push({x,y});}}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#222";c.fillRect(0,0,Lab.W,Lab.H);
  // stencil
  c.fillStyle="#333";c.beginPath();c.arc(Lab.W/2,Lab.H/2,140,0,Lab.TAU);c.fill();
  c.save();c.beginPath();c.arc(Lab.W/2,Lab.H/2,140,0,Lab.TAU);c.clip();
  for(const s of strokes){c.fillStyle=s.c;for(const p of s.pts){c.beginPath();c.arc(p.x,p.y,16,0,Lab.TAU);c.globalAlpha=0.2;c.fill();}}
  c.globalAlpha=1;c.restore();
  c.fillStyle="#000";c.fillRect(0,Lab.H-60,Lab.W,60);
  for(let i=0;i<COLORS.length;i++){c.fillStyle=COLORS[i];c.fillRect(i*Lab.W/COLORS.length+4,Lab.H-54,Lab.W/COLORS.length-8,48);
    if(i===sel){c.strokeStyle="#fff";c.lineWidth=3;c.strokeRect(i*Lab.W/COLORS.length+4,Lab.H-54,Lab.W/COLORS.length-8,48);c.lineWidth=1;}}
}
start();
</script></body></html>
