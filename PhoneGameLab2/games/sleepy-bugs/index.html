<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sleepy Bugs", instructions:"Drag each bug to its matching color bed.", restart:start});
let bugs,beds,drag,score;
const COLORS=["#f55","#5cf","#fc5","#5f8"];
function start(){bugs=[];beds=[];
  for(let i=0;i<COLORS.length;i++){bugs.push({c:COLORS[i],x:Lab.rand(40,Lab.W-40),y:Lab.rand(180,Lab.H-200),placed:false});
    beds.push({c:COLORS[i],x:40+i*((Lab.W-80)/(COLORS.length-1)),y:Lab.H-100});}
  drag=null;score=0;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{for(const b of bugs){if(!b.placed&&Lab.dist(b.x,b.y,x,y)<20){drag=b;return;}}}];
  Lab.input.onMove=[(x,y)=>{if(drag){drag.x=x;drag.y=y;}}];
  Lab.input.onUp=[(x,y)=>{if(drag){for(const bed of beds){if(bed.c===drag.c && Lab.dist(bed.x,bed.y,drag.x,drag.y)<40){drag.x=bed.x;drag.y=bed.y;drag.placed=true;score++;Lab.setScore(score);Lab.beep(900,.06);
      if(bugs.every(b=>b.placed))Lab.win("All asleep!");break;}}drag=null;}}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#101830";c.fillRect(0,0,Lab.W,Lab.H);
  for(const bed of beds){c.strokeStyle=bed.c;c.lineWidth=4;c.strokeRect(bed.x-30,bed.y-20,60,40);c.lineWidth=1;}
  for(const b of bugs){c.fillStyle=b.c;c.beginPath();c.arc(b.x,b.y,18,0,Lab.TAU);c.fill();
    if(b.placed){c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("z",b.x,b.y-2);}}
}
start();
</script></body></html>
