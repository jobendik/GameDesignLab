<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Wire Ball", instructions:"Drag the ring along the wavy wire. Don't touch!", restart:start});
let pts,prog,score;
function start(){pts=[];for(let i=0;i<=40;i++)pts.push({x:40+(Lab.W-80)*i/40,y:Lab.H/2+Math.sin(i*0.5)*Lab.rand(40,120)});
  prog=0;score=0;Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(!Lab.input.down)return;
    let best=prog,bd=1e9;for(let i=Math.max(0,prog-3);i<Math.min(pts.length,prog+10);i++){const d=Lab.dist(pts[i].x,pts[i].y,x,y);if(d<bd){bd=d;best=i;}}
    if(bd>26){Lab.gameover({title:"Zapped!",message:"Progress: "+prog});return;}
    if(best>=prog){prog=best;Lab.setScore(prog);}else{Lab.gameover({title:"Backwards!",message:""});return;}
    if(prog>=pts.length-1)Lab.win("Made it!");
  }];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a1010";c.fillRect(0,0,Lab.W,Lab.H);
  c.strokeStyle="#fc5";c.lineWidth=4;c.beginPath();for(let i=0;i<pts.length;i++){if(i===0)c.moveTo(pts[i].x,pts[i].y);else c.lineTo(pts[i].x,pts[i].y);}c.stroke();c.lineWidth=1;
  const p=pts[prog];c.strokeStyle="#5cf";c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,18,0,Lab.TAU);c.stroke();c.lineWidth=1;
  c.fillStyle="#5f8";c.beginPath();c.arc(pts[0].x,pts[0].y,8,0,Lab.TAU);c.fill();
  c.fillStyle="#f55";c.beginPath();c.arc(pts[pts.length-1].x,pts[pts.length-1].y,8,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
