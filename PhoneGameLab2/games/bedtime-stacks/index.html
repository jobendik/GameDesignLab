<title>Bedtime Stacks</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* BEDTIME STACKS — Olli the owl can't sleep without a story. The reading rug is a 4×4 slide-and-merge board, and Olli
 * sits ON it: every swipe slides him along with the books, and nothing passes him.
 * Core idea kept: swipe, equal tiles merge (Vol.1 + Vol.1 = Vol.2 …).
 * Twists:  OLLI IS A PIECE — a wandering wall that is also the goal: slide the volume he is thinking of INTO him and he
 *          reads it (the book leaves the rug: space!), then wishes for another, higher one.  Quick reads earn up to 3 stars.
 *          DUST BUNNIES roll in later (never merge; slide them into Olli and he hoots them away).
 *          Every third book finishes a chapter and a GOLDEN BOOK arrives: it merges with anything.
 * Identity: night-time reading nook — indigo floorboards, moonlit window patch, amber lamp, plum rug, pastel hardbacks;
 *          soft "dream" music that thickens as the rug fills; page-flip + chime when Olli reads. */
let demo = false, demoT = 0;
Lab.init({
  title: "Bedtime Stacks", tagline: "Slide the books. Bring Olli his bedtime story.", category: "Puzzle", kicker: "Pocket Pals",
  howto: ["Swipe: every book slides, and so does Olli", "Two equal volumes make the next one", "Slide the book he wants into Olli"],
  theme: { bg: "#1a1634", bg2: "#3a2f63", accent: "#ffb52e", accent2: "#ff9d7a" },
  orient: "any", music: { style: "dream", key: "F", vol: .45 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, shade = Lab.color.shade, INK = Pals.ink;
const N = 4, DUR = .12, MAXT = 11;
const COL = [null, "#9fd8cb", "#ffc2a8", "#ffe08a", "#b9a3ff", "#8fd3ff", "#ff9eb5", "#8ed081", "#ffa94d", "#7f97ff", "#e879b9", "#ff7a6b"];
const WISH = [2, 3, 3, 4, 3, 4, 5, 4, 5, 6, 5, 6, 6, 7, 6, 7, 7, 8];
const DIRS = { L: [0, -1], R: [0, 1], U: [-1, 0], D: [1, 0] }, tally = { m: 0, e: 0 };
let S, wide, side, bx, by, cell, gap, pad, card = {}, shelf = {};
let tiles, ghosts, olli, wish, wishMoves, reads, moves, score, maxTier, over, anim, events, queue, wildDue, dustClock, bump, lastDir, lookT,
  joyT, wowT, hootT, olliSq, chapter, readPile, clock, idle, bubble, told, stars3;

const wishFor = n => n < WISH.length ? WISH[n] : Math.min(MAXT - 1, 7 + Math.floor((n - WISH.length + 2) / 3));
const quickLimit = w => 4 + 3 * Math.pow(2, w - 2);
const starsNow = () => wishMoves <= quickLimit(wish) ? 3 : wishMoves <= quickLimit(wish) * 2 ? 2 : 1;
function snd(name, o) { if (!demo) Lab.sfx(name, o); }

function layout() {
  const P = Lab.play; wide = P.w > P.h * 1.15;
  if (wide) {
    side = Math.min(P.h - 14, P.w * .52); S = side / 370; bx = P.x + (P.w - side) / 2; by = P.y + (P.h - side) / 2;
    const pw = Math.min(230 * Math.max(S, .8), bx - P.x - 28);
    card = { x: bx - 14 - pw, y: by, w: pw, h: side, v: true }; shelf = { x: bx + side + 14, y: by, w: pw, h: side };
  } else {
    S = Math.min(P.w / 390, P.h / 720); const hh = 108 * S; let sh = 96 * S;
    side = Math.min(P.w - 20, P.h - hh - sh - 40 * S); sh = clamp(P.h - hh - side - 70 * S, 96 * S, 170 * S); const total = hh + side + sh + 24 * S, y0 = P.y + Math.max(4, (P.h - total) * .4);
    bx = P.x + (P.w - side) / 2; card = { x: bx, y: y0, w: side, h: hh, v: false }; by = y0 + hh + 12 * S; shelf = { x: bx, y: by + side + 12 * S, w: side, h: sh };
  }

}
Lab.onResize(() => { if (tiles) layout(); });

function add(kind, tier, r, c) { const t = { kind, tier, r, c, fr: r, fc: c, pop: 0, born: 0, show: null }; tiles.push(t); return t; }
function gridOf() { const g = Array.from({ length: N }, () => Array(N).fill(null)); for (const t of tiles) g[t.r][t.c] = t; return g; }

function reset() {
  tiles = []; ghosts = []; score = 0; reads = 0; moves = 0; maxTier = 1; over = false; anim = null; queue = []; wildDue = false; dustClock = 0;
  bump = { t: 0, dr: 0, dc: 0 }; lastDir = null; lookT = 0; joyT = wowT = hootT = 0; olliSq = 0; chapter = 1; readPile = []; clock = 0; idle = 0; bubble = 0; told = {}; stars3 = 0;
  olli = add("olli", 0, 2, 1); olli.born = 1;
  for (let i = 0; i < 3; i++) { const [r, c] = Lab.choose(empties()); add("book", 1, r, c).born = 1; }
  wish = wishFor(0); wishMoves = 0;
}
function start() {
  demo = false; layout(); reset(); Lab.setScore(0);
  Lab.input.swipeEarly = true;
  Lab.input.onSwipe = [(dx, dy) => move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"))];
  Lab.input.onKey = [k => { const d = { ArrowLeft: "L", ArrowRight: "R", ArrowUp: "U", ArrowDown: "D", a: "L", d: "R", w: "U", s: "D" }[k]; if (d) move(d); }];
  if (!wide) Lab.hint("Swipe to slide the books");
  Lab.expose({
    get score() { return score; }, get wish() { return wish; }, get reads() { return reads; }, get moves() { return moves; }, get over() { return over; },
    get busy() { return !!anim; }, get stars() { return starsNow(); }, get chapter() { return chapter; }, move,
    peek(d) { const ok = slide(d, true); return { ok, merges: tally.m, eats: tally.e }; },
    grid() { const g = gridOf(); return g.map(row => row.map(t => !t ? "" : t.kind === "olli" ? "O" : t.kind === "dust" ? "d" : t.kind === "wild" ? "w" : "b" + t.tier)); },
    set(rows, w) { tiles = []; ghosts = []; anim = null; queue = []; rows.forEach((row, r) => row.forEach((s, c) => { if (!s) return; const t = s === "O" ? (olli = add("olli", 0, r, c)) : s === "d" ? add("dust", 0, r, c) : s === "w" ? add("wild", 0, r, c) : add("book", +s.slice(1), r, c); t.born = 1; })); if (w) { wish = w; wishMoves = 0; } },
  });
  Lab.loop(frame);
}

/* ---------- rules ---------- */
function mergeable(a, b) { if (a.kind === "wild" && b.kind === "wild") return false; if (a.kind === "wild") return b.kind === "book" && b.tier < MAXT; if (b.kind === "wild") return a.kind === "book" && a.tier < MAXT; return a.kind === "book" && b.kind === "book" && a.tier === b.tier && a.tier < MAXT; }

/* Slides every line toward `dir`. dry=true only answers "would anything happen?". */
function slide(dir, dry) {

        const nt = (last.kind === "wild" ? t.tier : last.tier) + 1;
        ghosts.push({ kind: t.kind, tier: t.tier, fr: r, fc: c, r: last.r, c: last.c }); t.dead = true;
        if (!last.show) last.show = { kind: last.kind, tier: last.tier }; last.kind = "book"; last.tier = nt; events.push({ k: "merge", into: last, tier: nt });
      } else if (last && last.kind === "olli" && !ate && accepts(t)) {
        moved = true; ate = true; tally.e++; if (dry) continue;
        ghosts.push({ kind: t.kind, tier: t.tier, fr: r, fc: c, r: last.r, c: last.c }); t.dead = true; events.push({ k: t.kind === "dust" ? "dust" : "read", tier: t.tier });
      } else if (last && t.kind === "olli" && !ate && accepts(last)) {   // Olli slides into the book himself
        moved = true; ate = true; tally.e++;
        if (!dry) { ghosts.push({ kind: last.kind, tier: last.tier, fr: last.r, fc: last.c, r: last.r, c: last.c }); last.dead = true; t.r = last.r; t.c = last.c; events.push({ k: last.kind === "dust" ? "dust" : "read", tier: last.tier }); }

}
function move(dir) {

}

  for (const t of tiles) { t.fr = t.r; t.fc = t.c; t.show = null; }

  for (const e of ev) {
    if (e.k === "merge") {
      const [x, y] = xy(e.into.r, e.into.c), gain = Math.pow(2, e.tier); e.into.pop = 1; score += gain; n++;
      if (e.tier > maxTier) { maxTier = e.tier; if (e.tier >= 6 && !demo) Lab.toast("Volume " + e.tier + "!", 900, { y: .16 }); }
      fx.burst(x, y, { n: 6 + e.tier * 2, colors: [COL[e.tier], "#fff6e3", "#ffb52e"], speed: 120 + e.tier * 18, life: .5, size: 3 + e.tier * .3, gravity: 160, shape: "square" });
      fx.text(x, y - cell * .42, "+" + gain, { size: 15 + Math.min(10, e.tier), color: "#fff6e3" });

    else { const [x, y] = xy(olli.r, olli.c); score += 5; hootT = .7; fx.puff(x, y - cell * .1, { n: 12, color: "#d9d0f0" }); fx.text(x, y - cell * .5, "Hoo! +5", { size: 16, color: "#e7defc" }); snd("whoosh", { pitch: 1.3 }); }
  }

  if (!ev.some(e => e.k === "read")) spawn();          // a read book buys a breather: nothing new arrives that move

}
function readBook(tier) {

  reads++; score += gain; joyT = 1.4; olliSq = -.25; readPile.push(tier); if (st === 3) stars3++;
  fx.burst(x, y, { n: 22, colors: ["#ffe08a", "#fff6e3", COL[tier]], speed: 260, life: .8, size: 5, gravity: 240, shape: "star" });
  fx.ring(x, y, { r0: cell * .3, r1: cell * 1.2, color: "#ffe08a", width: 4 });

function spawn() {

/* ---------- frame ---------- */
function update(dt) {

  if (anim) { anim.t += dt; if (anim.t >= DUR) settle(); }

  olliSq = Lab.damp(olliSq, 0, 9, dt); bubble = Lab.damp(bubble, 1, 10, dt);
  for (const t of tiles) { if (t.pop > 0) t.pop = Math.max(0, t.pop - dt * 4.5); if (t.born < 1) t.born = Math.min(1, t.born + dt * 6); }
}
function frame(dt, t) { update(dt); render(t); }
function attract(dt, t) {

function xy(r, c) { return [bx + pad + c * (cell + gap) + cell / 2, by + pad + r * (cell + gap) + cell / 2]; }
function posOf(t) {
  const k = anim ? ease.outCubic(clamp(anim.t / DUR, 0, 1)) : 1; let [x, y] = xy(lerp(t.fr, t.r, k), lerp(t.fc, t.c, k));

  return [x, y];
}

/* ---------- art ---------- */
function bgSprite() {
  const W = Lab.W + 80, H = Lab.H + 80;
  return Lab.sprite("bsbg" + W + "x" + H, W, H, g => {
    draw.vgrad(g, 0, 0, W, H, ["#2c2452", "#1d1838", "#15112b"]);
    g.strokeStyle = "rgba(255,255,255,.035)"; g.lineWidth = 2; const ph = 54;
    for (let y = 20, i = 0; y < H; y += ph, i++) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); for (let x = (i % 2 ? 70 : 190); x < W; x += 250) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + ph); g.stroke(); } }

    g.fillStyle = "rgba(150,180,255,.09)"; g.fillRect(0, 0, ww, wh); g.fillStyle = "#1b1735"; g.globalAlpha = .55; g.fillRect(ww * .47, 0, ww * .06, wh); g.fillRect(0, wh * .47, ww, wh * .06); g.restore();
    draw.glow(g, W * .08, H * .12, Math.max(W, H) * .55, "#ffb52e", .2);
    draw.glow(g, W * .9, H * .95, Math.max(W, H) * .4, "#7b6cff", .12);

}
function bookSprite(kind, tier, s) {
  s = Math.round(s);

    const wild = kind === "wild", col = wild ? "#ffcf4a" : COL[tier], m = s * .09, w = s - m * 2 - s * .04, h = s - m * 2 - s * .03, r = s * .1;
    draw.rect(g, m + s * .03, m + s * .075, w + s * .02, h, r, "rgba(15,8,35,.3)");
    draw.rect(g, m + s * .045, m + s * .035, w, h, r, "#fff6e3", "rgba(170,140,100,.5)", 1);
    g.strokeStyle = "rgba(170,140,100,.45)"; g.lineWidth = 1; g.beginPath(); g.moveTo(m + w * .3, m + h + s * .018); g.lineTo(m + w, m + h + s * .018); g.stroke();

function drawBook(c, kind, tier, x, y, sz) { const sp = bookSprite(kind, tier, cell); c.drawImage(sp, x - sz / 2, y - sz / 2, sz, sz); }

  c.fillStyle = "#cfc6e6"; for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + Math.sin(t * 2 + i) * .08, rr = r * (.38 + (i % 2) * .08); c.beginPath(); c.arc(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .5, rr, 0, TAU); c.fill(); }

}
function drawStars(c, x, y, r, n, frac) {

}
function drawCard(c, t) {
