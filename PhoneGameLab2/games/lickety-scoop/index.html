(function(){ "use strict";
/* LICKETY SCOOP — Momo the frog runs the ice-cream window on the pier. The pals queue for cones: "a big chocolate,

 * The verb is SCOOPING TO SIZE (vs. Lantern Noodles' tap-the-trays bowls and Pop & Pour's swipe-the-fruit layers):
 *   press a tub and hold — the scoop rolls up bigger while you hold — and let go when it fills the dashed ring. Every
 *   flavour scoops at its own speed (hard chocolate is slow, soft mint races). Perfect / good / sloppy sizes pay
 *   differently. Scoops stack: a scoop that comes out BIGGER than the one under it (past the red ring) topples the
 *   whole cone. Hold too long and it bursts. Momo — always hungry — happily gulps every mistake, which costs time.
 * Hearts: three walk-outs close the window. Perfect cones build a streak multiplier.
 * Later: chocolate, then mint, then blueberry tubs open; three- and four-scoop towers; cherries on top; busier queues.
 * Identity: seaside kiosk — mint-and-cream awning, wooden counter, frosty tub freezer; bouncy "bounce" music. */
let demo = false;
Lab.init({
  title: "Lickety Scoop", tagline: "Hold to scoop, let go on the ring. Stack it, don't topple it!", category: "Skill", kicker: "Pocket Pals",
  howto: ["Hold a tub to scoop, let go on the ring", "Build the cone in the order shown", "Bigger than the scoop below? Topple!"],
  theme: { bg: "#bfeee0", bg2: "#fff4e0", fg: "#3a2f4d", muted: "#6b6478", accent: "#ff6f91", accent2: "#3fbf9a", light: true },
  orient: "any", music: { style: "bounce", key: "C", vol: .34 }, restart: start, attract,

const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, INK = Pals.ink;
const FL = [{ n: "Vanilla", c: "#fff0c2", d: "#e9cf86", t: 1.45 }, { n: "Strawberry", c: "#ff9fbd", d: "#e66b93", t: 1.3 }, { n: "Chocolate", c: "#9a6444", d: "#6b4028", t: 1.85 },
  { n: "Mint", c: "#9ff0cf", d: "#4fc49c", t: .95 }, { n: "Blueberry", c: "#aab6ff", d: "#6f7fe6", t: 1.15 }];

const flavours = () => Math.min(5, level + 1), cur = () => line[0] && line[0].state === "wait" ? line[0] : null;

function layout() {

  if (wide) { L.card.x = P.x + P.w * .2; L.card.y = P.y + 22 * S; }

  const th = Math.min(P.h * (wide ? .36 : .22), 160 * S), ty = P.y + P.h - th - 8, gw = (P.w - 24) / 5; L.tubs = FL.map((f, i) => ({ x: P.x + 12 + i * gw + 3, y: ty, w: gw - 6, h: th }));

}
Lab.onResize(() => layout());

/* ---------------- orders ---------------- */
function makeOrder() {

  const sz = []; for (let i = 0; i < n; i++) sz.push(Lab.randInt(level <= 1 ? 1 : 0, 2)); sz.sort((a, b) => b - a);
  return { scoops: sz.map(s => ({ f: Lab.randInt(0, flavours() - 1), s })), cherry: level >= 4 && Lab.chance(.45) };
}
function addCustomer() {
  const used = line.map(c => c.who), pool = PALS.filter(p => !used.includes(p.id)), p = Lab.choose(pool.length ? pool : PALS);
  const max = p.pat * Math.max(.6, 1 - (level - 1) * .06) * (1 + .12 * 2);
  line.push({ who: p.id, max, pat: max, order: makeOrder(), state: "walk", x: -60 * S, mood: 0, leaveT: 0 });
}
function reset() {
  line = []; stack = []; falling = []; hold = null; hearts = 3; level = 1; served = 0; score = 0; streak = 0; bestStreak = 0; perfects = 0; gulps = 0;
  clock = 0; over = false; told = {}; bubble = null; cherryOn = false; spawnT = 0;
  momo = { gulp: 0, joy: 0, scare: 0, look: [0, 0] }; addCustomer(); line[0].x = L.cust.x * .6;
}
function start() {

  Lab.input.onUp = [() => release()];
  Lab.input.onKey = [(k) => { const i = "12345".indexOf(k); if (i >= 0 && i < flavours() && !hold) startScoop(i, k); if (k === "c" || k === "C") addCherry(); }];
  Lab.after(.6, () => once("hi", "Hold a tub, let go on the ring!", 3));
  Lab.loop(frame);
}

  clock += dt; const c = cur();

  if (hold && hold.size >= SIZES[c ? c.order.scoops[Math.min(stack.length, c.order.scoops.length - 1)].s : 1].v) release();
  if (c && stack.length >= c.order.scoops.length && c.order.cherry && !cherryOn) addCherry();
  update(dt); render(t);
}

/* ---------------- scooping ---------------- */
function tubAt(x, y) { for (let i = 0; i < flavours(); i++) { const t = L.tubs[i]; if (x > t.x - 4 && x < t.x + t.w + 4 && y > t.y - 30 * S && y < t.y + t.h + 4) return i; } return -1; }
function press(x, y) {
  if (over) return; if (Math.hypot(x - L.cherry.x, y - L.cherry.y) < L.cherry.r + 12 * S && level >= 4) { addCherry(); return; }

  stack.push(sc); snd("pop", { pitch: 1.5 - h.size * .6 }); snd("land", { vol: .4 });

  if (!demo) { score += pts; Lab.setScore(score); fx.text(L.cone.x + R * 1.6, coneTop() - scoopY(stack.length - 1), lab + " +" + pts, { color: sc.grade === 3 ? "#ff6f91" : sc.grade === 2 ? "#2f9a7c" : "#6b6478", size: (13 + sc.grade * 2) * S }); }

  if (!demo) { say(txt, 1.6); fx.text(L.momo.x, L.momo.y - L.momo.s, "Gulp!", { color: "#36a873", size: 18 * S }); }
}

      snd("lose", { vol: .5 }); Lab.flash("#ff6a5a", .15, .15); say(Lab.choose(["Oh no, they left!", "Come back!"]), 1.6); momo.scare = 1;

}
function frame(dt) { if (!over) update(dt); render(clock); }

/* ---------------- art ---------------- */
const coneTop = () => L.counter - 46 * S, scoopY = i => { let y = 0; for (let k = 0; k <= i; k++) y += (k ? (stack[k - 1] ? stack[k - 1].size : .7) * R * .72 : 0) + (stack[k] ? stack[k].size : .7) * R * .58; return y; };
function bakeBg() {

    g.translate(40, 40); draw.vgrad(g, -40, -40, Lab.W + 80, Lab.H + 80, ["#bfeee0", "#e9fbf3"]);
    const P = Lab.play, hz = P.y + (L.counter - P.y) * .66; draw.vgrad(g, -40, P.y - 10, Lab.W + 80, hz - P.y + 10, ["#a9e2fb", "#e8f8ff"]);

    for (let i = 0; i < 14; i++) { const x = P.x + ((i * 71) % P.w), y = hz + 8 + ((i * 37) % Math.max(10, L.counter - hz - 16)); g.beginPath(); g.arc(x, y, 6 * S, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    const bx = P.x + P.w * .38, by = hz - 2; g.fillStyle = "#fff"; g.beginPath(); g.moveTo(bx, by - 26 * S); g.lineTo(bx + 16 * S, by - 4 * S); g.lineTo(bx, by - 4 * S); g.fill(); g.fillStyle = "#ff8f7a"; g.beginPath(); g.moveTo(bx - 14 * S, by - 3 * S); g.lineTo(bx + 20 * S, by - 3 * S); g.lineTo(bx + 14 * S, by + 3 * S); g.lineTo(bx - 9 * S, by + 3 * S); g.fill();
    g.fillStyle = "#c98d5a"; g.fillRect(-40, P.y + 14 * S, 22 + 40, L.counter - P.y); g.fillRect(Lab.W - 22, P.y + 14 * S, 62, L.counter - P.y);
    for (let x = -40, i = 0; x < Lab.W + 40; x += 34 * S, i++) { g.fillStyle = i % 2 ? "#ffffff" : "#7fdcc0"; g.beginPath(); g.moveTo(x, P.y - 4); g.lineTo(x + 34 * S, P.y - 4); g.lineTo(x + 34 * S, P.y + 18 * S); g.arc(x + 17 * S, P.y + 18 * S, 17 * S, 0, Math.PI); g.fill(); }

    g.fillStyle = "#e8bb86"; g.fillRect(-40, L.counter - 6 * S, Lab.W + 80, 14 * S); g.fillStyle = "rgba(90,50,20,.18)"; for (let y = L.counter + 30 * S; y < Lab.H; y += 26 * S) g.fillRect(-40, y, Lab.W + 80, 2);

}
function scoopShape(c, f, x, y, r, sq) {
