<title>Sunny Soak</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* SUNNY SOAK — the hottest day of the year. Pip the fox stands on the garden deck with a tub of water balloons;
 * the other pals wander across the lawn, flushed and sweating, and WANT to be soaked.
 * Core idea kept: throw water balloons at moving targets.
 * Hooks:   TAP = quick small balloon; HOLD = fill a bigger one (wider splash, slower flight) — hold too long and it
 *          bursts over Pip.  Balloons take time to land, so you lead the target; a splash soaks everyone inside it
 *          (doubles/triples).  Only five balloons in the tub; it refills slowly, so misses cost.
 *          HEAT is the clock: it climbs by itself and jumps when a pal leaves dry; every soak cools it. Full = over.
 * Variety: each pal moves in character — Bun ambles, Momo hops, Nori belly-slides, Olli hides under an umbrella
 *          (needs a big balloon), Bolt must stay DRY (robots + water = bzzt).  Later: conga lines, crossings, escorts.
 * Identity: bright mown lawn, wooden deck, blue-sky strip, candy balloons; "funk" music that heats up with the meter. */
let demo = false, demoT = 1;
Lab.init({
  title: "Sunny Soak", tagline: "Lob water balloons. Cool your pals down.", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Tap the lawn to lob a water balloon", "Hold to fill a bigger one — not too long!", "Soak hot pals. Keep Bolt the robot dry"],
  theme: { bg: "#63bf5c", bg2: "#bfeaff", accent: "#1e9be0", accent2: "#ffb52e", fg: "#22304a", muted: "#4f6178", light: true },
  orient: "any", music: { style: "funk", key: "C", vol: .38 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, INK = Pals.ink, mix = Lab.color.mix;
const BCOL = ["#ff6b8b", "#ffb52e", "#9b8cff", "#ff8a3d", "#f06bd0"];
const HOT = { bun: "#e493d2", momo: "#b9d468", nori: "#5d3f78", olli: "#cf6a3c", pip: "#ff7a3d", bolt: "#ffd23f" };   // flushed body tints
const SPEED = { bun: 50, momo: 0, nori: 160, olli: 58, bolt: 66 }, MAXAMMO = 5;
const INTRO = { 2: "Momo hops in!", 3: "Keep Bolt dry!", 4: "Nori slides by!", 5: "Olli's umbrella needs a BIG one", 6: "Conga line!", 7: "Bolt tags along…" };
let S, P, wf, yardTop, yardBot, lanes, pip = {}, runners, balloons, puddles, fill, aim, queued, cool, stun, ammo, regen, heat, shownHeat, score, soaks, streak,
  bestStreak, level, throws, pops, escapes, spawnT, lastLane, over, joyT, pipSq, warnT, fillLoop, clock, noSpawn, heatFlash, bestMulti;

function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function layout() {
  P = Lab.play; S = clamp(Math.min(P.w / 390, P.h / 600), .62, 1.5); wf = Math.sqrt(clamp(P.w / (390 * S), 1, 3.2));
  yardTop = P.y + 162 * S; yardBot = Lab.H - Lab.safe.bottom - 12 * S;
  const n = clamp(Math.floor((yardBot - yardTop) / (96 * S)), 2, 5), lh = (yardBot - yardTop) / n; lanes = [];
  for (let i = 0; i < n; i++) lanes.push(yardTop + lh * (i + .8));
  pip.size = 78 * S; pip.x = P.x + P.w / 2; pip.y = P.y + 48 * S + pip.size * .69;
  if (runners) for (const r of runners) { r.lane = Math.min(r.lane, n - 1); r.y = lanes[r.lane]; }
  Lab.sprite.clear("ssbg");
}
Lab.onResize(() => { if (runners) { layout(); if (aim) clampAim(aim.x, aim.y); } });
function clampAim(x, y) { aim = { x: clamp(x, 10, Lab.W - 10), y: clamp(y, yardTop + 14 * S, yardBot - 2) }; }
const splashR = f => (22 + 34 * f) * S;

function reset() {
  runners = []; balloons = []; puddles = []; fill = null; queued = null; cool = 0; stun = 0; ammo = MAXAMMO; regen = 0; heat = shownHeat = .22; score = 0; soaks = 0; streak = 0;
  bestStreak = 0; level = 1; throws = 0; pops = 0; escapes = 0; spawnT = .4; lastLane = -1; over = false; joyT = 0; pipSq = 0; warnT = 0; clock = 0; noSpawn = false; heatFlash = 0; bestMulti = 1;
  clampAim(Lab.W / 2, (yardTop + yardBot) / 2);
}
function start() {
  demo = false; layout(); reset(); Lab.setScore(0);
  fillLoop = Lab.audio.loop({ type: "sine", f: 300, vol: 0 });
  Lab.input.onDown = [(x, y) => { if (over) return; clampAim(x, y); press(); }];
  Lab.input.onMove = [(x, y) => { if (Lab.input.down && !over) clampAim(x, y); }];
  Lab.input.onUp = [(x, y) => { if (over) return; if (fill) { clampAim(x, y); release(); } else if (queued) queued.up = true; }];
  Lab.hint("Tap to lob · hold to fill a bigger balloon");
  Lab.expose({
    get score() { return score; }, get heat() { return heat; }, set heat(v) { heat = v; }, get level() { return level; }, get soaks() { return soaks; }, get streak() { return streak; },
    get ammo() { return ammo; }, set ammo(v) { ammo = v; }, get pops() { return pops; }, get throws() { return throws; }, get escapes() { return escapes; }, get filling() { return fill ? fill.v : -1; },
    get runners() { return runners.map(r => ({ type: r.type, x: r.x, y: r.y - r.size * .45, soaked: r.soaked, v: r.v * r.dir, lane: r.lane })); },
    get yard() { return { top: yardTop, bot: yardBot, lanes: lanes.slice() }; }, get lastFill() { return pip.lastFill; },
    hold(v) { noSpawn = v; }, clear() { runners = []; balloons = []; }, spawn(type, lane, dir, x) { const r = spawnRunner(type, lane, dir || 1); if (x != null) r.x = x; return runners.length; },
    throwAt(x, y, f) { fill = { v: f || 0, col: BCOL[0] }; clampAim(x, y); release(); },
  });
  Lab.loop(frame);
}

/* ---------- throwing ---------- */
function press() {
  if (stun > 0) return;
  if (cool > 0) { queued = { up: false }; return; }
  if (ammo <= 0) { snd("error", { vol: .5 }); fx.text(pip.x + 78 * S, pip.y - 30 * S, "refilling…", { size: 13, color: "#1e6fa8", outline: "rgba(255,255,255,.7)" }); return; }
  fill = { v: 0, col: Lab.choose(BCOL) }; snd("bubble", { pitch: 1.3, vol: .5 });
}
function release() {
  const f = clamp(fill.v, 0, 1), hx = pip.x, hy = pip.y - pip.size * .95;
  balloons.push({ x0: hx, y0: hy, tx: aim.x, ty: aim.y, t: 0, T: .46 + .16 * f, f, col: fill.col });
  pip.lastFill = f; fill = null; ammo--; cool = .22; throws++; pipSq = -.24; snd("whoosh", { pitch: 1.25 - f * .4, vol: .6 }); Lab.buzz(6);
}
function burstOnPip() {
  fill = null; ammo--; stun = 1; streak = 0; pops++; pipSq = .3;
  const x = pip.x, y = pip.y - pip.size * .6;
  fx.burst(x, y, { n: 26, colors: ["#6cc8ff", "#bfeaff", "#fff"], speed: 300, life: .7, size: 5, gravity: 700 }); fx.ring(x, y, { r0: 10, r1: 70 * S, color: "#bfeaff", width: 5 });
  fx.text(x, pip.y + pip.size * .2, "Oops — too full!", { size: 17, color: "#1e6fa8", outline: "rgba(255,255,255,.8)" });
  snd("pop", { pitch: .8 }); snd("splash", { pitch: 1.2 }); Lab.shake(5, .2); Lab.buzz(25);
}
function land(b) {
  const R = splashR(b.f); let hits = 0, zapped = false, near = 1e9;
  for (const r of runners) {
    if (r.soaked) continue; const cy = r.y - r.size * .45 - r.z * .5, d = Math.hypot(r.x - b.tx, cy - b.ty);
    if (d > R + r.size * .34) continue;
    if (r.type === "bolt") { zap(r); zapped = true; continue; }
    if (r.type === "olli" && b.f < .5) { r.wob = 1; snd("knock", { pitch: 1.4 }); fx.text(r.x, r.y - r.size * 1.25, "Too small!", { size: 14, color: "#fff" }); continue; }
    soak(r); hits++; near = Math.min(near, d);
  }
  fx.burst(b.tx, b.ty, { n: 10 + Math.round(b.f * 18), colors: ["#6cc8ff", "#bfeaff", "#fff", b.col], speed: 180 + b.f * 200, life: .55, size: 3.5 + b.f * 2.5, gravity: 600 });
  fx.ring(b.tx, b.ty, { r0: R * .3, r1: R * 1.15, color: "#e8f8ff", width: 4 + b.f * 3, life: .35 });
  puddles.push({ x: b.tx, y: b.ty, r: R, t: 0 }); if (puddles.length > 14) puddles.shift();
  snd("splash", { pitch: 1.35 - b.f * .55, vol: .5 + b.f * .4 }); if (b.f > .5 && !demo) Lab.shake(2 + b.f * 4, .15);
  if (hits) {
    streak++; bestStreak = Math.max(bestStreak, streak); bestMulti = Math.max(bestMulti, hits); joyT = .7;
    const mult = Math.min(5, 1 + Math.floor((streak - 1) / 3)), bull = near < 12 * S, gain = (10 * hits * (hits > 1 ? hits : 1) + (bull ? 5 : 0)) * mult;
    score += gain;
    fx.text(b.tx, b.ty - R - 10 * S, "+" + gain + (mult > 1 ? "  ×" + mult : ""), { size: 18 + Math.min(10, hits * 3 + mult), color: hits > 1 ? "#fff3a0" : "#fff" });
    if (hits > 1) fx.text(b.tx, b.ty - R - 36 * S, hits === 2 ? "DOUBLE!" : hits === 3 ? "TRIPLE!" : "MEGA SPLASH!", { size: 20, color: "#ffe066" }); else if (bull) fx.text(b.tx, b.ty - R - 32 * S, "Bullseye", { size: 14, color: "#bfeaff" });
    if (!demo) { Lab.setScore(score); Lab.bumpScore(); Lab.audio.combo(Math.min(12, streak - 1 + hits), { vol: .22 }); if (hits > 1) { Lab.hitstop(.04); Lab.buzz(18); } }
  } else if (!zapped) { if (streak >= 3) fx.text(b.tx, b.ty - R - 8 * S, "streak lost", { size: 13, color: "rgba(255,255,255,.85)" }); streak = 0; }

}
function soak(r) {
  r.soaked = true; r.joy = 1; r.sq = .28; soaks++; heat = Math.max(0, heat - .04); if (r.type === "olli") r.umb = 0;

  const nl = 1 + Math.floor(soaks / 8);

    level = nl; heat = Math.max(0, heat - .08);
    if (!demo) { Lab.banner("LEVEL " + level, { color: "#1e9be0", ms: 1000, y: .3 }); Lab.sfx("levelup", { vol: .7 }); if (INTRO[level]) Lab.after(.9, () => Lab.toast(INTRO[level], 1900, { y: .3 })); }
  }
}
function zap(r) {

  fx.sparks(r.x, r.y - r.size * .5, -Math.PI / 2, { n: 16, color: "#ffe066", spread: TAU, speed: 320 }); fx.text(r.x, r.y - r.size * 1.2, "Bzzt! +heat", { size: 16, color: "#ffe066" });
  snd("zap"); if (!demo) { Lab.flash("#fff3a0", .15, .3); Lab.shake(6, .25); Lab.buzz(30); }
}

/* ---------- pals on the lawn ---------- */
function spawnRunner(type, lane, dir, off) {
  const size = 62 * S, sm = 1 + .06 * (level - 1);
  const r = { type, lane, dir, size, x: dir > 0 ? -size * .7 - (off || 0) : Lab.W + size * .7 + (off || 0), y: lanes[lane], t: Lab.rand(0, 3), ph: Lab.rand(0, .4), z: 0, sq: 0, soaked: false, joy: 0, stun: 0, umb: type === "olli" ? 1 : 0, wob: 0, v: SPEED[type] * S * wf * sm, hop: 92 * S * wf * sm };

function pickLane() { let l; do l = Lab.randInt(0, lanes.length - 1); while (l === lastLane && lanes.length > 1); lastLane = l; return l; }
function spawnWave() {
  if (runners.length >= 9) return;

}
function updateRunner(r, dt) {

}
function runnerGone(r) {

  escapes++; heat = Math.min(1, heat + .09); heatFlash = 1;
  fx.text(clamp(r.x, 60, Lab.W - 60), r.y - r.size * .9, "left dry  +heat", { size: 14, color: "#ff7043", outline: "rgba(255,255,255,.8)" }); snd("hurt", { vol: .45, pitch: .8 });
}

/* ---------- frame ---------- */
function update(dt) {
  clock += dt; cool -= dt; joyT = Math.max(0, joyT - dt); pipSq = Lab.damp(pipSq, 0, 10, dt); heatFlash = Math.max(0, heatFlash - dt * 2);
  if (stun > 0) stun -= dt;
  if (queued && cool <= 0 && stun <= 0) { const q = queued; queued = null; if (ammo > 0) { fill = { v: 0, col: Lab.choose(BCOL) }; if (q.up || !Lab.input.down) release(); } }
  if (fill && !demo && !Lab.input.down && fill.v > .05) release();          // pointer-up lost while paused/blurred
  if (fill) { fill.v += dt / .85; if (fill.v > 1.5) burstOnPip(); }
  if (fillLoop && !demo) fillLoop.set(fill ? { vol: .05 + Math.min(1, fill.v) * .05, f: 280 + fill.v * 330 + (fill.v > 1 ? Math.sin(clock * 50) * 40 : 0) } : { vol: 0 });

  update(dt); render(t);
}

/* ---------- art ---------- */
function bgSprite() {
  const W = Lab.W + 80, H = Lab.H + 80, o = 40;
  return Lab.sprite("ssbg" + W + "x" + H, W, H, g => {
    const yt = yardTop + o, deck = pip.y + pip.size / 2 + o;
    draw.vgrad(g, 0, 0, W, deck, ["#6ed3f5", "#d5f7ff"]);
    g.fillStyle = "rgba(255,255,255,.85)"; for (const [cx, cy, cw] of [[W * .18, deck * .42, 70 * S], [W * .8, deck * .55, 54 * S]]) { g.beginPath(); g.ellipse(cx, cy, cw, cw * .3, 0, 0, TAU); g.ellipse(cx - cw * .4, cy - cw * .16, cw * .45, cw * .26, 0, 0, TAU); g.ellipse(cx + cw * .3, cy - cw * .2, cw * .5, cw * .3, 0, 0, TAU); g.fill(); }

    draw.vgrad(g, 0, deck - 2 * S, W, yt - deck + 2 * S, ["#d9a066", "#b9793f"]); g.fillStyle = "#e8b77c"; g.fillRect(0, deck - 5 * S, W, 9 * S);

    g.fillStyle = "rgba(255,255,255,.07)"; for (let x = 0, i = 0; x < W; x += 56 * S, i++) if (i % 2) g.fillRect(x, yt, 56 * S, H - yt);
    g.fillStyle = "rgba(40,90,40,.22)"; g.fillRect(0, yt, W, 7 * S);
    for (const ly of lanes) { g.fillStyle = "rgba(255,244,200,.2)"; draw.rr(g, -20, ly + o - 12 * S, W + 40, 22 * S, 11 * S); g.fill(); }
    const rnd = Lab.rng(12);
    for (let i = 0; i < 46; i++) { const x = rnd() * W, y = yt + 14 * S + rnd() * (H - yt - 20 * S), col = ["#fff", "#ffe066", "#ff9ecb"][i % 3]; g.fillStyle = col; for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.257) * 3.2 * S, y + Math.sin(k * 1.257) * 3.2 * S, 2.3 * S, 0, TAU); g.fill(); } g.fillStyle = "#ffb52e"; g.beginPath(); g.arc(x, y, 2 * S, 0, TAU); g.fill(); }
    g.fillStyle = "rgba(60,130,60,.5)"; for (let i = 0; i < 70; i++) { const x = rnd() * W, y = yt + 10 + rnd() * (H - yt); g.fillRect(x, y, 2, 5 * S); g.fillRect(x + 4, y + 2, 2, 4 * S); }
  });
}
function drawBalloon(c, x, y, r, col, wob) {
  c.save(); c.translate(x, y); if (wob) c.scale(1 + Math.sin(wob) * .09, 1 - Math.sin(wob) * .09);
  c.fillStyle = Lab.color.shade(col, -.15); c.beginPath(); c.moveTo(-r * .16, r * 1.02); c.lineTo(r * .16, r * 1.02); c.lineTo(0, r * .8); c.fill();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, r * .9, r, 0, 0, TAU); c.fill();
  c.fillStyle = "rgba(255,255,255,.55)"; c.beginPath(); c.ellipse(-r * .34, -r * .4, r * .2, r * .3, -.5, 0, TAU); c.fill(); c.restore();
}
function drawUmbrella(c, x, y, w, wob) {
  c.save(); c.translate(x, y); c.rotate(Math.sin(wob * 18) * wob * .25);
  c.strokeStyle = "#7a5a3a"; c.lineWidth = 3 * S; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, w * .62); c.stroke();
  for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? "#fff6e3" : "#ff6b6b"; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, w * .62, Math.PI + i * Math.PI / 4, Math.PI + (i + 1) * Math.PI / 4); c.closePath(); c.fill(); }
  c.strokeStyle = "rgba(43,35,64,.3)"; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, w * .62, Math.PI, TAU); c.closePath(); c.stroke(); c.restore();
}
function drawRunner(c, r, t) {
