<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Super Balloons", instructions:"Tap balloons before they escape!", restart:start});
let balloons,t,score,miss;
function start(){balloons=[];t=0;score=0;miss=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{for(let i=balloons.length-1;i>=0;i--){if(Lab.dist(balloons[i].x,balloons[i].y,x,y)<balloons[i].r){balloons.splice(i,1);score++;Lab.setScore(score);Lab.beep(1200,.05);return;}}}];
  Lab.loop((dt)=>{t+=dt;if(Math.random()<dt*(2+t*0.1))balloons.push({x:Lab.rand(40,Lab.W-40),y:Lab.H+20,r:Lab.rand(20,32),vy:-Lab.rand(120,220),c:`hsl(${Lab.randInt(0,360)},80%,60%)`});
    for(const b of balloons)b.y+=b.vy*dt;
    for(let i=balloons.length-1;i>=0;i--)if(balloons[i].y<150){balloons.splice(i,1);miss++;if(miss>=5){Lab.gameover({title:"Escaped!",message:"Score: "+score});return;}}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#9cf";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Missed: "+miss+"/5",12,Lab.H-12);
  for(const b of balloons){c.fillStyle=b.c;c.beginPath();c.arc(b.x,b.y,b.r,0,Lab.TAU);c.fill();
    c.strokeStyle="#fff";c.beginPath();c.moveTo(b.x,b.y+b.r);c.lineTo(b.x,b.y+b.r+30);c.stroke();}
}
start();
</script></body></html>
