<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cupid Tom", instructions:"Drag to aim, release to fire arrows at hearts.", restart:start});
let arrows,hearts,start0,t,score;
function start(){arrows=[];hearts=[];t=30;score=0;Lab.setScore(0);start0=null;
  Lab.input.onDown=[(x,y)=>{start0={x,y};}];
  Lab.input.onUp=[(x,y)=>{if(!start0)return;
    const dx=start0.x-x,dy=start0.y-y;
    arrows.push({x:Lab.W/2,y:Lab.H-60,vx:dx*3,vy:dy*3});start0=null;}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Time!",message:"Hits: "+score});return;}
    if(Math.random()<dt*1.5)hearts.push({x:Lab.rand(40,Lab.W-40),y:Lab.rand(160,Lab.H/2),vx:Lab.rand(-60,60),vy:Lab.rand(-40,40)});
    for(const h of hearts){h.x+=h.vx*dt;h.y+=h.vy*dt;
      if(h.x<20||h.x>Lab.W-20)h.vx*=-1;if(h.y<140||h.y>Lab.H/2)h.vy*=-1;}
    for(const a of arrows){a.vy+=400*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;}
    for(const a of arrows)for(const h of hearts){if(!h.dead&&Lab.dist(a.x,a.y,h.x,h.y)<22){h.dead=true;score++;Lab.setScore(score);Lab.beep(1000,.08);}}
    hearts=hearts.filter(h=>!h.dead);arrows=arrows.filter(a=>a.y<Lab.H+50&&a.x>-50&&a.x<Lab.W+50);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a1a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  for(const h of hearts){c.fillStyle="#f48";c.beginPath();c.arc(h.x-6,h.y,10,0,Lab.TAU);c.arc(h.x+6,h.y,10,0,Lab.TAU);
    c.moveTo(h.x-14,h.y+4);c.lineTo(h.x,h.y+20);c.lineTo(h.x+14,h.y+4);c.fill();}
  for(const a of arrows){c.strokeStyle="#fff";c.beginPath();c.moveTo(a.x,a.y);c.lineTo(a.x-a.vx*0.05,a.y-a.vy*0.05);c.stroke();}
  c.fillStyle="#fc5";c.beginPath();c.arc(Lab.W/2,Lab.H-60,20,0,Lab.TAU);c.fill();
  if(start0){c.strokeStyle="#fff7";c.beginPath();c.moveTo(Lab.W/2,Lab.H-60);c.lineTo(Lab.W/2+(start0.x-Lab.input.x),Lab.H-60+(start0.y-Lab.input.y));c.stroke();}
}
start();
</script></body></html>
