<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Destroy Aliens", instructions:"Drag to move, taps auto-fire. Stop the invasion!", restart:start});
let ship,aliens,bullets,ebullets,t,score,fire;
function start(){ship={x:Lab.W/2,y:Lab.H-80,w:40};aliens=[];bullets=[];ebullets=[];score=0;fire=0;
  for(let r=0;r<3;r++)for(let c=0;c<6;c++)aliens.push({x:60+c*((Lab.W-120)/5),y:160+r*40,alive:true});
  let dir=1;
  Lab.input.onMove=[(x)=>{if(Lab.input.down)ship.x=Lab.clamp(x,20,Lab.W-20);}];
  Lab.setScore(0);
  Lab.loop((dt)=>{
    fire+=dt;if(fire>0.3){fire=0;bullets.push({x:ship.x,y:ship.y-20,vy:-500});}
    if(Math.random()<dt*0.5){const a=Lab.choose(aliens.filter(a=>a.alive));if(a)ebullets.push({x:a.x,y:a.y,vy:200});}
    let edge=false;for(const a of aliens){if(!a.alive)continue;a.x+=dir*30*dt;if(a.x<20||a.x>Lab.W-20)edge=true;}
    if(edge){dir*=-1;for(const a of aliens)a.y+=8;}
    for(const b of bullets)b.y+=b.vy*dt;
    for(const b of ebullets)b.y+=b.vy*dt;
    for(const a of aliens)if(a.alive)for(const b of bullets)if(Math.abs(a.x-b.x)<14&&Math.abs(a.y-b.y)<14){a.alive=false;b.dead=true;score+=10;Lab.setScore(score);Lab.beep(800,.04);}
    for(const b of ebullets)if(Math.abs(b.x-ship.x)<22&&Math.abs(b.y-ship.y)<14){Lab.gameover({title:"Hit!",message:"Score: "+score});return;}
    bullets=bullets.filter(b=>!b.dead&&b.y>0);
    ebullets=ebullets.filter(b=>b.y<Lab.H);
    if(aliens.every(a=>!a.alive)){Lab.win("Score: "+score);return;}
    if(aliens.some(a=>a.alive&&a.y>Lab.H-100)){Lab.gameover({title:"Invaded!",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#000010";c.fillRect(0,0,Lab.W,Lab.H);
  for(const a of aliens)if(a.alive){c.fillStyle="#5f8";c.fillRect(a.x-12,a.y-8,24,16);c.fillStyle="#000";c.fillRect(a.x-6,a.y-2,4,4);c.fillRect(a.x+2,a.y-2,4,4);}
  c.fillStyle="#5cf";c.fillRect(ship.x-20,ship.y-6,40,12);
  for(const b of bullets){c.fillStyle="#fff";c.fillRect(b.x-2,b.y-8,4,8);}
  for(const b of ebullets){c.fillStyle="#f55";c.fillRect(b.x-2,b.y,4,8);}
}
start();
</script></body></html>
