<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Rolling Ball", instructions:"Use device tilt or arrow keys to roll into the hole.", restart:start});
let ball,goal,walls,ax,ay;
function start(){ball={x:60,y:200,vx:0,vy:0};goal={x:Lab.W-60,y:Lab.H-100,r:24};
  walls=[];for(let i=0;i<6;i++)walls.push({x:Lab.rand(60,Lab.W-200),y:Lab.rand(220,Lab.H-160),w:Lab.rand(60,160),h:14});
  ax=0;ay=0;Lab.setScore(0);
  window.addEventListener("deviceorientation",e=>{ax=(e.gamma||0)/20;ay=(e.beta||0)/20;});
  window.addEventListener("keydown",e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k){ax=k[0]*3;ay=k[1]*3;}});
  window.addEventListener("keyup",()=>{ax=0;ay=0;});
  Lab.loop((dt)=>{ball.vx+=ax*200*dt;ball.vy+=ay*200*dt;ball.vx*=0.98;ball.vy*=0.98;
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<20){ball.x=20;ball.vx*=-0.5;}if(ball.x>Lab.W-20){ball.x=Lab.W-20;ball.vx*=-0.5;}
    if(ball.y<160){ball.y=160;ball.vy*=-0.5;}if(ball.y>Lab.H-50){ball.y=Lab.H-50;ball.vy*=-0.5;}
    for(const w of walls){if(ball.x>w.x-12&&ball.x<w.x+w.w+12&&ball.y>w.y-12&&ball.y<w.y+w.h+12){
      if(Math.abs(ball.y-w.y)<Math.abs(ball.x-w.x))ball.vx*=-0.5;else ball.vy*=-0.5;}}
    if(Lab.dist(ball.x,ball.y,goal.x,goal.y)<goal.r){Lab.win("In the hole!");return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a1a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#0a0a14";c.beginPath();c.arc(goal.x,goal.y,goal.r,0,Lab.TAU);c.fill();
  for(const w of walls){c.fillStyle="#557";c.fillRect(w.x,w.y,w.w,w.h);}
  c.fillStyle="#fc5";c.beginPath();c.arc(ball.x,ball.y,12,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
