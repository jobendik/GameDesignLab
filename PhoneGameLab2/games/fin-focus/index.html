(function(){ "use strict";
/* FIN FOCUS — Bolt pilots a brass diving bell with a camera on the front. The pals each want a page of fish photos for

  orient: "any", music: { style: "chill", key: "F", vol: .4 }, restart: start,

  stripe: { n: "Stripey", y: [160, 820], v: 20, r: 16, c: "#fff6e6", c2: "#2f3d73" },
  puffer: { n: "Puffer", y: [420, 1050], v: 30, r: 17, c: "#f2c47c", c2: "#b9874a" },
  blush: { n: "Blushfin", y: [760, 1420], v: 35, r: 17, c: "#ff9ec4", c2: "#e0609a" },
  eel: { n: "Peek Eel", y: [0, 0], v: 40, r: 14, c: "#7fcf8a", c2: "#3f8f5a" },

const UNLOCK = ["sunny", "stripe", "puffer", "blush", "eel", "glow"];

let W, H, S, cy0, bell, cam, fish, jellies, eels, vents, bubbles, kelp, slots, page, client, air, score, photos, zaps, focus, snapT, told,

/* ---------- world ---------- */

    get score() { return score; }, get air() { return air; }, set air(v) { air = v; }, get page() { return page; }, get focus() { return focus; }, get photos() { return photos; }, get zaps() { return zaps; },

    vf: () => vfPos(), toScreen: (x, y) => toScreen(x, y), fish: () => fish.map(f => ({ id: f.id, kind: f.kind, x: f.x, y: f.y, puff: f.puff, flee: f.flee })),
    place(kind, dx, dy, frozen) { const v = vfPos(); const f = spawnFish(kind, v.x + (dx || 0), v.y + (dy || 0)); f.frozen = frozen !== false; f.vx = 0; return f.id; },
    clearFish(kind) { fish = fish.filter(f => kind && f.kind !== kind); }, clearJellies() { jellies = []; },

    setBell(x, y) { bell.x = x; bell.y = y; bell.vx = bell.vy = 0; cam.x = x; cam.y = y; }, setSlots(k) { slots = k.map(kind => ({ kind, done: false, pop: 0 })); },
  });

}

/* ---------- update ---------- */
