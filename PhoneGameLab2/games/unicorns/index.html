<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Unicorns", instructions:"Hold to fly up. Pass through rings.", restart:start});
let u,rings,t,score;
function start(){u={y:Lab.H/2,vy:0};rings=[];t=0;score=0;Lab.setScore(0);
  Lab.loop((dt)=>{t+=dt;u.vy+=(Lab.input.down?-1400:1200)*dt;u.y+=u.vy*dt;
    if(u.y<160){u.y=160;u.vy=0;}if(u.y>Lab.H-40){Lab.gameover({title:"Fell",message:"Score: "+score});return;}
    if(Math.random()<dt*1.5)rings.push({x:Lab.W+30,y:Lab.rand(220,Lab.H-100),r:50,scored:false});
    for(const r of rings){r.x-=200*dt;
      if(!r.scored && r.x<120){r.scored=true;if(Math.abs(r.y-u.y)<r.r){score++;Lab.setScore(score);Lab.beep(1200,.06);}else{Lab.gameover({title:"Missed",message:"Score: "+score});return;}}}
    rings=rings.filter(r=>r.x>-60);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#f9c";c.fillRect(0,0,Lab.W,Lab.H);
  for(const r of rings){c.strokeStyle="#fc5";c.lineWidth=6;c.beginPath();c.arc(r.x,r.y,r.r,0,Lab.TAU);c.stroke();}c.lineWidth=1;
  c.fillStyle="#fff";c.beginPath();c.ellipse(120,u.y,30,18,0,0,Lab.TAU);c.fill();
  c.fillStyle="#f55";c.beginPath();c.moveTo(140,u.y-14);c.lineTo(148,u.y-24);c.lineTo(146,u.y-14);c.closePath();c.fill();
  c.fillStyle="#fcf";c.fillRect(108,u.y+18,4,18);c.fillRect(128,u.y+18,4,18);
}
start();
</script></body></html>
