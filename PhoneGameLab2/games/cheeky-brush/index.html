(function(){ "use strict";

const BR = .17, CUST = ["nori", "pip", "bun", "momo"], ZONES = { cheek: [.5, .12, .36], forehead: [0, -.64, .28] }, FROGCHEEK = [.48, -.02, .34];

  { n: "a heart", tier: 0, s: [{ c: 0, pts: Array.from({ length: 41 }, (_, i) => { const t = i / 40 * TAU; return [16 * Math.pow(Math.sin(t), 3) / 20, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 20 - .05]; }) }] },
  { n: "a star", tier: 0, s: [{ c: 2, pts: Array.from({ length: 11 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .34 : .8; return [Math.cos(a) * r, Math.sin(a) * r + .06]; }) }] },
  { n: "a lightning bolt", tier: 0, s: [{ c: 4, pts: [[.3, -.82], [-.32, .06], [.18, .06], [-.28, .84]] }] },
  { n: "a spiral", tier: 0, s: [{ c: 3, pts: Array.from({ length: 50 }, (_, i) => { const a = i / 49 * TAU * 2.1, r = .08 + i / 49 * .7; return [Math.cos(a) * r, Math.sin(a) * r]; }) }] },
  { n: "a sunshine", tier: 1, s: [{ c: 1, pts: arc(0, 0, .36, 0, TAU, 28) }].concat(Array.from({ length: 8 }, (_, i) => { const a = i * TAU / 8; return { c: 2, pts: [[Math.cos(a) * .55, Math.sin(a) * .55], [Math.cos(a) * .82, Math.sin(a) * .82]] }; })) },
  { n: "whiskers", tier: 1, s: [{ c: 5, pts: [[-.75, -.42], [.75, -.58]] }, { c: 5, pts: [[-.8, 0], [.8, 0]] }, { c: 5, pts: [[-.75, .42], [.75, .58]] }, { c: 0, pts: [[-.08, -.02], [.08, .02]] }] },
  { n: "a moon and star", tier: 1, s: [{ c: 4, pts: arc(-.12, 0, .62, -1.25, 1.25, 20).concat(arc(.1, 0, .45, 1.05, -1.05, 18)).concat([[(-.12 + Math.cos(-1.25) * .62), Math.sin(-1.25) * .62]]) }, { c: 2, pts: Array.from({ length: 11 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .1 : .24; return [-.42 + Math.cos(a) * r, -.1 + Math.sin(a) * r]; }) }] },

let S, wide, card, area, Z, zc, tb, sw, undoB, doneB, fullP;

/* ---------- camera: close-up on the paint zone ↔ full view for the mirror ---------- */

function pickDesign() {
