<title>Clatter Castle</title>

(function(){ "use strict";
/* CLATTER CASTLE — a toy-block builder where the pals are the clients AND the inspectors.
 * Core idea kept: pick a block from the box and place it to build a toy castle.
 * Goals on top of the toy box: each job is a pal's request, tested by that pal in person:
 *   PERCH   — Olli wants to sit up by a star; he flies over and lands on your build (his weight counts).
 *   BRIDGE  — Pip wants to dash across the river; he really runs it (climbs ≤ 1 block, his weight rolls across).
 *   SHELTER — Bun (and later Momo) sit in the meadow as the rain comes; every sitter must be covered.
 * Physics (toy statics): blocks drop straight down onto whatever is below. Each piece's weight plus everything it
 * carries must stay over what holds it up — a lean too far wobbles, then the piece clatters down with its load.
 * So overhangs need counterweights, bridges over wide rivers need cantilevers, and the inspecting pal can be the
 * last straw. Limited pieces per job; spare pieces, no collapses and margin earn stars. Three hearts.
 * Finished builds are photographed: this run's pin to the sky, and the last six are kept in the gallery (Lab.store)
 * that the splash screen shows off.                                                                              */
let demo = false;
Lab.init({
  title: "Clatter Castle", tagline: "Build what the pals ask for. Mind the wobble!", category: "Creative", kicker: "Pocket Pals",
  howto: ["Drag a block from the toy box and let go", "Too much overhang and it all clatters down", "Tap TEST — the pal checks your build in person"],
  theme: { bg: "#bfe3ff", bg2: "#fff4dc", fg: "#33304a", muted: "#5f6a80", accent: "#ff8a3d", accent2: "#7fb8ff", light: true },
  orient: "any", music: { style: "chill", key: "C", vol: .32 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, shade = Lab.color.shade, INK = Pals.ink;
const ZW = 8, MARG = 1.35, TOL = .04, G = 30;
const TYPES = {
  block: { w: 1, h: 1, m: 1, col: "#ff8a73" }, brick: { w: 2, h: 1, m: 2, col: "#ffc95c" }, pillar: { w: 1, h: 2, m: 2, col: "#7fb8ff" },
  plank: { w: 4, h: .5, m: 1.4, col: "#d9a066" }, arch: { w: 3, h: 1.5, m: 3, col: "#b99cff" }, roof: { w: 2, h: 1, m: 1, col: "#ff6f91", slip: true },
};
const ORDER = ["block", "brick", "pillar", "plank", "arch", "roof"];
let u = 30, S = 1, U = 1, ox = 0, gy = 0, trayY = 0, trayH = 80, slots = [];
let pieces, debris, req, reqN, hearts, score, phase, phaseT, drag, sel, kbX, kbT, pal, sitters, rainT, photos, timers, nid, lost, pending, extra, test, jobs, starsAll, clatters, showIdx, verdict;

const snd = (n, o) => { if (!demo) Lab.sfx(n, o); };
const later = (t, fn) => timers.push({ t, fn });
const sx = x => ox + x * u, sy = y => gy - y * u;
const snap = x => Math.round(x * 2) / 2;

function ground() { return req && req.river ? [[-20, req.river[0]], [req.river[1], ZW + 20]] : [[-20, ZW + 20]]; }

function layout() {
  const P = Lab.play, wide = P.w > P.h * 1.1;
  S = Math.min(P.w / 390, P.h / 700); U = Math.max(S, .8);
  trayH = Math.max(66, wide ? 78 * S : 104 * S); trayY = P.y + P.h - trayH;
  u = Math.min(P.w / (ZW + MARG * 2), (trayY - P.y - 30 * S) / 9.4);
  ox = P.x + (P.w - ZW * u) / 2; gy = trayY - Math.max(18 * S, .7 * u);
  Lab.sprite.clear("cc");
}
Lab.onResize(() => { if (pieces) layout(); });

/* ---------- jobs ---------- */
function makeReq(n) {
  const kinds = ["perch", "bridge", "shelter"], last = req && req.kind, d = Math.min(n, 10);
  const kind = n < 3 ? kinds[n] : Lab.choose(kinds.filter(k => k !== last));
  const r = { kind, n, tray: {}, river: null, star: null, sit: [] };
  if (kind === "perch") {
    r.who = "olli"; const ty = Math.min(7, 2.5 + d * .45), tx = snap(Lab.rand(2.5, ZW - 2.5)); r.star = [tx, snap(ty)];
    if (d >= 3) { const w = Math.min(3, 1.5 + d * .15); r.river = [snap(tx - w / 2), snap(tx + w / 2)]; }
    r.tray = { block: 2 + (d > 2 ? 1 : 0), brick: 2, pillar: 1 + (d >= 2 ? 1 : 0), plank: d >= 3 ? 1 + (d >= 6 ? 1 : 0) : 1, arch: d >= 5 ? 1 : 0 };
  } else if (kind === "bridge") {
    r.who = "pip"; const w = Math.min(5, 2.5 + d * .3), c = snap(ZW / 2 + Lab.rand(-.6, .6)); r.river = [snap(c - w / 2), snap(c + w / 2)];
    r.tray = { plank: 1 + (w > 3.6 ? 1 : 0), block: 3 - (d >= 6 ? 1 : 0), brick: 1 + (w > 3.6 ? 1 : 0), pillar: 1 };
  } else {
    r.who = "bun"; const two = d >= 3, x1 = snap(Lab.rand(1.5, two ? 3.5 : ZW - 1.5));

    r.tray = { pillar: two ? 2 : 2 - (d >= 2 ? 1 : 0), block: 2 + (d >= 2 ? 1 : 0), brick: 1, plank: 1 + (two ? 1 : 0), roof: 1 };
  }

}
function newJob() {
  req = makeReq(reqN); pieces = []; debris = []; lost = 0; pending = null; extra = null; test = null; drag = null; verdict = null;
  sel = ORDER.find(t => req.tray[t]) || null; kbX = 3; kbT = 0; rainT = 0; clatters = 0;
  sitters = req.sit.map(s => ({ who: s.who, x: s.x, wet: 0, sq: 0 }));
  pal = { who: req.who, x: -.65, y: 0, sq: 0, mood: "happy", vis: req.kind !== "shelter", f: 0, arms: "wave", vy: 0 };
  phase = "intro"; phaseT = 0; layoutSlots();
  if (!demo) { Lab.banner("Job " + (reqN + 1), { color: "#ff8a3d", ms: 900, y: .3 }); snd("pop", { pitch: 1.2 }); }
}
function layoutSlots() {
  const P = Lab.play, ts = ORDER.filter(t => req.tray[t] > 0), n = ts.length + 2, sw = Math.min(Math.max(74 * S, 58), (P.w - 16 * S) / n), x0 = P.x + (P.w - sw * n) / 2;
  slots = ts.map((t, i) => ({ t, x: x0 + i * sw, y: trayY + 6 * S, w: sw, h: trayH - 14 * S }));
  slots.push({ t: "undo", x: x0 + ts.length * sw, y: trayY + 6 * S, w: sw, h: trayH - 14 * S }, { t: "test", x: x0 + (ts.length + 1) * sw, y: trayY + 6 * S, w: sw, h: trayH - 14 * S });
}

/* ---------- toy statics ---------- */
function restY(t, x) {
  const d = TYPES[t], p = { t, x, w: d.w, h: d.h }; let best = -Infinity, slip = false, over = false;
  for (const [a0, b0, off] of bots(p)) {

    for (const [ga, gb] of ground()) if (Math.min(b, gb) - Math.max(a, ga) > .01 && 0 - off > best) { best = -off; slip = false; }

}

    if (Math.abs(yb) < .01) for (const [ga, gb] of ground()) { const lo = Math.max(a, ga), hi = Math.min(b, gb); if (hi - lo > .01) out.push({ q: null, a: lo, b: hi }); }
    for (const Q of pieces) if (Q !== P) for (const [ta, tb] of tops(Q)) if (Math.abs(Q.y + Q.h - yb) < .01) { const lo = Math.max(a, Q.x + ta), hi = Math.min(b, Q.x + tb); if (hi - lo > .01) out.push({ q: Q, a: lo, b: hi }); }

}
const cmx = P => P.x + P.w / 2;
function analyse() {
  for (const P of pieces) { P.F = P.m; P.Mx = P.m * cmx(P); P.sup = contacts(P); P.bad = 0; }
  if (extra && pieces.includes(extra.p)) { extra.p.F += extra.m; extra.p.Mx += extra.m * extra.x; }

    else {
      const lo = Math.min(...P.sup.map(s => s.a)), hi = Math.max(...P.sup.map(s => s.b)); P.margin = Math.min(com - lo, hi - com);
      if (P.margin < -TOL) P.bad = com < lo ? -1 : 1;
      let ws = 0; const pts = P.sup.map(s => { const pt = clamp(com, s.a, s.b), w = 1 / (Math.abs(com - pt) + .15); ws += w; return [s, pt, w]; });

    }

function topple(P) {
  const i = pieces.indexOf(P); if (i < 0) return; pieces.splice(i, 1); lost++; clatters++;

}

    const top = TYPES[P.t].slip ? P.y + P.h * (1 - Math.abs(x - cmx(P)) / (P.w / 2)) : P.y + P.h; if (top > h) { h = top; piece = P; }

  return false;
}

/* ---------- placing ---------- */
function canPlace() { return phase === "build" && !pending && !pieces.some(p => p.fy > p.y + .001); }

  if (!canPlace()) return; const P = pieces.slice().reverse().find(p => !pieces.some(q => q !== p && contacts(q).some(s => s.q === p)));
  if (!P) return; pieces.splice(pieces.indexOf(P), 1); req.tray[P.t]++; sel = P.t; snd("pop", { pitch: .8 }); fx.puff(sx(cmx(P)), sy(P.y + P.h / 2), { color: "#fff" });
}

/* ---------- the pals test it ---------- */
function startTest() {

  phase = "test"; phaseT = 0; snd("whistle", { pitch: 1.2, vol: .6 }); Lab.music.intensity(.8);

    const [tx, ty] = req.star; let bx = tx, bh = -Infinity, bp = null;
    for (let x = tx - .5; x <= tx + .5001; x += .1) { const s = surf(x); if (s.h > bh + .001) { bh = s.h; bx = x; bp = s.p; } }

}
function finish(ok, why) {
  if (verdict) return; verdict = { ok, why }; phase = "result"; phaseT = 0; extra = null; if (ok) jobs++;
  if (ok) {
    const spare = Object.values(req.tray).reduce((a, b) => a + b, 0), stars = 1 + (spare >= 1 ? 1 : 0) + (lost === 0 ? 1 : 0), gain = 100 + 25 * reqN + 30 * spare + (lost === 0 ? 50 : 0);
    score += gain; starsAll += stars; verdict.stars = stars; verdict.gain = gain; pal.mood = "joy"; pal.arms = "cheer"; for (const s of sitters) s.sq = -.15;
    const shot = { k: req.kind, s: stars, p: pieces.map(p => [p.t, p.x, p.y]), r: req.river, st: req.star };
    photos.push(shot); if (photos.length > 5) photos.shift();

      try { const g = Lab.store.get("gallery") || []; g.push(shot); Lab.store.set("gallery", g.slice(-6)); } catch (e) { }

    }

    hearts--; pal.mood = "sad"; snd("error", { pitch: .9 }); if (!demo) { Lab.toast(why, 1500, { y: .3 }); Lab.buzz(40); }
  }

    if (demo) return;
    if (hearts <= 0) { phase = "over"; Lab.gameover({ title: "Oops!", message: "The pals still love your castles.", score, stats: [["Jobs done", jobs], ["Stars", starsAll], ["Blocks clattered", clatterSum]] }); }

}
let clatterSum = 0;

function update(dt) {

  phaseT += dt; kbT -= dt;
  // falling placed pieces
  for (const P of pieces) {
    if (P.fy > P.y) { P.vy -= G * dt; P.fy += P.vy * dt; if (P.fy <= P.y) { P.fy = P.y; P.sq = .25; const v = -P.vy; P.vy = 0; snd("thud", { pitch: 1.5 - P.m * .15, vol: Math.min(1, v / 10) }); fx.burst(sx(cmx(P)), sy(P.y), { n: 5, colors: ["#fff", "#e9dcc0"], speed: 70, life: .3, size: 2.5 * S, gravity: 200 }); if (pal) { pal.look = 0; } P.landed = true; } }
    P.sq = Lab.damp(P.sq, 0, 10, dt);

    const b = analyse(); if (b) { pending = { p: b, t: clatters ? .14 : .4 }; snd("tick", { pitch: .6, vol: .7 }); }
  }

  for (const P of pieces) { if (P !== (pending && pending.p)) P.wob = Lab.damp(P.wob, P.margin < .2 ? .35 : 0, 6, dt); }
  for (const D of debris) {
    D.vy -= G * dt * .8; D.x += D.vx * dt; D.y += D.vy * dt; D.ang += D.va * dt;
    const over = !ground().some(([a, b]) => D.x + D.p.w / 2 > a && D.x + D.p.w / 2 < b);
    if (D.bonk && !D.hit && D.y < 1.6) { D.hit = true; D.vy = 5; D.va = D.vx * 2; snd("boing", { pitch: 1.2 }); const s = sitters.find(z => z === D.bonk); if (s) { s.sq = .3; s.angry = 1.2; } if (!demo) fx.text(sx(D.bonk.x), sy(2.6), "Bonk!", { color: "#e2553f", size: 18 * U }); }
    if (D.y < (over ? -1.5 : -.2) && !D.dead) { D.dead = true; const X = sx(D.x + D.p.w / 2);
      if (over) { snd("splash", { pitch: 1.1 }); fx.burst(X, sy(-.2), { n: 14, colors: ["#bfe8ff", "#fff"], speed: 200, angle: -Math.PI / 2, spread: 1.4, life: .5, size: 3 * S, gravity: 700 }); }
      else { snd("thud", { pitch: .7 }); fx.burst(X, gy, { n: 10, colors: [TYPES[D.p.t].col, "#fff"], speed: 170, angle: -Math.PI / 2, spread: 2.2, life: .45, size: 3.5 * S, gravity: 600, shape: "square" }); } }

  if (phase === "build") { pal.mood = pending ? "scared" : drag ? "think" : "happy"; pal.arms = drag ? "down" : "wave"; }
  if (phase === "test") runTest(dt);

}
function runTest(dt) {
