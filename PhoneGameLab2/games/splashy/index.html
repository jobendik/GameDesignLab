<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Splashy", instructions:"Tap to jump from puddle to puddle.", restart:start});
let player,pads,t,score;
function start(){pads=[{x:80,y:Lab.H-100,r:36}];for(let i=1;i<6;i++)pads.push({x:pads[i-1].x+Lab.rand(100,180),y:Lab.H-100+Lab.rand(-30,30),r:Lab.rand(28,40)});
  player={pad:0,jumping:false,t:0,sx:0,sy:0,tx:0,ty:0};score=0;t=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(player.jumping)return;const cur=pads[player.pad],nxt=pads[player.pad+1];if(!nxt){Lab.win("Score: "+score);return;}
    player.jumping=true;player.t=0;player.sx=cur.x;player.sy=cur.y;player.tx=nxt.x;player.ty=nxt.y;}];
  Lab.loop((dt)=>{
    if(player.jumping){player.t+=2*dt;if(player.t>=1){const nxt=pads[player.pad+1];const dist=Lab.dist(player.sx,player.sy,nxt.x,nxt.y);
      if(dist<nxt.r+100){player.pad++;score++;Lab.setScore(score);Lab.beep(900,.05);
        for(const p of pads)p.x-=120;pads.push({x:pads[pads.length-1].x+Lab.rand(100,180),y:Lab.H-100+Lab.rand(-30,30),r:Lab.rand(28,40)});player.pad--;}
      else{Lab.gameover({title:"Splash!",message:"Score: "+score});return;}player.jumping=false;}}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#3a4a6a";c.fillRect(0,0,Lab.W,Lab.H);
  for(const p of pads){c.fillStyle="#5cf";c.beginPath();c.ellipse(p.x,p.y,p.r,p.r*0.5,0,0,Lab.TAU);c.fill();}
  let px,py;if(player.jumping){const t=player.t;px=Lab.lerp(player.sx,player.tx,t);py=Lab.lerp(player.sy,player.ty,t)-Math.sin(t*Math.PI)*80;}else{const cur=pads[player.pad];px=cur.x;py=cur.y-20;}
  c.fillStyle="#fc5";c.beginPath();c.arc(px,py,16,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
