<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Snack Baskets", instructions:"Tap left/right side to send falling snack to that color basket.", restart:start});
let items,baskets,score,life;
const COLORS=["#f55","#5cf","#fc5"];
function start(){items=[];baskets=[];score=0;life=3;Lab.setScore(0);
  for(let i=0;i<COLORS.length;i++)baskets.push({c:COLORS[i],x:(i+0.5)*Lab.W/COLORS.length,y:Lab.H-60,w:Lab.W/COLORS.length-20});
  spawn();
  Lab.input.onTap=[(x,y)=>{if(!items.length)return;const it=items[0];
    const i=Math.floor(x/(Lab.W/COLORS.length));it.target=baskets[i];it.tx=baskets[i].x;}];
  Lab.loop((dt)=>{
    for(const it of items){if(it.tx!==undefined){it.x=Lab.lerp(it.x,it.tx,5*dt);}it.y+=180*dt;
      if(it.y>Lab.H-80){if(it.target&&it.target.c===it.c){score++;Lab.setScore(score);Lab.beep(1000,.05);}else{life--;Lab.beep(200,.1);if(life<=0){Lab.gameover({title:"Done",message:"Score: "+score});return;}}
        items.shift();if(!items.length)spawn();}}
    draw();
  });
}
function spawn(){items.push({c:Lab.choose(COLORS),x:Lab.W/2,y:160});}
function draw(){const c=Lab.ctx;c.fillStyle="#143";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Life: "+life,12,Lab.H-12);
  for(const b of baskets){c.fillStyle=b.c;c.fillRect(b.x-b.w/2,b.y,b.w,40);}
  for(const it of items){c.fillStyle=it.c;c.beginPath();c.arc(it.x,it.y,18,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
