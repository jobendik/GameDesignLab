<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Clean the Ocean", instructions:"Tap to drop the claw. Grab the trash.", restart:start});
let claw,trash,t,score,phase;
function start(){
  claw={x:Lab.W/2,y:120,dir:1,len:0,grab:null};
  trash=[];for(let i=0;i<8;i++)trash.push({x:Lab.rand(40,Lab.W-40),y:Lab.rand(280,Lab.H-60),r:Lab.rand(14,24),c:Lab.choose(["#888","#cc4","#7a4","#a66"])});
  t=30;score=0;Lab.setScore(0);phase="swing";
  Lab.input.onTap=[()=>{if(phase==="swing")phase="drop";}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Time!",message:"Score: "+score});return;}
    if(phase==="swing"){claw.x+=claw.dir*200*dt;if(claw.x<40||claw.x>Lab.W-40)claw.dir*=-1;}
    if(phase==="drop"){claw.len+=400*dt;
      for(const tr of trash){if(!tr.dead && Lab.dist(claw.x,120+claw.len,tr.x,tr.y)<tr.r){claw.grab=tr;phase="up";tr.dead=true;break;}}
      if(120+claw.len>Lab.H-30){phase="up";}
    }
    if(phase==="up"){claw.len-=400*dt;
      if(claw.grab){claw.grab.x=claw.x;claw.grab.y=120+claw.len;}
      if(claw.len<=0){claw.len=0;if(claw.grab){score++;Lab.setScore(score);Lab.beep(900,.08);claw.grab=null;}phase="swing";
        if(trash.every(t=>t.dead)){Lab.win("Clean! Score: "+score);return;}}
    }
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#053a55";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  for(const tr of trash)if(!tr.dead||tr===claw.grab){c.fillStyle=tr.c;c.fillRect(tr.x-tr.r,tr.y-tr.r,tr.r*2,tr.r*2);}
  c.strokeStyle="#aaa";c.beginPath();c.moveTo(claw.x,120);c.lineTo(claw.x,120+claw.len);c.stroke();
  c.fillStyle="#bbb";c.fillRect(claw.x-10,120+claw.len-2,20,8);
}
start();
</script></body></html>
