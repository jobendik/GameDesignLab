<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Rocket Fun", instructions:"Drag to steer. Dodge asteroids.", restart:start});
let rocket,rocks,t,score;
function start(){rocket={x:Lab.W/2,y:Lab.H-120};rocks=[];t=0;score=0;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)rocket.x=Lab.clamp(x,30,Lab.W-30);}];
  Lab.loop((dt)=>{t+=dt;score=Math.floor(t*10);Lab.setScore(score);
    if(Math.random()<dt*2)rocks.push({x:Lab.rand(20,Lab.W-20),y:-30,vy:Lab.rand(200,360),r:Lab.rand(16,28)});
    for(const r of rocks){r.y+=r.vy*dt;if(Lab.dist(r.x,r.y,rocket.x,rocket.y)<r.r+18){Lab.gameover({title:"Boom!",message:"Score: "+score});return;}}
    rocks=rocks.filter(r=>r.y<Lab.H+30);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#03051a";c.fillRect(0,0,Lab.W,Lab.H);
  for(let i=0;i<30;i++){c.fillStyle="#fff";c.fillRect((i*47+t*80)%Lab.W,(i*29)%Lab.H,2,2);}
  for(const r of rocks){c.fillStyle="#888";c.beginPath();c.arc(r.x,r.y,r.r,0,Lab.TAU);c.fill();}
  c.fillStyle="#fc5";c.beginPath();c.moveTo(rocket.x,rocket.y-24);c.lineTo(rocket.x+16,rocket.y+20);c.lineTo(rocket.x-16,rocket.y+20);c.closePath();c.fill();
  c.fillStyle="#f55";c.beginPath();c.moveTo(rocket.x-8,rocket.y+20);c.lineTo(rocket.x+8,rocket.y+20);c.lineTo(rocket.x,rocket.y+34);c.closePath();c.fill();
}
start();
</script></body></html>
