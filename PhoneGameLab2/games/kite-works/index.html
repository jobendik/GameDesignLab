(function(){ "use strict";
/* KITE WORKS — Bolt the robot builds a kite every morning for whatever the sky is doing, then flies it.
 * Core idea kept: make a kite, then fly it through the wind. Creative + skill, and the design MATTERS:
 *   WORKSHOP: read today's forecast (Calm / Breezy / Gusty), pick a shape (Diamond: light, lifty, wobbly, fragile ·
 *   Delta: balanced · Box: heavy, rock-steady, unbreakable), a tail (longer = steadier but heavier) and paint it (colour +
 *   pattern; the kite you paint is the kite you fly). Live stat bars show Lift / Steady / Tough / Weight.
 *   FLIGHT (75 s): the sky is stacked WIND LANES you can see (streaks; blue = strong; grey = storm). Hold and slide to
 *   pull the kite to an altitude — but it only climbs where the wind gives it more lift than its weight, and it sinks in
 *   lanes too weak for it. Storm lanes over-strain a fragile kite (strain meter → SNAP, lose a patch); gusts shake a kite
 *   with little steadiness; gulls cross at altitude. Collect stars, thread ribbon rings (chain ×5), distance ticks up.
 *   So a light diamond owns a calm day and a box kite laughs at a gusty one — the forecast changes every run.
 * Pals: Bolt builds (wrench, advice bubble) and runs below holding the string; Pip, Nori and Momo cheer from the hill. */
let demo = false;
Lab.init({
  title: "Kite Works", tagline: "Build Bolt a kite for today's wind, then fly it through the lanes.", category: "Creative", kicker: "Pocket Pals",
  howto: ["Build a kite to suit the forecast", "Hold and slide to steer it up and down", "Ride strong lanes, dodge storms"],
  theme: { bg: "#a8dcf5", bg2: "#f1f9e4", fg: "#253049", muted: "#55607a", accent: "#ffb52e", accent2: "#3fb8d8", light: true },
  orient: "any", music: { style: "dream", key: "A", vol: .32 }, restart: start, attract,
});
const { draw, fx } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, rand = Lab.rand, INK = Pals.ink;
const SHAPES = [{ n: "Diamond", lift: 1.15, weight: .45, steady: .3, tough: .9, resp: 1.25 }, { n: "Delta", lift: 1, weight: .5, steady: .5, tough: 1.2, resp: 1 }, { n: "Box", lift: .86, weight: .68, steady: .78, tough: 1.75, resp: .8 }];
const TAILS = [{ n: "Short", w: 0, s: 0, bows: 3 }, { n: "Medium", w: .08, s: .18, bows: 5 }, { n: "Long", w: .16, s: .34, bows: 8 }];
const COLS = ["#ffcf3f", "#4cc9f0", "#ff6f61", "#9b7bff", "#5fd3a0"], PATS = ["Plain", "Stripes", "Dots", "Stars"];
const FORE = [{ n: "Calm", scene: "golden", ws: [.35, .55, .7, .85], good: 1.15, tip: "Calm day! Go light and lifty.", gust: .6 },
  { n: "Breezy", scene: "meadow", ws: [.6, .85, 1.05, 1.3, 1.6], good: 1.2, tip: "Nice breeze. Anything flies!", gust: 1 },
  { n: "Gusty", scene: "meadow", ws: [.85, 1.25, 1.55, 1.9, 2.2], good: 1.3, tip: "Gusty! Build it tough and steady.", gust: 1.5 }];
const FLIGHT = 75;
let S, wide, P, kx, skyTop, groundY, bgs = {};
let design, fore, phase, btns, clock, wx, speed, segs, items, kite, patches, strain, score, stars, rings, chain, bestChain, dist, time, inv, target, bubble, snaps, cheer, lanesOverride;

function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function D() { const sh = SHAPES[design.shape], tl = TAILS[design.tail]; return { lift: sh.lift, weight: sh.weight + tl.w, steady: Math.min(.95, sh.steady + tl.s), tough: sh.tough, resp: sh.resp * (1 - tl.w) }; }
function layout() {
  P = Lab.play; wide = P.w > P.h * 1.1; S = Math.min(P.w / 390, P.h / 700, 1.5); if (wide) S = Math.min(P.w / 760, P.h / 360, 1.5);

Lab.onResize(() => { if (design) { layout(); bgs = {}; } });

    if (k === 2) { g.fillStyle = "rgba(90,100,130,.18)"; g.fillRect(-40, -40, Lab.W + 80, Lab.H + 80); } });

/* ---------- kite art ---------- */
function shapePath(c, sh, s) {

  else if (sh === 1) { c.moveTo(0, -s * .85); c.lineTo(s, s * .45); c.quadraticCurveTo(0, s * .25, -s, s * .45); }

  c.strokeStyle = "rgba(120,80,40,.8)"; c.lineWidth = Math.max(1.2, s * .035); c.beginPath();

  else { c.moveTo(-s * .42, -s); c.lineTo(-s * .42, s * .82); c.moveTo(s * .42, -s); c.lineTo(s * .42, s * .82); c.moveTo(-s * .42, -s * .1); c.lineTo(s * .42, -s * .1); }
  c.stroke(); c.restore();
}

/* ---------- workshop ---------- */

  TAILS.forEach((s, i) => add(bx + i * bw / 3 + 3, rows[1] - bh / 2, bw / 3 - 6, bh, s.n, () => { design.tail = i; }, design.tail === i));
  const cw = bw * .68 / 5; COLS.forEach((c, i) => add(bx + i * cw + 3, rows[2] - bh / 2, cw - 6, bh, "", () => { design.col = i; }, design.col === i, c));

  add(x0 + w0 * .2, rows[3] - bh * .65, w0 * .6, bh * 1.3, "Fly!", () => launch(), true, "#ffb52e");

  const f = FORE[fore], bw2 = Math.min(230 * S, P.w * (wide ? .3 : .46)), bpx = wide ? clamp(bxp + bw2 * .3, P.x + bw2 / 2 + 6, P.x + P.w * .45 - bw2 / 2) : P.x + 8 * S + bw2 / 2, bpy = byp - bs * (wide ? 1.05 : 1.25);

  // workbench panel
  const top = wide ? P.y + P.h * .06 : P.y + P.h * .43, pl = wide ? g.x0 - 8 * S : P.x + 8 * S, pw = wide ? P.x + P.w - 6 * S - pl : P.w - 16 * S, ph = P.y + P.h - 6 * S - top;
  draw.rect(c, pl, top, pw, ph, 18 * S, "rgba(255,250,240,.9)", "rgba(120,90,60,.35)", 2);
  draw.text(c, "Today: " + f.n, pl + pw / 2, top + 20 * S, { size: 17 * S, color: "#253049", weight: 700 });
  for (let i = 0; i < 4; i++) { const w = f.ws[Math.min(i, f.ws.length - 1)] / 2.2; draw.rect(c, pl + pw / 2 + 52 * S + i * 10 * S, top + 26 * S - w * 18 * S, 6 * S, w * 18 * S, 2, fore === 2 ? "#7b86a8" : "#3fb8d8"); }
  const d = D(), stats = [["Lift", d.lift / 1.2], ["Steady", d.steady], ["Tough", d.tough / 1.8], ["Weight", d.weight / .9]], sy0 = top + 46 * S, sh2 = wide ? (g.rows[0] - sy0 - 24 * S) / 4 : 21 * S;

/* ---------- flight ---------- */
function laneSet(x0) {
  const f = FORE[fore], n = Lab.randInt(3, 4), cut = [0]; for (let i = 1; i < n; i++) cut.push(i / n + rand(-.06, .06)); cut.push(1.08);
  const lanes = []; const prog = clamp(clock / FLIGHT, 0, 1), good = Lab.randInt(0, n - 1);
  for (let i = 0; i < n; i++) { let w = i === good ? f.good + rand(-.05, .1) : Lab.choose(f.ws) * (1 + prog * .15); if (i === n - 1 && Lab.chance((.3 + prog * .4) * (fore === 0 ? .35 : 1)) && i !== good) w = Math.max(w, 1.8 + prog * .4); lanes.push({ a0: cut[i], a1: cut[i + 1], w }); }
  return { x0, x1: x0 + rand(520, 760) * S, lanes };
}
function genAhead() {
  while (segs[segs.length - 1].x1 < wx + Lab.W * 1.6) {
    const last = segs[segs.length - 1], sg = laneSet(last.x1); segs.push(sg); const prog = clamp(clock / FLIGHT, 0, 1);
    const fine = sg.lanes.filter(l => l.w > .75 && l.w < 1.7), L = fine.length ? Lab.choose(fine) : sg.lanes[0], am = (L.a0 + Math.min(1, L.a1)) / 2, sx = sg.x0 + rand(60, 200) * S;
    for (let i = 0; i < 4; i++) items.push({ x: sx + i * 46 * S, a: am + Math.sin(i * .9) * .04, kind: "star" });
    const L2 = Lab.choose(sg.lanes); items.push({ x: sg.x0 + (sg.x1 - sg.x0) * .72, a: clamp((L2.a0 + Math.min(1, L2.a1)) / 2, .12, .92), kind: "ring" });
    if (clock > 10 && Lab.chance(.35 + prog * .4)) { const a = rand(.2, .85); for (let i = 0; i < Lab.randInt(1, 2 + Math.floor(prog * 2)); i++) items.push({ x: sg.x0 + (sg.x1 - sg.x0) * rand(.3, .9) + i * 40 * S, a: a + i * .05, kind: "bird", ph: rand(0, TAU) }); }
  }

}
function windAt(a, x) { if (lanesOverride != null) return lanesOverride; for (const sg of segs) if (x >= sg.x0 && x < sg.x1) { for (const l of sg.lanes) if (a >= l.a0 && a < l.a1) return l.w; return sg.lanes[sg.lanes.length - 1].w; } return 1; }
function launch() {
  phase = "fly"; Lab.store.set("design", design); clock = 0; wx = 0; speed = 150 * S; segs = [{ x0: -Lab.W * 2, x1: Lab.W * .5, lanes: [{ a0: 0, a1: 1.1, w: FORE[fore].good }] }]; items = [];
  kite = { a: .4, va: 0, wob: 0, spin: 0, aOff: 0 }; patches = 3; strain = 0; score = 0; stars = 0; rings = 0; chain = 0; bestChain = 0; dist = 0; time = FLIGHT; inv = 0; target = .5; snaps = 0; cheer = 0;
  genAhead(); if (!demo) { Lab.setScore(0); snd("whoosh"); Lab.banner("Up she goes!", { color: "#3fb8d8", ms: 1000, y: .3 }); Lab.music.intensity(.4); Lab.hint("Hold and slide up or down to steer the kite"); }
}
function lose(kind) {
  patches--; snaps++; inv = 1.8; strain = 0; chain = 0; kite.spin = 1; kite.va = -.25;
  Lab.shake(6, .3); snd(kind === "snap" ? "snap" : "hurt"); snd("whoosh", { pitch: .6 });
  if (!demo) { Lab.toast(kind === "snap" ? "Snap! Too much strain" : kind === "bird" ? "Bonk! A gull" : "Bump! Too low", 1100, { y: .26 }); Lab.buzz(50); }

function end(timeUp) {
  phase = "over"; Lab.music.intensity(.2);
  Lab.gameover({ title: timeUp ? "What a flight!" : "Oops! Kite down", message: SHAPES[design.shape].n + " kite, " + TAILS[design.tail].n.toLowerCase() + " tail, on a " + FORE[fore].n.toLowerCase() + " day.", score, neutral: timeUp,

function update(dt) {

  const gust = Math.max(0, w - .9) * f.gust * (1 - d.steady); kite.aOff = Math.sin(clock * 5.3) * gust * .05 + Math.sin(clock * 8.1) * gust * .025; kite.wob = Math.sin(clock * 6.7) * (.08 + gust * .6) + kite.va * .3;

      else if (inv <= 0) { it.gone = true; lose("bird"); }

}
