<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Balloon Splash", instructions:"Tap balloons to splash them. 30 seconds.", restart:start});
let balloons,t,score;
function start(){
  balloons=[];score=0;t=30;Lab.setScore(0);
  for(let i=0;i<6;i++)spawn();
  Lab.input.onTap=[(x,y)=>{
    for(const b of balloons){if(!b.dead && Lab.dist(x,y,b.x,b.y)<b.r){b.dead=true;score++;Lab.setScore(score);Lab.beep(800,.05);}}
  }];
  Lab.loop((dt)=>{
    t-=dt; if(t<=0){Lab.gameover({title:"Time!",message:"Popped "+score+" balloons."});return;}
    for(const b of balloons){if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<b.r||b.x>Lab.W-b.r)b.vx*=-1;if(b.y<140+b.r||b.y>Lab.H-40-b.r)b.vy*=-1;}
    balloons=balloons.filter(b=>!b.dead);
    while(balloons.length<6)spawn();
    draw();
  });
}
function spawn(){balloons.push({x:Lab.rand(60,Lab.W-60),y:Lab.rand(200,Lab.H-100),r:Lab.rand(28,42),vx:Lab.rand(-90,90),vy:Lab.rand(-70,70),c:`hsl(${Lab.randInt(0,360)},80%,60%)`});}
function draw(){const c=Lab.ctx;c.fillStyle="#143a4d";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  for(const b of balloons){c.fillStyle=b.c;c.beginPath();c.arc(b.x,b.y,b.r,0,Lab.TAU);c.fill();
    c.strokeStyle="rgba(255,255,255,.3)";c.beginPath();c.moveTo(b.x,b.y+b.r);c.lineTo(b.x,b.y+b.r+20);c.stroke();}
}
start();
</script></body></html>
