<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Happy Face", instructions:"Find the odd face before time runs out.", restart:start});
let N,grid,odd,t,score;
function start(){N=4+Math.min(4,Math.floor((score||0)/3));grid=N*N;odd=Lab.randInt(0,grid-1);t=8;score=score||0;Lab.setScore(score);
  Lab.input.onTap=[(x,y)=>{const i=hit(x,y);if(i<0)return;
    if(i===odd){score++;Lab.setScore(score);Lab.beep(900,.1);setTimeout(start,200);}else{Lab.gameover({title:"Wrong!",message:"Score: "+score});}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Too slow!",message:"Score: "+score});return;}draw();});
}
function size(){return Math.min(Lab.W,Lab.H-260)/N;}
function off(){const s=size();return {x:(Lab.W-s*N)/2,y:180};}
function hit(x,y){const s=size(),o=off();const c=Math.floor((x-o.x)/s),r=Math.floor((y-o.y)/s);if(r<0||r>=N||c<0||c>=N)return -1;return r*N+c;}
function draw(){const c=Lab.ctx;c.fillStyle="#1c2240";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+t.toFixed(1),12,Lab.H-12);
  const s=size(),o=off();
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){const i=r*N+col;const cx=o.x+col*s+s/2,cy=o.y+r*s+s/2;
    c.fillStyle="#fc5";c.beginPath();c.arc(cx,cy,s*0.38,0,Lab.TAU);c.fill();
    c.fillStyle="#000";c.beginPath();c.arc(cx-s*0.1,cy-s*0.08,s*0.04,0,Lab.TAU);c.arc(cx+s*0.1,cy-s*0.08,s*0.04,0,Lab.TAU);c.fill();
    c.strokeStyle="#000";c.lineWidth=2;c.beginPath();
    if(i===odd) c.arc(cx,cy+s*0.12,s*0.13,Math.PI,Lab.TAU);
    else c.arc(cx,cy+s*0.05,s*0.13,0,Math.PI);
    c.stroke();}
}
start();
</script></body></html>
