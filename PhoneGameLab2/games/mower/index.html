<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Mower", instructions:"Tap arrow keys / swipe to mow. Cover every patch without retracing.", restart:start});
const N=6;let grid,pos,dir;
function start(){grid=Array.from({length:N},()=>Array(N).fill(true));pos={r:0,c:0};grid[0][0]=false;dir=null;
  window.addEventListener("keydown",kh);
  Lab.input.onSwipe=[(dx,dy)=>{const d=Math.abs(dx)>Math.abs(dy)?(dx>0?[0,1]:[0,-1]):(dy>0?[1,0]:[-1,0]);step(d[0],d[1]);}];
  Lab.setScore(N*N-1);
  Lab.loop(()=>draw());
}
function kh(e){const k={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(k)step(...k);}
function step(dr,dc){const r=pos.r+dr,c=pos.c+dc;if(r<0||r>=N||c<0||c>=N)return;
  if(!grid[r][c]){Lab.gameover({title:"Retraced",message:"Try again"});return;}
  pos.r=r;pos.c=c;grid[r][c]=false;
  Lab.setScore(grid.flat().filter(x=>x).length);Lab.beep(500,.04);
  if(grid.flat().every(x=>!x)){Lab.win("Fully mowed!");}
}
function draw(){const c=Lab.ctx;c.fillStyle="#102a18";c.fillRect(0,0,Lab.W,Lab.H);
  const s=Math.min(Lab.W,Lab.H-260)/N;const o={x:(Lab.W-s*N)/2,y:180};
  for(let r=0;r<N;r++)for(let col=0;col<N;col++){
    c.fillStyle=grid[r][col]?"#5a3":"#5c4a2a";c.fillRect(o.x+col*s+2,o.y+r*s+2,s-4,s-4);}
  c.fillStyle="#f55";c.fillRect(o.x+pos.c*s+s*0.2,o.y+pos.r*s+s*0.2,s*0.6,s*0.6);
}
start();
</script></body></html>
