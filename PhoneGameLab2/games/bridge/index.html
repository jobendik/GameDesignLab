<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bridge", instructions:"Hold to grow the bridge. Release when it spans the gap.", restart:start});
let leftEdge,gapW,bridge,hero,phase,score;
function start(){
  leftEdge=80;gapW=Lab.rand(120,Math.min(240,Lab.W-220));bridge={len:0,fall:0};phase="grow";hero={x:leftEdge,y:Lab.H/2};score=0;Lab.setScore(0);
  Lab.input.onDown=[()=>{if(phase==="grow")phase="growing";}];
  Lab.input.onUp=[()=>{if(phase==="growing")phase="fall";}];
  Lab.loop((dt)=>{
    if(phase==="growing")bridge.len+=240*dt;
    if(phase==="fall"){bridge.fall+=Math.PI*1.8*dt;if(bridge.fall>=Math.PI/2){bridge.fall=Math.PI/2;phase="walk";}}
    if(phase==="walk"){hero.x+=140*dt;
      const target=leftEdge+gapW+40;
      if(hero.x>=leftEdge+bridge.len && hero.x<leftEdge+gapW+30){
        Lab.gameover({title:"Splash",message:"Score: "+score});return;}
      if(hero.x>=target){score++;Lab.setScore(score);reset();}
    }
    draw();
  });
}
function reset(){leftEdge=80;gapW=Lab.rand(120,Math.min(240,Lab.W-220));bridge={len:0,fall:0};phase="grow";hero={x:leftEdge,y:Lab.H/2};}
function draw(){const c=Lab.ctx;c.fillStyle="#13283a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#5a3";c.fillRect(0,Lab.H/2,leftEdge,Lab.H);
  c.fillRect(leftEdge+gapW,Lab.H/2,Lab.W,Lab.H);
  c.save();c.translate(leftEdge,Lab.H/2);c.rotate(-Math.PI/2+bridge.fall);
  c.fillStyle="#caa472";c.fillRect(0,-6,bridge.len,12);c.restore();
  c.fillStyle="#fff";c.beginPath();c.arc(hero.x,Lab.H/2-12,12,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
