<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Jungle Shot", instructions:"Drag back to aim. Release to fire. Hit the targets.", restart:start});
let proj,sling,start0,targets,score,shots;
function start(){sling={x:80,y:Lab.H-100};proj={x:sling.x,y:sling.y,vx:0,vy:0,flying:false};
  targets=[];for(let i=0;i<5;i++)targets.push({x:Lab.rand(Lab.W*0.4,Lab.W-40),y:Lab.rand(200,Lab.H-100),r:24,hit:false});
  score=0;shots=8;start0=null;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{if(!proj.flying)start0={x,y};}];
  Lab.input.onUp=[(x,y)=>{if(start0){proj.vx=(start0.x-x)*3;proj.vy=(start0.y-y)*3;proj.flying=true;shots--;start0=null;}}];
  Lab.loop((dt)=>{
    if(proj.flying){proj.vy+=900*dt;proj.x+=proj.vx*dt;proj.y+=proj.vy*dt;
      for(const t of targets)if(!t.hit&&Lab.dist(t.x,t.y,proj.x,proj.y)<t.r){t.hit=true;score++;Lab.setScore(score);Lab.beep(1000,.1);}
      if(proj.y>Lab.H||proj.x>Lab.W){proj.flying=false;proj.x=sling.x;proj.y=sling.y;
        if(targets.every(t=>t.hit)){Lab.win("Score: "+score);return;}
        if(shots<=0)Lab.gameover({title:"Out of shots",message:"Score: "+score});}}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a4a1a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Shots: "+shots,12,Lab.H-12);
  c.fillStyle="#7a4f2c";c.fillRect(sling.x-6,sling.y,12,60);c.fillRect(sling.x-20,sling.y-10,12,20);c.fillRect(sling.x+8,sling.y-10,12,20);
  for(const t of targets){c.fillStyle=t.hit?"#5f8":"#f55";c.beginPath();c.arc(t.x,t.y,t.r,0,Lab.TAU);c.fill();}
  c.fillStyle="#9f5";c.beginPath();c.arc(proj.x,proj.y,10,0,Lab.TAU);c.fill();
  if(start0){c.strokeStyle="#fff";c.beginPath();c.moveTo(sling.x,sling.y);c.lineTo(sling.x+(start0.x-Lab.input.x),sling.y+(start0.y-Lab.input.y));c.stroke();}
}
start();
</script></body></html>
