<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Rainbows", instructions:"Drag from dot to matching color dot to draw a rainbow.", restart:start});
let pairs,paths,drag;
const COLORS=["#f55","#fc5","#5f8","#5cf","#a4f"];
function start(){pairs=[];paths=[];const used=new Set();
  for(let i=0;i<COLORS.length;i++){
    let a,b;do{a={x:Lab.rand(40,Lab.W-40),y:Lab.rand(180,Lab.H-80)};}while([...used].some(p=>Lab.dist(p.x,p.y,a.x,a.y)<60));used.add(a);
    do{b={x:Lab.rand(40,Lab.W-40),y:Lab.rand(180,Lab.H-80)};}while([...used].some(p=>Lab.dist(p.x,p.y,b.x,b.y)<60));used.add(b);
    pairs.push({c:COLORS[i],a,b});}
  drag=null;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{for(const p of pairs){if(Lab.dist(p.a.x,p.a.y,x,y)<22){drag={c:p.c,target:p.b,pts:[{x:p.a.x,y:p.a.y}]};return;}
    if(Lab.dist(p.b.x,p.b.y,x,y)<22){drag={c:p.c,target:p.a,pts:[{x:p.b.x,y:p.b.y}]};return;}}}];
  Lab.input.onMove=[(x,y)=>{if(drag)drag.pts.push({x,y});}];
  Lab.input.onUp=[(x,y)=>{if(drag&&Lab.dist(drag.target.x,drag.target.y,x,y)<22){paths.push({c:drag.c,pts:drag.pts});Lab.setScore(paths.length);Lab.beep(900,.06);
    if(paths.length===COLORS.length)Lab.win("Rainbow complete!");}
    drag=null;}];
  Lab.loop(()=>draw());
}
function draw(){const c=Lab.ctx;c.fillStyle="#101422";c.fillRect(0,0,Lab.W,Lab.H);
  c.lineWidth=8;c.lineCap="round";
  for(const p of paths){c.strokeStyle=p.c;c.beginPath();for(let i=0;i<p.pts.length;i++){const q=p.pts[i];if(i===0)c.moveTo(q.x,q.y);else c.lineTo(q.x,q.y);}c.stroke();}
  if(drag){c.strokeStyle=drag.c;c.beginPath();for(let i=0;i<drag.pts.length;i++){const q=drag.pts[i];if(i===0)c.moveTo(q.x,q.y);else c.lineTo(q.x,q.y);}c.stroke();}
  c.lineWidth=1;
  for(const p of pairs){c.fillStyle=p.c;c.beginPath();c.arc(p.a.x,p.a.y,18,0,Lab.TAU);c.fill();c.beginPath();c.arc(p.b.x,p.b.y,18,0,Lab.TAU);c.fill();}
}
start();
</script></body></html>
