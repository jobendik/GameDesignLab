<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Space Piano", instructions:"Tap the falling black tiles, never the white.", restart:start});
const COLS=4;let tiles,t,score,speed;
function start(){tiles=[];t=0;score=0;speed=220;Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{const col=Math.floor(x/(Lab.W/COLS));let hit=false;
    for(let i=tiles.length-1;i>=0;i--){const ti=tiles[i];if(ti.col===col&&y>=ti.y&&y<=ti.y+80){tiles.splice(i,1);score++;Lab.setScore(score);Lab.beep(400+col*150,.06);hit=true;break;}}
    if(!hit)Lab.gameover({title:"Wrong tap",message:"Score: "+score});
  }];
  Lab.loop((dt)=>{t+=dt;speed+=4*dt;
    if(Math.random()<dt*3)tiles.push({col:Lab.randInt(0,COLS-1),y:160});
    for(const ti of tiles)ti.y+=speed*dt;
    for(const ti of tiles)if(ti.y>Lab.H){Lab.gameover({title:"Missed!",message:"Score: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#fff";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#102030";c.fillRect(0,0,Lab.W,160);
  for(let i=1;i<COLS;i++){c.strokeStyle="#ccc";c.beginPath();c.moveTo(i*Lab.W/COLS,160);c.lineTo(i*Lab.W/COLS,Lab.H);c.stroke();}
  for(const ti of tiles){c.fillStyle="#000";c.fillRect(ti.col*Lab.W/COLS+2,ti.y,Lab.W/COLS-4,80);}
}
start();
</script></body></html>
