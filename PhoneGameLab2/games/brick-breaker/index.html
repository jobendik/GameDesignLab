<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Brick Breaker", instructions:"Drag to move the paddle. Break all the bricks.", restart:start});
let paddle,ball,bricks,score,lives;
function start(){
  paddle={x:Lab.W/2,y:Lab.H-60,w:110,h:14};
  ball={x:Lab.W/2,y:Lab.H-100,r:10,vx:200,vy:-260};
  bricks=[];score=0;lives=3;Lab.setScore(0);
  const cols=8,rows=5,bw=(Lab.W-40)/cols,bh=24;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:20+c*bw,y:180+r*bh,w:bw-4,h:bh-4,c:`hsl(${r*60},70%,60%)`,alive:true});
  Lab.input.onMove=[(x,y)=>{paddle.x=Lab.clamp(x,paddle.w/2,Lab.W-paddle.w/2);}];
  Lab.loop((dt)=>{
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    if(ball.x<ball.r||ball.x>Lab.W-ball.r)ball.vx*=-1;
    if(ball.y<160)ball.vy*=-1;
    if(ball.y+ball.r>paddle.y && ball.y<paddle.y+paddle.h && Math.abs(ball.x-paddle.x)<paddle.w/2 && ball.vy>0){
      ball.vy*=-1; ball.vx+=(ball.x-paddle.x)*3; Lab.beep(500,.04);}
    for(const b of bricks){if(!b.alive)continue;
      if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;Lab.setScore(score);Lab.beep(800,.04);break;}}
    if(ball.y>Lab.H){lives--;if(lives<=0){Lab.gameover({title:"Out of lives",message:"Score: "+score});return;}
      ball.x=Lab.W/2;ball.y=Lab.H-100;ball.vx=200;ball.vy=-260;}
    if(bricks.every(b=>!b.alive)){Lab.win("All cleared! Score: "+score);return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#0d1426";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Lives: "+lives,12,Lab.H-12);
  for(const b of bricks)if(b.alive){c.fillStyle=b.c;c.fillRect(b.x,b.y,b.w,b.h);}
  c.fillStyle="#fff";c.fillRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h);
  c.beginPath();c.arc(ball.x,ball.y,ball.r,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
