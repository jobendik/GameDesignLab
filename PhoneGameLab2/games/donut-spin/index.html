<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Donut Spin", instructions:"Tap to throw a knife into the donut. Don't hit other knives.", restart:start});
let knives,inFlight,angle,sp,toThrow,score;
function start(){knives=[];inFlight=null;angle=0;sp=1.6;toThrow=8;score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(!inFlight && toThrow>0){inFlight={y:Lab.H-100,vy:-800};}}];
  Lab.loop((dt)=>{
    angle+=sp*dt;
    if(inFlight){inFlight.y+=inFlight.vy*dt;
      if(inFlight.y<=Lab.H/2+80){
        const a=-Math.PI/2-angle;
        for(const k of knives){if(Math.abs(((k.a-a+Math.PI*3)%(Math.PI*2))-Math.PI)>Math.PI-0.25){Lab.gameover({title:"Hit a knife!",message:"Stuck: "+score});return;}}
        knives.push({a});score++;toThrow--;Lab.setScore(score);Lab.beep(700,.06);
        inFlight=null;sp+=0.15;
        if(toThrow===0){Lab.win("All thrown! Score: "+score);return;}}
    }
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a1020";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Left: "+toThrow,12,Lab.H-12);
  const cx=Lab.W/2, cy=Lab.H/2, r=Math.min(Lab.W,Lab.H)*0.22;
  c.save();c.translate(cx,cy);c.rotate(angle);
  c.fillStyle="#fc5";c.beginPath();c.arc(0,0,r,0,Lab.TAU);c.fill();
  c.fillStyle="#1a1020";c.beginPath();c.arc(0,0,r*0.4,0,Lab.TAU);c.fill();
  for(const k of knives){c.save();c.rotate(k.a+Math.PI/2);c.fillStyle="#ccc";c.fillRect(-3,r-6,6,40);c.fillStyle="#7a5";c.fillRect(-5,r+34,10,12);c.restore();}
  c.restore();
  if(inFlight){c.fillStyle="#ccc";c.fillRect(cx-3,inFlight.y,6,40);c.fillStyle="#7a5";c.fillRect(cx-5,inFlight.y+40,10,12);}
}
start();
</script></body></html>
