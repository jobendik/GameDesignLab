<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sky High", instructions:"Tap to drop the swinging block. Stack high!", restart:start});
let blocks,cur,score;
function start(){blocks=[{x:Lab.W/2-60,y:Lab.H-80,w:120}];cur={x:Lab.W/2,y:160,w:120,dir:1,vx:200};score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{
    const top=blocks[blocks.length-1];const left=Math.max(top.x,cur.x-cur.w/2),right=Math.min(top.x+top.w,cur.x+cur.w/2);
    const w=right-left;if(w<=0){Lab.gameover({title:"Missed!",message:"Score: "+score});return;}
    blocks.push({x:left,y:top.y-30,w});score++;Lab.setScore(score);
    cur={x:Lab.W/2,y:Math.max(160,top.y-30-80),w,dir:1,vx:200+score*15};
    if(top.y-30<200){for(const b of blocks)b.y+=30;cur.y+=30;}
    Lab.beep(900,.05);
  }];
  Lab.loop((dt)=>{cur.x+=cur.dir*cur.vx*dt;if(cur.x<cur.w/2){cur.x=cur.w/2;cur.dir=1;}if(cur.x>Lab.W-cur.w/2){cur.x=Lab.W-cur.w/2;cur.dir=-1;}draw();});
}
function draw(){const c=Lab.ctx;c.fillStyle="#0a1a2a";c.fillRect(0,0,Lab.W,Lab.H);
  for(let i=0;i<blocks.length;i++){const b=blocks[i];c.fillStyle=`hsl(${i*25},70%,55%)`;c.fillRect(b.x,b.y,b.w,28);}
  c.fillStyle="#fc5";c.fillRect(cur.x-cur.w/2,cur.y,cur.w,28);
}
start();
</script></body></html>
