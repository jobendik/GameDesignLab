<title>Flicknic</title>

(function(){ "use strict";
/* FLICKNIC — Bun baked a strawberry cake for the picnic. The bugs heard.
 * Core idea kept: bugs converge on the food; get rid of them with your finger before they reach it.
 * Made a game (direct action, no towers):
 *   FLICK  — swipe through a bug and it flies off the way you swiped. Harder swipes fly further; weak ones only stun.
 *   BOWL   — a flying bug knocks the next one flying (×2), which knocks the next (×3)… lines of ants are bowling alleys.
 *   RESCUE — a bug that reaches the plate walks off with a slice. Flick the thief and the slice sails back to Bun.
 *            The run ends only when all eight slices have left the blanket.
 *   Cast   — ants; beetles (first flick only flips them, the second sends a heavy bowling ball); grasshoppers (cannot be
 *            flicked mid-hop); wasps (fast, circle then dive); ladybirds are friends — leave them be and they bring a slice back.
 *   BUN    — shoos fill her jam jar; when it is full, tap Bun and she bangs her pan: every bug on the blanket goes flying.
 * Identity: top-down gingham blanket on bright grass, strawberry cake, hand-drawn bugs; "march" music for the ant columns. */
let demo = false, demoT = 0;
Lab.init({
  title: "Flicknic", tagline: "Flick the bugs off the blanket. Save Bun's cake.", category: "Skill", kicker: "Pocket Pals",
  howto: ["Swipe through a bug to flick it away", "Flick one bug into another for a chain", "Flick a thief to win the slice back"],
  theme: { bg: "#79c267", bg2: "#c9efb0", accent: "#ff6b81", accent2: "#ffb52e", fg: "#2b2340", muted: "#4d5d48", light: true },
  orient: "any", music: { style: "march", key: "C", vol: .36 }, restart: start, attract,
});
const { draw, fx } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, rand = Lab.rand, INK = Pals.ink;
const TY = { ant: { r: 11, pts: 10, T: 1 }, beetle: { r: 16, pts: 30, T: 1.35 }, hopper: { r: 12, pts: 20, T: .95 }, wasp: { r: 12, pts: 40, T: 1 }, lady: { r: 12, pts: 0, T: 1.15 } };
let P, S, cx, cy, plateR, bun, bugs, has, lost, score, wave, queue, waveT, gapT, perfect, jam, shooed, rescued, bestChain, over, clock, hold, frozen, trail, last, spd, flying, bunJoy, bunSad, bunBang, friends, told, buzz, tipQ, tipT;

function layout() { P = Lab.play; S = clamp(Math.min(P.w, P.h) / 390, .8, 1.5); cx = P.x + P.w / 2; cy = P.y + P.h * .54; plateR = 58 * S; bun = { x: cx, y: cy - plateR - 38 * S }; Lab.sprite.clear("fk"); }
Lab.onResize(() => { if (bugs) layout(); });
function snd(n, o) { if (!demo) Lab.sfx(n, o); }
function tip(text) { if (!demo) tipQ.push(text); }
function slices() { return has.filter(Boolean).length; }
function edgeDist(a) { const dx = Math.cos(a), dy = Math.sin(a); return Math.min(dx > 0 ? (Lab.W + 30 - cx) / dx : dx < 0 ? (-30 - cx) / dx : 1e9, dy > 0 ? (Lab.H + 30 - cy) / dy : dy < 0 ? (-30 - cy) / dy : 1e9); }
function ang0() { let a; do a = rand(0, TAU); while (Math.abs(Lab.angleDiff(a, -Math.PI / 2)) < .62); return a; }   // never straight over Bun
function spawn(type, a, back) {
  const d = edgeDist(a), T = Math.max(5.2, 9.2 - wave * .3) * TY[type].T, b = { type, r: TY[type].r * S, x: cx + Math.cos(a) * (d + (back || 0)), y: cy + Math.sin(a) * (d + (back || 0)), ang: a + Math.PI, sp: d / T, st: "walk", t: 0, vx: 0, vy: 0, chain: 0, carry: false, rot: 0, ph: rand(0, 9), cd: 0, hopD: d / 8 };

}
function buildWave(n) {

}
function reset() {
  bugs = []; has = Array(8).fill(true); lost = 0; score = 0; wave = 1; queue = buildWave(1); waveT = 0; gapT = 0; perfect = true; jam = 0; shooed = 0; rescued = 0; bestChain = 0; over = false; clock = 0; hold = false; frozen = false;

function start() {

  Lab.input.onDown = [(x, y) => { last = { x, y, t: performance.now() }; spd = 0; trail = [{ x, y, t: clock }]; }];
  Lab.input.onMove = [(x, y) => { if (!Lab.input.down || !last || over) return; const now = performance.now(), d = Math.hypot(x - last.x, y - last.y); if (d < 2) return; spd = Math.max(d / Math.max(8, now - last.t) * 1000, spd * .6); swipe(last.x, last.y, x, y, spd); last = { x, y, t: now }; trail.push({ x, y, t: clock }); if (trail.length > 14) trail.shift(); }];
  Lab.input.onUp = [() => { last = null; }];
  Lab.input.onTap = [(x, y) => { if (over) return; if (jam >= 1 && Math.hypot(x - bun.x, y - bun.y) < 52 * S) return bang(); for (const b of bugs) if (canFlick(b) && Math.hypot(x - b.x, y - b.y) < b.r + 16 * S) { const l = Math.hypot(b.x - cx, b.y - cy) || 1; flick(b, (b.x - cx) / l, (b.y - cy) / l, 0); break; } }];
  Lab.hint("Swipe through a bug to flick it away");
  Lab.expose({
    get score() { return score; }, get slices() { return slices(); }, get lost() { return lost; }, get wave() { return wave; }, get jam() { return jam; }, set jam(v) { jam = v; }, get shooed() { return shooed; }, get rescued() { return rescued; },
    get bestChain() { return bestChain; }, get over() { return over; }, get friends() { return friends; }, get geo() { return { cx, cy, S, plateR, bun, W: Lab.W, H: Lab.H }; },
    bugs() { return bugs.map(b => ({ type: b.type, x: b.x, y: b.y, st: b.st, carry: b.carry, chain: b.chain })); }, hold(v) { hold = v; }, freeze(v) { frozen = v; }, endWave() { queue = []; }, clear() { bugs = []; flying = []; },
    add(type, x, y) { const b = spawn(type, Math.atan2(y - cy, x - cx), 0); b.x = x; b.y = y; if (type === "wasp") { b.st = "orbit"; b.t = 0; } return bugs.length; },
    thief(x, y) { const b = spawn("ant", Math.atan2(y - cy, x - cx), 0); b.x = x; b.y = y; grab(b); return slices(); },
  });
  Lab.loop(frame);
}

/* ---------- flicking ---------- */
function canFlick(b) { return b.st !== "air" && b.st !== "gone" && b.st !== "flee" && b.cd <= 0; }

function flick(b, dx, dy, speed) {

}
function flipBeetle(b, dx, dy) { b.st = "flip"; b.t = 2.8; b.vx = dx * 150 * S; b.vy = dy * 150 * S; b.cd = .25; if (b.carry) rescue(b); snd("flip", { pitch: .8 }); if (!demo) { fx.text(b.x, b.y - 22 * S, "flipped!", { color: "#1f7f72", size: 14 * S, outline: "#fff" }); if (!told.beetle) { told.beetle = 1; tip("Beetle on its back — flick it again!"); } } }

  b.ang = a; if (best < 0) { b.st = "steal"; return; } has[best] = false; b.carry = true; b.st = "steal"; bunSad = Math.max(bunSad, .7); snd("hurt", { vol: .5, pitch: 1.3 }); if (!demo) { Lab.shake(3, .15); if (!told.thief) { told.thief = 1; tip("Thief! Flick it to win the slice back"); } }
}

/* ---------- update ---------- */

    if (b.type === "wasp") {

      if (b.st === "in") { b.ang = Math.atan2(dy, dx); b.x += dx / d * b.sp * dt; b.y += dy / d * b.sp * dt; if (d < 130 * S) { b.st = "orbit"; b.t = 0; } }
      else if (b.st === "orbit") { const a = Math.atan2(-dy, -dx) + b.dir * 2.3 * dt, rr = lerp(d, 125 * S, .1); b.x = cx + Math.cos(a) * rr; b.y = cy + Math.sin(a) * rr; b.ang = a + b.dir * Math.PI / 2; if (b.t > 1.7) b.st = "dive"; }
