<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Football", instructions:"Swipe to kick the ball past the keeper into the goal.", restart:start});
let ball,keeper,phase,score,start0;
function start(){ball={x:Lab.W/2,y:Lab.H-80,r:14,vx:0,vy:0};keeper={x:Lab.W/2,y:240,w:90,dir:1};phase="aim";score=0;Lab.setScore(0);start0=null;
  Lab.input.onDown=[(x,y)=>{if(phase==="aim")start0={x,y};}];
  Lab.input.onUp=[(x,y)=>{if(phase!=="aim"||!start0)return;
    ball.vx=(x-start0.x)*4;ball.vy=(y-start0.y)*4;phase="shot";start0=null;}];
  Lab.loop((dt)=>{
    keeper.x+=keeper.dir*180*dt;if(keeper.x<60||keeper.x>Lab.W-60)keeper.dir*=-1;
    if(phase==="shot"){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=0.99;ball.vy*=0.99;
      if(ball.y<keeper.y+15 && ball.y>keeper.y-15 && Math.abs(ball.x-keeper.x)<keeper.w/2){
        Lab.toast("Saved!",600);Lab.beep(200,.15);phase="reset";setTimeout(start,800);return;}
      if(ball.y<200 && ball.x>Lab.W/2-120 && ball.x<Lab.W/2+120){score++;Lab.setScore(score);Lab.beep(1100,.15);Lab.toast("GOAL!",600);phase="reset";setTimeout(start,800);return;}
      if(ball.y<-40||ball.x<-40||ball.x>Lab.W+40){phase="reset";setTimeout(start,500);return;}
    }
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#1a5a25";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.fillRect(Lab.W/2-120,200,240,10);c.fillRect(Lab.W/2-120,210,10,40);c.fillRect(Lab.W/2+110,210,10,40);
  c.fillStyle="#5cf";c.fillRect(keeper.x-keeper.w/2,keeper.y-15,keeper.w,30);
  c.fillStyle="#fff";c.beginPath();c.arc(ball.x,ball.y,ball.r,0,Lab.TAU);c.fill();
  if(start0){c.strokeStyle="#fff";c.beginPath();c.moveTo(ball.x,ball.y);c.lineTo(ball.x+(Lab.input.x-start0.x),ball.y+(Lab.input.y-start0.y));c.stroke();}
}
start();
</script></body></html>
