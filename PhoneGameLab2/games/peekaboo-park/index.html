<title>Peekaboo Park</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* PEEKABOO PARK — hide-and-seek in the park at golden hour. Pip is "it".
 * Core idea kept from the shell-game prototype: something is hidden under one of several covers; pick the right one.
 * The verb is new: not tracking a shuffle but READING TELLS. While Pip counts, the pals scurry to bushes, pots,
 * barrels, reeds, crates and stumps (seen dimly through Pip's paws). Then each hider gives itself away now and then:
 * a peek over the top, a rustle, a giggle in its own voice. Tap a spot and Pip dashes over to search it.
 * Wrong spot: −2 s of daylight, and from round 4 a hider next door may get spooked and dash to a new spot.
 * Later rounds: more pals and spots, dimmer count-ins, shyer peeks, and decoys — wind gusts that rustle every bush
 * in a sweep, a bird that lands on a spot, a squirrel's tail poking out. Find everyone before dusk.
 * Identity: striped lawn in warm evening light that deepens to violet as the time runs out; found pals cheer from
 * the bench at the top. Puzzle music that tightens as daylight drains. Unlike Swindle (follow one prize through a
 * shuffle), this is an attention/deduction game with several targets, decoys and spatial search cost.            */
let demo = false;
Lab.init({
  title: "Peekaboo Park", tagline: "Ready or not! Spot the tells. Find every pal!", category: "Skill", kicker: "Pocket Pals",
  howto: ["Watch the pals scurry off to hide", "Peeks, rustles and giggles = a pal!", "Tap a spot to search. Beat dusk!"],
  theme: { bg: "#bfe39c", bg2: "#fff0c8", fg: "#2f3b2a", muted: "#56664e", accent: "#ff8a3d", accent2: "#8f76e6", light: true },
  orient: "any", music: { style: "puzzle", key: "F", vol: .34 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, shade = Lab.color.shade, INK = Pals.ink;
const CAST = ["bun", "momo", "nori", "olli", "bolt"], KINDS = ["bush", "bush", "pot", "barrel", "reeds", "crate", "stump", "bush"];
const OBJ = { bush: 1.55, pot: 1.35, barrel: 1.5, reeds: 1.65, crate: 1.3, stump: 1.05 };
let S = 1, U = 1, F = { x: 0, y: 0, w: 1, h: 1 }, R = 30, benchY = 0;
let round, C, spots, hiders, pip, phase, phaseT, timeLeft, timeMax, score, streak, bestStreak, foundAll, notes, gust, bird, squirrel, timers, tells, demoT, endT, nextWind, nextBird, nextSq, misses;

const snd = (n, o) => { if (!demo) Lab.sfx(n, o); };
const later = (t, fn) => timers.push({ t, fn });
const X = nx => F.x + nx * F.w, Y = ny => F.y + ny * F.h, dep = ny => .72 + .4 * ny;
function layout() {
  const P = Lab.play; S = Math.min(P.w / 390, P.h / 700); U = Math.max(S, .8);
  const top = 66 * U; benchY = P.y + 6 * U; F = { x: P.x + 10 * S, y: P.y + top + 30 * U, w: P.w - 20 * S, h: P.h - top - 38 * U };
  R = Math.min(F.w / 9, F.h / 6.6, 64 * U); Lab.sprite.clear("pk");
}
Lab.onResize(() => { if (spots) layout(); });

function cfg(r) {
  const n = Math.min(5, 1 + Math.ceil(r / 1.5));
  return { n, spots: Math.min(13, 5 + Math.floor(r * 1.3)), time: 21 + n * 3, tmin: Math.max(1.7, 2.6 - r * .12), tspan: 2 + r * .25, peek: Math.max(.42, 1 - r * .09),
    dim: Math.min(.86, .5 + r * .06), run: Math.max(.55, 1.15 - r * .09), wind: r >= 3, bird: r >= 4, squirrel: r >= 5, spook: r >= 4 };
}
function voice(who, k) { // each pal giggles in its own voice; k = volume scale
  if (demo) return; const v = .16 * (k || 1);
  if (who === "bun") [0, .09, .18].forEach((d, i) => Lab.audio.tone({ f: 980 + i * 90, f2: 1250 + i * 90, dur: .07, vol: v, delay: d, type: "triangle" }));
  else if (who === "momo") [0, .13].forEach(d => Lab.audio.tone({ f: 190, f2: 260, dur: .09, vol: v * 1.2, delay: d, type: "square", lp: 900 }));
  else if (who === "nori") Lab.audio.tone({ f: 1300, f2: 1800, dur: .14, vol: v, type: "sine" });
  else if (who === "olli") [0, .2].forEach(d => Lab.audio.tone({ f: 420, f2: 360, dur: .16, vol: v * 1.3, delay: d, type: "sine" }));
  else if (who === "bolt") [[880, 0], [660, .1], [990, .2]].forEach(([f, d]) => Lab.audio.tone({ f, dur: .06, vol: v * .8, delay: d, type: "square", lp: 2500 }));
  else Lab.audio.tone({ f: 700, f2: 900, dur: .12, vol: v });
}

/* ---------- rounds ---------- */
function makeSpots(n) {
  const out = [], home = [.5, 1];
  for (let tries = 0; out.length < n && tries < 1500; tries++) {
    const nx = Lab.rand(.08, .92), ny = Lab.rand(clamp(R * 1.7 / F.h, .12, .3), .9), px = X(nx), py = Y(ny), md = R * (2.25 - Math.min(1, tries / 1200) * .5);
    if (Lab.dist(px, py, X(home[0]), Y(home[1])) < R * 2.2) continue;
    if (out.some(s => Lab.dist(px, py, X(s.nx), Y(s.ny)) < md * (dep(ny) + dep(s.ny)) / 2 * 1.05)) continue;
    out.push({ nx, ny, kind: KINDS[out.length % KINDS.length], shake: 0, peek: 0, peekA: 1, tail: 0, hit: 0, empty: 0, seed: Lab.rand(0, 9) });
  }

}
function startRound(r) {
  round = r; C = cfg(r); spots = makeSpots(C.spots);
  const who = Lab.shuffle(CAST.slice()).slice(0, C.n), free = Lab.shuffle(spots.map((s, i) => i));
  hiders = who.map((w, i) => ({ who: w, spot: free[i], found: false, tellT: Lab.rand(1.2, 2.6) + i * .5, run: { t: -(.4 + i * 1.2 / C.n) / C.run, sx: Lab.rand(.4, .6), sy: .98 }, pop: -1, seat: -1, dash: null }));
  pip = { nx: .5, ny: 1, busy: false, t: 0, dur: 0, from: null, to: -1, searchT: 0, queue: null, mood: "happy", moodT: 0, sq: 0 };
  timeMax = timeLeft = C.time; phase = "count"; phaseT = 0; notes = []; gust = null; bird = null; squirrel = null; misses = 0;
  nextWind = 4; nextBird = 6; nextSq = 8;
  if (!demo) [0, .8, 1.6].forEach((d, i) => later(d, () => { snd("tick", { pitch: 1 + i * .15 }); })), later(2.4, () => { snd("whistle", { pitch: 1.3, vol: .6 }); Lab.banner("Ready or not!", { color: "#ff8a3d", ms: 900, y: .45 }); });
}
const spotXY = i => { const s = spots[i]; return [X(s.nx), Y(s.ny)]; };
function hiderAt(i) { return hiders.find(h => !h.found && h.spot === i && !h.dash); }

/* ---------- tells & decoys ---------- */
function tell(h, kind) {
  const s = spots[h.spot], r = kind === "peek" ? 0 : kind === "rustle" ? .5 : kind === "sound" ? .9 : Lab.rand(0, 1); tells++;
  if (r < .45) { s.peek = 1; s.peekA = C.peek * Lab.rand(.85, 1.1); s.peekWho = h.who; }
  else if (r < .8) { s.shake = 1; leaves(s, 5); snd("swish", { pitch: 1.3 + Lab.rand(0, .3), vol: .35 }); }
  else { voice(h.who, .9); for (let k = 0; k < 2; k++) notes.push({ x: s.nx + Lab.rand(-.02, .02), y: s.ny, t: -k * .25, who: h.who }); s.shake = Math.max(s.shake, .25); }
}
function leaves(s, n) {

  fx.burst(x, y - R * d * OBJ[s.kind] * .7, { n, colors: s.kind === "bush" ? ["#5fae4c", "#8fd06a"] : ["#a7c96a", "#d9e59b"], speed: 90, life: .6, size: 3 * S, gravity: 160, shape: "square" });
}
function decoys(dt) {

  if (gust) { const p0 = gust.t / 1.4, front = gust.dir > 0 ? p0 : 1 - p0; gust.t += dt; const p1 = gust.t / 1.4, f1 = gust.dir > 0 ? p1 : 1 - p1;
    for (const s of spots) if ((s.kind === "bush" || s.kind === "reeds") && (s.nx - front) * (s.nx - f1) <= 0) { s.shake = Math.max(s.shake, .8); leaves(s, 3); }
    if (gust.t > 1.4) gust = null; }
  if (C.bird) { nextBird -= dt; if (nextBird <= 0 && !bird) { const i = Lab.randInt(0, spots.length - 1); bird = { i, t: 0, side: Lab.chance(.5) ? 1 : -1 }; nextBird = Lab.rand(6, 10); } }
  if (bird) { bird.t += dt; if (!bird.land && bird.t > .7) { bird.land = true; spots[bird.i].shake = .7; snd("tick", { pitch: 2.2, vol: .4 }); } if (bird.t > 2.6) bird = null; }
  if (C.squirrel) { nextSq -= dt; if (nextSq <= 0 && !squirrel) { const emp = spots.map((s, i) => i).filter(i => !hiderAt(i)); if (emp.length) { squirrel = { i: Lab.choose(emp), t: 0 }; spots[squirrel.i].shake = .4; } nextSq = Lab.rand(7, 11); } }

}

/* ---------- searching ---------- */
function pick(x, y) {

  spots.forEach((s, i) => { const [sx, sy] = spotXY(i), d = dep(s.ny), cy = sy - R * d * OBJ[s.kind] * .5, dd = Math.hypot((x - sx) / (R * d * 1.25), (y - cy) / (R * d * OBJ[s.kind] * .8)); if (dd < 1 && dd < bd) { bd = dd; best = i; } });

}
function tapAt(x, y) { if (phase !== "play") return; const i = pick(x, y); if (i < 0) return; spots[i].hit = 1; if (pip.busy) { pip.queue = i; return; } go(i); }
function go(i) {

}
function resolve(i) {

    timeLeft = Math.max(0, timeLeft - 2); streak = 0; misses++; s.empty = 1; pip.mood = "angry"; pip.moodT = .7;
    snd("error", { pitch: 1.3, vol: .45 });
    if (!demo) { const [x, y] = spotXY(i); fx.text(x, y - R * dep(s.ny) * 2, squirrel && squirrel.i === i ? "Just a squirrel!" : bird && bird.i === i ? "Just a bird!" : "Nobody!  −2s", { color: "#7a5a3a", size: 15 * U, life: .9 }); }
    if (C.spook) { const [x, y] = spotXY(i), near = hiders.filter(z => !z.found && !z.dash && Lab.dist(x, y, ...spotXY(z.spot)) < R * 4.2);

  }

}
function found(h) {

  const gain = 100 + 20 * (round - 1) + 25 * Math.min(streak - 1, 6) + Math.round(40 * timeLeft / timeMax);
  score += gain; spots[h.spot].shake = 1; pip.mood = "joy"; pip.moodT = .9; pip.sq = -.2;
  const [x, y] = spotXY(h.spot);
  if (!demo) { Lab.setScore(score); Lab.bumpScore(); Lab.audio.combo(streak + 2, { vol: .22 }); voice(h.who, 1.3); Lab.buzz(20);
    fx.burst(x, y - R * 1.6, { n: 16, colors: [Pals.cast[h.who].body, "#fff", "#ffd166"], speed: 220, life: .6, size: 3.5 * S, gravity: 300, shape: "star" });
    fx.text(x, y - R * dep(spots[h.spot].ny) * 2.6, "Found " + Pals.cast[h.who].name + "!" + (streak > 1 ? " ×" + streak : ""), { color: "#ff8a3d", size: 17 * U, life: 1 }); }
  h.seat = hiders.filter(z => z.found).length - 1;
  if (hiders.every(z => z.found)) {
    phase = "clear"; phaseT = 0; const bonus = Math.ceil(timeLeft) * 10; score += bonus;
    if (!demo) { Lab.setScore(score); snd("levelup"); Lab.banner("Everyone found!", { color: "#2f9e5b", ms: 1200, y: .4 }); if (bonus) later(.5, () => Lab.toast("Daylight bonus +" + bonus, 1200, { y: .3 })); }

}
function endRun() {

    if (demo) { startRound(1); return; }
    Lab.gameover({ title: "Oops!", message: "Dusk fell — the hiders win this time.", score, stats: [["Rounds cleared", round - 1], ["Pals found", foundAll], ["Best streak", bestStreak]] });

/* ---------- loop ---------- */
function update(dt) {
  for (const tm of timers.slice()) { tm.t -= dt; if (tm.t <= 0) { const i = timers.indexOf(tm); if (i >= 0) timers.splice(i, 1); tm.fn(); } }
  phaseT += dt;
  if (phase === "count") { for (const h of hiders) h.run.t += dt / C.run; if (phaseT >= 2.6 && hiders.every(h => h.run.t >= 1)) { phase = "play"; phaseT = 0; } }
  if (phase === "play") {
    timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; endRun(); }
    for (const h of hiders) if (!h.found && !h.dash) { h.tellT -= dt; if (h.tellT <= 0) { tell(h); h.tellT = C.tmin + Lab.rand(0, C.tspan); } }
    decoys(dt);

    else { pip.searchT += dt; spots[pip.to].shake = Math.max(spots[pip.to].shake, .5); if (pip.searchT >= .26) resolve(pip.to); }

function demoTick(dt) {

  const left = hiders.filter(h => !h.found && !h.dash); if (!left.length) return; const i = Lab.chance(.75) ? Lab.choose(left).spot : Lab.randInt(0, spots.length - 1); go(i);

function frame(dt, t) { update(dt); render(t); }
function resetRun() { layout(); timers = []; score = 0; streak = 0; bestStreak = 0; foundAll = 0; tells = 0; demoT = 2; startRound(1); }

    get hiders() { return hiders.map(h => ({ who: h.who, spot: h.spot, found: h.found, moving: !!h.dash })); }, get pipBusy() { return pip.busy; }, get nSpots() { return spots.length; },
    spot(i) { const [x, y] = spotXY(i), s = spots[i]; return [x, y - R * dep(s.ny) * OBJ[s.kind] * .45]; }, setTime(v) { timeLeft = v; }, setRound(r) { timers = []; startRound(r); }, forceTell(k) { const h = hiders.find(z => !z.found); if (h) tell(h, k); },
  });
  Lab.loop(frame);
}

/* ---------- drawing ---------- */
function lawn() {
  return Lab.sprite("pklawn", Lab.W + 80, Lab.H + 80, g => {
    g.translate(40, 40); const W = Lab.W, H = Lab.H, P = Lab.play;
    draw.vgrad(g, -40, -40, W + 80, H + 80, ["#9fd47e", "#8cc86c"]);
    const st = 46 * S; for (let i = -2; i * st < W + 80; i++) { g.fillStyle = i % 2 ? "rgba(255,255,255,.07)" : "rgba(0,60,0,.04)"; g.beginPath(); g.moveTo(i * st, -40); g.lineTo(i * st + st, -40); g.lineTo(i * st + st * 1.6, H + 40); g.lineTo(i * st + st * .6, H + 40); g.closePath(); g.fill(); }

    g.fillStyle = "rgba(255,255,255,.12)"; for (let x = -30; x < W + 60; x += 22 * S) { g.beginPath(); g.arc(x - 4 * S, hy - 5 * S, 5 * S, 0, TAU); g.fill(); }
    // stepping-stone path to Pip's base and a few flowers
    const rnd = Lab.rng(11); for (let k = 0; k < 6; k++) { const t = k / 5, x = X(.5) + Math.sin(t * 5) * F.w * .08, y = lerp(Y(1.02), Y(.55), t); draw.circle(g, x, y, (12 - k) * S, "rgba(230,220,190,.55)"); }
    for (let i = 0; i < 40; i++) { const x = F.x + rnd() * F.w, y = F.y + rnd() * F.h, c = ["#ffd1e0", "#fff6b0", "#ffffff", "#d7c6ff"][i % 4]; for (let p = 0; p < 4; p++) draw.circle(g, x + Math.cos(p * 1.57) * 2.5 * S, y + Math.sin(p * 1.57) * 2.5 * S, 2 * S, c); draw.circle(g, x, y, 1.6 * S, "#ffb52e"); }

    for (const fx2 of [.06, .94]) draw.rect(g, P.x + P.w * fx2 - 4 * U, benchY + 34 * U, 8 * U, 14 * U, 2, "#9c6236");

}
function objSprite(kind, d) {

    g.translate(r * 1.5, h + r * .3); const sh = (x, y, w, hh) => { g.fillStyle = "rgba(30,50,20,.22)"; g.beginPath(); g.ellipse(x, y, w, hh, 0, 0, TAU); g.fill(); };
    if (kind === "bush") { sh(0, 0, r * 1.15, r * .25); [[-.55, -.5, .62], [.55, -.5, .62], [0, -.85, .72], [-.2, -.35, .6], [.3, -.3, .58]].forEach(([x, y, s]) => draw.circle(g, x * r, y * r * OBJ.bush / 1.2, s * r, "#4fa344", "#3a7f33", 1.5)); [[-.3, -1.05], [.35, -.8], [-.6, -.6]].forEach(([x, y]) => draw.circle(g, x * r, y * r, r * .12, "rgba(255,255,255,.25)")); [[.5, -.6], [-.1, -1.1], [-.7, -.35]].forEach(([x, y]) => draw.circle(g, x * r, y * r, r * .08, "#ff6f91")); }
