<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Monkey Catch", instructions:"Drag basket. Catch bananas, dodge bombs.", restart:start});
let basket,items,t,score,lives;
function start(){basket={x:Lab.W/2,w:90};items=[];t=0;score=0;lives=3;Lab.setScore(0);
  Lab.input.onMove=[(x)=>{if(Lab.input.down)basket.x=Lab.clamp(x,basket.w/2,Lab.W-basket.w/2);}];
  Lab.loop((dt)=>{t+=dt;
    if(Math.random()<dt*1.5)items.push({x:Lab.rand(20,Lab.W-20),y:-20,vy:Lab.rand(180,260),bomb:Math.random()<0.15});
    for(const i of items){i.y+=i.vy*dt;
      if(i.y>Lab.H-60&&Math.abs(i.x-basket.x)<basket.w/2){i.dead=true;
        if(i.bomb){lives--;Lab.beep(150,.2);if(lives<=0){Lab.gameover({title:"Boom!",message:"Score: "+score});return;}}
        else{score++;Lab.setScore(score);Lab.beep(900,.05);}}}
    items=items.filter(i=>!i.dead && i.y<Lab.H+30);
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#2a4a2a";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Lives: "+lives,12,Lab.H-12);
  for(const i of items){c.fillStyle=i.bomb?"#222":"#fc5";c.beginPath();c.arc(i.x,i.y,14,0,Lab.TAU);c.fill();
    if(i.bomb){c.fillStyle="#f55";c.beginPath();c.arc(i.x,i.y-12,3,0,Lab.TAU);c.fill();}}
  c.fillStyle="#7a4f2c";c.fillRect(basket.x-basket.w/2,Lab.H-60,basket.w,40);
}
start();
</script></body></html>
