<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cats & Cans", instructions:"Watch the cans shuffle. Tap the one hiding the cat.", restart:start});
let cans,catIdx,phase,shuffles,phaseT,sw,score;
function start(){
  cans=[{x:Lab.W*0.25,y:Lab.H/2},{x:Lab.W*0.5,y:Lab.H/2},{x:Lab.W*0.75,y:Lab.H/2}];
  catIdx=Lab.randInt(0,2);phase="reveal";phaseT=1.2;shuffles=3+score;sw=null;score=score||0;Lab.setScore(score);
  Lab.input.onTap=[(x,y)=>{if(phase!=="guess")return;
    let best=-1,d=999;for(let i=0;i<3;i++){const dd=Lab.dist(x,y,cans[i].x,cans[i].y);if(dd<d){d=dd;best=i;}}
    if(d<60){if(best===catIdx){score++;Lab.setScore(score);Lab.beep(1000,.15);Lab.toast("Right!",600);}else{Lab.toast("Wrong",600);Lab.beep(200,.2);}
      setTimeout(start,800);}
  }];
  Lab.loop((dt)=>{
    phaseT-=dt;
    if(phase==="reveal"&&phaseT<=0){phase="shuffle";nextSwap();}
    if(phase==="shuffle"){
      if(!sw && shuffles>0){nextSwap();}
      else if(!sw){phase="guess";}
      else{sw.t+=dt*3;const k=Lab.clamp(sw.t,0,1);
        const a=cans[sw.i],b=cans[sw.j];
        const ax=Lab.lerp(sw.ax,sw.bx,k),bx=Lab.lerp(sw.bx,sw.ax,k);
        const ay=Lab.lerp(sw.ay,sw.by-40,k),by=Lab.lerp(sw.by,sw.ay-40,k);
        a.x=ax;a.y=k<.5?ay:Lab.lerp(sw.by-40,sw.by,(k-.5)*2);
        b.x=bx;b.y=k<.5?by:Lab.lerp(sw.ay-40,sw.ay,(k-.5)*2);
        if(k>=1){[cans[sw.i],cans[sw.j]]=[cans[sw.j],cans[sw.i]];
          if(catIdx===sw.i)catIdx=sw.j;else if(catIdx===sw.j)catIdx=sw.i;
          sw=null;shuffles--;}
      }
    }
    draw();
  });
}
function nextSwap(){if(shuffles<=0)return;let i=Lab.randInt(0,2),j=Lab.randInt(0,2);while(j===i)j=Lab.randInt(0,2);
  sw={i,j,ax:cans[i].x,ay:cans[i].y,bx:cans[j].x,by:cans[j].y,t:0};}
function draw(){const c=Lab.ctx;c.fillStyle="#2a1c0a";c.fillRect(0,0,Lab.W,Lab.H);
  for(let i=0;i<3;i++){const k=cans[i];
    if(phase==="reveal" && i===catIdx){c.fillStyle="#fea";c.beginPath();c.arc(k.x,k.y+10,28,0,Lab.TAU);c.fill();
      c.fillStyle="#000";c.fillRect(k.x-8,k.y+4,4,4);c.fillRect(k.x+4,k.y+4,4,4);}
    c.fillStyle="#c95";c.beginPath();c.moveTo(k.x-40,k.y+50);c.lineTo(k.x+40,k.y+50);c.lineTo(k.x+30,k.y-30);c.lineTo(k.x-30,k.y-30);c.closePath();c.fill();}
  c.fillStyle="#fff";c.font="16px sans-serif";c.textAlign="center";c.fillText({reveal:"Watch...",shuffle:"Shuffling",guess:"Tap the cat!"}[phase],Lab.W/2,140);
}
start();
</script></body></html>
