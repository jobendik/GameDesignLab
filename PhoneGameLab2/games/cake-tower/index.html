<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cake Tower", instructions:"Tap to drop a swinging layer. Stack as high as you can.", restart:start});
let layers,active,score,phase;
function start(){
  layers=[{x:Lab.W/2-80,y:Lab.H-60,w:160,h:30}];
  newSwing();score=0;Lab.setScore(0);
  Lab.input.onTap=[()=>{if(phase==="swing")phase="drop";}];
  Lab.loop((dt)=>{
    if(phase==="swing"){active.t+=dt;active.x=Lab.W/2-active.w/2+Math.sin(active.t*2)*(Lab.W/2-active.w/2-20);}
    if(phase==="drop"){active.y+=600*dt;const top=layers[layers.length-1];
      if(active.y+active.h>=top.y){active.y=top.y-active.h;
        const left=Math.max(active.x,top.x), right=Math.min(active.x+active.w,top.x+top.w);
        const overlap=right-left;
        if(overlap<=0){Lab.gameover({title:"Toppled!",message:"Layers: "+score});return;}
        active.x=left;active.w=overlap;layers.push(active);score++;Lab.setScore(score);
        Lab.beep(600,.05);
        // scroll down
        if(layers.length>8){const dy=Math.max(0,layers[0].y - (Lab.H-60));for(const l of layers)l.y-=30;}
        newSwing();}
    }
    draw();
  });
}
function newSwing(){const top=layers[layers.length-1];active={x:0,y:160,w:top.w,h:30,t:0,c:`hsl(${score*40},70%,60%)`};phase="swing";}
function draw(){const c=Lab.ctx;c.fillStyle="#1a1230";c.fillRect(0,0,Lab.W,Lab.H);
  for(const l of layers){c.fillStyle=l.c||"#f8c";c.fillRect(l.x,l.y,l.w,l.h);}
  c.fillStyle=active.c;c.fillRect(active.x,active.y,active.w,active.h);
}
start();
</script></body></html>
