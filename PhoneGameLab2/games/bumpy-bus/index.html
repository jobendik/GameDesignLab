<title>Bumpy Bus</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script><script src="../../shared/pals.js"></script>
</head><body><script>
(function(){ "use strict";
/* BUMPY BUS — Pip drives the little camp bus down a hilly country road, and the passengers ride on the ROOF RACK.
 * Side view, one thumb: HOLD to drive, LET GO to brake. Stop at each bus stop to pick up a pal (stop on the sign for a
 * Perfect Stop), then stop at the campsite to drop everyone off before the sun goes down.
 * Core idea kept: drive down the road and deal with what's on it. The verb is new (siblings Sundown Sprint and Paper
 * Rapids steer/dodge from above): here you only control SPEED, and speed is a trade-off —
 *  - bumps and crests launch the bus at speed; a hard landing bounces the riders into the air;
 *  - braking while a rider is in the air leaves them flying forward off the roof (lost!) — ease off, don't stamp;
 *  - too slow and the daylight runs out; every campsite buys more daylight;
 *  - creeks with broken bridges need speed off the ramp (fall short = splash, back up and lose 4 s).
 * Stages add potholes, tall bumps, crests and creeks; the sky goes from morning to starry night.
 * Physics: fixed 1/120 s step; the bus follows the ground until the ground drops away faster than gravity, then it

let demo = false;
Lab.init({
  title: "Bumpy Bus", tagline: "Pick up your pals. Don't bounce them off the roof!", category: "Arcade", kicker: "Pocket Pals",
  howto: ["Hold to drive, let go to brake", "Stop at the signs to pick pals up", "Never brake while someone's in the air!"],
  theme: { bg: "#bfe6ff", bg2: "#fff2d0", fg: "#2d3a55", muted: "#5d6b88", accent: "#ff8a3d", accent2: "#3aa0d8", light: true },
  orient: "any", music: { style: "bounce", key: "D", bpm: 118, vol: .36 }, restart: start,
  attract(dt, t) { if (!pts) { demo = true; setup(); } tick(dt); render(t); },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp, INK = Pals.ink;
const STEP = 8, G = 1100, ACC = 300, BRAKE = 620, VMAX = 430, HB = 1 / 120, ROOF = 56, SEATS = [-36, -12, 12, 36];

const RIDERS = ["momo", "nori", "olli", "bolt"];
let stopSeq = 0;
const SKIES = [["#bfe6ff", "#fff2d0"], ["#9ed8ff", "#e9f8ff"], ["#ffc48a", "#ffe6b0"], ["#e58fb0", "#ffc89a"], ["#2c3266", "#6b5a9a"]];
let W, H, S, Z, land, P, pts, px0, genX, baseY, queue, decor, stops, stations, bus, riders, lost, stage, day, score, camX, camY, acc, gas, braking,
  delivered, lostN, perfect, airT, bestAir, eng, squeal, toastT, splashT, stageX0, planned;

/* ---------- layout ---------- */
function layout() {
  W = Lab.W; H = Lab.H; P = Lab.play; land = W > H * 1.1;
  S = land ? clamp(Math.min(W / 844, H / 390), .7, 1.6) : clamp(Math.min(W / 390, H / 800), .7, 1.6);
  Z = land ? clamp(H / 420, .7, 1.6) : clamp(W / 430, .7, 1.4);
  Lab.sprite.clear("bb-");
}
Lab.onResize(layout);
const vw = () => W / Z;
const sx = x => (x - camX) * Z, sy = y => (y - camY) * Z;

/* ---------- terrain ---------- */
function rnd(a, b) { return a + Math.random() * (b - a); }
function plan(n) {
  const L = [{ t: "flat", len: 240 }], stopsN = n === 1 ? 2 : 3;
  const feat = () => {
    const pool = ["hill", "flat", "bump", "hill", "bump"]; if (n >= 2) pool.push("pot", "slope", "bump2"); if (n >= 3) pool.push("crest", "crest", "bumps"); if (n >= 4) pool.push("creek", "creek");
    const t = Lab.choose(pool);
    if (t === "hill") return { t: "hill", len: rnd(300, 520), a: rnd(30, 60 + n * 6) };
    if (t === "flat") return { t: "flat", len: rnd(90, 220) };
    if (t === "bump") return { t: "hill", len: rnd(60, 80), a: rnd(16, 24) };
    if (t === "bump2") return { t: "hill", len: rnd(66, 84), a: rnd(26, 34) };
    if (t === "bumps") return { t: "bumps", len: 200, a: rnd(16, 22) };
    if (t === "pot") return { t: "hill", len: 44, a: -14 };
    if (t === "slope") return { t: "slope", len: rnd(260, 380), a: Lab.choose([-1, 1]) * rnd(40, 80) };
    if (t === "crest") return { t: "hill", len: rnd(320, 420), a: rnd(80, 120) };
    return { t: "creek", len: 340, gap: rnd(110, 160 + n * 8) };
  };
  for (let s = 0; s < stopsN; s++) { for (let i = 0; i < 3 + Math.min(4, n); i++) L.push(feat()); L.push({ t: "flat", len: 140 }, { t: "stop", len: 180 }, { t: "flat", len: 80 }); }
  for (let i = 0; i < 3; i++) L.push(feat());
  L.push({ t: "flat", len: 160 }, { t: "station", len: 320, n }, { t: "flat", len: 160 });
  return L;
}
function extend(toX) {
  while (genX < toX) {
    if (!queue.length) { planned++; queue = plan(planned); }
    const p = queue.shift(), x0 = genX, b0 = baseY, n = Math.ceil(p.len / STEP);
    if (p.t === "stop") { const id = RIDERS[stopSeq++ % RIDERS.length]; stops.push({ x: x0 + p.len / 2, pal: id, st: "wait", stage: planned, react: 0 }); decor.push({ k: "warn", x: x0 + p.len / 2 - 420 }); }
    if (p.t === "station") stations.push({ x: x0 + p.len / 2, stage: p.n, done: false });
    for (let i = 1; i <= n; i++) {
      const u = i / n, x = x0 + i * STEP; let y = b0;
      if (p.t === "hill") y = b0 - p.a * (1 - Math.cos(u * TAU)) / 2;
      else if (p.t === "bumps") y = b0 - p.a * (1 - Math.cos(u * TAU * 3)) / 2;
      else if (p.t === "slope") { y = b0 - p.a * (u * u * (3 - 2 * u)); baseY = y; }
      else if (p.t === "creek") {
        const ramp = 90, gx = (x - x0);
        if (gx < ramp) y = b0 - 30 * Math.sin(gx / ramp * Math.PI / 2);
        else if (gx < ramp + p.gap) { y = null; }
        else y = b0;
        if (gx >= ramp && gx < ramp + STEP) decor.push({ k: "creek", x: x0 + ramp, w: p.gap, y: b0 });

    }

    if (p.t !== "slope") baseY = b0;
    if (p.t === "flat" || p.t === "hill") for (let d = x0 + rnd(20, 90); d < genX - 20; d += rnd(90, 240)) decor.push({ k: Lab.choose(["tree", "tree", "bush", "flowers", "fence"]), x: d, s: rnd(.8, 1.25) });

}
function ground(x) {

/* ---------- setup ---------- */
function setup() {

  pts.push(0); camX = 0; extend(2400); while (!stations.length) extend(genX + 400);
  bus = { x: 160, y: 0, vx: 0, vy: 0, air: false, ang: 0, sq: 0, wheel: 0, airT: 0, splash: 0, horn: 0 };
  bus.y = ground(bus.x); camY = bus.y - H * (land ? .64 : .58) / Z; camX = bus.x - vw() * .28;
  riders = [mkRider("bun", SEATS[1])]; lost = []; stage = 1; day = 55; score = 0; acc = 0; gas = false; braking = 0;
  delivered = 0; lostN = 0; perfect = 0; airT = 0; bestAir = 0; toastT = 0; splashT = 0; stageX0 = 0; campers = []; lostAtStage = 0; forceGas = null; stopSeq = 0;
}
function mkRider(id, off) { return { id, off, st: "seat", x: 0, y: 0, vx: 0, vy: 0, sq: 0, mood: 0, hop: 0, ph: Math.random() * 6 }; }
function start() {
  demo = false; setup(); Lab.setScore(0);
  eng = Lab.audio.loop({ type: "sawtooth", f: 60, lp: 500, vol: 0 }); squeal = Lab.audio.loop({ noise: true, bp: 2600, q: 6, vol: 0 });
  Lab.input.onKey = [() => { }];
  Lab.expose({
    get score() { return score; }, get stage() { return stage; }, get day() { return day; }, get delivered() { return delivered; }, get lostN() { return lostN; },
    get bus() { return { x: bus.x, vx: bus.vx, vy: bus.vy, air: bus.air }; }, riders: () => riders.map(r => ({ id: r.id, st: r.st, off: r.off })),
    stops: () => stops.map(s => ({ x: s.x, st: s.st, pal: s.pal })), stations: () => stations.map(s => ({ x: s.x, done: s.done })),
    gas(on) { forceGas = on; }, place(x, v) { extend(x + 2400); bus.x = x; bus.vx = v || 0; bus.vy = 0; bus.air = false; bus.y = ground(x); for (const r of riders) if (r.st !== "seat") r.st = "seat"; camX = bus.x - vw() * .28; },
    launch(i, vy) { const r = riders[i]; const p = seatXY(r); r.st = "air"; r.x = p.x; r.y = p.y; r.vx = bus.vx; r.vy = vy; },
    setDay(v) { day = v; }, ground, get gasOn() { return gasOn(); },
  });
  Lab.loop((dt, t) => { tick(dt); render(t); });
}
let forceGas = null;
function gasOn() { if (forceGas != null) return forceGas; if (demo) return !(nextStop() && nextStop().x - bus.x < 30 + bus.vx * bus.vx / (2 * BRAKE) && nextStop().x - bus.x > -40); const k = Lab.input.keys; return Lab.input.down || !!(k[" "] || k.ArrowRight || k.ArrowUp || k.d || k.w); }
function nextStop() { const s = stops.find(s => s.st === "wait" && s.x > bus.x - 50); const st = stations.find(s => !s.done); return s && (!st || s.x < st.x) ? s : st; }

/* ---------- physics ---------- */
function seatXY(r) { const c = Math.cos(bus.ang), s = Math.sin(bus.ang), lx = r.off, ly = -70; return { x: bus.x + lx * c - ly * s, y: bus.y + lx * s + ly * c }; }

function baseAt(x) { let y = ground(x); for (let d = 40; y > 5e4 && d < 400; d += 40) y = Math.min(ground(x - d), ground(x + d)); return y > 5e4 ? bus.y : y; }

/* ---------- tick ---------- */
function tick(dt) {

  if (!demo) { Lab.setScore(score); Lab.bumpScore(); Lab.sfx("levelup"); Lab.banner("Campsite " + s.stage + "!  +" + bonus, { color: "#ff8a3d", ms: 1500, y: .3 }); Lab.after(1.1, () => Lab.toast(stage === 2 ? "Watch out: potholes and big bumps" : stage === 3 ? "Hills with crests — fly smooth!" : stage === 4 ? "Creeks! Take the ramp fast" : "Stage " + stage + " — the days are getting shorter", 1800, { y: .38 })); for (let i = 0; i < 24; i++) fx.burst(sx(s.x) + rnd(-60, 60), sy(ground(s.x)) - 60 * Z, { n: 1, colors: ["#ff8a3d", "#ffd23f", "#5fd39a", "#3ec5ff"], speed: 260, life: .9, size: 5, gravity: 400 }); }

let lostAtStage = 0, campers = [];
function over() {

}
function snd(n, o) { if (!demo) Lab.sfx(n, o); }

/* ---------- drawing ---------- */
function skyCols() { const k = Math.min(SKIES.length - 1, stage - 1), dk = clamp(1 - day / 14, 0, 1) * .55; return SKIES[k].map(c => Lab.color.mix(c, "#2c3266", dk)); }

function drawTree(c, x, y, s, k) {

  else if (k === "fence") { for (let i = 0; i < 3; i++) draw.rect(c, x + i * 16 * s, y - 20 * s, 4 * s, 20 * s, 1, "#c9a07a"); draw.rect(c, x - 2 * s, y - 16 * s, 40 * s, 3 * s, 1, "#c9a07a"); draw.rect(c, x - 2 * s, y - 9 * s, 40 * s, 3 * s, 1, "#c9a07a"); }
}
function drawBus(c, t) {
