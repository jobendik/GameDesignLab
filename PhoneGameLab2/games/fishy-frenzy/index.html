<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Fishy Frenzy", instructions:"Drag to swim. Eat smaller fish, flee bigger ones.", restart:start});
let me,fish;
function start(){me={x:Lab.W/2,y:Lab.H/2,r:18};fish=[];for(let i=0;i<14;i++)spawn();Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{if(Lab.input.down){me.x=x;me.y=Lab.clamp(y,80,Lab.H-40);}}];
  Lab.loop((dt)=>{
    for(const f of fish){f.x+=f.vx*dt;if(f.x<-50)f.x=Lab.W+50;if(f.x>Lab.W+50)f.x=-50;}
    for(let i=fish.length-1;i>=0;i--){const f=fish[i];if(Lab.dist(me.x,me.y,f.x,f.y)<me.r+f.r){
      if(f.r<me.r){me.r+=0.5;fish.splice(i,1);Lab.setScore(Math.floor(me.r));Lab.beep(900,.05);spawn();}
      else{Lab.gameover({title:"Eaten!",message:"Size: "+Math.floor(me.r)});return;}}}
    draw();
  });
}
function spawn(){fish.push({x:Lab.rand(0,Lab.W),y:Lab.rand(80,Lab.H-40),vx:Lab.choose([-60,60])*Lab.rand(.6,1.6),r:Lab.rand(8,32),c:`hsl(${Lab.randInt(0,360)},70%,55%)`});}
function draw(){const c=Lab.ctx;c.fillStyle="#053a55";c.fillRect(0,0,Lab.W,Lab.H);
  for(const f of fish){c.fillStyle=f.c;c.beginPath();c.ellipse(f.x,f.y,f.r,f.r*0.65,0,0,Lab.TAU);c.fill();}
  c.fillStyle="#fea";c.beginPath();c.ellipse(me.x,me.y,me.r,me.r*0.65,0,0,Lab.TAU);c.fill();
  c.fillStyle="#000";c.beginPath();c.arc(me.x+me.r*0.4,me.y-3,3,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
