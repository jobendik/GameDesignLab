<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Ice Cream Shop", instructions:"Tap the matching scoop, then the cone to serve.", restart:start});
const FLAVORS=["#f8a","#5cf","#fc5","#5f8"];
let customers,cone,t,score;
function start(){customers=[];for(let i=0;i<3;i++)customers.push({want:Lab.randInt(0,3),patience:10+Lab.rand(0,5)});
  cone=null;t=30;score=0;Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    if(y>Lab.H-130){const i=Math.floor(x/(Lab.W/4));if(i>=0&&i<4){cone={flavor:i};Lab.beep(600,.04);return;}}
    if(cone){const idx=Math.floor(x/(Lab.W/3));if(idx>=0&&idx<3&&customers[idx]){
      if(customers[idx].want===cone.flavor){score++;Lab.setScore(score);Lab.beep(1000,.08);customers[idx]={want:Lab.randInt(0,3),patience:8+Lab.rand(0,4)};}
      else{Lab.beep(200,.1);Lab.toast("Wrong flavor",500);}
      cone=null;}}}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.gameover({title:"Shift over",message:"Served: "+score});return;}
    for(const cu of customers){cu.patience-=dt;}
    for(const cu of customers)if(cu.patience<=0){Lab.gameover({title:"Customer left!",message:"Served: "+score});return;}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#a8d8e8";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="14px sans-serif";c.textAlign="left";c.fillText("Time: "+Math.ceil(t),12,Lab.H-12);
  for(let i=0;i<3;i++){const cu=customers[i],x=(i+0.5)*Lab.W/3;
    c.fillStyle="#7a4f2c";c.beginPath();c.moveTo(x-20,400);c.lineTo(x+20,400);c.lineTo(x,460);c.closePath();c.fill();
    c.fillStyle=FLAVORS[cu.want];c.beginPath();c.arc(x,395,22,0,Math.PI,true);c.fill();
    c.fillStyle="#000";c.fillText("⏱ "+Math.ceil(cu.patience)+"s",x-22,490);
  }
  c.fillStyle="#0008";c.fillRect(0,Lab.H-130,Lab.W,130);
  for(let i=0;i<4;i++){c.fillStyle=FLAVORS[i];c.fillRect(i*(Lab.W/4)+10,Lab.H-110,Lab.W/4-20,90);}
  if(cone){c.fillStyle="#fff";c.fillText("Holding: ",10,Lab.H-130-12);c.fillStyle=FLAVORS[cone.flavor];c.fillRect(80,Lab.H-130-30,30,20);}
}
start();
</script></body></html>
