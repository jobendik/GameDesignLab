<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sub Adventure", instructions:"Hold to ascend, release to dive. Avoid rocks.", restart:start});
let sub,top,bot,t,score;
function start(){sub={x:120,y:Lab.H/2,vy:0};top=[];bot=[];t=0;score=0;Lab.setScore(0);
  for(let i=0;i<40;i++){top.push(80+Math.sin(i*0.3)*30);bot.push(Lab.H-80+Math.sin(i*0.4)*30);}
  Lab.loop((dt)=>{t+=dt;score=Math.floor(t*10);Lab.setScore(score);
    sub.vy+=(Lab.input.down?-700:500)*dt;sub.y+=sub.vy*dt;
    top.shift();bot.shift();const lt=top[top.length-1],lb=bot[bot.length-1];top.push(Lab.clamp(lt+Lab.rand(-20,20),60,Lab.H/2-60));bot.push(Lab.clamp(lb+Lab.rand(-20,20),Lab.H/2+60,Lab.H-40));
    const idx=Math.floor(sub.x/20);if(idx<top.length){if(sub.y<top[idx]||sub.y>bot[idx]){Lab.gameover({title:"Crash!",message:"Score: "+score});return;}}
    draw();
  });
}
function draw(){const c=Lab.ctx;c.fillStyle="#04356f";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#022";c.beginPath();c.moveTo(0,0);for(let i=0;i<top.length;i++)c.lineTo(i*20,top[i]);c.lineTo(Lab.W,0);c.fill();
  c.beginPath();c.moveTo(0,Lab.H);for(let i=0;i<bot.length;i++)c.lineTo(i*20,bot[i]);c.lineTo(Lab.W,Lab.H);c.fill();
  c.fillStyle="#fc5";c.beginPath();c.ellipse(sub.x,sub.y,30,14,0,0,Lab.TAU);c.fill();
  c.fillStyle="#222";c.beginPath();c.arc(sub.x+8,sub.y-2,5,0,Lab.TAU);c.fill();
}
start();
</script></body></html>
