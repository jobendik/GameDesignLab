<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Tap Tap", instructions:"Tap as many times as you can in 10 seconds.", restart:start});
let count,t;
function start(){count=0;t=10;Lab.setScore(0);
  Lab.input.onTap=[()=>{count++;Lab.setScore(count);Lab.beep(800+count*5,.03);}];
  Lab.loop((dt)=>{t-=dt;if(t<=0){Lab.win("Taps: "+count);return;}draw();});
}
function draw(){const c=Lab.ctx;c.fillStyle="#102";c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff";c.font="36px sans-serif";c.textAlign="center";c.fillText("Time: "+t.toFixed(1),Lab.W/2,Lab.H/2-40);
  c.font="72px sans-serif";c.fillText(count,Lab.W/2,Lab.H/2+40);
  c.fillStyle="#3df58a";c.beginPath();c.arc(Lab.W/2,Lab.H-180,80,0,Lab.TAU);c.fill();
  c.fillStyle="#000";c.font="20px sans-serif";c.fillText("TAP!",Lab.W/2,Lab.H-176);
}
start();
</script></body></html>
