<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRINK · Edge Rush</title>
<meta name="description" content="One button, one dart, endless neon gates: hold to climb, release to dive, and shave every gap edge as close as you dare to ignite the Rush.">
<meta name="gdl:genre" content="Arcade, Action">
<meta name="gdl:controls" content="touch, mouse, keyboard">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root{--cy:#38e8ff;--mg:#ff3cac;--gd:#ffd23c;--ink:#eafcff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#04030c}
body{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;outline:none}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(234,252,255,.28);background:rgba(8,8,26,.55);color:var(--ink);font:700 17px "JetBrains Mono",monospace;cursor:pointer}
.ib.off{color:rgba(234,252,255,.35);text-decoration:line-through}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(4,3,14,.6);
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ov.on{display:flex}
.card{width:min(94vw,390px);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch;animation:rise .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{font:900 76px/0.9 "Saira Condensed",sans-serif;letter-spacing:6px;color:#f4ffff;text-shadow:-3px 0 rgba(255,40,90,.85),3px 0 rgba(40,180,255,.85),0 0 28px rgba(56,232,255,.35)}
h1 small{display:block;font:700 17px "Saira Condensed";letter-spacing:11px;color:rgba(234,252,255,.6);text-shadow:none;margin-top:8px}
h2{font:900 34px/1 "Saira Condensed";letter-spacing:3px}
.rank{font:700 17px "Saira Condensed";letter-spacing:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:5px 40px 3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--cy)}
.dim{font:500 13px "JetBrains Mono",monospace;color:rgba(234,252,255,.55)}
.btn{min-height:50px;border-radius:14px;border:2px solid var(--cy);background:rgba(56,232,255,.14);color:var(--ink);font:700 21px "Saira Condensed";letter-spacing:3px;cursor:pointer;padding:6px 12px}
.btn small{display:block;font:500 11px "JetBrains Mono",monospace;letter-spacing:1px;color:var(--gd);margin-top:1px}
.btn.sec{border:1.5px solid rgba(234,252,255,.4);background:rgba(8,8,26,.5);font-size:17px;min-height:46px}
.btn:active{transform:scale(.97)}.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:500 12px "JetBrains Mono",monospace;padding:4px 8px;border-radius:8px;background:rgba(234,252,255,.08);color:rgba(234,252,255,.8)}
.chip b{color:var(--gd);font-weight:700}.chip.new{background:rgba(255,210,60,.16);color:var(--gd)}
.how{font:500 16px/1.35 "Saira Condensed";letter-spacing:1px;color:rgba(234,252,255,.8)}.how b{color:var(--cy)}
#oScore{font:900 68px/1 "Saira Condensed";text-shadow:0 0 22px rgba(56,232,255,.55)}
.blk{display:flex;flex-direction:column;gap:10px}
@media (max-height:520px){.card{width:min(96vw,720px);flex-direction:row;align-items:center;gap:18px}.blk{flex:1;gap:7px}h1{font-size:56px}h1 small{font-size:13px;letter-spacing:8px}
  .btn{min-height:44px;font-size:18px}.btn.sec{min-height:44px;font-size:15px}#oScore{font-size:48px}h2{font-size:26px}.how{font-size:14px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Edge Rush playfield"></canvas>
<div id="top"><button class="ib" id="bMute" aria-label="Toggle sound">♪</button><button class="ib" id="bPause" aria-label="Pause">II</button></div>

<div class="ov" id="ovMenu"><div class="card">
  <div class="blk"><h1>BRINK<small>EDGE RUSH</small></h1>
    <div><div class="rank" id="mRank"></div><div class="bar"><i id="mBar"></i></div><div class="dim" id="mNext"></div></div>
    <div class="how"><b>HOLD</b> to climb · <b>RELEASE</b> to dive<br>Shave the gap edges — closer scores more</div></div>
  <div class="blk"><button class="btn" id="bDaily">DAILY RUN<small id="mSig"></small></button>
    <button class="btn sec" id="bEndless">ENDLESS</button>
    <div class="stats" id="mStats"></div><div class="dim" id="mKeys"></div></div>
</div></div>

<div class="ov" id="ovPause"><div class="card">
  <div class="blk"><h2>PAUSED</h2><div class="how"><b>HOLD</b> to climb · <b>RELEASE</b> to dive<br>Graze gap edges to chain, charge and ignite the <b>RUSH</b></div></div>
  <div class="blk"><button class="btn" id="bResume">RESUME</button>
    <div class="row"><button class="btn sec" id="bRestart">RESTART</button><button class="btn sec" id="bPMute">SOUND</button></div>
    <button class="btn sec" id="bQuit">MENU</button></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <div class="blk"><h2 id="oTitle"></h2><div id="oScore">0</div><div class="dim" id="oBest"></div><div class="dim" id="oCause"></div></div>
  <div class="blk"><div class="stats" id="oStats"></div>
    <button class="btn" id="bAgain">AGAIN<small id="oHint"></small></button>
    <div class="row"><button class="btn sec" id="bSwap"></button><button class="btn sec" id="bMenu">MENU</button></div></div>
</div></div>

<script>
"use strict";
/* BRINK · Edge Rush — one-button gate skimmer. Hold = climb, release = dive. Each gate is scored by how close you
   shave its gap edge; grazes chain, charge Surge and auto-ignite the RUSH (burn through walls at speed, x2).
   Courses are generated by distance from a seed, so the Daily run is the same for everyone. Single file, no deps. */
const Q=new URLSearchParams(location.search),AUTOSTART=Q.get('autostart')==='1',NOPAUSE=Q.get('nopause')==='1';
const SEED=Q.has('seed')?(+Q.get('seed')>>>0):null,KEY='gdl:best:games/brink-edge-rush',SAVE='gdl:brink-edge-rush:save';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
const fmt=n=>Math.floor(n).toLocaleString('en-US');
function mulberry32(a){a>>>=0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function dayStr(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let best=+store.get(KEY,0)||0;
const save=Object.assign({feats:{},day:'',dayBest:0,streak:0,streakDay:'',runs:0,mute:false},store.get(SAVE,{})||{});
if(save.day!==dayStr())save.dayBest=0;
if(save.streakDay!==dayStr()&&save.streakDay!==dayStr(-1))save.streak=0;

/* ---------- tuning ---------- */
const STEP=1/120,CLIMB=1.2,TH=0.06,VIS_R=0.014,HIT_R=0.005,GB=0.075,RUSH_T=3.6,LOOK=1.7,SHIELD_AT=12;
const TIERS=[
  {name:'SAFE',min:0,pts:18,surge:.03,mult:.05,parts:4,shake:.1,col:'c',pitch:0},
  {name:'CLOSE',min:.3,pts:42,surge:.06,mult:.1,parts:7,shake:.2,col:'c',pitch:3},
  {name:'GREAT',min:.55,pts:80,surge:.09,mult:.16,parts:11,shake:.32,col:'m',pitch:5},
  {name:'PERFECT',min:.78,pts:140,surge:.13,mult:.24,parts:16,shake:.5,col:'m',pitch:8},
  {name:'INSANE',min:.92,pts:230,surge:.17,mult:.34,parts:24,shake:.7,col:'g',pitch:12}];
const tierIdx=c=>{let i=0;for(let k=0;k<TIERS.length;k++)if(c>=TIERS[k].min)i=k;return i;};
const RANKS=[{min:0,name:'DRIFTER',hue:190},{min:1500,name:'RUNNER',hue:165},{min:5000,name:'EDGE RIDER',hue:300},{min:12000,name:'SURGE PILOT',hue:330},
  {min:24000,name:'RUSH ADDICT',hue:45},{min:45000,name:'NEON GHOST',hue:140},{min:80000,name:'RAZOR SAINT',hue:275},{min:140000,name:'EVENT HORIZON',hue:20}];
const rankFor=s=>{let r=RANKS[0];for(const k of RANKS)if(s>=k.min)r=k;return r;},nextRank=s=>RANKS.find(k=>k.min>s)||null;
const SIGS=[{name:'STAIRWAY STORM',bias:'stair'},{name:'NEEDLE GATES',bias:'narrow'},{name:'GOLD RUSH',bias:'double'},{name:'ZIGZAG RUSH',bias:'zigzag'},
  {name:'TUNNEL DIVE',bias:'tunnel'},{name:'SWAY CHAMBER',bias:'slider'},{name:'SHUTTER WALLS',bias:'shutter'},{name:'BURST FIRE',bias:'burst'}];
const FEATS=[
  {id:'perfect',name:'RAZOR · a PERFECT graze',ok:g=>g.topTier>=3},{id:'insane',name:'HAIRLINE · an INSANE graze',ok:g=>g.topTier>=4},
  {id:'chain15',name:'LINKED · 15 chain',ok:g=>g.bestChain>=15},{id:'chain40',name:'UNBROKEN · 40 chain',ok:g=>g.bestChain>=40},
  {id:'rush3',name:'AFTERBURNER · 3 Rushes in a run',ok:g=>g.rushes>=3},{id:'gold3',name:'GOLD DIGGER · 3 jackpot gaps in a run',ok:g=>g.jackpots>=3},
  {id:'t60',name:'DEEP RUN · survive 60 s',ok:g=>g.t>=60},{id:'s10k',name:'FIVE FIGURES · score 10,000',ok:g=>g.score>=10000}];
const LEN={intro:3,single:4,stair:6,zigzag:6,double:3,tunnel:7,slider:4,shutter:3,narrow:4,burst:5,breather:1};

/* ---------- audio: procedural synth + a sequencer that builds with Surge ---------- */
const AU=(()=>{let ac=null,out=null,nb=null,muted=Q.has('mute')?Q.get('mute')==='1':!!save.mute,timer=null,step=0,next=0,eng=null,engG=null;
  function unlock(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ac=new AC();}catch(e){return;}
      out=ac.createGain();out.gain.value=muted?0:.8;const cp=ac.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=6;out.connect(cp);cp.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      eng=ac.createOscillator();eng.type='sawtooth';eng.frequency.value=70;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;engG=ac.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(out);eng.start();}
    if(ac.state==='suspended')ac.resume();}
  const live=()=>ac&&!muted&&ac.state==='running'&&!manual;
  function tone(f,d,v,type,f2,at,lp){if(!live())return;const t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;fl.Q.value=4;o.connect(fl);fl.connect(g);}else o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03);}
  function noise(d,v,f,type,f2,at,q){if(!live())return;const t=ac.currentTime+(at||0),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type||'bandpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(out);s.start(t);s.stop(t+d+.02);}
  const PENT=[0,3,5,7,10],BASS=[55,55,55,82.41,55,55,73.42,55],ARP=[0,3,5,7,5,3,7,10,7,5,3,5,7,10,12,10],LEAD=[12,12,19,16,12,15,19,24,19,16,15,12,19,24,16,12];
  function sched(){if(!live()||scene!=='play'||paused||!G){next=0;return;}const now=ac.currentTime;if(next<now)next=now+.05;
    const bpm=132+P()*16+(G.rush>0?10:0),spb=60/bpm/4,it=clamp(Math.max(G.surge,P()*.55),0,1);
    while(next<now+.12){const s=step%16,at=next-now;if(s%4===0)tone(150,.3,.8,'sine',45,at);
      if(s%2===0)tone(BASS[(s/2)%8],.16,.36+.06*it,'sawtooth',0,at,520);
      if(it>.18&&s%2===1)noise(.045,.05+.06*it,8000,'highpass',0,at);if(it>.6&&s%4===2)noise(.04,.05,9000,'highpass',0,at);
      if(it>.3)tone(220*Math.pow(2,ARP[s]/12),.12,.03+.1*clamp((it-.3)/.5,0,1),'square',0,at,2400);
      if(G.rush>0)tone(220*Math.pow(2,LEAD[s]/12),.16,.09,'sawtooth',0,at,2800);next+=spb;step++;}}
  return{unlock,get muted(){return muted;},get ctx(){return ac;},
    setMuted(m){muted=m;if(out)out.gain.value=m?0:.8;if(!Q.has('mute')){save.mute=m;store.set(SAVE,save);}},
    start(){if(!timer){timer=setInterval(sched,25);step=0;next=0;}},
    engine(on,hold,v){if(!engG||!ac)return;const t=ac.currentTime;engG.gain.setTargetAtTime(on&&!muted&&!manual?.035:0,t,.05);eng.frequency.setTargetAtTime(58+v*26+(hold?34:0),t,.04);},
    graze(chain,pitch,ti){const semi=PENT[chain%5]+12*Math.min(2,Math.floor(chain/5))+pitch,f=330*Math.pow(2,semi/12);tone(f,.15,.13+ti*.015,'triangle');tone(f*2,.09,.05,'sine');
      if(ti>=3){noise(.14,.14+ti*.02,1800,'bandpass',7000,0,5);tone(f*1.5,.2,.07,'sawtooth',0,.03,3000);}},
    flourish(n){[0,4,7,12,16,19,24].slice(0,3+n).forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.22,.11,'sawtooth',0,i*.045,2600));},
    clutch(){tone(880,.16,.12,'sawtooth',0,0,2600);tone(1318.5,.18,.1,'sawtooth',0,.04,2600);},
    shieldUp(){tone(659,.2,.1,'triangle');tone(988,.25,.09,'triangle',0,.07);},
    shield(){noise(.25,.24,900,'bandpass',3200,0,3);tone(659.25,.3,.12,'sawtooth',0,0,2600);},
    chainLost(){tone(300,.22,.1,'triangle',150);},
    rush(){noise(.5,.17,400,'bandpass',7000,0,2);tone(180,.6,.75,'sine',38,.36);[0,7,12,16].forEach(s=>tone(440*Math.pow(2,s/12),.5,.08,'sawtooth',0,.4,2600));},
    rushEnd(){tone(120,.25,.2,'sine',300);},
    burn(n){noise(.16,.2,1400+n*200,'bandpass',5200,0,4);tone(110,.18,.3,'sine',50);},
    rail(){noise(.05,.05,3000,'highpass');},
    die(){tone(420,.6,.45,'sawtooth',60,0,1600);noise(.4,.3,1200,'lowpass');},
    best(){[0,4,7,12,16,19].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.3,.14,'sawtooth',0,.25+i*.07,2600));},
    ui(){tone(660,.07,.07,'triangle');}};})();

/* ---------- view ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,YU=1,XU=1,BT=0,PX=0,UI=1;
function makeGlow(rgb){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,`rgba(${rgb},.9)`);g.addColorStop(.35,`rgba(${rgb},.45)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,64,64);return c;}
const GLOW={c:makeGlow('56,232,255'),m:makeGlow('255,60,172'),g:makeGlow('255,210,60'),w:makeGlow('255,255,255'),r:makeGlow('255,70,90')};
const HUE={c:190,m:322,g:46,w:190,r:355};
let vig=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  YU=W>H?Math.min(H-74,640):Math.min(H*.56,W*1.3);BT=(H-YU)/2+(W>H?10:6);PX=Math.max(70,W*.22);XU=clamp((W-PX)/1.25,.6*YU,1.6*YU);UI=clamp(Math.min(W,H)/420,.8,1.5);
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.6)');}
window.addEventListener('resize',resize);
const sx=wx=>PX+(wx-G.X)*XU,sy=wy=>BT+wy*YU;

/* ---------- run state ---------- */
let G=null,scene='menu',paused=false,manual=false,hold=false,lastMode='daily';
const parts=[],pops=[],streaks=[];for(let i=0;i<44;i++)streaks.push({x:Math.random(),y:Math.random(),z:.25+Math.random()*.75,l:.03+Math.random()*.09});
let shake=0,flash=0,flashCol='255,255,255',danger=0,menuT=0;
const P=()=>clamp(G.X/95,0,1);
const climbOf=()=>lerp(.92,CLIMB,P());
const vOf=()=>lerp(.62,1.25,P())+clamp((G.X-95)*.0035,0,.35);
function newRun(mode,demo){
  const seed=SEED!=null?SEED:mode==='daily'?hashStr('brink-er-'+dayStr()):(Math.random()*4294967296)>>>0;
  G={mode,demo:!!demo,seed,rng:mulberry32(seed),sig:mode==='daily'?SIGS[seed%SIGS.length]:null,t:0,X:0,y:.5,vy:0,v:.62,score:0,shown:0,mult:1,surge:0,rush:0,
    chain:0,bestChain:0,miss:0,mile:0,shield:false,shieldGot:false,inv:0,alive:true,gates:[],nextX:1.9,prevC:.5,dev:0,pat:{name:'intro',left:3,step:0,dir:1,base:.5},sinceBr:0,
    passed:0,grazes:0,jackpots:0,rushes:0,clutch:0,burns:0,topTier:-1,ts:1,stop:0,deadT:0,cause:'',newBest:false,newFeats:[],didHold:0,didDive:0,trail:[],trailT:0,railT:0,toast:null,pulse:0};
  parts.length=0;pops.length=0;shake=0;flash=0;danger=0;
}
/* ---------- course generator: every gap is reachable from the previous one (reach = climb speed x time x 0.8) ---------- */
function choosePattern(){const p=P(),r=G.rng,mk=n=>({name:n,left:LEN[n],step:0,dir:r()<.5?-1:1,base:G.prevC});
  if(p>.25&&G.sinceBr>=5&&r()<.5){G.sinceBr=0;return mk('breather');}
  if(G.sig&&r()<.45&&p>.04){G.sinceBr++;return mk(G.sig.bias);}
  const t=r();let n;
  if(p<.1)n=t<.75?'single':'stair';
  else if(p<.26)n=t<.4?'single':t<.7?'stair':'tunnel';
  else if(p<.5)n=t<.22?'stair':t<.42?'zigzag':t<.6?'double':t<.78?'tunnel':t<.9?'slider':'single';
  else if(p<.76)n=t<.2?'zigzag':t<.38?'double':t<.54?'narrow':t<.68?'stair':t<.84?'slider':'shutter';
  else n=t<.18?'narrow':t<.36?'burst':t<.52?'zigzag':t<.68?'slider':t<.84?'shutter':'double';
  G.sinceBr++;return mk(n);}
function spawnGate(){
  if(G.pat.left<=0)G.pat=choosePattern();
  const pat=G.pat,p=P(),r=G.rng,T=lerp(1.25,.6,p);let f=1,h=lerp(.17,.088,p),c,sway=0,shut=false,jack=null;
  if(pat.name==='burst')f=.62;else if(pat.name==='tunnel')f=.5;else if(pat.name==='breather')f=1.5;
  const reach=Math.max(.05,climbOf()*T*f*.8-G.dev);G.dev=0;
  const to=(target,m)=>G.prevC+clamp(target-G.prevC,-m,m);
  const step=(s)=>{if(G.prevC+pat.dir*s>1-h-.04||G.prevC+pat.dir*s<h+.04)pat.dir*=-1;return G.prevC+pat.dir*s;};
  switch(pat.name){
    case 'intro':h+=.07;c=to(.5+(r()-.5)*.3,reach);break;
    case 'breather':h=Math.max(h,.2);c=to(pat.base,reach*.5);break;
    case 'single':c=to(r(),reach);break;

/* ---------- simulation ---------- */
function tick(dt){   // dt = real seconds (fixed step)

const MILES=[5,10,25,50,100,200];

  ctx.textAlign='left';ctx.fillStyle='rgba(234,252,255,.45)';ctx.font=`700 ${Math.round(12*UI)}px "Saira Condensed"`;
  ctx.fillText(G.mode==='daily'?'DAILY · '+G.sig.name:'ENDLESS',Math.max(12,PX-58*UI),W>H?Math.max(16,BT-30):BT-fs-16*UI-(yb-BT+12+fs>0?0:0));
  if(W<=H&&best>0){ctx.textAlign='center';ctx.fillText('BEST '+fmt(best),W/2,yb+16*UI);}
  // surge bar under the lower rail
  const bx=16,bw=W-32,by=BT+YU+(W>H?7:14*UI),bh=(W>H?6:9)*UI,full=G.surge;
  ctx.fillStyle='rgba(234,252,255,.1)';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=rush?`hsl(46,95%,${62+8*Math.sin(menuT*20)}%)`:`hsl(${lerp(190,322,full)},92%,62%)`;ctx.fillRect(bx,by,bw*full,bh);
  if(W<=H){ctx.textAlign='left';ctx.font=`700 ${Math.round(13*UI)}px "Saira Condensed"`;ctx.fillStyle=rush?'rgba(255,210,60,.95)':'rgba(234,252,255,.55)';ctx.fillText(rush?'RUSH ×2 — BURN THROUGH WALLS':'SURGE',bx,by+bh+16*UI);
    if(G.shield){ctx.textAlign='right';ctx.fillStyle='rgba(120,240,255,.9)';ctx.fillText('◯ SHIELD',bx+bw,by+bh+16*UI);}}
  // coaching: only until the player has shown they know it
  let hint='';if(save.runs<3&&G.alive){if(G.didHold<.25)hint=TOUCH?'HOLD ANYWHERE TO CLIMB':'HOLD SPACE / CLICK TO CLIMB';else if(G.didDive<.2)hint='RELEASE TO DIVE';else if(G.grazes<2&&G.t>3)hint='SHAVE THE GLOWING GAP EDGES';}
  if(hint){ctx.textAlign='center';ctx.font=`700 ${Math.round(19*UI)}px "Saira Condensed"`;ctx.fillStyle=`rgba(234,252,255,${.7+.3*Math.sin(menuT*5)})`;ctx.fillText(hint,W/2,W>H?BT+YU-14:by+bh+46*UI);}
  if(G.toast){const t=G.toast,k=t.t<.2?t.t/.2:t.t>1.7?(2.2-t.t)/.5:1;ctx.globalAlpha=clamp(k,0,1);ctx.textAlign='center';ctx.font=`700 ${Math.round(17*UI)}px "Saira Condensed"`;ctx.fillStyle=`hsl(${HUE[t.col]},92%,72%)`;
    ctx.fillText(t.txt,W/2,BT+22*UI);ctx.globalAlpha=1;}
}

/* ---------- scenes / overlays ---------- */
let overShown=false,overAt=0;
const TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
function show(id){for(const o of['ovMenu','ovPause','ovOver'])$(o).classList.toggle('on',o===id);$('bPause').style.visibility=scene==='play'&&!paused?'visible':'hidden';}
function todaySig(){const s=SEED!=null?SEED:hashStr('brink-er-'+dayStr());return SIGS[s%SIGS.length];}
function toMenu(){scene='menu';paused=false;newRun('endless',true);AU.engine(false,false,0);
  const rk=rankFor(best),nx=nextRank(best);$('mRank').textContent='▸ '+rk.name+' ◂';$('mRank').style.color=`hsl(${rk.hue},90%,70%)`;
  $('mBar').style.width=(nx?clamp((best-rk.min)/(nx.min-rk.min),0,1)*100:100)+'%';$('mBar').style.background=`hsl(${rk.hue},90%,62%)`;
  $('mNext').textContent=nx?fmt(nx.min-best)+' to '+nx.name:'top rank reached';$('mSig').textContent="today's anomaly · "+todaySig().name;
  const nf=Object.keys(save.feats).length;$('mStats').innerHTML=`<span class="chip">BEST <b>${fmt(best)}</b></span>`+(save.dayBest?`<span class="chip">TODAY <b>${fmt(save.dayBest)}</b></span>`:'')+
    (save.streak?`<span class="chip">STREAK <b>${save.streak}d</b></span>`:'')+`<span class="chip">FEATS <b>${nf}/${FEATS.length}</b></span>`;
  $('mKeys').textContent=TOUCH?'':'Space / click = hold · P pause · M mute';show('ovMenu');}
function start(mode){AU.unlock();AU.start();lastMode=mode;scene='play';paused=false;hold=false;held.clear();newRun(mode,false);
  toast(mode==='daily'?'ANOMALY · '+G.sig.name:'ENDLESS RUN',mode==='daily'?'g':'c');show(null);cv.focus({preventScroll:true});}
function showOver(){overShown=true;overAt=performance.now();
  const sc=G.score,nx=nextRank(best);$('oTitle').textContent=G.newBest?'NEW BEST':G.rushes>=3?'AFTERBURNER':G.topTier>=4?'HAIRLINE PILOT':G.bestChain>=25?'EDGE ADDICT':rankFor(sc).name;
  $('oTitle').style.color=G.newBest?'var(--gd)':'var(--cy)';$('oScore').textContent=fmt(sc);
  $('oBest').textContent=G.newBest?'personal best!':best-sc<best*.08?'only '+fmt(best-sc)+' from your best':'best '+fmt(best)+(nx?' · '+fmt(nx.min-best)+' to '+nx.name:'');
  $('oCause').textContent=G.cause+' · gate '+(G.passed+1);
  $('oStats').innerHTML=[['GRAZE',G.topTier>=0?TIERS[G.topTier].name:'—'],['CHAIN',G.bestChain],['RUSH','×'+G.rushes],['TIME',G.t.toFixed(1)+'s']].map(a=>`<span class="chip">${a[0]} <b>${a[1]}</b></span>`).join('')+
    G.newFeats.map(f=>`<span class="chip new">★ ${f}</span>`).join('');
  $('oHint').textContent=TOUCH?'tap anywhere':'space';$('bSwap').textContent=G.mode==='daily'?'ENDLESS':'DAILY';show('ovOver');}
function setPaused(p){if(scene!=='play'||!G.alive||p===paused)return;paused=p;hold=false;held.clear();AU.engine(false,false,0);$('bPMute').textContent='SOUND: '+(AU.muted?'OFF':'ON');show(p?'ovPause':null);if(p)$('bResume').focus();else cv.focus({preventScroll:true});}
function toggleMute(){AU.setMuted(!AU.muted);$('bMute').classList.toggle('off',AU.muted);$('bPMute').textContent='SOUND: '+(AU.muted?'OFF':'ON');}
const canRetry=()=>scene==='over'&&overShown&&(manual||performance.now()-overAt>350);

/* ---------- input: one button (any pointer, Space / Up / W / Enter) ---------- */
const held=new Set();
function press(id){AU.unlock();AU.start();if(scene==='play'&&!paused){held.add(id);hold=true;}else if(canRetry())start(G.mode);}
function release(id){held.delete(id);if(!held.size)hold=false;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{window.focus();cv.focus({preventScroll:true});}catch(_){ }press('p'+e.pointerId);});
for(const ev of['pointerup','pointercancel'])window.addEventListener(ev,e=>release('p'+e.pointerId));
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('ovOver').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(canRetry())start(G.mode);});
const HOLDK=['Space','ArrowUp','KeyW','Enter'];
window.addEventListener('keydown',e=>{
  if(HOLDK.includes(e.code)||e.code==='ArrowDown')e.preventDefault();if(e.repeat)return;
  if(e.code==='KeyM'){toggleMute();return;}
  if(scene==='menu'){if(e.code==='Space'||e.code==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.code==='Enter')return;e.preventDefault();start('daily');}else if(e.code==='KeyE')start('endless');return;}
  if(scene==='over'){if(e.code==='Escape')toMenu();else if(HOLDK.includes(e.code)||e.code==='KeyR'){e.preventDefault();if(canRetry())start(G.mode);}return;}
  if(e.code==='Escape'||e.code==='KeyP'){setPaused(!paused);return;}
  if(paused){if(e.code==='Space'){e.preventDefault();setPaused(false);}return;}
  if(e.code==='KeyR'){start(G.mode);return;}
  if(HOLDK.includes(e.code))press(e.code);
});
window.addEventListener('keyup',e=>release(e.code));
const click=(id,fn)=>$(id).addEventListener('click',e=>{AU.unlock();AU.ui();fn(e);e.currentTarget.blur();});
click('bDaily',()=>start('daily'));click('bEndless',()=>start('endless'));click('bPause',()=>setPaused(true));click('bMute',toggleMute);click('bPMute',toggleMute);
click('bResume',()=>setPaused(false));click('bRestart',()=>start(G.mode));click('bQuit',toMenu);click('bMenu',toMenu);
click('bAgain',()=>{if(canRetry())start(G.mode);});click('bSwap',()=>start(G.mode==='daily'?'endless':'daily'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!NOPAUSE)setPaused(true);});
window.addEventListener('blur',()=>{hold=false;held.clear();if(!NOPAUSE)setPaused(true);});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  if(!manual&&!paused){acc+=dt;let n=0;while(acc>=STEP&&n++<14){tick(STEP);acc-=STEP;}if(acc>STEP)acc=0;}
  render();requestAnimationFrame(frame);}
window.__gdl={
  get state(){const g=G;return{mode:scene,paused,kind:g.mode,demo:g.demo,seed:g.seed,sig:g.sig?g.sig.name:null,t:g.t,X:g.X,y:g.y,vy:g.vy,v:g.v,hold,alive:g.alive,score:Math.floor(g.score),best,mult:g.mult,
    chain:g.chain,bestChain:g.bestChain,surge:g.surge,rush:g.rush,shield:g.shield,inv:g.inv,passed:g.passed,grazes:g.grazes,topTier:g.topTier,rushes:g.rushes,burns:g.burns,clutch:g.clutch,jackpots:g.jackpots,
    ts:g.ts,cause:g.cause,muted:AU.muted,feats:Object.keys(save.feats).length,runs:save.runs,overShown,
    gates:g.gates.filter(q=>!q.done&&!q.dead).map(q=>({d:q.x-g.X,kind:q.kind,gaps:q.cur.map(c=>({c:c.c,h:c.h,jack:c.jack}))}))};},
  manual(b){manual=!!b;acc=0;},advance(s){for(let n=Math.round(s/STEP);n>0;n--)tick(STEP);},input(b){if(b)press('hook');else release('hook');},
  cheat(o){Object.assign(G,o);},const:{STEP,CLIMB,TH,GB,VIS_R,HIT_R,RUSH_T,TIERS:TIERS.map(t=>t.name)}};
resize();$('bMute').classList.toggle('off',AU.muted);toMenu();
if(AUTOSTART){scene='play';lastMode='endless';newRun('endless',false);show(null);}
requestAnimationFrame(frame);
</script>
</body>
