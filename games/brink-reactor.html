<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRINK · Reactor</title>
<meta name="description" content="One tap hops your spark between two containment rings: hop at the last instant to carve away the plates a failing reactor keeps throwing into your orbit.">
<meta name="gdl:genre" content="Arcade, Action">
<meta name="gdl:controls" content="touch, mouse, keyboard">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root{--am:#ffb23c;--tl:#3cf0d2;--rd:#ff5a4a;--ink:#fff4e2}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#070605}
body{font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;outline:none}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,244,226,.3);background:rgba(18,12,6,.6);color:var(--ink);font:700 16px "Chakra Petch",sans-serif;cursor:pointer}
.ib.off{color:rgba(255,244,226,.35);text-decoration:line-through}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(8,5,2,.62);
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ov.on{display:flex}
.card{width:min(94vw,390px);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch;animation:rise .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
h1{font:900 46px/1 "Orbitron",sans-serif;letter-spacing:5px;color:#fff6e6;text-shadow:0 0 26px rgba(255,160,40,.75),0 0 4px #ffb23c}
h1 small{display:block;font:700 15px "Chakra Petch";letter-spacing:12px;color:var(--tl);text-shadow:none;margin-bottom:6px}
h2{font:900 26px/1.1 "Orbitron";letter-spacing:3px}
.rank{font:700 16px "Chakra Petch";letter-spacing:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:5px 40px 3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--am)}
.dim{font:500 13px "Chakra Petch";color:rgba(255,244,226,.6)}
.btn{min-height:52px;border-radius:26px;border:2px solid var(--am);background:rgba(255,178,60,.16);color:var(--ink);font:700 19px "Chakra Petch";letter-spacing:3px;cursor:pointer;padding:6px 12px}
.btn small{display:block;font:500 11px "Chakra Petch";letter-spacing:1px;color:var(--tl)}
.btn.sec{border:1.5px solid rgba(255,244,226,.4);background:rgba(18,12,6,.55);font-size:15px;min-height:46px}
.btn:active{transform:scale(.97)}.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:500 12px "Chakra Petch";padding:4px 9px;border-radius:12px;background:rgba(255,244,226,.09);color:rgba(255,244,226,.85)}
.chip b{color:var(--am);font-weight:700}.chip.new{background:rgba(60,240,210,.16);color:var(--tl)}
.how{font:500 15px/1.4 "Chakra Petch";color:rgba(255,244,226,.85)}.how b{color:var(--tl)}
#oScore{font:900 58px/1 "Orbitron";text-shadow:0 0 22px rgba(255,160,40,.6)}
.blk{display:flex;flex-direction:column;gap:10px}
@media (max-height:520px){.card{width:min(96vw,720px);flex-direction:row;align-items:center;gap:18px}.blk{flex:1;gap:7px}h1{font-size:34px}h1 small{font-size:12px}
  .btn{min-height:44px;font-size:16px}.btn.sec{min-height:44px;font-size:14px}#oScore{font-size:40px}h2{font-size:20px}.how{font-size:13px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Reactor playfield"></canvas>
<div id="top"><button class="ib" id="bMute" aria-label="Toggle sound">♪</button><button class="ib" id="bPause" aria-label="Pause">II</button></div>

<div class="ov" id="ovMenu"><div class="card">
  <div class="blk"><h1><small>BRINK</small>REACTOR</h1>
    <div><div class="rank" id="mRank"></div><div class="bar"><i id="mBar"></i></div><div class="dim" id="mNext"></div></div>
    <div class="how"><b>TAP</b> to hop between the two rings<br>Hop at the <b>last instant</b> to carve the plate away</div></div>
  <div class="blk"><button class="btn" id="bPlay">START CONTAINMENT<small id="mHint"></small></button>
    <div class="stats" id="mStats"></div><div class="dim" id="mKeys"></div></div>
</div></div>

<div class="ov" id="ovPause"><div class="card">
  <div class="blk"><h2>PAUSED</h2><div class="how"><b>TAP</b> hops rings · late hops score and <b>carve</b><br>A full charge makes you a <b>BLADE</b> — cut straight through</div></div>
  <div class="blk"><button class="btn" id="bResume">RESUME</button>
    <div class="row"><button class="btn sec" id="bRestart">RESTART</button><button class="btn sec" id="bPMute">SOUND</button></div>
    <button class="btn sec" id="bQuit">MENU</button></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <div class="blk"><h2 id="oTitle"></h2><div id="oScore">0</div><div class="dim" id="oBest"></div><div class="dim" id="oCause"></div></div>
  <div class="blk"><div class="stats" id="oStats"></div>
    <button class="btn" id="bAgain">AGAIN<small id="oHint"></small></button>
    <button class="btn sec" id="bMenu">MENU</button></div>
</div></div>

<script>
"use strict";
/* BRINK · Reactor — one-tap orbital arena. A spark circles a failing core on two rings; the core keeps throwing
   plates onto them and they STAY. Tap hops rings. The later you hop before a plate (or the tighter you tuck in behind
   one), the higher the graze tier; good grazes crack and carve plates out of the arena. A full charge turns the spark
   into a blade for a few seconds; polarity flips reverse the orbit. Single file, no dependencies. */
const Q=new URLSearchParams(location.search),AUTOSTART=Q.get('autostart')==='1',NOPAUSE=Q.get('nopause')==='1';
const SEED=Q.has('seed')?(+Q.get('seed')>>>0):null,KEY='gdl:best:games/brink-reactor',SAVE='gdl:brink-reactor:save';
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2,norm=a=>((a%TAU)+TAU)%TAU;
const fmt=n=>Math.floor(n).toLocaleString('en-US');
function mulberry32(a){a>>>=0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let best=+store.get(KEY,0)||0;
const save=Object.assign({feats:{},runs:0,laps:0,carves:0,mute:false},store.get(SAVE,{})||{});

/* ---------- tuning (windows are in seconds, so they mean the same at every orbit speed) ---------- */
const STEP=1/120,LATE=.30,TUCK=.22,INSET=.035,TFOR=.03,WIN=.36,BLADE_T=4.2,FUSE_AT=10;
const TIERS=[
  {name:'SAFE',min:0,pts:20,surge:.02,mult:.06,parts:5,shake:.1,dmg:0,pitch:0},
  {name:'CLOSE',min:.3,pts:45,surge:.03,mult:.12,parts:8,shake:.2,dmg:0,pitch:2},
  {name:'GREAT',min:.55,pts:90,surge:.05,mult:.2,parts:12,shake:.32,dmg:1,pitch:5},
  {name:'PERFECT',min:.78,pts:160,surge:.08,mult:.3,parts:18,shake:.5,dmg:2,pitch:9},
  {name:'INSANE',min:.92,pts:260,surge:.11,mult:.42,parts:26,shake:.75,dmg:3,pitch:14}];
const tierIdx=c=>{let i=0;for(let k=0;k<TIERS.length;k++)if(c>=TIERS[k].min)i=k;return i;};
const RANKS=[{min:0,name:'TRAINEE',hue:170},{min:1200,name:'RING HAND',hue:150},{min:4000,name:'PLATE CUTTER',hue:40},{min:9000,name:'REGULATOR',hue:28},
  {min:18000,name:'CORE WARDEN',hue:10},{min:35000,name:'BLADE RUNNER',hue:320},{min:60000,name:'MELTDOWN SAINT',hue:280},{min:100000,name:'ZERO KELVIN',hue:195}];
const rankFor=s=>{let r=RANKS[0];for(const k of RANKS)if(s>=k.min)r=k;return r;},nextRank=s=>RANKS.find(k=>k.min>s)||null;
const FEATS=[
  {id:'carve1',name:'FIRST CUT · carve a plate',ok:g=>g.carves>=1},{id:'carve12',name:'DEMOLITION · carve 12 plates in a run',ok:g=>g.carves>=12},
  {id:'insane',name:'LAST GASP · an INSANE hop',ok:g=>g.topTier>=4},{id:'tuck5',name:'SHADOW · 5 tight tucks in a run',ok:g=>g.tucks>=5},
  {id:'chain12',name:'CRITICAL CHAIN · 12 chain',ok:g=>g.bestChain>=12},{id:'blade2',name:'TWICE THE BLADE · 2 blades in a run',ok:g=>g.blades>=2},
  {id:'flip2',name:'BOTH WAYS · survive 2 polarity flips',ok:g=>g.flips>=2},{id:'lap30',name:'LONG SHIFT · 30 laps in a run',ok:g=>g.laps>=30}];

/* ---------- audio: slow industrial pulse; hop pitch tells you which ring, graze bells climb with chain ---------- */
const AU=(()=>{let ac=null,out=null,nb=null,muted=Q.has('mute')?Q.get('mute')==='1':!!save.mute,timer=null,step=0,next=0;
  function unlock(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ac=new AC();}catch(e){return;}
      out=ac.createGain();out.gain.value=muted?0:.8;const cp=ac.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=6;out.connect(cp);cp.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(ac.state==='suspended')ac.resume();if(!timer)timer=setInterval(sched,25);}
  const live=()=>ac&&!muted&&ac.state==='running'&&!manual;
  function tone(f,d,v,type,f2,at,lp){if(!live())return;const t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;fl.Q.value=3;o.connect(fl);fl.connect(g);}else o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03);}
  function noise(d,v,f,type,f2,at,q){if(!live())return;const t=ac.currentTime+(at||0),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type||'bandpass';fl.Q.value=q||1;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(out);s.start(t);s.stop(t+d+.02);}
  const SC=[0,2,3,7,9,12,14,15,19,21,24],BASS=[36.71,36.71,0,36.71,43.65,0,36.71,0,32.7,32.7,0,32.7,49,0,43.65,0],RIFF=[0,0,7,0,3,0,7,10,0,0,7,0,12,10,7,3];
  function sched(){if(!live()||scene!=='play'||paused||!G||!G.alive){next=0;return;}const now=ac.currentTime;if(next<now)next=now+.05;
    const bpm=104+P()*22+(G.blade>0?14:0),spb=60/bpm/4,it=clamp(Math.max(G.surge,P()*.6,G.heat),0,1);
    while(next<now+.12){const s=step%16,at=next-now;if(s%8===0)tone(110,.4,.8,'sine',38,at);if(s%8===4&&it>.25)tone(110,.3,.5,'sine',42,at);
      if(BASS[s])tone(BASS[s]*2,.2,.3+.08*it,'sawtooth',0,at,300+it*500);
      if(s%4===2)noise(.06,.07+.06*it,2600,'bandpass',0,at,9);if(it>.4&&s%2===1)noise(.03,.05,6500,'highpass',0,at);
      if(it>.5)tone(146.83*Math.pow(2,RIFF[s]/12),.1,.05*clamp((it-.5)/.4,0,1),'square',0,at,1800);
      if(G.blade>0)tone(293.66*Math.pow(2,RIFF[(s*3)%16]/12),.14,.08,'sawtooth',0,at,3200);next+=spb;step++;}}
  return{unlock,get muted(){return muted;},
    setMuted(m){muted=m;if(out)out.gain.value=m?0:.8;if(!Q.has('mute')){save.mute=m;store.set(SAVE,save);}},
    hop(tr){tone(tr?620:415,.07,.12,'square',tr?780:330,0,2400);noise(.05,.06,tr?3200:1600,'bandpass',0,0,3);},
    graze(chain,ti){const f=293.66*Math.pow(2,(SC[Math.min(10,chain%11)]+TIERS[ti].pitch)/12);tone(f,.3,.13+ti*.015,'sine');tone(f*2.01,.18,.06,'triangle');tone(f*3,.1,.03+ti*.01,'sine');},
    crack(){noise(.1,.2,2400,'bandpass',900,0,4);},
    carve(n){noise(.3,.28,5200,'highpass',1800);tone(160,.25,.4,'sine',50);tone(880*Math.pow(2,(n%5)*2/12),.25,.08,'triangle',0,.03);},
    cell(n){tone(1174*Math.pow(2,(n%4)*3/12),.16,.09,'sine');tone(1760,.1,.04,'sine',0,.04);},
    warn(){tone(520,.09,.05,'square',0,0,1500);},clang(){noise(.18,.14,1900,'bandpass',0,0,14);tone(98,.2,.25,'sine',60);},
    lazy(){tone(260,.18,.07,'triangle',170);},chainLost(){tone(300,.25,.1,'triangle',140);},
    fuseUp(){tone(587,.2,.1,'triangle');tone(880,.25,.09,'triangle',0,.07);},fuse(){noise(.3,.26,700,'bandpass',3000,0,3);tone(220,.3,.2,'sawtooth',110,0,1800);},
    flipWarn(){tone(740,.12,.1,'square',0,0,2000);tone(740,.12,.1,'square',0,.18,2000);},flip(){tone(900,.35,.16,'sawtooth',120,0,2600);noise(.35,.15,400,'bandpass',4000,0,2);},
    blade(){noise(.6,.2,300,'bandpass',6000,0,2);tone(110,.7,.5,'sawtooth',440,0,2200);tone(73,.8,.7,'sine',36,.4);},bladeEnd(){tone(440,.3,.16,'sawtooth',110,0,1800);},
    lap(){tone(196,.12,.07,'triangle');},
    die(){tone(300,.8,.5,'sawtooth',40,0,1400);noise(.6,.35,900,'lowpass');},
    best(){[0,3,7,12,15,19].forEach((s,i)=>tone(293.66*Math.pow(2,s/12),.35,.13,'triangle',0,.3+i*.08));},ui(){tone(520,.07,.07,'triangle');}};})();

/* ---------- view ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,CX=0,CY=0,R1=1,R0=1,PT=1,UI=1,bgG=null,vig=null;
function makeGlow(rgb){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,`rgba(${rgb},.95)`);g.addColorStop(.35,`rgba(${rgb},.45)`);g.addColorStop(1,`rgba(${rgb},0)`);x.fillStyle=g;x.fillRect(0,0,64,64);return c;}
const GLOW={a:makeGlow('255,178,60'),t:makeGlow('60,240,210'),w:makeGlow('255,250,235'),r:makeGlow('255,80,60')},HUE={a:36,t:170,w:45,r:6};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  R1=Math.min(W*.42,(H-(W>H?96:250))*.5);R0=R1*.64;PT=R1*.1;CX=W/2;CY=H/2+(W>H?16:8);UI=clamp(Math.min(W,H)/420,.8,1.5);
  bgG=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);bgG.addColorStop(0,'#2a1606');bgG.addColorStop(.35,'#130b06');bgG.addColorStop(1,'#060504');
  vig=ctx.createRadialGradient(CX,CY,R1*1.1,CX,CY,Math.max(W,H)*.8);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.65)');}
window.addEventListener('resize',resize);

/* ---------- run state ---------- */
let G=null,scene='menu',paused=false,manual=false,tapQ=0;
const parts=[],pops=[];let shake=0,flash=0,flashCol='255,255,255',menuT=0;
const P=()=>clamp(G.t/110,0,1),wOf=()=>lerp(1.9,3.3,P())+clamp((G.t-110)*.004,0,.8);
function newRun(demo){
  const seed=SEED!=null?SEED:(Math.random()*4294967296)>>>0;
  G={demo:!!demo,seed,rng:mulberry32(seed),t:0,phi:-Math.PI/2,tr:1,rv:1,dir:1,w:1.9,A:0,lapA:0,laps:0,score:0,shown:0,mult:1,surge:0,blade:0,inv:0,fuse:false,fuseGot:false,
    chain:0,bestChain:0,miss:0,since:9,plates:[],cells:[],spawnT:1.1,cellT:4,shiftT:8,flipT:26+0,flipping:0,flips:0,hops:0,hopT:-9,hopFx:[],grazes:0,tucks:0,carves:0,burns:0,cellsGot:0,blades:0,topTier:-1,
    alive:true,deadT:0,cause:'',newBest:false,newFeats:[],ts:1,stop:0,toast:null,pulse:0,heat:0,pid:0,lazyN:0};
  G.flipT=24+G.rng()*8;parts.length=0;pops.length=0;shake=0;flash=0;tapQ=0;
}
/* geometry helpers: "lead" is the end of a plate the spark meets first in its current direction */
const lead=p=>G.dir>0?p.a:p.a+p.len;
const inn=p=>norm(G.dir*(G.phi-lead(p)));            // how far past the leading end (inside while < len)
const ahead=p=>norm(G.dir*(lead(p)-G.phi));          // how far before the leading end
function sep(a0,l0,a1,l1){const d=norm(a1-a0);if(d<l0)return 0;const e=norm(a0-a1);if(e<l1)return 0;return Math.min(d-l0,e-l1);}   // gap between two arcs
/* the ring the spark will be riding when it gets `dist` ahead, assuming it only hops when it must */
function ringAt(dist,out){let ring=G.tr;const L=G.plates.filter(q=>inn(q)>=q.len).sort((x,y)=>ahead(x)-ahead(y));
  for(const q of L){if(ahead(q)>=dist)break;if(q.tr===ring)ring=1-ring;else if(out&&q.live&&ahead(q)>1.3*G.w){out.p=q;out.ring=ring;return ring;}}return ring;}
/* pressure: a plate the spark would simply pass is re-seated (with a warning) onto the ring the spark will be on */
function shiftPlate(){const o={p:null};ringAt(99,o);if(!o.p)return;const q=o.p;G.hopFx.push({a:q.a+q.len/2,t:0,to:o.ring});q.tr=o.ring;q.live=false;q.age=.15;if(!G.demo)AU.warn();}
function spawnPlate(first){
  const r=G.rng,p=P(),gap=lerp(WIN,.24,p)*G.w*1.1;   // hop window between neighbours: 0.4 s early, 0.26 s late
  for(let k=0;k<14;k++){const len=lerp(.45,.75,p)+r()*.3,dist=first?G.w*2.1:1.9+r()*(TAU-len-2.6),ld=G.phi+G.dir*dist,a=norm(G.dir>0?ld:ld-len);
    let ok=true;for(const q of G.plates){if(sep(a,len,q.a,q.len)<gap){ok=false;break;}}
    if(!ok)continue;const tr=ringAt(dist);G.plates.push({id:++G.pid,tr,a,len,hp:p>.7?4:p>.35?3:2,max:p>.7?4:p>.35?3:2,live:false,age:0,hit:0,lateT:-9,tuckT:-9,kill:false});if(!G.demo)AU.warn();return true;}
  return false;
}
function spawnCell(){const r=G.rng,lv=G.plates.filter(p=>p.live);let tr,a;
  if(lv.length&&r()<.6){const p=lv[(r()*lv.length)|0];tr=p.tr;a=norm((G.dir>0?p.a+p.len:p.a)+G.dir*(TUCK*.45*G.w));}else{tr=r()<.5?0:1;a=norm(G.phi+G.dir*(1.6+r()*3));}
  if(norm(G.dir*(a-G.phi))<1)return;for(const q of G.plates)if(q.tr===tr&&norm(a-q.a+.08)<q.len+.16)return;G.cells.push({tr,a,t:0});}

/* ---------- fx helpers ---------- */
const px=(rr,a)=>CX+Math.cos(a+G.A)*rr,py=(rr,a)=>CY+Math.sin(a+G.A)*rr,trR=t=>t?R1:R0;
function spark(x,y,n,col,spd){for(let i=0;i<n&&parts.length<280;i++){const a=Math.random()*TAU,s=(Math.random()*.8+.3)*spd*UI;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.3+Math.random()*.5,r:(Math.random()*2+1.2)*UI,col});}}
function shards(p,col){const rr=trR(p.tr);for(let i=0;i<22&&parts.length<280;i++){const a=p.a+Math.random()*p.len,x=px(rr,a),y=py(rr,a),o=Math.atan2(y-CY,x-CX)+(Math.random()-.5),s=(120+Math.random()*320)*UI;

/* ---------- simulation ---------- */
function tick(dt){
  menuT+=dt;shake=Math.max(0,shake-dt*3.2);flash=Math.max(0,flash-dt*3.4);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=Math.exp(-2.6*dt);p.vx*=k;p.vy*=k;if(p.t>=p.life)parts.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;p.y-=dt*26*UI;if(p.t>=p.life)pops.splice(i,1);}
  if(!G)return;if(G.toast){G.toast.t+=dt;if(G.toast.t>2.2)G.toast=null;}G.pulse=Math.max(0,G.pulse-dt*3);G.shown+=(G.score-G.shown)*Math.min(1,dt*12);
  for(let i=G.hopFx.length-1;i>=0;i--){G.hopFx[i].t+=dt;if(G.hopFx[i].t>.25)G.hopFx.splice(i,1);}
  if(!G.alive){tapQ=0;G.deadT+=dt;if(scene==='over'&&G.deadT>.7&&!overShown)showOver();return;}
  while(tapQ>0){tapQ--;hop();if(!G.alive)return;}
  if(G.stop>0){G.stop-=dt;return;}
  G.ts+=(1-G.ts)*Math.min(1,dt*4.5);sim(dt*G.ts);
}
function hop(){
  const from=G.tr,to=1-from,w=G.w;let A=null,ta=9,B=null,tb=9;
  for(const p of G.plates){if(!p.live)continue;const i=inn(p);
    if(p.tr===from){const t=i<p.len?-i/w:ahead(p)/w;if(t<ta){ta=t;A=p;}}
    else{const t=(i-p.len)/w;if(t>-TFOR&&t<tb){tb=t;B=p;}}}
  G.tr=to;G.hops++;G.hopT=G.t;G.hopFx.push({a:G.phi,t:0,to});if(!G.demo)AU.hop(to);
  if(G.demo)return;
  let tk=false;if(B&&tb<TUCK&&G.t-B.tuckT>.5){tk=true;B.tuckT=G.t;G.tucks++;graze(B,(1-Math.max(0,tb)/TUCK)*.97,true);}
  if(A&&ta<LATE&&G.t-A.lateT>.5){A.lateT=G.t;graze(A,1-Math.max(0,ta)/LATE,false);}
  else if(A&&ta<.9&&G.blade<=0&&!tk){G.miss++;G.lazyN++;pop('EARLY',px(trR(from),G.phi),py(trR(from),G.phi)-18*UI,'w');AU.lazy();if(G.miss>=2&&G.chain>0){if(G.chain>=4){pop('CHAIN LOST',CX,CY-R1-14*UI,'r');AU.chainLost();}G.chain=0;G.fuseGot=false;}}
}
function graze(p,close,tuck){

  G.mult=Math.min(12,G.mult+T.mult);const pts=Math.round(T.pts*G.mult*bm);G.score+=pts;if(G.blade<=0)G.surge=Math.min(1,G.surge+T.surge);
  const rr=trR(p.tr),ea=tuck?(G.dir>0?p.a+p.len:p.a):lead(p),x=px(rr,ea),y=py(rr,ea),col=ti>=3?'w':ti>=2?'a':'t';
  spark(x,y,T.parts,col,160+close*240);pop((tuck?'TUCK ':'')+(ti>=1?T.name+' ':'')+'+'+fmt(pts),x,y-22*UI,col,ti>=3);
  kick(T.shake,ti>=3?.12+ti*.04:0,'255,230,180');G.pulse=1;if(ti>=3){G.stop=Math.max(G.stop,RM?0:ti>=4?.06:.04);G.ts=Math.min(G.ts,ti>=4?.34:.5);}

}
function carve(p,burn){const i=G.plates.indexOf(p);if(i<0)return;G.plates.splice(i,1);shards(p,'a');const b=Math.round((burn?80:120)*G.mult*(G.blade>0?2:1));G.score+=b;

  G.lapA+=w*dt;if(G.lapA>=TAU){G.lapA-=TAU;G.laps++;if(!G.demo){G.score+=Math.round(30*G.mult);AU.lap();}}
  let near=9;
  for(let k=G.plates.length-1;k>=0;k--){const p=G.plates[k],i=inn(p);p.hit=Math.max(0,p.hit-dt*4);
    if(!p.live){p.age+=dt;if(p.age>=.9&&i>p.len+.12&&ahead(p)>.78*w){p.live=true;p.hit=1;if(!G.demo)AU.clang();}continue;}
    if(p.tr!==G.tr)continue;if(i>=p.len)near=Math.min(near,ahead(p)/w);

      else{die(p);return;}}

  for(let k=G.cells.length-1;k>=0;k--){const c=G.cells[k];c.t+=dt;const d=norm(G.dir*(c.a-G.phi));
    if((c.tr===G.tr||G.blade>0)&&(d<.07||d>TAU-.07)){G.cells.splice(k,1);if(G.demo)continue;G.cellsGot++;const b=Math.round(40*G.mult);G.score+=b;if(G.blade<=0)G.surge=Math.min(1,G.surge+.03);
      const x=px(trR(c.tr),c.a),y=py(trR(c.tr),c.a);spark(x,y,8,'t',170);pop('+'+b,x,y-16*UI,'t');AU.cell(G.cellsGot);G.pulse=Math.max(G.pulse,.5);}

  G.spawnT-=dt;if(G.spawnT<=0){const first=G.pid===0;G.spawnT=spawnPlate(first)?lerp(2.5,1.25,P()):.4;}
  G.shiftT-=dt;if(G.shiftT<=0){G.shiftT=lerp(2.6,1.2,P());shiftPlate();}
  G.cellT-=dt;if(G.cellT<=0){G.cellT=lerp(3.2,2,P());if(G.cells.length<2)spawnCell();}
  if(G.blade>0){G.blade-=dt;G.surge=clamp(G.blade/BLADE_T,0,1);if(G.blade<=0){G.blade=0;G.surge=0;G.inv=.5;kick(.3,.4,'255,200,120');toast('BLADE SPENT','a');AU.bladeEnd();}}
  else G.surge=Math.max(0,G.surge-dt*.018);
  // polarity flip: warned, and only executed when nothing is close behind the spark (that would be "ahead" afterwards)
  G.flipT-=dt;if(G.flipT<1.8&&!G.flipping){G.flipping=1;if(!G.demo){toast('POLARITY FLIP INCOMING','r');AU.flipWarn();}}
  if(G.flipT<=0){let clear=true;for(const p of G.plates){if(!p.live)continue;const i=inn(p);if(p.tr===G.tr&&i<p.len+.4*w){clear=false;break;}}
    if(clear){G.dir=-G.dir;G.flips++;G.flipping=0;G.flipT=22+G.rng()*10;G.cells.length=0;kick(.6,.5,'120,255,230');if(!G.demo){pop('POLARITY FLIP',CX,CY-R1*.36,'t',true);AU.flip();}}}

function die(p){
  p.kill=true;G.alive=false;G.deadT=0;G.cause=G.t-G.hopT<.09?'Hopped into a plate':'Ran into a plate';scene='over';overShown=false;
  const x=px(trR(G.tr),G.phi),y=py(trR(G.tr),G.phi);kick(1.5,1,'255,90,70');spark(x,y,46,'t',420);spark(x,y,30,'r',300);AU.die();

  const top=CY-R1-PT*2.6,fs=clamp(top*.42,22,54),land=W>H,x=land?Math.max(20,CX-R1-PT*3-fs*3.4):CX,yb=land?CY-fs*.2:Math.max(fs+6,top-fs*.75);
  ctx.textBaseline='alphabetic';ctx.textAlign=land?'left':'center';ctx.font=`900 ${Math.round(fs*(1+G.pulse*.06))}px "Orbitron",sans-serif`;ctx.fillStyle='#fff4e2';ctx.shadowColor='rgba(255,160,40,.75)';ctx.shadowBlur=16;ctx.fillText(fmt(G.shown),x,yb);ctx.shadowBlur=0;
  ctx.font=`700 ${Math.round(Math.max(13,fs*.36))}px "Chakra Petch"`;const ln=Math.max(18,fs*.5);let l1='';if(G.mult>1.05)l1='×'+G.mult.toFixed(1);if(G.chain>=2)l1+=(l1?'   ':'')+G.chain+' CHAIN';
  ctx.fillStyle=`hsl(${lerp(170,20,clamp((G.mult-1)/8,0,1))},95%,68%)`;ctx.fillText(l1,x,yb+ln);
  ctx.fillStyle='rgba(255,244,226,.5)';ctx.font=`600 ${Math.round(12*UI)}px "Chakra Petch"`;if(best>0)ctx.fillText('BEST '+fmt(best),x,yb+ln*(l1?2:1));
  if(G.fuse){ctx.fillStyle='rgba(60,240,210,.95)';ctx.fillText('◯ FUSE',x,yb+ln*(l1?2:1)+(best>0?16*UI:0));}
  let hint='';if(save.runs<3&&G.alive){if(G.hops<1)hint=TOUCH?'TAP — HOP TO THE OTHER RING':'SPACE / CLICK — HOP TO THE OTHER RING';else if(G.grazes<2&&G.t>2)hint='HOP LATE, ON THE BRIGHT APPROACH LANE';else if(G.carves<1&&G.t>6)hint='A PERFECT HOP CARVES THE PLATE';}
  ctx.textAlign='center';const by=land?H-14:Math.min(H-24,CY+R1+PT*3.4+22*UI);
  if(hint){ctx.font=`700 ${Math.round(16*UI)}px "Chakra Petch"`;ctx.fillStyle=`rgba(255,244,226,${.7+.3*Math.sin(menuT*5)})`;ctx.fillText(hint,CX,by);}
  else if(blade){ctx.font=`700 ${Math.round(15*UI)}px "Chakra Petch"`;ctx.fillStyle='rgba(255,210,120,.95)';ctx.fillText('BLADE ×2 — CUT STRAIGHT THROUGH',CX,by);}
  if(G.toast){const t=G.toast,k=t.t<.2?t.t/.2:t.t>1.7?(2.2-t.t)/.5:1;ctx.globalAlpha=clamp(k,0,1);ctx.font=`700 ${Math.round(15*UI)}px "Chakra Petch"`;ctx.fillStyle=t.col==='w'?'#fff6dc':`hsl(${HUE[t.col]},95%,70%)`;
    ctx.fillText(t.txt,CX,land?22:by+(hint||blade?24*UI:0));ctx.globalAlpha=1;}
}

/* ---------- scenes / overlays ---------- */
let overShown=false,overAt=0;
const TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
function show(id){for(const o of['ovMenu','ovPause','ovOver'])$(o).classList.toggle('on',o===id);$('bPause').style.visibility=scene==='play'&&!paused?'visible':'hidden';}
function toMenu(){scene='menu';paused=false;overShown=false;newRun(true);
  const rk=rankFor(best),nx=nextRank(best);$('mRank').textContent='◈ '+rk.name+' ◈';$('mRank').style.color=`hsl(${rk.hue},90%,68%)`;
  $('mBar').style.width=(nx?clamp((best-rk.min)/(nx.min-rk.min),0,1)*100:100)+'%';$('mBar').style.background=`hsl(${rk.hue},90%,60%)`;
  $('mNext').textContent=nx?fmt(nx.min-best)+' to '+nx.name:'top rank reached';$('mHint').textContent=TOUCH?'or tap anywhere':'or press Space';
  $('mStats').innerHTML=`<span class="chip">BEST <b>${fmt(best)}</b></span><span class="chip">PLATES CUT <b>${fmt(save.carves)}</b></span><span class="chip">LAPS <b>${fmt(save.laps)}</b></span><span class="chip">FEATS <b>${Object.keys(save.feats).length}/${FEATS.length}</b></span>`;
  $('mKeys').textContent=TOUCH?'':'Space / click = hop · P pause · M mute';show('ovMenu');}
function start(){AU.unlock();scene='play';paused=false;overShown=false;newRun(false);toast('CONTAINMENT ONLINE','t');show(null);cv.focus({preventScroll:true});}
function showOver(){overShown=true;overAt=performance.now();const sc=G.score,nx=nextRank(best);
  $('oTitle').textContent=G.newBest?'NEW BEST':G.carves+G.burns>=12?'DEMOLITION CREW':G.topTier>=4?'LAST-GASP ARTIST':G.laps>=20?'LONG SHIFT':'CORE BREACH';$('oTitle').style.color=G.newBest?'var(--tl)':'var(--am)';
  $('oScore').textContent=fmt(sc);$('oBest').textContent=G.newBest?'personal best!':best-sc<best*.08?'only '+fmt(best-sc)+' from your best':'best '+fmt(best)+(nx?' · '+fmt(nx.min-best)+' to '+nx.name:'');
  $('oCause').textContent=G.cause+' on lap '+(G.laps+1);
  $('oStats').innerHTML=[['HOP',G.topTier>=0?TIERS[G.topTier].name:'—'],['CHAIN',G.bestChain],['CUT',G.carves+G.burns],['LAPS',G.laps],['TIME',G.t.toFixed(1)+'s']].map(a=>`<span class="chip">${a[0]} <b>${a[1]}</b></span>`).join('')+
    G.newFeats.map(f=>`<span class="chip new">★ ${f}</span>`).join('');$('oHint').textContent=TOUCH?'tap anywhere':'space';show('ovOver');}
function setPaused(p){if(scene!=='play'||!G.alive||p===paused)return;paused=p;tapQ=0;$('bPMute').textContent='SOUND: '+(AU.muted?'OFF':'ON');show(p?'ovPause':null);if(p)$('bResume').focus();else cv.focus({preventScroll:true});}
function toggleMute(){AU.setMuted(!AU.muted);$('bMute').classList.toggle('off',AU.muted);$('bPMute').textContent='SOUND: '+(AU.muted?'OFF':'ON');}
const canRetry=()=>scene==='over'&&overShown&&(manual||performance.now()-overAt>350);

/* ---------- input: one button (any pointer, Space / Enter / arrows / W) ---------- */
function tap(){AU.unlock();if(scene==='play'&&!paused){if(G.alive)tapQ++;}else if(scene==='menu')start();else if(canRetry())start();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{window.focus();cv.focus({preventScroll:true});}catch(_){ }if(scene==='play')tap();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
for(const id of['ovMenu','ovOver'])$(id).addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;tap();});
const TAPK=['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS'];
window.addEventListener('keydown',e=>{
  if(TAPK.includes(e.code))e.preventDefault();if(e.repeat)return;
  if(e.code==='KeyM'){toggleMute();return;}
  if(scene==='over'){if(e.code==='Escape')toMenu();else if(TAPK.includes(e.code)||e.code==='KeyR')tap();return;}
  if(scene==='menu'){if(e.code==='Space'||e.code==='Enter')start();return;}
  if(e.code==='Escape'||e.code==='KeyP'){setPaused(!paused);return;}
  if(paused){if(e.code==='Space')setPaused(false);return;}
  if(e.code==='KeyR'){start();return;}
  if(TAPK.includes(e.code))tap();
});
const click=(id,fn)=>$(id).addEventListener('click',e=>{AU.unlock();AU.ui();fn(e);e.currentTarget.blur();});
click('bPlay',start);click('bPause',()=>setPaused(true));click('bMute',toggleMute);click('bPMute',toggleMute);click('bResume',()=>setPaused(false));click('bRestart',start);click('bQuit',toMenu);click('bMenu',toMenu);
click('bAgain',()=>{if(canRetry())start();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!NOPAUSE)setPaused(true);});
window.addEventListener('blur',()=>{if(!NOPAUSE)setPaused(true);});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  if(!manual&&!paused){acc+=dt;let n=0;while(acc>=STEP&&n++<14){tick(STEP);acc-=STEP;}if(acc>STEP)acc=0;}
  render();requestAnimationFrame(frame);}
window.__gdl={
  get state(){const g=G,w=g.w;return{mode:scene,paused,demo:g.demo,seed:g.seed,t:g.t,phi:g.phi,tr:g.tr,dir:g.dir,w,alive:g.alive,score:Math.floor(g.score),best,mult:g.mult,chain:g.chain,bestChain:g.bestChain,
    surge:g.surge,blade:g.blade,fuse:g.fuse,inv:g.inv,laps:g.laps,hops:g.hops,grazes:g.grazes,tucks:g.tucks,carves:g.carves,burns:g.burns,cellsGot:g.cellsGot,blades:g.blades,flips:g.flips,flipT:g.flipT,lazy:g.lazyN,
    topTier:g.topTier,cause:g.cause,muted:AU.muted,feats:Object.keys(save.feats).length,runs:save.runs,overShown,ts:g.ts,cells:g.cells.length,
    plates:g.plates.map(p=>{const i=inn(p);return{id:p.id,tr:p.tr,live:p.live,len:p.len,hp:p.hp,a:p.a,inside:i<p.len,tau:i<p.len?-i/w:ahead(p)/w,past:(i-p.len)/w};})};},
  manual(b){manual=!!b;acc=0;},advance(s){for(let n=Math.round(s/STEP);n>0;n--)tick(STEP);},tap(){tap();},cheat(o){Object.assign(G,o);},
  const:{STEP,LATE,TUCK,INSET,TFOR,WIN,BLADE_T,TIERS:TIERS.map(t=>t.name)}};
resize();$('bMute').classList.toggle('off',AU.muted);toMenu();
if(AUTOSTART){scene='play';newRun(false);show(null);}
requestAnimationFrame(frame);
</script>
</body>
