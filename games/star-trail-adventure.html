<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Star Trail Adventure</title>
<meta name="description" content="Run, jump and air-dash a little star-lamp along three floating night-sky trails, gathering shards and hidden comets on the way to each beacon.">
<meta name="gdl:genre" content="Platformer, Adventure">
<meta name="gdl:controls" content="touch, mouse, keyboard">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1030;font-family:"Space Grotesk",system-ui,sans-serif;color:#fff6e0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gc{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .35s}
#hud.on{opacity:1}
.chip{background:rgba(11,16,48,.72);border:1.5px solid rgba(255,246,224,.28);border-radius:14px;padding:6px 12px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(3px)}
#tl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#sparks i{display:inline-block;width:14px;height:14px;margin-right:3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffd76a 55%,#ff9a3c);box-shadow:0 0 8px #ffd76a;transition:all .25s}
#sparks i.off{background:#39406b;box-shadow:none;transform:scale(.7)}
.gem{width:11px;height:11px;background:#ffd76a;transform:rotate(45deg);box-shadow:0 0 6px #ffd76a}
#comets{letter-spacing:2px;color:#4b5387}#comets b{color:#7df9ff;text-shadow:0 0 8px #7df9ff}
#tc{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center}
#stageName{font:400 13px "Bungee",sans-serif;letter-spacing:.08em;color:#ffd76a;text-shadow:0 2px 0 #0b1030}
#timer{font:700 20px "JetBrains Mono",monospace;text-shadow:0 2px 0 #0b1030}
#tr{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.ib{width:46px;height:46px;border-radius:14px;border:1.5px solid rgba(255,246,224,.35);background:rgba(11,16,48,.72);color:#fff6e0;font:700 17px "Space Grotesk",sans-serif;cursor:pointer}
.ib.off{opacity:.5;text-decoration:line-through}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,8px);z-index:6;pointer-events:none;background:rgba(11,16,48,.82);border:1.5px solid rgba(125,249,255,.5);border-radius:14px;padding:9px 16px;font-size:15px;font-weight:500;text-align:center;max-width:86vw;opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{color:#7df9ff}
#big{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:6;pointer-events:none;font:400 clamp(26px,7vw,54px) "Bungee",sans-serif;color:#ffd76a;text-shadow:0 4px 0 #0b1030,0 0 24px rgba(255,215,106,.6);opacity:0;transform:scale(.7);transition:opacity .3s,transform .3s}
#big.on{opacity:1;transform:scale(1)}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#fff;opacity:0}
#touch{position:fixed;inset:0;z-index:7;display:none;pointer-events:none}
body.touch.playing #touch{display:block}
#pad{position:absolute;inset:calc(66px + env(safe-area-inset-top)) 0 0 0;pointer-events:auto}
#stickBase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(255,246,224,.4);background:rgba(11,16,48,.35);left:84px;bottom:84px;top:auto;opacity:.55}
#stickNub{position:absolute;width:52px;height:52px;left:30px;top:30px;border-radius:50%;background:rgba(255,246,224,.75)}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(255,246,224,.6);background:rgba(11,16,48,.5);color:#fff6e0;font:700 14px "Space Grotesk",sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.tb.dn{background:rgba(255,215,106,.55);transform:scale(.94)}
#bJump{width:96px;height:96px;right:calc(16px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));font-size:16px;border-color:#ffd76a}
#bDash{width:72px;height:72px;right:calc(120px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));border-color:#7df9ff}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(circle at 50% 30%,rgba(60,40,120,.35),rgba(6,8,26,.72));opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.card{width:min(94vw,480px);max-height:97vh;overflow:auto;background:linear-gradient(180deg,rgba(26,30,78,.95),rgba(12,14,44,.96));border:1.5px solid rgba(255,246,224,.3);border-radius:24px;padding:20px 20px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font:400 clamp(30px,8.4vw,48px)/1 "Bungee",sans-serif;color:#ffd76a;text-shadow:0 4px 0 #2a1c5a,0 0 26px rgba(255,215,106,.45)}
h1 small{display:block;font:600 14px "Space Grotesk",sans-serif;letter-spacing:.3em;color:#7df9ff;margin-top:6px;text-shadow:none}
h2{font:400 26px "Bungee",sans-serif;color:#ffd76a;margin-bottom:6px}
.card p{font-size:14.5px;line-height:1.4;margin:8px 0;color:#d9dcf5}
.card p b{color:#7df9ff}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.stg{border-radius:16px;border:1.5px solid rgba(255,246,224,.3);background:rgba(255,255,255,.06);color:#fff6e0;padding:10px 4px;min-height:86px;font:600 13px "Space Grotesk",sans-serif;cursor:pointer}
.stg b{display:block;font:400 22px "Bungee",sans-serif;color:#ffd76a}
.stg i{display:block;font-style:normal;font-size:12px;opacity:.75;margin-top:2px}
.stg.lock{opacity:.4}
.btn{display:block;width:100%;margin-top:9px;padding:12px;min-height:48px;border-radius:15px;border:0;background:linear-gradient(180deg,#ffe08a,#ffb84a);color:#2a1c5a;font:700 18px "Space Grotesk",sans-serif;cursor:pointer;box-shadow:0 5px 0 #a8641c}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8641c}
.btn.alt{background:rgba(255,255,255,.1);color:#fff6e0;box-shadow:none;border:1.5px solid rgba(255,246,224,.35);font-size:15px;min-height:44px;padding:9px}
.sub{font-size:12.5px!important;opacity:.75}
#rank{font:400 76px/1 "Bungee",sans-serif;color:#7df9ff;text-shadow:0 5px 0 #2a1c5a,0 0 30px rgba(125,249,255,.6);margin:2px 0}
.rows{display:grid;grid-template-columns:auto auto;gap:3px 18px;justify-content:center;font-size:14.5px;margin:8px 0;text-align:left}
.rows b{text-align:right;font-family:"JetBrains Mono",monospace}
@media (max-height:440px){.card{width:min(96vw,680px);padding:10px 18px}h1{font-size:28px}h1 small{display:inline;margin-left:10px}.stages{margin:6px 0}.stg{min-height:60px;padding:6px}.card p{margin:4px 0;font-size:13px}.btn{margin-top:6px;min-height:44px;padding:8px}#rank{font-size:48px;display:inline-block;margin-right:16px}#bJump{width:86px;height:86px;bottom:calc(18px + env(safe-area-inset-bottom))}#stickBase{bottom:70px}}
@media (max-width:480px){#tc{top:calc(64px + env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="flash"></div>
<div id="hud">
  <div id="tl"><div class="chip" id="sparks"></div><div class="chip"><i class="gem"></i><span id="shards">0/0</span><span id="comets"></span></div></div>
  <div id="tc"><div id="stageName"></div><div id="timer">0:00.0</div></div>
  <div id="tr"><button class="ib" id="bMute" aria-label="Sound">♪</button><button class="ib" id="bPause" aria-label="Pause">II</button></div>
</div>
<div id="toast"></div><div id="big"></div>
<div id="touch"><div id="pad"><div id="stickBase"><div id="stickNub"></div></div></div><div class="tb" id="bDash">DASH</div><div class="tb" id="bJump">JUMP</div></div>

<div class="ov on" id="ovTitle"><div class="card">
  <h1>Star Trail<small>ADVENTURE</small></h1>
  <p>The Kite constellation has come loose. Guide <b>Lumi</b> along each floating trail, gather the fallen <b>shards</b> and relight the beacon.</p>
  <div class="stages" id="stages"></div>
  <p class="sub" id="how"></p>
  <button class="btn" id="bPlay">Play</button>
  <p class="sub" id="totalBest"></p>
</div></div>
<div class="ov" id="ovPause"><div class="card"><h2>Paused</h2>
  <button class="btn" id="bResume">Resume</button><button class="btn alt" id="bRetryP">Restart trail</button><button class="btn alt" id="bMenuP">All trails</button>
</div></div>
<div class="ov" id="ovEnd"><div class="card">
  <h2 id="endTitle"></h2><div id="rank"></div><p id="endText"></p><div class="rows" id="endRows"></div>
  <button class="btn" id="bEnd1"></button><button class="btn alt" id="bEnd2"></button><button class="btn alt" id="bEnd3">All trails</button>
</div></div>

<script type="module">
import * as THREE from '../vendor/three-r128/three.module.js';
/* ───────────── params / helpers ───────────── */
const QS=new URLSearchParams(location.search);
const AUTOSTART=QS.get('autostart')==='1',NOPAUSE=QS.get('nopause')==='1',QMUTE=QS.get('mute')==='1';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const BEST_KEY='gdl:best:games/star-trail-adventure',SAVE_KEY='gdl:save:games/star-trail-adventure';
const TAU=Math.PI*2,hyp=Math.hypot,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,damp=(a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));

const $=id=>document.getElementById(id);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const fmtT=t=>Math.floor(t/60)+':'+(t%60<10?'0':'')+(t%60).toFixed(1);

/* ───────────── audio ───────────── */
let AC=null,master=null,sfxBus=null,musBus=null,noiseBuf=null,muted=QMUTE||!!lsGet(SAVE_KEY,{}).muted;
function initAudio(){

  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.85;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;sfxBus=AC.createGain();musBus=AC.createGain();musBus.gain.value=.55;

}

const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28];
const SFX={
  jump(){tone(330+Math.random()*30,.16,{to:660,vol:.16,type:'triangle'});},
  land(v){tone(150,.09,{to:70,vol:clamp(v/40,.08,.3)});noise(.05,{type:'lowpass',f:900,vol:clamp(v/60,.04,.16)});},
  dash(){noise(.2,{f:600,to:3600,q:1.3,vol:.2,a:.01});tone(520,.16,{to:1040,type:'sawtooth',vol:.05});},
  shard(n){const f=784*Math.pow(2,SCALE[Math.min(n,SCALE.length-1)]/12);tone(f,.2,{vol:.13});tone(f*2,.12,{vol:.05,delay:.015});tone(f*3,.08,{vol:.02,delay:.03});},
  comet(){[0,4,7,11,14,19].forEach((s,i)=>{tone(659*Math.pow(2,s/12),.5,{delay:i*.07,vol:.12});tone(1318*Math.pow(2,s/12),.3,{delay:i*.07+.02,vol:.04});});},
  cp(){[0,7,12].forEach((s,i)=>tone(523*Math.pow(2,s/12),.4,{delay:i*.1,vol:.16,type:'triangle'}));},
  bounce(){tone(180,.26,{to:720,vol:.25,type:'triangle'});tone(360,.2,{to:1440,vol:.08});},
  crumble(){noise(.5,{type:'lowpass',f:500,to:120,vol:.22,a:.05});},
  crack(){noise(.07,{f:2600,q:.6,vol:.12});},
  fall(){tone(700,.5,{to:110,vol:.18,type:'triangle'});},
  hit(){tone(300,.25,{to:80,type:'sawtooth',vol:.18});noise(.14,{f:900,to:300,q:.6,vol:.2});},
  respawn(){tone(392,.14,{vol:.12,type:'triangle'});tone(587,.2,{vol:.12,type:'triangle',delay:.08});},
  clear(){[0,4,7,12,16,19,24].forEach((s,i)=>tone(523*Math.pow(2,s/12),.5,{delay:i*.1,type:'triangle',vol:.18}));},
  fail(){[7,3,0,-5].forEach((s,i)=>tone(330*Math.pow(2,s/12),.4,{delay:i*.2,type:'triangle',vol:.16}));},
  ui(){tone(880,.05,{vol:.08,type:'triangle'});}
};
/* music: a slow lydian arpeggio; bass, shimmer and pulse layers join as the trail is climbed */
const Mus={on:false,step:0,next:0};const CH=[[0,7,12,16,18],[-3,4,9,12,16],[5,12,16,19,21],[2,9,14,18,21]];const ARP=[0,2,1,3,2,4,3,1];
function musStep(s,t){const bar=Math.floor(s/16)%4,st=s%16,ch=CH[bar],k=G.frac,root=220;const N=(semi,dur,o)=>tone(root*Math.pow(2,semi/12),dur,Object.assign({absT:t,mus:true},o));
  if(st%2===0)N(ch[ARP[(st/2)%8]]+12,.5,{vol:.07,type:'triangle'});
  if(st===0){N(ch[0],3,{vol:.045,a:.6});N(ch[1],3,{vol:.03,a:.6});}
  if(k>.2&&(st===0||st===10))N(ch[0]-12,.5,{vol:.12,type:'triangle'});
  if(k>.45&&st%4===2)noise(.03,{absT:t,type:'highpass',f:7000,vol:.03,mus:true});
  if(k>.7&&st%2===1)N(ch[ARP[((st-1)/2+3)%8]]+24,.25,{vol:.03});
  if(k>.45&&st%8===0)tone(110,.12,{absT:t,to:48,vol:.14,mus:true});}
setInterval(()=>{if(!AC||!Mus.on||muted||AC.state!=='running')return;if(Mus.next<AC.currentTime)Mus.next=AC.currentTime+.05;const sp=60/104/4;while(Mus.next<AC.currentTime+.2){musStep(Mus.step,Mus.next);Mus.next+=sp;Mus.step++;}},70);
function setMuted(m){muted=m;if(master)master.gain.value=m?0:.85;$('bMute').classList.toggle('off',m);if(!QMUTE){const s=lsGet(SAVE_KEY,{});s.muted=m;lsSet(SAVE_KEY,s);}}

/* ───────────── renderer / scene ───────────── */
const renderer=new THREE.WebGLRenderer({canvas:$('gc'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(55,1,.3,600);
scene.add(new THREE.HemisphereLight(0xc4caff,0x3a2a6a,.62));const moonL=new THREE.DirectionalLight(0xfff0d0,.5);moonL.position.set(-6,14,8);scene.add(moonL);
let portrait=false;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;portrait=w<h;camera.fov=portrait?68:55;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
/* sky dome, stars, moon */
(function sky(){
  const g=new THREE.SphereGeometry(400,24,16),pos=g.attributes.position,col=new Float32Array(pos.count*3),c=new THREE.Color(),top=new THREE.Color(0x070b2a),mid=new THREE.Color(0x2a1f6e),hor=new THREE.Color(0xa0489a),low=new THREE.Color(0x1a2a5a);
  for(let i=0;i<pos.count;i++){const y=pos.getY(i)/400;if(y>.25)c.copy(mid).lerp(top,(y-.25)/.75);else if(y>-.05)c.copy(hor).lerp(mid,(y+.05)/.3);else c.copy(hor).lerp(low,clamp((-.05-y)/.5,0,1));col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}

  const N=700,sp=new Float32Array(N*3),sc=new Float32Array(N*3);let s=12345;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  for(let i=0;i<N;i++){const a=r()*TAU,e=Math.asin(clamp(r()*1.5-.5,-1,1)),R=380;sp[i*3]=Math.cos(a)*Math.cos(e)*R;sp[i*3+1]=Math.sin(e)*R;sp[i*3+2]=Math.sin(a)*Math.cos(e)*R;const b=.5+r()*.5;c.setHSL(.55+r()*.2,.5,b*.8);sc[i*3]=c.r;sc[i*3+1]=c.g;sc[i*3+2]=c.b;}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
  starPts=new THREE.Points(sg,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,transparent:true,depthWrite:false}));starPts.renderOrder=-9;scene.add(starPts);
})();
var skyDome,starPts;
function glowTex(inner,outer){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,1,32,32,32);g.addColorStop(0,inner);g.addColorStop(.3,outer);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const TEX={gold:glowTex('rgba(255,250,220,1)','rgba(255,205,90,.5)'),cyan:glowTex('rgba(240,255,255,1)','rgba(110,230,255,.5)'),moon:glowTex('rgba(255,250,235,1)','rgba(255,240,200,.16)'),pink:glowTex('rgba(255,160,200,.9)','rgba(255,60,140,.35)')};
const sprite=(tex,s,op)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op==null?1:op}));sp.scale.setScalar(s);return sp;};
const moon=sprite(TEX.moon,120,.95);moon.material.fog=false;scene.add(moon);

/* ───────────── stage building ───────────── */
const THEMES=[{top:0x8fe3c9,side:0x35608a,under:0x24395e,glow:0x7df9ff,name:'First Light'},{top:0xf6b3e0,side:0x6a4a9c,under:0x3b2a66,glow:0xff8ad8,name:'Driftway'},{top:0xffe0a0,side:0x9a5a7a,under:0x56304f,glow:0xffd76a,name:'The Crown'}];
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];

  const P=Pl,rx=lerp(P.px,P.x,alpha),ry=lerp(P.py,P.y,alpha),rz=lerp(P.pz,P.z,alpha),t=performance.now()*.001;
  /* Lumi */
  const g=P.g;g.position.set(rx,ry,rz);g.rotation.y=P.face;const spd=hyp(P.vx,P.vz);P.run+=dt*spd*2.2;
  P.sq=damp(P.sq,1,10,dt);let sy=P.sq;if(!P.ground)sy*=1+clamp(Math.abs(P.vy)*.012,0,.22);lumi.body.scale.set(1/Math.sqrt(sy),sy,1/Math.sqrt(sy));

  lumi.body.position.y=P.ground?Math.abs(Math.sin(P.run))*.07*clamp(spd/PH.speed,0,1):0;
  const sw=Math.sin(P.run),k=P.ground?clamp(spd/PH.speed,0,1):0;lumi.feet[0].position.set(-.2,.07+Math.max(0,sw)*.14*k,.03+sw*.24*k);lumi.feet[1].position.set(.2,.07+Math.max(0,-sw)*.14*k,.03-sw*.24*k);if(!P.ground){lumi.feet[0].position.y=lumi.feet[1].position.y=.12;}
  lumi.tails.forEach((tl,i)=>{tl.rotation.x=-.3+clamp(spd*.05,0,.5)+Math.sin(t*9+i)*.15;tl.rotation.y=Math.sin(t*7+i*2)*.2;});

  if(G.mode==='play'&&(spd>3||!P.ground)&&Math.random()<dt*(P.dashT>0?120:26))puff(rx+(Math.random()-.5)*.3,ry+.3+Math.random()*.4,rz+(Math.random()-.5)*.3,P.dashT>0?[0x7df9ff,0xffffff]:[0xffd76a,0xfff2cf,0xff8ad8],1,.4,.5,.7,1);
  /* blob shadow + landing ring: project straight down onto the highest surface below */
  let gy=-1e9;for(const p of W.pl){if(!p.on)continue;if(Math.abs(rx-p.x)<p.hx+.05&&Math.abs(rz-p.z)<p.hz+.05){const top=p.y+.5;if(top<=ry+.3&&top>gy)gy=top;}}
  if(gy>-1e8&&g.visible){const h=ry-gy;blob.visible=true;blob.position.set(rx,gy+.03,rz);blob.scale.setScalar(clamp(.5-h*.035,.2,.5));blob.material.opacity=clamp(.55-h*.03,.25,.55);landRing.visible=h>.6;landRing.position.set(rx,gy+.04,rz);landRing.scale.setScalar(.45+Math.sin(t*10)*.03);landRing.material.opacity=clamp(h*.4,.3,.85);}else{blob.visible=false;landRing.visible=false;}
  /* stage objects */
  for(const p of W.pl){if(p.mesh){let ox=0,oy=0;if(p.kind==='crumble'){if(p.st===1){ox=(Math.random()-.5)*.09;oy=-p.t*.1;}p.mesh.visible=p.on;if(p.st===0&&p.mesh.scale.x<1)p.mesh.scale.setScalar(Math.min(1,p.mesh.scale.x+dt*4));if(p.st===2)p.mesh.scale.setScalar(.01);}
    if(p.kind==='bounce'){p.t=Math.max(0,p.t-dt);p.body.scale.y=1-Math.sin(p.t/.3*Math.PI)*.5;}p.mesh.position.set(p.x+ox,p.y+oy,p.z);}}
  const sm=W.shardMesh;for(let i=0;i<W.shards.length;i++){const s=W.shards[i];if(s.on){_o.position.set(s.x,s.y+Math.sin(t*2.4+s.ph)*.12,s.z);_o.rotation.set(0,t*2.5+s.ph,0);_o.scale.set(1,1.5,1);}else{_o.position.set(0,-999,0);_o.scale.setScalar(0);}_o.updateMatrix();sm.setMatrixAt(i,_o.matrix);}sm.instanceMatrix.needsUpdate=true;_o.rotation.set(0,0,0);
  for(const c of W.comets)if(c.on){c.mesh.rotation.y=t*1.6;c.mesh.position.y=c.y+Math.sin(t*2+c.x)*.15;}
  for(const u of W.urchins){u.g.position.set(u.x,u.y+Math.sin(t*6)*.06,u.z);u.g.rotation.y=t*2;u.g.rotation.x=t*1.3;}
  for(const s of W.sweeps)s.g.rotation.y=s.a;
  for(const c of W.cps)if(c.on){c.orb.scale.setScalar(.3+Math.sin(t*5)*.03);}
  if(W.finish){W.finish.cr.rotation.y=t*1.2;W.finish.cr.position.y=2+Math.sin(t*2)*.15;W.finish.beam.material.opacity=.18+Math.sin(t*3)*.05;}
  updTrail(dt);

  let tgtYaw=camYaw;const ref=P.ground&&P.ground.route?P.ground:null;if(ref)camRef=ref;if(G.mode==='title'){camOff+=dt*.12;}else if(camRef)tgtYaw=-camRef.camH*Math.PI/2;
  camYaw+=angDiff(camYaw,tgtYaw)*(1-Math.exp(-2.4*dt));camOff+=camKey*dt*1.8;if(camKey)camHold=2.5;camHold-=dt;if(camHold<=0&&G.mode!=='title')camOff=damp(camOff,0,2.5,dt);camOff=clamp(camOff,-1e9,1e9);

  camP.x=damp(camP.x,_v.x,9,dt);camP.z=damp(camP.z,_v.z,9,dt);camP.y=damp(camP.y,_v.y,6,dt);camL.x=damp(camL.x,tx,12,dt);camL.z=damp(camL.z,tz,12,dt);camL.y=damp(camL.y,camY+1,8,dt);

  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}if(bigT>0){bigT-=dt;if(bigT<=0)$('big').classList.remove('on');}
  if(G.mode!=='title'&&G.mode!=='end'){$('timer').textContent=fmtT(G.time);renderHud();}

const _v=new THREE.Vector3();let camRef=null;
function pause(){if(G.mode!=='play'&&G.mode!=='respawn'||G.paused)return;G.paused=true;$('ovPause').classList.add('on');if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
function resume(){if(!G.paused)return;G.paused=false;$('ovPause').classList.remove('on');if(AC)AC.resume().catch(()=>{});last=performance.now();acc=0;}
function togglePause(){if(G.paused)resume();else pause();}
$('bPlay').onclick=()=>{SFX.ui();const n=SAVE.stages.findIndex((s,i)=>i<SAVE.unlocked&&!s.done);startStage(n<0?0:n);};
$('bPause').onclick=()=>{initAudio();togglePause();};$('bResume').onclick=resume;$('bRetryP').onclick=()=>{resume();startStage(G.stage);};$('bMenuP').onclick=()=>{resume();showTitle();};$('bEnd3').onclick=()=>{SFX.ui();showTitle();};$('bMute').onclick=()=>{initAudio();setMuted(!muted);SFX.ui();};
let last=performance.now(),acc=0,manual=false,manualDt=0,dirty=true,slowT=0,lowQ=false;
function tickSim(sec){acc+=sec;let n=0;while(acc>=STEP&&n<14){readInput();simStep(STEP);if(G.mode==='clear'){G.endT-=STEP;if(G.endT<=0)endStage(true);}acc-=STEP;n++;}if(n===14)acc=0;}
function frame(now){
  requestAnimationFrame(frame);let fdt=Math.min(.1,(now-last)/1000);last=now;if(fdt<=0)return;
  if(G.paused){if(dirty){renderer.render(scene,camera);dirty=false;}return;}
  if(manual){fdt=manualDt;manualDt=0;}else if(G.mode==='play'||G.mode==='respawn'||G.mode==='clear')tickSim(fdt);else{G.simT=(G.simT||0)+fdt;updatePlatforms(fdt);}
  if(!manual&&!lowQ&&G.mode==='play'){slowT=fdt>.04?slowT+fdt:Math.max(0,slowT-fdt*2);if(slowT>3){lowQ=true;renderer.setPixelRatio(1);resize();}} /* adaptive quality */
  visuals(fdt,manual?1:clamp(acc/STEP,0,1));renderer.render(scene,camera);

buildPlayer();W=buildStage(0);placeAt(W.start.x,W.start.y,W.start.z,0);G.simT=0;setMuted(muted);showTitle();

  get state(){const P=Pl;return {mode:G.paused?'paused':G.mode,won:!!G.won,stage:G.stage,time:G.time,sparks:G.sparks,shards:G.shards,shardTotal:W.shards.length,comets:G.comets,cometTotal:W.comets.length,falls:G.falls,score:G.score,rank:G.rank,best:G.best,progress:G.progress,routeLen:W.route.length,unlocked:SAVE.unlocked,

  input(o){TI=o;},press(k){if(k==='jump')Pl.buf=PH.buf;else if(k==='dash')wantDash=true;},manual(v){manual=!!v;},start(i){startStage(i||0);},title:showTitle,pause,resume,
