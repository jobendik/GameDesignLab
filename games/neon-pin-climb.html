<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060817">
<title>Neon Pin Climb</title>
<meta name="description" content="A vertical pinball time-attack: flip the ball up the side lanes from floor to floor of an endless neon tower before the clock runs out — miss, and you fall back a floor.">
<meta name="gdl:genre" content="Arcade, Physics">
<meta name="gdl:controls" content="touch, mouse, keyboard">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root{--bg:#060817;--ink:#edf7ff;--mut:#8ea6cf;--cy:#58f7ff;--pk:#ff4fd8;--gd:#ffd25a;--gr:#7dff8a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Rajdhani,system-ui,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none;transition:opacity .25s}
body.carded #cv{opacity:.25}
#tb{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 6px);right:calc(env(safe-area-inset-right) + 6px);display:flex;gap:6px}
#tb button{width:44px;height:44px;border-radius:12px;border:1px solid rgba(88,247,255,.4);background:rgba(6,9,26,.82);color:var(--ink);font:700 16px Rajdhani,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}
body.carded #tb{display:none}
#ov{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
#ov.hide{display:none}
.card{width:min(480px,100%);max-height:100%;overflow:auto;border-radius:24px;border:1px solid rgba(88,247,255,.35);background:linear-gradient(180deg,#0d1640 0%,#070a1c 100%);padding:20px 18px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 60px rgba(255,79,216,.08) inset}
h1{font:900 40px/.95 Bungee,sans-serif;margin:4px 0 8px;color:#fff;text-shadow:0 0 18px rgba(88,247,255,.7),0 0 34px rgba(255,79,216,.4)}
h2{font:400 28px/1 Bungee,sans-serif;margin:2px 0 6px;color:var(--gd)}
.sub{color:var(--mut);font-size:16px;margin:0 0 8px;letter-spacing:.05em;font-weight:600}
.how{list-style:none;padding:0;margin:12px auto;display:grid;gap:6px;max-width:380px;text-align:left}
.how li{background:rgba(88,247,255,.07);border:1px solid rgba(88,247,255,.18);border-radius:10px;padding:6px 11px;font-size:17px;font-weight:600}
.how b{color:var(--cy)}
.btn{display:inline-block;min-width:150px;min-height:48px;margin:8px 4px 0;padding:10px 24px;border-radius:999px;border:0;background:linear-gradient(90deg,var(--cy),var(--pk));color:#07101d;font:400 18px Bungee,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:0 0 22px rgba(88,247,255,.4)}
.btn.alt{background:transparent;border:1px solid rgba(88,247,255,.5);color:var(--ink);box-shadow:none}
.keys{color:var(--mut);font-size:14px;margin-top:10px}
.stats{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.st{background:rgba(255,255,255,.05);border-radius:12px;padding:6px 12px;min-width:84px}
.st small{display:block;color:var(--mut);font-size:12px;letter-spacing:.14em;font-weight:700}
.st b{font:400 22px Bungee,sans-serif}
@media (max-height:500px){.card{padding:10px 14px}h1{font-size:28px}.how{margin:6px auto;gap:3px}.how li{padding:3px 9px;font-size:15px}.keys{display:none}.stats{margin:4px 0}.btn{min-height:44px;padding:8px 18px;margin-top:4px}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="tb"><button id="bMute" aria-label="Mute">&#9835;</button><button id="bPause" aria-label="Pause">II</button></div>
<div id="ov" class="hide"><div class="card" id="card"></div></div>
<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
const SEED = (parseInt(Q.get('seed'), 10) >>> 0) || ((Math.random() * 1e9) >>> 0);
const AUTOSTART = Q.get('autostart') === '1', NOPAUSE = Q.get('nopause') === '1';
const BEST_KEY = 'gdl:best:games/neon-pin-climb', MUTE_KEY = 'gdl:mute:games/neon-pin-climb', FLOOR_KEY = 'gdl:bestfloor:games/neon-pin-climb';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ld = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
let best = +ld(BEST_KEY) || 0, bestFloor = +ld(FLOOR_KEY) || 0, muted = Q.get('mute') === '1' || ld(MUTE_KEY) === true;

const W = 400, FH = 560, VH = 700, TICK = 1 / 120, SUB = 8, DT = TICK / SUB, G = 1500, BR = 9, VMAX = 2600, START_TIME = 35;
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, hyp = Math.hypot;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fxr = mulberry(SEED ^ 0x5bd1e995), FR = (a, b) => a + fxr() * (b - a);
const Y = (k, v) => -k * FH - v;
const ZONES = [['#58f7ff', '#ff4fd8'], ['#ff4fd8', '#ffd25a'], ['#ffd25a', '#7dff8a'], ['#7dff8a', '#58f7ff'], ['#b18cff', '#ff4fd8']];
const zoneOf = k => ZONES[Math.floor(k / 5) % ZONES.length];

// ───────────────────────── tower generation (lazy, seeded per floor)
let S = null, mode = 'menu', paused = false, manual = false, tickN = 0, runN = 0, overAt = 0;
const hookHeld = [false, false];
function buildFloor(k) {
  const r = mulberry((S.seed ^ Math.imul(k + 1, 0x9E3779B1)) >>> 0), R = (a, b) => a + r() * (b - a);
  const zc = zoneOf(k), F = { k, segs: [], circ: [], dyn: [], items: [], targets: [], lane: [true, true], charged: false, kit: '', zc };
  const seg = (x1, v1, x2, v2, rad = 4, o = {}) => F.segs.push(Object.assign({ x1, y1: Y(k, v1), x2, y2: Y(k, v2), r: rad, e: .45, ow: false, kind: 'rail' }, o));
  const circ = (x, v, rad, kind, o = {}) => { const c = Object.assign({ x, y: Y(k, v), r: rad, kind, fl: 0, cd: 0 }, o); F.circ.push(c); return c; };
  // shell: outer walls, lane inner walls + caps + one-way lids (to the floor above), slopes
  seg(16, -10, 16, FH + 10, 5, { kind: 'wall' }); seg(384, -10, 384, FH + 10, 5, { kind: 'wall' });
  seg(140, 330, 58, 446, 4, { kind: 'lane' }); seg(58, 446, 58, 730, 4, { kind: 'lane' }); seg(260, 330, 342, 446, 4, { kind: 'lane' }); seg(342, 446, 342, 730, 4, { kind: 'lane' });
  seg(16, 742, 66, 802, 5, { kind: 'cap', e: .3 }); seg(384, 742, 334, 802, 5, { kind: 'cap', e: .3 });
  seg(16, 742, 52, 732, 4, { kind: 'lid', ow: true, e: .2 }); seg(384, 742, 348, 732, 4, { kind: 'lid', ow: true, e: .2 });
  seg(58, 160, 99, 78, 4, { kind: 'slope', e: .3 }); seg(342, 160, 301, 78, 4, { kind: 'slope', e: .3 });
  if (k === 0) { seg(16, 182, 52, 172, 4, { kind: 'lid' }); seg(384, 182, 348, 172, 4, { kind: 'lid' }); seg(58, 0, 58, 170, 4, { kind: 'lane' }); seg(342, 0, 342, 170, 4, { kind: 'lane' }); seg(16, 0, 58, 0, 4, { kind: 'wall' }); seg(342, 0, 384, 0, 4, { kind: 'wall' }); }
  F.flips = [110, 290].map((x, i) => ({ dir: i ? -1 : 1, px: x, py: Y(k, 70), len: 78, rb: 9, rt: 5, a: 35 * Math.PI / 180, w: 0, rest: 35 * Math.PI / 180, up: -24 * Math.PI / 180, held: false, glow: 0, hitCd: 0 }));
  // lane closures from floor 3
  if (k >= 3 && r() < .3 + Math.min(.3, k * .02)) { const s = r() < .5 ? 0 : 1; F.lane[s] = false; if (s === 0) seg(16, 458, 58, 444, 4, { kind: 'block' }); else seg(384, 458, 342, 444, 4, { kind: 'block' }); }
  // playfield kit
  const kits = k === 0 ? ['intro'] : k < 5 ? ['triad', 'pegs', 'posts', 'spinner'] : ['triad', 'pegs', 'posts', 'spinner', 'slider', 'orbit'];
  const kit = kits[Math.floor(r() * kits.length)]; F.kit = kit;
  const bump = (x, v, rad = 17) => circ(x, v, rad, 'bumper');
  const sp = 1 + Math.min(1.2, k * .05);
  switch (kit) {
    case 'intro': bump(200, 370, 18); bump(95, 245, 15); bump(305, 245, 15); break;
    case 'triad': bump(200, 340); bump(140, 255); bump(260, 255); break;
    case 'pegs': for (let row = 0; row < 4; row++) for (let i = 0; i < (row % 2 ? 5 : 6); i++) circ(95 + i * 42 + (row % 2 ? 21 : 0), 215 + row * 46, 5, 'peg'); bump(200, 400, 14); break;
    case 'posts': seg(150, 260, 150, 340, 6, { kind: 'post', e: .6 }); seg(250, 260, 250, 340, 6, { kind: 'post', e: .6 }); bump(200, 300, 16); bump(100, 230, 13); bump(300, 230, 13); break;
    case 'spinner': F.dyn.push({ t: 'spin', cx: 200, cy: Y(k, 310), len: 120, r: 6, w: (r() < .5 ? -1 : 1) * 1.5 * sp, a: r() * TAU }); bump(110, 230, 14); bump(290, 230, 14); break;
    case 'slider': F.dyn.push({ t: 'slide', cx: 200, cy: Y(k, 380), amp: 95, len: 70, r: 6, w: 1.1 * sp, a: r() * TAU }); bump(140, 255); bump(260, 255); break;
    case 'orbit': for (let i = 0; i < 2; i++) F.dyn.push({ t: 'orb', cx: 200, cy: Y(k, 300), R: 78, r: 15, w: .9 * sp, a: i * Math.PI, fl: 0, cd: 0 }); circ(200, 300, 8, 'peg'); break;
  }
  // three charge targets + a time crystal in free spots
  const free = (x, v, m) => F.circ.every(c => hyp(c.x - x, c.y - Y(k, v)) > c.r + m) && F.dyn.every(d => hyp((d.cx) - x, d.cy - Y(k, v)) > (d.R || d.len / 2 || 40) + m - 10) && !(v > 300 && (x < 150 || x > 250));
  for (let n = 0, t = 0; n < 3 && t < 200; t++) { const x = R(80, 320), v = R(190, 500); if (free(x, v, 30) && F.targets.every(q => hyp(q.x - x, q.y - Y(k, v)) > 50)) { const c = circ(x, v, 8, 'target', { lit: true }); F.targets.push(c); n++; } }
  for (let t = 0; t < 100; t++) { const x = R(80, 320), v = R(200, 520); if (free(x, v, 26) && F.targets.every(q => hyp(q.x - x, q.y - Y(k, v)) > 40)) { F.items.push({ x, y: Y(k, v), r: 10, got: false, ph: r() * TAU }); break; } }
  F.bonus = Math.max(4, 8 - Math.floor(k / 4));
  return F;
}
function floorAt(k) { while (S.floors.length <= k) S.floors.push(buildFloor(S.floors.length)); return S.floors[k]; }

// ───────────────────────── run
function newState(seed) {
  return { seed, time: START_TIME, score: 0, floors: [], ball: null, maxFloor: 0, cur: 0, streak: 0, t: 0, cam: Y(0, 300), camV: 0, drops: 0, charged: 0, crystals: 0, shake: 0, flash: 0, hurryT: 0, gates: 0, newBest: false };
}
function newRun() {
  runN++; S = newState((SEED + runN * 0x9E3779B1) >>> 0); floorAt(3);
  S.ball = { x: 200, y: Y(0, 420), vx: 0, vy: 0, tr: [], tn: 0, still: 0 };
  paused = false; hideCard(); mode = 'play'; sfx('start'); banner('FLOOR 0', 'shoot up a side lane', '#58f7ff');
}
const floorOf = y => Math.max(0, Math.floor(-y / FH));
function addScore(p, x, y, col, label) { S.score += Math.round(p); if (x != null) txt(x, y, (label ? label + ' ' : '') + '+' + Math.round(p), col || '#fff', label ? 16 : 13); }
function reachFloor(k) {
  S.maxFloor = k; floorAt(k + 3);
  const F = S.floors[k], below = S.floors[k - 1];
  S.streak++; const mult = Math.min(5, 1 + (S.streak - 1) * .5);
  let bonus = F.bonus + (below && below.charged ? 3 : 0);
  if (k % 5 === 0) bonus += 6;
  S.time += bonus; S.gates++;
  addScore(1000 * k * mult, S.ball.x, S.ball.y - 30, '#ffd25a', mult > 1 ? '×' + mult.toFixed(1) : 'CLIMB');
  banner(k % 5 === 0 ? 'ZONE ' + (k / 5 + 1) : 'FLOOR ' + k, '+' + bonus + ' s' + (mult > 1 ? '  ·  streak ×' + mult.toFixed(1) : ''), F.zc[0]);
  ring(S.ball.x, S.ball.y, '#ffd25a', 90); S.flash = .2; sfx('climb', k);
  if (S.score > best) { best = S.score; sv(BEST_KEY, best); }
  if (k > bestFloor) { bestFloor = k; sv(FLOOR_KEY, bestFloor); }
}
function gameOver() {
  mode = 'over'; overAt = performance.now(); clearInput();
  if (S.score > best) { best = S.score; sv(BEST_KEY, best); }
  if (S.score >= best && S.score > 0) S.newBest = true;
  sfx('over'); showOver();
}

// ───────────────────────── physics (fixed 120 Hz × 8 substeps; capsules + circles)
function stepFlip(f, dt) {
  if (f.held) f.w = Math.max(f.w - 3000 * dt, -22); else f.w = Math.min(f.w + 1900 * dt, 17);
  f.a += f.w * dt;
  if (f.a <= f.up) { f.a = f.up; if (f.w < 0) f.w = 0; }
  if (f.a >= f.rest) { f.a = f.rest; if (f.w > 0) f.w = 0; }
}
function resolve(b, nx, ny, pen, pvx, pvy, e, fr) {
  b.x += nx * pen; b.y += ny * pen;
  const rvx = b.vx - pvx, rvy = b.vy - pvy, vn = rvx * nx + rvy * ny;
  if (vn >= 0) return 0;
  const ee = -vn > 160 ? e : 0, j = -(1 + ee) * vn;
  b.vx += j * nx; b.vy += j * ny;
  const tx = -ny, ty = nx, vt = (b.vx - pvx) * tx + (b.vy - pvy) * ty;
  b.vx -= vt * tx * fr; b.vy -= vt * ty * fr;
  return -vn;
}
function segHit(b, x1, y1, x2, y2, r) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((b.x - x1) * dx + (b.y - y1) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const qx = x1 + dx * t, qy = y1 + dy * t, ex = b.x - qx, ey = b.y - qy, d = Math.sqrt(ex * ex + ey * ey), m = BR + r;
  if (d >= m) return null;
  if (d < 1e-6) { const l = Math.sqrt(l2) || 1; return { nx: dy / l, ny: -dx / l, pen: m, qx, qy }; }
  return { nx: ex / d, ny: ey / d, pen: m - d, qx, qy };
}
function flipHit(b, f) {
  const ca = Math.cos(f.a), sa = Math.sin(f.a), tx = f.dir * ca, ty = sa, dx = b.x - f.px, dy = b.y - f.py;
  if (dx * dx + dy * dy > (f.len + 30) * (f.len + 30)) return;
  let s = dx * tx + dy * ty; s = s < 0 ? 0 : s > f.len ? f.len : s;
  const rad = f.rb + (f.rt - f.rb) * s / f.len, qx = f.px + tx * s, qy = f.py + ty * s, ex = b.x - qx, ey = b.y - qy, d = Math.sqrt(ex * ex + ey * ey), m = BR + rad;
  if (d >= m) return;
  let nx, ny; if (d < 1e-6) { nx = -ty * f.dir; ny = tx * f.dir; if (ny > 0) { nx = -nx; ny = -ny; } } else { nx = ex / d; ny = ey / d; }
  const imp = resolve(b, nx, ny, m - d, s * f.w * (-f.dir * sa), s * f.w * ca, .38, .002);
  if (f.w < -4 && imp > 250 && !f.hitCd) { f.hitCd = .08; f.glow = 1; sfx('flip-hit', imp); spark(qx, qy, '#ffd25a', 5); }
}
function dynPose(d, t) {
  if (d.t === 'spin') { const a = d.a + d.w * t, hx = Math.cos(a) * d.len / 2, hy = Math.sin(a) * d.len / 2; d.x1 = d.cx - hx; d.y1 = d.cy - hy; d.x2 = d.cx + hx; d.y2 = d.cy + hy; }
  else if (d.t === 'slide') { const x = d.cx + Math.sin(d.a + d.w * t) * d.amp; d.vx = Math.cos(d.a + d.w * t) * d.amp * d.w; d.x1 = x - d.len / 2; d.x2 = x + d.len / 2; d.y1 = d.y2 = d.cy; }
  else { const a = d.a + d.w * t; d.x = d.cx + Math.cos(a) * d.R; d.y = d.cy + Math.sin(a) * d.R; d.vx = -Math.sin(a) * d.R * d.w; d.vy = Math.cos(a) * d.R * d.w; }
}
function substep(dt) {
  S.t += dt;
  const b = S.ball, k0 = floorOf(b.y);
  for (let k = Math.max(0, k0 - 2); k <= k0 + 2; k++) { const F = floorAt(k); for (const f of F.flips) stepFlip(f, dt); for (const d of F.dyn) dynPose(d, S.t); }
  b.vy += G * dt;
  const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy); if (sp > VMAX) { b.vx *= VMAX / sp; b.vy *= VMAX / sp; }
  const py = b.y; b.x += b.vx * dt; b.y += b.vy * dt;
  for (let k = Math.max(0, k0 - 1); k <= k0 + 1; k++) {
    const F = S.floors[k];
    for (const w of F.segs) {
      if (w.ow && b.vy < 0) continue;                       // one-way lids: only stop a falling ball
      const h = segHit(b, w.x1, w.y1, w.x2, w.y2, w.r); if (!h) continue;
      if (w.ow && py > Math.min(w.y1, w.y2)) continue;      // came from below: let it through
      const v = resolve(b, h.nx, h.ny, h.pen, 0, 0, w.e, .004); if (v > 450) sfx('wall', v);
    }
    for (const c of F.circ) {
      const ex = b.x - c.x, ey = b.y - c.y, d = Math.sqrt(ex * ex + ey * ey), m = BR + c.r; if (d >= m) continue;
      const nx = d > 1e-6 ? ex / d : 0, ny = d > 1e-6 ? ey / d : -1;
      const v = resolve(b, nx, ny, m - d, 0, 0, c.kind === 'peg' ? .5 : .55, 0);
      if (c.kind === 'bumper') { const out = b.vx * nx + b.vy * ny; if (out < 800) { b.vx += nx * (800 - out); b.vy += ny * (800 - out); } if (c.cd <= 0) { c.cd = .06; c.fl = 1; addScore(50, c.x, c.y - c.r - 8, F.zc[1]); sfx('bumper', c.r); S.shake = Math.max(S.shake, .07); } }
      else if (c.kind === 'target' && c.lit && v > 60) { c.lit = false; c.fl = 1; addScore(250, c.x, c.y - 18, F.zc[0]); sfx('target', F.targets.filter(q => !q.lit).length); burst(c.x, c.y, 12, F.zc[0], .9);
        if (F.targets.every(q => !q.lit) && !F.charged) { F.charged = true; S.charged++; S.time += 4; addScore(1000, c.x, c.y - 36, '#7dff8a', 'CHARGED +4s'); sfx('charge'); ring(c.x, c.y, '#7dff8a', 80); } }
      else if (c.kind === 'peg' && v > 200 && c.cd <= 0) { c.cd = .05; c.fl = 1; sfx('peg', c.x); addScore(10); }
    }
    for (const d of F.dyn) {
      if (d.t === 'orb') { const ex = b.x - d.x, ey = b.y - d.y, dd = Math.sqrt(ex * ex + ey * ey), m = BR + d.r; if (dd >= m) continue;
        const nx = ex / (dd || 1), ny = ey / (dd || 1); resolve(b, nx, ny, m - dd, d.vx, d.vy, .6, 0);
        const out = (b.vx - d.vx) * nx + (b.vy - d.vy) * ny; if (out < 800) { b.vx += nx * (800 - out); b.vy += ny * (800 - out); }
        if (d.cd <= 0) { d.cd = .06; d.fl = 1; addScore(50, d.x, d.y - 24, F.zc[1]); sfx('bumper', 15); } continue; }
      const h = segHit(b, d.x1, d.y1, d.x2, d.y2, d.r); if (!h) continue;
      let pvx = 0, pvy = 0; if (d.t === 'spin') { pvx = -d.w * (h.qy - d.cy); pvy = d.w * (h.qx - d.cx); } else pvx = d.vx;
      const v = resolve(b, h.nx, h.ny, h.pen, pvx, pvy, .55, 0); if (v > 200) { sfx('clank'); spark(h.qx, h.qy, F.zc[1], 4); }
    }
    for (const f of F.flips) flipHit(b, f);
    for (const it of F.items) if (!it.got && hyp(b.x - it.x, b.y - it.y) < BR + it.r) { it.got = true; S.time += 2; S.crystals++; addScore(150, it.x, it.y - 18, '#7dff8a', '+2s'); sfx('time'); burst(it.x, it.y, 14, '#7dff8a', 1); }
  }
}
function tick() {
  tickN++;
  if (!S || mode !== 'play') return;
  for (let i = 0; i < SUB; i++) substep(DT);
