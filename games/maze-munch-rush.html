<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vault Runner</title>
<meta name="description" content="A cat burglar sprints through procedurally built vaults: grab the keycards, flip gate switches to cut off a scent-tracking hound, an interceptor and a searchlight sweeper, then escape before the alarm closes in.">
<meta name="gdl:genre" content="Arcade, Action, Stealth">
<meta name="gdl:controls" content="touch, mouse, keyboard">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
:root{--ink:#e9fff7;--mint:#5df2c8;--key:#ffc24a;--alarm:#ff4d5e;--hound:#ff6a3d;--warden:#8f7dff;--sweep:#b6f24a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0c10}
body{font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;outline:none}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
.ib{width:44px;height:44px;border-radius:10px;border:1.5px solid rgba(233,255,247,.3);background:rgba(14,16,22,.85);color:var(--ink);font:700 16px "Chakra Petch",sans-serif;cursor:pointer}
.ib.off{color:rgba(233,255,247,.4);background:linear-gradient(135deg,transparent 45%,rgba(255,77,94,.85) 46%,rgba(255,77,94,.85) 54%,transparent 55%),rgba(14,16,22,.85)}
#bEmp{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;z-index:15;cursor:pointer;
  border:2px solid var(--mint);background:radial-gradient(circle at 50% 40%,#1d4d45,#0d1a1a);color:var(--ink);font:700 13px "Chakra Petch";letter-spacing:1px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bEmp.on{display:flex}#bEmp.dry{border-color:rgba(233,255,247,.2);color:rgba(233,255,247,.35);background:#121418}#bEmp b{font:700 20px "JetBrains Mono"}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(6,7,10,.8);
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ov.on{display:flex}
.card{width:min(94vw,420px);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch;padding:20px 18px;border-radius:14px;
  background:#15171f;border:2px solid #2c3140;box-shadow:0 0 0 4px #0b0c10,0 12px 60px rgba(0,0,0,.75);animation:rise .24s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
h1{font:700 46px/1 "Chakra Petch",sans-serif;letter-spacing:2px;color:var(--ink);text-shadow:0 0 18px rgba(93,242,200,.45)}
h1 small{display:block;font:600 12px "JetBrains Mono";letter-spacing:4px;color:var(--key);text-shadow:none;margin-bottom:6px}
h1 em{color:var(--mint);font-style:normal}
h2{font:700 30px/1.1 "Chakra Petch";color:var(--ink)}
.dim{font:500 13px "Chakra Petch";color:rgba(233,255,247,.58)}
.how{font:500 15px/1.4 "Chakra Petch";color:rgba(233,255,247,.9);text-align:left;display:flex;flex-direction:column;gap:7px}
.how div{display:flex;gap:10px;align-items:center}.how i{flex:0 0 26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 13px "JetBrains Mono";font-style:normal;color:#0b0c10}
.how b{color:var(--key)}
.btn{min-height:54px;border-radius:10px;border:2px solid var(--mint);background:linear-gradient(#1e5a4e,#103830);color:var(--ink);font:700 21px "Chakra Petch";letter-spacing:3px;cursor:pointer;padding:6px 12px}
.btn.sec{border:1.5px solid rgba(233,255,247,.32);background:#1d2029;font-size:16px;min-height:46px;letter-spacing:2px}
.btn:active{transform:scale(.97)}.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:500 12.5px "Chakra Petch";padding:3px 9px;border-radius:6px;background:rgba(233,255,247,.07);color:rgba(233,255,247,.85)}
.chip b{color:var(--key);font:700 12.5px "JetBrains Mono"}.chip.new{background:rgba(93,242,200,.16);color:#b9ffe9}
#oScore{font:700 56px/1 "JetBrains Mono";color:var(--ink);text-shadow:0 0 18px rgba(93,242,200,.4)}
.blk{display:flex;flex-direction:column;gap:10px}
@media (max-height:520px){.card{width:min(96vw,760px);flex-direction:row;align-items:center;gap:18px;padding:12px 16px}.blk{flex:1;gap:8px}h1{font-size:34px}
  .btn{min-height:46px;font-size:18px}.btn.sec{min-height:44px;font-size:14px}#oScore{font-size:40px}h2{font-size:22px}.how{font-size:13px;gap:3px}.how i{height:22px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Vault maze"></canvas>
<div id="top"><button class="ib" id="bMute" aria-label="Toggle sound">♪</button><button class="ib" id="bPause" aria-label="Pause">II</button></div>
<button id="bEmp" aria-label="Fire EMP"><span>EMP</span><b id="empN">1</b></button>

<div class="ov" id="ovMenu"><div class="card">
  <div class="blk"><h1><small>// PROCEDURAL HEIST</small>VAULT <em>RUNNER</em></h1>
    <div class="how">
      <div><i style="background:var(--mint)">↻</i><span><b>Swipe anywhere</b> or arrows — turns are queued for the next corner</span></div>
      <div><i style="background:var(--key)">K</i><span>Grab every <b>keycard</b>, then reach the open vault door</span></div>
      <div><i style="background:var(--warden)">⇄</i><span>Step on <b>switches</b> to flip gates and cut the guards off · <b>EMP</b> stuns</span></div>
    </div></div>
  <div class="blk"><button class="btn" id="bPlay">PLAY</button><div class="dim" id="mBest"></div></div>
</div></div>

<div class="ov" id="ovPause"><div class="card">
  <div class="blk"><h2>PAUSED</h2><div class="dim" id="pInfo"></div></div>
  <div class="blk"><button class="btn" id="bResume">RESUME</button><div class="row"><button class="btn sec" id="bRestart">RESTART</button><button class="btn sec" id="bQuit">MENU</button></div></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <div class="blk"><h2 id="oTitle">BUSTED</h2><div id="oScore">0</div><div class="dim" id="oCause"></div><div class="stats" id="oStats"></div></div>
  <div class="blk"><button class="btn" id="bAgain">AGAIN</button><button class="btn sec" id="bMenu">MENU</button><div class="dim">or tap anywhere · Space</div></div>
</div></div>

<script>
'use strict';
const Q=new URLSearchParams(location.search),AUTOSTART=Q.get('autostart')==='1',NOPAUSE=Q.get('nopause')==='1',MUTEQ=Q.get('mute')==='1';
const SEEDQ=Q.has('seed')?(+Q.get('seed')>>>0):null,KEY='gdl:best:games/maze-munch-rush',MKEY='gdl:maze-munch-rush:mute';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CW=7,CH=10,TW=CW*2+1,TH=CH*2+1,STEP=1/120,GRACE=.32;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const SK={hound:{c:'#ff6a3d',rgb:'255,106,61',name:'Hound'},warden:{c:'#8f7dff',rgb:'143,125,255',name:'Warden'},sweeper:{c:'#b6f24a',rgb:'182,242,74',name:'Sweeper'}};
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;const ri=n=>Math.floor(R()*n);
function sget(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let best=+sget(KEY,0)||0,manual=false;

/* ---------------- audio ---------------- */
const MIN=[0,3,5,7,10,12,15,17,19,22,24];
const AU={ac:null,m:null,nb:null,muted:MUTEQ||sget(MKEY,false)===true,next:0,n:0,
  unlock(){if(!this.ac){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ac=new A();this.m=this.ac.createGain();this.m.gain.value=this.muted?0:.5;
    const c=this.ac.createDynamicsCompressor();c.threshold.value=-14;c.ratio.value=4;this.m.connect(c);c.connect(this.ac.destination);
    const b=this.ac.createBuffer(1,this.ac.sampleRate*.5,this.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;}catch(e){this.ac=null;return;}}
    if(this.ac.state==='suspended')this.ac.resume().catch(()=>{});},
  setMuted(b){this.muted=b;if(this.m)this.m.gain.setTargetAtTime(b?0:.5,this.ac.currentTime,.03);if(!MUTEQ)sset(MKEY,b);$('bMute').classList.toggle('off',b);},
  live(){return this.ac&&!this.muted&&this.ac.state==='running'&&!manual&&!(G&&G.demo);},
  tone(f,d,o){if(!this.live())return;o=o||{};const a=this.ac,t=a.currentTime+(o.dl||0),s=a.createOscillator(),g=a.createGain();s.type=o.w||'sine';s.frequency.setValueAtTime(f,t);
    if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.15,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(g);g.connect(this.m);s.start(t);s.stop(t+d+.05);},
  noise(d,o){if(!this.live())return;o=o||{};const a=this.ac,t=a.currentTime+(o.dl||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=this.nb;f.type=o.ft||'bandpass';
    f.frequency.setValueAtTime(o.f||1200,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+d);f.Q.value=o.q||1;g.gain.setValueAtTime(o.v||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+d+.02);},
  nf(i){return 440*Math.pow(2,MIN[clamp(i|0,0,MIN.length-1)]/12);},
  coin(k){this.tone(this.nf(Math.min(10,k>>1)),.05,{w:'square',v:.035});},
  key(){[0,4,7,10].forEach((p,i)=>this.tone(this.nf(p)*.5,.25,{w:'triangle',v:.13,dl:i*.05}));this.noise(.3,{f:6000,ft:'highpass',v:.05});},
  open(){this.tone(55,.9,{w:'sawtooth',to:110,v:.12});[0,3,7].forEach((p,i)=>this.tone(this.nf(p+3),.5,{w:'triangle',v:.1,dl:.3+i*.1}));},
  sw(){this.tone(220,.06,{w:'square',v:.08});this.noise(.25,{f:400,to:2000,v:.1,dl:.03});},
  emp(){this.tone(1800,.5,{w:'sawtooth',to:90,v:.12});this.noise(.5,{f:3000,to:200,v:.18});},
  alert(){this.tone(880,.12,{w:'square',v:.07});this.tone(660,.12,{w:'square',v:.07,dl:.13});},
  caught(){this.tone(200,.6,{w:'sawtooth',to:60,v:.16});this.noise(.5,{f:300,v:.2});},
  pick(){this.tone(990,.12,{w:'triangle',v:.1});this.tone(1480,.15,{w:'triangle',v:.08,dl:.06});},
  clear(){[0,3,7,10,12].forEach((p,i)=>this.tone(this.nf(p+2),.35,{w:'square',v:.06,dl:i*.08}));},
  over(){[7,5,3,0].forEach((p,i)=>this.tone(this.nf(p),.5,{w:'triangle',v:.12,dl:i*.17}));},
  ui(){this.tone(800,.04,{w:'square',v:.04});},
  music(){if(!this.live()){if(this.ac)this.next=this.ac.currentTime+.1;return;}const a=this.ac,esc=G&&G.exitOpen&&scene==='play',bpm=scene==='play'?(esc?150:112+G.floor*3):90,e16=15/bpm;
    if(this.next<a.currentTime)this.next=a.currentTime+.05;
    while(this.next<a.currentTime+.15){const n=this.n++,dl=this.next-a.currentTime,bar=(n>>4)%4,root=[0,0,-4,-2][bar];
      if(n%4===0||n%16===10)this.tone(55*Math.pow(2,root/12),.18,{w:'sawtooth',v:.07,dl});
      if(n%4===2)this.noise(.03,{f:8000,ft:'highpass',v:.03,dl});
      if(scene==='play'&&G.danger>0&&n%2===0){const k=[0,3,7,10][(n>>1)%4]+12+root;this.tone(220*Math.pow(2,k/12),.08,{w:'square',v:.02*G.danger,dl});}
      if(esc&&n%8===0)this.tone(n%16?660:880,.1,{w:'square',v:.025,dl});
      this.next+=e16;}}
};

/* ---------------- maze ---------------- */
let G=null,scene='menu',paused=false,overShown=false,overAt=0;
const ti=(x,y)=>y*TW+x,inside=(x,y)=>x>=0&&y>=0&&x<TW&&y<TH;
function walk(x,y){if(!inside(x,y))return false;const i=ti(x,y);if(G.T[i])return false;const g=G.gate[i];return !g||g-1!==G.gs;}
function bfs(sx,sy,pass){const D=new Int16Array(TW*TH).fill(-1),q=[ti(sx,sy)];D[q[0]]=0;
  for(let h=0;h<q.length;h++){const i=q[h],x=i%TW,y=i/TW|0;for(let d=0;d<4;d++){const X=x+DX[d],Y=y+DY[d];if(!(pass?pass(X,Y):walk(X,Y)))continue;const j=ti(X,Y);if(D[j]>=0)continue;D[j]=D[i]+1;q.push(j);}}return D;}
function genFloor(f){
  for(let tries=0;tries<60;tries++){
    const T=new Uint8Array(TW*TH).fill(1),seen=new Uint8Array(CW*CH),st=[[CW>>1,CH-1]];seen[(CH-1)*CW+(CW>>1)]=1;T[ti((CW>>1)*2+1,(CH-1)*2+1)]=0;
    while(st.length){const[c,r]=st[st.length-1],opts=[];for(let d=0;d<4;d++){const C=c+DX[d],Rr=r+DY[d];if(C>=0&&Rr>=0&&C<CW&&Rr<CH&&!seen[Rr*CW+C])opts.push(d);}
      if(!opts.length){st.pop();continue;}const d=opts[ri(opts.length)],C=c+DX[d],Rr=r+DY[d];seen[Rr*CW+C]=1;T[ti(c*2+1+DX[d],r*2+1+DY[d])]=0;T[ti(C*2+1,Rr*2+1)]=0;st.push([C,Rr]);}
    // braid most dead ends, then a few extra loops
    const deg=(x,y)=>{let n=0;for(let d=0;d<4;d++)if(!T[ti(x+DX[d],y+DY[d])])n++;return n;};
    for(let r=0;r<CH;r++)for(let c=0;c<CW;c++){const x=c*2+1,y=r*2+1;if(deg(x,y)!==1||R()<.12)continue;const opts=[];
      for(let d=0;d<4;d++){const wx=x+DX[d],wy=y+DY[d];if(wx<=0||wy<=0||wx>=TW-1||wy>=TH-1||!T[ti(wx,wy)])continue;opts.push(d);}
      if(opts.length){opts.sort((a,b)=>deg(x+DX[b]*2,y+DY[b]*2)-deg(x+DX[a]*2,y+DY[a]*2));const d=opts[R()<.6?opts.length-1:ri(opts.length)];T[ti(x+DX[d],y+DY[d])]=0;}}
    for(let k=0;k<4;k++){const x=1+ri(TW-2),y=1+ri(TH-2);if((x+y)%2===1&&T[ti(x,y)])T[ti(x,y)]=0;}
    G.T=T;G.gate=new Uint8Array(TW*TH);G.gs=0;
    const start=[(CW>>1)*2+1,TH-2],D0=bfs(start[0],start[1]);
    const cells=[];for(let r=0;r<CH;r++)for(let c=0;c<CW;c++)cells.push([c*2+1,r*2+1]);
    const far=(p,others)=>Math.min(D0[ti(p[0],p[1])],...others.map(o=>Math.abs(o[0]-p[0])+Math.abs(o[1]-p[1])));
    let exit=cells.filter(p=>p[1]<=3).sort((a,b)=>D0[ti(b[0],b[1])]-D0[ti(a[0],a[1])])[ri(3)];
    const nk=Math.min(3,f),keys=[];for(let k=0;k<nk;k++){let bp=null,bv=-1;for(const p of cells){if(p===exit||keys.includes(p))continue;const v=far(p,[exit,start,...keys])+R()*3;if(v>bv){bv=v;bp=p;}}keys.push(bp);}
    const used=new Set([exit,start,...keys].map(p=>ti(p[0],p[1])));
    const pick=(n,minD)=>{const out=[];const c2=cells.filter(p=>!used.has(ti(p[0],p[1]))&&D0[ti(p[0],p[1])]>=minD);for(let k=0;k<n&&c2.length;k++){const p=c2.splice(ri(c2.length),1)[0];out.push(p);used.add(ti(p[0],p[1]));}return out;};
    const emps=pick(f===1?1:2,8),docks=pick(Math.min(4,f===1?2:f<4?3:4),tries<40?14:8),sws=f>=2&&tries<50?pick(f>=4?2:1,6):[];
    if(docks.length<(f===1?2:3))continue;
    // gates: wall-openings on loops, two colours
    if(f>=2&&tries<50){const openings=[];for(let y=1;y<TH-1;y++)for(let x=1;x<TW-1;x++)if((x+y)%2===1&&!T[ti(x,y)]&&!used.has(ti(x,y))&&Math.abs(x-start[0])+Math.abs(y-start[1])>3)openings.push([x,y]);
      const ng=Math.min(openings.length,4+Math.min(4,f));for(let k=0;k<ng;k++){const p=openings.splice(ri(openings.length),1)[0];G.gate[ti(p[0],p[1])]=1+(k&1);}}
    // every important tile reachable in both gate states
    const must=[start,exit,...keys,...emps,...sws];let ok=true;
    for(const gs of[0,1]){G.gs=gs;const D=bfs(start[0],start[1]);if(must.some(p=>D[ti(p[0],p[1])]<0)){ok=false;break;}}
    G.gs=0;if(!ok)continue;
    G.start=start;G.exit=exit;G.keys=keys.map(p=>({x:p[0],y:p[1],got:false}));G.emps=emps.map(p=>({x:p[0],y:p[1],got:false}));G.docks=docks;G.sws=sws.map(p=>({x:p[0],y:p[1]}));
    // glints lie in runs along some corridors, not on every tile
    G.coin=new Uint8Array(TW*TH);G.coins=0;const cc=new Uint8Array(TW*TH);for(const p of cells)if(R()<.62)cc[ti(p[0],p[1])]=1;
    for(let i=0;i<TW*TH;i++){if(T[i]||G.gate[i]||used.has(i))continue;const x=i%TW,y=i/TW|0;let on=false;
      if(x%2&&y%2)on=!!cc[i];else{const a=x%2?ti(x,y-1):ti(x-1,y),b=x%2?ti(x,y+1):ti(x+1,y);on=cc[a]&&cc[b]&&R()<.9;}
      if(on){G.coin[i]=1;G.coins++;}}
    G.coinsTotal=G.coins;return;
  }
}

/* ---------------- run / floor ---------------- */
function newRun(seed,demo){
  R=rng32(seed);
  G={seed,demo:!!demo,t:0,floor:0,score:0,hearts:3,emp:1,alive:true,deadT:0,cause:'',phase:'play',phaseT:0,combo:0,comboT:0,keysGot:0,exitOpen:false,
    floorT:0,totalCoins:0,keysTotal:0,empsUsed:0,switches:0,caughtN:0,graces:0,floorsCleared:0,newBest:false,danger:0,shake:0,flash:0,inv:0,
    p:null,S:[],trail:[],parts:[],floats:[],rings:[],banner:'',bannerT:0,tip:'',tipT:0,tips:{},onSw:-1};
  startFloor(1);
}
function startFloor(f){
  G.floor=f;G.phase='play';G.floorT=0;G.keysGot=0;G.exitOpen=false;G.trail.length=0;
  genFloor(f);resetActors(true);
  G.banner='VAULT '+f;G.bannerT=1.6;if(bgReady)buildBg();
}
function resetActors(fresh){
  G.p={x:G.start[0],y:G.start[1],dir:-1,want:-1,face:0,moved:0};G.trail.length=0;
  const kinds=G.floor===1?['hound','sweeper']:G.floor<4?['hound','warden','sweeper']:['hound','warden','sweeper','hound'];
  G.S=G.docks.slice(0,kinds.length).map((d,i)=>({id:i+1,k:kinds[i],x:d[0],y:d[1],dir:0,st:'boot',t:fresh?1.6+i*.6:1.2+i*.3,tgt:null,cd:0,seen:null,hold:false}));
}
function spd(k,s){const f=G.floor,esc=G.exitOpen?1.12:1;if(k==='p')return Math.min(7.2,5.9+.2*(f-1));
  if(s.st==='sprint')return 8.2*esc;if(k==='sweeper')return (3.6+.15*f)*esc;return Math.min(6.6,(4.25+.3*(f-1))*esc)*(k==='warden'?.9:1);}

/* ---------------- movement ---------------- */
function atCenter(e){return Math.abs(e.x-Math.round(e.x))<1e-6&&Math.abs(e.y-Math.round(e.y))<1e-6;}
function moveEnt(e,dist,onC){
  for(let g=0;g<12&&dist>1e-7;g++){

  for(const k of G.keys){if(k.got)continue;const x=SX(k.x,k.y),y=SY(k.x,k.y)+Math.sin(T*3+k.x)*ts*.06;cx.drawImage(GLOW.key,x-ts,y-ts,ts*2,ts*2);
    cx.save();cx.translate(x,y);cx.rotate(Math.sin(T*2+k.y)*.2);cx.fillStyle='#ffc24a';rrect(-ts*.32,-ts*.22,ts*.64,ts*.44,ts*.08);cx.fill();cx.fillStyle='#5a3d08';cx.fillRect(-ts*.22,-ts*.08,ts*.2,ts*.14);cx.fillRect(ts*.06,-ts*.12,ts*.16,ts*.04);cx.fillRect(ts*.06,-ts*.02,ts*.12,ts*.04);cx.restore();}

function rrect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function drawRunner(T){
  const p=G.p,x=SX(p.x,p.y),y=SY(p.x,p.y),d=scr(p.face),r=ts*.4;if(G.inv>0&&Math.floor(G.inv*12)%2===0&&G.alive)cx.globalAlpha=.35;
  if(G.phase==='caught'||!G.alive){cx.globalAlpha=Math.max(0,.9-(G.alive?1.4-G.phaseT:G.deadT));}
  cx.drawImage(GLOW.mint,x-ts,y-ts,ts*2,ts*2);

  cx.beginPath();cx.arc(0,0,r*.85,0,6.283);cx.fill();
  cx.fillStyle='#1a1d26';rrect(-r*.8,-r*.32,r*1.6,r*.42,r*.2);cx.fill();
  const lx=DX[d]*r*.18,ly=DY[d]*r*.1;cx.fillStyle='#5df2c8';cx.beginPath();cx.arc(-r*.32+lx,-r*.11+ly,r*.12,0,6.283);cx.arc(r*.32+lx,-r*.11+ly,r*.12,0,6.283);cx.fill();
  cx.fillStyle='#ff8fb8';cx.beginPath();cx.arc(lx,r*.28,r*.08,0,6.283);cx.fill();
  cx.restore();cx.globalAlpha=1;
}
function drawSentry(s,T){
  const x=SX(s.x,s.y),y=SY(s.x,s.y),K=SK[s.k],r=ts*.42,st=s.st;let a=1;if(st==='boot')a=.3+.3*Math.abs(Math.sin(T*8));
  cx.globalAlpha=a;cx.drawImage(st==='alert'||st==='sprint'?GLOW.alarm:GLOW[s.k],x-ts*1.1,y-ts*1.1,ts*2.2,ts*2.2);

  const body=st==='stun'?'#3a3d48':'#1b1e27';cx.fillStyle=body;cx.strokeStyle=st==='stun'?'#6a6f80':K.c;cx.lineWidth=Math.max(1.5,ts*.08);
  cx.beginPath();if(s.k==='hound'){for(let k=0;k<6;k++){const an=k/6*6.283+Math.PI/6;cx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}cx.closePath();}
  else if(s.k==='warden'){rrect(-r*.85,-r*.85,r*1.7,r*1.7,r*.25);}else{cx.arc(0,0,r*.9,0,6.283);}
  cx.fill();cx.stroke();
  const d=s.dir>=0?scr(s.dir):1,ex=DX[d]*r*.3,ey=DY[d]*r*.3;
  if(st==='stun'){cx.strokeStyle='#e9fff7';cx.lineWidth=1.5;for(const sg of[-1,1]){cx.beginPath();cx.moveTo(sg*r*.35-r*.12,-r*.12);cx.lineTo(sg*r*.35+r*.12,r*.12);cx.moveTo(sg*r*.35+r*.12,-r*.12);cx.lineTo(sg*r*.35-r*.12,r*.12);cx.stroke();}
    for(let k=0;k<3;k++){const an=T*5+k*2.1;cx.fillStyle='#5df2c8';cx.fillRect(Math.cos(an)*r*1.1-1.5,-r*1.1+Math.sin(an)*r*.3,3,3);}}
  else{const ec=st==='alert'||st==='sprint'?'#ff4d5e':K.c;cx.fillStyle=ec;
    if(s.k==='hound'){cx.beginPath();cx.arc(ex,ey,r*.28,0,6.283);cx.fill();cx.fillStyle=body;cx.beginPath();cx.arc(ex+DX[d]*r*.08,ey+DY[d]*r*.08,r*.12,0,6.283);cx.fill();}
    else if(s.k==='warden'){cx.fillRect(ex-r*.45,ey-r*.1,r*.9,r*.2);cx.fillRect(ex-r*.1,ey-r*.45,r*.2,r*.9);}

function drawHud(T){
  cx.textBaseline='middle';const sc=G.score.toLocaleString('en-US'),keyIcons=(x,y,al)=>{const n=G.keys.length,s=Math.min(22,Math.max(14,ts*.7)),gap=s*1.2;let x0=al==='right'?x-n*gap:al==='center'?x-n*gap/2:x;
    for(let i=0;i<n;i++){const X=x0+i*gap+gap/2;cx.globalAlpha=G.keys[i].got?1:.3;cx.fillStyle='#ffc24a';rrect(X-s*.45,y-s*.3,s*.9,s*.6,s*.1);cx.fill();cx.fillStyle='#5a3d08';cx.fillRect(X-s*.3,y-s*.1,s*.25,s*.2);}cx.globalAlpha=1;};
  const lives=(x,y,al)=>{for(let i=0;i<3;i++){const X=al==='right'?x-i*20:al==='center'?x-20+i*20:x+i*20;cx.globalAlpha=i<G.hearts?1:.22;cx.fillStyle='#e9fff7';cx.beginPath();cx.arc(X,y+2,6,0,6.283);cx.moveTo(X-6,y);cx.lineTo(X-4.5,y-8);cx.lineTo(X-1,y-4);cx.moveTo(X+6,y);cx.lineTo(X+4.5,y-8);cx.lineTo(X+1,y-4);cx.fill();}cx.globalAlpha=1;};
  const tip=G.tipT>0?G.tip:!G.tips.moved?'Swipe anywhere — your turn is queued for the next corner':G.floor===1&&G.keysGot===0&&G.floorT<12?'Grab the keycard, then the vault door':G.exitOpen&&!G.tips.esc?'Alarm! Get to the vault door':'';
  const m=1+Math.min(4,G.combo/10|0);
  if(side){const L=ox/2,Rx=ox+TH*ts+(W-ox-TH*ts)/2;cx.textAlign='center';
    cx.fillStyle='#e9fff7';cx.font='700 '+Math.round(Math.min(40,ox*.17))+'px "JetBrains Mono"';cx.fillText(sc,L,H*.2);cx.fillStyle='rgba(233,255,247,.55)';cx.font='500 13px "Chakra Petch"';cx.fillText('BEST '+Math.max(best,G.score).toLocaleString('en-US'),L,H*.2+30);
    if(m>1){cx.fillStyle='#5df2c8';cx.font='700 20px "Chakra Petch"';cx.fillText('GLINT RUN ×'+m,L,H*.2+62);}
    cx.fillStyle='#e9fff7';cx.font='700 20px "Chakra Petch"';cx.fillText('VAULT '+G.floor,Rx,H*.28);keyIcons(Rx,H*.28+30,'center');lives(Rx,H*.28+62,'center');

  }else{cx.textAlign='left';cx.fillStyle='#e9fff7';cx.font='700 30px "JetBrains Mono"';cx.fillText(sc,14,32);cx.fillStyle='rgba(233,255,247,.55)';cx.font='500 12px "Chakra Petch"';cx.fillText('BEST '+Math.max(best,G.score).toLocaleString('en-US'),14,58);
    lives(16,80,'left');cx.textAlign='right';cx.fillStyle='#e9fff7';cx.font='700 16px "Chakra Petch"';cx.fillText('VAULT '+G.floor,W-114,32);keyIcons(W-114,60,'right');
    if(m>1){cx.textAlign='center';cx.fillStyle='#5df2c8';cx.font='700 16px "Chakra Petch"';cx.fillText('GLINT RUN ×'+m,W/2,oy-12);}

function wrap(s,x,y,w){cx.textAlign='center';cx.font='500 14px "Chakra Petch"';cx.fillStyle=G.tipT>0?'#ffc24a':'rgba(233,255,247,.8)';const ws=s.split(' ');let line='',ly=y;

/* ---------------- scenes & input ---------------- */
function show(id,on){$(id).classList.toggle('on',on);}
function startGame(seed){AU.unlock();newRun(seed!=null?seed:(SEEDQ!=null?SEEDQ:(Math.random()*2**31)>>>0));scene='play';paused=false;overShown=false;
  show('ovMenu',false);show('ovOver',false);show('ovPause',false);$('bPause').style.display='';buildBg();updEmpBtn();cv.focus();}
function toMenu(){scene='menu';paused=false;overShown=false;newRun(4242,true);show('ovOver',false);show('ovPause',false);show('ovMenu',true);$('bPause').style.display='none';updEmpBtn();
  $('mBest').textContent=best?'Best haul: '+best.toLocaleString('en-US'):'Crack as many vaults as you can';buildBg();}
function showOver(){overShown=true;overAt=performance.now();scene='over';show('ovOver',true);$('bPause').style.display='none';updEmpBtn();
  $('oTitle').textContent=G.newBest?'NEW BEST HAUL':'BUSTED';$('oScore').textContent=G.score.toLocaleString('en-US');$('oCause').textContent=G.cause;
  const chip=(k,v,n)=>'<span class="chip'+(n?' new':'')+'">'+k+' <b>'+v+'</b></span>';
  $('oStats').innerHTML=chip('vault',G.floor)+chip('cracked',G.floorsCleared)+chip('keycards',G.keysTotal)+chip('glints',G.totalCoins)+chip('switches',G.switches)+chip('EMPs',G.empsUsed)+chip('best',best.toLocaleString('en-US'),G.newBest);}
function setPaused(b){if(scene!=='play'||!G||!G.alive)b=false;if(paused===b)return;paused=b;show('ovPause',b);
  if(b)$('pInfo').textContent='Vault '+G.floor+' · keycards '+G.keysGot+'/'+G.keys.length+' · '+G.score.toLocaleString('en-US');}
const canRetry=()=>scene==='over'&&overShown&&(manual||performance.now()-overAt>450);
const click=(id,fn)=>$(id).addEventListener('click',e=>{AU.unlock();AU.ui();fn(e);e.currentTarget.blur();});
click('bPlay',()=>startGame());click('bResume',()=>setPaused(false));click('bRestart',()=>startGame());click('bQuit',()=>toMenu());
click('bAgain',()=>{if(canRetry())startGame(G.seed);});click('bMenu',()=>{if(canRetry())toMenu();});
click('bPause',()=>setPaused(!paused));click('bMute',()=>AU.setMuted(!AU.muted));
$('bEmp').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();AU.unlock();fireEmp();});
$('ovOver').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(canRetry()){AU.unlock();startGame(G.seed);}});
function inputDir(sd){if(!G||G.demo||scene!=='play'||paused||!G.alive||G.phase!=='play')return;setWant(brd(sd));}
const KD={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{if(e.code in KD||e.code==='Space')e.preventDefault();AU.unlock();
  if(e.code==='KeyM'){AU.setMuted(!AU.muted);return;}
  if(scene==='menu'){if(e.code==='Enter'||e.code==='Space')startGame();return;}
  if(scene==='over'){if((e.code==='Enter'||e.code==='Space')&&canRetry())startGame(G.seed);return;}
  if(e.code==='Escape'||e.code==='KeyP'){setPaused(!paused);return;}
  if(paused){if(e.code==='Enter'||e.code==='Space')setPaused(false);return;}
  if(e.code==='Space'||e.code==='KeyE'||e.code==='ShiftLeft'){fireEmp();return;}
  if(e.code in KD&&!e.repeat)inputDir(KD[e.code]);});
// swipe anywhere: each stretch of drag (≥ threshold) queues the next turn; a tap turns toward the tap
let sw=null;
cv.addEventListener('pointerdown',e=>{AU.unlock();if(scene!=='play')return;try{cv.setPointerCapture(e.pointerId);}catch(_){}sw={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,last:-1};});
cv.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,th=Math.max(14,Math.min(28,ts*.9));
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;const d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);sw.x=e.clientX;sw.y=e.clientY;sw.moved=true;if(d!==sw.last){sw.last=d;inputDir(d);}});

  const dx=e.clientX-SX(G.p.x,G.p.y),dy=e.clientY-SY(G.p.x,G.p.y);if(Math.hypot(dx,dy)<ts*.6)return;inputDir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));});

addEventListener('blur',()=>{if(!NOPAUSE)setPaused(true);});
addEventListener('resize',layout);
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!manual&&!paused){acc+=dt;let n=0;while(acc>=STEP&&n++<14){tick(STEP);acc-=STEP;}if(acc>STEP)acc=0;}
  render();AU.music();requestAnimationFrame(frame);}

window.__gdl={
  get state(){if(!G)return{scene};const p=G.p;return{scene,paused,muted:AU.muted,demo:G.demo,seed:G.seed,t:+G.t.toFixed(4),floor:G.floor,phase:G.phase,score:G.score,best,newBest:G.newBest,

    if(o.S){G.S=o.S.map((q,i)=>({id:i+1,k:q.k,x:q.x,y:q.y,dir:q.dir==null?0:q.dir,st:q.st||(q.k==='sweeper'?'patrol':'hunt'),t:q.t||0,tgt:null,cd:q.cd||0,seen:null,hold:!!q.hold}));}},
  floor(n){startFloor(n);}
};
layout();
if(AUTOSTART)startGame();else toMenu();
if(AU.muted)$('bMute').classList.add('off');
requestAnimationFrame(frame);
