<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE TOWER</title>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            color: white; 
            font-family: 'Courier New', Courier, monospace; 
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
        }

        #header {
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        h1 { margin: 0; font-size: 3rem; font-weight: 900; letter-spacing: -2px; }
        p { color: #888; margin-top: 5px; font-size: 0.9rem; }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
        }

        .metric { font-size: 1.5rem; font-weight: bold; }
        .label { font-size: 0.7rem; color: #666; text-transform: uppercase; }

        #height-meter { color: #00ff88; }
        #player-count { color: #ff0055; }

        /* Notification Toast for "Other Players" */
        .toast {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #ccc;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s;
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }
        
        #start-text {
            border: 2px solid white;
            padding: 20px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            background: black;
        }
        
        #start-text:hover { background: white; color: black; }

    </style>
</head>
<body>

    <div id="start-overlay">
        <div id="start-text">Click to Initialize Physics</div>
    </div>

    <div id="ui-layer">
        <div id="header">
            <h1>THE TOWER</h1>
            <p>We build together. We fall together.</p>
        </div>
        <div id="stats">
            <div class="metric" id="height-meter">0m</div>
            <div class="label">Current Height</div>
            <br>
            <div class="metric" id="player-count">428</div>
            <div class="label">Live Architects</div>
        </div>
    </div>

    <!-- Canvas will be injected by Matter.js -->

<script>
    // --- SETUP ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Mouse = Matter.Mouse,
          MouseConstraint = Matter.MouseConstraint;

    // Create engine
    const engine = Engine.create();
    const world = engine.world;

    // Create renderer
    const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth,
            height: window.innerHeight,
            wireframes: false,
            background: '#111'
        }
    });

    // --- GAME STATE ---
    let maxHeight = 0;
    // We will sync this with the actual ground position
    let groundY = window.innerHeight - 30; 
    let cameraY = 0;
    let isRunning = false;

    // --- BODIES ---
    
    // The Ground - Moved UP to be clearly visible and wider
    // Center at height-30, height 60 -> Top edge at height-60
    const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight - 30, window.innerWidth * 10, 60, { 
        isStatic: true,
        render: { fillStyle: '#333' }
    });
    Composite.add(world, ground);

    // Block Colors
    const COLORS = ['#ff0055', '#00f0ff', '#ffe600', '#ffffff', '#8a2be2'];
    const SHAPES = ['rect', 'square', 'circle', 'triangle', 'long'];

    function createBlock(x, y, isBot = false) {
        const size = 30 + Math.random() * 30;
        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const shapeType = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        
        let body;
        const opts = {
            restitution: 0.3, // Bounciness
            friction: 0.8,    // High friction to help stacking
            density: 0.002,
            render: { fillStyle: color, strokeStyle: '#000', lineWidth: 2 }
        };

        // Shape Logic
        switch(shapeType) {
            case 'circle':
                body = Bodies.circle(x, y, size/2, opts);
                break;
            case 'triangle':
                body = Bodies.polygon(x, y, 3, size/1.5, opts);
                break;
            case 'long':
                body = Bodies.rectangle(x, y, size * 2.5, size/2, opts);
                break;
            case 'rect':
                body = Bodies.rectangle(x, y, size * 1.5, size, opts);
                break;
            default: // square
                body = Bodies.rectangle(x, y, size, size, opts);
        }

        // Apply visual rotation to make it look natural
        Matter.Body.rotate(body, Math.random() * Math.PI / 4 - Math.PI/8);

        Composite.add(world, body);

        // Visual Feedback (Toast)
        if (isBot) {
            showToast(x, y - cameraY, getRandomName());
        }
    }

    // --- INTERACTION ---
    
    // Click to Drop
    window.addEventListener('mousedown', (e) => {
        if (!isRunning) return;
        // Adjust click Y for camera offset
        const worldY = e.clientY - cameraY;
        createBlock(e.clientX, worldY - 200); // Spawn slightly above cursor
    });

    // --- SIMULATED MULTIPLAYER (BOTS) ---
    const BOT_NAMES = ["Guest_92", "Builder_X", "Glitch00", "Anon_JP", "Neo", "Stacker", "Void_Walker"];
    
    function getRandomName() {
        return BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    }

    function showToast(x, y, text) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerText = text + " dropped a block";
        el.style.left = (x) + 'px';
        el.style.top = (y) + 'px';
        document.body.appendChild(el);

        // Animate up and fade
        setTimeout(() => {
            el.style.transform = "translateY(-20px)";
            el.style.opacity = 0;
        }, 50);

        setTimeout(() => el.remove(), 1000);
    }

    // Bot Loop
    setInterval(() => {
        if (!isRunning) return;
        // Bots drop blocks near the center to help build up
        const centerBias = (window.innerWidth / 2) + (Math.random() - 0.5) * 300;
        // Spawn high up relative to max height
        // Adjusted spawn height to ensure they don't spawn inside the ground if the tower is low
        const spawnY = -maxHeight - window.innerHeight/2 - 200; 
        
        createBlock(centerBias, spawnY, true);
        
        // Sometimes spawn a "disaster" block (heavy)
        if(Math.random() > 0.95) {
             const disaster = Bodies.circle(centerBias, spawnY - 100, 40, {
                 density: 0.01, // Heavy
                 render: { fillStyle: '#333' }
             });
             Composite.add(world, disaster);
             showToast(centerBias, 100, "SYSTEM: HEAVY LOAD");
        }
    }, 1500); // Every 1.5 seconds

    // --- LOOP & CAMERA ---

    Events.on(engine, 'afterUpdate', function() {
        // 1. Calculate Max Height (lowest Y value because Canvas Y is inverted)
        // Start from the ground's top edge
        let highestY = ground.position.y - 30; 
        
        Composite.allBodies(world).forEach(body => {
            if (!body.isStatic && body.position.y < highestY) {
                highestY = body.position.y;
            }
        });

        // Convert physics Y to "Height Meters"
        // Base is ground top
        const base = ground.position.y - 30;
        const currentHeight = Math.floor((base - highestY) / 20);
        if (currentHeight > maxHeight) maxHeight = currentHeight;
        
        // Update UI
        document.getElementById('height-meter').innerText = maxHeight + "m";

        // 2. Camera Follow logic
        // We want the camera to be positioned so that the highest block is roughly in the middle-top 
        const targetY = -(highestY - window.innerHeight * 0.7);
        
        // Smooth lerp
        if (targetY > cameraY) {
            cameraY += (targetY - cameraY) * 0.05;
        }

        // Apply translation to Render Viewport
        Render.lookAt(render, {
            min: { x: 0, y: -cameraY },
            max: { x: window.innerWidth, y: window.innerHeight - cameraY }
        });
        
        // Also cleanup blocks that fall way below (optimization)
        Composite.allBodies(world).forEach(body => {
            if (body.position.y > ground.position.y + 1000 && !body.isStatic) {
                Composite.remove(world, body);
            }
        });
    });


    // --- INIT ---
    document.getElementById('start-overlay').addEventListener('click', () => {
        document.getElementById('start-overlay').style.display = 'none';
        isRunning = true;
        
        // Start engine
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);
        
        // Spawn initial base
        createBlock(window.innerWidth/2 - 40, window.innerHeight - 200);
        createBlock(window.innerWidth/2 + 40, window.innerHeight - 200);
    });

    // Resize handler
    window.addEventListener('resize', () => {
        render.canvas.width = window.innerWidth;
        render.canvas.height = window.innerHeight;
        
        // Re-position ground to stay at bottom
        Matter.Body.setPosition(ground, {
             x: window.innerWidth / 2, 
             y: window.innerHeight - 30 
        });
        
        // Update helper var
        groundY = window.innerHeight - 30;
    });

</script>
</body>
</html>
