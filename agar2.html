<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON NEXUS: OMEGA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* UI OVERLAYS */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hud-top-left {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            border-left: 4px solid #0ff;
            padding: 5px 15px;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 0 10px #0ff;
            backdrop-filter: blur(4px);
            transform: skewX(-10deg);
        }

        .stat-label { font-size: 14px; color: #aaa; text-transform: uppercase; display: block; }
        .stat-value { color: #fff; }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 4px;
            border-right: 4px solid #f0f;
            text-align: right;
            backdrop-filter: blur(4px);
        }

        .lb-row {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 4px;
            font-size: 16px;
            opacity: 0.8;
            transition: all 0.2s;
        }
        
        .lb-row.me {
            color: #0ff;
            font-weight: bold;
            opacity: 1;
            text-shadow: 0 0 10px #0ff;
            transform: scale(1.05);
        }

        /* CHAT LOG */
        #chat-log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 150px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            mask-image: linear-gradient(to top, black 80%, transparent 100%);
        }

        .chat-msg {
            font-size: 14px;
            margin-top: 4px;
            text-shadow: 1px 1px 2px #000;
        }
        .chat-name { font-weight: bold; color: #ffd700; }
        .chat-sys { color: #ff4444; font-style: italic; }

        /* START SCREEN */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s;
        }

        h1 {
            font-size: 8vw;
            background: linear-gradient(to right, #0ff, #f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            margin-bottom: 0;
            line-height: 1;
            text-transform: uppercase;
            font-style: italic;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 40px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .btn {
            padding: 15px 50px;
            font-size: 24px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            color: #050505;
            background: #0ff;
            border: none;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.1s;
            text-transform: uppercase;
            box-shadow: 0 0 30px #0ff;
        }

        .btn:hover { transform: scale(1.05); background: #fff; box-shadow: 0 0 50px #fff; }
        .btn:active { transform: scale(0.95); }

        /* NOTIFICATIONS */
        #kill-feed {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        
        .feed-item {
            font-size: 40px;
            font-weight: 800;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            animation: popUpFade 2s forwards;
        }

        @keyframes popUpFade {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            20% { opacity: 1; transform: scale(1.2) translateY(0); }
            100% { opacity: 0; transform: scale(1) translateY(-100px); }
        }

        /* TUTORIAL */
        .tutorial {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }
        .key {
            display: inline-block;
            border: 1px solid #444;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
            background: #222;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud-top-left">
            <div class="stat-box">
                <span class="stat-label">Mass</span>
                <span class="stat-value" id="score-val">0</span>
            </div>
            <div class="stat-box" style="border-color: #f0f; text-shadow: 0 0 10px #f0f;">
                <span class="stat-label">Kill Streak</span>
                <span class="stat-value" id="streak-val">0</span>
            </div>
            <div class="stat-box" style="border-color: #ff0; text-shadow: 0 0 10px #ff0;">
                <span class="stat-label">FPS</span>
                <span class="stat-value" id="fps-val">60</span>
            </div>
        </div>

        <div id="leaderboard">
            <h3 style="color:#fff; margin-bottom:10px; border-bottom:1px solid #444;">TOP PREDATORS</h3>
            <div id="lb-content"></div>
        </div>

        <div id="kill-feed"></div>

        <div id="chat-log"></div>
    </div>

    <div id="start-screen">
        <h1>Neon Nexus</h1>
        <div class="subtitle">Omega Protocol</div>
        <button class="btn" onclick="startGame()">Initialize Sequence</button>
        <div class="tutorial">
            <span class="key">MOUSE</span> to Move &nbsp;|&nbsp; 
            <span class="key">L-CLICK</span> or <span class="key">SPACE</span> to Boost
        </div>
    </div>

    <canvas id="game"></canvas>

<script>
// Wrap in IIFE to prevent global scope pollution on re-runs
(() => {

let game; // Define game variable in this scope for classes to access

/**
 * AUDIO ENGINE
 * Procedural sound synthesis using Web Audio API to avoid external assets.
 */
const AudioEngine = {
    ctx: null,
    enabled: false,
    
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.enabled = true;
        
        // Master Compressor to glue sounds together
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.4;
        
        this.compressor = this.ctx.createDynamicsCompressor();
        this.compressor.threshold.value = -24;
        this.compressor.knee.value = 30;
        this.compressor.ratio.value = 12;
        this.compressor.attack.value = 0.003;
        this.compressor.release.value = 0.25;

        this.masterGain.connect(this.compressor);
        this.compressor.connect(this.ctx.destination);

        // Start background drone
        this.startDrone();
    },

    startDrone() {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.value = 50; // Deep bass
        
        filter.type = 'lowpass';
        filter.frequency.value = 100;

        // LFO for filter modulation
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 0.1;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 50;
        
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        gain.gain.value = 0.15;

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        
        osc.start();
        lfo.start();
    },

    playTone(freq, type, duration, vol = 1, slide = 0) {
        if (!this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slide !== 0) {
            osc.frequency.exponentialRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
        }

        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    playCollect() {
        // High pitched pleasant ping
        this.playTone(800 + Math.random() * 400, 'sine', 0.1, 0.1);
        this.playTone(1200 + Math.random() * 400, 'triangle', 0.1, 0.05);
    },

    playKill() {
        // Deep satisfying thud + crunch
        this.playTone(150, 'square', 0.4, 0.4, -100);
        this.playTone(60, 'sawtooth', 0.6, 0.4, -40);
        // High noise sizzle simulation
        this.playTone(2000, 'sawtooth', 0.2, 0.1, -1000);
    },

    playBoost() {
        this.playTone(200, 'sawtooth', 0.3, 0.1, -150);
    },

    playDie() {
        this.playTone(400, 'sawtooth', 1.0, 0.5, -350);
        this.playTone(300, 'square', 1.0, 0.5, -250);
    }
};

/**
 * GAME CONSTANTS & CONFIG
 */
const C = {
    WORLD_SIZE: 4000,
    GRID_SIZE: 100,
    PLAYER_START_MASS: 20,
    MIN_MASS: 10,
    SPEED_FACTOR: 10,
    FRICTION: 0.95,
    BOOST_COST: 0.3, // Mass lost per frame
    BOOST_MULT: 2.5,
    FOV_MULT: 1.5, // How much to zoom out based on size
    COLORS: ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff0000', '#ffffff']
};

/**
 * UTILS
 */
const rand = (min, max) => Math.random() * (max - min) + min;
const randColor = () => C.COLORS[Math.floor(Math.random() * C.COLORS.length)];
const lerp = (a, b, t) => a + (b - a) * t;

// Names for bots
const BOT_NAMES = [
    "VoidWalker", "NeonGod", "Glitch", "System32", "NullPtr", "CyberPunk",
    "StarEater", "Quasar", "BitCrusher", "LagSpike", "FrameDrop", "Pixel",
    "Vertex", "Shader", "RenderLoop", "Omega", "Alpha", "Zero"
];
const CHAT_PHRASES = [
    "Lag?", "Nice skin", "Team?", "No way...", "rekt", "ez", "gg", 
    "who wants to team", "stop chasing me", "im laggin", "wow", "oops"
];

/**
 * CLASSES
 */

class Camera {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.scale = 1;
        this.targetScale = 1;
        this.shake = 0;
    }

    update(targetX, targetY, targetRadius) {
        // Smooth follow
        this.x = lerp(this.x, targetX, 0.1);
        this.y = lerp(this.y, targetY, 0.1);
        
        // Dynamic zoom based on player size
        // The larger we are, the more we see
        this.targetScale = 1 / (1 + targetRadius / 200); 
        this.scale = lerp(this.scale, this.targetScale, 0.05);

        if (this.shake > 0) this.shake *= 0.9;
    }

    getShake() {
        return {
            x: (Math.random() - 0.5) * this.shake,
            y: (Math.random() - 0.5) * this.shake
        };
    }
}

class Particle {
    constructor(x, y, color, size, speed) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = size;
        this.life = 1.0;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * speed;
        this.vy = Math.sin(this.angle) * speed;
        this.drag = 0.92;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= this.drag;
        this.vy *= this.drag;
        this.life -= 0.02;
        this.size *= 0.95;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Entity {
    constructor(x, y, mass, isBot = true) {
        this.x = x;
        this.y = y;
        this.mass = mass;
        this.radius = Math.sqrt(this.mass / Math.PI) * 10;
        this.targetRadius = this.radius;
        this.vx = 0;
        this.vy = 0;
        this.color = isBot ? randColor() : '#00ffff';
        this.name = isBot ? BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)] : "YOU";
        this.isBot = isBot;
        this.isDead = false;
        
        // Soft body wobble
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.vertices = [];
        this.numVertices = 20;
        for(let i=0; i<this.numVertices; i++) this.vertices.push(1.0);
    }

    getSpeed() {
        // Smaller = Faster
        return C.SPEED_FACTOR * Math.pow(this.mass, -0.4);
    }

    updateVertices(velocity) {
        const wobbleSpeed = 0.1 + (velocity * 0.05);
        const wobbleAmount = 0.05 + (velocity * 0.02);
        this.wobblePhase += wobbleSpeed;

        for(let i=0; i<this.numVertices; i++) {
            const angle = (i / this.numVertices) * Math.PI * 2;
            // Create a wave that moves around the circle
            const offset = Math.sin(angle * 3 + this.wobblePhase) * wobbleAmount;
            // Spring force back to 1.0
            this.vertices[i] = lerp(this.vertices[i], 1.0 + offset, 0.2);
        }
    }

    move(targetX, targetY, boost) {
        if(this.isDead) return;

        // Angle to target
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx);

        let speed = this.getSpeed();
        if (boost && this.mass > C.MIN_MASS * 1.5) {
            speed *= C.BOOST_MULT;
            this.mass -= C.BOOST_COST; // Cost to boost
            // Eject particles
            if (Math.random() < 0.5) {
                // IMPORTANT: Use the outer 'game' variable
                if (game) {
                    game.addParticle(
                        this.x - Math.cos(angle) * this.radius,
                        this.y - Math.sin(angle) * this.radius,
                        this.color, this.radius * 0.2, 5
                    );
                }
            }
        }

        // Apply force
        if(dist > 5) {
            this.vx += Math.cos(angle) * speed * 0.1;
            this.vy += Math.sin(angle) * speed * 0.1;
        }

        // Physics
        this.vx *= C.FRICTION;
        this.vy *= C.FRICTION;
        this.x += this.vx;
        this.y += this.vy;

        // Boundaries
        const border = C.WORLD_SIZE;
        if(this.x < -border) this.x = -border;
        if(this.x > border) this.x = border;
        if(this.y < -border) this.y = -border;
        if(this.y > border) this.y = border;

        // Size smoothing
        this.radius = Math.sqrt(this.mass / Math.PI) * 10;
        this.updateVertices(Math.sqrt(this.vx*this.vx + this.vy*this.vy));
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        // Glow effect
        ctx.shadowBlur = this.mass > 50 ? 50 : 20;
        ctx.shadowColor = this.color;

        ctx.beginPath();
        // Draw soft body
        for(let i=0; i<=this.numVertices; i++) {
            const index = i % this.numVertices;
            const theta = (i / this.numVertices) * Math.PI * 2;
            const r = this.radius * this.vertices[index];
            const px = this.x + Math.cos(theta) * r;
            const py = this.y + Math.sin(theta) * r;
            if (i===0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Inner Core (lighter)
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        ctx.shadowBlur = 0;

        // Name Tag
        if (this.mass > 30) {
            ctx.fillStyle = "#fff";
            ctx.font = `bold ${Math.max(12, this.radius * 0.4)}px 'Rajdhani'`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(this.name, this.x, this.y);
        }
    }
}

class Food {
    constructor() {
        this.reposition();
        this.color = randColor();
        this.pulse = Math.random() * Math.PI;
    }

    reposition() {
        this.x = (Math.random() - 0.5) * 2 * C.WORLD_SIZE;
        this.y = (Math.random() - 0.5) * 2 * C.WORLD_SIZE;
        this.mass = rand(1, 3);
        this.radius = Math.sqrt(this.mass / Math.PI) * 8; // Visual size bigger than mass
    }

    draw(ctx, time) {
        const p = 1 + Math.sin(time * 0.005 + this.pulse) * 0.2;
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        
        // Hexagon shape
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + time * 0.002;
            const r = this.radius * p;
            ctx.lineTo(this.x + Math.cos(angle) * r, this.y + Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
}

/**
 * MAIN GAME LOOP
 */
const Game = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    running: false,
    
    camera: new Camera(),
    player: null,
    bots: [],
    foods: [],
    particles: [],
    
    input: { x: 0, y: 0, boosting: false },
    mouse: { x: 0, y: 0 },
    
    stats: {
        kills: 0,
        streak: 0,
        fps: 0,
        lastTime: 0
    },

    init() {
        this.canvas = document.getElementById('game');
        this.ctx = this.canvas.getContext('2d', { alpha: false }); // Optimize
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input handling
        window.addEventListener('mousemove', e => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => this.input.boosting = true);
        window.addEventListener('mouseup', () => this.input.boosting = false);
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') this.input.boosting = true; });
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') this.input.boosting = false; });

        // Init World
        this.createWorld();
        
        // Start Loop
        requestAnimationFrame(t => this.loop(t));
        
        // Chat Simulation Loop
        setInterval(() => this.simulateChat(), 3000);
    },

    createWorld() {
        // Player
        this.player = new Entity(0, 0, C.PLAYER_START_MASS, false);
        
        // Bots
        this.bots = [];
        for(let i=0; i<30; i++) this.spawnBot();

        // Food
        this.foods = [];
        for(let i=0; i<500; i++) this.foods.push(new Food());
    },

    spawnBot() {
        const x = (Math.random() - 0.5) * 2 * C.WORLD_SIZE;
        const y = (Math.random() - 0.5) * 2 * C.WORLD_SIZE;
        const mass = rand(10, 80);
        this.bots.push(new Entity(x, y, mass, true));
    },

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    },

    addParticle(x, y, color, size, speed) {
        if(this.particles.length < 200) {
            this.particles.push(new Particle(x, y, color, size, speed));
        }
    },

    simulateChat() {
        if(!this.running) return;
        if(Math.random() > 0.3) return;
        
        const bot = this.bots[Math.floor(Math.random() * this.bots.length)];
        const msg = CHAT_PHRASES[Math.floor(Math.random() * CHAT_PHRASES.length)];
        this.logChat(bot.name, msg);
    },

    logChat(name, msg, isSystem = false) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = 'chat-msg';
        if(isSystem) {
            div.innerHTML = `<span class="chat-sys">${msg}</span>`;
        } else {
            div.innerHTML = `<span class="chat-name">${name}:</span> <span style="color:#ddd">${msg}</span>`;
        }
        log.prepend(div);
        if(log.children.length > 8) log.lastChild.remove();
    },

    showKillText(name) {
        const feed = document.getElementById('kill-feed');
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerText = `YOU KILLED ${name}`;
        feed.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    },

    update(dt) {
        if(!this.running) return;

        // --- PLAYER LOGIC ---
        if (!this.player.isDead) {
            // Convert screen mouse to world coordinates relative to camera
            const screenCenterX = this.width / 2;
            const screenCenterY = this.height / 2;
            
            // Vector from center of screen to mouse
            const aimX = this.mouse.x - screenCenterX;
            const aimY = this.mouse.y - screenCenterY;
            
            this.player.move(this.player.x + aimX, this.player.y + aimY, this.input.boosting);
            this.camera.update(this.player.x, this.player.y, this.player.radius);

            // Mass decay when very big (prevents infinite growth)
            if (this.player.mass > 500) this.player.mass *= 0.9995;
        } else {
            // Spectator mode drift
            this.camera.update(this.camera.x + 1, this.camera.y + 1, 100);
        }

        // --- BOT LOGIC ---
        this.bots.forEach(bot => {
            // Simple AI
            let targetX = bot.x;
            let targetY = bot.y;
            let flee = false;

            // Check distance to player
            const dToPlayer = Math.hypot(this.player.x - bot.x, this.player.y - bot.y);
            
            if (!this.player.isDead && dToPlayer < 400) {
                if (this.player.mass > bot.mass * 1.2) {
                    // Flee from player
                    flee = true;
                    targetX = bot.x - (this.player.x - bot.x);
                    targetY = bot.y - (this.player.y - bot.y);
                } else if (bot.mass > this.player.mass * 1.2) {
                    // Chase player
                    targetX = this.player.x;
                    targetY = this.player.y;
                }
            } 
            
            if (!flee && Math.random() < 0.05) {
                // Wander to random food nearby
                targetX = bot.x + (Math.random() - 0.5) * 500;
                targetY = bot.y + (Math.random() - 0.5) * 500;
            }

            bot.move(targetX, targetY, flee); // Bots boost if fleeing
        });

        // --- COLLISIONS ---
        // 1. Player vs Food
        for (let i = this.foods.length - 1; i >= 0; i--) {
            const f = this.foods[i];
            const dx = this.player.x - f.x;
            const dy = this.player.y - f.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Magnetic pull
            if (dist < this.player.radius + 50) {
                f.x += (this.player.x - f.x) * 0.1;
                f.y += (this.player.y - f.y) * 0.1;
            }

            if (dist < this.player.radius) {
                this.player.mass += f.mass * 0.2; // Diminishing returns
                this.foods.splice(i, 1);
                this.foods.push(new Food()); // Respawn immediately elsewhere
                if(Math.random() < 0.2) AudioEngine.playCollect();
            }
        }

        // 2. Player vs Bots
        if (!this.player.isDead) {
            for (let i = this.bots.length - 1; i >= 0; i--) {
                const bot = this.bots[i];
                const dx = this.player.x - bot.x;
                const dy = this.player.y - bot.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < this.player.radius + bot.radius) {
                    // Overlap
                    if (this.player.mass > bot.mass * 1.1) {
                        // EAT BOT
                        this.player.mass += bot.mass * 0.6;
                        this.camera.shake = 30;
                        AudioEngine.playKill();
                        this.showKillText(bot.name);
                        this.logChat(bot.name, "hacks!!", false);
                        
                        // Explosion
                        for(let k=0; k<20; k++) this.addParticle(bot.x, bot.y, bot.color, rand(5, 15), rand(2,10));
                        
                        this.stats.streak++;
                        this.stats.kills++;
                        this.bots.splice(i, 1);
                        setTimeout(() => this.spawnBot(), rand(1000, 5000));
                    } 
                    else if (bot.mass > this.player.mass * 1.1) {
                        // GET EATEN
                        this.gameOver(bot.name);
                    }
                }
            }
        }

        // 3. Bot vs Food (Simulation to make them grow)
        this.bots.forEach(bot => {
            if(Math.random() < 0.1) bot.mass += 0.5;
        });

        // --- PARTICLES ---
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update();
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }

        // --- UI UPDATES ---
        document.getElementById('score-val').innerText = Math.floor(this.player.mass);
        document.getElementById('streak-val').innerText = this.stats.streak;
        
        if (performance.now() % 500 < 20) {
            this.updateLeaderboard();
        }
    },

    updateLeaderboard() {
        const list = [this.player, ...this.bots];
        list.sort((a, b) => b.mass - a.mass);
        const top5 = list.slice(0, 5);
        
        const html = top5.map((e, i) => {
            const isMe = e === this.player;
            return `<div class="lb-row ${isMe ? 'me' : ''}">
                <span>${i+1}. ${e.name}</span>
                <span>${Math.floor(e.mass)}</span>
            </div>`;
        }).join('');
        document.getElementById('lb-content').innerHTML = html;
    },

    draw() {
        // Clear background
        this.ctx.fillStyle = '#050505';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // SAVE CONTEXT FOR CAMERA TRANSFORM
        this.ctx.save();
        
        // --- CHROMATIC ABERRATION SHAKE ---
        const shake = this.camera.getShake();
        this.ctx.translate(this.width/2 + shake.x, this.height/2 + shake.y);
        this.ctx.scale(this.camera.scale, this.camera.scale);
        this.ctx.translate(-this.camera.x, -this.camera.y);

        // --- DRAW GRID (Parallax feel) ---
        this.ctx.strokeStyle = '#1a1a1a';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        
        // Calculate grid viewport
        const viewL = this.camera.x - (this.width/2)/this.camera.scale;
        const viewR = this.camera.x + (this.width/2)/this.camera.scale;
        const viewT = this.camera.y - (this.height/2)/this.camera.scale;
        const viewB = this.camera.y + (this.height/2)/this.camera.scale;

        const startX = Math.floor(viewL / C.GRID_SIZE) * C.GRID_SIZE;
        const startY = Math.floor(viewT / C.GRID_SIZE) * C.GRID_SIZE;

        for (let x = startX; x < viewR; x += C.GRID_SIZE) {
            this.ctx.moveTo(x, viewT);
            this.ctx.lineTo(x, viewB);
        }
        for (let y = startY; y < viewB; y += C.GRID_SIZE) {
            this.ctx.moveTo(viewL, y);
            this.ctx.lineTo(viewR, y);
        }
        this.ctx.stroke();

        // WORLD BORDER
        this.ctx.strokeStyle = '#ff0055';
        this.ctx.lineWidth = 20;
        this.ctx.shadowBlur = 50;
        this.ctx.shadowColor = '#ff0055';
        this.ctx.strokeRect(-C.WORLD_SIZE, -C.WORLD_SIZE, C.WORLD_SIZE*2, C.WORLD_SIZE*2);
        this.ctx.shadowBlur = 0;

        // --- DRAW ENTITIES ---
        const time = performance.now();
        this.foods.forEach(f => {
            // Cull off-screen food for performance
            if (f.x > viewL && f.x < viewR && f.y > viewT && f.y < viewB) {
                f.draw(this.ctx, time);
            }
        });

        this.bots.forEach(b => b.draw(this.ctx));
        this.particles.forEach(p => p.draw(this.ctx));

        if (!this.player.isDead) this.player.draw(this.ctx);

        this.ctx.restore();
    },

    loop(timestamp) {
        const dt = timestamp - this.stats.lastTime;
        this.stats.lastTime = timestamp;
        this.stats.fps = Math.round(1000 / dt);
        document.getElementById('fps-val').innerText = this.stats.fps;

        this.update(dt);
        this.draw();

        requestAnimationFrame(t => this.loop(t));
    },

    gameOver(killerName) {
        this.player.isDead = true;
        AudioEngine.playDie();
        this.logChat("SYSTEM", `${this.player.name} was devoured by ${killerName}`, true);
        
        // Show start screen again
        setTimeout(() => {
            const screen = document.getElementById('start-screen');
            screen.style.display = 'flex';
            screen.style.opacity = '1';
            document.querySelector('#start-screen h1').innerText = "WASTED";
            document.querySelector('#start-screen .subtitle').innerText = `Consumed by ${killerName}`;
            document.querySelector('#start-screen button').innerText = "RESPAWN";
            this.running = false;
        }, 1000);
    }
};

// Initialize the game object but don't start it yet
game = Object.create(Game);
game.init();

// Export startGame to the global scope so the HTML button can find it
window.startGame = function() {
    AudioEngine.init(); // Must be user triggered
    AudioEngine.playBoost(); // Sound test
    
    document.getElementById('start-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('start-screen').style.display = 'none';
    }, 500);

    game.running = true;
    game.stats.streak = 0;
    
    // Reset player
    game.player = new Entity(0, 0, C.PLAYER_START_MASS, false);
    game.init(); // Re-init listeners just in case
};

})(); // End IIFE
</script>
