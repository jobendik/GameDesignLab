<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phone Game Lab — 70 Mobile Prototypes</title>
<link rel="stylesheet" href="shared/style.css">
<script src="shared/catalog.js"></script>
</head>
<body class="lab-launcher">
  <div class="wrap">
    <h1>Phone Game Lab</h1>
    <p class="sub">A workbench of 70 playable mobile-game prototypes. Each one is a single self-contained folder under
      <code>games/&lt;slug&gt;/</code> so you can pick a winner and grow it into a full game later. Open on any phone — touch &amp; mouse both work.</p>
    <div id="catalog"></div>
  </div>
<script>
(function(){
  const root=document.getElementById('catalog');
  for(const cat of window.LAB_GAMES){
    const h=document.createElement('div'); h.className='cat'; h.textContent=cat.cat; root.appendChild(h);
    const g=document.createElement('div'); g.className='grid';
    for(const it of cat.items){
      const a=document.createElement('a');
      a.className='card';
      a.href='games/'+it.slug+'/index.html';
      a.innerHTML='<div class="n">#'+String(it.n).padStart(2,'0')+'</div>'+
                  '<div class="t">'+it.t+'</div>'+
                  '<div class="d">'+it.d+'</div>';
      g.appendChild(a);
    }
    root.appendChild(g);
  }
})();
</script>
</body>
</html>
