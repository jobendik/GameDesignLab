<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- This launcher is self-contained: it only needs shared/catalog.js from this folder (thumbnails are optional).
     PhoneGameLab/index.html and PhoneGameLab2/index.html are the same file apart from the SKIN and CONFIG blocks. -->
<!--SKIN-->
<meta name="theme-color" content="#121312">
<title>Phone Game Lab — phone-first takes on classic genres</title>
<meta name="description" content="Phone Game Lab: phone-first takes on classic genres, built for one thumb. Part of GameDesignLab.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236fdcc9'/%3E%3Crect x='10' y='5.5' width='12' height='21' rx='3' fill='none' stroke='%230c211d' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%230c211d'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121312; --bg-2:#181a18; --surface:#1e211f; --surface-2:#282c29; --surface-3:#353a36;
  --line:rgba(226,246,238,.09); --line-2:rgba(226,246,238,.18);
  --ink:#f3f6f2; --ink-2:#c7d0c9; --ink-3:#98a39b;
  --accent:#6fdcc9; --accent-hi:#93e8d9; --accent-ink:#0c211d; --accent-2:#ffb347;
  --r:14px; --r-lg:22px; --tilt:0deg;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --display:var(--font); --display-w:820; --display-ls:-.03em;
  --band:radial-gradient(700px 300px at 88% 10%,rgba(111,220,201,.16),transparent 70%),linear-gradient(180deg,var(--surface),var(--bg-2));
}
</style>
<!--/SKIN-->
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;font:400 1rem/1.45 var(--font);color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;--pad:clamp(16px,3.2vw,44px)}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
svg.i.solid{fill:currentColor;stroke:none}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding-inline:var(--pad)}
.cq{container-type:inline-size}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:clamp(8px,2vw,18px);height:60px}
.up{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);text-decoration:none;font-weight:650;font-size:.92rem;white-space:nowrap;flex:none}
.up:hover{background:var(--surface-2)}
.search{position:relative;flex:1;max-width:520px;margin-inline:auto}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 44px 0 42px;font-size:1rem;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:focus-visible{outline-offset:0;border-color:transparent}
.search .clr{position:absolute;right:2px;top:0;width:44px;height:44px;border:0;background:none;color:var(--ink-2);border-radius:999px;display:grid;place-items:center}
.ib{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0}
.ib:hover{background:var(--surface-2)}

main{padding-block:clamp(14px,2.2vw,26px) 56px}
.band{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--band);box-shadow:0 0 0 1px var(--line);padding:clamp(20px,4cqw,44px);padding-right:clamp(20px,34cqw,420px);min-height:clamp(150px,22cqw,230px);display:flex;flex-direction:column;justify-content:center}
.band .kicker{font-size:.76rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
.band h1{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--display-ls);font-size:clamp(2rem,5cqw + .8rem,3.6rem);line-height:1.02;margin-top:.35rem}
.band p{margin-top:.6rem;position:relative;z-index:1;color:var(--ink-2);font-size:clamp(1rem,.6cqw + .9rem,1.15rem);max-width:40ch;text-wrap:pretty}
.art{position:absolute;right:clamp(4px,3cqw,48px);bottom:0;width:clamp(120px,30cqw,340px);height:auto;pointer-events:none}
.jump{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px calc(var(--pad)*-1) 0;padding:4px var(--pad)}
.jump::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ink-2);font-size:.9rem;font-weight:600;white-space:nowrap;flex:none;text-decoration:none}
.chip:hover{background:var(--surface);color:var(--ink)}
.chip small{font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (min-width:900px){.jump{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}

section{margin-top:clamp(26px,3.4vw,42px)}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.head h2{font-family:var(--display);font-size:clamp(1.2rem,1.2vw + .85rem,1.6rem);letter-spacing:-.02em;font-weight:760;line-height:1.2}
.head span{color:var(--ink-3);font-size:.9rem}
.status{margin-top:18px;color:var(--ink-2);font-size:.92rem;min-height:1.4em}
.status b{color:var(--ink)}

.grid{--cols:2;--gap:12px;--body-h:6.2rem;--cw:calc((100cqw - (var(--cols) - 1)*var(--gap))/var(--cols))}
@container (min-width:480px){.grid{--cols:3}}
@container (min-width:660px){.grid{--cols:4;--gap:16px}}
@container (min-width:860px){.grid{--cols:5;--gap:16px}}
@container (min-width:1060px){.grid{--cols:6;--gap:18px}}
@container (min-width:1260px){.grid{--cols:7;--gap:18px}}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:calc(var(--cw)*1.5 + var(--body-h))}
.card{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line);text-decoration:none;
  content-visibility:auto;contain-intrinsic-size:auto 170px auto 340px;transition:transform .16s cubic-bezier(.2,.7,.2,1),box-shadow .16s,background .16s;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.card:focus-visible{outline:none;box-shadow:0 0 0 2.5px var(--accent),0 14px 30px -14px rgba(0,0,0,.8)}
@media (hover:hover){.card:hover{transform:translateY(-3px) rotate(var(--tilt));background:var(--surface-2);box-shadow:0 0 0 1px var(--line-2),0 16px 32px -16px rgba(0,0,0,.85)}}
.card:active{transform:scale(.985)}
.thumb{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;background:linear-gradient(155deg,hsl(var(--h,150) 34% 30%),hsl(var(--h2,190) 40% 14%))}
.thumb svg.pm{position:absolute;inset:0;width:100%;height:100%}
.thumb b{position:relative;font-family:var(--display);font-weight:800;font-size:2.1rem;letter-spacing:.04em;color:rgba(255,255,255,.9)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;background:rgba(14,14,13,.82);color:var(--ink);font-size:.76rem;font-weight:700;line-height:1}
.tag svg{width:12px;height:12px;color:var(--accent-2)}
.body{height:var(--body-h);padding:.6rem .75rem;display:flex;flex-direction:column;min-width:0}
.body h3{font-family:var(--display);font-size:.98rem;font-weight:700;letter-spacing:-.005em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body p{margin-top:.12rem;font-size:.8rem;line-height:1.38;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:1.1rem;font-size:.76rem;color:var(--ink-3)}
.meta .pb{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.meta .pb svg{width:13px;height:13px}
.meta .new{margin-left:auto;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.66rem;color:var(--ink-3)}
.minis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:-4px calc(var(--pad)*-1);padding:4px var(--pad)}
.minis::-webkit-scrollbar{display:none}
.mini{display:flex;align-items:center;gap:10px;flex:none;min-height:64px;max-width:250px;padding:7px 16px 7px 7px;border-radius:calc(var(--r) + 2px);background:var(--surface);box-shadow:0 0 0 1px var(--line);text-decoration:none}
.mini:hover{background:var(--surface-2)}
.mini .thumb{flex:none;width:50px;height:50px;border-radius:calc(var(--r) - 4px)}
.mini .thumb b{font-size:1rem}
.mini .mx{min-width:0;display:block}
.mini .mx b{display:block;font-family:var(--display);font-weight:700;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mx small{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--ink-3);white-space:nowrap}
.mini .mx small.pb{color:var(--accent);font-weight:700}
.mini .mx small svg{width:13px;height:13px}
.empty{margin-top:22px;padding:48px 20px;text-align:center;border-radius:var(--r-lg);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.empty h2{font-family:var(--display);font-size:1.3rem}
.empty p{color:var(--ink-2);margin:.5rem 0 1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:750}
.btn:hover{background:var(--accent-hi)}.btn:focus-visible{outline-color:var(--ink)}
.fatal{max-width:560px;margin:12vh auto;padding:28px;border-radius:var(--r-lg);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.fatal h2{font-size:1.4rem;margin-bottom:.6rem}.fatal p{color:var(--ink-2)}.fatal code{background:var(--surface-3);padding:2px 7px;border-radius:6px;font-size:.9em;color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--ink-3);font-size:.86rem}
footer a{color:var(--ink-2);text-underline-offset:3px;display:inline-block;padding:6px 0}
@media (max-width:560px){.up span{display:none}.up{padding:0;width:44px;justify-content:center}.bar{gap:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.card:hover,.card:active{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01" stroke-width="2.6"/></symbol>

<header class="top">
  <div class="wrap bar">

    <form class="search" role="search" id="searchform">

  </div>
</header>
<main id="main" class="wrap">
  <noscript><div class="fatal"><h2>JavaScript is needed</h2><p>These games and this launcher run on JavaScript. Enable it and reload.</p></div></noscript>
  <div class="cq" id="intro">
    <div class="band">
      <p class="kicker" id="kicker"></p>
      <h1 id="name"></h1>
      <p id="tagline"></p>
<!--ART-->
      <svg class="art" viewBox="0 0 340 220" aria-hidden="true">
        <g transform="rotate(-9 190 150)">
          <rect x="120" y="26" width="132" height="250" rx="24" fill="#161a18" stroke="#6fdcc9" stroke-opacity=".55" stroke-width="3"/>
          <rect x="132" y="44" width="108" height="220" rx="12" fill="#1f2a27"/>
          <circle cx="164" cy="96" r="20" fill="#6fdcc9"/>
          <rect x="196" y="112" width="34" height="34" rx="8" fill="#ffb347"/>
          <path d="M150 190l22-38 22 38z" fill="#f3f6f2" fill-opacity=".85"/>
          <circle cx="216" cy="74" r="7" fill="#f3f6f2" fill-opacity=".5"/>
          <rect x="170" y="34" width="32" height="5" rx="2.5" fill="#6fdcc9" fill-opacity=".5"/>
        </g>
        <g fill="none" stroke="#6fdcc9" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"><path d="M64 150c14-26 30-40 52-48"/><path d="M40 196c8-20 16-32 26-42"/><circle cx="292" cy="52" r="9"/><path d="M300 150l14 14M314 150l-14 14"/></g>
      </svg>
<!--/ART-->
    </div>
    <nav class="jump" id="jump" aria-label="Categories" hidden></nav>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <section class="cq" id="recent" aria-labelledby="h-recent" hidden></section>
  <div id="cats"></div>
  <div class="empty" id="empty" hidden><h2>No game matches that</h2><p id="empty-p"></p><button class="btn" type="button" id="empty-reset">Show every game</button></div>
</main>
<footer><div class="wrap"><span id="foot"></span> <a id="foot-up" href="../index.html">More games in the GameDesignLab arcade →</a></div></footer>

<script src="shared/catalog.js"></script>
<script>
/*CONFIG*/
var LAB = {
  name: 'Phone Game Lab',
  kicker: 'GameDesignLab collection',
  tagline: function (n) { return n + ' phone-first takes on classic genres — built for one thumb, a spare minute and a best score to beat.'; }
};
/*/CONFIG*/
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var icon = function (n, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; };
$('#name').textContent = LAB.name; $('#kicker').textContent = LAB.kicker;

/* the arcade lives one folder up; hosted on its own (at a site root) that link would point back here, so drop it */
(function () { try { var up = new URL('../index.html', location.href), here = new URL('index.html', location.href); if (up.pathname === here.pathname) { $('#up').hidden = true; $('#foot-up').hidden = true; } } catch (e) { } })();

var RAW = window.LAB_GAMES;
if (!Array.isArray(RAW) || !RAW.length) {
  $('#cats').innerHTML = '<div class="fatal" role="alert"><h2>The game list didn’t load</h2><p>This page builds itself from <code>shared/catalog.js</code>, which is missing or empty. Regenerate it with <code>node tools/build-catalog.js</code> and reload.</p></div>';
  $('#searchform').hidden = true; $('#lucky').hidden = true; $('#status').hidden = true;
  return;
}
var store = (function () {
  var ls = null; try { ls = window.localStorage; ls.getItem('gdl:recent'); } catch (e) { ls = null; }
  return { get: function (k, d) { if (!ls) return d; try { var v = ls.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } } };
})();
/* ids match the game engine: "<lab folder>/<slug>" */
var segs = location.pathname.split('/').filter(Boolean); if (/\.html?$/i.test(segs[segs.length - 1] || '')) segs.pop();
var labId = segs.length ? decodeURIComponent(segs[segs.length - 1]) : 'PhoneGameLab';
function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function norm(s) { s = String(s || '').toLowerCase(); if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); return s.replace(/[^a-z0-9.]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function plural(n, w) { return n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's'); }
function fmt(n) { return Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : (Math.round(n * 100) / 100).toLocaleString(); }

var cats = [], items = [], seen = {};
RAW.forEach(function (c) {
  if (!c || !Array.isArray(c.items)) return;
  var name = String(c.cat || 'Games'), cat = cats.filter(function (x) { return x.name === name; })[0];
  if (!cat) cats.push(cat = { name: name, items: [] });
  c.items.forEach(function (it) {
    if (!it || !it.slug || seen[it.slug]) return; seen[it.slug] = 1;
    var t = String(it.t || it.slug), h = hash(labId + '/' + it.slug);
    var g = { slug: String(it.slug), id: labId + '/' + it.slug, t: t, d: String(it.d || ''), score: typeof it.score === 'number' && it.score > 0 ? it.score : 0, v2: !!it.v2, thumb: it.thumb || '', cat: name,
      href: 'games/' + encodeURIComponent(it.slug) + '/index.html', h: h, hay: norm(t + ' ' + (it.d || '') + ' ' + name) };
    cat.items.push(g); items.push(g);
  });
});
cats = cats.filter(function (c) { return c.items.length; });
var bySlug = {}; items.forEach(function (g) { bySlug[g.slug] = g; });
function best(g) { var b = store.get('gdl:best:' + g.id, null); return typeof b === 'number' && isFinite(b) ? b : null; }

function art(g) {
  var h = g.h, m = (h >>> 5) % 4, a = 20 + (h >>> 8) % 60, b = 20 + (h >>> 14) % 60, s = '', i;
  if (m === 0) for (i = 1; i < 5; i++) s += '<circle cx="' + a + '" cy="' + b + '" r="' + i * 17 + '" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="7"/>';
  else if (m === 1) for (i = -2; i < 6; i++) s += '<rect x="' + (i * 26 + a % 20) + '" y="-40" width="11" height="180" fill="#fff" fill-opacity=".08" transform="rotate(' + (20 + b % 30) + ' 50 50)"/>';
  else if (m === 2) s = '<circle cx="' + a + '" cy="' + (b * .6) + '" r="34" fill="#fff" fill-opacity=".09"/><circle cx="' + (100 - a * .7) + '" cy="' + (60 + b * .4) + '" r="26" fill="#fff" fill-opacity=".07"/><circle cx="' + b + '" cy="92" r="16" fill="#000" fill-opacity=".14"/>';
  else for (i = 0; i < 5; i++) s += '<path d="M-10 ' + (i * 24 + b % 20) + ' l20 -12 20 12 20 -12 20 12 20 -12 20 12" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="5" stroke-linejoin="round"/>';
  var w = g.t.replace(/[^A-Za-z0-9À-ÿ ]+/g, ' ').trim().split(/\s+/).filter(Boolean), ini = (w.length > 1 ? w[0].charAt(0) + w[1].charAt(0) : (w[0] || '?').slice(0, 2)).toUpperCase();
  return '<svg class="pm" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + s + '</svg><b aria-hidden="true">' + esc(ini) + '</b>';
}
function card(g) {
  var b = best(g), hue = g.h % 360;
  return '<a class="card" href="' + esc(g.href) + '" data-slug="' + esc(g.slug) + '" title="' + esc(g.t + (g.d ? ' — ' + g.d : '')) + '">' +
    '<span class="thumb" style="--h:' + hue + ';--h2:' + ((hue + 28 + (g.h >>> 9) % 70) % 360) + '">' + art(g) +
      (g.score ? '<span class="tag" title="Reviewed quality: ' + g.score + ' out of 10">' + icon('star', 'solid') + '<span class="sr">Reviewed quality </span>' + g.score + '<span class="sr"> out of 10</span></span>' : '') + '</span>' +
    '<span class="body"><h3>' + esc(g.t) + '</h3><p>' + esc(g.d) + '</p><span class="meta">' +
      (b != null ? '<span class="pb" title="Your personal best">' + icon('trophy') + '<span class="sr">Your best </span>' + esc(fmt(b)) + '</span>' : '') +
      (g.v2 ? '<span class="new" title="Rebuilt on the new engine">Rebuilt</span>' : '') + '</span></span></a>';
}
function slugify(s) { return 'c-' + (norm(s).replace(/[^a-z0-9]+/g, '-') || 'games'); }

$('#tagline').textContent = LAB.tagline(items.length);
$('#q').placeholder = 'Search ' + items.length + ' games';
$('#foot').textContent = LAB.name + ' · ' + plural(items.length, 'game') + ' ·';
document.title = LAB.name + ' — ' + plural(items.length, 'game');
$('#cats').innerHTML = cats.map(function (c) {
  var id = slugify(c.name);
  return '<section class="cq" id="' + id + '" aria-labelledby="h-' + id + '" tabindex="-1"><div class="head"><h2 id="h-' + id + '">' + esc(c.name) + '</h2><span>' + plural(c.items.length, 'game') + '</span></div><div class="grid">' + c.items.map(card).join('') + '</div></section>';
}).join('');
if (cats.length > 1) { var j = $('#jump'); j.hidden = false; j.innerHTML = cats.map(function (c) { return '<a class="chip" href="#' + slugify(c.name) + '">' + esc(c.name) + ' <small>' + c.items.length + '</small></a>'; }).join(''); }

function renderRecent() {
  var r = store.get('gdl:recent', []), list = (Array.isArray(r) ? r : []).filter(function (x) { return typeof x === 'string' && x.indexOf(labId + '/') === 0; }).map(function (x) { return bySlug[x.slice(labId.length + 1)]; }).filter(Boolean).slice(0, 12);
  var sec = $('#recent'); sec.dataset.n = list.length;
  sec.innerHTML = list.length ? '<div class="head"><h2 id="h-recent">Jump back in</h2><span>Recently played</span></div><div class="minis">' + list.map(function (g) {
    var b = best(g), hue = g.h % 360;
    return '<a class="mini" href="' + esc(g.href) + '" data-slug="' + esc(g.slug) + '"><span class="thumb" style="--h:' + hue + ';--h2:' + ((hue + 28 + (g.h >>> 9) % 70) % 360) + '">' + art(g) + '</span>' +
      '<span class="mx"><b>' + esc(g.t) + '</b>' + (b != null ? '<small class="pb">' + icon('trophy') + '<span class="sr">Your best </span>' + esc(fmt(b)) + '</small>' : '<small>' + esc(g.cat) + '</small>') + '</span></a>';
  }).join('') + '</div>' : '';
  sec.hidden = !list.length || !!state.q;
}

/* thumbnails are optional (the folder can be hosted without them): probe one, and only then ask for the rest */
function loadThumbs() {
  var first = items.filter(function (g) { return g.thumb; })[0]; if (!first) return;
  var probe = new Image();
  probe.onload = function () { thumbsOK = true; paintThumbs(document); };
  probe.src = first.thumb;
}
var thumbsOK = false;
function paintThumbs(root) {
  if (!thumbsOK) return;
  $$('[data-slug]', root).forEach(function (c) {
    var g = bySlug[c.dataset.slug], th = $('.thumb', c); if (!g || !g.thumb || $('img', th)) return;
    var im = document.createElement('img'); im.alt = c.classList.contains('mini') ? '' : g.t + ' — gameplay screenshot'; im.width = 300; im.height = 477; im.loading = 'lazy'; im.decoding = 'async';
    im.onerror = function () { im.remove(); }; im.src = g.thumb; th.insertBefore(im, th.querySelector('.tag'));
  });
}

/* search (state in the hash as #q=…; category jump links keep working as plain anchors) */
var state = { q: '' }, q = $('#q');
function readHash() { var m = /^#q=(.*)$/.exec(location.hash); if (!m) return ''; try { return decodeURIComponent(m[1].replace(/\+/g, ' ')).slice(0, 80); } catch (e) { return ''; } }
function apply() {
  var toks = norm(state.q).split(' ').filter(Boolean), n = 0;
  $$('#cats section').forEach(function (sec) {
    var any = 0;
    $$('.card', sec).forEach(function (c) { var g = bySlug[c.dataset.slug], ok = !toks.length || toks.every(function (t) { return g.hay.indexOf(t) >= 0; }); c.hidden = !ok; if (ok) { any++; n++; } });
    sec.hidden = !any; $('.head span', sec).textContent = plural(any, 'game');
  });
  $('.band').hidden = !!state.q;
  $('#recent').hidden = !!state.q || !+$('#recent').dataset.n;
  $('#jump').hidden = !!state.q || cats.length < 2;
  $('#empty').hidden = n > 0; if (!n) $('#empty-p').textContent = 'Nothing in ' + LAB.name + ' matches “' + state.q + '”.';
  $('#status').innerHTML = state.q ? '<b>' + plural(n, 'game') + '</b> matching “' + esc(state.q) + '”' : '<b>' + plural(items.length, 'game') + '</b>' + (cats.length > 1 ? ' in ' + cats.length + ' categories' : '');
  if (q.value !== state.q && document.activeElement !== q) q.value = state.q;
  $('#qclr').hidden = !q.value;
}
function setQ(v, push) {
  v = v.replace(/^\s+/, '').slice(0, 80); if (v === state.q) return; state.q = v;
  try { history[push ? 'pushState' : 'replaceState'](null, '', v ? '#q=' + encodeURIComponent(v) : location.pathname + location.search); } catch (e) { }
  apply(); if (window.scrollY > $('#status').offsetTop) window.scrollTo(0, 0);
}
var typing = false;
q.addEventListener('input', function () { var first = !state.q && !typing; typing = true; setQ(q.value, first); });
q.addEventListener('blur', function () { typing = false; });
q.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (q.value) { e.preventDefault(); q.value = ''; setQ('', true); } else q.blur(); }
  else if (e.key === 'ArrowDown' || e.key === 'Enter') { var c = $('#cats .card:not([hidden])'); if (c) { e.preventDefault(); c.focus(); } }
});
$('#searchform').addEventListener('submit', function (e) { e.preventDefault(); });
function clearQ() { q.value = ''; typing = false; setQ('', true); }
$('#qclr').addEventListener('click', function () { clearQ(); q.focus(); });
$('#empty-reset').addEventListener('click', clearQ);
window.addEventListener('hashchange', function () { var v = readHash(); if (/^#q=/.test(location.hash) || !location.hash) { if (v !== state.q) { state.q = v; q.value = v; apply(); } } });
window.addEventListener('popstate', function () { var v = readHash(); if (v !== state.q) { state.q = v; q.value = v; apply(); } });
$('#lucky').addEventListener('click', function () { var pool = $$('#cats .card:not([hidden])'); if (!pool.length) pool = $$('#cats .card'); var c = pool[Math.floor(Math.random() * pool.length)]; if (c) location.href = c.href; });

/* keyboard: "/" search, arrows roam the cards */
document.addEventListener('keydown', function (e) {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement, typingIn = a && (a.tagName === 'INPUT' || a.isContentEditable);
  if (e.key === '/' && !typingIn) { e.preventDefault(); q.focus(); q.select(); return; }
  if (typingIn || !/^Arrow/.test(e.key) || !a || !a.classList.contains('card')) return;
  var r0 = a.getBoundingClientRect(), bestEl = null, bs = 1e12, k = e.key;
  $$('.card').forEach(function (c) {
    if (c === a || c.hidden || !c.offsetParent) return; var r = c.getBoundingClientRect(), main, cross, horiz = k === 'ArrowLeft' || k === 'ArrowRight';
    if (k === 'ArrowRight') { if (r.left < r0.right - 2) return; main = r.left - r0.right; }
    else if (k === 'ArrowLeft') { if (r.right > r0.left + 2) return; main = r0.left - r.right; }
    else if (k === 'ArrowDown') { if (r.top < r0.bottom - 2) return; main = r.top - r0.bottom; }
    else { if (r.bottom > r0.top + 2) return; main = r0.top - r.bottom; }
    cross = horiz ? Math.abs((r.top + r.bottom) - (r0.top + r0.bottom)) / 2 : Math.abs((r.left + r.right) - (r0.left + r0.right)) / 2;
    if (horiz && cross > r0.height / 2) return;
    var s = main + cross * 3; if (s < bs) { bs = s; bestEl = c; }
  });
  if (bestEl) { e.preventDefault(); bestEl.focus(); bestEl.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

state.q = readHash(); q.value = state.q;
renderRecent(); apply(); loadThumbs();
function refresh() {            // back from a game: bests and "jump back in" may have changed
  $$('#cats .card').forEach(function (c) { var g = bySlug[c.dataset.slug]; if (!g) return; var b = best(g), m = $('.meta', c), pb = $('.pb', m); if (b == null) { if (pb) pb.remove(); return; }
    var html = '<span class="pb" title="Your personal best">' + icon('trophy') + '<span class="sr">Your best </span>' + esc(fmt(b)) + '</span>'; if (pb) pb.outerHTML = html; else m.insertAdjacentHTML('afterbegin', html); });
  renderRecent(); paintThumbs($('#recent'));
}
window.addEventListener('pageshow', function (e) { if (e.persisted) refresh(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
window.addEventListener('storage', function (e) { if (!e.key || e.key.indexOf('gdl:') === 0) refresh(); });
})();
</script>
</body>
</html>
