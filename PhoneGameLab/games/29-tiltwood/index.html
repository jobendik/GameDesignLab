(function(){ "use strict";
/* TILTWOOD — a wooden tilt-labyrinth toy. Drag anywhere to tip the board; a steel marble rolls with real inertia.
 * Identity: birch board, walnut frame, brass inlays on a green felt table; woody knocks and a soft rolling rumble.
 * Depth: brass stars double as checkpoints (they sit down risky side passages), holes sit against a wall so the
 * skill is hugging the opposite wall, par times reward clean fast lines. Generated boards grow level by level.
 * All physics runs in cell units on a canonical portrait grid; landscape simply transposes the view.            */
Lab.init({
  title: "Tiltwood", tagline: "Tip the board. Roll the marble home.", category: "Runner & Movement",
  howto: ["Drag anywhere to tilt the board", "Stars score and act as checkpoints", "Hug the far wall to pass a hole"],
  theme: { bg: "#102720", bg2: "#245646", accent: "#f0b54a", accent2: "#e9cf9f" },
  orient: "any", music: { style: "puzzle", key: "F", vol: .5 }, restart: start,

    get level() { return level; }, get score() { return score; }, get marbles() { return marbles; }, get mode() { return mode; },
    get ball() { return { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy }; }, get tilt() { return { u: tilt.u, v: tilt.v }; },
    get stars() { return stars.map(s => ({ u: s.u, v: s.v, got: s.got })); }, get holes() { return holes.map(h => ({ u: h.u, v: h.v })); },
    get goal() { return { u: goal.u, v: goal.v }; }, get par() { return par; }, get time() { return lt; }, get flip() { return flip; },
    get grid() { return { C, R }; }, get checkpoint() { return { u: check.u, v: check.v }; },

Lab.onResize(() => { if (wl) layout(); });

/* ------------------------------------------------------------------ layout + baked board art */

/* ------------------------------------------------------------------ physics (cell units, fixed step) */

function reachGoal() {

  Lab.sfx("levelup"); Lab.buzz(20); Lab.hitstop(.05);

  if (!fell) { gain += 50; lines.push(["NO SLIPS +50", "#bfe3ff"]); }

/* ------------------------------------------------------------------ frame */
const SP = (u, v) => { const p = PX(u, v); return [ox + p[0], oy + p[1]]; };
function frame(dt, t) {

  else if (Lab.input.down) { const r = 62 * U; tx = (Lab.input.x - Lab.input.startX) / r; ty = (Lab.input.y - Lab.input.startY) / r; const m = Math.hypot(tx, ty); if (m > 1) { tx /= m; ty /= m; } else if (m < .07) tx = ty = 0; }

  tilt.u = Lab.damp(tilt.u, live ? (flip ? ty : tx) : 0, 15, dt); tilt.v = Lab.damp(tilt.v, live ? (flip ? tx : ty) : 0, 15, dt);

  } else if (mode === "play") {

    if (moved) lt += dt;
    acc = Math.min(acc + dt, .05);
    while (acc >= STEP && mode === "play") { step(STEP); acc -= STEP; }

    if (sp > .7 && rollT <= 0 && mode === "play") { Lab.audio.noise({ dur: .09, vol: Math.min(.06, .011 * sp), bp: 210 + sp * 70, q: 1.6 }); rollT = .075; }
  } else if (mode === "fall") {

  } else if (mode === "goal") { ball.x = Lab.damp(ball.x, goal.u, 14, dt); ball.y = Lab.damp(ball.y, goal.v, 14, dt); }
  for (const s of stars) if (s.pop > 0) s.pop = Math.max(0, s.pop - dt * 2.5);
  Lab.music.intensity(.3 + stars.filter(s => s.got).length * .12 + (marbles === 1 ? .28 : 0));
  render(dt, t);
}

/* ------------------------------------------------------------------ rendering */
function marbleSprite(r) {
  const pad = 2, sz = r * 2 + pad * 2;
  return Lab.sprite("mb" + Math.round(r * 4), sz, sz, g => {
    const cx = sz / 2, gr = g.createRadialGradient(cx - r * .38, cx - r * .42, r * .08, cx, cx, r);
    gr.addColorStop(0, "#ffffff"); gr.addColorStop(.3, "#d5dde6"); gr.addColorStop(.72, "#8794a4"); gr.addColorStop(1, "#465160");
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cx, r, 0, TAU); g.fill();
    g.strokeStyle = "rgba(244,196,120,.5)"; g.lineWidth = r * .14; g.beginPath(); g.arc(cx, cx, r * .82, Math.PI * .2, Math.PI * .8); g.stroke(); // wood reflected underneath

}
function render(dt, t) {
  const c = Lab.ctx, W = Lab.W, H = Lab.H, k = cell / 60, P = Lab.play;
  const tsx = flip ? tilt.v : tilt.u, tsy = flip ? tilt.u : tilt.v, tm = Math.hypot(tsx, tsy);
  draw.bg(c, "#2a6351", "#102720", "#1c4638");
  draw.glow(c, W * .5, oy + bh * .45, Math.max(bw, bh) * .9, "#8fd6b4", .12);
  draw.vignette(c, .45);
  // board: shifts a little with the tilt, its shadow goes the other way, the low side darkens
  const bi = anim.boardIn, shx = tsx * 5 * k, shy = tsy * 5 * k;
  c.save();
  c.translate(W / 2, oy + bh / 2); c.scale(.9 + .1 * bi, .9 + .1 * bi); c.translate(-W / 2, -(oy + bh / 2)); c.globalAlpha = Math.min(1, bi * 1.6);
  draw.rect(c, ox - FR - tsx * 9 * k, oy - FR + 9 * k - tsy * 9 * k, bw + 2 * FR, bh + 2 * FR, FR * 1.2, "rgba(0,0,0,.34)");
  c.translate(ox + shx, oy + shy);
  const m = FR + 8; c.drawImage(baseCv, -m, -m, baseCv.w, baseCv.h);
  { const [x, y] = PX(goal.u, goal.v), pu = .5 + .5 * Math.sin(t * 3.2); c.globalAlpha = (.25 + pu * .35) * Math.min(1, bi); draw.circle(c, x, y, cell * (.36 + pu * .05), null, "#ffe08a", 2.5 * k); c.globalAlpha = Math.min(1, bi * 1.6); }
  if (check.u !== cu(startC) || check.v !== cv(startC)) { const [x, y] = PX(check.u, check.v); draw.circle(c, x, y, cell * .26, null, "rgba(240,181,74,.55)", 2 * k); }
  for (const s of stars) {
    const [x, y] = PX(s.u, s.v);
    if (s.got) { if (s.pop > 0) { c.globalAlpha = s.pop; draw.star(c, x, y - (1 - s.pop) * cell * .5, cell * .2 * (1 + (1 - s.pop)), "#fff3c4"); c.globalAlpha = 1; } continue; }
    const bob = Math.sin(t * 2.4 + s.ph), r = cell * (.19 + bob * .012);
    draw.shadow(c, x + tsx * 3 * k, y + cell * .2, r * .8, r * .22, .2);
    c.save(); c.translate(x, y - 2 * k + bob * 1.5 * k); c.rotate(Math.sin(t * 1.3 + s.ph) * .14);
    draw.star(c, 0, 1.6 * k, r, "#a9711c"); draw.star(c, 0, 0, r, "#f6c453"); draw.star(c, -r * .08, -r * .1, r * .55, "#ffe69a");
    c.restore();
  }
  // marble
  const [bx, by] = PX(ball.x, ball.y), br = BR * cell; let sc = 1, al = 1, lift = 0;
  if (mode === "drop") { const u = Math.min(1, modeT / .42); sc = 1 + (1 - Lab.ease.outCubic(u)) * 1.1; al = Math.min(1, u * 3); lift = (1 - u) * cell * .5; }
  if (mode === "fall") { const u = Math.min(1, modeT / .45); sc = 1 - u * .62; al = 1 - Math.max(0, u - .55) / .45; }
  if (mode === "goal") { const u = Math.min(1, modeT / .4); sc = 1 - u * .3; }
  if (mode !== "out") {
    c.globalAlpha = al * Math.min(1, bi * 1.6);
    if (mode !== "fall") draw.shadow(c, bx + tsx * 6 * k + lift * .3, by + br * .62 + tsy * 4 * k + lift * .6, br * sc * .95, br * .42, mode === "drop" ? .14 : .3);
  }
  c.drawImage(topCv, -m + tsx * cell * .055, -m + tsy * cell * .055 - cell * .04, topCv.w, topCv.h);
  if (tm > .02) { // light the high side, shade the low side
    const a = Math.min(.2, tm * .2), L = Math.max(bw, bh) * .6, g = c.createLinearGradient(bw / 2 - tsx / tm * L, bh / 2 - tsy / tm * L, bw / 2 + tsx / tm * L, bh / 2 + tsy / tm * L);
    g.addColorStop(0, `rgba(255,246,220,${a})`); g.addColorStop(.5, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(30,12,0,${a * 1.25})`);
    draw.rr(c, -FR, -FR, bw + 2 * FR, bh + 2 * FR, FR * 1.15); c.fillStyle = g; c.fill();
  }
  if (mode !== "out") {
    c.save(); c.translate(bx, by - lift); c.globalAlpha = al * Math.min(1, bi * 1.6);
    if (ball.sq > .01) { c.rotate(ball.sqa); c.scale(1 - ball.sq, 1 + ball.sq * .6); c.rotate(-ball.sqa); }
    c.scale(sc, sc);
    const sp = marbleSprite(br); c.drawImage(sp, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
    for (const p of marks) { // dimples roll with the ball
      if (p[2] < .08) continue; const mx = (flip ? p[1] : p[0]) * br * .86, my = (flip ? p[0] : p[1]) * br * .86;
      c.fillStyle = `rgba(40,52,68,${.34 * p[2]})`; c.beginPath(); c.ellipse(mx, my, br * .17 * p[2] + .4, br * .17, Math.atan2(my, mx) + Math.PI / 2, 0, TAU); c.fill();
    }
    c.fillStyle = "rgba(255,255,255,.9)"; c.beginPath(); c.ellipse(-br * .36 - tsx * br * .12, -br * .42 - tsy * br * .12, br * .2, br * .13, -.6, 0, TAU); c.fill();
    if (mode === "fall") { c.fillStyle = `rgba(0,0,0,${Math.min(.75, modeT * 2)})`; c.beginPath(); c.arc(0, 0, br, 0, TAU); c.fill(); }
    c.restore();

  const ngot = stars.filter(s => s.got).length;
  draw.text(c, "LEVEL " + level, lx, hy - 8, { size: fs, color: "#f6e4bd", align: "left", shadow: true });
  for (let i = 0; i < 3; i++) { const got = i < ngot, x = lx + 8 + i * 19, y = hy + 11; draw.star(c, x, y, 8, got ? "#f6c453" : "rgba(0,0,0,.28)"); if (!got) { c.strokeStyle = "rgba(246,228,189,.45)"; c.lineWidth = 1.2; c.stroke(); } }
  const over = lt > par, tcol = over ? "#f3c9a0" : "#ffffff";
  draw.text(c, Lab.fmtTime(lt), W / 2, hy - 6, { size: fs * 1.5, color: tcol, shadow: true });
  draw.text(c, "PAR " + Lab.fmtTime(par).replace(/\.0$/, ""), W / 2, hy + 13, { size: fs * .78, color: over ? "rgba(246,228,189,.55)" : "#a6f2cf", weight: 700 });
  for (let i = 0; i < Math.max(3, marbles); i++) { const x = rx - 9 - i * 20, on = i < marbles; c.globalAlpha = on ? 1 : .25; const sp = marbleSprite(8); c.drawImage(sp, x - sp.w / 2, hy + 2 - sp.h / 2, sp.w, sp.h); } c.globalAlpha = 1;
  // drag ring: the finger's anchor and how far the board is tipped

    const r = 62 * U, x0 = Lab.input.startX, y0 = Lab.input.startY;
    draw.circle(c, x0, y0, r, "rgba(255,255,255,.07)", "rgba(255,255,255,.3)", 2);
    draw.line(c, x0, y0, x0 + tsx * r, y0 + tsy * r, "rgba(255,255,255,.35)", 3);
    draw.circle(c, x0 + tsx * r, y0 + tsy * r, 15 * U, "rgba(255,255,255,.85)", "rgba(60,40,20,.4)", 2);
  } else if (level === 1 && !everMoved && mode === "play") { // first-run coaching: a ghost drag
    const u = (t * .7) % 1, r = 44 * U, x0 = W / 2, y0 = Math.min(H - r - 26, oy + bh * .72), a = Lab.ease.inOutQuad(Math.min(1, u * 2)) * (u > .85 ? (1 - u) / .15 : 1);
    const [sx, sy] = SP(ball.x, ball.y), [gx, gy] = SP(goal.u, goal.v), d = Math.hypot(gx - sx, gy - sy) || 1;
    c.globalAlpha = .85; draw.circle(c, x0, y0, r, "rgba(20,40,30,.35)", "rgba(255,255,255,.55)", 2); draw.circle(c, x0 + (gx - sx) / d * r * a * .8, y0 + (gy - sy) / d * r * a * .8, 13 * U, "#fff");
    draw.text(c, "drag to tilt", x0, y0 + r + 14, { size: 14, color: "#fff", shadow: true }); c.globalAlpha = 1;
  }
}
Lab.boot();
})();
