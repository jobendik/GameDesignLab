(function(){ "use strict";

}

  c.strokeStyle = col; c.lineWidth = 1.3; c.stroke();

  c.lineWidth = 1.2; c.beginPath(); for (let i = 1; i <= 3; i++) for (const s of [-1, 1]) { c.moveTo(cx + s * i * R * .14, cy - 3 * Sx); c.lineTo(cx + s * i * R * .14, cy + 3 * Sx); c.moveTo(cx - 3 * Sx, cy + s * i * R * .14); c.lineTo(cx + 3 * Sx, cy + s * i * R * .14); } c.stroke();
  draw.circle(c, cx, cy, (dead ? 3.2 : 2.2) * Sx, dead ? "#ffe08a" : "#ff7a4a"); if (on) draw.circle(c, cx, cy, gap * (dead ? .8 : 1), null, col, 1.6);
