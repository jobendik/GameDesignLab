<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Screw Puzzle", instructions:"Tap screws to collect 3 of same color. Group to remove.", restart:start});
let plates, slots, sel, COLORS=["#e74","#69d","#7c6","#fc4","#a6e","#fc6"];
function start(){
  // plates with 4 screws each
  plates=[]; const total=12; const pool=[];
  for(let i=0;i<4;i++) for(let j=0;j<9;j++) pool.push(i);
  for(let i=pool.length-1;i>0;i--){ const j=Lab.randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]];}
  for(let p=0;p<9;p++){ const s=[]; for(let k=0;k<4;k++) s.push(pool.shift()); plates.push({screws:s});}
  slots=[null,null,null]; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const cs=cellSize();
    const cols=3, rows=3; const gap=10; const totalW=cols*cs+(cols-1)*gap; const startX=(Lab.W-totalW)/2;
    // check plates
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const idx=r*cols+c; if(!plates[idx]) continue;
      const px=startX+c*(cs+gap), py=140+r*(cs+gap);
      // each screw
      const sc=cs/2;
      for(let s=0;s<plates[idx].screws.length;s++){
        const sx=px+(s%2)*sc+sc/2, sy=py+Math.floor(s/2)*sc+sc/2;
        if(Lab.dist(x,y,sx,sy)<sc*0.45){
          // pop screw to first empty slot
          const col=plates[idx].screws[s];
          const slot=slots.indexOf(null);
          // or find slot with same color and room
          let target=-1; for(let i=0;i<slots.length;i++) if(slots[i]&&slots[i].color===col&&slots[i].count<3){target=i;break;}
          if(target===-1) target=slot;
          if(target===-1) return;
          plates[idx].screws.splice(s,1);
          if(slots[target]) slots[target].count++; else slots[target]={color:col,count:1};
          if(slots[target].count>=3){ slots[target]=null; Lab.beep(800,.08);}
          if(plates.every(p=>p.screws.length===0) && slots.every(s=>!s)) Lab.win("Cleared!");
          return;
        }
      }
    }
  }];
  Lab.loop(()=>draw());
}
function cellSize(){ return Math.min((Lab.W-60)/3, (Lab.H-380)/3);}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), cols=3, rows=3, gap=10; const totalW=cols*cs+(cols-1)*gap; const startX=(Lab.W-totalW)/2;
  for(let r=0;r<rows;r++) for(let col=0;col<cols;col++){
    const idx=r*cols+col; const px=startX+col*(cs+gap), py=140+r*(cs+gap);
    c.fillStyle="#4a4458"; c.fillRect(px,py,cs,cs);
    const sc=cs/2;
    for(let s=0;s<(plates[idx]?.screws||[]).length;s++){
      const sx=px+(s%2)*sc+sc/2, sy=py+Math.floor(s/2)*sc+sc/2;
      c.beginPath(); c.fillStyle=COLORS[plates[idx].screws[s]]; c.arc(sx,sy,sc*0.35,0,Lab.TAU); c.fill();
      c.beginPath(); c.strokeStyle="#000"; c.moveTo(sx-5,sy); c.lineTo(sx+5,sy); c.moveTo(sx,sy-5); c.lineTo(sx,sy+5); c.stroke();
    }
  }
  // slots
  for(let i=0;i<3;i++){
    const sx=Lab.W/2-90+i*60, sy=Lab.H-100;
    c.fillStyle="#33365a"; c.fillRect(sx,sy,50,60);
    if(slots[i]){ for(let k=0;k<slots[i].count;k++){ c.beginPath(); c.fillStyle=COLORS[slots[i].color]; c.arc(sx+25, sy+50-k*18, 9, 0, Lab.TAU); c.fill();}}
  }
}
start();
</script></body></html>
