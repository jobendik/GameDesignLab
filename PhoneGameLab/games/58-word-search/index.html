<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Word Search", instructions:"Drag across letters to find hidden words.", restart:start});
const WORDS=["CAT","DOG","SUN","MOON","STAR","TREE","FISH","BIRD"];
let grid, found, sel, N=10;
function start(){
  grid=Array.from({length:N},()=>Array.from({length:N},()=>String.fromCharCode(65+Lab.randInt(0,25))));
  found=new Set();
  // place each word
  const placed=[];
  for(const w of WORDS){
    for(let tries=0;tries<50;tries++){
      const dir=Lab.choose([[0,1],[1,0],[1,1]]);
      const r=Lab.randInt(0, N-1 - dir[0]*(w.length-1));
      const c=Lab.randInt(0, N-1 - dir[1]*(w.length-1));
      let ok=true; for(let i=0;i<w.length;i++){ const cr=r+dir[0]*i, cc=c+dir[1]*i; const cur=grid[cr][cc]; if(placed.find(p=>p.cells.find(cl=>cl[0]===cr&&cl[1]===cc&&cl[2]!==w[i]))){ok=false;break;}}
      if(ok){ const cells=[]; for(let i=0;i<w.length;i++){ const cr=r+dir[0]*i, cc=c+dir[1]*i; grid[cr][cc]=w[i]; cells.push([cr,cc,w[i]]);} placed.push({word:w, cells}); break;}
    }
  }
  sel=[];
  Lab.input.onDown=[(x,y)=>{ const p=pick(x,y); if(p) sel=[p];}];
  Lab.input.onMove=[(x,y)=>{ if(!sel.length) return; const p=pick(x,y); if(!p) return; if(sel[sel.length-1].r===p.r&&sel[sel.length-1].c===p.c) return; sel.push(p);}];
  Lab.input.onUp=[()=>{ if(!sel.length) return; const word=sel.map(s=>grid[s.r][s.c]).join("");
    if(WORDS.includes(word) && !found.has(word)){ found.add(word); Lab.beep(800,.08); Lab.toast(word); Lab.setScore(found.size);
      sel.forEach(s=>s.found=true);
      if(found.size===WORDS.length) Lab.win("All found!");
    }
    sel=[];
  }];
  Lab.setScore(0);
  Lab.loop(()=>draw());
}
function pick(x,y){ const cs=cellSize(), off=offset(cs); const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs); if(c<0||c>=N||r<0||r>=N) return null; return {r,c};}
function cellSize(){ return Math.min((Lab.W-20)/N, (Lab.H-340)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:140};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    const inSel=sel.find(s=>s.r===r&&s.c===col);
    c.fillStyle = inSel ? "#ffd35a" : "#22253a"; c.fillRect(x+1,y+1,cs-2,cs-2);
    c.fillStyle="#fff"; c.font=`${cs*0.5}px sans-serif`; c.textAlign="center"; c.textBaseline="middle";
    c.fillText(grid[r][col], x+cs/2, y+cs/2);
  }
  c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText(WORDS.map(w=>found.has(w)?"✓"+w:w).join("  "), Lab.W/2, Lab.H-60);
}
start();
</script></body></html>
