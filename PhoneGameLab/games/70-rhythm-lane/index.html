<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Rhythm Lane", instructions:"Tap the correct lane when the note crosses the line. 4 lanes.", restart:start});
const LANES=4;
let notes, score, miss, t, beat, sp;
function start(){
  notes=[]; score=0; miss=0; t=0; beat=0; sp=200; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ if(y<Lab.H*0.5) return;
    const lane=Math.floor(x/(Lab.W/LANES));
    const lineY=Lab.H-100;
    let best=null, bd=60;
    for(const n of notes){ if(n.hit||n.lane!==lane) continue; const d=Math.abs(n.y-lineY); if(d<bd){ bd=d; best=n;}}
    if(best){ best.hit=true; score+=Math.round(60-bd); Lab.setScore(score); Lab.beep(400+lane*80,.04);}
    else { miss++; if(miss>=8){ Lab.gameover({title:"Off-beat",message:"Score: "+score}); return;}}
  }];
  Lab.loop(dt=>{ t+=dt; beat-=dt;
    if(beat<=0){ beat=0.5; notes.push({lane:Lab.randInt(0,LANES-1), y:0, hit:false});}
    for(const n of notes){ n.y+=sp*dt;}
    for(const n of notes){ if(!n.hit && n.y>Lab.H){ miss++; n.hit=true; if(miss>=8){ Lab.gameover({title:"Too many misses",message:"Score: "+score}); return;}}}
    notes=notes.filter(n=>n.y<Lab.H+20);
    sp+=4*dt;
    draw();
  });
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#0e0e22"; c.fillRect(0,0,Lab.W,Lab.H);
  const lw=Lab.W/LANES;
  for(let i=0;i<LANES;i++){ c.fillStyle=i%2?"#15182a":"#1a1d33"; c.fillRect(i*lw, 0, lw, Lab.H);}
  c.fillStyle="#ff5577"; c.fillRect(0, Lab.H-100, Lab.W, 3);
  const COLORS=["#e74","#69d","#7c6","#fc4"];
  for(const n of notes){ if(n.hit) continue; c.fillStyle=COLORS[n.lane]; c.fillRect(n.lane*lw+6, n.y-12, lw-12, 24);}
  c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText("Misses: "+miss+"/8", Lab.W/2, 100);
}
start();
</script></body></html>
