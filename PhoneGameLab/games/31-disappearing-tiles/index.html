<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Vanishing Tiles", instructions:"Tap a tile to step there. Avoid empty squares and fading ones!", restart:start});
let grid,cols,rows,cell,ox,oy,p,score,timer,t;
function start(){
  cols=4; rows=6; cell=Math.min((Lab.W-40)/cols,(Lab.H-200)/rows);
  ox=(Lab.W-cell*cols)/2; oy=110;
  grid=Array.from({length:cols*rows},()=>({life:Lab.rand(1.2,3), max:3, alive:Math.random()<0.85}));
  p={x:1,y:rows-1}; score=0; t=0; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const cx=Math.floor((x-ox)/cell), cy=Math.floor((y-oy)/cell);
    if(cx<0||cy<0||cx>=cols||cy>=rows) return;
    if(Math.abs(cx-p.x)+Math.abs(cy-p.y)!==1) return;
    const g=grid[cy*cols+cx];
    if(!g.alive){ Lab.gameover({title:"Fell!",message:"Steps: "+score}); return; }
    p.x=cx; p.y=cy; score++; Lab.setScore(score); Lab.beep(800,.04);
  }];
  Lab.loop(dt=>{
    t+=dt;
    for(const g of grid){ if(g.alive){ g.life-=dt; if(g.life<=0){ g.alive=false; g.respawn=Lab.rand(1.0,2.5);}}
      else { g.respawn-=dt; if(g.respawn<=0){ g.alive=true; g.life=Lab.rand(1.5,3); g.max=g.life;}}
    }
    if(!grid[p.y*cols+p.x].alive){ Lab.gameover({title:"Tile gone!",message:"Steps: "+score}); return; }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    for(let yy=0;yy<rows;yy++)for(let xx=0;xx<cols;xx++){
      const g=grid[yy*cols+xx];
      const x=ox+xx*cell, y=oy+yy*cell;
      if(g.alive){
        const a=Math.min(1,g.life/g.max*1.5);
        c.fillStyle=`hsla(200,60%,55%,${a})`;
        c.fillRect(x+4,y+4,cell-8,cell-8);
      } else {
        c.strokeStyle="#222"; c.strokeRect(x+4,y+4,cell-8,cell-8);
      }
    }
    c.fillStyle="#ffd35a"; c.fillRect(ox+p.x*cell+cell*0.25, oy+p.y*cell+cell*0.2, cell*0.5, cell*0.6);
  });
}
start();
</script></body></html>
