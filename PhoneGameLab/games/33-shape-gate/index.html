<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Shape Gate", instructions:"Tap to morph: ○ → □ → △ → ○. Match the gate!", restart:start});
let shapes=['circle','square','triangle'];
let me=0, gates, t, sp;
function start(){
  me=0; gates=[]; let x=Lab.W+200;
  for(let i=0;i<20;i++){ gates.push({x, kind:Lab.choose(shapes), scored:false}); x+=Lab.rand(140,220);}
  t=0; sp=240; Lab.setScore(0);
  Lab.input.onTap=[()=>{ me=(me+1)%shapes.length; Lab.beep(700,.04);}];
  Lab.loop(dt=>{
    t+=dt; sp=240+t*10;
    for(const g of gates) g.x-=sp*dt;
    const px=Lab.W*0.2;
    for(const g of gates){
      if(!g.scored && g.x<px-10){
        g.scored=true;
        if(shapes[me]!==g.kind){ Lab.gameover({title:"Doesn't fit!",message:"Score: "+Math.floor(t*5)}); return; }
        else { Lab.beep(900,.05); Lab.setScore(Math.floor(t*10));}
      }
    }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const g of gates){
      c.fillStyle="#162043"; c.fillRect(g.x-40,Lab.H-220,80,180);
      drawShape(c,g.x,Lab.H-130,40,g.kind,"#5af");
    }
    drawShape(c,Lab.W*0.2,Lab.H-130,38,shapes[me],"#ffd35a");
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Tap to morph", Lab.W/2, 70);
  });
}
function drawShape(c,x,y,r,kind,col){
  c.fillStyle=col;
  if(kind==='circle'){ c.beginPath(); c.arc(x,y,r,0,Lab.TAU); c.fill();}
  else if(kind==='square'){ c.fillRect(x-r,y-r,r*2,r*2);}
  else { c.beginPath(); c.moveTo(x,y-r); c.lineTo(x+r,y+r*0.8); c.lineTo(x-r,y+r*0.8); c.closePath(); c.fill();}
}
start();
</script></body></html>
