(function(){ "use strict";

const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, INK = "#16324f";
const ET = {

  skit:   { r: 10, hp: 1,  sp: 165, col: "#8f88ad", pts: 15, gems: 1 },
  spit:   { r: 16, hp: 3,  sp: 50,  col: "#5d9c4a", pts: 25, gems: 2 },
  charge: { r: 18, hp: 5,  sp: 44,  col: "#7350a0", pts: 35, gems: 3 },
  gunk:   { r: 27, hp: 9,  sp: 38,  col: "#56633a", pts: 40, gems: 3 },

  { k: "twin",   n: "Double Bubble",  d: "One more bubble stream",          max: 2, c: "#5b8def" },
  { k: "big",    n: "Big Bubbles",    d: "Bigger bubbles, +40% damage",     max: 3, c: "#2bb5a0" },
  { k: "pierce", n: "Slippery",       d: "Bubbles slip through +1 grime",   max: 3, c: "#8a6fe8" },
  { k: "bounce", n: "Ricochet",       d: "Bubbles bounce off the walls",    max: 2, c: "#e5884a" },
  { k: "zip",    n: "Slick Soles",    d: "Glide 12% faster",                max: 3, c: "#e0a92a" },
  { k: "magnet", n: "Sparkle Magnet", d: "Scoop sparkles from further away", max: 3, c: "#e36fa5" },

let S, A, stripH, touchUI, P, enemies, shots, eshots, gems, decals, pends, queue, queueT, wave, phase, phaseT, score, combo, comboT,

const mouse = { x: 0, y: 0, down: false, seen: false }, ptype = {};

/* pointer types are not exposed by the engine: listen (capture, so before the engine) to tell mouse from fingers */
(function () {

})();

function layout() {

}
Lab.onResize(() => {
  if (!P) return; layout();

function start() {

  enemies = []; shots = []; eshots = []; gems = []; decals = []; pends = []; queue = []; queueT = 0; cards = null; cardDown = -1;
  wave = 0; score = 0; combo = 0; comboT = 0; bestCombo = 0; kills = 0; alive = true; boss = null; usedMove = usedAim = false; foamT = 0; beatT = 0; dying = 0;
  up = {}; for (const u of UPS) up[u.k] = 0;

    get player() { return P; }, get enemies() { return enemies; }, get shots() { return shots; }, get goo() { return eshots; }, get gems() { return gems; }, get score() { return score; },
    get wave() { return wave; }, get phase() { return phase; }, get up() { return up; }, get cards() { return cards; }, get arena() { return A; }, get combo() { return combo; },
    get sticks() { return sticks; }, cardRects, spawn(type, x, y) { const e = mkEnemy(type, x, y); enemies.push(e); return e; },

}

/* ------------------------------------------------------------------ waves */
function nextWave() {

  Lab.sfx(wave % 5 === 0 ? "warn" : "whistle", { pitch: wave % 5 === 0 ? .6 : 1 });
}
function buildWave(n) {

/* ------------------------------------------------------------------ combat */

function kill(e, ang) {

/* ------------------------------------------------------------------ upgrades */
function openDraft() {

  cards = Lab.shuffle(avail.slice()).slice(0, 3); phase = "draft"; phaseT = 0; cardDown = -1; Lab.sfx("unlock");
}
function cardRects() {

/* ------------------------------------------------------------------ frame */
function readSticks() {

  for (const k of ["L", "R"]) { const s = sticks[k]; if (s.id != null && !ps.some(p => p.id === s.id)) s.id = null; }
  for (const p of ps) {
    if (ptype[p.id] === "mouse" || p.id === sticks.L.id || p.id === sticks.R.id || p.used) continue;

function stickVec(s, dead) { if (s.id == null) return null; const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy); if (d < dead) return null; const m = Math.min(1, (d - dead) / (40 - dead)); return [dx / d * m, dy / d * m]; }

}
function update(dt, t) {

    if (lv) { mx = lv[0]; my = lv[1]; } const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; } if (ml > .2) usedMove = true;

    P.inv -= dt; P.fire -= dt; P.kick = Lab.damp(P.kick, 0, 14, dt); P.blink -= dt; if (P.blink < -.12) P.blink = Lab.rand(1.5, 4);
    foamT -= dt; if (foamT <= 0 && Math.hypot(P.vx, P.vy) > 90 * S) { foamT = .07; fx.burst(P.x - P.vx * .04, P.y - P.vy * .04 + P.r * .5, { n: 1, color: "rgba(255,255,255,.95)", speed: 20, life: .55, size: 4.5 * S, gravity: 0, drag: 2, shape: "ring" }); }
