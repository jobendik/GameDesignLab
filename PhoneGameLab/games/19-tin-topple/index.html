  const lw = 96 * u; draw.rect(c, Wd - 10 - lw, y, lw, hh, hh / 2, "rgba(255,250,240,.85)", "rgba(90,60,40,.2)", 1);
  draw.text(c, "FORT " + (level + 1) + " / " + LEVELS.length, Wd - 10 - lw / 2, y + hh / 2 + .5, { size: 12 * u, color: "#3d2c1e", weight: 700 });

  if (msg) { msg.t += dt; const k = msg.t < .2 ? ease.outBack(msg.t / .2) : 1, my = P.y + (oy - P.y) * .3; draw.text(c, msg.title, Wd / 2, my, { size: Math.min(34 * u, Wd * .085) * k, color: msg.col, stroke: "rgba(90,45,25,.85)", strokeW: 6 }); if (msg.sub) draw.text(c, msg.sub, Wd / 2, my + 30 * u, { size: 14 * u, color: "#3d2c1e", weight: 700 }); }

    c.globalAlpha = q > .8 ? (1 - q) * 5 : 1; c.strokeStyle = "rgba(255,255,255,.75)"; c.lineWidth = 2; c.setLineDash([4, 6]); c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.setLineDash([]);
    draw.circle(c, x1, y1, 11 * u, "rgba(255,255,255,.9)", "rgba(61,44,30,.4)", 2); draw.text(c, "drag back, let go", x0 - 26 * u, y0 - 20 * u, { size: 13 * u, color: "#fff", stroke: "rgba(90,45,25,.7)" }); c.globalAlpha = 1;
  }
}
