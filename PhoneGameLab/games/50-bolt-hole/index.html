function render(t) {

    g.strokeStyle = "rgba(120,105,70,.06)"; g.lineWidth = 10; for (let x = -H; x < W + 80; x += 34) { g.beginPath(); g.moveTo(x, H + 80); g.lineTo(x + H + 80, 0); g.stroke(); }

    draw.rect(g, x + 3, y + 9, w, h, 30, "rgba(90,70,30,.16)"); draw.rect(g, x, y, w, h, 30, "#fbf8ef", "#cfc5ab", 2.5);

    for (const [u, v] of [[0, 0], [1, 0], [0, 1], [1, 1]]) { const rx = x + 15 + u * (w - 30), ry = y + 15 + v * (h - 30); draw.circle(g, rx, ry, 5, "#c9c0a8", "#a99f86", 1.2); }
  });
