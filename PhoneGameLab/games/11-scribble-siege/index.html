<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scribble Siege</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* SCRIBBLE SIEGE — a fixed shooter drawn in the margin of a maths notebook.
 * Identity: ruled paper, wobbly "boiling" ink outlines with highlighter fills, a pencil-rocket, sticky-note bunkers,
 * marching-band music whose drum is the formation's own footsteps.
 * Cast: Blots (march), Spikes (wind up and spit aimed ink), Crates (two hits), Flaps (peel off and dive-bomb), and every
 * fourth wave The Big Smudge, a boss with telegraphed fans, aimed bursts and dive-bombing escorts.
 * Controls: drag anywhere to slide the rocket (relative, so the thumb never covers it); it fires by itself.
 * Hook: erased doodles shed pencil-shaving stars. Catching them builds the score multiplier (x1..x5, dropping one costs
 * a step) and charges the ERASER — one tap rubs out every bullet on the page and takes a hit off every doodle.      */
Lab.init({
  title: "Scribble Siege", tagline: "The doodles in the margin are marching. Rub them out.", category: "Arcade & Action",
  howto: ["Drag to slide the pencil-rocket: it fires by itself", "Catch falling stars to build the multiplier", "Tap ERASE when it is full to wipe the page"],
  theme: { bg: "#efe7d2", bg2: "#fbf6e8", fg: "#2b2f5e", muted: "#6c7096", accent: "#ef476f", accent2: "#3a86ff", light: true },
  orient: "portrait", music: { style: "march", key: "G", vol: .4 }, restart: start,
});
const { draw, fx } = Lab, TAU = Lab.TAU, INK = "#2b2f5e", PAPER = "#fbf6e8", RED = "#d62839";
const KIND = {
  blot: { hp: 1, pts: 10, c: "#9ad1ff" }, spike: { hp: 1, pts: 20, c: "#ff9eb5" }, crate: { hp: 2, pts: 30, c: "#b9e58a" }, flap: { hp: 1, pts: 30, c: "#c9a7ff" },
};
let S, L, R, py, gx, gy, ship, shots, ebul, foes, stars, drops, notes, boss, wave, lives, score, chain, kills, bestMult, eraser, sweep, form,
  fireT, efireT, diveT, mode, modeT, stepT, stepN, alive, total, hintT, btn;

function layout() {
  S = Math.min(Lab.W / 390, Lab.play.h / 700);
  L = 12 * S; R = Lab.W - 12 * S; py = Lab.H - Lab.safe.bottom - 100 * S; gx = 52 * S; gy = 42 * S;
  btn = { x: Lab.W - 40 * S, y: Lab.H - Lab.safe.bottom - 40 * S, r: 27 * S };
}
Lab.onResize(() => {
  if (!foes) return; const oW = R - L, oL = L, oP = py, oT = Lab.play.y; layout(); const kx = v => L + (v - oL) / oW * (R - L), ky = v => Lab.play.y + (v - oT) / (oP - oT) * (py - Lab.play.y);
  ship.x = ship.tx = kx(ship.x); form.x = kx(form.x); form.y = ky(form.y); form.ty = ky(form.ty);
  for (const a of [shots, ebul, stars, drops, foes]) for (const o of a) { o.x = kx(o.x); o.y = ky(o.y); }
  if (boss) { boss.x = kx(boss.x); boss.y = ky(boss.y); boss.ty = Lab.play.y + 118 * S; boss.r = 44 * S; } placeNotes();
});
// engine workaround: Lab.buzz before the first tap makes Chrome log a console error (possible here because the rocket auto-fires)
const buzz = ms => { const ua = navigator.userActivation; if (!ua || ua.hasBeenActive) Lab.buzz(ms); };
const mult = () => Math.min(5, 1 + Math.floor(chain / 3));
const page = () => Math.ceil(wave / 4);

function start() {
  layout();
  ship = { x: Lab.W / 2, tx: Lab.W / 2, vx: 0, inv: 1.2, shield: false, twinT: 0, recoil: 0 };
  shots = []; ebul = []; foes = []; stars = []; drops = []; boss = null; sweep = null;
  wave = 0; lives = 3; score = 0; chain = 0; kills = 0; bestMult = 1; eraser = 0; fireT = .3; efireT = 2; diveT = 4; stepT = 0; stepN = 0; alive = true; total = 1; hintT = 0;
  form = { x: Lab.W / 2, y: 0, ty: 0, dir: 1, cols: 6 };
  notes = [0, 1, 2].map(i => ({ i, hp: 5, x: 0, y: 0, w: 0, h: 0, wob: 0 })); placeNotes();
  Lab.setScore(0);
  Lab.input.onDown = [(x, y) => { if (Lab.dist(x, y, btn.x, btn.y) < Math.max(30, btn.r * 1.35) || Lab.input.pointers.length >= 2) erase(); }];
  Lab.input.onMove = [(x, y, dx) => { if (Lab.input.pointers.length) ship.tx += dx * 1.25; else ship.tx = x; }];
  Lab.input.onKey = [k => { if (k === " " || k === "e" || k === "E" || k === "Enter" || k === "ArrowUp") erase(); }];
  Lab.expose({
    get score() { return score; }, get lives() { return lives; }, get wave() { return wave; }, get mode() { return mode; }, get mult() { return mult(); }, get chain() { return chain; },
    get eraser() { return eraser; }, get kills() { return kills; }, get ship() { return { x: ship.x, y: py, inv: ship.inv, shield: ship.shield, twin: ship.twinT > 0 }; },
    get foes() { return foes.map(e => ({ x: e.x, y: e.y, kind: e.kind, hp: e.hp, state: e.state })); }, get boss() { return boss ? { x: boss.x, y: boss.y, hp: boss.hp, max: boss.max } : null; },
    get ebul() { return ebul.map(b => ({ x: b.x, y: b.y })); }, get stars() { return stars.map(s => ({ x: s.x, y: s.y })); }, get shots() { return shots.length; }, get notes() { return notes.map(n => n.hp); },
    erase,
    /* test helpers */
    setLives(n) { lives = n; }, fillEraser() { eraser = 1; }, skipTo(w) { foes = []; ebul = []; boss = null; startWave(w); }, calm() { ship.inv = 1e9; },
  });
  startWave(1);
  Lab.loop(frame);
}
function placeNotes() { if (!notes) return; for (const n of notes) { n.w = 54 * S; n.h = 30 * S; n.x = L + (R - L) * (.18 + n.i * .32) - n.w / 2; n.y = py - 92 * S; } }

/* ---------------------------------------------------------------- waves */
function startWave(w) {
  wave = w; mode = "intro"; modeT = 0; foes = []; form.x = Lab.W / 2; form.dir = Lab.chance(.5) ? 1 : -1; form.y = form.ty = Lab.play.y + 78 * S;
  const p = page(), isBoss = w % 4 === 0;
  if (w > 1 && w % 4 === 1) for (const n of notes) { n.hp = 5; n.wob = 1; }
  if (isBoss) {
    boss = { x: Lab.W / 2, y: -80 * S, ty: Lab.play.y + 118 * S, hp: 34 + 16 * p, max: 34 + 16 * p, t: 0, atk: 2.2, wind: 0, flash: 0, n: 0, half: false, r: 44 * S };
    Lab.banner("THE BIG SMUDGE", { color: RED, ms: 1500 }); Lab.sfx("warn", { pitch: .7 }); Lab.sfx("boom", { pitch: 1.3 }); total = 1; return;
  }
  const k = (w - 1) % 4, rowsDef = [["blot", "blot", "blot"], ["spike", "blot", "blot", "blot"], ["spike", "crate", "blot", "blot"]][k].slice();
  if (p >= 2) rowsDef.splice(1, 0, k === 0 ? "spike" : "crate"); if (p >= 3 && k > 0) rowsDef[rowsDef.length - 1] = "crate";
  form.cols = 6;
  rowsDef.forEach((kind, r) => { for (let c = 0; c < 6; c++) {
    let kd = kind; if ((k === 2 || p >= 2 && k === 1) && r === 0 && (c === 0 || c === 5)) kd = "flap"; if (p >= 2 && k === 2 && r === 1 && (c === 2 || c === 3)) kd = "flap";
    foes.push({ kind: kd, hp: KIND[kd].hp, row: r, col: c, x: 0, y: -40 * S, state: "in", k: -(c * .04 + r * .09) / .6, ph: Lab.rand(0, TAU), flash: 0, wind: 0, t: 0, vx: 0, rot: 0, shot: false, aimed: false });
  } });
  total = foes.length; efireT = 1.6; diveT = 3.5;
  Lab.banner("WAVE " + w, { color: INK, ms: 1000 }); Lab.sfx("whistle", { pitch: .9 });
}
const slotX = e => form.x + (e.col - (form.cols - 1) / 2) * gx * (page() >= 2 ? 1 + .07 * Math.sin(Lab.now() * 1.3) : 1);
const slotY = e => form.y + e.row * gy;

/* ---------------------------------------------------------------- actions */
function erase() {
  if (!alive || eraser < 1 || sweep || Lab.paused) return false;
  eraser = 0; sweep = { t: 0, done: false }; ship.inv = Math.max(ship.inv, .9);
  Lab.sfx("whoosh", { pitch: .8 }); Lab.sfx("swish"); buzz(25); return true;
}
function wipe() {
  Lab.flash("#fff", .25, .55); Lab.shake(8, .3); Lab.sfx("slide", { pitch: .6 }); Lab.sfx("crunch", { pitch: 1.4 });
  for (const b of ebul) fx.burst(b.x, b.y, { n: 3, colors: ["#f7a8b8", "#ddd"], speed: 80 * S, size: 3 * S, life: .4, shape: "square" });
  ebul = [];
  for (const e of foes.slice()) hurt(e, 1, true);
  if (boss) hurtBoss(10);
}
function addScore(n, x, y, big) {
  const g = n * mult(); score += g; Lab.setScore(score); if (big) Lab.bumpScore();
  fx.text(x, y, "+" + g, { color: INK, size: (big ? 20 : 13) * Math.max(.85, S), life: .6, outline: "rgba(251,246,232,.9)", weight: 700 });
}
function hurt(e, dmg, wiped) {
  e.hp -= dmg; e.flash = 1;
  if (e.hp > 0) { Lab.sfx("knock", { pitch: 1.4 }); fx.burst(e.x, e.y, { n: 4, color: INK, speed: 120 * S, size: 2.4 * S, life: .3, shape: "spark" }); return; }
  const K = KIND[e.kind]; foes.splice(foes.indexOf(e), 1); kills++;
  addScore(K.pts * (e.state === "dive" ? 2 : 1), e.x, e.y - 14 * S);
  fx.burst(e.x, e.y, { n: 10, colors: [K.c, INK, "#f7a8b8"], speed: 190 * S, size: 3.2 * S, life: .5, shape: "square", gravity: 500 * S });
  fx.ring(e.x, e.y, { r0: 6 * S, r1: 26 * S, color: INK, width: 2.5 * S, life: .25 });
  Lab.sfx("pop", { pitch: { blot: 1, spike: 1.2, crate: .75, flap: 1.4 }[e.kind] }); buzz(6);
  if (drops.length < 1 && !wiped && kills > 5 && Lab.chance(.1)) drops.push({ x: e.x, y: e.y, type: lives < 3 && Lab.chance(.3) ? "heart" : Lab.chance(.5) ? "twin" : "shield", t: 0 });
  else if (stars.length < 26 && Lab.chance(wiped ? .5 : .72)) stars.push({ x: e.x, y: e.y, vy: -90 * S, vx: Lab.rand(-30, 30) * S, t: Lab.rand(0, 6) });
  if (!foes.length && !boss && mode === "fight") waveClear();
}
function hurtBoss(dmg) {
  if (!boss || boss.dead) return; boss.hp -= dmg; boss.flash = 1; Lab.sfx("knock", { pitch: .7 + .5 * (1 - boss.hp / boss.max) });
  if (boss.hp > 0) return;
  boss.dead = true; const bx = boss.x, by = boss.y, p = page();
  Lab.slowmo(.3, .7); Lab.hitstop(.1); Lab.shake(18, .7); Lab.flash("#fff", .4, .7); Lab.sfx("boom"); Lab.sfx("glass"); buzz(80);
  fx.burst(bx, by, { n: 60, colors: ["#ffb86b", INK, "#f7a8b8", "#fff"], speed: 420 * S, size: 5 * S, life: 1, shape: "square", gravity: 300 * S });
  for (let i = 0; i < 3; i++) fx.ring(bx, by, { r0: 10 * S, r1: (70 + i * 40) * S, color: INK, width: 4 * S, life: .4 + i * .15 });
  for (let i = 0; i < 9; i++) stars.push({ x: bx + Lab.rand(-40, 40) * S, y: by + Lab.rand(-20, 20) * S, vy: Lab.rand(-240, -80) * S, vx: Lab.rand(-90, 90) * S, t: i });
  addScore(400 * p, bx, by, true); kills++; boss = null; ebul = [];
  for (const e of foes.slice()) hurt(e, 9, true);
  if (mode === "fight") waveClear();
}
function waveClear() {
  mode = "clear"; modeT = 0; const bonus = 40 * wave; score += bonus; Lab.setScore(score); Lab.bumpScore(); Lab.sfx("levelup");
  fx.text(Lab.W / 2, py - 150 * S, (wave % 4 === 0 ? "page " + page() + " rubbed out!  +" : "wave clear  +") + bonus, { color: "#3a86ff", size: 18 * Math.max(.85, S), life: 1.2, outline: "rgba(251,246,232,.95)" });
  const w = wave; Lab.after(1.15, () => { if (alive) startWave(w + 1); });
}
function hitShip(x, y) {
  if (ship.inv > 0 || !alive) return;
  if (ship.shield) { ship.shield = false; ship.inv = .8; Lab.sfx("glass", { pitch: .8 }); fx.ring(ship.x, py, { r0: 20 * S, r1: 60 * S, color: "#3a86ff", width: 4 * S }); Lab.shake(5, .2); return; }
  lives--; chain = 0; ship.twinT = 0; ship.inv = 2; Lab.shake(12, .4); Lab.hitstop(.09); Lab.flash(RED, .25, .3); Lab.sfx("hurt"); Lab.sfx("explode", { pitch: 1.3 }); buzz(60);
  fx.burst(ship.x, py, { n: 26, colors: [RED, INK, "#ffd166"], speed: 300 * S, size: 4 * S, life: .8, shape: "shard" });
  for (const b of ebul) fx.puff(b.x, b.y, { n: 2, color: "rgba(214,40,57,.5)" }); ebul = [];
  if (lives <= 0) end("Inked out");
}
function end(title) {
  alive = false; Lab.gameover({ title, score, stats: [["Wave", wave], ["Best multiplier", "×" + bestMult], ["Doodles erased", kills]] });
}
function shoot(x, y, vx, vy, aimed) { if (ebul.length < 70) ebul.push({ x, y, vx, vy, t: Lab.rand(0, 6), aimed }); }
function aimAt(x, y, sp, spread) { const a = Math.atan2(py - y, ship.x - x) + (spread || 0); shoot(x, y, Math.cos(a) * sp, Math.sin(a) * sp, true); }
const bulletSpeed = () => Math.min(310, 172 + 9 * wave) * S;

/* ---------------------------------------------------------------- frame */
function frame(dt, t) {
  modeT += dt; hintT += dt; if (mode === "intro" && modeT > 1.05) mode = "fight";
  // rocket
  const k = Lab.input.axisX(); if (k) ship.tx += k * 360 * S * dt;
  ship.tx = Lab.clamp(ship.tx, L + 14 * S, R - 14 * S); const ox = ship.x; ship.x = Lab.damp(ship.x, ship.tx, 30, dt);
  if (dt > 1e-4) ship.vx = Lab.damp(ship.vx, (ship.x - ox) / dt, 14, dt);
  ship.inv = Math.max(0, ship.inv - dt); ship.recoil = Lab.damp(ship.recoil, 0, 18, dt); if (ship.twinT > 0) ship.twinT -= dt;
  fireT -= dt;
  if (fireT <= 0 && alive) {
    fireT += .29; ship.recoil = 1;
    if (ship.twinT > 0) { shots.push({ x: ship.x - 9 * S, y: py - 20 * S }, { x: ship.x + 9 * S, y: py - 20 * S }); } else shots.push({ x: ship.x, y: py - 24 * S });
    Lab.audio.tone({ f: 980, f2: 520, dur: .045, type: "triangle", vol: .05 });
  }
  // formation march
  if (foes.length) {
    let mn = 1e9, mx = -1e9, low = -1e9, slotted = 0; for (const e of foes) { const x = slotX(e); if (x < mn) mn = x; if (x > mx) mx = x; if (e.state !== "dive") { low = Math.max(low, slotY(e)); slotted++; } }
    const v = (20 + 4.5 * Math.min(wave, 14)) * S * (1 + 2.1 * Math.pow(1 - foes.length / total, 1.4));
    if (mode !== "intro") { form.x += form.dir * v * dt; if (form.dir > 0 && mx + 17 * S > R) { form.dir = -1; form.ty += 15 * S; } else if (form.dir < 0 && mn - 17 * S < L) { form.dir = 1; form.ty += 15 * S; } }
    form.y = Lab.damp(form.y, form.ty, 6, dt);
    stepT -= dt * v / (20 * S); if (stepT <= 0 && mode === "fight") { stepT = .62; stepN++; Lab.audio.tone({ f: stepN % 2 ? 92 : 78, f2: 55, dur: .09, vol: .22 }); }
    if (low + 16 * S > notes[0].y - 6 * S) for (const n of notes) if (n.hp > 0) { n.hp = 0; fx.burst(n.x + n.w / 2, n.y + n.h / 2, { n: 12, color: "#ffe66d", speed: 160 * S, shape: "square", size: 4 * S }); Lab.sfx("crunch"); }
    if (low + 14 * S > py - 28 * S && alive) { Lab.shake(10, .4); Lab.sfx("explode"); end("Page overrun"); return; }
    // enemy fire: the lowest doodle of a random column winds up, then spits
    if (mode === "fight") {
      efireT -= dt;
      if (efireT <= 0) {
        efireT = Math.max(.4, 1.55 - wave * .075) * Lab.rand(.6, 1.4);
        const cols = {}; for (const e of foes) if (e.state === "slot" && (!cols[e.col] || cols[e.col].row < e.row)) cols[e.col] = e;
        let c = Object.values(cols); const sp = foes.filter(e => e.kind === "spike" && e.state === "slot" && e.wind <= 0);
        const sh = sp.length && Lab.chance(.45) ? Lab.choose(sp) : c.length ? Lab.choose(c) : null;
        if (sh && sh.wind <= 0) { sh.wind = .32; sh.aimed = sh.kind === "spike"; }
      }
      diveT -= dt;
      if (diveT <= 0) {
        diveT = Math.max(1.5, 3.6 - page() * .4) * Lab.rand(.7, 1.3);
        const c = foes.filter(e => e.state === "slot" && (e.kind === "flap" || page() >= 2 && e.kind === "blot" && Lab.chance(.25)));
        if (c.length && foes.filter(e => e.state === "dive").length < 2) { const e = Lab.choose(c); e.state = "dive"; e.t = 0; e.vx = 0; e.shot = false; Lab.sfx("whistle", { pitch: 1.5 }); }
      }
    }
  }
  for (const e of foes) {
    e.flash = Math.max(0, e.flash - dt * 6);
    if (e.wind > 0) { e.wind -= dt; if (e.wind <= 0 && e.state === "slot") { if (e.aimed) aimAt(e.x, e.y + 12 * S, bulletSpeed() * 1.08); else shoot(e.x, e.y + 12 * S, 0, bulletSpeed()); Lab.sfx(e.aimed ? "zap" : "drop", { pitch: e.aimed ? .7 : 1.3 }); } }
    if (e.state === "in" || e.state === "back") { e.k += dt / (e.state === "in" ? .6 : .7); const u = Lab.clamp(e.k, 0, 1); e.x = slotX(e); e.y = Lab.lerp(-40 * S, slotY(e), Lab.ease.outBack(u)); if (e.k >= 1) e.state = "slot"; }
    else if (e.state === "slot") { e.x = slotX(e) + Math.sin(t * 2 + e.ph) * 2 * S; e.y = slotY(e) + Math.cos(t * 2.4 + e.ph) * 2 * S; e.rot = Lab.damp(e.rot, 0, 8, dt); }
    else { // dive-bomb
      e.t += dt;
      if (e.t < .4) { e.y -= 60 * S * dt; e.rot += dt * 14; }
      else { e.y += Math.min(330, 232 + 10 * wave) * S * dt; e.vx = Lab.damp(e.vx, Lab.clamp((ship.x - e.x) * 2.2, -170 * S, 170 * S), 3, dt); e.x += (e.vx + Math.cos(e.t * 7) * 46 * S) * dt; e.rot = Lab.damp(e.rot, Lab.clamp(e.vx / (300 * S), -.5, .5), 8, dt);
        if (!e.shot && e.y > py - 300 * S) { e.shot = true; shoot(e.x, e.y + 10 * S, 0, bulletSpeed() * 1.15); } }
      if (e.y > Lab.H + 30 * S) { e.state = "back"; e.k = 0; e.rot = 0; }
    }
    if (alive && Lab.dist(e.x, e.y, ship.x, py) < 23 * S && ship.inv <= 0) { hitShip(); hurt(e, 9, true); break; }
  }
  // boss
  if (boss) {
    const b = boss, p = page(); b.t += dt; b.flash = Math.max(0, b.flash - dt * 5); b.y = Lab.damp(b.y, b.ty, 2.5, dt);
    b.x = Lab.W / 2 + Math.sin(b.t * (.55 + p * .08)) * (R - L - 2 * b.r - 10 * S) / 2;
    if (mode === "fight") {
      if (b.wind > 0) { b.wind -= dt; if (b.wind <= 0) bossAttack(b, p); }
      else { b.atk -= dt; if (b.atk <= 0) { b.wind = .55; b.atk = Math.max(1.25, 2.3 - p * .2) + (b.hp < b.max / 2 ? -.3 : 0); Lab.sfx("warn", { pitch: .8 }); } }
      if (!b.half && b.hp < b.max / 2) { b.half = true; Lab.shake(6, .3); fx.text(b.x, b.y + b.r + 16 * S, "GRRR!", { color: RED, size: 22 * S, outline: "rgba(251,246,232,.9)" }); Lab.sfx("error", { pitch: .7 }); }
    }
  }
  // rocket shots
  const vy = 640 * S;
  for (const s of shots) {
    s.y -= vy * dt; if (s.y < Lab.play.y - 20) { s.dead = true; continue; }
    if (boss && !boss.dead && Lab.dist(s.x, s.y, boss.x, boss.y) < boss.r) { s.dead = true; fx.sparks(s.x, s.y, Math.PI / 2, { n: 3, color: INK, speed: 140 * S }); hurtBoss(1); continue; }
    for (const e of foes) if (Math.abs(e.x - s.x) < 17 * S && Math.abs(e.y - s.y) < 17 * S) { s.dead = true; hurt(e, 1); break; }
  }
  if (shots.some(s => s.dead)) shots = shots.filter(s => !s.dead);
  // ink spit
  for (const b of ebul) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.t += dt;
    if (b.y > Lab.H + 12 || b.x < -12 || b.x > Lab.W + 12) { b.dead = true; continue; }
    for (const n of notes) if (n.hp > 0 && b.x > n.x && b.x < n.x + n.w && b.y > n.y && b.y < n.y + n.h) { b.dead = true; n.hp--; n.wob = 1; Lab.sfx("flip", { pitch: .8 }); fx.burst(b.x, n.y, { n: 5, colors: ["#ffe66d", RED], speed: 110 * S, size: 3 * S, life: .4, shape: "square" }); break; }
    if (!b.dead && alive && Lab.dist(b.x, b.y, ship.x, py - 2 * S) < 12.5 * S) { if (ship.inv <= 0) b.dead = true; hitShip(); if (!alive) return; }
  }
  if (ebul.some(b => b.dead)) ebul = ebul.filter(b => !b.dead);
  // stars + pick-ups
  for (const s of stars) {

  if (hintT < 5 && wave === 1 && alive) { c.globalAlpha = Math.min(1, (5 - hintT)) * (.6 + .3 * Math.sin(t * 4)); draw.text(c, "drag anywhere to slide", W / 2, py + 56 * S, { size: 14 * Math.max(.85, S), color: INK, weight: 600 }); c.globalAlpha = 1; }
}
Lab.boot();
})();
