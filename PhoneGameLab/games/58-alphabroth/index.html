/* ------------------------------------------------------------------ update */

}

/* ------------------------------------------------------------------ draw */
function bg() {

function letter(ch, size) {

}
function capsule(c, r0, c0, dr, dc, len, k, fill, stroke, lw) {

}
function button(c, b, label, on, col) {
  const p = pressT[b.id] || 0; c.save(); c.translate(b.x + b.w / 2, b.y + b.h / 2 + p * 2); c.globalAlpha = on ? 1 : .35;
  draw.rect(c, -b.w / 2, -b.h / 2 + 4, b.w, b.h, 22, "rgba(30,50,110,.3)"); draw.rect(c, -b.w / 2, -b.h / 2, b.w, b.h, 22, col || "#2f5fb0", "#fff", 2);
  draw.text(c, label, 0, label.length < 2 ? -2 : 1, { size: label.length < 2 ? 28 : 13.5, color: "#fff", weight: 800 }); c.restore();

function render(t) {
  const c = Lab.ctx, s = bg(), sq = N * cell + 20; c.drawImage(s, -40, -40, s.w, s.h);
  const ps = pan(sq); c.drawImage(ps, gx - 30, gy - 26, ps.w, ps.h);
  const sink = mode === "won" ? Lab.clamp(winT / .8, 0, 1) : 0;
  for (const w of all) if (w.found || w.shown) { const k = Lab.ease.outCubic(Lab.clamp(w.t / .22, 0, 1)); if (w.shown && !w.found) { c.setLineDash([6, 6]); capsule(c, w.r, w.c, w.dr, w.dc, w.w.length, k, "rgba(255,255,255,.12)", "#ffd84a", 2.5); c.setLineDash([]); } else capsule(c, w.r, w.c, w.dr, w.dc, w.w.length, k, Lab.color.alpha(w.col, .3), w.col, w.secret ? 3.5 : 2.5); }

  if (mode === "play" && level === 1 && !all.some(w => w.found) && !sel && time > 1.5) { const w = words[0], n = w.w.length - 1, k = Lab.ease.inOutQuad(Lab.clamp(((time - 1.5) % 2.6) / 1.5, 0, 1));   // first bowl: a ghost noodle shows the gesture
    c.globalAlpha = .7 * Math.min(1, (2.6 - (time - 1.5) % 2.6) * 2); capsule(c, w.r, w.c, w.dr, w.dc, n * k + 1, 1, "rgba(255,255,255,.25)", "#fff", 2.5); draw.circle(c, cx(w.c + w.dc * n * k) + 6, cy(w.r + w.dr * n * k) + 10, 11, "rgba(255,255,255,.85)", "rgba(39,54,94,.6)", 2); c.globalAlpha = 1; }
  const fs = cell * .62, isW = sink ? new Uint8Array(N * N) : null; if (sink) for (const w of all) for (let i = 0; i < w.w.length; i++) isW[(w.r + w.dr * i) * N + w.c + w.dc * i] = 1;
  for (let r = 0; r < N; r++) for (let q = 0; q < N; q++) {
    const i = r * N + q, sp = letter(grid[i], fs), h = hop[i] > 0 ? Lab.ease.pulse(hop[i]) : 0, sc = (1 + h * .38) * (sink && !isW[i] ? 1 - sink * .35 : 1), x = cx(q) + Math.sin(t * 1.3 + ph[i] * 2) * .9, y = cy(r) + Math.sin(t * 1.7 + ph[i]) * 1.5 - h * cell * .12;

  }

  draw.text(c, "BOWL " + level + " · " + theme, ui.tx, ui.ty, { size: 18, color: "#27365e", weight: 800 });
  if (mode !== "ladle") for (let i = 0; i < 3; i++) draw.star(c, ui.tx - 62 + i * 17, ui.sy, 7, i < st ? "#f0a224" : "rgba(39,54,94,.2)", 5, .5);
  draw.text(c, mode === "ladle" ? "find the secret · " + Math.ceil(ladleT) + "s" : fmtT(time) + " / " + fmtT(par), ui.tx + (mode === "ladle" ? 0 : 30), ui.sy + 1, { size: 13, color: mode === "ladle" ? "#c2452f" : over ? "#a56a4a" : "#4f5f8c", weight: 700 });
  button(c, ui.prev, "‹", level > 1); button(c, ui.next, "›", level < prog.max);
  if (sel && sel.len > 1) { const w = spell(sel), tw = w.length * 13 + 26; draw.rect(c, ui.tx - tw / 2, ui.py - 13, tw, 26, 13, "#27365e"); draw.text(c, w, ui.tx, ui.py + 1, { size: 15, color: "#fff", weight: 800 }); }
  else if (streak > 0 && mode === "play") { const tw = 104; draw.rect(c, ui.tx - tw / 2, ui.py - 11, tw, 22, 11, "rgba(226,83,47,.16)"); draw.rect(c, ui.tx - tw / 2, ui.py - 11, tw * streakT / 12, 22, 11, "rgba(226,83,47,.3)"); draw.text(c, "SIMMER ×" + (1 + streak), ui.tx, ui.py + 1, { size: 12.5, color: "#c2452f", weight: 800 }); }
  // menu
  const L = ui.list, cw = L.w / L.cols, ts = Math.min(17, L.rh * .56, cw / 6.4);
  words.forEach((w, i) => { const x = L.x + (i % L.cols + .5) * cw, y = L.y + (Math.floor(i / L.cols) + .5) * L.rh, pop = w.found ? 1 + Lab.ease.pulse(Lab.clamp(w.t / .4, 0, 1)) * .25 : 1;
    c.save(); c.translate(x, y); c.scale(pop, pop); draw.text(c, w.w, 0, 0, { size: ts, color: w.found ? "rgba(39,54,94,.5)" : "#27365e", weight: 800 });
    if (w.found) { const tw = c.measureText(w.w).width * Math.min(1, w.t / .25); c.strokeStyle = "#e2532f"; c.lineWidth = 2.2; c.lineCap = "round"; c.beginPath(); c.moveTo(-tw / 2 - 3, 0); c.lineTo(-tw / 2 - 3 + tw + 6, 0); c.stroke(); } c.restore(); });

  for (let i = 0; i < n; i++) { const on = secret.order.indexOf(i) < shown; draw.rect(c, sx + i * bw + 1.5, ui.secY - 11, bw - 3, 22, 5, secret.found ? "#ffd84a" : "#fff", "#d9b23c", 1.5); if (on) draw.text(c, secret.w[i], sx + (i + .5) * bw, ui.secY + 1, { size: 13, color: "#6a4a00", weight: 800 }); }
