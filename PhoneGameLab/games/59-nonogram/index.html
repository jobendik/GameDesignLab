<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Nonogram", instructions:"Tap to fill. Long-press to mark X. Match the row/col counts.", restart:start});
let sol, g, N=5, rowHints, colHints, holdTimer;
function start(){
  sol=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()<0.55?1:0));
  g=Array.from({length:N},()=>Array(N).fill(0)); // 0=empty,1=filled,2=X
  rowHints=sol.map(r=>hints(r));
  colHints=Array.from({length:N},(_,c)=>hints(sol.map(r=>r[c])));
  Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{ const p=pick(x,y); if(!p) return;
    holdTimer=setTimeout(()=>{ g[p.r][p.c] = g[p.r][p.c]===2?0:2; holdTimer=null;}, 350);
  }];
  Lab.input.onTap=[(x,y)=>{ if(holdTimer){clearTimeout(holdTimer); holdTimer=null;} const p=pick(x,y); if(!p) return;
    g[p.r][p.c] = g[p.r][p.c]===1?0:1; Lab.beep(500,.03);
    if(check()) Lab.win("Solved!");
  }];
  Lab.loop(()=>draw());
}
function hints(arr){ const out=[]; let run=0; for(const v of arr){ if(v) run++; else if(run){ out.push(run); run=0;}} if(run) out.push(run); return out.length?out:[0];}
function check(){ for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!!sol[r][c] !== (g[r][c]===1)) return false; return true;}
function pick(x,y){ const cs=cellSize(), off=offset(cs); const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs); if(c<0||c>=N||r<0||r>=N) return null; return {r,c};}
function cellSize(){ return Math.min((Lab.W-100)/N, (Lab.H-300)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2+30, y:200};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  c.fillStyle="#fff"; c.font=`${cs*0.3}px sans-serif`; c.textAlign="center";
  for(let i=0;i<N;i++){
    c.textAlign="right"; c.textBaseline="middle";
    c.fillText(rowHints[i].join(" "), off.x-5, off.y+i*cs+cs/2);
    c.textAlign="center"; c.textBaseline="bottom";
    c.fillText(colHints[i].join("\n")||"0", off.x+i*cs+cs/2, off.y-5);
  }
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    c.fillStyle = g[r][col]===1 ? "#7c6" : "#22253a";
    c.fillRect(x+1,y+1,cs-2,cs-2);
    if(g[r][col]===2){ c.strokeStyle="#e67"; c.lineWidth=2; c.beginPath(); c.moveTo(x+5,y+5); c.lineTo(x+cs-5,y+cs-5); c.moveTo(x+cs-5,y+5); c.lineTo(x+5,y+cs-5); c.stroke();}
  }
}
start();
</script></body></html>
