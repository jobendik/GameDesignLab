<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Potting Shed</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* POTTING SHED — a cosy drag-merge bench. Tap the seed sack / clay tub / beehive to stock the tray, drag two of a kind
 * together to grow them, and hand finished things to the order tags before the sun goes down.
 * Chains:   Flora (seed → bouquet), Clay (lump → grand urn), Honey (nectar → golden skep), six tiers each, plus a
 *           production step: a grown plant dropped onto a plain Pot becomes a Planter (worth far more than its parts).
 * Day:      one run = one 150 s day. Score = coins earned today. Quick back-to-back orders build a "bustle" multiplier.
 * Persist:  the tray, the almanac of discovered things, lifetime coins and the shed level (which unlocks the clay tub,
 *           the beehive, richer sacks and bigger stock) are kept between days through Lab.store.
 * Identity: sage-green shed wall, wooden bench, paper order tags, hand-drawn items; sleepy "dream" music that fills
 *           out as dusk approaches; every merge climbs a pentatonic ladder by tier. */
Lab.init({
  title: "Potting Shed", tagline: "Merge, grow and fill the day's orders.", category: "Puzzle & Match",
  howto: ["Tap the sack to stock the tray", "Drag two alike together to grow them", "Drag (or tap) wanted things to an order"],
  theme: { bg: "#5d8a66", bg2: "#8fb58a", accent: "#e8743b", accent2: "#f2c14e", fg: "#3b2a1a", light: true },
  orient: "any", music: { style: "dream", key: "F", bpm: 78, vol: .42 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, shade = Lab.color.shade;
const COLS = 5, ROWS = 6, N = COLS * ROWS, DAY = 150, INK = "#4a3524";
const CH = [
  { n: "Flora", c: "#4f9a52", names: ["Seed", "Sprout", "Seedling", "Bud", "Bloom", "Bouquet"] },
  { n: "Clay", c: "#c2643a", names: ["Clay", "Saucer", "Pot", "Glazed Pot", "Urn", "Grand Urn"] },
  { n: "Honey", c: "#d9930f", names: ["Nectar", "Comb", "Honeycomb", "Honey Pot", "Honey Jar", "Golden Skep"] },
  { n: "Planter", c: "#8a6fd0", names: ["Potted Seedling", "Potted Bud", "Potted Bloom", "Potted Bouquet"] },
];
const VAL = [1, 3, 8, 20, 48, 110], TOTAL = 22, LEVELS = [0, 60, 200, 520, 1100, 2200];
const UNLOCK = ["", "", "Clay tub unlocked", "Beehive unlocked", "Richer sacks", "Bigger stock", "Master gardener"];
const value = (ch, t) => ch === 3 ? Math.round((VAL[t + 2] + VAL[2]) * 1.6) : VAL[t];
const key = (ch, t) => ch * 10 + t, lvl = life => LEVELS.filter(v => life >= v).length;
let wide, gc, gr, cs, bx, by, sun, cards, gpos, almY, sv, cells, gens, orders, ghosts, coins, life, level, disc, dayT, streak, streakT, drag, stats, guide, guideT, idleT, dirty, alive, lastTick, binSq, orderN;

/* ---------- layout (portrait: 5×6 tray under three tags; wide: 6×5 tray between tags and tools) */
function layout() {
  const P = Lab.play; wide = P.w > P.h * 1.15; gc = wide ? ROWS : COLS; gr = wide ? COLS : ROWS;
  sun = { x: P.x + 14, y: P.y + 5, w: P.w - 28, h: 16 }; cards = []; gpos = [];
  if (wide) {
    const lw = clamp(P.w * .2, 140, 210), rw = clamp(P.h * .24, 66, 96);
    cs = Math.min((P.h - 62) / gr, (P.w - lw - rw - 52) / gc, 84);
    const bw = cs * gc, bh = cs * gr; bx = P.x + lw + 26 + (P.w - lw - rw - 52 - bw) / 2; by = P.y + 30 + (P.h - 58 - bh) / 2;
    const oh = Math.min((bh - 38) / 3, 100);
    for (let k = 0; k < 3; k++) cards.push({ x: bx - lw - 16, y: by + 22 + (bh - 22 - oh * 3 - 16) / 2 + k * (oh + 8), w: lw, h: oh });
    const r = Math.min(rw / 2 - 5, bh / 8 - 5); for (let k = 0; k < 4; k++) gpos.push({ x: bx + bw + 16 + rw / 2, y: by + bh * (k + .5) / 4, r });
    almY = by + bh + 15;
  } else {
    const oh = clamp(P.h * .125, 74, 98), gh = clamp(P.h * .11, 70, 88);
    cs = Math.min((P.w - 24) / gc, (P.h - oh - gh - 156) / gr, 84);
    const bw = cs * gc, bh = cs * gr, pad = Math.max(0, P.h - (oh + bh + gh + 156)) / 4;
    bx = P.x + (P.w - bw) / 2; by = P.y + 30 + pad + oh + 30;
    const cw = (bw - 16) / 3; for (let k = 0; k < 3; k++) cards.push({ x: bx + k * (cw + 8), y: by - oh - 30, w: cw, h: oh });
    const r = Math.min(gh / 2 - 4, bw / 8 - 6); for (let k = 0; k < 4; k++) gpos.push({ x: bx + bw * (k + .5) / 4, y: by + bh + 24 + pad + gh / 2, r });
    almY = gpos[0].y + gh / 2 + 30 + pad * .8;
  }
  Lab.sprite.clear("ps:");
}
Lab.onResize(() => { if (cells) { layout(); for (let i = 0; i < N; i++) if (cells[i] && (!drag || drag.it !== cells[i])) { const p = cellXY(i); cells[i].x = p.x; cells[i].y = p.y; } } });
const CR = i => wide ? [Math.floor(i / COLS), i % COLS] : [i % COLS, Math.floor(i / COLS)];
function cellXY(i) { const [c, r] = CR(i); return { x: bx + (c + .5) * cs, y: by + (r + .5) * cs }; }
function cellAt(x, y) { const c = Math.floor((x - bx) / cs), r = Math.floor((y - by) / cs); if (c < 0 || r < 0 || c >= gc || r >= gr) return -1; return wide ? c * COLS + r : r * COLS + c; }

/* ---------- state */
function mk(ch, t, i, fx0, fy0) { const p = cellXY(i); return { ch, t, x: fx0 == null ? p.x : fx0, y: fy0 == null ? p.y : fy0, pop: 0, wig: 0 }; }
function load() {
  layout();
  const s = Lab.store.get("save", null); sv = s && s.cells && s.cells.length === N ? s : { cells: Array(N).fill(null), life: 0, disc: [0], day: 1, tut: 0 };
  if (!s) sv.cells[12] = [0, 0];
  cells = sv.cells.map((c, i) => c ? mk(c[0], c[1], i) : null); life = sv.life; level = lvl(life); disc = new Set(sv.disc);
  gens = [0, 1, 2].map(ch => ({ ch, cap: 0, charge: 0, rate: [1.5, 1.9, 2.3][ch], need: ch + 1, sq: 0, shake: 0 })); tuneGens(true);
  orders = [null, null, null]; ghosts = []; coins = 0; dayT = DAY; streak = 0; streakT = 0; drag = null; guide = null; guideT = 0; idleT = 0; dirty = false; alive = true; lastTick = 99; binSq = 0; orderN = 0;
  stats = { orders: 0, merges: 0, best: null, found: 0 };
}
function tuneGens(fill) { for (const g of gens) { g.cap = [6, 5, 4][g.ch] + (level >= 5 ? 2 : 0); if (fill) g.charge = g.cap; } }
function persist() { sv.cells = cells.map(c => c ? [c.ch, c.t] : null); sv.life = life; sv.disc = [...disc]; Lab.store.set("save", sv); dirty = false; }
function start() {
  load(); for (let k = 0; k < 3; k++) newOrder(k, k * .25);
  Lab.setScore(0);
  Lab.input.onDown = [(x, y) => {
    if (!alive || drag) return; idleT = 0;
    for (let k = 0; k < 3; k++) if (Lab.dist(x, y, gpos[k].x, gpos[k].y) < gpos[k].r + 8) { tapGen(k); return; }
    const i = cellAt(x, y); if (i >= 0 && cells[i]) { drag = { i, it: cells[i], sx: x, sy: y, moved: false, lift: Lab.input.pointerType === "touch" ? cs * .42 : 0 }; Lab.sfx("tap", { vol: .5, pitch: 1.1 }); }
  }];
  Lab.input.onMove = [(x, y) => { if (!drag) return; if (!drag.moved && Lab.dist(x, y, drag.sx, drag.sy) > 10) drag.moved = true; if (drag.moved) { drag.it.x = x; drag.it.y = y - drag.lift; } }];
  Lab.input.onUp = [(x, y) => {
    if (!alive) { drag = null; return; } idleT = 0;
    if (drag) { const d = drag; drag = null; if (d.moved) drop(d, d.it.x, d.it.y); else { const o = wantedBy(d.it); if (o) deliver(o, d.i); else d.it.wig = 1; } return; }
    const k = cards.findIndex(c => x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h);
    if (k >= 0 && orders[k] && !orders[k].out) { let any = false; for (let i = 0; i < N && orders[k] && !orders[k].out; i++) if (cells[i] && needOf(orders[k], cells[i])) { deliver(orders[k], i); any = true; } if (!any) { orders[k].shake = 1; Lab.sfx("tick", { pitch: .7 }); } }
  }];
  Lab.input.onKey = [k => { if (k >= "1" && k <= "3") tapGen(+k - 1); }];
  Lab.expose({
    get coins() { return coins; }, get life() { return life; }, get level() { return level; }, get timeLeft() { return dayT; }, get merges() { return stats.merges; }, get streak() { return streak; },
    get cells() { return cells.map((c, i) => c ? { i, ch: c.ch, t: c.t, ...cellXY(i) } : null); }, get count() { return cells.filter(Boolean).length; }, get found() { return disc.size; },
    get orders() { return orders.map((o, k) => o && !o.out ? { k, needs: o.needs.map(n => ({ ch: n.ch, t: n.t, done: n.done })), reward: o.reward, x: cards[k].x + cards[k].w / 2, y: cards[k].y + cards[k].h / 2 } : null); },
    get gens() { return gens.map((g, k) => ({ x: gpos[k].x, y: gpos[k].y, charge: Math.floor(g.charge), locked: level < g.need })); }, get bin() { return { x: gpos[3].x, y: gpos[3].y }; },
    cellXY, give(i, ch, t) { cells[i] = mk(ch, t, i); discover(ch, t, true); dirty = true; }, clear() { cells.fill(null); dirty = true; }, setTime(s) { dayT = s; sv.tut = 3; }, setLife(n) { life = n; checkLevel(); },
    saved() { return Lab.store.get("save", null); },
  });
  Lab.loop((dt, t) => { update(dt); render(t); });
}

/* ---------- orders */
function newOrder(k, delay) {
  const n = orderN++, needs = [], chs = [0]; if (level >= 2) chs.push(1); if (level >= 3) chs.push(2);
  const maxT = Math.min(5, 1 + Math.ceil(level / 1.5) + (dayT < DAY * .45 ? 1 : 0)), cnt = n > 1 && level >= 2 && Lab.chance(.3 + level * .06) ? 2 : 1;
  if (sv.tut < 3 && n < 2) needs.push({ ch: 0, t: 1 + n });
  else for (let j = 0; j < cnt; j++) {
    let ch, t, tries = 0;
    do { if (level >= 3 && Lab.chance(.2)) { ch = 3; t = Lab.randInt(0, Math.min(3, level - 3)); } else { ch = Lab.choose(chs); t = 1 + Math.floor(Math.pow(Math.random(), 1.5) * maxT); } }
    while (++tries < 8 && (needs.some(q => q.ch === ch && q.t === t) || orders.some(o => o && o.needs.length === 1 && cnt === 1 && o.needs[0].ch === ch && o.needs[0].t === t)));
    needs.push({ ch, t });
  }
  for (const q of needs) { q.done = false; q.pulse = 0; }
  orders[k] = { needs, reward: needs.reduce((a, q) => a + value(q.ch, q.t), 0) * 2 + 3 + (needs.length > 1 ? 4 : 0), in: -(delay || 0) * 3, out: 0, shake: 0 };
}
const needOf = (o, it) => o && !o.out && o.needs.find(q => !q.done && q.ch === it.ch && q.t === it.t);
const wantedBy = it => orders.find(o => needOf(o, it));
function deliver(o, i) {
  const it = cells[i], q = needOf(o, it), k = orders.indexOf(o), c = cards[k]; if (!q) return false;
  cells[i] = null; q.done = true; dirty = true; if (sv.tut < 3) sv.tut = 3;
  const j = o.needs.indexOf(q), tx = c.x + c.w * (j + .5) / o.needs.length, ty = c.y + c.h * .42, g = { ch: it.ch, t: it.t, x: it.x, y: it.y, s: 1 };
  ghosts.push(g); Lab.tween(g, { x: tx, y: ty, s: .6 }, .28, { ease: "inOutQuad", onDone() { ghosts.splice(ghosts.indexOf(g), 1); q.pulse = 1; fx.burst(tx, ty, { n: 8, colors: [CH[it.ch].c, "#fff6c9"], speed: 120, life: .4, size: 3 }); } });
  Lab.sfx("pickup", { pitch: 1 + it.t * .08 });
  if (o.needs.every(n => n.done)) {
    const mult = 1 + .25 * Math.min(streak, 8), gain = Math.round(o.reward * mult); streak++; streakT = 14; stats.orders++;
    o.out = .001; Lab.after(.3, () => {
      addCoins(gain, c.x + c.w / 2, c.y + c.h * .5, mult > 1 ? "  ×" + mult.toFixed(2).replace(/0$/, "") : "");
      Lab.sfx("coin", { pitch: 1 + Math.min(streak, 8) * .05 }); Lab.audio.combo(2 + Math.min(streak, 8), { vol: .14 }); Lab.buzz(12);
      fx.burst(c.x + c.w / 2, c.y + c.h / 2, { n: 16, colors: ["#f2c14e", "#fff6c9", "#e8743b"], speed: 220, life: .6, size: 4, gravity: 300, shape: "star" });
    });
    Lab.after(.75, () => { if (alive) newOrder(k); });
  }
  return true;
}
function addCoins(n, x, y, extra) { coins += n; life += n; Lab.setScore(coins); Lab.bumpScore(); fx.text(x, y, "+" + n + (extra || ""), { color: "#fff3b0", size: 20, outline: "rgba(74,53,36,.8)" }); checkLevel(); dirty = true; }
function checkLevel() { const nl = lvl(life); if (nl <= level) return; level = nl; tuneGens(false); for (const g of gens) if (g.need === level) { g.charge = g.cap; g.sq = 1; } Lab.banner("Shed level " + level, { color: "#f2c14e", ms: 1500, y: .3 }); Lab.toast(UNLOCK[level], 1900, { y: .42 }); Lab.sfx("levelup"); }
function discover(ch, t, quiet) {
  if (disc.has(key(ch, t))) return; disc.add(key(ch, t)); stats.found++; if (quiet) return;
  const b = value(ch, t); Lab.toast("New: " + CH[ch].names[t] + "  +" + b, 1500, { y: wide ? .5 : .2 }); Lab.sfx("unlock"); addCoins(b, Lab.W / 2, almY - 26);
}

/* ---------- stocking, merging, dropping */
function tapGen(k) {
  const g = gens[k], p = gpos[k]; if (!alive) return false;
  if (level < g.need) { g.shake = 1; Lab.sfx("error", { vol: .5 }); Lab.toast("Unlocks at shed level " + g.need, 1100, { y: .5 }); return false; }
  const free = []; for (let i = 0; i < N; i++) if (!cells[i]) free.push(i);
  if (!free.length) { g.shake = 1; Lab.sfx("error", { vol: .5 }); Lab.toast("Tray is full — merge or compost", 1200, { y: .5 }); return false; }
  if (g.charge < 1) { g.shake = 1; Lab.sfx("tick", { pitch: .6 }); return false; }
  g.charge -= 1; g.sq = 1; idleT = 0;
  const t = Lab.chance(.1 + (level >= 4 ? .2 : 0)) ? 1 : 0, i = free.sort((a, b) => Lab.dist(cellXY(a).x, cellXY(a).y, p.x, p.y) - Lab.dist(cellXY(b).x, cellXY(b).y, p.x, p.y))[Lab.randInt(0, Math.min(3, free.length - 1))];
  cells[i] = mk(g.ch, t, i, p.x, p.y - p.r * .4); cells[i].pop = 1; discover(g.ch, t); dirty = true;
  Lab.sfx("pop", { pitch: [1.25, .95, 1.5][g.ch] }); Lab.buzz(6); return true;
}
function combine(a, b) { // result of dropping a onto b, or null
  if (a.ch === b.ch && a.t === b.t && a.ch < 3 && a.t < 5) return [a.ch, a.t + 1];
  const f = a.ch === 0 ? a : b.ch === 0 ? b : null, p = a.ch === 1 ? a : b.ch === 1 ? b : null;
  if (f && p && f.t >= 2 && p.t === 2) return [3, f.t - 2];
  return null;
}
function drop(d, x, y) {
  const it = d.it, i = d.i;
  for (let k = 0; k < 3; k++) { const c = cards[k]; if (x > c.x - 6 && x < c.x + c.w + 6 && y > c.y - 6 && y < c.y + c.h + 10) { if (orders[k] && deliver(orders[k], i)) return; if (orders[k]) orders[k].shake = 1; Lab.sfx("error", { vol: .4 }); return; } }
  if (Lab.dist(x, y, gpos[3].x, gpos[3].y) < gpos[3].r + 14) { cells[i] = null; binSq = 1; dirty = true; Lab.sfx("crunch"); fx.burst(gpos[3].x, gpos[3].y, { n: 10, colors: ["#6fbf5f", "#7a5234"], speed: 140, life: .5, gravity: 400 }); if (it.t) addCoins(it.t, gpos[3].x, gpos[3].y - gpos[3].r); return; }
  const j = cellAt(x, y); if (j < 0 || j === i) { Lab.sfx("slide", { vol: .6 }); return; }
  const o = cells[j];
  if (!o) { cells[j] = it; cells[i] = null; Lab.sfx("knock", { pitch: 1.3, vol: .6 }); dirty = true; return; }
  const m = combine(it, o);
  if (!m) { cells[j] = it; cells[i] = o; Lab.sfx("slide"); dirty = true; return; }
  const p = cellXY(j), n = mk(m[0], m[1], j); n.pop = 1; cells[j] = n; cells[i] = null; stats.merges++; dirty = true;
  const v = value(m[0], m[1]); if (!stats.best || v > value(stats.best[0], stats.best[1])) stats.best = m;
  fx.burst(p.x, p.y, { n: 8 + m[1] * 3, colors: [CH[m[0]].c, "#fff6c9", "#fff"], speed: 130 + m[1] * 30, life: .5, size: 3 + m[1] * .4, gravity: 200 });
  fx.ring(p.x, p.y, { r0: cs * .25, r1: cs * (.6 + m[1] * .08), color: CH[m[0]].c, width: 4, life: .35 });
  Lab.audio.combo(m[0] === 3 ? m[1] + 5 : m[1], { vol: .2 }); Lab.sfx("bubble", { pitch: 1.3 - m[1] * .08, vol: .7 }); Lab.buzz(8 + m[1] * 3);
  if (m[1] >= 3 || m[0] === 3) { Lab.shake(2 + m[1], .18); }
  discover(m[0], m[1]);
}
function findGuide() { // tutorial + idle hint: wanted thing → its tag, else a mergeable pair, else the sack
  for (let i = 0; i < N; i++) if (cells[i]) { const o = wantedBy(cells[i]); if (o) { const c = cards[orders.indexOf(o)]; return { a: cellXY(i), b: { x: c.x + c.w / 2, y: c.y + c.h / 2 } }; } }
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (cells[i] && cells[j] && combine(cells[i], cells[j])) return { a: cellXY(i), b: cellXY(j) };
  return cells.some(c => !c) && gens[0].charge >= 1 ? { a: gpos[0], ring: gpos[0].r } : null;
}

function update(dt) {
  if (!alive) return;
  if (sv.tut >= 3) dayT -= dt;
  if (dayT <= 20 && lastTick > 20) { lastTick = 20; Lab.toast("Dusk — closing soon", 1400, { y: .5 }); Lab.sfx("chime", { pitch: .8 }); }
  if (dayT <= 5 && Math.ceil(dayT) < lastTick) { lastTick = Math.ceil(dayT); Lab.sfx("tick", { pitch: 1.2 }); }
  Lab.music.intensity(.2 + (1 - dayT / DAY) * .5 + Math.min(streak, 6) * .05);
  if (streakT > 0) { streakT -= dt; if (streakT <= 0) streak = 0; }
  for (const g of gens) { if (level >= g.need && g.charge < g.cap) { const was = Math.floor(g.charge); g.charge = Math.min(g.cap, g.charge + dt / g.rate); if (Math.floor(g.charge) > was && was === 0) Lab.sfx("tick", { pitch: 1.5, vol: .4 }); } g.sq = Lab.damp(g.sq, 0, 10, dt); g.shake = Lab.damp(g.shake, 0, 8, dt); }
  binSq = Lab.damp(binSq, 0, 9, dt);
  for (let i = 0; i < N; i++) { const it = cells[i]; if (!it) continue; if (!(drag && drag.it === it && drag.moved)) { const p = cellXY(i); it.x = Lab.damp(it.x, p.x, 18, dt); it.y = Lab.damp(it.y, p.y, 18, dt); } it.pop = Math.max(0, it.pop - dt * 3.4); it.wig = Math.max(0, it.wig - dt * 3); }
  for (const o of orders) { if (!o) continue; o.in = Math.min(1, o.in + dt * 3.5); if (o.out) o.out = Math.min(1, o.out + dt * 2.2); o.shake = Lab.damp(o.shake, 0, 8, dt); for (const q of o.needs) q.pulse = Math.max(0, q.pulse - dt * 3); }
  idleT += dt; guideT -= dt;
  if (guideT <= 0) { guideT = .4; guide = !drag && (sv.tut < 3 || idleT > 7) ? findGuide() : null; }
  if (dirty && !drag) persist();

}
function endDay() {
  alive = false; drag = null; sv.day++; persist();
  const nxt = LEVELS[level], b = stats.best;
  Lab.gameover({ neutral: true, title: "Closing time", message: level < 6 ? `Shed level ${level} · next unlock at ${nxt} coins (${life} so far)` : "Shed level 6 · master gardener", score: coins,
    stats: [["Orders", stats.orders], ["Best make", b ? CH[b[0]].names[b[1]] : "—"], ["Almanac", disc.size + "/" + TOTAL]] });
}

/* ---------- art: every item is painted in a −1..1 box and baked per size */
function leaf(g, x, y, a, l) { g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(l * .5, -l * .5, l, 0); g.quadraticCurveTo(l * .5, l * .5, 0, 0); g.fillStyle = "#74c463"; g.fill(); g.stroke(); g.restore(); }
function flowerHead(g, x, y, r, col) { g.fillStyle = col; for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - 1.57; g.beginPath(); g.arc(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .55, r * .46, 0, TAU); g.fill(); g.stroke(); } g.beginPath(); g.arc(x, y, r * .36, 0, TAU); g.fillStyle = "#ffd75e"; g.fill(); g.stroke(); }
function flora(g, t, bare) {
  const el = (x, y, rx, ry, f) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = f; g.fill(); g.stroke(); };
