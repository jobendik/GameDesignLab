<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Goal Flick", instructions:"Swipe to curve the ball around defenders into the goal.", restart:start});
let ball, defs, goal, shots, made, aiming, sx,sy,ex,ey;
function start(){
  reset(); shots=8; made=0; Lab.setScore(0);
  goal={x:Lab.W/2-90, y:60, w:180, h:24};
  defs=[];
  for(let i=0;i<3;i++) defs.push({x:Lab.W*(0.25+i*0.25), y:Lab.H*0.4+i*30, r:22, dir:i%2?1:-1, sp:Lab.rand(40,80)});
  Lab.input.onDown=[(x,y)=>{ if(!ball.moving){ aiming=true; sx=x;sy=y;ex=x;ey=y;}}];
  Lab.input.onMove=[(x,y)=>{ if(aiming){ex=x;ey=y;}}];
  Lab.input.onUp=[(x,y)=>{ if(!aiming) return; aiming=false;
    const dx=sx-x, dy=sy-y; if(Math.hypot(dx,dy)<20) return;
    if(shots<=0) return;
    shots--;
    ball.vx=dx*4; ball.vy=dy*4;
    ball.spin=(x-Lab.W/2)*0.5; // curve
    ball.moving=true;
  }];
  Lab.loop(dt=>{
    for(const d of defs){ d.x+=d.dir*d.sp*dt; if(d.x<40||d.x>Lab.W-40) d.dir*=-1;}
    if(ball.moving){
      ball.vx+=ball.spin*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      for(const d of defs){ if(Lab.dist(ball.x,ball.y,d.x,d.y)<d.r+12){ Lab.toast("Blocked!"); endShot(); return;}}
      if(ball.y<goal.y+goal.h && ball.x>goal.x && ball.x<goal.x+goal.w){ made++; Lab.setScore(made); Lab.toast("GOAL!"); Lab.beep(900,.1); endShot(); return;}
      if(ball.y<0||ball.x<0||ball.x>Lab.W||ball.y>Lab.H){ endShot(); return;}
    }
    if(shots<=0 && !ball.moving){ Lab.gameover({title:"Done",message:made+"/8 goals"}); return;}
    const c=Lab.ctx; c.fillStyle="#2a6b3a"; c.fillRect(0,0,Lab.W,Lab.H);
    c.fillStyle="#fff"; c.fillRect(goal.x,goal.y,goal.w,goal.h);
    c.strokeStyle="#fff"; c.strokeRect(goal.x-4,goal.y+goal.h, goal.w+8, 8);
    for(const d of defs){ c.beginPath(); c.fillStyle="#444"; c.arc(d.x,d.y,d.r,0,Lab.TAU); c.fill(); c.fillStyle="#fff"; c.fillRect(d.x-3,d.y-3,6,6);}
    c.beginPath(); c.fillStyle="#fff"; c.arc(ball.x,ball.y,12,0,Lab.TAU); c.fill();
    if(aiming){ c.strokeStyle="#ff0"; c.lineWidth=3; c.beginPath(); c.moveTo(ball.x,ball.y); c.lineTo(ball.x+(sx-ex), ball.y+(sy-ey)); c.stroke();}
    c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Shots: "+shots+"  Goals: "+made, Lab.W/2, Lab.H-30);
  });
}
function endShot(){ ball.moving=false; setTimeout(reset,400);}
function reset(){ ball={x:Lab.W/2, y:Lab.H-80, vx:0, vy:0, spin:0, moving:false};}
start();
</script></body></html>
