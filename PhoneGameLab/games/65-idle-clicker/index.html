<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Idle Clicker", instructions:"Tap the cookie. Buy upgrades. Watch numbers go up.", restart:start});
let cookies, cps, perTap, upgrades, tap;
function start(){
  cookies=0; cps=0; perTap=1; tap={t:0, scale:1};
  upgrades=[
    {name:"Finger +1/tap", cost:10, kind:"tap", val:1, owned:0},
    {name:"Cursor +1 cps", cost:25, kind:"cps", val:1, owned:0},
    {name:"Grandma +5 cps", cost:200, kind:"cps", val:5, owned:0},
    {name:"Farm +20 cps", cost:1500, kind:"cps", val:20, owned:0},
  ];
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ if(y>Lab.H*0.55){ // upgrade row
    const w=(Lab.W-40)/upgrades.length;
    const idx=Math.floor((x-20)/w);
    if(idx>=0&&idx<upgrades.length){ const u=upgrades[idx]; if(cookies>=u.cost){ cookies-=u.cost; u.owned++; if(u.kind==="tap") perTap+=u.val; else cps+=u.val; u.cost=Math.floor(u.cost*1.5); Lab.beep(700,.06);}}
    return;
  }
    // cookie tap
    const cx=Lab.W/2, cy=Lab.H*0.3;
    if(Lab.dist(x,y,cx,cy)<90){ cookies+=perTap; tap.scale=1.2; Lab.beep(800,.03);}
  }];
  Lab.loop(dt=>{ cookies+=cps*dt; tap.scale+=(1-tap.scale)*dt*8; Lab.setScore(Math.floor(cookies)); draw();});
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#2a1a1a"; c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff"; c.font="bold 28px sans-serif"; c.textAlign="center"; c.fillText(Math.floor(cookies)+" cookies", Lab.W/2, 100);
  c.font="14px sans-serif"; c.fillStyle="#7e89b3"; c.fillText(cps.toFixed(1)+" / sec  |  "+perTap+" / tap", Lab.W/2, 130);
  c.save(); c.translate(Lab.W/2, Lab.H*0.3); c.scale(tap.scale,tap.scale);
  c.beginPath(); c.fillStyle="#a66"; c.arc(0,0,90,0,Lab.TAU); c.fill();
  c.fillStyle="#653"; for(let i=0;i<6;i++){ const a=i*1.2, r=Lab.rand; c.beginPath(); c.arc(Math.cos(a)*40, Math.sin(a)*40, 10, 0, Lab.TAU); c.fill();}
  c.restore();
  // upgrades
  const w=(Lab.W-40)/upgrades.length;
  for(let i=0;i<upgrades.length;i++){ const u=upgrades[i]; const x=20+i*w, y=Lab.H*0.6;
    c.fillStyle=cookies>=u.cost?"#3a5a8a":"#2a2e44"; c.fillRect(x+3,y,w-6,Lab.H*0.35);
    c.fillStyle="#fff"; c.font="13px sans-serif"; c.textAlign="center"; c.fillText(u.name, x+w/2, y+24);
    c.fillText("Cost: "+u.cost, x+w/2, y+50);
    c.fillText("Owned: "+u.owned, x+w/2, y+76);
  }
}
start();
</script></body></html>
