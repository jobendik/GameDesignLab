<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css">
<script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Tap Frenzy", instructions:"Tap circles before they vanish! 30 seconds.", restart:start});
let circles, timeLeft, hits, misses;
function spawn(){
  circles.push({
    x:Lab.rand(40,Lab.W-40), y:Lab.rand(80,Lab.H-80),
    r:Lab.rand(28,46), life:Lab.rand(1.0,1.6), age:0,
    hue:Lab.randInt(0,360)
  });
}
function start(){
  circles=[]; timeLeft=30; hits=0; misses=0;
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    for(let i=circles.length-1;i>=0;i--){
      const c=circles[i];
      if(Lab.dist(x,y,c.x,c.y)<c.r){ circles.splice(i,1); hits++; Lab.setScore(hits); Lab.beep(880,.05); return; }
    }
    misses++; Lab.beep(160,.08,'sawtooth');
  }];
  let spawnT=0;
  Lab.loop((dt)=>{
    timeLeft-=dt; spawnT-=dt;
    if(timeLeft<=0){
      Lab.gameover({title:"Time!",message:"Hits: "+hits+"  •  Misses: "+misses});
      return;
    }
    if(spawnT<=0){ spawn(); spawnT=Math.max(0.18, 0.6 - hits*0.01); }
    if(circles.length>10) circles.shift();
    const c=Lab.ctx; c.clearRect(0,0,Lab.W,Lab.H);
    for(let i=circles.length-1;i>=0;i--){
      const o=circles[i]; o.age+=dt;
      if(o.age>o.life){ circles.splice(i,1); misses++; continue; }
      const f=1-o.age/o.life;
      c.beginPath(); c.fillStyle=`hsla(${o.hue},80%,60%,${f})`;
      c.arc(o.x,o.y,o.r*f,0,Lab.TAU); c.fill();
      c.lineWidth=3; c.strokeStyle=`hsla(${o.hue},80%,80%,${f})`; c.stroke();
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("⏱ "+timeLeft.toFixed(1)+"s", Lab.W/2, 50);
  });
}
start();
</script></body></html>
