<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cook & Serve", instructions:"Tap pan to start cooking, tap again when meter is green, then drag to a waiting customer.", restart:start});
const COLORS=["#7c6","#fc4","#e74","#69d"];
let pans, customers, dragging, score, t, lives;
function start(){
  pans=[]; for(let i=0;i<3;i++) pans.push({x:Lab.W*0.2+i*Lab.W*0.3, y:Lab.H*0.45, state:"idle", cookT:0, color:0});
  customers=[]; for(let i=0;i<3;i++) customers.push({x:Lab.W*0.2+i*Lab.W*0.3, y:Lab.H*0.18, want:Lab.randInt(0,3), patience:1});
  dragging=null; score=0; lives=3; t=0; Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{
    for(const p of pans){ if(Lab.dist(x,y,p.x,p.y)<40){
      if(p.state==="idle"){ p.state="cooking"; p.cookT=0; p.color=Lab.randInt(0,3);}
      else if(p.state==="ready" || p.state==="done"){ dragging={pan:p}; }
      return;
    }}
  }];
  Lab.input.onUp=[(x,y)=>{ if(!dragging) return;
    for(const cu of customers){ if(cu.want>=0 && Lab.dist(x,y,cu.x,cu.y)<40){
      if(cu.want===dragging.pan.color){ score++; Lab.setScore(score); Lab.beep(900,.08); cu.want=Lab.randInt(0,3); cu.patience=1;}
      else { lives--; Lab.toast("Wrong!");}
      dragging.pan.state="idle"; break;
    }}
    dragging=null;
  }];
  Lab.loop(dt=>{
    t+=dt;
    for(const p of pans){
      if(p.state==="cooking"){ p.cookT+=dt; if(p.cookT>2) p.state="ready"; if(p.cookT>3.5) p.state="burnt";}
    }
    for(const cu of customers){ cu.patience -= dt*0.08; if(cu.patience<=0){ lives--; cu.want=Lab.randInt(0,3); cu.patience=1; Lab.toast("Left angry!");}}
    if(lives<=0){ Lab.gameover({title:"Bankrupt!",message:"Served: "+score}); return;}
    draw();
  });
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#3a2a1a"; c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#5a3a2a"; c.fillRect(0, Lab.H*0.3, Lab.W, 10);
  for(const cu of customers){ c.beginPath(); c.fillStyle="#fc4"; c.arc(cu.x,cu.y,28,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle=COLORS[cu.want]; c.arc(cu.x, cu.y-40, 14, 0, Lab.TAU); c.fill();
    c.fillStyle="#3a3"; c.fillRect(cu.x-28, cu.y+30, 56*cu.patience, 4);
  }
  for(const p of pans){ c.beginPath(); c.fillStyle="#222"; c.arc(p.x,p.y,34,0,Lab.TAU); c.fill();
    if(p.state==="cooking"){ c.fillStyle="#666"; c.fillRect(p.x-20, p.y+38, 40, 4); c.fillStyle="#ffd35a"; c.fillRect(p.x-20, p.y+38, 40*Math.min(1,p.cookT/2), 4);}
    if(p.state==="ready"){ c.beginPath(); c.fillStyle=COLORS[p.color]; c.arc(p.x,p.y,20,0,Lab.TAU); c.fill();}
    if(p.state==="burnt"){ c.beginPath(); c.fillStyle="#222"; c.arc(p.x,p.y,20,0,Lab.TAU); c.fill();}
  }
  c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText("Lives: "+lives, Lab.W/2, Lab.H-30);
}
start();
</script></body></html>
