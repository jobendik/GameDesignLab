<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bullet Hell", instructions:"Drag your ship to dodge. Survive as long as possible.", restart:start});
let p, bullets, t, spawnT, level;
function start(){
  p={x:Lab.W/2,y:Lab.H-100,r:6};
  bullets=[]; t=0; spawnT=0; level=1;
  Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{ if(Lab.input.down){ p.x=Lab.clamp(x,p.r,Lab.W-p.r); p.y=Lab.clamp(y-30,p.r,Lab.H-p.r);} }];
  Lab.loop(dt=>{
    t+=dt; spawnT-=dt; Lab.setScore(Math.floor(t*10));
    if(t>level*10){ level++; Lab.toast("Level "+level); }
    if(spawnT<=0){
      spawnT=Math.max(0.07, 0.4-level*0.02);
      const pattern=Lab.randInt(0,3);
      if(pattern===0){ // ring
        const cx=Lab.rand(60,Lab.W-60), cy=Lab.rand(80,260);
        const n=8+level; for(let i=0;i<n;i++){const a=i/n*Lab.TAU; bullets.push({x:cx,y:cy,vx:Math.cos(a)*120,vy:Math.sin(a)*120,r:5,hue:200});}
      } else if(pattern===1){ // aim at player
        const x=Lab.rand(40,Lab.W-40);
        const dx=p.x-x, dy=p.y-100, d=Math.hypot(dx,dy)||1;
        bullets.push({x,y:80,vx:dx/d*200,vy:dy/d*200,r:6,hue:0});
      } else if(pattern===2){ // wall with gap
        const gap=Lab.rand(60,Lab.W-60);
        for(let x=20;x<Lab.W;x+=24){ if(Math.abs(x-gap)<60) continue; bullets.push({x,y:60,vx:0,vy:120+level*8,r:6,hue:300});}
      } else { // spiral
        const a=t*4; bullets.push({x:Lab.W/2,y:120,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5,hue:60});
      }
    }
    for(const b of bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt;}
    bullets=bullets.filter(b=>b.x>-20&&b.x<Lab.W+20&&b.y>-20&&b.y<Lab.H+20);
    for(const b of bullets){ if(Lab.dist(b.x,b.y,p.x,p.y)<b.r+p.r){ Lab.gameover({title:"Hit!",message:"Survived "+t.toFixed(1)+"s"}); return; } }
    const c=Lab.ctx; c.fillStyle="rgba(5,5,15,0.6)"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const b of bullets){ c.beginPath(); c.fillStyle=`hsl(${b.hue},80%,60%)`; c.arc(b.x,b.y,b.r,0,Lab.TAU); c.fill();}
    c.beginPath(); c.fillStyle="#fff"; c.arc(p.x,p.y,p.r+2,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle="#5af"; c.arc(p.x,p.y,p.r,0,Lab.TAU); c.fill();
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Level "+level+" • "+t.toFixed(1)+"s", Lab.W/2, 70);
  });
}
start();
</script></body></html>
