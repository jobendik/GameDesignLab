<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Find the Difference", instructions:"Tap the tile that doesn't match the rest.", restart:start});
let grid,size,cell,target,score,timeLeft;
function newRound(){
  size=3+Math.min(4,Math.floor(score/3));
  const margin=20, top=80, bot=80;
  cell=Math.min((Lab.W-margin*2)/size,(Lab.H-top-bot)/size);
  const hue=Lab.randInt(0,360), l=Lab.randInt(45,70);
  grid=[]; const odd=Lab.randInt(0,size*size-1); target=odd;
  for(let i=0;i<size*size;i++){
    grid.push(i===odd?`hsl(${hue},80%,${l+8}%)`:`hsl(${hue},80%,${l}%)`);
  }
}
function start(){
  score=0; timeLeft=45; Lab.setScore(0);
  newRound();
  Lab.input.onTap=[(x,y)=>{
    const margin=20,top=80;
    const ox=(Lab.W-cell*size)/2, oy=top+10;
    const cx=Math.floor((x-ox)/cell), cy=Math.floor((y-oy)/cell);
    if(cx<0||cy<0||cx>=size||cy>=size) return;
    const idx=cy*size+cx;
    if(idx===target){ score++; Lab.setScore(score); Lab.beep(900,.05); newRound(); }
    else { timeLeft-=3; Lab.beep(160,.1,'sawtooth'); Lab.toast("-3s"); }
  }];
  Lab.loop(dt=>{
    timeLeft-=dt; if(timeLeft<=0){ Lab.gameover({title:"Time!",message:"Found "+score}); return; }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    const ox=(Lab.W-cell*size)/2, oy=80+10;
    for(let i=0;i<grid.length;i++){
      const x=ox+(i%size)*cell, y=oy+Math.floor(i/size)*cell;
      c.fillStyle=grid[i]; c.fillRect(x+3,y+3,cell-6,cell-6);
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("⏱ "+timeLeft.toFixed(1)+"s", Lab.W/2, 50);
  });
}
start();
</script></body></html>
