<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Stack Runner", instructions:"Drag side-to-side. Collect blocks, cross gaps using your stack.", restart:start});
let p,stack,blocks,gaps,t,sp,scrollY;
function start(){
  p={x:Lab.W/2,y:Lab.H-150,w:40,h:40};
  stack=0;
  blocks=[]; gaps=[];
  // road layout: 0..2000
  let y=Lab.H-300; for(let i=0;i<60;i++){
    y-=80;
    if(i%5===0 && i>2) gaps.push({y, h:Lab.rand(60,160)});
    else if(Math.random()<0.6) blocks.push({x:Lab.rand(60,Lab.W-60), y, taken:false});
  }
  t=0; sp=200; scrollY=0;
  Lab.setScore(0);
  Lab.input.onMove=[(x)=>{ if(Lab.input.down) p.x=Lab.clamp(x, p.w/2+10, Lab.W-p.w/2-10);}];
  Lab.loop(dt=>{
    t+=dt; sp=200+t*8;
    scrollY+=sp*dt;
    const py=Lab.H-150;
    // player y in world coords
    const wy = py - scrollY + (Lab.H-150);
    // pick up blocks
    for(const b of blocks){ if(!b.taken){
      const sy = b.y + scrollY;
      if(Math.abs(b.x-p.x)<30 && Math.abs(sy-py)<25){ b.taken=true; stack++; Lab.beep(900,.04); Lab.setScore(stack);}
    }}
    // gaps
    for(const g of gaps){
      const sy=g.y+scrollY;
      if(sy>py-20 && sy<py+20+g.h){
        if(stack<=0){ Lab.gameover({title:"Fell in!",message:"Distance: "+Math.floor(scrollY/10)}); return; }
        else if(!g.consumed){ stack--; g.consumed=true; Lab.setScore(stack); }
      }
    }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    // road
    c.fillStyle="#1c2546"; c.fillRect(20,0,Lab.W-40,Lab.H);
    for(const g of gaps){ const sy=g.y+scrollY; if(sy>-100 && sy<Lab.H+100){ c.fillStyle="#0b0f1a"; c.fillRect(20,sy,Lab.W-40,g.h);}}
    for(const b of blocks){ if(b.taken) continue; const sy=b.y+scrollY; if(sy>-40 && sy<Lab.H+40){ c.fillStyle="#ffd35a"; c.fillRect(b.x-15,sy-15,30,30);}}
    // player + stack
    for(let i=0;i<=stack;i++){
      c.fillStyle=i===0?"#5af":`hsl(${i*30},80%,60%)`;
      c.fillRect(p.x-p.w/2, py-p.h/2-i*16, p.w, 16);
    }
  });
}
start();
</script></body></html>
