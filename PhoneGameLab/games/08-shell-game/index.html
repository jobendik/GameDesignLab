<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cups & Ball", instructions:"Watch the ball, then tap the cup it's under.", restart:start});
let cups,phase,timer,ballIdx,streak,swaps,N;
function start(){
  streak=0; Lab.setScore(0); newRound();
  Lab.input.onTap=[(x,y)=>{
    if(phase!=='pick') return;
    for(let i=0;i<cups.length;i++){
      if(Math.abs(x-cups[i].x)<60 && Math.abs(y-cups[i].y)<60){
        if(i===ballIdx){ streak++; Lab.setScore(streak); Lab.beep(900,.07); Lab.toast("✓"); }
        else { Lab.gameover({title:"Wrong cup!", message:"Streak: "+streak}); return; }
        newRound(); return;
      }
    }
  }];
  Lab.loop(dt=>{
    timer+=dt;
    if(phase==='reveal'){ if(timer>1.8){ phase='swap'; timer=0; } }
    else if(phase==='swap'){
      if(timer>0.5){
        timer=0; swaps--;
        if(swaps<=0){ phase='pick'; }
        else {
          // pick two adjacent cups, swap positions
          const i=Lab.randInt(0,N-2), j=i+1;
          [cups[i],cups[j]]=[cups[j],cups[i]];
          if(ballIdx===i)ballIdx=j; else if(ballIdx===j)ballIdx=i;
        }
      }
    }
    draw();
  });
}
function newRound(){
  N=3+Math.min(3,Math.floor(streak/2));
  cups=[]; const pad=40, sp=(Lab.W-pad*2)/(N-1);
  for(let i=0;i<N;i++) cups.push({x:pad+sp*i, y:Lab.H/2});
  ballIdx=Lab.randInt(0,N-1);
  phase='reveal'; timer=0; swaps=6+streak*2;
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1a1226"; c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
  const msg=phase==='reveal'?"Watch...":phase==='swap'?"Mixing...":"Pick the cup!";
  c.fillText(msg, Lab.W/2, 80);
  for(let i=0;i<cups.length;i++){
    const cup=cups[i];
    if(phase==='reveal'&&i===ballIdx){
      // show ball
      c.beginPath(); c.fillStyle="#ffd35a"; c.arc(cup.x,cup.y+20,12,0,Lab.TAU); c.fill();
    }
    // cup
    c.fillStyle="#c0392b";
    c.beginPath(); c.moveTo(cup.x-40,cup.y+40); c.lineTo(cup.x+40,cup.y+40);
    c.lineTo(cup.x+30,cup.y- (phase==='reveal'?-20:40));
    c.lineTo(cup.x-30,cup.y- (phase==='reveal'?-20:40)); c.closePath(); c.fill();
  }
}
start();
</script></body></html>
