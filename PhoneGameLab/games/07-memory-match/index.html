<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Memory Match", instructions:"Flip 2 cards. Match pairs to clear.", restart:start});
let cards,cols,rows,cell,first,locked,timer,matches,total;
const ICONS=["🐶","🐱","🐭","🦊","🐻","🐸","🐵","🐔","🦄","🐙","🦋","🐢"];
function start(){
  matches=0; timer=0;
  cols=4; rows=4; total=cols*rows/2;
  const pool=ICONS.slice(0,total);
  const deck=[...pool,...pool].map(v=>({v,flip:0,done:false})).sort(()=>Math.random()-0.5);
  cards=deck; first=null; locked=false;
  cell=Math.min((Lab.W-30)/cols,(Lab.H-180)/rows);
  Lab.setScore("0/"+total);
  Lab.input.onTap=[(x,y)=>{
    if(locked) return;
    const ox=(Lab.W-cell*cols)/2, oy=100;
    const cx=Math.floor((x-ox)/cell), cy=Math.floor((y-oy)/cell);
    if(cx<0||cy<0||cx>=cols||cy>=rows) return;
    const i=cy*cols+cx, card=cards[i];
    if(card.done||card.flip>0.5) return;
    card.flip=1; Lab.beep(700,.05);
    if(!first){ first={i}; return; }
    if(first.i===i) return;
    locked=true;
    setTimeout(()=>{
      if(cards[first.i].v===card.v){ cards[first.i].done=true; card.done=true; matches++; Lab.setScore(matches+"/"+total); Lab.beep(1100,.08); if(matches===total){ Lab.win("Time: "+timer.toFixed(1)+"s"); } }
      else { cards[first.i].flip=0; card.flip=0; Lab.beep(200,.08); }
      first=null; locked=false;
    },550);
  }];
  Lab.loop(dt=>{
    timer+=dt;
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    const ox=(Lab.W-cell*cols)/2, oy=100;
    for(let i=0;i<cards.length;i++){
      const x=ox+(i%cols)*cell, y=oy+Math.floor(i/cols)*cell;
      const card=cards[i];
      c.fillStyle=card.done?"#1c2546":card.flip>0?"#fff":"#5af";
      c.fillRect(x+4,y+4,cell-8,cell-8);
      if(card.flip>0||card.done){
        c.fillStyle="#222"; c.font=Math.floor(cell*0.55)+"px sans-serif";
        c.textAlign="center"; c.textBaseline="middle";
        c.fillText(card.v, x+cell/2, y+cell/2);
      }
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center"; c.textBaseline="alphabetic";
    c.fillText("⏱ "+timer.toFixed(1)+"s", Lab.W/2, 70);
  });
}
start();
</script></body></html>
