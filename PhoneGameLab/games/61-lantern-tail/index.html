(function(){ "use strict";
/* LANTERN TAIL — a paper dragon threads a festival square at dusk, stringing up every lantern it passes.

 *         turn still saves you; drag-swipes (several turns per drag), tap-to-turn, arrows/WASD, Space to let go.

Lab.init({
  title: "Lantern Tail", tagline: "String them up. Let go before you tangle.", category: "Arcade & Action",
  howto: ["Swipe, tap or use arrows to steer", "Lanterns on your tail score nothing…", "…until you LET GO. Long tails pay more"],
  theme: { bg: "#1d1433", bg2: "#5a2d5e", accent: "#ffb347", accent2: "#ff6b4a" },
  orient: "any", music: { style: "funk", key: "B", bpm: 104, vol: .3 }, restart: start,

const { draw, fx } = Lab, TAU = Lab.TAU, PI = Math.PI;
const LCOL = ["#ff6b4a", "#ffb347", "#ff8fb1", "#ffd76a", "#c79bff", "#7fd8c8"], GOLD = "#fff0a8", GRACE = .15;

/* ------------------------------------------------------------------ layout */
function layout(fresh) {

  cell = Math.max(8, Math.min(Math.floor(aw / cols), Math.floor(ah / rows), 46)); ox = p.x + 14 + (aw - cols * cell) / 2; oy = p.y + 14 + (ah - rows * cell) / 2;

}
Lab.onResize(() => { if (body) layout(false); });
const px = c => ox + (c + .5) * cell, py = r => oy + (r + .5) * cell;

/* ------------------------------------------------------------------ rules */
function reset() {
  layout(true); const c0 = Math.floor(cols / 2) - 2, r0 = Math.floor(rows / 2);
  body = [{ c: c0, r: r0, pc: c0, pr: r0, col: "#e8452e" }]; dir = DIRS.right; queue = []; stepT = 0; graceT = 0; pending = 0; pickups = []; crates = []; sky = []; score = 0; banked = 0; night = 1; goal = 10; maxLen = 0; bestRel = 0;
  alive = true; dying = false; goldT = 9; tipped = 0; anchor = null; headAng = 0; pulse = 0; nightT = 0; lost = 0; colorI = 0; pendCol = []; spawn(false);
}
const speed = () => Math.min(9.5, 5.2 + (night - 1) * .45);
const crateAt = (c, r, any) => crates.some(k => k.c === c && k.r === r && (any || k.t >= 0));
function deadly(c, r) { if (c < 0 || r < 0 || c >= cols || r >= rows || crateAt(c, r)) return true; const n = body.length - (pending ? 0 : 1); for (let i = 1; i < n; i++) if (body[i].c === c && body[i].r === r) return true; return false; }
function freeCell(minD, inner) {

    if (Math.abs(c - h.c) + Math.abs(r - h.r) < (a < 200 ? minD : 1) || body.some(s => s.c === c && s.r === r) || crateAt(c, r, true) || pickups.some(q => q.c === c && q.r === r)) continue;

}
function spawn(gold) { const f = freeCell(3); if (!f) return; pickups.push({ c: f.c, r: f.r, gold, life: gold ? 7.5 : 1e9, t: 0, col: gold ? GOLD : LCOL[colorI++ % LCOL.length], drift: !gold && night >= 3 && Math.random() < .45 ? 1.6 : 0, hop: 0 }); if (gold && !demo) Lab.sfx("chime", { pitch: 1.3, vol: .6 }); }

}

  fx.burst(px(q.c), py(q.r), { n: q.gold ? 18 : 9, colors: [q.col, "#fff"], speed: 150, life: .45, size: 3, glow: 6 }); fx.ring(px(q.c), py(q.r), { r0: cell * .3, r1: cell * 1.1, color: q.col, life: .35, width: 3 });

}

/* ------------------------------------------------------------------ update */

/* ------------------------------------------------------------------ draw */
