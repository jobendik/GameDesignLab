<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cake Tower", instructions:"Tap to drop the swinging layer when it's centered.", restart:start});
let tower, swinger, t, level, score;
function start(){
  tower=[{x:Lab.W/2,y:Lab.H-80,w:160,h:30,hue:0}];
  swinger={x:0,y:Lab.H-110, w:160, h:30, dir:1, sp:220, hue:30};
  t=0; level=0; score=0; Lab.setScore(0);
  Lab.input.onTap=[()=>{
    const last=tower[tower.length-1];
    const overlap = Math.min(last.x+last.w/2, swinger.x+swinger.w/2) - Math.max(last.x-last.w/2, swinger.x-swinger.w/2);
    if(overlap<=0){ Lab.gameover({title:"Missed!",message:"Layers: "+(tower.length-1)}); return; }
    const ncx = (Math.max(last.x-last.w/2, swinger.x-swinger.w/2) + Math.min(last.x+last.w/2, swinger.x+swinger.w/2))/2;
    tower.push({x:ncx, y: last.y - last.h, w: overlap, h: 30, hue: swinger.hue});
    level++; score=tower.length-1; Lab.setScore(score); Lab.beep(900,.05);
    swinger={x:0, y: swinger.y-30, w:overlap, h:30, dir:1, sp:220+level*15, hue:(swinger.hue+40)%360};
    // scroll
    if(swinger.y<Lab.H*0.3){ const d=Lab.H*0.3-swinger.y; for(const t of tower) t.y+=d; swinger.y+=d;}
  }];
  Lab.loop(dt=>{
    swinger.x += swinger.dir*swinger.sp*dt;
    if(swinger.x-swinger.w/2<0){swinger.x=swinger.w/2; swinger.dir=1;}
    if(swinger.x+swinger.w/2>Lab.W){swinger.x=Lab.W-swinger.w/2; swinger.dir=-1;}
    const c=Lab.ctx; c.fillStyle="#161028"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const t of tower){ c.fillStyle=`hsl(${t.hue},80%,60%)`; c.fillRect(t.x-t.w/2, t.y-t.h, t.w, t.h);}
    c.fillStyle=`hsl(${swinger.hue},80%,60%)`; c.fillRect(swinger.x-swinger.w/2, swinger.y-swinger.h, swinger.w, swinger.h);
  });
}
start();
</script></body></html>
