<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Cave Flyer", instructions:"Drag up/down to fly. Don't touch the walls.", restart:start});
let cave, p, t, sp, score;
function start(){
  p={x:Lab.W*0.25,y:Lab.H/2,r:10};
  cave=[]; for(let i=0;i<Lab.W+40;i++){ cave.push({top:80, bot:Lab.H-80}); }
  t=0; sp=240; score=0; Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{ if(Lab.input.down) p.y=Lab.clamp(y, 20, Lab.H-20);}];
  Lab.loop(dt=>{
    t+=dt; sp=240+t*15; score=Math.floor(t*30); Lab.setScore(score);
    const shift=Math.floor(sp*dt);
    for(let i=0;i<shift;i++){
      cave.shift();
      const last=cave[cave.length-1] || {top:80,bot:Lab.H-80};
      let nt=last.top+Lab.rand(-4,4), nb=last.bot+Lab.rand(-4,4);
      const minGap = Math.max(80, 220 - t*4);
      if(nb-nt<minGap){ const mid=(nt+nb)/2; nt=mid-minGap/2; nb=mid+minGap/2; }
      nt=Lab.clamp(nt,20,Lab.H-100); nb=Lab.clamp(nb,nt+minGap,Lab.H-20);
      cave.push({top:nt, bot:nb});
    }
    const col=cave[Math.floor(p.x)] || {top:0,bot:Lab.H};
    if(p.y-p.r<col.top || p.y+p.r>col.bot){ Lab.gameover({title:"Crash",message:"Score: "+score}); return; }
    const c=Lab.ctx; c.fillStyle="#0c0a18"; c.fillRect(0,0,Lab.W,Lab.H);
    c.fillStyle="#322748"; c.beginPath(); c.moveTo(0,0);
    for(let x=0;x<cave.length && x<Lab.W;x++) c.lineTo(x, cave[x].top);
    c.lineTo(Lab.W,0); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(0,Lab.H);
    for(let x=0;x<cave.length && x<Lab.W;x++) c.lineTo(x, cave[x].bot);
    c.lineTo(Lab.W,Lab.H); c.closePath(); c.fill();
    c.beginPath(); c.fillStyle="#5af"; c.arc(p.x,p.y,p.r,0,Lab.TAU); c.fill();
  });
}
start();
</script></body></html>
