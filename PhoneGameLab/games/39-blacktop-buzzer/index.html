<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Blacktop Buzzer</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* BLACKTOP BUZZER — side-on street hoops under a lamp, against the clock.
 * Core idea kept: shoot into a hoop against a limit.  Now: pull back anywhere to aim (rubber-band slingshot), a dotted arc
 * that only shows the rise once the warm-up is over, real rim / backboard / chain-net physics (fixed 240 Hz step),
 * rapid fire with several balls in the air, and a clock that makes add to (swish +3 s).  Three makes in a row set the
 * ball ON FIRE: double points and the full arc.  Every four makes the court changes: deeper spots, a telescoping hoop
 * that bobs, gusting wind.  A ball still in the air at 0:00 can be a buzzer beater.
 * Identity: night asphalt, lamp cone with moths, chalk marks, orange leather, steel chain net that jingles.          */
let demo = false, demoT = 1;
Lab.init({
  title: "Blacktop Buzzer", tagline: "Night hoops against the clock.", category: "Arcade & Action",
  howto: ["Pull back anywhere, release to shoot", "Makes add time — a clean swish adds more", "3 in a row: ON FIRE, double points"],
  theme: { bg: "#11152b", bg2: "#2c2a4d", accent: "#ff7a2f", accent2: "#ffd36b" },
  orient: "any", music: { style: "drive", key: "G", bpm: 100, vol: .3 }, restart: start,
  attract(dt, t) {
    if (!demo) { demo = true; layout(); reset(); }
    if (held && (demoT -= dt) < 0) { demoT = 1.5; const v = solve(Lab.rand(1.02, 1.2)), k = Lab.rand(.97, 1.03); launch(v.vx * k, v.vy * k); }
    update(dt); render(t);
  },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp;
const G = 1500, STEP = 1 / 240, BR = 17, RIMW = 64, RIMR = 3.5, VMAX = 1400, HOLD_Y = -70, RIM_H = 300, START_T = 45, MAX_T = 60;
const LEVELS = ["", "Warm-up", "Deep spots · the arc hides", "The hoop bobs · less time back", "Wind picks up", "Faster hoop", "Gusts and a restless hoop"];
let S, u, WW, xoff, floorY, PMAX;
let hoop, balls, held, heldX, cool, time, score, makes, shots, streak, bestStreak, swishes, fire, level, wind, aim, kb, net, tNow, acc, ended, lastSec, fireLoop, moths, spotD, windShown;

const X = x => xoff + x * S, Y = y => floorY + y * S, tipY = () => (Lab.play.y + 96 * u) / Lab.H;
function layout() {
  const P = Lab.play;
  S = Math.min(Lab.W / 380, P.h / 520); u = clamp(S, .8, 1.35);
  WW = Math.min(Lab.W / S, 900); xoff = (Lab.W - WW * S) / 2; floorY = Lab.H - Lab.safe.bottom - 62 * u; PMAX = 150 * u;
  if (hoop) { hoop.x = WW - 44 - 5 - RIMW; hoop.bx = WW - 44; if (held) { spotD = clamp(spotD, 110, hoop.x - 46); held.tx = hoop.x - spotD; } }
}
Lab.onResize(() => { if (balls) layout(); });

function reset() {
  hoop = { x: 0, bx: 0, y: -RIM_H, amp: 0, sp: 0 }; balls = []; held = { x: 0, tx: 0, t: 1 }; spotD = 150;
  layout(); held.x = held.tx = hoop.x - spotD;
  cool = 0; time = START_T; score = 0; makes = 0; shots = 0; streak = 0; bestStreak = 0; swishes = 0; fire = false; level = 1; wind = 0; windShown = 0;
  aim = null; kb = null; net = { x: 0, vx: 0, y: 0, vy: 0 }; tNow = 0; acc = 0; ended = false; lastSec = 99;
  moths = Array.from({ length: 7 }, (_, i) => ({ a: i * 1.3, r: 18 + i * 7, s: 1.2 + (i % 3) * .7, p: i * 2.1 }));
}
function start() {
  demo = false; reset(); Lab.setScore(0);
  fireLoop = Lab.audio.loop({ noise: true, bp: 420, vol: 0 });
  Lab.input.onDown = [(x, y) => { if (!ended && time > 0) { aim = { sx: x, sy: y, cx: x, cy: y }; kb = null; } }];
  Lab.input.onMove = [(x, y) => { if (aim) { aim.cx = x; aim.cy = y; } }];
  Lab.input.onUp = [() => { if (!aim) return; const v = aimVel(); aim = null; if (v) launch(v.vx, v.vy); }];
  Lab.input.onKey = [k => {
    if (k === " " || k === "Enter") { if (!kb) kb = { ang: -1.15, pow: .78 }; const v = aimVel(); if (v) launch(v.vx, v.vy); }
    else if (k.indexOf("Arrow") === 0 && !kb) kb = { ang: -1.15, pow: .78 };
  }];
  Lab.expose({
    get score() { return score; }, get time() { return time; }, set time(v) { time = v; }, get makes() { return makes; }, get shots() { return shots; }, get streak() { return streak; },
    get fire() { return fire; }, get level() { return level; }, get balls() { return balls.length; }, get ready() { return !!held && cool <= 0 && held.t >= 1; }, get swishes() { return swishes; },
    get ended() { return ended; }, get wind() { return wind; },
    // the pull (screen px, from press point to release point) that would swish from the current spot; flat=true gives a hopeless airball
    pullFor(flat) { const v = flat ? { vx: 300, vy: -200 } : solve(1.12), sp = Math.hypot(v.vx, v.vy), len = sp / VMAX * PMAX; return { dx: -v.vx / sp * len, dy: -v.vy / sp * len }; },
  });
  Lab.loop(frame);
}

/* ---------- shooting ---------- */
function solve(T) {                                     // launch velocity that drops through the middle of the rim after T seconds
  const tx = hoop.x + RIMW / 2 - 2, hx = held ? held.tx : hoop.x - spotD;
  return { vx: (tx - hx) / T - .5 * wind * T, vy: (hoop.y - HOLD_Y - .5 * G * T * T) / T };
}
function aimVel() {
  if (kb) return { vx: Math.cos(kb.ang) * kb.pow * VMAX, vy: Math.sin(kb.ang) * kb.pow * VMAX };
  if (!aim) return null;
  const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy, len = Math.hypot(dx, dy); if (len < 14) return null;
  const p = Math.min(len, PMAX) / PMAX * VMAX; return { vx: dx / len * p, vy: dy / len * p };
}
function launch(vx, vy) {
  if (!held || cool > 0 || ended || (time <= 0 && !demo) || Lab.paused) return;
  const d = hoop.x - held.x;
  balls.push({ x: held.x, y: HOLD_Y, vx, vy, ang: 0, spin: -vx / BR * .6, touched: false, bank: false, scored: false, missed: false, floor: 0, dead: 0, deep: d > Math.max(180, .6 * (hoop.x - 46)), hot: fire, trail: [] });
  if (balls.length > 7) balls.shift();
  shots++; cool = .42; held = null; heldX = hoop.x - spotD;
  if (!demo) { Lab.sfx("whoosh", { pitch: .8 + Math.hypot(vx, vy) / VMAX * .6 }); Lab.buzz(8); }
}
function newSpot() {
  const dMax = hoop.x - 46, lo = 110, hi = level === 1 ? Math.min(190, dMax) : Math.min(dMax, lo + (dMax - lo) * Math.min(1, .5 + level * .14));
  let d = spotD; for (let i = 0; i < 8 && Math.abs(d - spotD) < 45; i++) d = Lab.rand(lo, hi);
  spotD = d; if (held) { held.tx = hoop.x - d; held.t = 0; held.x0 = held.x; }
  wind = level >= 4 ? (Lab.chance(.5) ? 1 : -1) * Lab.rand(90, level >= 6 ? 260 : 180) : 0;
}
function setLevel(n) {
  level = n; const k = Math.min(n, 9);
  hoop.amp = n >= 3 ? Math.min(62, 30 + (k - 3) * 8) : 0; hoop.sp = n >= 5 ? 1.9 + (k - 5) * .15 : 1.1;
  Lab.banner("LEVEL " + n, { color: "#ffd36b", ms: 900, y: .46 }); Lab.toast(LEVELS[Math.min(n, LEVELS.length - 1)], 1600, { y: tipY() }); Lab.sfx("levelup");
}
function scored(b) {
  b.scored = true; makes++; streak++; bestStreak = Math.max(bestStreak, streak);
  const sw = !b.touched, beater = time <= 0; if (sw) swishes++;
  let pts = (b.deep ? 3 : 2) + (sw ? 1 : 0) + (b.bank ? 1 : 0); if (b.hot) pts *= 2; if (beater) pts += 5;
  score += pts; if (!beater) time = Math.min(MAX_T, time + Math.max(1, (sw ? 3 : 2) - Math.floor((level - 1) / 2)));
  net.vy += 420 + b.vy * .3; net.vx += b.vx * .9; b.vx *= .3; b.vy *= .55;
  if (demo) return;
  Lab.setScore(score); Lab.bumpScore();
  const cx = X(hoop.x + RIMW / 2), cy = Y(hoop.y);
  fx.text(cx, cy - 46 * u, (beater ? "BUZZER BEATER" : sw ? "SWISH" : b.bank ? "BANK" : "IN") + "  +" + pts, { color: b.hot ? "#ff9a3c" : sw ? "#ffd36b" : "#fff", size: (sw ? 22 : 18) + (b.hot ? 4 : 0) });
  if (b.deep) fx.text(cx, cy - 72 * u, "DEEP", { color: "#8fd6ff", size: 14 });
  fx.burst(cx, cy + 22 * u, { n: sw ? 16 : 9, colors: b.hot ? ["#ff7a2f", "#ffd36b", "#fff"] : ["#dfe6f2", "#ffd36b"], speed: 190, angle: Math.PI / 2, spread: 1.6, life: .5, size: 3.5, gravity: 500, shape: sw ? "star" : "circle" });
  Lab.audio.noise({ dur: sw ? .26 : .16, vol: sw ? .16 : .1, hp: 4200 });
  [0, 1, 2].forEach(i => Lab.audio.tone({ f: 2100 + i * 520 + streak * 40, dur: .07, vol: .035, delay: i * .035, type: "triangle" }));
  Lab.audio.combo(Math.min(streak, 10) + (sw ? 2 : 0), { vol: .2 }); Lab.buzz(sw ? 18 : 10);
  if (sw) Lab.hitstop(.035); if (beater) { Lab.flash("#ffd36b", .4, .5); Lab.shake(10, .4); }
  if (streak >= 3 && !fire) { fire = true; Lab.banner("ON FIRE", { color: "#ff7a2f", ms: 900, y: .46 }); Lab.sfx("powerup"); Lab.flash("#ff7a2f", .3, .3); }
  const nl = 1 + Math.floor(makes / 4); if (nl > level) setLevel(nl);

}
function missed(b, why) {
  if (b.scored || b.missed) return; b.missed = true;
  if (demo) return;
  if (fire) { Lab.sfx("slide", { pitch: .6 }); Lab.toast("Fire's out", 700, { y: tipY() }); }
  streak = 0; fire = false;
  fx.text(clamp(X(b.x), 40, Lab.W - 40), Math.min(Y(b.y) - 24, floorY - 30), why || (b.touched ? "RIM OUT" : "AIRBALL"), { color: "#9aa3c4", size: 14 });
}

/* ---------- physics ---------- */
function hitCircle(b, px, py, r, e) {
  const dx = b.x - px, dy = b.y - py, rr = r + BR, d2 = dx * dx + dy * dy; if (d2 >= rr * rr) return 0;
  const d = Math.sqrt(d2) || .01, nx = dx / d, ny = dy / d; b.x = px + nx * rr; b.y = py + ny * rr;
  const vn = b.vx * nx + b.vy * ny; if (vn >= 0) return 0;

function stepBall(b, h) {

  const hy = hoop.y;

  if (s > 0) { b.touched = true; if (s > 60 && !demo) { Lab.sfx("knock", { pitch: 1.5, vol: Math.min(1, s / 500) }); Lab.audio.tone({ f: 660, f2: 600, dur: .14, vol: .07, type: "triangle" }); net.vx += b.vx * .2; fx.sparks(X(b.x), Y(b.y - BR * 0), 0, { n: 3, color: "#ffb37a" }); } }

    if (b.vy > 0) { if (b.vy > 140 && !demo) Lab.sfx("bounce", { pitch: .75, vol: Math.min(1, b.vy / 900) }); b.vy *= -.6; b.vx *= .82; b.spin = b.vx / BR; b.floor++; missed(b); }
  }

}

function frame(dt, t) { update(dt); render(t); }
function update(dt) {
  tNow += dt; cool -= dt;

  if (!held && cool <= 0 && (time > 0 || demo)) held = { x: heldX, tx: hoop.x - spotD, t: heldX === hoop.x - spotD ? 1 : 0, x0: heldX };
  if (held && held.t < 1) { held.t = Math.min(1, held.t + dt * 3.2); held.x = Lab.lerp(held.x0, held.tx, ease.outCubic(held.t)); }
  if (kb && !demo) { kb.ang = clamp(kb.ang + Lab.input.axisX() * dt * .9, -1.52, -.3); kb.pow = clamp(kb.pow - Lab.input.axisY() * dt * .35, .3, 1); }

  for (const b of balls) { if (b.floor > 0) b.dead += dt; if (b.hot && b.floor === 0 && !demo && !Lab.reducedMotion && Lab.chance(.6)) fx.burst(X(b.x), Y(b.y), { n: 1, colors: ["#ff7a2f", "#ffd36b", "#ff4f3a"], speed: 60, life: .35, size: 5, gravity: -300 }); b.trail.push(b.x, b.y); if (b.trail.length > 16) b.trail.splice(0, 2); }

/* ---------- drawing ---------- */
function backdrop() {
  const w = Lab.W + 80, h = Lab.H + 80, fy = floorY + 40;

    draw.vgrad(g, 0, 0, w, fy, [[0, "#0b0e22"], [.55, "#1b1f44"], [.86, "#3a3160"], [1, "#6a4763"]]);
    const r = Lab.rng(11);
    g.fillStyle = "#fff"; for (let i = 0; i < 46; i++) { g.globalAlpha = .15 + r() * .5; g.fillRect(r() * w, r() * fy * .6, 1.4, 1.4); } g.globalAlpha = 1;
    for (let layer = 0; layer < 2; layer++) {                                           // skyline
      let x = -10; g.fillStyle = layer ? "#161a36" : "#23244a";
      while (x < w) { const bw = (26 + r() * 46) * u, bh = (70 + r() * 150 - layer * 40) * u; g.fillRect(x, fy - bh, bw, bh);
        g.fillStyle = "rgba(255,211,107,.5)"; for (let wy = fy - bh + 8; wy < fy - 50 * u; wy += 13 * u) for (let wx = x + 5; wx < x + bw - 6; wx += 10 * u) if (r() < .16) g.fillRect(wx, wy, 4 * u, 5 * u);
        g.fillStyle = layer ? "#161a36" : "#23244a"; x += bw + r() * 8; }
    }
    const fh = 132 * u; g.save(); g.beginPath(); g.rect(0, fy - fh, w, fh); g.clip();           // chain-link fence
    g.strokeStyle = "rgba(170,180,215,.13)"; g.lineWidth = 1; g.beginPath();
    for (let x = -fh; x < w + fh; x += 12 * u) { g.moveTo(x, fy); g.lineTo(x + fh, fy - fh); g.moveTo(x, fy - fh); g.lineTo(x + fh, fy); } g.stroke(); g.restore();
    g.fillStyle = "#3c4160"; g.fillRect(0, fy - fh - 3, w, 4); for (let x = 30; x < w; x += 150 * u) g.fillRect(x, fy - fh, 4, fh);
    const lx = 40 + Lab.W * .34, ly = fy - 330 * u;                                           // street lamp + light cone
    const cone = g.createLinearGradient(0, ly, 0, fy); cone.addColorStop(0, "rgba(255,211,107,.26)"); cone.addColorStop(1, "rgba(255,211,107,.02)");
    g.fillStyle = cone; g.beginPath(); g.moveTo(lx - 12, ly); g.lineTo(lx + 12, ly); g.lineTo(lx + 190 * u, fy); g.lineTo(lx - 190 * u, fy); g.fill();
    g.fillStyle = "#0e1124"; g.fillRect(lx - 46 * u, ly - 12, 4, fy - ly + 12); g.fillRect(lx - 46 * u, ly - 14, 50 * u, 4); draw.rect(g, lx - 15, ly - 11, 30, 9, 4, "#0e1124");
    draw.glow(g, lx, ly, 60 * u, "#ffd36b", .55); draw.circle(g, lx, ly, 5, "#fff3c9");
    draw.vgrad(g, 0, fy, w, h - fy, ["#2b2f3d", "#1b1e29"]);                                  // asphalt
    for (let i = 0; i < 420; i++) { g.fillStyle = r() < .5 ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.14)"; g.fillRect(r() * w, fy + r() * (h - fy), 2, 1.4); }
    const pool = g.createRadialGradient(lx, fy + 22, 4, lx, fy + 22, 200 * u); pool.addColorStop(0, "rgba(255,211,107,.16)"); pool.addColorStop(1, "rgba(255,211,107,0)");
    g.fillStyle = pool; g.fillRect(0, fy, w, h - fy);
    g.fillStyle = "rgba(240,240,255,.4)"; g.fillRect(0, fy, w, 2.5);
  });
}
function ballSprite(r) {
  const sz = r * 2 + 4;

    const c = sz / 2, gr = g.createRadialGradient(c - r * .35, c - r * .4, r * .1, c, c, r); gr.addColorStop(0, "#ffb169"); gr.addColorStop(.55, "#f2752a"); gr.addColorStop(1, "#b9461a");

function drawBall(c, x, y, ang, sc, alpha) {

function render(t) {
  const c = Lab.ctx, bg = backdrop(), hy = hoop.y, P = Lab.play;
  c.drawImage(bg, -40, -40, bg.w, bg.h);
  const lx = Lab.W * .34, ly = floorY - 330 * u;                                             // moths in the lamp light
  c.fillStyle = "rgba(255,240,200,.8)"; for (const m of moths) { const a = t * m.s + m.p; c.fillRect(lx + Math.cos(a) * m.r * u, ly + 16 * u + Math.sin(a * 1.7) * m.r * .5 * u, 2, 2); }
  if (Math.abs(windShown) > 20) {                                                            // wind streaks
    c.strokeStyle = "rgba(200,215,255,.22)"; c.lineWidth = 1.5; c.lineCap = "round"; const dir = Math.sign(windShown), k = Math.abs(windShown) / 200;
    for (let i = 0; i < 9; i++) { const yy = P.y + 90 + (i * 97 % (floorY - P.y - 140)), xx = Lab.wrap(i * 173 + t * dir * (260 + i * 30) * k, -60, Lab.W + 60); c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx - dir * (26 + i * 3) * k * u, yy); c.stroke(); }
  }
  // chalk marks on the ground: shooting spot, deep line

  c.fillStyle = "rgba(143,214,255,.5)"; c.fillRect(X(0), floorY + 9 * u, X(dLine) - X(0), 3); draw.text(c, "+3", X(dLine) - 13 * u, floorY + 24 * u, { size: 12 * u, color: "rgba(143,214,255,.75)" });
  const hx = held ? held.x : heldX;
  if (hx != null) { c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 2.5; c.lineCap = "round"; const s = 8 * u, mx = X(hx), my = floorY + 10 * u; c.beginPath(); c.moveTo(mx - s, my - s * .4); c.lineTo(mx + s, my + s * .4); c.moveTo(mx + s, my - s * .4); c.lineTo(mx - s, my + s * .4); c.stroke(); }

  draw.shadow(c, px, floorY + 3, 30 * S, 5 * S, .35);

Lab.boot();
