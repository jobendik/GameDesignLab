<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Reaction Duel", instructions:"Tap the moment it turns GREEN. Don't tap early!", restart:start});
let phase, wait, best=Infinity, last=0;
function start(){
  phase='ready'; wait=Lab.rand(1.5,4); last=0;
  Lab.input.onTap=[()=>{
    if(phase==='ready'){ phase='fail'; Lab.toast("Too early!"); Lab.beep(100,.2,'sawtooth'); }
    else if(phase==='go'){
      const r=performance.now()-tStart;
      last=Math.round(r); if(r<best) best=r;
      phase='done'; Lab.toast(last+" ms");
    } else if(phase==='done'||phase==='fail'){
      phase='ready'; wait=Lab.rand(1.5,4);
    }
  }];
  let tStart=0;
  Lab.loop(dt=>{
    if(phase==='ready'){ wait-=dt; if(wait<=0){ phase='go'; tStart=performance.now(); Lab.beep(660,.05);} }
    const c=Lab.ctx, w=Lab.W, h=Lab.H;
    c.fillStyle = phase==='go'?'#3df58a':phase==='fail'?'#ff5577':phase==='done'?'#5af':'#aa2233';
    c.fillRect(0,0,w,h);
    c.fillStyle="#0b0f1a"; c.font="bold 38px sans-serif"; c.textAlign="center";
    const msg = phase==='ready'?"Wait...":phase==='go'?"TAP!":phase==='fail'?"Too early":(last+" ms");
    c.fillText(msg, w/2, h/2);
    c.font="16px sans-serif";
    c.fillText("Best: "+(best===Infinity?"-":best+" ms"), w/2, h/2+40);
    c.fillText("Tap to "+(phase==='done'||phase==='fail'?"retry":"play"), w/2, h-40);
  });
}
start();
</script></body></html>
