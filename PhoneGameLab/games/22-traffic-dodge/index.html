<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Traffic Dodge", instructions:"Drag left/right to steer.", restart:start});
let p,traffic,t,sp,spawn,road;
function start(){
  p={x:Lab.W/2,y:Lab.H-100,w:46,h:80};
  traffic=[]; t=0; sp=300; spawn=0; road={off:0};
  Lab.setScore(0);
  Lab.input.onMove=[(x)=>{ if(Lab.input.down) p.x=Lab.clamp(x, p.w/2+20, Lab.W-p.w/2-20);}];
  Lab.loop(dt=>{
    t+=dt; sp=300+t*15; spawn-=dt; road.off=(road.off+sp*dt)%40;
    if(spawn<=0){ spawn=Lab.rand(0.35,0.8); traffic.push({x:Lab.rand(40,Lab.W-40), y:-80, w:46,h:80, vy:sp*Lab.rand(0.5,0.8)});}
    for(const c of traffic) c.y+=c.vy*dt+sp*0.4*dt;
    traffic=traffic.filter(c=>c.y<Lab.H+80);
    for(const o of traffic){ if(Math.abs(o.x-p.x)<(o.w+p.w)/2-6 && Math.abs(o.y-p.y)<(o.h+p.h)/2-6){ Lab.gameover({title:"Crash",message:"Score: "+Math.floor(t*10)}); return;}}
    Lab.setScore(Math.floor(t*10));
    const c=Lab.ctx; c.fillStyle="#222"; c.fillRect(0,0,Lab.W,Lab.H);
    c.fillStyle="#888"; c.fillRect(20,0,12,Lab.H); c.fillRect(Lab.W-32,0,12,Lab.H);
    c.fillStyle="#fff"; for(let y=-40+road.off;y<Lab.H;y+=40) c.fillRect(Lab.W/2-3,y,6,20);
    c.fillStyle="#5af"; c.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);
    c.fillStyle="#fff"; c.fillRect(p.x-15,p.y-30,30,10); c.fillRect(p.x-15,p.y+20,30,10);
    for(const o of traffic){ c.fillStyle="#ff5577"; c.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);}
  });
}
start();
</script></body></html>
