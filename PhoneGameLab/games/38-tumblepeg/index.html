<title>Tumblepeg</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* TUMBLEPEG — a wind-up toy peg cabinet.  Core idea kept: drop a disc through a peg board into scoring cups.
 * Now a game of decisions: five marbles per round against a quota; glowing pegs multiply the marble that pings them;
 * three cabinet thumps per round nudge a falling marble; the fifth marble is golden (double).  Every round bolts a new
 * gadget onto the board (rubber bumpers, a roaming catcher cup, a spinner, a sliding row, carousel cups).
 * Physics: one deterministic fixed-step (240 Hz) world; the same step() runs dry for the aim preview and the tests.
 * Identity: peach-and-denim toy machine, cream pegs that ring like a kalimba (pitch = column), bouncy music.      */
let demo = false;
Lab.init({
  title: "Tumblepeg", tagline: "Drop, thump and ping past the quota.", category: "Stack & Physics",
  howto: ["Drag to aim the chute, release to drop", "Tap left or right to nudge a falling marble", "Glowing pegs multiply. Beat the quota!"],
  theme: { bg: "#ffd3c2", bg2: "#fff1e6", fg: "#27405f", muted: "#7c8aa0", accent: "#ff5d73", accent2: "#2fbf9b", light: true },
  orient: "portrait", music: { style: "bounce", key: "C", bpm: 104, vol: .34 }, restart: start,
  attract(dt, t) { if (!demo) { demo = true; layout(); reset(); buildRound(4); } update(dt); render(t); },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp;
const BW = 368, BH = 640, MR = 8.5, PR = 4.5, G = 1150, STEP = 1 / 240, ROWS = 10, ROW0 = 100, ROWH = 44, COL = 46;
const CUP_Y = 532, SLOT_TOP = 566, SLOT_Y = 598, NS = 7, SW = BW / NS, DROP_Y = 44, PER = 5, HEAD = 60;
const NOTES = ["C5", "D5", "E5", "G5", "A5", "C6", "D6", "E6", "G6"];
const INK = "#27405f", CREAM = "#fff6e6";
const slotCol = v => v >= 100 ? "#ff5d73" : v >= 60 ? "#ff9a4d" : v >= 40 ? "#f5c02e" : v >= 20 ? "#2fbf9b" : v > 0 ? "#5aaee6" : "#8b97ad";
const GADGET = { bump: "Rubber bumpers", cup: "Catcher cup", spin: "Spinner", slide: "Sliding row", carousel: "Carousel cups" };
const FIXED = [
  { slots: [10, 20, 40, 80, 40, 20, 10], quota: 150, mods: [] },
  { slots: [40, 10, 20, 60, 20, 10, 40], quota: 220, mods: ["bump"] },
  { slots: [80, 20, 10, 40, 10, 20, 80], quota: 300, mods: ["bump", "cup"] },
  { slots: [20, 60, 0, 100, 0, 60, 20], quota: 330, mods: ["spin", "cup"] },
  { slots: [100, 0, 40, 20, 40, 0, 100], quota: 400, mods: ["slide", "bump", "carousel"] },
];
let S, ox, oy;
let circ, spin, cup, slots, mods, marble, sink, round, roundScore, quota, left, nudges, score, state, stateT, aimX, aimShown, dragging;
let wt, acc, tNow, bestDrop, pings, catches, trail, kick, nudgeCool, demoT, metT, shiftA, pipFlash;

const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.min(i, Math.floor(Lab.rand(0, i + 1))); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const X = x => ox + x * S, Y = y => oy + y * S;
function layout() {
  const P = Lab.play, total = HEAD + BH + 24;
  S = Math.min(Lab.W / (BW + 28), (P.h - 6) / total);
  ox = (Lab.W - BW * S) / 2; oy = P.y + HEAD * S + Math.max(3, (P.h - total * S) / 2);
}
Lab.onResize(() => { if (circ) layout(); });

function roundCfg(n) {
  if (n <= FIXED.length) return FIXED[n - 1];
  return { slots: shuf([120, 80, 40, 40, 20, 10, 0]), quota: 420 + (n - 6) * 30, mods: shuf(["bump", "cup", "spin", "slide", "carousel"]).slice(0, n > 8 ? 4 : 3) };
}
function reset() {
  score = 0; bestDrop = 0; pings = 0; catches = 0; wt = 0; acc = 0; tNow = 0; kick = 0; nudgeCool = 0; demoT = .6; metT = 0; shiftA = 0; pipFlash = 0;
  marble = null; sink = null; trail = []; dragging = false; aimX = aimShown = BW / 2; state = "aim"; stateT = 0;
}
function start() {
  demo = false; layout(); reset(); buildRound(1);
  Lab.setScore(0);
  Lab.input.onDown = [x => { if (state === "aim") { dragging = true; aimX = clamp((x - ox) / S, MR + 3, BW - MR - 3); } else if (state === "fall") nudge(x < Lab.W / 2 ? -1 : 1); }];
  Lab.input.onMove = [x => { if (dragging && state === "aim") aimX = clamp((x - ox) / S, MR + 3, BW - MR - 3); }];
  Lab.input.onUp = [() => { if (dragging) { dragging = false; drop(); } }];
  Lab.input.onKey = [k => {
    if (k === " " || k === "Enter" || k === "ArrowDown") drop();
    else if (state === "fall" && (k === "ArrowLeft" || k === "a")) nudge(-1);
    else if (state === "fall" && (k === "ArrowRight" || k === "d")) nudge(1);
  }];
  Lab.expose({
    get score() { return score; }, get round() { return round; }, get roundScore() { return roundScore; }, get quota() { return quota; },
    get left() { return left; }, get nudges() { return nudges; }, get state() { return state; }, get marble() { return marble; }, get slots() { return slots.map(s => s.v); },
    get aim() { return aimX; }, get lit() { return circ.filter(p => p.lit).length; }, get mods() { return mods; },
    dry, sx: x => X(x), dropY: () => Y(DROP_Y), BW, loadRound(n) { buildRound(n); state = "aim"; marble = null; },
  });
  Lab.banner("ROUND 1", { color: "#ff5d73", ms: 900, y: .4 });
  Lab.loop(frame);
}

function buildRound(n) {
  const cfg = roundCfg(n), has = m => cfg.mods.indexOf(m) >= 0;
  round = n; quota = cfg.quota; roundScore = 0; left = PER; nudges = 3; mods = cfg.mods; metT = 0;
  slots = cfg.slots.map(v => ({ v, flash: 0 }));
  circ = []; spin = null; cup = null;
  const slideRow = has("slide") ? 8 : -1, sp = has("spin") ? { r: 4, i: 4 } : null;
  const bumps = has("bump") ? (n % 2 ? [[3, 2], [3, 5], [7, 4]] : [[2, 2], [2, 6], [6, 4]]) : [];
  for (let r = 0; r < ROWS; r++) {
    const y = ROW0 + r * ROWH;
    const add = (x, i, wall) => {
      if (sp && r === sp.r && Math.abs(i - sp.i) <= 1) return;
      const b = !wall && bumps.some(q => q[0] === r && q[1] === i);
      circ.push({ bx: x, y, r: b ? 15 : PR, row: r, col: i, kind: b ? "bump" : "peg", wall: !!wall, slide: r === slideRow, lit: false, pulse: 0 });
    };
    if (r % 2 === 0) for (let i = 1; i <= 7; i++) add(COL * i, i);
    else for (let i = 0; i <= 7; i++) add(23 + COL * i, i);
  }
  for (let k = 1; k < NS; k++) circ.push({ bx: k * SW, y: SLOT_TOP, r: 3, kind: "div", row: 99, col: k, pulse: 0 });
  if (sp) spin = { x: COL * 4, y: ROW0 + 4 * ROWH, len: 22, w: n % 2 ? 2 : -2, kick: 0 };
  if (has("cup")) cup = { w: 24, ph: Lab.rand(0, TAU), pulse: 0 };

}
function relight() {
  const want = round >= 6 ? 4 : 3, cand = shuf(circ.filter(p => p.kind === "peg" && !p.lit && p.row >= 1));
  let cur = circ.filter(p => p.lit).length;
  if (!circ.some(p => p.lit && p.row <= 3)) { const hi = cand.findIndex(p => p.row <= 3); if (hi >= 0) { cand.splice(hi, 1)[0].lit = true; cur++; } }   // one glow peg is always within aiming reach
  while (cur < want && cand.length) { cand.pop().lit = true; cur++; }
}
const cupX = t => BW / 2 + (BW / 2 - 36) * Math.sin(t * .8 + cup.ph);
const mkMarble = x => ({ x, y: DROP_Y, vx: 0, vy: 40, ang: 0, mult: 1, bumps: 0, slot: -1, caught: false, gold: false, pop: 0, still: 0 });

/* ---------- physics: one marble against circles, cup dividers, the spinner; ev(kind, marble, impact, thing) or null ---------- */
function step(m, h, t, ev) {

  if (m.x < MR) { m.x = MR; if (m.vx < 0) { if (ev) ev("wall", m, -m.vx); m.vx *= -.5; } }
  if (m.x > BW - MR) { m.x = BW - MR; if (m.vx > 0) { if (ev) ev("wall", m, m.vx); m.vx *= -.5; } }
  const so = 20 * Math.sin(t * 1.4), sv = 28 * Math.cos(t * 1.4);
  for (let i = 0; i < circ.length; i++) {
    const p = circ[i], dy = m.y - p.y, rr = p.r + MR; if (dy > rr || dy < -rr) continue;
    const px = p.slide ? p.bx + so : p.bx, dx = m.x - px; if (dx > rr || dx < -rr) continue;
    const d2 = dx * dx + dy * dy; if (d2 >= rr * rr) continue;
    const d = Math.sqrt(d2); let nx = d > .001 ? dx / d : 0, ny = d > .001 ? dy / d : -1;
    if (ny < 0 && nx > -.04 && nx < .04) { nx = (p.col + p.row) % 2 ? .04 : -.04; }      // never balance dead-centre on a peg
    m.x = px + nx * rr; m.y = p.y + ny * rr;
    const pvx = p.slide ? sv : 0, vn = (m.vx - pvx) * nx + m.vy * ny;
    if (vn < 0) {
      const e = p.kind === "bump" ? .9 : p.kind === "div" ? .3 : .42;
      m.vx -= (1 + e) * vn * nx; m.vy -= (1 + e) * vn * ny;
      if (p.kind === "bump") { const out = (m.vx - pvx) * nx + m.vy * ny; if (out < 300) { m.vx += (300 - out) * nx; m.vy += (300 - out) * ny; } }
      if (ev) ev(p.kind, m, -vn, p);
    }
  }
  if (m.y > SLOT_TOP) for (let k = 1; k < NS; k++) {                                     // cup dividers (4 wide)
    const dx = m.x - k * SW; if (dx <= -(MR + 2) || dx >= MR + 2) continue;
    if (dx > 0) { m.x = k * SW + MR + 2; if (m.vx < 0) m.vx *= -.35; } else { m.x = k * SW - MR - 2; if (m.vx > 0) m.vx *= -.35; }

      const dx = rx - qx, dy = ry - qy, d = Math.hypot(dx, dy), rr = MR + 3.5;

}
/* dry run of a drop from x with the current board (used by tests and for tuning): where it ends up and what it earns */
function dry(x) {
  const m = mkMarble(clamp(x, MR + 3, BW - MR - 3)), seen = new Set(); let t = wt, pts = 0;
  const ev = (k, mm, s, p) => { if (k === "peg" && p.lit && !seen.has(p)) { seen.add(p); m.mult = Math.min(5, m.mult + 1); } else if (k === "bump" && s >= 30 && m.bumps < 8) { m.bumps++; pts += 5 * m.mult; } };

}

function drop() {

  marble = mkMarble(aimX); marble.gold = left === 1; aimShown = aimX; trail = [];
  state = "fall"; if (!demo) { Lab.sfx("drop", { pitch: marble.gold ? 1.5 : 1.15 }); Lab.buzz(6); }
}
function nudge(dir) {
  if (state !== "fall" || !marble || nudgeCool > 0) return;

  nudges--; nudgeCool = .22; kick = dir; pipFlash = 1;

  fx.burst(X(marble.x - dir * 8), Y(marble.y), { n: 6, color: CREAM, speed: 140, angle: dir > 0 ? Math.PI : 0, spread: .9, life: .3, size: 3 });

}
function gain(n, x, y, label, col) {
  const before = roundScore; roundScore += n; score += n;

  Lab.setScore(score);
  if (n > 0) fx.text(X(x), Y(y), label || "+" + n, { color: col || INK, size: 15 + Math.min(13, n / 22) });

}
function liveEv(kind, m, s, p) {
  if (demo) { if (p && kind !== "spin") { p.pulse = 1; if (p.lit) { p.lit = false; m.mult++; } } return; }
  if (kind === "wall") { if (s > 80) Lab.sfx("tick", { pitch: .8, vol: .5 }); return; }
  if (kind === "spin") { if (s > 60) { Lab.sfx("knock", { pitch: 1.3, vol: .6 }); p.kick = 1; } return; }
  if (kind === "div") { if (s > 70) Lab.sfx("tick", { pitch: 1.25, vol: .6 }); return; }
  if (kind === "bump") {
    if (s < 30) return; p.pulse = 1;
    Lab.sfx("boing", { pitch: 1.1 + m.bumps * .07 }); fx.ring(X(p.bx), Y(p.y), { r0: 12 * S, r1: 30 * S, color: "#2fbf9b", width: 4, life: .3 });
    if (m.bumps < 8) { m.bumps++; gain(5 * m.mult * (m.gold ? 2 : 1), p.bx, p.y - 20, null, "#1f9478"); }
    return;
  }
  if (p.lit) {
    p.lit = false; p.pulse = 1; m.mult = Math.min(5, m.mult + 1); m.pop = 1; pings++;
    Lab.audio.combo(m.mult * 2, { vol: .26 }); Lab.sfx("gem", { pitch: .8 + m.mult * .12, vol: .7 }); Lab.buzz(8); Lab.hitstop(.03);

    fx.burst(X(px), Y(p.y), { n: 12, colors: ["#ffd24d", "#fff", "#ff9a4d"], speed: 190, life: .5, size: 4, shape: "star", gravity: 200 });
    fx.ring(X(px), Y(p.y), { r0: 6, r1: 34 * S, color: "#ffd24d", width: 4, life: .35 });
    fx.text(X(px), Y(p.y - 18), "×" + m.mult, { color: "#e58a00", size: 20 + m.mult * 2 });
  } else if (s > 45) {
    p.pulse = Math.min(1, s / 420); pings++;

  }
}
function land() {
  const m = marble, g = m.gold ? 2 : 1; let pts;

    gain(pts, m.x, CUP_Y - 22, "CAUGHT +" + pts, "#e58a00");
    if (!demo) { Lab.sfx("powerup"); Lab.toast("Marble back!", 800, { y: .16 }); fx.burst(X(m.x), Y(CUP_Y), { n: 14, colors: ["#ffd24d", "#fff"], speed: 200, life: .5, shape: "star" }); }
  } else {
    const s = slots[m.slot], cx = (m.slot + .5) * SW; pts = s.v * m.mult * g; s.flash = 1; left--;

    gain(pts, cx, SLOT_TOP - 16, pts ? "+" + pts + (m.mult > 1 || g > 1 ? "  ×" + m.mult * g : "") : "dud", pts ? slotCol(s.v) === "#f5c02e" ? "#c98f00" : slotCol(s.v) : "#8b97ad");
    if (!demo) {
      if (pts === 0) Lab.sfx("thud", { pitch: .7 });
      else { Lab.sfx("coin", { pitch: .7 + Math.min(1.1, pts / 300) }); fx.burst(X(cx), Y(SLOT_TOP + 8), { n: 6 + Math.min(26, pts / 14), colors: [slotCol(s.v), "#fff", "#ffd24d"], speed: 160 + Math.min(260, pts), angle: -Math.PI / 2, spread: 1.3, life: .6, size: 4, gravity: 500 }); }
      if (pts >= 160) { Lab.shake(Math.min(12, 4 + pts / 60), .3); Lab.hitstop(.05); Lab.flash("#fff6e6", .2, .35); Lab.buzz(20); }

function afterSettle() {

  if (roundScore >= quota) {
    state = "clear"; stateT = 1.7; Lab.sfx("levelup"); Lab.banner("ROUND CLEAR", { color: "#2fbf9b", ms: 1100, y: .4 });
    fx.burst(Lab.W / 2, Y(BH * .45), { n: 40, colors: ["#ff5d73", "#ffd24d", "#2fbf9b", "#5aaee6"], speed: 420, life: 1, size: 5, gravity: 500, shape: "square" });
  } else {
    state = "over"; Lab.shake(8, .4);

function nextRound() {

  const fresh = round <= FIXED.length ? mods.filter(m => FIXED.slice(0, round - 1).every(f => f.mods.indexOf(m) < 0)) : [];
  if (fresh.length) Lab.toast("New: " + fresh.map(m => GADGET[m]).join(" + "), 1700, { y: .16 });

function frame(dt, t) { update(dt); render(t); }
function update(dt) {

  const k = Lab.input.axisX(); if (state === "aim" && k && !demo) aimX = clamp(aimX + k * 250 * dt, MR + 3, BW - MR - 3);
  if (demo && state === "aim" && (demoT -= dt) < 0) { demoT = .5; aimX = Lab.rand(30, BW - 30); drop(); }
  aimShown = Lab.damp(aimShown, aimX, 26, dt);
  acc = Math.min(acc + dt, .06);

  }

    if (m.still > .9) { m.still = 0; m.vx += (m.x < BW / 2 ? 1 : -1) * 130; m.vy -= 170; }
  }
  for (const p of circ) p.pulse = Math.max(0, p.pulse - dt * 4.5);
  for (const s of slots) s.flash = Math.max(0, s.flash - dt * 2.2);

/* ---------- drawing ---------- */
function backdrop() {
  const w = Lab.W + 80, h = Lab.H + 80;
  return Lab.sprite("tp:bg:" + Lab.W + "x" + Lab.H, w, h, g => {
    draw.vgrad(g, 0, 0, w, h, ["#fff1e6", "#ffd9c9", "#ffc4b4"]);
    const r = Lab.rng(5); g.fillStyle = "rgba(255,255,255,.34)";
    for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(r() * w, r() * h, 10 + r() * 46, 0, TAU); g.fill(); }
    g.fillStyle = "rgba(255,93,115,.07)"; for (let i = 0; i < 12; i++) { g.beginPath(); g.arc(r() * w, r() * h, 20 + r() * 60, 0, TAU); g.fill(); }
  });
}
function boardSprite() {
  const pad = 22, w = (BW + pad * 2) * S, h = (BH + pad * 2) * S;
  return Lab.sprite("tp:board:" + S.toFixed(3), w, h, g => {
    g.scale(S, S); g.translate(pad, pad);
