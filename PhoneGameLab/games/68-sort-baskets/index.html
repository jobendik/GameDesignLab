<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sort Baskets", instructions:"Items fall from top. Tap a basket to swap to the matching color.", restart:start});
const COLORS=["#e74","#69d","#7c6","#fc4"];
let items, baskets, score, miss, t, sp;
function start(){
  items=[]; baskets=COLORS.slice(); score=0; miss=0; t=0; sp=120; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ if(y<Lab.H-100) return;
    const bw=Lab.W/4; const idx=Math.floor(x/bw); if(idx<0||idx>=4) return;
    // swap with next
    [baskets[idx], baskets[(idx+1)%4]] = [baskets[(idx+1)%4], baskets[idx]];
    Lab.beep(500,.04);
  }];
  Lab.loop(dt=>{ t+=dt;
    if(t>0.8){ t=0; items.push({x:Lab.rand(30,Lab.W-30), y:0, c:Lab.randInt(0,3), vy:sp+Math.random()*40});}
    for(const it of items){ it.y+=it.vy*dt;
      if(it.y>Lab.H-100){ const idx=Math.floor(it.x/(Lab.W/4)); const targetColor=baskets[idx];
        if(targetColor===COLORS[it.c]){ score++; Lab.setScore(score); Lab.beep(800,.05);}
        else { miss++; if(miss>=5){ Lab.gameover({title:"Too many misses",message:"Sorted: "+score}); return;}}
        it.dead=true;
      }
    }
    items=items.filter(it=>!it.dead);
    sp+=2*dt;
    draw();
  });
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  for(const it of items){ c.beginPath(); c.fillStyle=COLORS[it.c]; c.arc(it.x,it.y,14,0,Lab.TAU); c.fill();}
  const bw=Lab.W/4;
  for(let i=0;i<4;i++){ c.fillStyle=baskets[i]; c.fillRect(i*bw+4, Lab.H-90, bw-8, 80);}
  c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText("Misses: "+miss+"/5", Lab.W/2, 120);
}
start();
</script></body></html>
