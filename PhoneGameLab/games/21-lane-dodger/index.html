<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Lane Dodger", instructions:"Swipe ← / → to switch lanes.", restart:start});
let lanes=3, lane=1, obs, t, spawn, sp, score;
function laneX(i){ const w=Lab.W/lanes; return w*i+w/2; }
function start(){
  lane=1; obs=[]; t=0; spawn=0; sp=320; score=0; Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{ if(Math.abs(dx)>Math.abs(dy)){ if(dx<0) lane=Math.max(0,lane-1); else lane=Math.min(lanes-1,lane+1);} }];
  Lab.input.onTap=[(x)=>{ if(x<Lab.W/2) lane=Math.max(0,lane-1); else lane=Math.min(lanes-1,lane+1);}];
  Lab.loop(dt=>{
    t+=dt; sp=320+t*10; spawn-=dt;
    if(spawn<=0){ spawn=Lab.rand(0.5,1.0); const ln=Lab.randInt(0,lanes-1); obs.push({x:laneX(ln),y:-60,w:60,h:80, kind:Math.random()<0.2?'coin':'rock'}); }
    for(const o of obs){ o.y+=sp*dt;}
    obs=obs.filter(o=>o.y<Lab.H+80);
    const px=laneX(lane), py=Lab.H-100;
    for(let i=obs.length-1;i>=0;i--){ const o=obs[i];
      if(Math.abs(o.x-px)<50 && Math.abs(o.y-py)<60){
        if(o.kind==='coin'){ obs.splice(i,1); score+=5; Lab.setScore(score); Lab.beep(900,.05);}
        else { Lab.gameover({title:"Crash",message:"Score: "+score}); return; }
      }
    }
    score+=dt*10; Lab.setScore(Math.floor(score));
    const c=Lab.ctx; c.fillStyle="#1a1426"; c.fillRect(0,0,Lab.W,Lab.H);
    c.strokeStyle="#444"; c.setLineDash([20,20]); c.lineWidth=2;
    for(let i=1;i<lanes;i++){ c.beginPath(); c.moveTo(i*Lab.W/lanes,0); c.lineTo(i*Lab.W/lanes,Lab.H); c.stroke();}
    c.setLineDash([]);
    for(const o of obs){
      if(o.kind==='coin'){ c.beginPath(); c.fillStyle="#ffd35a"; c.arc(o.x,o.y,18,0,Lab.TAU); c.fill();}
      else { c.fillStyle="#ff5577"; c.fillRect(o.x-30,o.y-40,60,80);}
    }
    c.fillStyle="#5af"; c.fillRect(px-25,py-40,50,80);
  });
}
start();
</script></body></html>
