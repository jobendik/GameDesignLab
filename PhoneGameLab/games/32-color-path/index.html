<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Color Path", instructions:"Tap to switch color. Only step on tiles matching your color.", restart:start});
let tiles, lane, t, sp, color, COLORS;
function start(){
  COLORS=["#ff5577","#5af","#3df58a","#ffd35a"];
  color=0; lane=1;
  tiles=[]; let y=Lab.H;
  while(y>-200){ tiles.push({y, color:Lab.randInt(0,COLORS.length-1)}); y-=60; }
  t=0; sp=240;
  Lab.setScore(0);
  Lab.input.onTap=[()=>{ color=(color+1)%COLORS.length; Lab.beep(700,.04);}];
  Lab.loop(dt=>{
    t+=dt; sp=240+t*8;
    for(const tt of tiles) tt.y+=sp*dt;
    while(tiles[0] && tiles[0].y>Lab.H){ tiles.shift();
      const min=Math.min(...tiles.map(t=>t.y));
      tiles.push({y:min-60, color:Lab.randInt(0,COLORS.length-1)});
    }
    // player at fixed y
    const py = Lab.H-160;
    for(const tt of tiles){
      if(Math.abs(tt.y-py)<25 && !tt.checked){
        tt.checked=true;
        if(tt.color!==color){ Lab.gameover({title:"Wrong color!",message:"Distance: "+Math.floor(t*sp/20)}); return; }
        else { Lab.beep(900,.04); Lab.setScore(Math.floor(t*10));}
      }
    }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const tt of tiles){ c.fillStyle=COLORS[tt.color]; c.fillRect(Lab.W*0.2, tt.y-25, Lab.W*0.6, 50);}
    c.fillStyle=COLORS[color]; c.fillRect(Lab.W*0.5-22, py-30, 44, 60);
    c.strokeStyle="#fff"; c.strokeRect(Lab.W*0.5-22, py-30, 44, 60);
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Tap to change color", Lab.W/2, 70);
  });
}
start();
</script></body></html>
