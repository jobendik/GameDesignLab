<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Odd One Out", instructions:"Tap the face whose expression is different.", restart:start});
let faces,size,cell,oddIdx,score,timeLeft;
const norm="😀", odds=["😁","🙂","😃","😄","😉","🙃"];
function round(){
  size=3+Math.min(4,Math.floor(score/3));
  cell=Math.min((Lab.W-40)/size,(Lab.H-200)/size);
  oddIdx=Lab.randInt(0,size*size-1);
  const oddFace=Lab.choose(odds);
  faces=[]; for(let i=0;i<size*size;i++) faces.push(i===oddIdx?oddFace:norm);
}
function start(){
  score=0; timeLeft=45; Lab.setScore(0); round();
  Lab.input.onTap=[(x,y)=>{
    const ox=(Lab.W-cell*size)/2, oy=100;
    const cx=Math.floor((x-ox)/cell), cy=Math.floor((y-oy)/cell);
    if(cx<0||cy<0||cx>=size||cy>=size) return;
    const i=cy*size+cx;
    if(i===oddIdx){ score++; Lab.setScore(score); Lab.beep(900,.05); round(); }
    else { timeLeft-=3; Lab.beep(160,.1,'sawtooth'); Lab.toast("-3s"); }
  }];
  Lab.loop(dt=>{
    timeLeft-=dt; if(timeLeft<=0){ Lab.gameover({title:"Time!",message:"Found "+score}); return; }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    const ox=(Lab.W-cell*size)/2, oy=100;
    c.font=Math.floor(cell*0.7)+"px sans-serif"; c.textAlign="center"; c.textBaseline="middle";
    for(let i=0;i<faces.length;i++){
      const x=ox+(i%size)*cell+cell/2, y=oy+Math.floor(i/size)*cell+cell/2;
      c.fillStyle="#162043"; c.fillRect(ox+(i%size)*cell+3, oy+Math.floor(i/size)*cell+3, cell-6, cell-6);
      c.fillStyle="#fff"; c.fillText(faces[i], x, y);
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center"; c.textBaseline="alphabetic";
    c.fillText("⏱ "+timeLeft.toFixed(1)+"s", Lab.W/2, 70);
  });
}
start();
</script></body></html>
