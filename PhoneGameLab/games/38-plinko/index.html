<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Plinko", instructions:"Tap top to drop ball. Aim for big multipliers.", restart:start});
let pegs, balls, slots, balance;
function start(){
  pegs=[]; balls=[]; balance=100; Lab.setScore(100);
  const rows=10; const top=120, gap=Math.min(36,(Lab.W-40)/(rows+2));
  for(let r=0;r<rows;r++){
    const y=top+r*gap;
    const n=r+3;
    for(let i=0;i<n;i++){
      const x=(Lab.W-gap*(n-1))/2 + i*gap;
      pegs.push({x,y});
    }
  }
  slots=[];
  const sn=8, sw=Lab.W/sn;
  const mults=[10,3,1,0.5,0.5,1,3,10];
  for(let i=0;i<sn;i++){ slots.push({x:i*sw, w:sw, mult:mults[i]});}
  Lab.input.onTap=[(x,y)=>{
    if(balance<10) return;
    balance-=10; Lab.setScore(balance.toFixed(0));
    balls.push({x:Lab.clamp(x,20,Lab.W-20), y:80, vx:Lab.rand(-30,30), vy:0, r:8});
  }];
  Lab.loop(dt=>{
    for(const b of balls){ b.vy+=600*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
      for(const p of pegs){ const dx=b.x-p.x, dy=b.y-p.y, d=Math.hypot(dx,dy);
        if(d<b.r+5){
          const nx=dx/d, ny=dy/d;
          b.x=p.x+nx*(b.r+5); b.y=p.y+ny*(b.r+5);
          const dot=b.vx*nx+b.vy*ny;
          b.vx-=2*dot*nx; b.vy-=2*dot*ny;
          b.vx*=0.5; b.vy*=0.5;
          b.vx+=Lab.rand(-30,30);
        }
      }
      if(b.x<10){b.x=10;b.vx*=-0.5;} if(b.x>Lab.W-10){b.x=Lab.W-10;b.vx*=-0.5;}
    }
    for(let i=balls.length-1;i>=0;i--){ const b=balls[i];
      if(b.y>Lab.H-40){ for(const s of slots){ if(b.x>=s.x && b.x<s.x+s.w){ const win=Math.round(10*s.mult); balance+=win; Lab.setScore(balance.toFixed(0)); Lab.toast("+"+win); Lab.beep(700+s.mult*50,.06); break;}} balls.splice(i,1);}
    }
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const p of pegs){ c.beginPath(); c.fillStyle="#fff"; c.arc(p.x,p.y,4,0,Lab.TAU); c.fill();}
    for(const s of slots){
      c.fillStyle=s.mult>=5?"#ff5577":s.mult>=2?"#ffd35a":"#1c2546";
      c.fillRect(s.x+2,Lab.H-40,s.w-4,40);
      c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center"; c.fillText(s.mult+"x", s.x+s.w/2, Lab.H-15);
    }
    for(const b of balls){ c.beginPath(); c.fillStyle="#ffd35a"; c.arc(b.x,b.y,b.r,0,Lab.TAU); c.fill();}
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Tap to drop (10 coins). Balance: "+balance.toFixed(0), Lab.W/2, 70);
  });
}
start();
</script></body></html>
