<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Connect Dots", instructions:"Drag through same-color dots (orthogonal) to score.", restart:start});
let g, path, dragging, score, COLS=6, ROWS=8, COLORS=["#e74","#e6c","#7c6","#69d","#fc4"];
function start(){
  g=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Lab.randInt(0,4)));
  path=[]; dragging=false; score=0; Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{ const c=pick(x,y); if(c){ path=[c]; dragging=true;}}];
  Lab.input.onMove=[(x,y)=>{ if(!dragging) return; const c=pick(x,y); if(!c) return;
    const last=path[path.length-1]; if(last.r===c.r && last.c===c.c) return;
    if(path.length>=2 && path[path.length-2].r===c.r && path[path.length-2].c===c.c){ path.pop(); return;}
    if(Math.abs(c.r-last.r)+Math.abs(c.c-last.c)!==1) return;
    if(g[c.r][c.c]!==g[last.r][last.c]) return;
    if(path.find(p=>p.r===c.r&&p.c===c.c)) return;
    path.push(c);
  }];
  Lab.input.onUp=[()=>{ if(path.length>=2){ score+=path.length*path.length; Lab.setScore(score); Lab.beep(600,.06);
    for(const p of path) g[p.r][p.c]=-1; collapse();}
    path=[]; dragging=false;}];
  Lab.loop(()=>draw());
}
function pick(x,y){ const cs=cellSize(), off=offset(cs); const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs); if(c<0||c>=COLS||r<0||r>=ROWS||g[r][c]===-1) return null; return {r,c};}
function collapse(){
  for(let c=0;c<COLS;c++){ const col=[]; for(let r=ROWS-1;r>=0;r--) if(g[r][c]!==-1) col.push(g[r][c]);
    while(col.length<ROWS) col.push(Lab.randInt(0,4));
    for(let r=ROWS-1;r>=0;r--) g[r][c]=col[ROWS-1-r];
  }
}
function cellSize(){ return Math.min((Lab.W-20)/COLS, (Lab.H-220)/ROWS);}
function offset(cs){ return {x:(Lab.W-cs*COLS)/2, y:140};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++){
    if(g[r][col]<0) continue;
    const x=off.x+col*cs+cs/2, y=off.y+r*cs+cs/2;
    c.beginPath(); c.fillStyle=COLORS[g[r][col]]; c.arc(x,y,cs*0.3,0,Lab.TAU); c.fill();
  }
  if(path.length){ c.strokeStyle=COLORS[g[path[0].r][path[0].c]]; c.lineWidth=cs*0.2; c.lineCap="round"; c.beginPath();
    for(let i=0;i<path.length;i++){ const x=off.x+path[i].c*cs+cs/2, y=off.y+path[i].r*cs+cs/2; if(i===0) c.moveTo(x,y); else c.lineTo(x,y);} c.stroke();}
}
start();
</script></body></html>
