<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css">
<script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Basketball Flick", instructions:"Flick the ball into the moving hoop.", restart:start});
let ball, hoop, score, shots, aiming, sx,sy, ex,ey, lastShot;
function start(){
  resetBall(); score=0; shots=10; Lab.setScore(0);
  hoop={x:Lab.W*0.5, y:Lab.H*0.35, w:90, dir:1, sp:90};
  Lab.input.onDown=[(x,y)=>{ if(ball.held||ball.moving) return; aiming=true; sx=x; sy=y; ex=x; ey=y;}];
  Lab.input.onMove=[(x,y)=>{ if(aiming){ ex=x; ey=y;}}];
  Lab.input.onUp=[(x,y)=>{ if(!aiming) return; aiming=false;
    const dx=sx-x, dy=sy-y;
    if(Math.hypot(dx,dy)<20) return;
    if(shots<=0) return;
    shots--;
    ball.vx=dx*5; ball.vy=dy*5; ball.moving=true;
  }];
  Lab.loop(dt=>{
    hoop.x+=hoop.dir*hoop.sp*dt;
    if(hoop.x<hoop.w/2+20){hoop.x=hoop.w/2+20;hoop.dir=1;}
    if(hoop.x>Lab.W-hoop.w/2-20){hoop.x=Lab.W-hoop.w/2-20;hoop.dir=-1;}
    if(ball.moving){
      ball.vy+=900*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      // hoop check
      if(ball.y>hoop.y && ball.y<hoop.y+20 && ball.x>hoop.x-hoop.w/2 && ball.x<hoop.x+hoop.w/2 && ball.vy>0){
        score++; Lab.setScore(score); Lab.beep(900,.07); Lab.toast("Swish!");
        setTimeout(resetBall,500);
        ball.moving=false;
      }
      if(ball.y>Lab.H || ball.x<-20 || ball.x>Lab.W+20){ setTimeout(resetBall,400); ball.moving=false;}
      if(shots<=0 && !ball.moving){ Lab.gameover({title:"Done",message:"Made "+score+"/10"}); return; }
    }
    const c=Lab.ctx; c.fillStyle="#3a2a1a"; c.fillRect(0,0,Lab.W,Lab.H);
    c.fillStyle="#aa3322"; c.fillRect(hoop.x+hoop.w/2-6, 0, 6, hoop.y);
    c.fillStyle="#fff"; c.fillRect(hoop.x-hoop.w/2, hoop.y-6, hoop.w, 6);
    c.strokeStyle="#fff"; c.beginPath(); c.moveTo(hoop.x-hoop.w/2, hoop.y); c.lineTo(hoop.x-hoop.w/4, hoop.y+25); c.lineTo(hoop.x+hoop.w/4, hoop.y+25); c.lineTo(hoop.x+hoop.w/2, hoop.y); c.stroke();
    c.beginPath(); c.fillStyle="#e67"; c.arc(ball.x,ball.y,18,0,Lab.TAU); c.fill();
    if(aiming){ c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath(); c.moveTo(ball.x,ball.y); c.lineTo(ball.x+(sx-ex), ball.y+(sy-ey)); c.stroke();}
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Shots left: "+shots+"  •  "+score+" made", Lab.W/2, 70);
  });
}
function resetBall(){ ball={x:Lab.W/2, y:Lab.H-100, vx:0, vy:0, moving:false}; }
start();
</script></body></html>
