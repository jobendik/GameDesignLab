<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Tap Clusters", instructions:"Tap groups of 2+ same color. Bigger clusters = more points.", restart:start});
let g, score, COLS=8, ROWS=10, COLORS=["#e74","#e6c","#7c6","#69d","#fc4"];
function start(){
  g=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Lab.randInt(0,4)));
  score=0; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(), off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c<0||c>=COLS||r<0||r>=ROWS||g[r][c]===-1) return;
    const cluster=findCluster(r,c, g[r][c]);
    if(cluster.length<2) return;
    for(const [cr,cc] of cluster) g[cr][cc]=-1;
    score+=cluster.length*cluster.length; Lab.setScore(score); Lab.beep(500+cluster.length*30,.06);
    collapse();
    if(!hasMoves()) setTimeout(()=>Lab.gameover({title:"No clusters",message:"Score: "+score}),400);
  }];
  Lab.loop(()=>draw());
}
function findCluster(r,c,color){ const seen=new Set(); const st=[[r,c]]; const out=[];
  while(st.length){ const [cr,cc]=st.pop(); const k=cr+","+cc; if(seen.has(k)) continue; seen.add(k);
    if(cr<0||cr>=ROWS||cc<0||cc>=COLS||g[cr][cc]!==color) continue;
    out.push([cr,cc]);
    st.push([cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]);
  } return out;
}
function collapse(){
  for(let c=0;c<COLS;c++){ const col=[]; for(let r=ROWS-1;r>=0;r--) if(g[r][c]!==-1) col.push(g[r][c]);
    for(let r=ROWS-1;r>=0;r--) g[r][c] = col.shift() ?? -1;
  }
  // remove empty columns
  for(let c=COLS-1;c>=0;c--){ if(g[ROWS-1][c]===-1){ for(let cc=c;cc<COLS-1;cc++) for(let r=0;r<ROWS;r++) g[r][cc]=g[r][cc+1]; for(let r=0;r<ROWS;r++) g[r][COLS-1]=-1;}}
}
function hasMoves(){ for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ if(g[r][c]===-1) continue;
  if(c<COLS-1 && g[r][c]===g[r][c+1]) return true;
  if(r<ROWS-1 && g[r][c]===g[r+1][c]) return true;
} return false;}
function cellSize(){ return Math.min((Lab.W-20)/COLS, (Lab.H-220)/ROWS);}
function offset(cs){ return {x:(Lab.W-cs*COLS)/2, y:140};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    if(g[r][col]>=0){ c.fillStyle=COLORS[g[r][col]]; c.fillRect(x+2,y+2,cs-4,cs-4);}
  }
}
start();
</script></body></html>
