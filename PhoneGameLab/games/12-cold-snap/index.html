<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cold Snap</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* COLD SNAP — a drift-and-shoot game on a wrap-around polar sea.
 * Identity: seen from above — teal water, faceted white ice with a pale underwater skirt, a small orange tug that leaves
 * a foam wake, amber sunstones. Cold, quiet palette; chugging engine, cracking ice, a driving pulse that thickens with the ice.
 * Core: bergs split into floes, floes into chunks, chunks shatter. The tug has real inertia: it glides, so you thrust,
 * flip and fire while drifting. It fires by itself (with a little aim assist), leaving one thumb free to steer.
 * Controls: a stick that appears wherever you touch — drag a little to turn only, further to thrust. Arrows on keyboard.
 * Hook: shattered chunks release sunstones that sink within seconds. Scooping them out of the debris field builds the
 * multiplier (x1..x6, which melts away if you stop collecting) and every 8th stone fires a SUNBURST of flares all round.
 * From wave 3 a Tusker charges straight across the sea along a line it shows you first.                             */
Lab.init({
  title: "Cold Snap", tagline: "Break the drifting ice. Scoop the sunstones before they sink.", category: "Arcade & Action",
  howto: ["Drag a little to turn, further to thrust", "The tug fires by itself: split the ice", "Grab sunstones fast for a multiplier"],
  theme: { bg: "#082a36", bg2: "#135264", accent: "#ff8a4c", accent2: "#7fe3f0" },
  orient: "portrait", music: { style: "drive", key: "E", bpm: 104, vol: .36 }, restart: start,
});
const { draw, fx } = Lab, TAU = Lab.TAU;
const TIER = [{ r: 15, hp: 1, pts: 100 }, { r: 27, hp: 2, pts: 50 }, { r: 44, hp: 3, pts: 20 }];
let S, top, ship, ice, shots, gems, rams, wake, stick, score, lives, wave, chain, chainT, bestMult, stones, burst, fireT, wakeT, chugT, ramT, pending, alive, hintT, glints, broke;

// engine workaround: Lab.buzz before the first tap makes Chrome log a console error (possible with ?autostart=1 + auto-fire)
const buzz = ms => { const ua = navigator.userActivation; if (!ua || ua.hasBeenActive) Lab.buzz(ms); };
const mult = () => Math.min(6, 1 + Math.floor(chain / 4));
function layout() { S = Math.min(Lab.W / 390, Lab.play.h / 700); top = Lab.play.y - 6; }
Lab.onResize((W, H) => {
  if (!ship) return; const oT = top, oS = S, oW = W_, oH = H_; layout(); const kx = Lab.W / oW, ky = (Lab.H - top) / (oH - oT), ks = S / oS;
  for (const a of [[ship], ice, shots, gems, rams, wake]) for (const o of a) { o.x *= kx; o.y = top + (o.y - oT) * ky; if (o.vx != null) { o.vx *= ks; o.vy *= ks; } }
  for (const i of ice) i.r = TIER[i.tier].r * S; W_ = Lab.W; H_ = Lab.H; stick.on = false;
});
let W_, H_;

function start() {
  layout(); W_ = Lab.W; H_ = Lab.H;
  ship = { x: Lab.W / 2, y: top + (Lab.H - top) * .58, vx: 0, vy: 0, a: -Math.PI / 2, inv: 1.5, thr: 0, recoil: 0 };
  ice = []; shots = []; gems = []; rams = []; wake = []; stick = { on: false, id: null, ax: 0, ay: 0, x: 0, y: 0 };
  score = 0; lives = 3; wave = 0; chain = 0; chainT = 0; bestMult = 1; stones = 0; burst = 0; fireT = .4; wakeT = 0; chugT = 0; ramT = 10; pending = false; alive = true; hintT = 0; broke = 0;
  glints = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), p: Lab.rand(0, TAU), v: Lab.rand(.5, 1.4), w: Lab.rand(6, 14) }));
  Lab.setScore(0);
  Lab.input.onDown = [(x, y, id) => { if (!stick.on) { stick.on = true; stick.id = id; stick.ax = stick.x = x; stick.ay = stick.y = y; } }];
  Lab.input.onMove = [(x, y, dx, dy, id) => {
    if (!stick.on || id !== stick.id) return; stick.x = x; stick.y = y;
    const d = Lab.dist(x, y, stick.ax, stick.ay), max = 66 * S; if (d > max) { stick.ax = x - (x - stick.ax) / d * max; stick.ay = y - (y - stick.ay) / d * max; } // the stick follows a wandering thumb
  }];
  Lab.input.onUp = [(x, y, id) => { if (id === stick.id) stick.on = false; }];
  Lab.expose({
    get score() { return score; }, get lives() { return lives; }, get wave() { return wave; }, get mult() { return mult(); }, get chain() { return chain; }, get stones() { return stones; }, get broke() { return broke; },
    get ship() { return { x: ship.x, y: ship.y, vx: ship.vx, vy: ship.vy, a: ship.a, inv: ship.inv, speed: Math.hypot(ship.vx, ship.vy) / S }; },
    get ice() { return ice.map(i => ({ x: i.x, y: i.y, r: i.r, tier: i.tier, hp: i.hp })); }, get gems() { return gems.map(g => ({ x: g.x, y: g.y })); }, get shots() { return shots.length; }, get rams() { return rams.length; },
    get field() { return { top, W: Lab.W, H: Lab.H, S }; },
    /* test helpers */
    clearIce() { ice = []; rams = []; }, spawnIce(tier, x, y, vx, vy) { ice.push(mkIce(tier, x, y, vx || 0, vy || 0)); }, spawnGem(x, y) { gems.push({ x, y, vx: 0, vy: 0, t: 0 }); },
    setLives(n) { lives = n; }, calm(on) { ship.inv = on ? 1e9 : 0; }, stop() { ship.vx = ship.vy = 0; }, ram() { ramT = 0; }, skipTo(w) { ice = []; rams = []; wave = w - 1; nextWave(); },
  });
  nextWave();
  Lab.loop(frame);
}
function mkIce(tier, x, y, vx, vy) {
  const n = 9 + tier, shape = []; for (let i = 0; i < n; i++) shape.push(.78 + Math.random() * .3);
  return { tier, x, y, vx, vy, r: TIER[tier].r * S, hp: TIER[tier].hp, rot: Lab.rand(0, TAU), vr: Lab.rand(-.5, .5) * (3 - tier) * .5, shape, flash: 0, wob: 0 };
}
function nextWave() {
  wave++; pending = false; const n = Math.min(2 + wave, 7), sp = (26 + Math.min(wave, 12) * 5) * S;
  for (let i = 0; i < n; i++) {
    let x, y, g = 0; do { x = Lab.rand(0, Lab.W); y = Lab.rand(top, Lab.H); } while (Lab.dist(x, y, ship.x, ship.y) < 200 * S && g++ < 40);
    const a = Lab.rand(0, TAU), v = sp * Lab.rand(.6, 1.3), b = mkIce(wave === 1 && i === 2 ? 1 : 2, x, y, Math.cos(a) * v, Math.sin(a) * v); b.wob = 1; ice.push(b);
  }
  ramT = Lab.rand(7, 11);
  if (wave > 1) { Lab.banner("WAVE " + wave, { color: "#bff3fa", ms: 1000 }); Lab.sfx("whistle", { pitch: .8 }); }
}

/* ---------------------------------------------------------------- actions */
function fire() {
  let a = ship.a, best = 1e9; // gentle aim assist: snap to ice within ~11° of the bow
  for (const i of ice) { const d = Lab.dist(i.x, i.y, ship.x, ship.y); if (d > 330 * S) continue; const da = Math.abs(Lab.angleDiff(ship.a, Math.atan2(i.y - ship.y, i.x - ship.x))); if (da < .2 + i.r / d * .5 && d < best) { best = d; a = Math.atan2(i.y - ship.y, i.x - ship.x); } }
  for (const r of rams) { if (r.state !== "dash") continue; const d = Lab.dist(r.x, r.y, ship.x, ship.y), da = Math.abs(Lab.angleDiff(ship.a, Math.atan2(r.y - ship.y, r.x - ship.x))); if (da < .3 && d < best) { best = d; a = Math.atan2(r.y - ship.y, r.x - ship.x); } }
  flare(ship.x + Math.cos(ship.a) * 15 * S, ship.y + Math.sin(ship.a) * 15 * S, a, .78); ship.recoil = 1;
  Lab.audio.tone({ f: 1250, f2: 640, dur: .05, type: "sine", vol: .045 });
}
function flare(x, y, a, life) { if (shots.length < 60) shots.push({ x, y, vx: Math.cos(a) * 560 * S + ship.vx * .4, vy: Math.sin(a) * 560 * S + ship.vy * .4, life }); }
function hitIce(b, s) {
  b.hp--; b.flash = 1; const ang = s ? Math.atan2(s.vy, s.vx) : Lab.rand(0, TAU);
  fx.burst(s ? s.x : b.x, s ? s.y : b.y, { n: 5, colors: ["#fff", "#c9f2f8"], speed: 150 * S, size: 2.6 * S, life: .35, shape: "shard", gravity: 0, angle: ang + Math.PI, spread: 1.6 });
  if (b.hp > 0) { Lab.sfx("knock", { pitch: 1.5 - b.tier * .3 }); b.vx += Math.cos(ang) * 10 * S; b.vy += Math.sin(ang) * 10 * S; return; }
  ice.splice(ice.indexOf(b), 1); broke++;
  const g = TIER[b.tier].pts * mult(); score += g; Lab.setScore(score);
  fx.text(b.x, b.y, "+" + g, { color: "#eafcff", size: (13 + (2 - b.tier) * 3) * Math.max(.85, S), life: .6 });
  fx.burst(b.x, b.y, { n: 8 + b.tier * 7, colors: ["#fff", "#c9f2f8", "#8fdbe8"], speed: (170 + b.tier * 60) * S, size: (3 + b.tier) * S, life: .6, shape: "shard", gravity: 0, drag: 2.2 });
  fx.ring(b.x, b.y, { r0: b.r * .5, r1: b.r * 1.9, color: "#dff9ff", width: (2 + b.tier) * S, life: .35 });
  if (b.tier === 2) { Lab.sfx("explode", { pitch: 1.1 }); Lab.sfx("crunch", { pitch: .6 }); Lab.shake(6, .22); Lab.hitstop(.035); buzz(18); }
  else if (b.tier === 1) { Lab.sfx("crunch", { pitch: .95 }); Lab.shake(2.5, .12); }
  else { Lab.sfx("glass", { pitch: 1 + Math.random() * .3 }); }
  if (b.tier > 0) for (const sd of [-1, 1]) {
    const pa = ang + sd * Math.PI / 2 + Lab.rand(-.4, .4), kick = Lab.rand(42, 78) * S, c = mkIce(b.tier - 1, b.x + Math.cos(pa) * b.r * .45, b.y + Math.sin(pa) * b.r * .45, b.vx * .7 + Math.cos(pa) * kick + Math.cos(ang) * 22 * S, b.vy * .7 + Math.sin(pa) * kick + Math.sin(ang) * 22 * S);
    c.wob = 1; ice.push(c);
  } else if (Lab.chance(.78) && gems.length < 30) gems.push({ x: b.x, y: b.y, vx: b.vx * .5, vy: b.vy * .5, t: 0 });
  if (!ice.length && !pending && alive) { pending = true; const bonus = 100 * wave; score += bonus; Lab.setScore(score); Lab.bumpScore(); Lab.sfx("levelup"); fx.text(Lab.W / 2, top + (Lab.H - top) * .36, "sea cleared  +" + bonus, { color: "#ffd98a", size: 20 * Math.max(.85, S), life: 1.3 }); Lab.after(1.5, () => { if (alive) nextWave(); }); }
}
function grab(g) {
  const m0 = mult(); chain++; stones++; chainT = 7; burst++; const pts = 25 * mult(); score += pts; Lab.setScore(score);
  Lab.audio.combo(Math.min(chain, 16), { vol: .17, type: "sine" }); Lab.sfx("gem", { pitch: .9 + mult() * .06 }); buzz(8);
  fx.burst(g.x, g.y, { n: 6, colors: ["#ffc233", "#fff2c2"], speed: 130 * S, size: 2.6 * S, life: .4, gravity: 0, shape: "star" });
  if (mult() > m0) { bestMult = Math.max(bestMult, mult()); Lab.bumpScore(); fx.text(ship.x, ship.y - 34 * S, "×" + mult(), { color: "#ffc233", size: 26 * S }); Lab.sfx("pickup", { pitch: 1 + mult() * .08 }); }
  if (burst >= 8) { burst = 0; for (let i = 0; i < 16; i++) flare(ship.x, ship.y, i / 16 * TAU + ship.a, .6); Lab.sfx("powerup", { pitch: 1.2 }); Lab.flash("#ffd98a", .2, .25); fx.ring(ship.x, ship.y, { r0: 14 * S, r1: 150 * S, color: "#ffc233", width: 5 * S, life: .45 }); fx.text(ship.x, ship.y - 54 * S, "SUNBURST", { color: "#ffd98a", size: 18 * Math.max(.85, S) }); }
}
function wreck() {
  if (ship.inv > 0 || !alive) return;
  lives--; chain = 0; burst = 0; ship.inv = 2.4; Lab.shake(13, .45); Lab.hitstop(.09); Lab.flash("#ff8a4c", .25, .35); Lab.sfx("hurt"); Lab.sfx("splash", { pitch: .7 }); Lab.sfx("thud"); buzz(60);
  fx.burst(ship.x, ship.y, { n: 28, colors: ["#ff8a4c", "#fff", "#ffd98a", "#8fdbe8"], speed: 320 * S, size: 4 * S, life: .9, gravity: 0, drag: 2, shape: "shard" });
  fx.ring(ship.x, ship.y, { r0: 12 * S, r1: 160 * S, color: "#fff", width: 6 * S, life: .5 });
  for (const b of ice) { const d = Lab.dist(b.x, b.y, ship.x, ship.y) || 1; if (d < 170 * S) { b.vx += (b.x - ship.x) / d * 150 * S; b.vy += (b.y - ship.y) / d * 150 * S; } }
  ship.vx *= .2; ship.vy *= .2;
  if (lives <= 0) { alive = false; Lab.gameover({ title: "Hull breached", score, stats: [["Wave", wave], ["Best multiplier", "×" + bestMult], ["Sunstones", stones]] }); }
}
const wrapX = (o, m) => { if (o.x < -m) o.x += Lab.W + 2 * m; else if (o.x > Lab.W + m) o.x -= Lab.W + 2 * m; };
const wrapY = (o, m) => { if (o.y < top - m) o.y += Lab.H - top + 2 * m; else if (o.y > Lab.H + m) o.y -= Lab.H - top + 2 * m; };

/* ---------------------------------------------------------------- frame */
function frame(dt, t) {
  hintT += dt;
  if (stick.on && !Lab.input.pointers.some(p => p.id === stick.id)) stick.on = false;
  // helm
  let thr = 0;
  if (stick.on) { const dx = stick.x - stick.ax, dy = stick.y - stick.ay, d = Math.hypot(dx, dy); if (d > 9 * S) ship.a += Lab.angleDiff(ship.a, Math.atan2(dy, dx)) * (1 - Math.exp(-16 * dt)); thr = Lab.clamp((d - 22 * S) / (40 * S), 0, 1); }
  else { ship.a += Lab.input.axisX() * 3.7 * dt; if (Lab.input.axisY() < 0) thr = 1; }
  if (!alive) thr = 0;
  ship.thr = Lab.damp(ship.thr, thr, 10, dt); ship.recoil = Lab.damp(ship.recoil, 0, 16, dt); ship.inv = Math.max(0, ship.inv - dt);
  ship.vx += Math.cos(ship.a) * 470 * S * thr * dt; ship.vy += Math.sin(ship.a) * 470 * S * thr * dt;
  const drag = Math.exp(-(thr > 0 ? .95 : .42) * dt); ship.vx *= drag; ship.vy *= drag;
  const sp = Math.hypot(ship.vx, ship.vy), cap = 315 * S; if (sp > cap) { ship.vx *= cap / sp; ship.vy *= cap / sp; }
  ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrapX(ship, 12 * S); wrapY(ship, 12 * S);
  wakeT -= dt; if (wakeT <= 0 && sp > 26 * S && alive) { wakeT = .04; if (wake.length < 56) wake.push({ x: ship.x - Math.cos(ship.a) * 12 * S + Lab.rand(-2, 2) * S, y: ship.y - Math.sin(ship.a) * 12 * S + Lab.rand(-2, 2) * S, t: 0, r: (3 + thr * 3) * S }); }
  if (thr > .05) { chugT -= dt; if (chugT <= 0) { chugT = .13; Lab.audio.noise({ dur: .1, vol: .03 + thr * .03, bp: 240, q: 1.2 }); fx.burst(ship.x - Math.cos(ship.a) * 14 * S, ship.y - Math.sin(ship.a) * 14 * S, { n: 2, color: "rgba(255,255,255,.75)", speed: 90 * S, size: 2.6 * S, life: .4, gravity: 0, angle: ship.a + Math.PI, spread: .9, vx: ship.vx * .3, vy: ship.vy * .3 }); } }
  for (const w of wake) w.t += dt / .95; if (wake.length && wake[0].t >= 1) wake = wake.filter(w => w.t < 1);
  // flares
  fireT -= dt; if (fireT <= 0 && alive) { if (ice.length || rams.length) { fire(); fireT = .24; } else fireT = .1; }
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; wrapX(s, 4); wrapY(s, 4); if (s.life <= 0) { s.dead = true; continue; }
    for (const b of ice) { const rr = b.r * .93 + 3 * S; if (Math.abs(b.x - s.x) < rr && Math.abs(b.y - s.y) < rr && Lab.dist(b.x, b.y, s.x, s.y) < rr) { s.dead = true; hitIce(b, s); break; } }
    if (!s.dead) for (const r of rams) if (r.state === "dash" && Lab.dist(r.x, r.y, s.x, s.y) < 20 * S) { s.dead = true; r.hp--; r.flash = 1; Lab.sfx("knock", { pitch: .8 }); if (r.hp <= 0) { r.dead = true; const g = 150 * mult(); score += g; Lab.setScore(score); Lab.bumpScore(); fx.text(r.x, r.y, "+" + g, { color: "#ffd98a", size: 18 * S }); fx.burst(r.x, r.y, { n: 20, colors: ["#3d5a80", "#fff", "#98c1d9"], speed: 260 * S, size: 4 * S, life: .7, gravity: 0, drag: 2 }); Lab.sfx("splash"); Lab.shake(6, .2); for (let i = 0; i < 3; i++) gems.push({ x: r.x, y: r.y, vx: Lab.rand(-70, 70) * S, vy: Lab.rand(-70, 70) * S, t: 0 }); } break; }
  }
  if (shots.some(s => s.dead)) shots = shots.filter(s => !s.dead);
  // ice
  for (const b of ice) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt; wrapX(b, b.r); wrapY(b, b.r); b.flash = Math.max(0, b.flash - dt * 6); b.wob = Math.max(0, b.wob - dt * 3);
    const v = Math.hypot(b.vx, b.vy), vmax = (150 - b.tier * 30) * S; if (v > vmax) { const k = Math.exp(-1.5 * dt); b.vx *= k; b.vy *= k; }
    if (alive && ship.inv <= 0 && Lab.dist(b.x, b.y, ship.x, ship.y) < b.r * .86 + 9 * S) wreck();
  }
  // the Tusker: shows its line, then charges along it
  if (wave >= 3 && alive && ice.length) { ramT -= dt; if (ramT <= 0 && rams.length < (wave >= 7 ? 2 : 1)) { ramT = Math.max(5, 13 - wave * .7) * Lab.rand(.8, 1.3); const horiz = Lab.chance(.65), dir = Lab.chance(.5) ? 1 : -1;
    rams.push(horiz ? { x: dir > 0 ? -30 * S : Lab.W + 30 * S, y: Lab.clamp(ship.y + Lab.rand(-30, 30) * S, top + 50 * S, Lab.H - 30 * S), dx: dir, dy: 0, state: "warn", t: 0, hp: 3, flash: 0 } : { x: Lab.clamp(ship.x + Lab.rand(-30, 30) * S, 30 * S, Lab.W - 30 * S), y: dir > 0 ? top - 30 * S : Lab.H + 30 * S, dx: 0, dy: dir, state: "warn", t: 0, hp: 3, flash: 0 });
    Lab.sfx("warn", { pitch: .8 }); } }
  for (const r of rams) {
    r.t += dt; r.flash = Math.max(0, r.flash - dt * 6);
    if (r.state === "warn") { if (r.t > 1.25) { r.state = "dash"; r.t = 0; Lab.sfx("whoosh", { pitch: .7 }); } continue; }
    const v = Math.min(480, 360 + wave * 12) * S; r.x += r.dx * v * dt; r.y += r.dy * v * dt;
    if (Lab.chance(dt * 40) && wake.length < 56) wake.push({ x: r.x - r.dx * 18 * S, y: r.y - r.dy * 18 * S, t: 0, r: 5 * S });
    if (r.x < -60 * S || r.x > Lab.W + 60 * S || r.y < top - 60 * S || r.y > Lab.H + 60 * S) r.dead = true;
    if (alive && ship.inv <= 0 && Lab.dist(r.x, r.y, ship.x, ship.y) < 24 * S) wreck();
  }

  for (const g of gems) {
    g.t += dt; const d = Lab.dist(g.x, g.y, ship.x, ship.y);
    if (alive && d < 74 * S && d > 1) { const pull = 300 * S * dt; g.x += (ship.x - g.x) / d * pull; g.y += (ship.y - g.y) / d * pull; } else { g.x += g.vx * dt; g.y += g.vy * dt; const k = Math.exp(-1.6 * dt); g.vx *= k; g.vy *= k; }
    wrapX(g, 8); wrapY(g, 8);
    if (alive && d < 25 * S) { g.dead = true; grab(g); } else if (g.t > 5.5) { g.dead = true; fx.puff(g.x, g.y, { n: 3, color: "rgba(255,194,51,.4)", size: 4 * S }); }
  }
  if (gems.some(g => g.dead)) gems = gems.filter(g => !g.dead);
  if (chain > 0) { chainT -= dt; if (chainT <= 0) { chain = Math.max(0, (mult() - 2) * 4); chainT = 7; if (chain >= 0) { fx.text(ship.x, ship.y - 34 * S, chain ? "melting…  ×" + mult() : "multiplier melted", { color: "#9fd8e4", size: 13 * Math.max(.85, S), life: .9 }); Lab.sfx("tick", { pitch: .5 }); } } }
  Lab.music.intensity(Lab.clamp(.25 + ice.length * .035 + rams.length * .2 + (lives === 1 ? .15 : 0), 0, 1));
  render(t, thr);
}

/* ---------------------------------------------------------------- drawing */
function sea() {
  return Lab.sprite("sea:" + Lab.W + "x" + Lab.H, Lab.W, Lab.H, (g, w, h) => {
    draw.vgrad(g, 0, 0, w, h, ["#135264", "#0d3b4b", "#092c3a"]);
    const rnd = Lab.rng(21); g.lineCap = "round";
    for (let i = 0; i < 22; i++) { const y = rnd() * h, x0 = rnd() * w, len = (60 + rnd() * 140) * S, amp = (3 + rnd() * 5) * S; g.strokeStyle = `rgba(190,240,250,${.035 + rnd() * .05})`; g.lineWidth = (1.5 + rnd() * 2.5) * S; g.beginPath(); for (let x = 0; x <= len; x += 8) g[x ? "lineTo" : "moveTo"](x0 + x - len / 2, y + Math.sin(x * .05 + i) * amp); g.stroke(); }
    for (let i = 0; i < 9; i++) draw.glow(g, rnd() * w, rnd() * h, (60 + rnd() * 90) * S, i % 2 ? "#1c7084" : "#06202b", .22);
  });
}
function icePath(c, b, k) { const n = b.shape.length; c.beginPath(); for (let i = 0; i < n; i++) { const a = b.rot + i / n * TAU, r = b.r * b.shape[i] * k; c[i ? "lineTo" : "moveTo"](b.x + Math.cos(a) * r, b.y + Math.sin(a) * r); } c.closePath(); }
function gemSprite() {
  const sz = 34 * S;
