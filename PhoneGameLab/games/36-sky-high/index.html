<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sky High Stack", instructions:"Tap to drop a horizontal moving block. Only overlap is kept!", restart:start});
let tower, mover, sp, score, dir;
function start(){
  tower=[{x:Lab.W/2,y:Lab.H-40,w:Math.min(180,Lab.W*0.55),h:28,hue:0}];
  mover={x:0,y:tower[0].y-28,w:tower[0].w,h:28,hue:50}; sp=300; dir=1; score=0;
  Lab.setScore(0);
  Lab.input.onTap=[()=>{
    const last=tower[tower.length-1];
    const overlap = Math.min(last.x+last.w/2, mover.x+mover.w/2) - Math.max(last.x-last.w/2, mover.x-mover.w/2);
    if(overlap<=4){ Lab.gameover({title:"Toppled!",message:"Floors: "+score}); return; }
    const ncx=(Math.max(last.x-last.w/2, mover.x-mover.w/2) + Math.min(last.x+last.w/2, mover.x+mover.w/2))/2;
    tower.push({x:ncx, y:last.y-last.h, w:overlap, h:28, hue:mover.hue});
    score++; Lab.setScore(score); Lab.beep(900,.05); sp+=10;
    mover={x:0,y:tower[tower.length-1].y-28, w:overlap, h:28, hue:(mover.hue+35)%360};
    if(mover.y<Lab.H*0.3){ const d=Lab.H*0.3-mover.y; for(const t of tower) t.y+=d; mover.y+=d;}
  }];
  Lab.loop(dt=>{
    mover.x+=dir*sp*dt;
    if(mover.x-mover.w/2<0){mover.x=mover.w/2;dir=1;}
    if(mover.x+mover.w/2>Lab.W){mover.x=Lab.W-mover.w/2;dir=-1;}
    const c=Lab.ctx;
    const grad=c.createLinearGradient(0,0,0,Lab.H);
    grad.addColorStop(0,"#4a8bff"); grad.addColorStop(1,"#0b0f1a"); c.fillStyle=grad;
    c.fillRect(0,0,Lab.W,Lab.H);
    for(const t of tower){ c.fillStyle=`hsl(${t.hue},75%,60%)`; c.fillRect(t.x-t.w/2,t.y-t.h,t.w,t.h);}
    c.fillStyle=`hsl(${mover.hue},75%,60%)`; c.fillRect(mover.x-mover.w/2,mover.y-mover.h,mover.w,mover.h);
  });
}
start();
</script></body></html>
