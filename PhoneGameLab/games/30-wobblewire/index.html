</head><body><script>
(function(){ "use strict";
/* WOBBLEWIRE — a fox on a high wire. Hold the left / right side of the screen to lean; the fox is a real inverted

Lab.init({
  title: "Wobblewire", tagline: "Lean left, lean right. Don't look down.", category: "Runner & Movement",

const { draw, fx } = Lab, TAU = Lab.TAU, PI = Math.PI;
const UC = 3.0, CD = 1.2, BM = .95, DZ = 7, VW = 1.5, STEP = 1 / 120, FALL = 1.08;
const PALS = [

  { sky: ["#86cdf2", "#c4e9fa", "#e8f7ee"], m: ["#b0d6e4", "#78adc8", "#487fa3"], sun: "#ffffff", v: "#35698a" },
  { sky: ["#ffb072", "#ffd69c", "#ffecd4"], m: ["#e3aa90", "#ba7676", "#814c66"], sun: "#fff1b8", v: "#663d5c" },
  { sky: ["#f594a2", "#fbc5ae", "#fdebd3"], m: ["#cf9fb8", "#98719f", "#624a80"], sun: "#ffe3c9", v: "#4c3a6c" },
  { sky: ["#a5a2dc", "#cdc7ee", "#ece6f6"], m: ["#aaaed8", "#787bb6", "#4b4f8d"], sun: "#fffbe8", v: "#393d75" },

    get theta() { return th; }, get omega() { return om; }, get dist() { return dist; }, get total() { return total + dist; }, get rope() { return rope; },

}

/* ------------------------------------------------------------------ events */

/* ------------------------------------------------------------------ rendering */

  c.fillStyle = CREAM; c.beginPath(); c.ellipse(0, -97 * u, 19 * u, 28 * u, 0, 0, TAU); c.fill();
