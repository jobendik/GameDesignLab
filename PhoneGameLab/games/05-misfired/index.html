<title>Misfired</title>

</head><body><script>
(function(){ "use strict";
/* MISFIRED — a tray of glazed tiles comes out of the kiln; one took the glaze a shade wrong. Tap it.
 * Identity: sunlit pottery studio. Glossy ceramic tiles on a slate tray against warm plaster, lo-fi music.
 * Skill: pure colour discrimination. Differences are generated in OKLab so "one shade off" means the same
 *        perceptual distance for every hue; the gap shrinks from obvious to a just-noticeable ~2%.
 * Pressure: one kiln-heat time bank. Right picks stoke it (more when quick), wrong picks burn 2.5 s.
 * Depth: streak multiplier for unbroken finds, mottled batches (per-tile noise) and inlay batches (only a
 *        small motif differs) join the rotation later; every misfire you catch lands on the trophy shelf. */
Lab.init({
  title: "Misfired", tagline: "One tile left the kiln a shade off. Spot it.", category: "Reflex & Taps",
  howto: ["Tap the tile whose glaze is slightly different", "Right picks stoke the kiln, wrong picks burn 2.5 s", "Unbroken streaks multiply your score"],
  theme: { bg: "#e7dcc8", bg2: "#f6efe2", fg: "#43352a", muted: "#8a7866", accent: "#e2622b", accent2: "#f0a437", light: true },
  orient: "any", music: { style: "chill", key: "F", vol: .5 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp;
const TMAX = 20, FLOOR = .017, INK = "#43352a";
const G = { x: 0, y: 0, side: 0, cell: 0, tp: 0, barX: 0, barY: 0, barW: 0, barH: 0 };
let S = 1, size = 0, tiles = [], odd = -1, found, score, streak, bestStreak, time, roundT, lock, settle, hinted, dE, minDE, kind, shape,

/* ---------- colour: OKLCH → sRGB so a "step" is perceptually the same size for every hue */
function oklch(L, C, h) {

}
function pickPair(gap) {
  let axis = found < 2 ? "L" : Lab.choose(["L", "L", "h", "h", "C"]);
  for (let k = 0; k < 60; k++) {
    const L = Lab.rand(.56, .84), C = Lab.rand(.07, .16), h = Lab.rand(0, TAU), sg = Lab.chance(.5) ? 1 : -1;

const gridFor = n => n < 2 ? 2 : n < 5 ? 3 : n < 10 ? 4 : n < 18 ? 5 : 6;
const multFor = s => Math.min(5, 1 + Math.floor(s / 4));

/* ---------- layout (everything derives from Lab.play; recomputed on resize) */
function layout(n) {
  n = n || size || 3;

Lab.onResize(() => layout());
const cellAt = (x, y) => { const cx = Math.floor((x - G.x) / G.cell), cy = Math.floor((y - G.y) / G.cell); return cx < 0 || cy < 0 || cx >= size || cy >= size ? -1 : cy * size + cx; };

function start() {
  size = 0; tiles = []; odd = -1; found = 0; score = 0; streak = 0; bestStreak = 0; time = 15; shownTime = 15; roundT = 0; lock = 0; settle = 0;
  hinted = false; minDE = 1; phase = "play"; cursor = -1; wrongs = 0; beatT = 0; jolt = 0; glint = 0; shelf = []; pulseT = 0;
  Lab.setScore(0); makeRound(-1);
  Lab.input.onDown = [(x, y) => { const i = cellAt(x, y); if (i >= 0) { cursor = -1; pick(i); } }];

    if (phase !== "play") return;

    else if (k === "ArrowUp") cursor = ((cy + size - 1) % size) * size + cx; else if (k === "ArrowDown") cursor = ((cy + 1) % size) * size + cx;
    else if (k === " " || k === "Enter") pick(cursor);

    get odd() { return odd; }, get size() { return size; }, get found() { return found; }, get score() { return score; }, get time() { return time; },
    get streak() { return streak; }, get phase() { return phase; }, get gap() { return dE; }, get kind() { return kind; }, get ready() { return lock <= 0 && phase === "play"; },
    get shelf() { return shelf.length; }, get cursor() { return cursor; }, get wrongs() { return wrongs; }, rect(i) { const p = centre(i); return { x: p.x, y: p.y, w: G.cell, h: G.cell }; }, setTime(v) { time = v; }, setFound(v) { found = v; }, pick,
  });

}

function makeRound(origin) {

  kind = found >= 14 && Lab.chance(.3) ? "inlay" : found >= 8 && Lab.chance(.4) ? "mottled" : "plain";
  shape = Lab.choose(["dot", "diamond", "arch"]);

    const glaze = (i === odd ? oklch(p.L2 + j, p.C2, p.h2) : oklch(p.L + j, p.C, p.h)).css;
    const col = body || glaze, inl = body ? glaze : null, d = Math.hypot(i % ns - oc.x, Math.floor(i / ns) - oc.y) / ns;

    else { const t = tiles[i]; t.nCol = col; t.nInl = inl; t.f = -d * .13; }
  }

}

    const mult = multFor(streak), gain = Math.round((10 + size * 4 + found) * mult * (quick ? 1.5 : 1));
    score += gain; Lab.setScore(score); if (mult > 1 || quick) Lab.bumpScore();
    const fade = clamp(1 - (found - 20) / 60, .5, 1), add = (hinted ? .9 : clamp(2.5 - roundT * .3, 1.2, 2.3)) * fade;
    time = Math.min(TMAX, time + add); pulseT = 1;

    fx.ring(p.x, p.y, { r0: G.cell * .3, r1: G.cell * .95, color: "rgba(255,255,255,.9)", width: 4, life: .32 });
    fx.text(p.x, p.y - G.cell * .42, "+" + gain, { color: quick ? "#ffe9a8" : "#fff", size: (quick ? 24 : 19) * S, outline: "rgba(60,36,14,.75)" });
    if (quick && found > 2) fx.text(p.x, p.y + G.cell * .42, "quick!", { color: "#ffd98a", size: 13 * S, outline: "rgba(60,36,14,.7)", life: .6, vy: 30 });
    Lab.audio.combo(Math.min(streak - 1, 14), { vol: .2 }); Lab.sfx("pop", { pitch: 1.25 - size * .06 }); Lab.buzz(10);

    if (mult > wasMult) { Lab.banner("STREAK ×" + mult, { color: "#e2622b", ms: 800 }); Lab.sfx("powerup", { pitch: .8 + mult * .1 }); }

/* ---------- drawing */

}
function tray(c) {

  draw.rect(c, x + 2 * S, y + 7 * S, w, w, r, "rgba(70,50,30,.22)");
  draw.rect(c, x, y, w, w, r, "#4d5158");

const gloss = () => Lab.sprite("gloss", 96, 96, (g, w) => {

function drawTile(c, cx, cy, cell, tl, mark) {

  const flipY = Math.abs(Math.cos(p * Math.PI)), sc = ease.outBack(tl.sc) * (1 - tl.press * .08) * (1 + ease.pulse(clamp(tl.pop, 0, 1)) * .12 * (mark ? 1 : 0) + (mark ? .06 : 0));

function drawShelf(c) {

  const rows = Math.min(3, Math.floor(space / rowH)); if (rows < 1) return;

  for (let r = 0; r < rows; r++) {

    draw.rect(c, G.barX, y + 3 * S, G.barW, 5 * S, 2.5 * S, "rgba(70,50,30,.16)"); draw.rect(c, G.barX, y, G.barW, 5 * S, 2.5 * S, "#b98d5e");

    const x = Lab.lerp(s.x0, tx, e), y = Lab.lerp(s.y0, ty, e) - ease.pulse(s.u) * 40 * S, sz = Lab.lerp(G.cell * .8, m, e);
    draw.rect(c, x - sz / 2, y - sz / 2 + sz * .08, sz, sz, sz * .2, "rgba(60,40,20,.25)");
    draw.rect(c, x - sz / 2, y - sz / 2, sz, sz, sz * .2, s.col); c.drawImage(gloss(), x - sz / 2, y - sz / 2, sz, sz);
  }
}
function drawBar(c, t) {
  const x = G.barX, y = G.barY, w = G.barW, h = G.barH, fr = clamp(shownTime / TMAX, 0, 1), low = time < 5 && phase === "play";
  const jx = jolt > 0 ? Math.sin(jolt * 40) * jolt * 5 * S : 0;
  draw.rect(c, x + jx, y, w, h, h / 2, "rgba(90,70,50,.22)");
  if (fr > .01) {
