<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Stair Climb", instructions:"Alternate L / R taps to climb. Don't repeat the same side!", restart:start});
let stairs, step, lastSide, fail, height, score, t;
function start(){
  step=0; lastSide=null; fail=0; height=0; score=0; t=0;
  stairs=[]; for(let i=0;i<20;i++) stairs.push({side:i%2===0?'L':'R'});
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const side = x<Lab.W/2 ? 'L':'R';
    if(side===lastSide){ fail++; Lab.beep(160,.1,'sawtooth'); if(fail>=3){ Lab.gameover({title:"Slipped",message:"Climbed: "+score}); return; }}
    else { lastSide=side; score++; Lab.setScore(score); Lab.beep(700,.04);}
  }];
  Lab.loop(dt=>{
    t+=dt;
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    const cx=Lab.W/2;
    const stepH=40;
    for(let i=-5;i<15;i++){
      const y = Lab.H - 120 + i*stepH - (score%2)*stepH*0.5;
      const left = (i+score)%2===0;
      c.fillStyle="#1c2546";
      c.fillRect(left? cx-110:cx, y, 110, stepH-4);
    }
    // figure
    const py = Lab.H-150;
    c.fillStyle="#5af";
    const xoff = lastSide==='L'? -40 : 40;
    c.fillRect(cx+xoff-12, py-30, 24, 50);
    c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Steps: "+score+" • Slip: "+fail+"/3", Lab.W/2, 70);
    c.fillText("Tap "+(lastSide==='L'?"RIGHT side":lastSide==='R'?"LEFT side":"either side"), Lab.W/2, Lab.H-50);
  });
}
start();
</script></body></html>
