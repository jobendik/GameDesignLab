(function(){ "use strict";
/* PLUMB LINE — draft a skyscraper one floor at a time: a floor plate glides over the tower, tap to set it; whatever
 * overhangs is sliced away and every floor above is that much narrower. Miss the tower completely and the job is over.
 * Identity: an architect's blueprint — cobalt paper, white line-work, drafting grid, altitude ruler, dimension labels,
 * a plumb bob hanging from the moving plate that lights up inside the perfect window. No physics, no fall: it stamps.
 * Depth: PERFECT streaks — from the third in a row each perfect cantilevers the floor wider again (8, 10, 12… up to
 * the lot width), so precision is the only way back from a bad slice. Every tenth floor is a SKY LOBBY (wider cornice,
 * bonus) and opens a new zone with its own facade and its own way of moving the plate:
 * STEADY, SWING (sine), EXPRESS (one-way passes), STUTTER (stop-go), GUSTS (surging speed), FEINT (fake reversals),
 * FLICKER (the plate fades in and out) — then round again, faster. The paper darkens from cobalt to night as you climb.

Lab.init({
  title: "Plumb Line", tagline: "Set every floor dead true.", category: "Stack & Physics",
  howto: ["Tap to set the gliding floor", "Overhang is sliced off for good", "3 perfects in a row grow it back"],
  theme: { bg: "#143a96", bg2: "#2a5fd0", fg: "#ffffff", muted: "#b9cdf5", accent: "#ffd166", accent2: "#7fd8ff" },
  orient: "portrait", music: { style: "puzzle", key: "E", bpm: 96, vol: .34 }, restart: start,
  attract: (dt, t) => { if (!floors) { demo = true; reset(); } update(dt, t); render(t); },

const { draw, fx, ease } = Lab, TAU = Lab.TAU, C = Lab.color, clamp = Lab.clamp;
const FH = 30, B0 = 200, ACC = "#ffd166", RED = "#ff8a7a", LINE = "#ffffff";
const PAT = ["STEADY", "SWING", "EXPRESS", "STUTTER", "GUSTS", "FEINT", "FLICKER"];
let W, H, S, VW, VH, PX, GY, TOPT, HUDY;
let demo = false, floors, mv, slices, cam, score, streak, bestStreak, perfects, zone, alive, spawnT, side, now, scenery, clouds, lastOff, grew, shownStreak, pulse;

function layout() { W = Lab.W; H = Lab.H; S = Math.min(W / 390, Lab.play.h / 700); VW = W / S; VH = H / S; PX = VW / 2; GY = VH - Lab.safe.bottom / S - 96; HUDY = Lab.play.y / S; TOPT = HUDY + (GY - HUDY) * .5; }

const tol = w => 4 + w * .012;
const top = () => floors[floors.length - 1];

const tri = u => { const m = ((u + 1) % 4 + 4) % 4; return m < 2 ? m - 1 : 3 - m; };

function reset() {

function start() {

  Lab.expose({
    get score() { return score; }, get floors() { return floors.length - 1; }, get width() { return top().w; }, get streak() { return streak; }, get bestStreak() { return bestStreak; }, get perfects() { return perfects; },
    get zone() { return zone + 1; }, get pattern() { return PAT[zone % 7]; }, get alive() { return alive; }, get ready() { return !!mv && alive; }, get speed() { return speed(); }, get tol() { return tol(top().w); },
    /* signed distance (u) from the gliding plate's centre to the centre of the top floor; null between plates */

function spawn() {

const FX = (x, wy) => [(PX + x) * S, (GY + cam + wy) * S];

function update(dt, t) {

  for (const c of clouds) { c.x += c.v * dt; if (c.x > 400) c.x = -400; else if (c.x < -400) c.x = 400; }

  }
  for (const s of slices) { c.save(); c.translate(PX + s.x, gy + s.y - FH / 2); c.rotate(s.rot); c.globalAlpha = clamp(1.3 - s.t, 0, 1); c.fillStyle = "rgba(255,138,122,.25)"; c.fillRect(-s.w / 2, -FH / 2, s.w, FH); c.setLineDash([4, 3]); c.strokeStyle = RED; c.lineWidth = 1.6; c.strokeRect(-s.w / 2, -FH / 2, s.w, FH); c.setLineDash([]); c.restore(); } c.globalAlpha = 1;
  if (!demo) {
    // readout: floor, zone, streak pips
    const y0 = HUDY + 18;
    draw.text(c, "FLOOR " + (n - 1), 14, y0, { size: 13, color: "#fff", align: "left" });
    draw.text(c, "ZONE " + (zone + 1) + " · " + PAT[zone % 7], 14, y0 + 16, { size: 10.5, color: "rgba(255,255,255,.75)", align: "left", weight: 600 });
    for (let i = 0; i < 3; i++) { const x = VW - 22 - (2 - i) * 17, on = streak > i; c.save(); c.translate(x, y0); c.rotate(Math.PI / 4); const k = on ? 6 + (i === Math.min(3, streak) - 1 ? pulse * 3 : 0) : 5; c.fillStyle = on ? ACC : "rgba(255,255,255,.22)"; c.fillRect(-k, -k, k * 2, k * 2); c.restore(); }
    draw.text(c, streak >= 3 ? "GROWING ×" + streak : "3 perfects grow", VW - 12, y0 + 18, { size: 10.5, color: streak >= 3 ? ACC : "rgba(255,255,255,.7)", align: "right", weight: 600 });
    if (n === 1 && mv) draw.text(c, "Tap when the plumb bob meets the mark", PX, topY - FH - 62, { size: 14, color: "#fff", stroke: "rgba(10,30,90,.8)", strokeW: 4 });
  }
  c.restore();
}
Lab.boot();
})();
