<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Lights Out", instructions:"Tap a cell to toggle it and its neighbors. Turn all off.", restart:start});
let g, moves, N=5;
function start(){
  g=Array.from({length:N},()=>Array(N).fill(false));
  // scramble by random taps
  for(let i=0;i<7;i++){ toggle(Lab.randInt(0,N-1), Lab.randInt(0,N-1));}
  moves=0; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(), off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c<0||c>=N||r<0||r>=N) return;
    toggle(r,c); moves++; Lab.setScore(moves); Lab.beep(500,.03);
    if(g.every(row=>row.every(v=>!v))) Lab.win("All off in "+moves+" moves!");
  }];
  Lab.loop(()=>draw());
}
function toggle(r,c){ for(const [dr,dc] of [[0,0],[-1,0],[1,0],[0,-1],[0,1]]){ const nr=r+dr, nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N) continue; g[nr][nc]=!g[nr][nc];}}
function cellSize(){ return Math.min((Lab.W-40)/N, (Lab.H-260)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:170};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){ c.fillStyle=g[r][col]?"#ffd35a":"#22253a"; c.fillRect(off.x+col*cs+3, off.y+r*cs+3, cs-6, cs-6);}
}
start();
</script></body></html>
