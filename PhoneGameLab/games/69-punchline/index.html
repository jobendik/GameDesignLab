(function(){ "use strict";
/* PUNCHLINE — a music-box paper roll. Every punched hole is the next note of a real tune and YOUR tap plays it, so the

  SK = "A4 B4 C5 B4 A4 B4:.5 A4:.5 F4:2 E4 C4 E4 F4 E4 E4:.5 C4:.5 B3:2 ", GA = "D5:2 B4 G4:1.5 A4:.5 B4 ", GB = "C5:1.5 B4:.5 A4 G#4:1.5 F#4:.5 G#4 A4:3 ", GC = "C5:2 A4 A4:1.5 G#4:.5 A4 B4:2 G#4 ",
  MK = "A4:.5 B4:.5 C5:.5 D5:.5 E5:.5 C5:.5 E5 D#5:.5 B4:.5 D#5 D5:.5 A#4:.5 D5 A4:.5 B4:.5 C5:.5 D5:.5 E5:.5 C5:.5 E5:.5 A5:.5 G5:.5 E5:.5 C5:.5 E5:.5 ";
const SONGS = [

  { t: "Minuet in G", bar: 3, pick: 0, up: 0, roots: "G G C G C G D D G G C G C G D G", n: MN + "F#4 G4:.5 A4:.5 B4:.5 G4:.5 A4:3 " + MN + "A4 B4:.5 A4:.5 G4:.5 F#4:.5 G4:3" },
  { t: "Sakura", bar: 4, pick: 0, up: 12, roots: "A A A F A E A F A E A A F E", n: "A4 A4 B4:2 A4 A4 B4:2 " + SK + SK + "A4 A4 B4:2 A4 A4 B4:2 E4 F4 B4:.5 A4:.5 F4 E4:4" },
  { t: "Greensleeves", bar: 3, pick: 1, up: 0, roots: "A A G G A A E E A A G G A E A C C G G A A E E C C G G A E A", n: "A4 C5:2 D5 E5:1.5 F#5:.5 E5 " + GA + GC + "E4:2 A4 C5:2 D5 E5:1.5 F#5:.5 E5 " + GA + GB + "G5:3 G5:1.5 F#5:.5 E5 " + GA + GC + "E4:3 G5:3 G5:1.5 F#5:.5 E5 " + GA + GB.trim() },
  { t: "Hall of the Mountain King", bar: 4, pick: 0, up: 0, roots: "A A A C A A A A A A A C A A A A", n: MK + "G5:2 " + MK + "A4:2 " + MK + "G5:2 " + MK + "A5:2" },

const midiOf = n => Math.round(69 + 12 * Math.log2(Lab.audio.noteFreq(n) / 440));

Lab.onResize(() => { if (tiles) layout(); });
