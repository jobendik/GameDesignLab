<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Sniper Timing", instructions:"One bullet per round. Tap when the cross is over the target.", restart:start});
let cross, target, t, fired, score, rounds, missed;
function round(){
  fired=false;
  cross={x:Lab.W/2, dir:1, sp: 220+score*40};
  target={x:Lab.rand(80,Lab.W-80), w: Math.max(40, 120-score*5)};
}
function start(){
  score=0; rounds=10; missed=0; round();
  Lab.setScore("0/0");
  Lab.input.onTap=[()=>{
    if(fired) return;
    fired=true;
    const hit = Math.abs(cross.x-target.x)<target.w/2;
    if(hit){ score++; Lab.toast("Hit!"); Lab.beep(900,.06);} else { missed++; Lab.toast("Miss"); Lab.beep(180,.1,'sawtooth');}
    Lab.setScore(score+"/"+(score+missed));
    setTimeout(()=>{ if(score+missed>=rounds){ Lab.gameover({title:"Done",message:"Hits: "+score+"/"+rounds}); } else round(); }, 800);
  }];
  Lab.loop(dt=>{
    if(!fired){ cross.x+=cross.dir*cross.sp*dt; if(cross.x<10){cross.dir=1;} else if(cross.x>Lab.W-10){cross.dir=-1;} }
    const c=Lab.ctx; c.fillStyle="#152418"; c.fillRect(0,0,Lab.W,Lab.H);
    const ty=Lab.H/2;
    c.fillStyle="#aa3322"; c.fillRect(target.x-target.w/2, ty-30, target.w, 60);
    c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Target", target.x, ty);
    // bar
    c.fillStyle="#222"; c.fillRect(20, Lab.H-80, Lab.W-40, 30);
    c.fillStyle="#5af"; c.fillRect(cross.x-3, Lab.H-90, 6, 50);
    if(fired){
      c.strokeStyle="#ffd35a"; c.lineWidth=2; c.beginPath(); c.moveTo(cross.x,Lab.H-90); c.lineTo(cross.x,ty); c.stroke();
    }
    c.fillStyle="#7e89b3"; c.fillText("Round "+(score+missed+1)+"/"+rounds, Lab.W/2, 70);
  });
}
start();
</script></body></html>
