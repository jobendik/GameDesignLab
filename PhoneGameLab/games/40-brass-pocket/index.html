(function(){ "use strict";
/* BRASS POCKET — solo pocket billiards on a small burgundy table in a quiet back room.
 * Core idea kept: drag back to aim and power the cue ball, pot the balls.  Now a shot-economy ladder: every shot costs

  theme: { bg: "#170b0c", bg2: "#3a1a1c", accent: "#d9a441", accent2: "#c8553d" },
  orient: "any", music: { style: "chill", key: "Bb", bpm: 84, vol: .3 }, restart: start,

  { cue: [110, 320], b: [[60, 100], [160, 100], [110, 160], [44, 215]] },
  { cue: [110, 320], b: [[50, 62], [170, 62], [58, 225], [164, 178]], brass: [110, 120], tip: "The brass ball goes down last" },
  { cue: [110, 320], b: tri(110, 150, 3), tip: "Break them up" },
  { cue: [160, 330], b: [[40, 80], [180, 80], [110, 132], [40, 300]], brass: [110, 236], posts: [[70, 200], [150, 200]], tip: "Brass posts on the cloth" },

/* ---------- layout: the table is always simulated upright; landscape just draws it rotated ---------- */

/* ---------- world ---------- */

    draw.rect(g, -RAIL - 3, -RAIL - 3, TW + RAIL * 2 + 6, TH + RAIL * 2 + 6, 16, "#5b3320");

}
