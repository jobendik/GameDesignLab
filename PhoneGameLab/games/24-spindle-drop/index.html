(function(){ "use strict";
/* SPINDLE DROP — a glass marble bounces down a wooden toy spindle stacked with painted discs.

 * Depth: PLUNGE — every floor passed without a bounce is worth one more (10, 20, 30…); after three the marble runs hot

const LOOKS = [

  { a: "#7d8fe0", b: "#bfe3d0", bg1: "#eef7ee", bg2: "#cfe8dc", dot: "#b5d9c8" },
  { a: "#e9b44c", b: "#c9c2ee", bg1: "#f3f0fd", bg2: "#d8d2f2", dot: "#c3bbe8" },
  { a: "#8d7be0", b: "#ffd1dc", bg1: "#fff1f4", bg2: "#f9d0da", dot: "#f2b9c6" },

const shadeTab = {};

let discs, ball, rot, rotT, camY, maxBy, level, nFloors, floors, totalFloors, score, streak, bestStreak, smashes, gems, alive, clearing, bounces, dragged, hintT, look;

function layout() { W = Lab.W; H = Lab.H; S = Math.min(W / 390, Lab.play.h / 700); CX = W / S / 2; R = Math.min(W * .39, 158 * S) / S; RP = R * .23; RB = R * .76; anchor = (Lab.play.y + Lab.play.h * .27) / S; }

const sens = () => TAU / (W * .85);

    get rot() { return rot; }, get score() { return score; }, get streak() { return streak; }, get bestStreak() { return bestStreak; }, get level() { return level; }, get floors() { return totalFloors; },
    get smashes() { return smashes; }, get gems() { return gems; }, get alive() { return alive; }, get bounces() { return bounces; }, get by() { return ball.by; }, get vy() { return ball.vy; }, get sens() { return sens(); },

  });

/* ---------- level building */

  if (streak >= 2) { const pu = 1 + .12 * Math.sin(t * 16); draw.text(c, "×" + streak, CX + 34, y - 4, { size: (17 + Math.min(streak, 6) * 2) * pu, color: streak >= 3 ? "#e8553f" : "#3b2a3a", stroke: "#fffaf0", align: "left" }); }
}

/* ---------- render */
function frame(dt, t) { update(dt); if (!dragged) hintT += dt; render(t); }
function render(t) {

    drawPole(c, above ? above.y - camY : -60, d.y - camY, grad);

  const hz = c.createLinearGradient(0, 0, 0, Lab.play.y + 50); hz.addColorStop(0, C.alpha(look.bg1, .92)); hz.addColorStop(1, C.alpha(look.bg1, 0)); c.fillStyle = hz; c.fillRect(-40, -40, W + 80, Lab.play.y + 90);

  draw.circle(c, rx, r0 - 16 * u, 12 * u, "#3b2a3a"); draw.text(c, String(level), rx, r0 - 15.5 * u, { size: 13 * u, color: "#fffaf0" }); draw.text(c, "LV", rx, r0 + rl + 14 * u, { size: 9 * u, color: "rgba(59,42,58,.6)" });
  if (!dragged && alive && hintT < 8) { const a = Math.min(1, hintT * 2) * (.7 + .3 * Math.sin(t * 5)), y = H - Lab.safe.bottom - 96 * u, dx = Math.sin(t * 2.4) * 44 * u; c.globalAlpha = a; draw.text(c, "DRAG TO TWIST", W / 2, y, { size: 20 * u, color: "#3b2a3a", stroke: "#fffaf0" }); draw.circle(c, W / 2 + dx, y + 32 * u, 11 * u, "rgba(59,42,58,.85)", "#fffaf0", 2); c.globalAlpha = 1; }

Lab.boot();
})();
