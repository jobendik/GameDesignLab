</head><body><script>
(function(){ "use strict";
/* FROSTFOOT — an endless dash across a frozen ridge with a long-eared snow sprite and its red scarf.
 * Core idea kept: side-scrolling auto-runner, jump the obstacles, slide under the high ones.
 * Controls: tap = jump (hold longer = higher, tap again in the air = flip jump), swipe down = slide / dive.
 * Forgiveness: 90 ms coyote time, 130 ms jump buffer, inset hitboxes, minimum hop always clears a low spike.
 * Depth: obstacle patterns are authored chunks (in seconds, so they stay fair as speed ramps) across four tiers;

Lab.init({
  title: "Frostfoot", tagline: "Hop the ice. Slide the gates. Keep the scarf burning.", category: "Runner & Movement",
  howto: ["Tap to jump — hold for height, tap again to flip", "Swipe down to slide under gates", "Collect embers to ignite a Blaze dash"],
  theme: { bg: "#232a63", bg2: "#7b8fd9", accent: "#ff5d5d", accent2: "#ffb347" },
  orient: "any", music: { style: "arcade", key: "A", bpm: 132, vol: .3 }, restart: start,
  attract(dt, t) { if (!demo) { reset(); demo = true; } now = t; speed = 300; dist += speed * dt; p.runPh += dt * 13; scarfStep(dt); render(t, dt); },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp;
const GRAV = 2600, JUMP = 900, JUMP2 = 780, COYOTE = .09, BUFFER = .13, HW = 11, HSTAND = 44, HSLIDE = 22, BLAZE_NEED = 18, BLAZE_TIME = 5, TW = 640;
const ZONES = [
  { n: "DAWN", at: 0, sky: ["#6f7fd6", "#f2b6c6", "#ffe6c8"], far: "#b9bbe8", mid: "#8f9bd8", pine: "#4d5c9e", snow: "#fbfbff", shade: "#d6def6", deep: "#aab6e6", sun: "#fff3cf", sy: .62 },
  { n: "MORNING", at: 300, sky: ["#3f9ade", "#9fd6f2", "#eaf8fc"], far: "#bcdcf0", mid: "#86bfe0", pine: "#2e6c8c", snow: "#ffffff", shade: "#d2eaf6", deep: "#9fcbe6", sun: "#ffffff", sy: .2 },
  { n: "DUSK", at: 700, sky: ["#3a2e6a", "#c85c7b", "#ffb46e"], far: "#8b5e95", mid: "#5f4582", pine: "#33285b", snow: "#ffeae6", shade: "#e6bccb", deep: "#b98bb0", sun: "#ffd28e", sy: .7 },
  { n: "AURORA", at: 1200, sky: ["#071130", "#11305b", "#1f6e78"], far: "#1e3c69", mid: "#162c55", pine: "#0b1838", snow: "#d3e8ff", shade: "#94b4e2", deep: "#5f7fba", sun: "#eaf5ff", sy: .22, night: true },
];
/* chunks: [kind, time(s) after chunk start, a, b].  kinds: s spike · b block · w wide ridge · g gate (slide or leap) · G wall gate (slide)
 * · p pit (a = width in s) · e ember row (a = height, b = count) · E ember arc over a jump (a = peak height, b = count) */
const CHUNKS = [
  [ { len: .5, it: [["s", 0], ["E", -.12, 105, 3]] }, { len: .6, it: [["g", 0], ["e", -.1, 14, 3]] }, { len: 1.1, it: [["e", 0, 26, 5], ["s", .9]] }, { len: .4, it: [["e", 0, 26, 4]] } ],
  [ { len: 1.1, it: [["s", 0], ["s", .78], ["E", -.12, 105, 3]] }, { len: .5, it: [["b", 0], ["E", -.1, 150, 3]] }, { len: .6, it: [["p", 0, .32], ["E", .02, 110, 4]] }, { len: 1.2, it: [["g", 0], ["e", -.08, 14, 3], ["s", .85]] }, { len: .6, it: [["w", 0], ["E", -.02, 120, 4]] } ],
  [ { len: 1.6, it: [["s", 0], ["g", .64], ["e", .58, 14, 3], ["s", 1.3]] }, { len: 1.2, it: [["p", 0, .36], ["E", .04, 115, 4], ["s", .86]] }, { len: .7, it: [["G", 0], ["e", -.1, 14, 4]] }, { len: 1.3, it: [["b", 0], ["p", .78, .3], ["E", .8, 110, 3]] },
    { len: 1.5, it: [["s", 0], ["s", .4], ["E", .0, 135, 4], ["g", 1.12]] }, { len: .8, it: [["w", 0], ["e", .02, 150, 1], ["e", .12, 200, 1], ["e", .22, 235, 1], ["e", .32, 200, 1]] } ],
  [ { len: 1.5, it: [["g", 0], ["s", .52], ["g", 1.04], ["e", .98, 14, 3]] }, { len: 1.3, it: [["p", 0, .34], ["p", .74, .34], ["E", .04, 110, 3], ["E", .78, 110, 3]] }, { len: 1.2, it: [["b", 0], ["G", .64], ["e", .56, 14, 4]] },
    { len: 1.5, it: [["p", 0, .5], ["E", .08, 150, 5], ["s", .98]] }, { len: 1.4, it: [["s", 0], ["s", .42], ["s", .84], ["E", -.1, 120, 7]] }, { len: 1.8, it: [["G", 0], ["b", .62], ["G", 1.24], ["e", 1.16, 14, 3]] } ],
];
let S, PX, gy, viewU, vmax;
let p, obs, embers, flags, flakes, scarf, dist, speed, runT, score, bonus, emberN, meter, blaze, grace, smashes, nextX, tier, zone, zoneOld, zoneMix, dead, deadT, now, demo = false, held, kHeld, downHeld, pressJump, lastMile, bestDist, hintJump, hintSlide, lastChunk, sprayT, stepT, hookHeld = false;

function layout() {

Lab.onResize(() => { if (p) layout(); });

  Lab.input.onKey = [k => { if (k === " " || k === "ArrowUp" || k === "w" || k === "W") { pressJump = false; jumpPress(); } else if (k === "ArrowDown" || k === "s" || k === "S") slide(); }];
  Lab.expose({
    get score() { return score; }, get dist() { return dist / 40; }, get speed() { return speed; }, get embers() { return emberN; }, get meter() { return meter; }, get blaze() { return blaze; }, get smashes() { return smashes; }, get dead() { return dead; }, get tier() { return tier; }, get zone() { return zone; },
    get p() { return { y: p.y, vy: p.vy, on: p.on, slide: p.slide, air: p.air, jumps: p.jumps, flips: p.flips, slides: p.slides, peak: p.peak }; },
    get next() { for (const o of obs) { const dx = o.x - dist - HW; if (o.x + o.w > dist - HW && !o.gone) return { k: o.k, dx, w: o.w, h: o.h }; } return null; },
    jump: jumpPress, hold(v) { hookHeld = !!v; }, slide,
    calm(sec) { obs = []; embers = []; nextX = dist + speed * sec; }, setMeter(n) { meter = n; if (meter >= BLAZE_NEED) ignite(); }, setRun(t) { runT = t; },
    put(kind, ahead, a, b) { addItem(kind, dist + ahead, a, b); },
  });

}

/* ---------- level stream ---------- */
function addItem(k, x, a, b) {
  if (k === "s") obs.push({ k, x, w: 30, h: 34 }); else if (k === "b") obs.push({ k, x, w: 34, h: 80 }); else if (k === "w") obs.push({ k, x, w: 112, h: 30 });
  else if (k === "g") obs.push({ k, x, w: 58, h: 0, seed: Lab.randInt(1, 99) }); else if (k === "G") obs.push({ k, x, w: 74, h: 0, seed: Lab.randInt(1, 99) });
  else if (k === "p") obs.push({ k, x, w: a * speed, h: 0 });
  else if (k === "e") for (let i = 0; i < b; i++) embers.push({ x: x + i * 34, y: -a, ph: i * .6 });
  else if (k === "E") { const span = .62 * speed; for (let i = 0; i < b; i++) { const u = b === 1 ? .5 : i / (b - 1); embers.push({ x: x + u * span, y: -(36 + (a - 36) * 4 * u * (1 - u)), ph: i * .6 }); } }

function spawn() {
  while (nextX < dist + viewU + 260) {

    const lo = runT < 20 ? 0 : runT < 45 ? Math.max(0, tier - 1) : Math.max(1, tier - 1), t = Lab.randInt(lo, tier);

  while (obs.length && obs[0].x + obs[0].w < dist - viewU * .4) obs.shift();
  while (embers.length && embers[0].x < dist - 200) embers.shift();

/* ---------- player verbs ---------- */

}
function doJump() {

}
function slide() {
  if (dead || demo) return; hintSlide = false; downHeld = true;

}
function startSlide() { p.slide = .56; p.dive = false; p.slides++; p.sx = 1.3; p.sy = .7; Lab.sfx("slide", { pitch: .7 }); Lab.audio.noise({ dur: .4, vol: .09, bp: 2400, f2: 900, q: .8 }); }

  fx.burst(PX, gy + p.y * S - 22 * S, { n: 26, colors: ["#ffb347", "#ff5d5d", "#fff3cf"], speed: 320, life: .7, size: 5, shape: "spark", gravity: 100 });
}
function die(kind) {

  Lab.sfx(kind === "fell" ? "whistle" : "hit", { pitch: kind === "fell" ? .6 : 1 }); Lab.sfx("hurt"); Lab.shake(13, .45); Lab.hitstop(.09); Lab.flash("#ffffff", .15, .5); Lab.buzz(60);

function stepRun(dt) {   // one ≤1/120 s slice of running: identical hop heights and hit tests at any frame rate
  runT += dt;

    else { x0 = o.x + 6; x1 = o.x + o.w - 6; y0 = -(o.h - 6); y1 = 0; }

      else { die("hit"); break; }

    Lab.audio.combo((emberN % 8) + (blaze > 0 ? 4 : 0), { vol: .13, dur: .1 }); fx.burst(PX + 6 * S, gy + e.y * S, { n: 5, colors: ["#ffb347", "#fff3cf"], speed: 120, life: .35, size: 3, gravity: -100, vx: -speed * S * .3 });
  }
  if (blaze > 0) { blaze -= dt; if (blaze <= 0) { blaze = 0; grace = .9; Lab.sfx("drop", { pitch: .8 }); } else if (Math.random() < dt * 40) fx.burst(PX - 12 * S, gy + p.y * S - 26 * S, { n: 1, colors: ["#ffb347", "#ff5d5d"], speed: 60, life: .5, size: 4, gravity: -200, vx: -speed * S * .6 }); }

function frame(dt, t) {

    for (const f of flags) if (!f.hit && f.x < dist) { f.hit = true; if (f.best) { fx.text(PX + 40 * S, gy - 120 * S, "NEW BEST DISTANCE", { color: "#ffb347", size: 17 }); Lab.sfx("star"); } else { Lab.sfx("chime", { pitch: 1 }); fx.text(PX + 30 * S, gy - 120 * S, f.label, { color: "#fff", size: 22 }); } }

/* ---------- drawing ---------- */
function skySprite(zi) {
