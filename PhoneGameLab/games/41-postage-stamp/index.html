(function(){ "use strict";
/* POSTAGE STAMP — free kicks, seen from behind the ball, printed like a three-ink match-day poster.
 * ("Putting it in the postage stamp" = the top corner; here the corners really have stamps to frank.)

 * lets go is where the ball is headed, how fast you swipe is how hard it is struck (flight time), and the bow of the
 * path is the curl (the ball flies the shape you drew, around or over the wall).  The keeper leans before the kick

Lab.init({
  title: "Postage Stamp", tagline: "Bend free kicks into the top corner.", category: "Arcade & Action",
  howto: ["Swipe from the ball — it flies to where you let go", "Swipe fast to beat the keeper, curve to bend it", "Frank the stamps. Three misses and it's over"],
  theme: { bg: "#efe3cb", bg2: "#f7efdc", fg: "#1d2a44", muted: "#6c7488", accent: "#e8503a", accent2: "#1f7a78", light: true },
  orient: "any", music: { style: "march", key: "D", bpm: 108, vol: .28 }, restart: start,

const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp;

/* ---------- kick setup ---------- */

const stampX = (s, t) => s.bx + (s.amp ? s.amp * Math.sin(s.ph + t * s.sp) : 0);

/* ---------- the shot: target on the goal plane, power 0..1, curl = sideways acceleration (m/s²) ---------- */
