<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Knife Throw", instructions:"Tap to throw. Don't hit other knives!", restart:start});
let target, knives, throwing, knivesLeft, score, level;
function newLevel(){
  level++; knivesLeft=5+level;
  target={x:Lab.W/2,y:Lab.H*0.4,r:90,a:0,sp:1.2+level*0.25*(Math.random()<0.5?-1:1), knives:[], apples:[]};
  // pre-existing knives
  const pre=Math.min(level,4);
  for(let i=0;i<pre;i++) target.knives.push(Math.random()*Lab.TAU);
  for(let i=0;i<2+level;i++) target.apples.push(Math.random()*Lab.TAU);
}
function start(){
  score=0; level=0; newLevel(); throwing=null;
  Lab.setScore(0);
  Lab.input.onTap=[()=>{
    if(throwing) return;
    throwing={y:Lab.H-100, vy:-1100};
  }];
  Lab.loop(dt=>{
    target.a+=target.sp*dt;
    if(throwing){
      throwing.y+=throwing.vy*dt;
      if(throwing.y<target.y+target.r){
        // stick at angle relative to target rotation
        const stickAngle = -Math.PI/2 - target.a;
        // collide with existing knives or apples
        for(const k of target.knives){
          const dA=Math.abs(((stickAngle-k+Math.PI*3)%(Lab.TAU))-Math.PI);
          if(dA>Math.PI-0.16){ Lab.gameover({title:"Crash!",message:"Score: "+score}); return; }
        }
        for(let i=0;i<target.apples.length;i++){
          const a=target.apples[i];
          const dA=Math.abs(((stickAngle-a+Math.PI*3)%(Lab.TAU))-Math.PI);
          if(dA>Math.PI-0.12){ target.apples.splice(i,1); score+=5; }
        }
        target.knives.push(stickAngle);
        knivesLeft--; score++; Lab.setScore(score); Lab.beep(900,.05);
        if(knivesLeft<=0){ Lab.toast("Level "+(level+1)); newLevel(); }
        throwing=null;
      }
    }
    const c=Lab.ctx; c.fillStyle="#2a1c10"; c.fillRect(0,0,Lab.W,Lab.H);
    // target
    c.save(); c.translate(target.x,target.y); c.rotate(target.a);
    c.beginPath(); c.fillStyle="#883322"; c.arc(0,0,target.r,0,Lab.TAU); c.fill();
    c.fillStyle="#aa4433"; for(let i=0;i<6;i++){ c.beginPath(); c.arc(0,0,target.r-i*12,0,Lab.TAU); c.stroke();}
    // stuck knives
    for(const k of target.knives){
      c.save(); c.rotate(k); c.fillStyle="#ddd"; c.fillRect(-3,target.r,6,80); c.fillStyle="#553"; c.fillRect(-6,target.r+60,12,30); c.restore();
    }
    for(const a of target.apples){ c.save(); c.rotate(a); c.beginPath(); c.fillStyle="#3df58a"; c.arc(0,target.r+20,12,0,Lab.TAU); c.fill(); c.restore();}
    c.restore();
    // queue
    for(let i=0;i<knivesLeft;i++){
      c.fillStyle="#ddd"; c.fillRect(20+i*14, Lab.H-30, 8, 22);
    }
    // throwing knife
    c.fillStyle="#fff";
    if(throwing){ c.fillRect(Lab.W/2-4, throwing.y, 8, 60); }
    else { c.fillRect(Lab.W/2-4, Lab.H-100, 8, 60); }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Level "+(level+1)+" • Knives left: "+knivesLeft, Lab.W/2, 70);
  });
}
start();
</script></body></html>
