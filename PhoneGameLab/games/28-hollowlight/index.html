<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hollowlight</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* HOLLOWLIGHT — a glow-moth carries its light down a narrowing cave.  Hold to rise, release to sink, with soft inertia.
 * The cave is DARK: you see what your glow reaches, and every press sends out an echo of light that sweeps the tunnel
 * ahead for a moment (its pitch tells you how tight the passage is).  One resource — GLOW: it is your sight radius and
 * your health. It fades slowly, a wall knocks a third of it out of you, drifting motes restore it, and big blooms hug
 * the walls where grabbing them is a risk. Stay radiant (glow > 85 %) and distance counts double.
 * Identity: quiet, moody, bioluminescent; warm gold moth against cold rock; sparse spooky music, echoing pings.     */
Lab.init({
  title: "Hollowlight", tagline: "Carry your glow through the dark.", category: "Runner & Movement",
  howto: ["Hold to rise, release to sink", "Each press sends an echo of light down the tunnel", "Motes restore your glow — walls knock it out"],
  theme: { bg: "#070812", bg2: "#1a2440", accent: "#ffd978", accent2: "#7fe6c8" },
  orient: "any", music: { style: "spooky", key: "E", bpm: 76, vol: .42 }, restart: start, attract: (dt, t) => { if (!M) setup(); dist += 40 * dt; ensure(); M.y = (caveAt(dist).top + caveAt(dist).bot) / 2; ambient(dt); render(t); },
});
const { draw, fx } = Lab, TAU = Lab.TAU, mix = Lab.color.mix, clamp = Lab.clamp;
const STEP = 12, R = 10, ZLEN = 300;
const ZONES = [
  { n: "Mossy Hollow", rock: "#24383a", edge: "#6fd0a0", a: "#14283a", b: "#0a1220", glow: "#9dffb0" },
  { n: "Crystal Vein", rock: "#2a2850", edge: "#9aa2ff", a: "#18163c", b: "#0b0a22", glow: "#b8c4ff" },
  { n: "Ember Narrows", rock: "#40262f", edge: "#ff9a6a", a: "#2a141e", b: "#120810", glow: "#ffc08a" },
  { n: "The Deep Dark", rock: "#1b1c2e", edge: "#7fe6ff", a: "#0b0c1a", b: "#050508", glow: "#9ff0ff" },
];
let S, Hu, top0, jx;                               // 1u = S px; cave y in u inside a band of height Hu
let M, tops, bots, i0, gi, G, motes, spikes, rings, dust, trail, dist, speed, light, started, alive, score, pts, moteN, bumps, pings,

function layout() {

  if (M && old && Math.abs(old - Hu) > .5) { const k = Hu / old; M.y *= k; G.c *= k; G.ct *= k; for (let i = 0; i < tops.length; i++) { tops[i] *= k; bots[i] *= k; } for (const m of motes) m.y *= k; for (const s of spikes) s.y *= k; }
}
Lab.onResize(layout);
const X = wx => jx + (wx - dist) * S, Y = u => top0 + u * S;
const hash = n => { n = Math.imul((n | 0) ^ seed, 0x45d9f3b); n ^= n >>> 15; n = Math.imul(n, 0x2c1b3c6d); n ^= n >>> 13; return (n >>> 0) / 4294967296; };

  tops = []; bots = []; i0 = -Math.ceil(jx / S / STEP) - 4; gi = i0; motes = []; spikes = []; rings = []; trail = [];
  G = { c: Hu / 2, cv: 0, ct: Hu / 2, left: 0, sp: null, spIn: 30, moteIn: 4, bloomIn: 60 };
  dist = 0; speed = 170; light = 1; started = false; alive = true; score = 0; pts = 0; moteN = 0; bumps = 0; pings = 0; depth = 0; zoneF = 0;
  held = false; testHold = false; pingCd = 0; chain = 0; chainT = 0; warnT = 0; flutT = 0; deathT = 0; trailT = 0;
  dust = Array.from({ length: 22 }, () => ({ x: Math.random(), y: Math.random(), p: Lab.rand(0, TAU), s: Lab.rand(.6, 1.6) }));

}
function start() {

  Lab.expose({
    get y() { return M.y; }, get vy() { return M.vy; }, get light() { return light; }, get metres() { return Math.floor(dist / 30); }, get score() { return score; },
    get motes() { return moteN; }, get alive() { return alive; }, get started() { return started; }, get depth() { return depth; }, get height() { return Hu; },
    get bumps() { return bumps; }, get pings() { return pings; }, get inv() { return M.inv > 0; },
    ahead(dx) { return caveAt(dist + (dx || 0)); }, setHold(v) { testHold = !!v; }, press, setLight(v) { light = v; }, warp(m) { dist = m * 30; ensure(); const c = caveAt(dist); M.y = (c.top + c.bot) / 2; M.vy = 0; },
  });

/* ---------------------------------------------------------------- cave generator (one column every 12u) */

}
function ensure() {

}
function caveAt(wx) { const f = wx / STEP - i0, k = clamp(Math.floor(f), 0, tops.length - 2), u = clamp(f - k, 0, 1); return { top: tops[k] + (tops[k + 1] - tops[k]) * u, bot: bots[k] + (bots[k + 1] - bots[k]) * u }; }

/* ---------------------------------------------------------------- actions */

}

  Lab.sfx("thud", { pitch: 1.2 }); Lab.sfx("glass", { pitch: .55 }); Lab.shake(8, .25); Lab.hitstop(.05); Lab.buzz(40);
  fx.burst(X(dist), Y(M.y), { n: 16, colors: ["#ffe9a0", "#fff", "#ffc85a"], speed: 240, life: .8, size: 3.5 * S, gravity: 120, glow: 6 });

function die(title) {

  Lab.audio.tone({ f: 520, f2: 70, dur: 1.1, type: "triangle", vol: .16 }); Lab.sfx("hurt", { pitch: .7 }); Lab.buzz(70);
  Lab.after(1.15, () => Lab.gameover({ title, score, stats: [["Distance", Math.floor(dist / 30) + " m"], ["Motes", moteN], ["Reached", ZONES[Math.min(depth, 3)].n]] }));
}

  const gain = m.big ? 25 : 5; pts += gain; light = Math.min(1, light + (m.big ? .2 : .035));
  if (m.big) { Lab.sfx("chime", { pitch: .8 }); Lab.sfx("gem", { pitch: .7 }); fx.ring(X(m.wx), Y(m.y), { r0: 8, r1: 70 * S, color: "#fff3c0", width: 4 }); Lab.buzz(14); }
  else Lab.audio.tone({ f: Lab.audio.scaleFreq(chain % 10, 67), dur: .3, vol: .1 });
  fx.burst(X(m.wx), Y(m.y), { n: m.big ? 14 : 5, colors: ["#fff3c0", "#ffd978", "#bfffe6"], speed: m.big ? 200 : 110, life: .6, size: 3 * S, gravity: -30, glow: 6 });
  fx.text(X(m.wx), Y(m.y) - 20 * S, "+" + gain, { size: (m.big ? 19 : 13) * S, color: "#fff3c0" });
}

function ambient(dt) {

function frame(dt, t) {

/* ---------------------------------------------------------------- art */
function glowSp(col) { return Lab.sprite("glow" + col, 64, 64, g => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32), [r, gg, b] = Lab.color.parse(col); gr.addColorStop(0, `rgba(${r},${gg},${b},.9)`); gr.addColorStop(.35, `rgba(${r},${gg},${b},.35)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }); }

}
function drawMoth(c, t) {
  const u = S * 1.3, x = X(dist), y = Y(M.y), fl = Math.sin(t * (held && alive ? 34 : 11)) * (held && alive ? 1 : .6);

    c.save(); c.scale(1, back ? -.9 : 1); c.rotate(-.5 - fl * .55 * (back ? .8 : 1)); c.fillStyle = back ? "rgba(255,225,150,.6)" : "rgba(255,246,216,.95)";

    c.beginPath(); c.ellipse(-8 * u, -3 * u, 5 * u, 7 * u, .9, 0, TAU); c.fillStyle = back ? "rgba(255,225,150,.5)" : "rgba(255,240,200,.9)"; c.fill(); c.restore();

  c.strokeStyle = "#ffe2a0"; c.lineWidth = 1.3 * u; c.lineCap = "round"; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(9 * u, -5 * u); c.quadraticCurveTo(13 * u, (-11 - s * 2) * u, (17 + s) * u, (-10 + s * 2 + Math.sin(t * 6 + s) * 1) * u); c.stroke(); }

  else { draw.circle(c, 10 * u, -1.5 * u, 2.3 * u, "#3a2a20"); draw.circle(c, 10.8 * u, -2.3 * u, .8 * u, "#fff"); }

function edgePath(c, arr, n) { c.beginPath(); for (let k = 0; k < n; k++) { const x = X((i0 + k) * STEP), y = Y(arr[k]); k ? c.lineTo(x, y) : c.moveTo(x, y); } }
function render(t) {

  for (let k = 0; k < n; k++) { const i = i0 + k, x = X(i * STEP); if (x < -10 || x > W + 10) continue; const tw = .35 + .25 * Math.sin(t * 2 + i); if (hash(i * 3 + 1) < .13) { c.globalAlpha = tw; c.drawImage(gs, x - 7 * S, Y(tops[k]) - 7 * S, 14 * S, 14 * S); } if (hash(i * 3 + 2) < .13) { c.globalAlpha = tw; c.drawImage(gs, x - 7 * S, Y(bots[k]) - 7 * S, 14 * S, 14 * S); } }
