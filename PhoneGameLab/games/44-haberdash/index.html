function goalIcon(c, k, x, y, s) {

const goalPos = i => wide ? { x: panel.x + panel.w * .32, y: panel.y + 132 + i * 54 } : { x: panel.x + 34 + i * Math.min(88, (panel.w - 96) / 3), y: panel.y + panel.h * .6 };
