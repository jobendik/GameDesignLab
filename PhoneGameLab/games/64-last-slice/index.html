(function(){ "use strict";
/* LAST SLICE — a picnic-blanket tower defence. Bugs march a crumb trail toward your pie; condiments fight back.

const TW = [

  { id: "pepper", name: "Pepper", cost: 80, up: [70, 120], range: [2, 2.2, 2.5], rate: [.9, 1, 1.15], dmg: [9, 14, 22], splash: [.9, 1.05, 1.25], note: "splash" },
  { id: "honey", name: "Honey", cost: 60, up: [50, 90], range: [1.7, 1.95, 2.25], slow: [.35, .45, .55], dps: [0, 0, 2.5], note: "slows" },
  { id: "cork", name: "Popper", cost: 110, up: [90, 150], range: [3.6, 4, 4.5], rate: [.6, .7, .85], dmg: [26, 42, 70], air: true, pierce: true, note: "pierce · air" },

  wasp: { hp: 16, sp: 1.6, r: .22, gold: 7, fly: true, gap: .7 }, grub: { hp: 30, sp: .95, r: .25, gold: 6, split: 3, gap: .9 }, mite: { hp: 6, sp: 1.9, r: .12, gold: 2, gap: .3 },

  [["beetle", 5], ["ant", 10], ["stag", 1]], [["wasp", 10], ["runner", 10], ["beetle", 3]], [["grub", 8], ["beetle", 4]], [["ant", 14], ["wasp", 8], ["beetle", 4]], [["runner", 20], ["grub", 6], ["beetle", 5]],

const SLICES = 8, GOLD0 = 150, CALL = 16;
let C, R, land0, path, onPath, flyLen, cs, gx, gy, panel, cards, bNext, bSpeed, stats, landNow, towers, enemies, shots, puffs, gold, lives, wave, queue, spawnT, nextT, speed, score, kills,

/* ------------------------------------------------------------------ setup */

    if (k >= "1" && k <= "4") pickCard(+k - 1); else if (k === " " || k === "n" || k === "N") callNext(); else if (k === "f" || k === "F") toggleSpeed();

    get gold() { return gold; }, get lives() { return lives; }, get wave() { return wave; }, get towers() { return towers; }, get enemies() { return enemies; }, get score() { return score; },
    get kills() { return kills; }, get speed() { return speed; }, get nextT() { return nextT; }, get queue() { return queue.length; }, get sel() { return sel; }, get armed() { return armed; },
    get spots() { return spots; }, get path() { return path; }, get level() { return lvl; }, get won() { return won; }, get over() { return over; }, TW, GOLD0, SLICES, WAVES: WAVES.length,
    cellXY(c, r) { return { x: gx + (c + .5) * cs, y: gy + (r + .5) * cs }; }, btn(id) { const b = id === "next" ? bNext : id === "speed" ? bSpeed : cards[id]; return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; },
    setGold(v) { gold = v; }, setLevel(v) { lvl = v; }, build(c, r, type) { return build(c, r, type, true); }, upgrade(t) { return upgrade(t, true); }, clearTowers() { towers = []; sel = null; },

  else { const ph = 138; area = { x: P.x + 6, y: P.y + 40, w: P.w - 12, h: P.h - 40 - ph - 8 }; panel = { x: P.x + 8, y: P.y + P.h - ph - 4, w: P.w - 16, h: ph }; }

  cards = [];

    for (let i = 0; i < 4; i++) cards.push({ x: panel.x + (i % 2) * (cw + 6), y: panel.y + 64 + Math.floor(i / 2) * (ch + 6), w: cw, h: ch });
    const y = panel.y + 64 + 2 * (ch + 6); bNext = { x: panel.x, y, w: panel.w, h: 46 }; bSpeed = { x: panel.x, y: y + 52, w: panel.w, h: Math.min(40, panel.y + panel.h - y - 52) };

Lab.onResize(() => { if (path) layout(); });

/* ------------------------------------------------------------------ input */
const inR = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

function pickCard(i) {

/* ------------------------------------------------------------------ simulation (all positions in cell units) */
function pathPos(d) { const i = clamp(Math.floor(d), 0, path.length - 2), f = clamp(d - i, 0, 1), a = path[i], b = path[i + 1]; return { x: lerp(a.c, b.c, f) + .5, y: lerp(a.r, b.r, f) + .5, dx: b.c - a.c, dy: b.r - a.r }; }
