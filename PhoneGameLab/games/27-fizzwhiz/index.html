<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fizzwhiz</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* FIZZWHIZ — a fox in goggles rides a shaken soda bottle down a seaside boardwalk at sundown.
 * Hold = fizz thrust (strong acceleration, real momentum), release = drop. Floor and awning are safe; the hazards are
 * carnival kit: festoon wires (straight, diagonal, spinning), catherine wheels, firework rockets that lock onto your height.
 * Twist: the FIZZ meter. Bottle caps fill it slowly, a CLOSE SHAVE (skimming a hazard) fills it fast. Full = SHAKEN!:
 * 4.5 s of invincible overdrive that smashes hazards for points — so the safest line is never the best one.
 * Pickups: magnet, and a bumper car (tap flips it between floor and awning; it takes one hit for you).
 * Caps are laid along a safe route through each hazard pattern, so the trail teaches the dodge.                   */
Lab.init({
  title: "Fizzwhiz", tagline: "Ride a shaken soda bottle down the sundown boardwalk.", category: "Runner & Movement",
  howto: ["Hold to fizz upward, release to drop", "Grab caps and skim past hazards to fill the FIZZ meter", "Full meter = SHAKEN! Smash through everything"],
  theme: { bg: "#2b1a5e", bg2: "#ff8f6b", accent: "#ffcf4a", accent2: "#ff5d8f" },
  orient: "any", music: { style: "funk", key: "A", bpm: 112, vol: .5 }, restart: start, attract: (dt, t) => { if (!P) setup(); time += dt; dist += 120 * dt; anim(dt); render(t); },
});
const { draw, fx } = Lab, TAU = Lab.TAU, mix = Lab.color.mix, clamp = Lab.clamp;
const R = 13, THRUST = 2300, GRAV = 1700, OD = 4.5;
const ZONES = [{ a: "#5a3aa0", m: "#ff7f8e", b: "#ffc878" }, { a: "#2a1d6c", m: "#8d4fb4", b: "#ff8a7c" }, { a: "#0c0f36", m: "#252a70", b: "#5b4196" }];
let S, jx, ceilY, floorY, Hu;                       // 1u = S px; y in u below the awning; x in u ahead of the fox
let P, haz, caps, picks, frontier, dist, time, speed, speedMul, alive, score, bonus, capN, shaves, smashes, fizz, od, magnet,
  capStreak, capT, hissT, tier, zoneF, chunkN, nextPick, pickKind, held, testHold, deathT, wasHeld;

function layout() {
  const old = Hu;
  S = Math.min(Lab.W / 440, Lab.play.h / 480, 1.3); jx = clamp(Lab.W * .2, 60 * S, 230 * S); ceilY = Lab.play.y + 16 * S;
  floorY = Math.min(Lab.H - Lab.safe.bottom - 36 * S, ceilY + 620 * S); Hu = (floorY - ceilY) / S;   // tall screens: the pier is raised, thumbs rest below it
  if (P && old) { const k = Hu / old; P.y *= k; for (const h of haz) { h.y *= k; if (h.v) h.len *= k; } for (const c of caps) c.y *= k; for (const p of picks) p.y *= k; }
}
Lab.onResize(layout);
const X = u => jx + u * S, Y = u => ceilY + u * S, viewR = () => (Lab.W - jx) / S;

function setup() {
  Hu = 0; P = null; layout();
  P = { y: Hu - R, vy: 0, ground: true, ceil: false, lean: 0, rot: 0, sq: 0, inv: 0, mode: 0, gdir: 1, flip: 1, carT: 0, run: 0, vx: 0, ox: 0 };
  haz = []; caps = []; picks = []; frontier = viewR() + 80; dist = 0; time = 0; speed = 290; speedMul = 1; alive = true; score = 0; bonus = 0; capN = 0; shaves = 0; smashes = 0;
  fizz = 0; od = 0; magnet = 0; capStreak = 0; capT = 9; hissT = 0; tier = 0; zoneF = 0; chunkN = 0; nextPick = 2600; pickKind = Lab.chance(.5) ? "magnet" : "car"; held = false; testHold = false; deathT = 0; wasHeld = false;
}
function start() {
  setup(); Lab.setScore(0);
  Lab.input.onDown = [() => press()];
  Lab.input.onKey = [k => { if (k === " " || k === "ArrowUp" || k === "w" || k === "W") press(); }];
  Lab.expose({
    get y() { return P.y; }, get vy() { return P.vy; }, get height() { return Hu; }, get metres() { return Math.floor(dist / 40); }, get score() { return score; },
    get caps() { return capN; }, get alive() { return alive; }, get mode() { return P.mode ? "car" : "jet"; }, get gdir() { return P.gdir; }, get fizz() { return fizz; },
    get overdrive() { return od > 0; }, get shaves() { return shaves; }, get smashes() { return smashes; }, get magnet() { return magnet > 0; }, get inv() { return P.inv > 0; }, get tier() { return tier; },
    setHold(v) { testHold = !!v; }, press, give: grant, setFizz(v) { fizz = v; },
    wireAhead(dx, off, len) { haz.push({ k: 0, x: dx || 260, y: P.y + (off || 0), len: len || 70, ang: Math.PI / 2, rot: 0, near: false, dead: false }); },
    warp(m) { dist = m * 40; time = Math.max(time, m / 9); },
    capAhead(dx) { caps.push({ x: dx || 200, y: P.y, taken: false, ph: 0 }); },
    guide() { let b = null; for (const c of caps) if (!c.taken && c.x > 20 && c.x < 190 && (!b || c.x < b.x)) b = c; return b ? b.y : null; },
  });
  Lab.loop(frame);
}
function press() {
  if (!alive || Lab.paused || !P) return;
  if (P.mode === 1) { P.gdir = -P.gdir; P.vy = P.gdir * 260; Lab.sfx("boing", { pitch: P.gdir < 0 ? 1.25 : .95 }); fx.puff(X(0), Y(P.y) - P.gdir * 18 * S, { n: 5 }); }
  else Lab.audio.tone({ f: 220, f2: 520, dur: .09, type: "triangle", vol: .09 });
}

/* ---------------------------------------------------------------- pattern generator */
function wire(x, yf, len, ang, rot) { haz.push({ k: 0, x, y: yf * Hu, len, ang, rot: rot || 0, near: false, dead: false }); }
function post(x, hf, fromFloor) { haz.push({ k: 0, x, y: (fromFloor ? 1 - hf / 2 : hf / 2) * Hu, len: hf * Hu, ang: Math.PI / 2, rot: 0, v: true, near: false, dead: false }); }
function wheel(x, yf, bob) { haz.push({ k: 1, x, y: yf * Hu, r: 32, bob: bob || 0, ph: Lab.rand(0, TAU), near: false, dead: false }); }
function rocket(delay) { haz.push({ k: 2, x: 9999, y: P.y, st: 0, t: -(delay || 0), near: false, dead: false }); }
function trail(x, pts) {                             // caps along a smooth safe route
  for (let d = pts[0][0], x1 = pts[pts.length - 1][0]; d <= x1; d += 38) {
    let i = 0; while (i < pts.length - 2 && d > pts[i + 1][0]) i++;
    const a = pts[i], b = pts[i + 1], u = clamp((d - a[0]) / (b[0] - a[0]), 0, 1), e = u * u * (3 - 2 * u);
    caps.push({ x: x + d, y: clamp(a[1] + (b[1] - a[1]) * e, .06, .94) * Hu, taken: false, ph: d * .05 });
  }
}
const CHUNKS = [
  x => { const a = Lab.rand(.16, .27), n = Lab.randInt(1, 2), pts = []; for (let i = 0; i <= n * 4; i++) pts.push([i * 110, .5 + Math.sin(i * Math.PI / 2) * a]); trail(x, pts); return n * 440 + 40; },
  x => { wire(x + 230, .7, 230, 0); trail(x, [[0, .52], [230, .42], [460, .52]]); return 480; },
  x => { wire(x + 230, .3, 230, 0); trail(x, [[0, .5], [230, .6], [460, .5]]); return 480; },
  x => { const h = Lab.rand(.36, .5); post(x + 200, h, true); trail(x, [[0, .64], [200, 1 - h - .2], [400, .64]]); return 420; },
  x => { const h = Lab.rand(.36, .5); post(x + 200, h, false); trail(x, [[0, .4], [200, h + .2], [400, .46]]); return 420; },
  x => { const g = clamp(.38 - tier * .02, .27, .38), c = Lab.rand(.32, .68); post(x + 220, c - g / 2, false); post(x + 220, 1 - c - g / 2, true); trail(x, [[0, .5], [220, c], [440, .5]]); return 460; },
  x => { const up = Lab.chance(.5), pts = [[0, .5]]; for (let i = 0; i < 3; i++) { const fl = (i % 2 === 0) === up; post(x + 170 + i * 250, .46, fl); pts.push([170 + i * 250, fl ? .24 : .76]); } pts.push([860, .5]); trail(x, pts); return 880; },
  x => { const c = Lab.rand(.4, .6), bob = tier >= 2 && Lab.chance(.5) ? 36 : 0; wheel(x + 220, c - .3, bob); wheel(x + 220, c + .3, bob); trail(x, [[0, .5], [220, c], [440, .5]]); return 460; },
  x => { const dn = Lab.chance(.5) ? 1 : -1, len = Math.min(330, Hu * .6), sl = Math.tan(.62) * dn / Hu, yy = d => .48 + (d - 240) * sl + dn * .23; wire(x + 240, .48, len, .62 * dn); trail(x, [[90, yy(90)], [390, yy(390)]]); return 500; },
  x => { const len = Math.min(210, Hu * .4); wire(x + 300, .5, len, Lab.rand(0, 3), (Lab.chance(.5) ? 1 : -1) * (1.3 + Math.min(tier, 6) * .1)); for (let i = 0; i < 8; i++) { const a = i * TAU / 8; caps.push({ x: x + 300 + Math.cos(a) * (len / 2 + 36), y: .5 * Hu + Math.sin(a) * (len / 2 + 36), taken: false, ph: i }); } return 600; },
  x => { const n = Math.min(3, 1 + Math.floor(tier / 2)); for (let i = 0; i < n; i++) rocket(i * .6); for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) caps.push({ x: x + 160 + i * 36, y: (.42 + r * .08) * Hu, taken: false, ph: i }); return 560; },
  x => { const up = Lab.chance(.5), a = up ? .3 : .7, b = 1 - a; wheel(x + 160, a); wheel(x + 350, b); wheel(x + 540, a); trail(x, [[0, .5], [160, b - (b - .5) * .25], [350, a - (a - .5) * .25], [540, b - (b - .5) * .25], [650, .5]]); return 680; },
];
function spawnChunk() {
  const n = chunkN++, pool = tier <= 0 ? 6 : tier === 1 ? 9 : 12;
  const id = n === 0 ? 0 : n < 3 ? Lab.randInt(1, 2) : Lab.randInt(n % 5 === 0 ? 0 : 1, pool - 1), x = frontier;
  frontier += CHUNKS[id](x) + Math.max(120, Lab.rand(170, 270) - tier * 12);
  if (tier >= 3 && id !== 10 && Lab.chance(.22)) rocket(.4);
  if (dist > nextPick && !picks.length) { picks.push({ x: frontier - 70, y: Lab.rand(.3, .7) * Hu, kind: P.mode === 1 ? "magnet" : pickKind, taken: false }); pickKind = pickKind === "car" ? "magnet" : "car"; nextPick = dist + Lab.rand(3000, 4200); }
}
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy || 1, u = clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1); return Math.hypot(px - ax - dx * u, py - ay - dy * u); }
const hy = h => h.y + (h.bob ? Math.sin(h.ph + time * 2.2) * h.bob : 0);
function clearance(h) {                              // distance from the fox's centre to the hazard's lethal surface
  if (h.k === 0) { const a = h.ang + h.rot * time, ex = Math.cos(a) * h.len / 2, ey = Math.sin(a) * h.len / 2; return segDist(0, P.y, h.x - ex, h.y - ey, h.x + ex, h.y + ey) - 5; }
  if (h.k === 1) return Math.hypot(h.x, hy(h) - P.y) - h.r + 5;
  return h.st === 1 ? Math.hypot(h.x, h.y - P.y) - 10 : 1e9;
}

/* ---------------------------------------------------------------- events */
function grant(kind) {
  if (kind === "magnet") { magnet = 9; Lab.sfx("powerup", { pitch: 1.1 }); fx.text(X(0), Y(P.y) - 44 * S, "MAGNET", { size: 17 * S, color: "#ff8fa8" }); }
  else { P.mode = 1; P.gdir = 1; P.flip = 1; P.carT = 14; P.inv = Math.max(P.inv, .6); Lab.sfx("unlock"); Lab.sfx("boing"); fx.text(X(0), Y(P.y) - 50 * S, "BUMPER CAR — tap to flip!", { size: 16 * S, color: "#ffe9a8" }); fx.ring(X(0), Y(P.y), { r0: 10, r1: 90 * S, color: "#ffcf4a", width: 6 }); }
  Lab.buzz(15);
}
function smash(h, pts) {
  h.dead = true; const x = X(h.x), y = Y(hy(h));
  fx.burst(x, y, { n: 16, colors: ["#ffcf4a", "#ff5d8f", "#fff", "#7ce0ff"], speed: 420, life: .6, size: 5 * S, shape: "shard", gravity: 500 }); fx.ring(x, y, { r0: 10, r1: 80 * S, color: "#fff", width: 5 });
  Lab.sfx("crunch", { pitch: 1.2 }); Lab.sfx("glass");
  if (pts) { smashes++; bonus += pts; fx.text(x, y - 20 * S, "+" + pts, { size: 20 * S, color: "#ffcf4a" }); Lab.shake(5, .15); Lab.hitstop(.03); }
}
function shave(h) {
  h.near = true; shaves++; bonus += 10; fizz = Math.min(1, fizz + .2);
  Lab.sfx("swish", { pitch: 1.5 }); Lab.sfx("star", { pitch: .9 + fizz * .5 }); Lab.buzz(12);
  fx.text(X(10), Y(P.y) - 38 * S, "CLOSE! +10", { size: 17 * S, color: "#7ce0ff" }); fx.sparks(X(0), Y(P.y), Math.PI, { color: "#7ce0ff", n: 6 });
}
function startOD() {
  od = OD; fizz = 1; Lab.banner("SHAKEN!", { color: "#ffcf4a", ms: 1000 }); Lab.sfx("powerup", { pitch: 1.4 }); Lab.sfx("whoosh"); Lab.flash("#fff3c4", .2, .5); Lab.shake(8, .3); Lab.buzz(40);
  fx.burst(X(0), Y(P.y), { n: 30, colors: ["#fff", "#ffd6e8", "#ffcf4a"], speed: 500, life: .7, size: 6 * S, gravity: 200 });
}
function endOD() {
  od = 0; fizz = 0; P.inv = 1.3; Lab.sfx("pop", { pitch: .7 }); fx.ring(X(0), Y(P.y), { r0: 20, r1: 340 * S, color: "#fff3c4", width: 8, life: .5 });
  for (const h of haz) if (!h.dead && h.x > -60 && h.x < 340 && (h.k !== 2 || h.st === 1)) smash(h, 0);
}
function hit(h) {
  if (od > 0) return smash(h, 15);
  if (P.inv > 0) return;
  if (P.mode === 1) {
    P.mode = 0; P.inv = 1.5; P.vy = -300; h.dead = true; Lab.sfx("explode", { pitch: 1.3 }); Lab.shake(10, .3); Lab.hitstop(.05); Lab.buzz(40);
    fx.burst(X(0), Y(P.y), { n: 24, colors: ["#ff4d6d", "#fff1d6", "#333", "#ffcf4a"], speed: 420, life: .8, size: 6 * S, shape: "shard" }); fx.text(X(0), Y(P.y) - 46 * S, "car wrecked!", { size: 15 * S, color: "#ffd0d8" });
    return;
  }
  alive = false; P.vy = -480; P.vx = speed * .55;
  Lab.sfx("explode", { pitch: 1.1 }); Lab.sfx("hurt"); Lab.shake(14, .4); Lab.hitstop(.08); Lab.flash("#fff", .14, .5); Lab.buzz(70);
  fx.burst(X(0), Y(P.y), { n: 26, colors: ["#fff", "#ffd6e8", "#35c98b", "#ffcf4a"], speed: 380, life: .8, size: 6 * S, gravity: 500 });
  Lab.after(1.25, () => Lab.gameover({ title: "Fizzled out", score, stats: [["Distance", Math.floor(dist / 40) + " m"], ["Caps", capN], ["Close shaves", shaves]] }));
}

/* ---------------------------------------------------------------- update */
function anim(dt) {
  P.sq = Lab.damp(P.sq, 0, 10, dt); P.flip = Lab.damp(P.flip, P.gdir, 16, dt); P.run += dt * (P.ground || P.ceil ? speed / 22 : 5);
  zoneF = Lab.damp(zoneF, tier, 1, dt);
}
function frame(dt, t) {
  held = testHold || Lab.input.down || !!(Lab.input.keys[" "] || Lab.input.keys.ArrowUp || Lab.input.keys.KeyW);
  if (alive) {
    time += dt; if (P.inv > 0) P.inv -= dt; capT += dt;
    speedMul = Lab.damp(speedMul, od > 0 ? 1.7 : 1, 6, dt); speed = Math.min(clamp(viewR() * 1.3, 400, 560), 290 + time * 3.1) * speedMul;   // never outrun the visible look-ahead
    const mv = speed * dt; dist += mv; frontier -= mv;
    // fox
    if (P.mode === 0) {
      P.vy = clamp(P.vy + (held ? -THRUST : GRAV) * dt, -620, 760);
      if (held && dt > 1e-4) {
        hissT -= dt; if (hissT <= 0) { hissT = .075; Lab.audio.noise({ dur: .1, vol: .04, hp: 3000, f2: 5200 }); }
        fx.burst(X(-17), Y(P.y) + 22 * S, { n: od > 0 ? 3 : 2, colors: od > 0 ? ["#ffcf4a", "#ff8fb8", "#fff"] : ["#fff", "#ffe3ee", "#eafff5"], speed: 330 * S, spread: .5, angle: Math.PI / 2 + .45, life: .38, size: 5 * S, gravity: 500, drag: 1, vx: -speed * .3 * S });
      }
    } else { P.vy = clamp(P.vy + P.gdir * 2600 * dt, -780, 780); P.carT -= dt; if (P.carT <= 0) { P.mode = 0; P.inv = 1; fx.puff(X(0), Y(P.y), { n: 12 }); Lab.sfx("pop", { pitch: .8 }); } }
    P.y += P.vy * dt;
    const wg = P.ground, wc = P.ceil; P.ground = P.ceil = false;
    if (P.y >= Hu - R) { P.y = Hu - R; if (!wg && P.vy > 240) { P.sq = Math.min(.35, P.vy / 1800); Lab.sfx("land", { pitch: 1.1 }); fx.puff(X(0), floorY, { n: 5, color: "rgba(255,240,220,.6)" }); } P.vy = Math.min(P.vy, 0); P.ground = true; }
    if (P.y <= R) { P.y = R; if (!wc && P.vy < -240) { P.sq = Math.min(.3, -P.vy / 1800); Lab.sfx("knock", { pitch: 1.3 }); fx.sparks(X(0), ceilY, Math.PI * .75, { color: "#ffe9a8", n: 5 }); } P.vy = Math.max(P.vy, 0); P.ceil = true; }
    P.lean = Lab.damp(P.lean, P.mode ? 0 : clamp(P.vy / 1500, -.3, .38), 12, dt);
    // world
    while (frontier < viewR() + 140) spawnChunk();
    const left = -jx / S - 80, pr = P.mode ? 19 : R;
    for (const h of haz) {
      if (h.k === 2) {
        if (h.st === 0) { h.t += dt; if (h.t >= 0 && h.t - dt < 0) Lab.sfx("warn"); if (h.t < 1) h.y = Lab.damp(h.y, clamp(P.y, 20, Hu - 20), 5, dt); if (h.t >= 1.45) { h.st = 1; h.x = viewR() + 30; Lab.sfx("whoosh", { pitch: 1.4 }); } }
        else { h.x -= (speed + 430) * dt; if (dt > 1e-4 && !h.dead) fx.burst(X(h.x + 20), Y(h.y), { n: 1, colors: ["#ffcf4a", "#ff8a3d"], speed: 60, life: .3, size: 3.5 * S, gravity: 0 }); }
      } else h.x -= mv;
      if (h.dead) continue;
      const d = clearance(h) - pr;
      if (d < 0) { hit(h); if (!alive) break; }
      else if (d < 22 && !h.near && h.x < 34 && od <= 0 && P.inv <= 0) shave(h);
    }
    haz = haz.filter(h => !h.dead && (h.k === 2 ? h.st === 0 || h.x > left : h.x + h.len > left || h.k === 1 && h.x > left));
    const pull = magnet > 0 || od > 0;
    for (const c of caps) {
      c.x -= mv; const dx = -c.x, dy = P.y - c.y, d = Math.hypot(dx, dy);
      if (pull && d < 210 && d > 1) { const v = 900 * dt; c.x += dx / d * v; c.y += dy / d * v; }
      if (d < (P.mode ? 38 : 31)) {
        c.taken = true; capN++; capStreak = capT < .45 ? capStreak + 1 : 0; capT = 0; if (od <= 0) fizz = Math.min(1, fizz + .006);
        Lab.audio.tone({ f: Lab.audio.scaleFreq(capStreak % 15, 72), dur: .07, type: "square", vol: .05, lp: 4000 }); Lab.audio.tone({ f: Lab.audio.scaleFreq(capStreak % 15, 84), dur: .12, vol: .05 });
        fx.burst(X(c.x), Y(c.y), { n: 3, color: "#ffe28a", speed: 110, life: .3, size: 3 * S, gravity: 0, shape: "star" });
      }
    }
    caps = caps.filter(c => !c.taken && c.x > left);

    picks = picks.filter(p => !p.taken && p.x > left);

    if (od > 0) { od -= dt; fizz = Math.max(0, od / OD); if (od <= 0) endOD(); } else if (fizz >= 1) startOD();
    const tr = Math.floor(dist / 40 / 400);
    if (tr > tier) { tier = tr; Lab.banner(tier * 400 + " m", { color: "#fff3c4", ms: 1100 }); Lab.sfx("levelup"); fx.text(Lab.W / 2, Lab.play.y + Lab.play.h * .5, ["dusk falls", "night lights", "dawn breaks"][(tier - 1) % 3] + " — faster!", { size: 15 * S, life: 1.4, color: "#fff3c4" }); }
    const sc = Math.floor(dist / 40) + capN + bonus; if (sc !== score) { score = sc; Lab.setScore(score); }
    Lab.music.intensity(od > 0 ? 1 : .3 + clamp((speed - 290) / 270, 0, 1) * .45 + fizz * .15);
  } else {
    deathT += dt; speed = Lab.damp(speed, 0, 2.2, dt); const mv = speed * dt; dist += mv;
    for (const h of haz) h.x -= mv; for (const c of caps) c.x -= mv; for (const p of picks) p.x -= mv;
    P.vy += GRAV * dt; P.y += P.vy * dt; P.ox += (P.vx - speed) * dt * .25; P.rot += dt * (P.vy < 0 || P.y < Hu - R - 2 ? 9 : 2);
    if (P.y > Hu - R) { P.y = Hu - R; if (P.vy > 160) { Lab.sfx("thud", { pitch: 1.3 }); fx.puff(X(P.ox), floorY, { n: 5 }); P.vy *= -.45; P.vx *= .6; } else P.vy = 0; }
  }

}

/* ---------------------------------------------------------------- art */
function capSprite() {
  const r = 11 * S; return Lab.sprite("cap:" + Math.round(r * 10), r * 2 + 4, r * 2 + 4, g => {
    const c = r + 2; g.fillStyle = "#c98a12"; g.beginPath(); for (let i = 0; i < 28; i++) { const a = i * TAU / 28, rr = i % 2 ? r : r * .87; g.lineTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr); } g.fill();
    draw.circle(g, c, c, r * .8, "#ffcf4a"); draw.circle(g, c - r * .1, c - r * .12, r * .62, "#ffe28a"); draw.star(g, c, c, r * .42, "#e89c1c");
    g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.ellipse(c - r * .35, c - r * .4, r * .22, r * .1, -.7, 0, TAU); g.fill();
  });
