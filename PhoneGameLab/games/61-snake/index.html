<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Snake", instructions:"Swipe to change direction. Eat apples to grow.", restart:start});
let snake, dir, food, t, N=18, alive;
function start(){
  snake=[{r:9,c:9}]; dir={r:0,c:1}; spawnFood(); t=0; alive=true; Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{
    const [dr,dc] = Math.abs(dx)>Math.abs(dy)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
    if(snake.length>1 && dr===-dir.r && dc===-dir.c) return;
    dir={r:dr,c:dc};
  }];
  Lab.loop(dt=>{ if(!alive) return; t+=dt; if(t<0.15) {draw(); return;} t=0;
    const head={r:snake[0].r+dir.r, c:snake[0].c+dir.c};
    if(head.r<0||head.r>=N||head.c<0||head.c>=N||snake.find(s=>s.r===head.r&&s.c===head.c)){ alive=false; Lab.gameover({title:"Bonked",message:"Length: "+snake.length}); return;}
    snake.unshift(head);
    if(head.r===food.r&&head.c===food.c){ spawnFood(); Lab.setScore(snake.length); Lab.beep(700,.05);} else snake.pop();
    draw();
  });
}
function spawnFood(){ while(true){ const f={r:Lab.randInt(0,N-1), c:Lab.randInt(0,N-1)}; if(!snake.find(s=>s.r===f.r&&s.c===f.c)){ food=f; return;}}}
function draw(){
  const c=Lab.ctx; c.fillStyle="#0e1a14"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=Math.min((Lab.W-20)/N,(Lab.H-200)/N); const off={x:(Lab.W-cs*N)/2, y:140};
  c.fillStyle="#e74"; c.fillRect(off.x+food.c*cs+2, off.y+food.r*cs+2, cs-4, cs-4);
  c.fillStyle="#7c6"; for(const s of snake) c.fillRect(off.x+s.c*cs+1, off.y+s.r*cs+1, cs-2, cs-2);
}
start();
</script></body></html>
