<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Jetpack Hold", instructions:"Hold the screen to fly up. Release to fall.", restart:start});
let p,obs,t,spawn,sp;
function start(){
  p={x:Lab.W*0.3,y:Lab.H/2,vy:0,r:18}; obs=[]; t=0; spawn=0; sp=240;
  Lab.setScore(0);
  Lab.loop(dt=>{
    t+=dt; sp=240+t*8; spawn-=dt;
    if(Lab.input.down) p.vy-=900*dt;
    p.vy+=900*dt; p.vy=Lab.clamp(p.vy,-450,520);
    p.y+=p.vy*dt;
    if(spawn<=0){ spawn=Lab.rand(0.5,0.9); const kind=Math.random()<0.25?'coin':'laser';
      if(kind==='laser') obs.push({x:Lab.W+30,y:Lab.rand(80,Lab.H-80),w:8,h:Lab.rand(80,180),kind});
      else obs.push({x:Lab.W+20,y:Lab.rand(80,Lab.H-80),r:14,kind});
    }
    for(const o of obs) o.x-=sp*dt;
    obs=obs.filter(o=>o.x>-50);
    for(let i=obs.length-1;i>=0;i--){ const o=obs[i];
      if(o.kind==='coin' && Lab.dist(o.x,o.y,p.x,p.y)<o.r+p.r){ obs.splice(i,1); Lab.setScore(parseInt(document.getElementById('lab-score').textContent)+5); Lab.beep(900,.05);}
      else if(o.kind==='laser' && p.x+p.r>o.x-o.w/2 && p.x-p.r<o.x+o.w/2 && p.y+p.r>o.y-o.h/2 && p.y-p.r<o.y+o.h/2){
        Lab.gameover({title:"Zapped",message:"Distance: "+Math.floor(t*30)}); return;
      }
    }
    if(p.y<0||p.y>Lab.H){ Lab.gameover({title:"Out!",message:"Distance: "+Math.floor(t*30)}); return; }
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const o of obs){
      if(o.kind==='laser'){ c.fillStyle="#ff5577"; c.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);}
      else { c.beginPath(); c.fillStyle="#ffd35a"; c.arc(o.x,o.y,o.r,0,Lab.TAU); c.fill();}
    }
    c.beginPath(); c.fillStyle="#5af"; c.arc(p.x,p.y,p.r,0,Lab.TAU); c.fill();
    if(Lab.input.down){ c.beginPath(); c.fillStyle="#ff5577"; c.moveTo(p.x-10,p.y+12); c.lineTo(p.x+10,p.y+12); c.lineTo(p.x,p.y+30+Math.random()*8); c.fill();}
  });
}
start();
</script></body></html>
