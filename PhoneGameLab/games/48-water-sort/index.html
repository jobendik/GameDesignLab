<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Water Sort", instructions:"Tap a tube then another to pour. Sort colors.", restart:start});
let tubes, sel, COLORS=["#e74","#69d","#7c6","#fc4","#a6e"];
function start(){
  const n=5; tubes=Array.from({length:n+2},()=>[]);
  const pool=[]; for(let i=0;i<n;i++) for(let j=0;j<4;j++) pool.push(i);
  for(let i=pool.length-1;i>0;i--){ const j=Lab.randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]];}
  for(let i=0;i<n;i++) for(let j=0;j<4;j++) tubes[i].push(pool.shift());
  sel=null; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const cs=cellSize(), tw=cs*0.7, gap=cs*0.2;
    const total=tubes.length*tw+(tubes.length-1)*gap;
    const startX=(Lab.W-total)/2;
    for(let i=0;i<tubes.length;i++){
      const tx=startX+i*(tw+gap), ty=180;
      if(x>=tx && x<=tx+tw && y>=ty && y<=ty+cs*4){
        if(sel===null){ if(tubes[i].length) sel=i; }
        else if(sel===i){ sel=null; }
        else { pour(sel,i); sel=null;
          if(tubes.every(t=>t.length===0||(t.length===4 && t.every(v=>v===t[0])))){ Lab.win("Sorted!"); }
        }
        return;
      }
    }
  }];
  Lab.loop(()=>draw());
}
function pour(from,to){ if(!tubes[from].length) return;
  const top=tubes[from][tubes[from].length-1];
  if(tubes[to].length===4) return;
  if(tubes[to].length && tubes[to][tubes[to].length-1]!==top) return;
  while(tubes[from].length && tubes[from][tubes[from].length-1]===top && tubes[to].length<4){
    tubes[to].push(tubes[from].pop()); Lab.beep(500,.03);
  }
}
function cellSize(){ return Math.min((Lab.W-40)/(tubes.length), (Lab.H-280)/4);}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), tw=cs*0.7, gap=cs*0.2;
  const total=tubes.length*tw+(tubes.length-1)*gap;
  const startX=(Lab.W-total)/2;
  for(let i=0;i<tubes.length;i++){
    const tx=startX+i*(tw+gap), ty=180;
    c.strokeStyle=sel===i?"#fff":"#7e89b3"; c.lineWidth=3;
    c.strokeRect(tx,ty,tw,cs*4);
    for(let j=0;j<tubes[i].length;j++){
      c.fillStyle=COLORS[tubes[i][j]];
      c.fillRect(tx+2, ty+cs*4-(j+1)*cs+2, tw-4, cs-2);
    }
  }
}
start();
</script></body></html>
