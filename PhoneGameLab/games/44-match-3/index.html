<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Match 3", instructions:"Swap adjacent gems to match 3+ in a row.", restart:start});
let g, sel, score, moves, COLS=7, ROWS=8, COLORS=["#e74","#e6c","#7c6","#69d","#fc4","#a6e"];
function start(){
  g=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Lab.randInt(0,5)));
  while(findMatches().length) clearAndCollapse();
  sel=null; score=0; moves=20; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(); const off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c<0||c>=COLS||r<0||r>=ROWS) return;
    if(!sel){ sel={r,c}; return;}
    const dr=r-sel.r, dc=c-sel.c;
    if(Math.abs(dr)+Math.abs(dc)===1){
      swap(sel.r,sel.c,r,c);
      if(findMatches().length){ moves--; resolve(); } else swap(sel.r,sel.c,r,c);
    }
    sel=null;
    if(moves<=0) setTimeout(()=>Lab.gameover({title:"Done",message:"Score: "+score}),400);
  }];
  Lab.loop(()=>draw());
}
function cellSize(){ return Math.min((Lab.W-20)/COLS, (Lab.H-220)/ROWS);}
function offset(cs){ return {x:(Lab.W-cs*COLS)/2, y:140};}
function swap(r1,c1,r2,c2){ const t=g[r1][c1]; g[r1][c1]=g[r2][c2]; g[r2][c2]=t;}
function findMatches(){ const m=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS-2;c++) if(g[r][c]===g[r][c+1] && g[r][c]===g[r][c+2]){ m.push([r,c],[r,c+1],[r,c+2]);}
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS-2;r++) if(g[r][c]===g[r+1][c] && g[r][c]===g[r+2][c]){ m.push([r,c],[r+1,c],[r+2,c]);}
  return m;
}
function clearAndCollapse(){
  const m=findMatches(); if(!m.length) return false;
  for(const [r,c] of m) g[r][c]=-1;
  score+=m.length*10; Lab.setScore(score); Lab.beep(700,.05);
  for(let c=0;c<COLS;c++){ const col=[]; for(let r=0;r<ROWS;r++) if(g[r][c]!==-1) col.push(g[r][c]); while(col.length<ROWS) col.unshift(Lab.randInt(0,5));
    for(let r=0;r<ROWS;r++) g[r][c]=col[r];}
  return true;
}
function resolve(){ let i=0; const t=setInterval(()=>{ if(!clearAndCollapse() || i++>10) clearInterval(t);},200);}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    c.fillStyle="#22253a"; c.fillRect(x,y,cs,cs);
    if(g[r][col]>=0){ c.beginPath(); c.fillStyle=COLORS[g[r][col]]; c.arc(x+cs/2,y+cs/2,cs*0.4,0,Lab.TAU); c.fill();}
    if(sel && sel.r===r && sel.c===col){ c.strokeStyle="#fff"; c.lineWidth=3; c.strokeRect(x+2,y+2,cs-4,cs-4);}
  }
  c.fillStyle="#fff"; c.font="16px sans-serif"; c.textAlign="center";
  c.fillText("Moves: "+moves, Lab.W/2, 100);
}
start();
</script></body></html>
