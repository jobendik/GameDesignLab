<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Ball Sort", instructions:"Tap a tube then another to move the top ball.", restart:start});
let tubes, sel, COLORS=["#e74","#69d","#7c6","#fc4","#a6e","#fc6"];
function start(){
  const n=6, cap=5; tubes=Array.from({length:n+1},()=>[]);
  const pool=[]; for(let i=0;i<n;i++) for(let j=0;j<cap;j++) pool.push(i);
  for(let i=pool.length-1;i>0;i--){ const j=Lab.randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]];}
  for(let i=0;i<n;i++) for(let j=0;j<cap;j++) tubes[i].push(pool.shift());
  sel=null; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{
    const cs=cellSize(), tw=cs*0.8, gap=cs*0.15;
    const total=tubes.length*tw+(tubes.length-1)*gap; const startX=(Lab.W-total)/2;
    for(let i=0;i<tubes.length;i++){
      const tx=startX+i*(tw+gap), ty=180;
      if(x>=tx&&x<=tx+tw&&y>=ty&&y<=ty+cs*cap){
        if(sel===null){ if(tubes[i].length) sel=i;}
        else if(sel===i) sel=null;
        else { if(tubes[i].length<cap && tubes[sel].length){
          tubes[i].push(tubes[sel].pop()); Lab.beep(500,.04);
          if(tubes.every(t=>t.length===0||(t.length===cap && t.every(v=>v===t[0])))) Lab.win("Sorted!");
        } sel=null;}
        return;
      }
    }
  }];
  Lab.loop(()=>draw());
}
function cellSize(){ return Math.min((Lab.W-40)/(tubes.length+1), (Lab.H-280)/5);}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), tw=cs*0.8, gap=cs*0.15, cap=5;
  const total=tubes.length*tw+(tubes.length-1)*gap; const startX=(Lab.W-total)/2;
  for(let i=0;i<tubes.length;i++){
    const tx=startX+i*(tw+gap), ty=180;
    c.strokeStyle=sel===i?"#fff":"#7e89b3"; c.lineWidth=3;
    c.strokeRect(tx,ty,tw,cs*cap);
    for(let j=0;j<tubes[i].length;j++){
      c.beginPath(); c.fillStyle=COLORS[tubes[i][j]]; c.arc(tx+tw/2, ty+cs*cap-(j+0.5)*cs, cs*0.35, 0, Lab.TAU); c.fill();
    }
  }
}
start();
</script></body></html>
