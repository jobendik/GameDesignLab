<title>Sundown Sprint</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* SUNDOWN SPRINT — a checkpoint dash down a desert highway as the light goes.
 * Identity: warm retro top-down drive; plum asphalt, sand shoulders, long evening shadows, time of day shifts per stage.
 * Core: free analog steering (relative drag / arrows) and a one-thumb throttle: touch = floor it, lift = brake.
 * Hook: the clock. Checkpoints add time, and so does every CLOSE PASS (skimming a car's flank at speed), which also
 * builds a combo. Crashes do not kill, they spin you out and burn seconds. Fast + close = far; safe + slow = out of time.
 * World units: x in lane units (0..4), along-road distance in "u" (1 u = S px), so resizing never desyncs anything. */
Lab.init({
  title: "Sundown Sprint", tagline: "Floor it down the desert highway. Skim traffic to buy time.", category: "Arcade & Action",
  howto: ["Hold to accelerate, drag to steer", "Lift off to brake", "Skim past cars for bonus time"],
  theme: { bg: "#2b2140", bg2: "#e8915a", accent: "#ff6b4a", accent2: "#ffc15e" },
  orient: "portrait", music: { style: "drive", key: "E", vol: .42 }, restart: start,

const { draw, fx, ease } = Lab, TAU = Lab.TAU, C = Lab.color;
const LANES = 4, VMIN = 340, PWU = .56, PLEN = 80;
const SKY = [

  { n: "Sunset", road: "#4b3a62", sand: "#de7c4e", sand2: "#c5633f", tint: "#ff7a4a", ta: .2, night: .1 },
  { n: "Dusk", road: "#3a3358", sand: "#93597c", sand2: "#7a4770", tint: "#a05cff", ta: .14, night: .32 },
  { n: "Night", road: "#262947", sand: "#3f3c68", sand2: "#343258", tint: "#3a4bd0", ta: .1, night: .55 },
  { n: "Daybreak", road: "#4d4968", sand: "#e7a590", sand2: "#d48a7c", tint: "#ffc9a8", ta: .14, night: .12 },
];
const KINDS = {
  sedan: { w: .56, l: 78, cols: ["#3fb8a9", "#f4e3c1", "#e9b44c", "#7c9eea", "#f08a6c", "#b9c2cf"] },
  van: { w: .6, l: 98, cols: ["#f4e3c1", "#6fb1d6", "#d98f5a"] },
  truck: { w: .64, l: 156, cols: ["#e9b44c", "#3fb8a9", "#d9605a"] },

let S, W, H, roadL, roadW, laneW, carY;
let car, speed, vmax, dist, time, stage, cpS, cpPrev, score, bonus, combo, comboT, closeN, passN, topSpeed, crashes, cars, relAcc, gap, alive, thr, palFrom, palK, engT, outT, tickT, sandT, steered;

function layout() {

}
Lab.onResize(() => { if (car) layout(); });
const X = u => roadL + u * laneW, Y = s => carY - (s - dist) * S;

function start() {

  cars = []; relAcc = 0; gap = 900; alive = true; thr = false; palFrom = 0; palK = 1; engT = 0; outT = 0; tickT = 0; sandT = 0; steered = false;
  Lab.setScore(0); Lab.hint("");
  Lab.input.onDown = [() => { steered = true; }];
  Lab.input.onMove = [(x, y, dx) => { if (Lab.input.down && alive) car.tx = Lab.clamp(car.tx + dx / laneW * 1.25, -.34, LANES + .34); }];
  Lab.input.onKey = [() => { steered = true; }];
  Lab.expose({
    get score() { return score; }, get time() { return time; }, set time(v) { time = v; }, get speed() { return speed; }, get vmax() { return vmax; }, get x() { return car.x; },
    get dist() { return dist; }, get stage() { return stage; }, get combo() { return combo; }, get closeN() { return closeN; }, get passN() { return passN; }, get crashes() { return crashes; },
    get alive() { return alive; }, get inv() { return car.inv; }, get cpIn() { return cpS - dist; }, get throttle() { return thr; },
    steerTo(u) { car.tx = Lab.clamp(u, -.34, LANES + .34); },
    /* traffic ahead of / alongside the player: x in lane units, w in lane units, ahead = bumper-to-bumper gap in u */
    traffic() { return cars.filter(c => !c.bumped).map(c => ({ x: c.x, w: c.w, l: c.l, lane: c.lane, v: c.v, ahead: c.s - dist - (c.l + PLEN) / 2, chg: c.chg ? c.chg.to : -1 })).sort((a, b) => a.ahead - b.ahead); },

}

/* ---------- traffic */
function spawn() {

  band.forEach(c => { used.add(c.lane); if (c.chg) used.add(c.chg.to); });
  if (band.length >= (stage < 2 ? 2 : 3)) return false;
  const free = [0, 1, 2, 3].filter(l => !used.has(l)); if (!free.length) return false;
  const lane = Lab.choose(free), r = Math.random(), kind = r < (lane >= 2 ? .16 : .04) + Math.min(.1, stage * .02) ? "truck" : r < .34 ? "van" : "sedan", K = KINDS[kind];

  if (stage >= 1 && kind !== "truck" && Lab.chance(Math.min(.34, .1 + stage * .05))) c.will = lane === 0 ? 1 : lane === 3 ? -1 : Lab.choose([-1, 1]);

}
function updateTraffic(dt) {

}
function closePass(c, razor) {

  fx.text(W / 2 + 44 * Math.max(.85, S), Lab.play.y + 32 * S, "+" + add.toFixed(1) + "s", { color: "#8dffb0", size: 15 * Math.max(.85, S), life: .8 });

/* ---------- update */

/* ---------- sprites */

function drawVeh(c, sp, x, y, rot, w, l, night) {

/* ---------- render */

  }

  const dash = 80, d0 = Math.floor((dist - (H - carY) / S) / dash) - 1, d1 = Math.ceil((dist + carY / S) / dash) + 1;
  c.fillStyle = "rgba(255,226,176,.75)";
  for (let i = d0; i <= d1; i++) { const y = Y(i * dash); for (let l = 1; l < LANES; l++) c.fillRect(roadL + l * laneW - 1.5 * S, y, 3 * S, 34 * S); if (i % 2 === 0) { draw.circle(c, roadL - 5 * S, y, 3 * S, "#ff8a4a"); draw.circle(c, R + 5 * S, y, 3 * S, "#ff8a4a"); } }
  // checkpoint gantry
