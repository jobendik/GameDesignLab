<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Agar.io", instructions:"Drag to move. Eat smaller blobs, avoid bigger ones.", restart:start});
let me, blobs, food, alive;
function start(){
  me={x:Lab.W/2, y:Lab.H/2, r:14, c:"#7c6"};
  blobs=[]; for(let i=0;i<12;i++) blobs.push({x:Lab.rand(20,Lab.W-20), y:Lab.rand(20,Lab.H-20), r:Lab.rand(8,30), c:`hsl(${Lab.rand(0,360)},70%,55%)`, vx:Lab.rand(-30,30), vy:Lab.rand(-30,30)});
  food=[]; for(let i=0;i<60;i++) food.push({x:Lab.rand(10,Lab.W-10), y:Lab.rand(10,Lab.H-10)});
  alive=true; Lab.setScore(14);
  Lab.loop(dt=>{ if(!alive) return;
    if(Lab.input.down){ const dx=Lab.input.x-me.x, dy=Lab.input.y-me.y, d=Math.hypot(dx,dy)||1; const sp=Math.max(40, 200-me.r*2);
      me.x+=dx/d*sp*dt; me.y+=dy/d*sp*dt;}
    me.x=Lab.clamp(me.x,me.r,Lab.W-me.r); me.y=Lab.clamp(me.y,me.r,Lab.H-me.r);
    for(const b of blobs){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.x<b.r||b.x>Lab.W-b.r) b.vx*=-1; if(b.y<b.r||b.y>Lab.H-b.r) b.vy*=-1;}
    // food
    for(let i=food.length-1;i>=0;i--){ if(Lab.dist(food[i].x,food[i].y,me.x,me.y)<me.r){ food.splice(i,1); me.r+=0.5; Lab.setScore(Math.round(me.r));}}
    // blobs
    for(let i=blobs.length-1;i>=0;i--){ const b=blobs[i]; const d=Lab.dist(b.x,b.y,me.x,me.y);
      if(d<Math.max(me.r,b.r)){ if(me.r>b.r+2){ me.r=Math.sqrt(me.r*me.r+b.r*b.r); blobs.splice(i,1); Lab.beep(700,.05); Lab.setScore(Math.round(me.r));}
        else if(b.r>me.r+2){ alive=false; Lab.gameover({title:"Eaten",message:"Size: "+Math.round(me.r)}); return;}}}
    if(blobs.length<8) blobs.push({x:Lab.rand(20,Lab.W-20), y:Lab.rand(20,Lab.H-20), r:Lab.rand(8,30), c:`hsl(${Lab.rand(0,360)},70%,55%)`, vx:Lab.rand(-30,30), vy:Lab.rand(-30,30)});
    if(food.length<40) food.push({x:Lab.rand(10,Lab.W-10), y:Lab.rand(10,Lab.H-10)});
    draw();
  });
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#0e0e22"; c.fillRect(0,0,Lab.W,Lab.H);
  for(const f of food){ c.beginPath(); c.fillStyle="#ffd35a"; c.arc(f.x,f.y,3,0,Lab.TAU); c.fill();}
  for(const b of blobs){ c.beginPath(); c.fillStyle=b.c; c.arc(b.x,b.y,b.r,0,Lab.TAU); c.fill();}
  c.beginPath(); c.fillStyle=me.c; c.arc(me.x,me.y,me.r,0,Lab.TAU); c.fill();
}
start();
</script></body></html>
