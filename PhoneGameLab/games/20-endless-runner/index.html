<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Endless Runner", instructions:"Tap = jump • Swipe down = slide.", restart:start});
let p, obs, spawn, t, sp, dead, slide;
function start(){
  p={x:80,y:0,vy:0,h:50,w:30,onGround:true};
  obs=[]; spawn=1.2; t=0; sp=320; dead=false; slide=0;
  Lab.setScore(0);
  Lab.input.onTap=[()=>{ if(p.onGround){ p.vy=-620; p.onGround=false; Lab.beep(600,.04);}}];
  Lab.input.onSwipe=[(dx,dy)=>{ if(dy>40){ slide=0.55; }}];
  Lab.loop(dt=>{
    if(dead) return;
    t+=dt; sp=320+t*8; spawn-=dt;
    if(spawn<=0){
      spawn=Lab.rand(0.7,1.4);
      const hi=Math.random()<0.3;
      obs.push({x:Lab.W+40, y: hi? Lab.H-130 : Lab.H-50, w:30, h: hi?30:Lab.rand(30,60)});
    }
    if(!p.onGround){ p.vy+=1700*dt; p.y+=p.vy*dt; if(p.y>=0){ p.y=0; p.vy=0; p.onGround=true; }}
    slide=Math.max(0,slide-dt);
    const ph = slide>0?25:p.h;
    for(const o of obs) o.x-=sp*dt;
    obs=obs.filter(o=>o.x>-50);
    const py=Lab.H-50-ph+p.y;
    for(const o of obs){
      if(p.x+p.w>o.x && p.x<o.x+o.w){
        if(py+ph>o.y && py<o.y+o.h){
          dead=true; Lab.gameover({title:"Crash",message:"Distance: "+Math.floor(t*sp/10)});
          return;
        }
      }
    }
    Lab.setScore(Math.floor(t*sp/10));
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    c.fillStyle="#1c2546"; c.fillRect(0,Lab.H-50,Lab.W,50);
    c.fillStyle="#5af"; c.fillRect(p.x, py, p.w, ph);
    c.fillStyle="#ff5577"; for(const o of obs) c.fillRect(o.x,o.y,o.w,o.h);
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Speed: "+sp.toFixed(0), Lab.W/2, 70);
  });
}
start();
</script></body></html>
