(function(){ "use strict";
/* SWINDLE — a fairground swindler hides a pearl under enamel cups and shuffles. Keep your eye on it, then pick.

 *           announces each new trick and whose eyes follow his hands. Funk bassline that tightens with the tempo.
 * Shuffles are a queue of readable moves: swaps along depth arcs (one cup passes in front, one behind), tempo
 *           changes and hesitations, feints that turn back, double swaps, three-cup carousels and the "sneak",
 *           where two cups tilt and the pearl visibly rolls across (or the tilt is a bluff).

  theme: { bg: "#241640", bg2: "#6a2c5c", accent: "#f2a03d", accent2: "#e2506a" },

    get n() { return N; }, get ballIndex() { return cups.indexOf(ball); }, get ballSlot() { return ball.slot; }, get pending() { return queue.length + (cur ? 1 : 0); }, get lastGain() { return lastGain; },
    get quick() { return quickMult(); }, get cursor() { return cursor; }, get move() { return cur ? cur.type : null; }, get planned() { return queue.map(m => m.type); },
