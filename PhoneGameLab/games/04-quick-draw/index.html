(function(){ "use strict";
/* CORKSLINGER — a pop-gun duel ladder in a toy theatre. Wait for the bell, then out-draw a toy box of peg-doll rivals,

Lab.init({

  howto: ["Tap to fire, but only after the bell", "Out-draw each rival to topple them", "Learn their tricks: fakes, cuckoos, cheats"],
  theme: { bg: "#3b2238", bg2: "#c9605a", accent: "#e2553d", accent2: "#f2b33d" },

const { draw, fx, ease } = Lab, TAU = Lab.TAU, PI = Math.PI;
const ROSTER = [
  { n: "Dozy Dot", ms: 620, trait: "Slow on the draw. Wait for the bell!", body: "#6fae9c", hat: "bonnet", hatC: "#f3e3b3", skin: "#f2c9a0", feints: [], nF: [0, 0], sleepy: true },
  { n: "Twitchy Tess", ms: 520, trait: "Fakes a reach. Don't bite.", body: "#d9694c", hat: "stetson", hatC: "#6b4a2f", skin: "#e0a878", feints: ["twitch"], nF: [1, 2] },
  { n: "Cuckoo Clive", ms: 460, trait: "Rigged the bell tower.", body: "#5c7fbf", hat: "bowler", hatC: "#2e2a38", skin: "#f2c9a0", feints: ["cuckoo", "cuckoo", "twitch"], nF: [1, 2], tache: true },
  { n: "Windy Wyn", ms: 410, trait: "Whistles up distractions.", body: "#c9a13a", hat: "sombrero", hatC: "#b5533c", skin: "#c98a5a", feints: ["tumble", "cuckoo", "twitch"], nF: [2, 2] },
  { n: "Sneaky Pete", ms: 380, trait: "CHEATS! If he reaches first, fire!", body: "#6a5a8c", hat: "top", hatC: "#2b2433", skin: "#e0a878", feints: ["cuckoo", "tumble"], nF: [1, 2], cheat: .55, tache: true, mask: true },
  { n: "Double Daisy", ms: 350, hp: 2, trait: "Takes two corks to topple.", body: "#d977a0", hat: "stetson", hatC: "#f5efe0", skin: "#8d5a3a", feints: ["twitch", "cuckoo", "tumble"], nF: [2, 3] },
  { n: "Silent Sid", ms: 320, trait: "Muffled the bell. Watch the flag!", body: "#55555e", hat: "bowler", hatC: "#8a2f2f", skin: "#f2c9a0", feints: ["ghost", "ghost", "twitch", "cuckoo"], nF: [2, 3], silent: true, tache: true },
  { n: "Marshal Brass", ms: 290, hp: 2, trait: "Every trick in the toy box.", body: "#b8862b", hat: "stetson", hatC: "#3a2a1c", skin: "#c98a5a", feints: ["ghost", "twitch", "cuckoo", "tumble"], nF: [2, 3], star: true, tache: true },
];
const YOU = { n: "You", body: "#3f78c9", hat: "stetson", hatC: "#f1e3c0", skin: "#f2c9a0" };
let S, wide, gy, cx, dx, postH, board, st, stT, waitDur, feints, cheatAt, cheat, forceCheat, goAt, oppMs, oi, lap, oppHp, hearts, score, beaten, fastest, closest,
  P, O, bell, weed, corks, hats, outcome, read, lastReal, heartShake, zT, lastMs, boardT;

function layout() {
  const p = Lab.play; wide = p.w > p.h * 1.15;
  S = wide ? Math.min(p.w / 700, p.h / 330, 1.7) : Math.min(p.w / 390, p.h / 640, 1.5);
  cx = p.x + p.w / 2; gy = p.y + p.h * (wide ? .8 : .7); dx = wide ? Math.min(p.w * .3, 250 * S) : Math.min(p.w * .3, 150 * S); postH = (wide ? 166 : 262) * S;
  board = { w: Math.min(p.w - (wide ? 300 * S : 24), 320 * S), h: (wide ? 40 : 54) * S, y: p.y + (wide ? 2 : 34 * S) };
  if (P) { P.x = cx - dx; O.x = cx + dx; }
}
Lab.onResize(() => { if (S) layout(); });
const mkDoll = (def, dir) => ({ def, dir, x: cx - dir * dx, arm: 0, tilt: 0, tiltV: 0, ko: 0, blink: Lab.rand(1, 3), mood: "idle", hat: true, loaded: true, laugh: 0, twitch: 0, slide: 0, sway: Lab.rand(0, 9) });

function start() {
  layout();
  hearts = 3; score = 0; beaten = 0; lap = 0; fastest = null; closest = null; corks = []; hats = []; weed = null; heartShake = 0; zT = 1; lastMs = null; forceCheat = null;
  bell = { a: 0, v: 0, flag: 0, door: 0, bird: 0, birdT: 0 }; read = { you: "", them: "", text: "", col: "#f6e7c6" }; lastReal = performance.now();
  P = mkDoll(YOU, 1); setOpp(0);
  Lab.setScore(0);
  Lab.input.onDown = [() => fire(performance.now())];
  Lab.input.onKey = [k => { if (k === " " || k === "Enter") fire(performance.now()); }];
  Lab.expose({
    get state() { return st; }, get hearts() { return hearts; }, get score() { return score; }, get lap() { return lap; }, get beaten() { return beaten; }, get lastMs() { return lastMs; },
    get opp() { return { i: oi, name: O.def.n, hp: oppHp, ms: Math.round(oppMs || 0) }; }, get cheating() { return cheat; }, get flag() { return bell.flag; }, get outcome() { return outcome; },
    skipWait() { if (st === "steady") { stT = Math.max(stT, .5); waitDur = stT; feints.forEach(f => f.done = true); if (cheatAt) cheatAt = stT; } }, feint(t) { doFeint(t); },
    setOppMs(v) { oppMs = v; }, cheatNext(v) { forceCheat = v; }, jump(i) { setOpp(i); }, ROSTER,
  });
  Lab.loop(frame);
}
function setOpp(i) {
  oi = i; const d = ROSTER[oi]; oppHp = d.hp || 1; O = mkDoll(d, -1); O.slide = 1; st = "intro"; stT = 0; boardT = 0; outcome = ""; cheat = false; feints = []; oppMs = 0;
  P.arm = 0; P.loaded = true; bell.flag = 0; read.you = read.them = ""; say(d.trait, "#f6e7c6");
  Lab.tween(O, { slide: 0 }, .55, { ease: "outBack" }); Lab.sfx("slide", { pitch: .7 }); Lab.after(.5, () => Lab.sfx("knock", { pitch: .8 }));
}
const say = (t, col) => { read.text = t; read.col = col || "#f6e7c6"; };
const lapK = () => Math.pow(.87, lap);

/* ------------------------------------------------------------------ round flow */
function steady() {
  st = "steady"; stT = 0; cheat = false; outcome = ""; const d = O.def;
  waitDur = Lab.rand(1.4, oi < 2 ? 2.8 : 3.9);

  P.arm = 0; O.arm = 0; P.loaded = O.loaded = true; P.mood = O.mood = "idle"; bell.flag = 0; read.you = read.them = "";

}
function doFeint(type) {

  else if (type === "tumble") { weed = { x: -40 * S, r: 0 }; Lab.sfx("whoosh", { pitch: .8 }); Lab.audio.tone({ f: 1250, f2: 1600, dur: .18, vol: .08, a: .04 }); Lab.audio.tone({ f: 1600, f2: 1150, dur: .22, vol: .08, delay: .18, a: .02 }); }
  else if (type === "ghost") { Lab.audio.tone({ f: 1245, dur: .22, vol: .13, lp: 2400 }); Lab.audio.tone({ f: 1865, dur: .12, vol: .05 }); }
}
function signal() {
  st = "draw"; stT = 0; goAt = performance.now(); bell.v = 11; bell.flag = .001; say("DRAW!", "#ffe08a"); Lab.buzz(20);
  if (O.def.silent) { Lab.sfx("flip", { pitch: 1.3 }); Lab.audio.tone({ f: 300, dur: .06, vol: .08 }); }
  else { Lab.audio.tone({ f: 1568, dur: .5, vol: .22 }); Lab.audio.tone({ f: 2349, dur: .32, vol: .1 }); Lab.audio.noise({ dur: .02, vol: .15, hp: 3000 }); }
}
function startCheat() { st = "draw"; stT = 0; goAt = performance.now(); cheat = true; oppMs = 640 * Math.max(.75, lapK()); O.mood = "sneak"; Lab.sfx("slide", { pitch: 1.5 }); Lab.audio.tone({ f: 220, f2: 330, dur: .3, type: "triangle", vol: .1 }); }

}
function tip(D) { return { x: D.x + D.dir * 66 * S, y: gy - 76 * S }; }

function knockHat(D) { if (!D.hat) return; D.hat = false; hats.push({ def: D.def, x: D.x, y: gy - 138 * S, vx: -D.dir * Lab.rand(60, 130) * S, vy: -Lab.rand(330, 430) * S, r: 0, vr: -D.dir * Lab.rand(5, 9), t: 0 }); }

/* ------------------------------------------------------------------ frame */
function frame(dt, t) {

/* ------------------------------------------------------------------ peg dolls */
function drawHat(c, d, y) {            // local coords, origin at head centre, facing right
  const C = d.hatC, D = Lab.color.shade(C, -.28), band = d === YOU ? "#c9553d" : Lab.color.shade(C, d.hat === "bowler" ? .35 : -.45);
  if (d.hat === "bonnet") { c.fillStyle = D; c.beginPath(); c.arc(-3, y + 16, 30, PI * .95, PI * 2.02); c.fill(); c.fillStyle = C; c.beginPath(); c.arc(-3, y + 14, 28, PI * .95, PI * 2.02); c.fill(); c.strokeStyle = "#d9694c"; c.lineWidth = 4; c.beginPath(); c.arc(-3, y + 14, 22, PI * 1.05, PI * 1.95); c.stroke(); return; }

  if (d.hat === "top") { c.fillStyle = Lab.color.shade(C, .12); c.beginPath(); c.ellipse(0, y - 32, 15, 3.5, 0, 0, TAU); c.fill(); }
}
function drawDoll(c, D, t) {

  c.fillStyle = dk; c.beginPath(); c.moveTo(-27, -8); c.quadraticCurveTo(-25, -70, -17, -86); c.lineTo(17, -86); c.quadraticCurveTo(25, -70, 27, -8); c.quadraticCurveTo(0, 2, -27, -8); c.fill();
  c.fillStyle = body; c.beginPath(); c.moveTo(-27, -8); c.quadraticCurveTo(-25, -70, -17, -86); c.lineTo(10, -86); c.quadraticCurveTo(18, -70, 19, -6); c.quadraticCurveTo(0, 2, -27, -8); c.fill();
  c.fillStyle = lt; c.globalAlpha = .5; c.beginPath(); c.ellipse(-14, -52, 4, 22, .06, 0, TAU); c.fill(); c.globalAlpha = 1;
  c.fillStyle = "#3a2a1c"; c.fillRect(-26, -34, 52, 6); c.fillStyle = "#e9c04a"; c.fillRect(-5, -36, 10, 10); c.fillStyle = "#3a2a1c"; c.fillRect(-2, -33, 4, 4);       // belt
  c.fillStyle = d.hatC === "#2e2a38" || d.hatC === "#2b2433" || d.hatC === "#3a2a1c" ? "#d9c08a" : d.hatC; c.beginPath(); c.moveTo(-16, -86); c.lineTo(16, -86); c.lineTo(3, -68); c.closePath(); c.fill();  // kerchief

/* ------------------------------------------------------------------ stage */

      g.lineWidth = 9 * S; g.beginPath(); g.moveTo(x, gy - h * .45); g.lineTo(x - 15 * S, gy - h * .45); g.lineTo(x - 15 * S, gy - h * .8); g.moveTo(x, gy - h * .3); g.lineTo(x + 14 * S, gy - h * .3); g.lineTo(x + 14 * S, gy - h * .62); g.stroke();
    }

    g.strokeStyle = "rgba(90,58,34,.35)"; g.lineWidth = 1.5; for (let x = -W; x < W * 2; x += 44 * S) { g.beginPath(); g.moveTo(cx + (x - cx) * .82, gy - 4 * S); g.lineTo(x, gy + 26 * S); g.stroke(); }

    g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, gy + 26 * S, W, 5 * S);
    g.strokeStyle = "rgba(40,22,10,.28)"; g.lineWidth = 2; for (let x = (cx % (56 * S)); x < W; x += 56 * S) { g.beginPath(); g.moveTo(x, gy + 31 * S); g.lineTo(x, H); g.stroke(); }

function drawBell(c, t) {

  c.fillStyle = "#3a2418"; c.beginPath(); c.arc(cx, top + 26 * S, 9 * S, PI, 0); c.rect(cx - 9 * S, top + 26 * S, 18 * S, 9 * S); c.fill();
  if (bell.bird < .5) { c.fillStyle = "#a9713c"; c.beginPath(); c.arc(cx, top + 26 * S, 8 * S, PI, 0); c.rect(cx - 8 * S, top + 26 * S, 16 * S, 8 * S); c.fill(); draw.circle(c, cx + 4 * S, top + 28 * S, 1.4 * S, "#3a2418"); }
  c.fillStyle = "#8f3327"; c.beginPath(); c.moveTo(cx - hw - 8 * S, top + 8 * S); c.lineTo(cx, top - 12 * S); c.lineTo(cx + hw + 8 * S, top + 8 * S); c.closePath(); c.fill();
  c.fillStyle = "#b5473a"; c.beginPath(); c.moveTo(cx - hw - 8 * S, top + 8 * S); c.lineTo(cx, top - 12 * S); c.lineTo(cx + 4 * S, top + 8 * S); c.closePath(); c.fill();

  c.strokeStyle = "#3a2418"; c.lineWidth = 2 * S; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 8 * S); c.stroke();
  c.fillStyle = "#b98a1e"; c.beginPath(); c.moveTo(-13 * S, 30 * S); c.quadraticCurveTo(-11 * S, 8 * S, 0, 7 * S); c.quadraticCurveTo(11 * S, 8 * S, 13 * S, 30 * S); c.closePath(); c.fill();

function plaque(c, x, y, w, h, title, val, col) {
  draw.rect(c, x - w / 2, y - h / 2 + 2, w, h, 6 * S, "rgba(0,0,0,.25)"); draw.rect(c, x - w / 2, y - h / 2, w, h, 6 * S, "#f1e3c0", "#5a3a22", 2);
  draw.text(c, title, x, y - h * .2, { size: 9.5 * S, color: "#8a5a35", weight: 700 }); draw.text(c, val || "—", x, y + h * .18, { size: 15 * S, color: col || "#3a2418", maxWidth: w - 8 });
}
function render(t) {
  const c = Lab.ctx, W = Lab.W, H = Lab.H, p = Lab.play;
  stage(c); drawBell(c, t);
  drawDoll(c, P, t); drawDoll(c, O, t);
  if (weed) { c.save(); c.translate(weed.x, gy + 8 * S - Math.abs(Math.sin(weed.r * .8)) * 14 * S); c.rotate(weed.r); c.strokeStyle = "#8a6a3a"; c.lineWidth = 2 * S; for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(0, 0, 15 * S, (5 + i * 2.4) * S, i * .63, 0, TAU); c.stroke(); } c.restore(); }

  if (st === "steady" && stT > .4 && !wide && lap === 0 && oi === 0) draw.text(c, "tap anywhere to fire", cx, ay + 88 * S, { size: 12 * S, color: "rgba(246,231,198,.55)", weight: 700 });
  // top: corks (lives), ladder, name board

  for (let i = 0; i < 3; i++) { const x = p.x + 24 * S + i * 21 * S + (i === hearts && heartShake > .05 && !Lab.reducedMotion ? Math.sin(t * 60) * 4 * heartShake : 0), on = i < hearts; c.globalAlpha = on ? 1 : .28; draw.rect(c, x - 6 * S, ry - 8 * S, 12 * S, 16 * S, 3.5 * S, on ? "#d9b98a" : "#2a1826", "#5a3a22", 1.5); if (on) { c.fillStyle = "rgba(255,255,255,.35)"; c.fillRect(x - 4 * S, ry - 6 * S, 3 * S, 12 * S); } c.globalAlpha = 1; }
  for (let i = 0; i < ROSTER.length; i++) { const x = p.x + p.w - 20 * S - (ROSTER.length - 1 - i) * 15.5 * S, done = i < oi, cur = i === oi; draw.circle(c, x, ry, (cur ? 7 : 5.2) * S, done ? "rgba(255,255,255,.22)" : ROSTER[i].body, cur ? "#fff" : "rgba(0,0,0,.3)", cur ? 2 : 1); if (done) { c.strokeStyle = "#ffe08a"; c.lineWidth = 1.8; c.beginPath(); c.moveTo(x - 3 * S, ry); c.lineTo(x - .8 * S, ry + 2.6 * S); c.lineTo(3.4 * S + x, ry - 3 * S); c.stroke(); } }

function attract(dt, t) {
