<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Quick Draw", instructions:"Wait for DRAW! Then tap fast to beat the cowboy.", restart:start});
let phase, wait, you=0, them=0, bestMs=Infinity;
function start(){
  phase='ready'; wait=Lab.rand(2,5);
  Lab.input.onTap=[()=>{
    if(phase==='ready'){ phase='fail'; Lab.toast("Cheater!"); them++; }
    else if(phase==='go'){
      const r=Math.round(performance.now()-tStart);
      const enemy = enemyTime;
      if(r<enemy){ you++; Lab.toast("HIT! "+r+" ms"); if(r<bestMs)bestMs=r; }
      else { them++; Lab.toast("Lost. "+r+" ms"); }
      phase='done';
    } else if(phase==='done'||phase==='fail'){
      phase='ready'; wait=Lab.rand(2,5);
    }
    Lab.setScore(you+":"+them);
  }];
  let tStart=0, enemyTime=0;
  Lab.loop(dt=>{
    if(phase==='ready'){ wait-=dt; if(wait<=0){ phase='go'; tStart=performance.now(); enemyTime=Lab.rand(280,520); Lab.beep(900,.1);} }
    const c=Lab.ctx,w=Lab.W,h=Lab.H;
    c.fillStyle=phase==='go'?'#3df58a':'#3a2410'; c.fillRect(0,0,w,h);
    c.fillStyle="#fff"; c.font="60px sans-serif"; c.textAlign="center";
    c.fillText("🤠       🤠", w/2, h/2-40);
    c.font="bold 42px sans-serif";
    c.fillStyle="#fff";
    c.fillText(phase==='ready'?"Steady...":phase==='go'?"DRAW!":phase==='fail'?"Too soon":"Bang!", w/2, h/2+40);
    c.font="16px sans-serif"; c.fillStyle="#ffd35a";
    c.fillText("You "+you+" : "+them+" Bandit", w/2, h/2+80);
  });
}
start();
</script></body></html>
