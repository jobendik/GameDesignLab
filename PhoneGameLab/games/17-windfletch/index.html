<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Windfletch</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* WINDFLETCH — village-fair archery. Pull back anywhere to draw the bow, release to loose.
 * Identity: sunny paper-craft meadow, bunting and pennants that show the wind, a little hooded archer, folk-bounce music.
 * Depth: wind is a real force on the arrow (the aim guide only shows the first, wind-less part of the arc), arrows are
 * lives (a miss costs one, gold returns one), consecutive hits build a ×5 streak, and a tethered balloon invites a
 * riskier arc: thread it on the way to the target for a doubled "through shot".
 * Ramp: every 3 hits the range grows — farther, smaller, windier, then bobbing targets and gusts.                */
Lab.init({
  title: "Windfletch", tagline: "Read the wind. Split the gold.", category: "Arcade & Action",
  howto: ["Drag back anywhere to draw the bow, release to loose", "Wind bends every shot — watch the pennants", "Gold returns an arrow; a miss costs one"],
  theme: { bg: "#f3e2b5", bg2: "#bfe3ee", fg: "#3a2a18", muted: "#7c6a50", accent: "#e2572b", accent2: "#f0a92c", light: true },
  orient: "any", music: { style: "bounce", key: "G", vol: .4 }, restart: start,
  attract(dt, t) { if (!demo) { reset(); demo = true; } tg.t += dt; place(tg); windVis = Math.sin(t * .4) * .5; render(t, -.3 + Math.sin(t * .8) * .12, 0, dt); },
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, lerp = Lab.lerp;
const RING = [{ n: "GOLD!", p: 50, c: "#f5c23a" }, { n: "Red", p: 30, c: "#d9412f" }, { n: "Blue", p: 20, c: "#3f7fbf" }, { n: "White", p: 10, c: "#fff6e2" }];
const STEP = 1 / 120, MAXQ = 6, WK = .9, RANGE_K = 2.3, ANG_MIN = -1.38, ANG_MAX = .42, FLAGS = ["#e2572b", "#f5c23a", "#fff6e2", "#3f9c8f"];
let S, groundY, bow, Dmax, G, Vmax, yLow, yHigh;
let score, quiver, streak, bestStreak, golds, hits, level, wind, windNow, windVis, gph, tg, oldTg, arrows, litter, balloon;
let aim, aimAng, shownAng, shownPow, kbHeld, reload, acc, ended, now, clouds, motes, twang, lean, lastStep, warned, tufts, blink, hintT, streakT, demo = false;

function layout() {
  const P = Lab.play;
  S = clamp(Math.min(Lab.W / 390, P.h / 330), .75, 1.5);
  groundY = P.y + P.h - Math.max(58 * S, P.h * .2);
  const mL = 56 * S, mR = 48 * S, Dfull = Lab.W - mL - mR; Dmax = Math.min(Dfull, 560 * S);
  bow = { x: mL + (Dfull - Dmax) / 2, y: groundY - 50 * S };
  G = 720 * S; Vmax = Math.sqrt(G * Dmax * RANGE_K);
  yLow = groundY - 60 * S; yHigh = Math.max(P.y + 100 * S, groundY - Math.min(330 * S, P.h * .62));
  tufts = Array.from({ length: Math.ceil(Lab.W / 13) }, (_, i) => ({ x: i * 13 + Lab.rand(-4, 4), h: Lab.rand(7, 15), p: Lab.rand(0, TAU), y: Lab.rand(0, 1) }));
}
Lab.onResize(() => { if (!arrows) return; layout(); arrows = arrows.filter(a => a.state !== "fly"); litter = []; if (aim) aim.on = false; });

function reset() {
  layout();
  score = 0; quiver = 5; streak = 0; bestStreak = 0; golds = 0; hits = 0; level = 1; wind = 0; windNow = 0; windVis = 0; gph = Lab.rand(0, TAU);
  arrows = []; litter = []; balloon = null; oldTg = null; aim = { on: false, sx: 0, sy: 0, x: 0, y: 0, held: 0, kb: false };
  aimAng = -.3; shownAng = -.3; shownPow = 0; kbHeld = false; reload = 0; acc = 0; ended = false; now = 0; twang = 0; lean = 0; lastStep = 0; warned = false; blink = 2; hintT = 0; streakT = 9;
  clouds = Array.from({ length: 5 }, (_, i) => ({ x: Lab.rand(0, 1), y: Lab.rand(.02, .3), s: Lab.rand(.6, 1.15), v: Lab.rand(.6, 1.3) }));
  motes = Array.from({ length: 16 }, () => ({ x: Lab.rand(0, 1), y: Lab.rand(.1, .95), p: Lab.rand(0, TAU), v: Lab.rand(.5, 1.2) }));
  tg = mkTarget();
}
function start() {
  reset(); demo = false;
  Lab.setScore(0);
  Lab.input.onDown = [(x, y) => { if (ended) return; aim.on = true; aim.kb = false; aim.sx = aim.x = x; aim.sy = aim.y = y; aim.held = 0; lastStep = 0; }];
  Lab.input.onMove = [(x, y) => { if (aim.on && !aim.kb) { aim.x = x; aim.y = y; } }];
  Lab.input.onUp = [(x, y) => { if (!aim.on || aim.kb) return; aim.x = x; aim.y = y; const p = pull(); aim.on = false; if (p.power >= .1) fire(p.ang, p.power); else if (p.len > 6) Lab.sfx("tick", { pitch: .7 }); }];
  Lab.expose({
    get score() { return score; }, get quiver() { return quiver; }, get streak() { return streak; }, get level() { return level; }, get hits() { return hits; }, get golds() { return golds; },
    get wind() { return windNow; }, get flying() { return flying(); }, get target() { return { x: tg.x, y: tg.y, r: tg.r, phase: tg.phase }; }, get bow() { return { x: bow.x, y: bow.y }; },
    get balloon() { return balloon && balloon.alive ? { x: balloon.x, y: balloon.y, r: balloon.r } : null; }, get pullMax() { return 124 * S; }, get pullMin() { return 12 * S; },
    fire, solve, setLevel(n) { level = n; hits = (n - 1) * 3; }, next() { nextTarget(); },
  });
  Lab.loop(frame);
}
const flying = () => arrows.reduce((n, a) => n + (a.state === "fly" ? 1 : 0), 0);
const canFire = () => !ended && reload <= 0 && quiver - flying() > 0;
function pull() {
  const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx, dy);
  let ang = Math.atan2(dy, dx); if (dx < 0) ang = dy < 0 ? ANG_MIN : ANG_MAX;
  return { ang: clamp(ang, ANG_MIN, ANG_MAX), power: clamp((len - 12 * S) / (112 * S), 0, 1), len };
}
const speedOf = p => Vmax * lerp(.42, 1, p);
const muzzle = ang => ({ x: bow.x + Math.cos(ang) * 30 * S, y: bow.y + Math.sin(ang) * 30 * S });

function mkTarget() {
  const L = level, first = hits === 0, fmax = lerp(.66, 1, clamp((L - 1) / 5, 0, 1));
  const o = {
    fx: first ? .64 : Lab.rand(Math.max(.56, fmax - .22), fmax), fy: first ? .1 : Lab.rand(.02, L < 2 ? .4 : .96), rU: Math.max(23, 46 - (L - 1) * 3),
    bobA: L >= 3 ? Math.min(62, 14 + (L - 3) * 10) : 0, bobW: .85 + L * .09, ph: Lab.rand(0, TAU), t: 0, show: 0, wob: 0, wobT: 0, phase: "live", stuck: [], x: 0, y: 0, r: 0,
  };
  Lab.tween(o, { show: 1 }, .45, { ease: "outBack" });
  const was = wind;
  wind = L >= 2 && !first ? Lab.rand(.25, Math.min(1, .32 + (L - 2) * .14)) * (Lab.chance(.5) ? 1 : -1) : 0;
  if (Math.abs(wind - was) > .3) Lab.sfx("whoosh", { pitch: .7 + Math.abs(wind) * .5 });
  if (wind && !warned) { warned = true; Lab.toast("The wind is up — watch the pennants", 1700); }
  place(o);
  balloon = null;
  if (L >= 2 && !first && Lab.chance(.5)) {
    const u = Lab.rand(.42, .7), bx = lerp(bow.x, o.x, u), by = lerp(bow.y, o.y, u) - Lab.rand(26, 84) * S;
    balloon = { x: bx, y: Math.max(Lab.play.y + 96 * S, bow.y - reach(bx) * .8, by), r: 15 * S, ph: Lab.rand(0, TAU), alive: true, show: 0, col: Lab.choose(["#e2572b", "#3f9c8f", "#c8508c"]) };
    Lab.tween(balloon, { show: 1 }, .5, { ease: "outBack", delay: .15 });
  }
  return o;
}
function place(o) {
  o.r = o.rU * S; o.x = bow.x + Dmax * o.fx;
  const top = Math.max(yHigh, bow.y - reach(o.x) * .7);
  o.y = clamp(lerp(yLow, top, o.fy) + Math.sin(o.t * o.bobW + o.ph) * o.bobA * S, top - 8 * S, yLow + 6 * S);
}
/* highest point (above the bow) a full-draw shot can reach at horizontal position x — keeps every target hittable on any screen */
function reach(x) { const R = Vmax * Vmax / G, d = x - bow.x; return (R * R - d * d) / (2 * R); }
function nextTarget() {
  if (ended) return;
  oldTg = tg; const og = oldTg; og.phase = "gone"; Lab.tween(og, { show: 0 }, .26, { ease: "inBack", onDone() { if (oldTg === og) oldTg = null; } });
  if (balloon && balloon.alive) { const b = balloon; b.alive = false; b.free = true; litter.push({ kind: "balloon", b, t: 0 }); }
  tg = mkTarget();
}

function fire(ang, power) {
  if (!canFire()) { if (!ended && quiver - flying() <= 0) Lab.sfx("tick", { pitch: .6 }); return false; }
  ang = clamp(ang, ANG_MIN, ANG_MAX); power = clamp(power, 0, 1); aimAng = ang;
  const m = muzzle(ang), v = speedOf(power);
  arrows.push({ x: m.x, y: m.y, px: m.x, py: m.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, ang, state: "fly", t: 0, pops: 0, trail: [] });
  reload = .22; twang = 1; lean = -power;
  Lab.audio.tone({ f: 250 + power * 120, f2: 120, dur: .16, type: "triangle", vol: .22 }); Lab.sfx("swish", { pitch: .8 + power * .5 }); Lab.buzz(10);
  fx.sparks(m.x, m.y, ang, { n: 4, color: "#fff6e2", speed: 200, life: .2 });
  return true;
}
function stepArrow(a) {
  a.px = a.x; a.py = a.y;
  a.vx += windNow * WK * G * STEP; a.vy += G * STEP; a.x += a.vx * STEP; a.y += a.vy * STEP; a.ang = Math.atan2(a.vy, a.vx); a.t += STEP;
  if (balloon && balloon.alive && balloon.show > .6 && Lab.dist(a.x, a.y, balloon.x, balloon.y) < balloon.r + 5 * S) popBalloon(a);
  if ((tg.phase === "live" || tg.phase === "hit") && tg.show > .7 && a.px < tg.x && a.x >= tg.x) {
    const yc = lerp(a.py, a.y, (tg.x - a.px) / (a.x - a.px));
    if (Math.abs(yc - tg.y) <= tg.r * 1.05) { a.x = tg.x; a.y = yc; return hit(a, yc); }
  }
  if (a.y >= groundY + 3 * S && a.vy > 0) { a.y = groundY + 3 * S; return miss(a, true); }
  if (a.x > Lab.W + 70 || a.x < -70 || a.y > Lab.H + 60) miss(a, false);
}
function popBalloon(a) {
  const b = balloon; b.alive = false; a.pops++;
  const m = clamp(streak, 1, 5), pts = 25 * m; score += pts; Lab.setScore(score);
  fx.burst(b.x, b.y, { n: 14, colors: [b.col, "#fff6e2"], speed: 240, life: .5, size: 4, shape: "shard", gravity: 500 }); fx.ring(b.x, b.y, { r0: b.r * .6, r1: b.r * 2.4, color: b.col, width: 3 });
  fx.text(b.x, b.y - b.r - 8 * S, "+" + pts, { color: "#fff", size: 17 * S }); Lab.sfx("pop", { pitch: 1.25 }); Lab.hitstop(.03);
}
function hit(a, yc) {
  const d = Math.abs(yc - tg.y) / tg.r, ring = d <= .22 ? 0 : d <= .5 ? 1 : d <= .78 ? 2 : 3, R = RING[ring];
  a.state = "stuck"; a.oy = yc - tg.y; a.stickT = 0; tg.stuck.push(a); arrows.splice(arrows.indexOf(a), 1);
  streak++; streakT = 0; bestStreak = Math.max(bestStreak, streak); hits++;
  const mult = clamp(streak, 1, 5), through = a.pops > 0, pts = R.p * mult * (through ? 2 : 1);
  score += pts; Lab.setScore(score); Lab.bumpScore();
  tg.wob = (ring === 0 ? .2 : .13) * (yc < tg.y ? -1 : 1); tg.wobT = 0;
  const hx = tg.x, hy = yc;
  fx.sparks(hx - 4 * S, hy, Math.PI, { n: 7 + (3 - ring) * 3, colors: ["#e9d28a", "#c9a45c", "#fff"], speed: 260, spread: 1.6, life: .4, gravity: 600 });
  fx.text(hx - 6 * S, hy - tg.r - 16 * S, (through ? "THROUGH SHOT  " : "") + "+" + pts, { color: ring === 0 ? "#ffd84a" : "#fff", size: (through || ring === 0 ? 24 : 19) * S, outline: "rgba(60,40,20,.6)" });
  if (mult > 1) fx.text(hx - 6 * S, hy - tg.r - 40 * S, "streak ×" + mult, { color: "#ffe9a8", size: 14 * S, life: .8, outline: "rgba(60,40,20,.6)" });
  Lab.sfx("thud", { pitch: 1.5 - ring * .2 }); Lab.sfx("knock", { pitch: 1.4 - ring * .15 }); Lab.audio.combo(Math.min(streak, 9) + (ring === 0 ? 2 : 0), { vol: .16 });
  Lab.shake(ring === 0 ? 7 : 3, .2); Lab.buzz(ring === 0 ? 24 : 12);
  if (ring === 0) {
    golds++; Lab.hitstop(.07); Lab.sfx("chime"); Lab.flash("#ffe9a8", .18, .28);
    fx.ring(hx, hy, { r0: 6, r1: tg.r * 2.6, color: "#ffd84a", width: 5, life: .5 }); fx.burst(hx, hy, { n: 16, colors: ["#ffd84a", "#fff", "#f0a92c"], speed: 300, life: .7, shape: "star", size: 4.5, gravity: 300 });
    if (quiver < MAXQ) { quiver++; fx.text(hx - 6 * S, hy + tg.r + 20 * S, "+1 arrow", { color: "#fff", size: 15 * S, vy: 40, outline: "rgba(60,40,20,.6)" }); }
  }
  if (tg.phase === "live") {
    tg.phase = "hit";
    const nl = 1 + Math.floor(hits / 3);
    if (nl > level) { level = nl; Lab.after(.45, () => { Lab.banner("RANGE " + level, { color: "#fff6e2", ms: 1000 }); Lab.sfx("levelup"); }); }
    Lab.after(.62, nextTarget);
  }
}
function miss(a, ground) {
  arrows.splice(arrows.indexOf(a), 1);
  quiver = Math.max(0, quiver - 1); streak = 0;
  if (ground) {
    a.state = "ground"; a.stickT = 0; litter.push({ kind: "arrow", a, t: 0 }); if (litter.length > 9) litter.shift();
    fx.puff(a.x, groundY, { n: 7, color: "rgba(160,190,110,.8)", speed: 80 }); fx.burst(a.x, groundY, { n: 5, color: "#5c9a43", speed: 150, angle: -Math.PI / 2, spread: 1.4, life: .45, size: 3, shape: "shard" });
    fx.text(a.x, groundY - 26 * S, "miss", { color: "#fff6e2", size: 15 * S, outline: "rgba(60,40,20,.55)" }); Lab.sfx("thud", { pitch: .75 });
  } else fx.text(clamp(a.x, 40, Lab.W - 40), clamp(a.y, Lab.play.y + 60, groundY - 20), "wide!", { color: "#fff6e2", size: 15 * S, outline: "rgba(60,40,20,.55)" });
  Lab.audio.tone({ f: 300, f2: 170, dur: .22, type: "triangle", vol: .13 });
  if (quiver === 1) Lab.sfx("warn", { pitch: .8 });

function end() {
  Lab.gameover({ title: "Quiver empty", message: level > 1 ? "You shot your way to range " + level + "." : "The fair is just getting started.", score, stats: [["Golds", golds], ["Best streak", bestStreak], ["Range", level]] });
}
/* where would a wind-aware shot cross the target plane?  (used by tests; the player only sees the wind-less guide) */
function planeY(ang, power, x1) {
  const m = muzzle(ang), v = speedOf(power); let x = m.x, y = m.y, vx = Math.cos(ang) * v, vy = Math.sin(ang) * v;
  for (let i = 0; i < 600; i++) { const px = x, py = y; vx += windNow * WK * G * STEP; vy += G * STEP; x += vx * STEP; y += vy * STEP; if (px < x1 && x >= x1) return lerp(py, y, (x1 - px) / (x - px)); if (y > groundY + 3 * S && vy > 0) return null; }
  return null;
}
function solve(power, tx, ty) {
  power = power == null ? 1 : power; tx = tx == null ? tg.x : tx; ty = ty == null ? tg.y : ty;
  let best = null, bd = 1e9, prev = null, pa = 0;
  for (let a = ANG_MAX; a >= -1.1; a -= .01) {
    const y = planeY(a, power, tx); if (y == null) { prev = null; continue; }
    if (Math.abs(y - ty) < bd) { bd = Math.abs(y - ty); best = a; }
    if (prev != null && (prev - ty) * (y - ty) <= 0) { let lo = a, hi = pa; for (let i = 0; i < 18; i++) { const mid = (lo + hi) / 2, ym = planeY(mid, power, tx); if (ym == null || ym > ty) hi = mid; else lo = mid; } return { ang: (lo + hi) / 2, power, err: 0 }; }
    prev = y; pa = a;
  }
  return best == null ? null : { ang: best, power, err: bd };
}

function frame(dt, t) {
  now = t; reload -= dt; twang = Math.max(0, twang - dt * 3.2); lean = Lab.damp(lean, 0, 7, dt); blink -= dt; if (blink < -.12) blink = Lab.rand(2, 5); hintT += dt; streakT += dt;
  // keyboard: Up/Down tilt, hold Space/Enter to draw, release to loose
  const k = Lab.input.keys, hold = !!(k[" "] || k.Space || k.Enter), ay = Lab.input.axisY();
  if (ay && !(aim.on && !aim.kb)) aimAng = clamp(aimAng + ay * .9 * dt, ANG_MIN, ANG_MAX);
  if (hold && !kbHeld && !aim.on && !ended) { aim.on = true; aim.kb = true; aim.pow = 0; aim.held = 0; lastStep = 0; }
  if (aim.on && aim.kb) { if (hold) aim.pow = Math.min(1, aim.pow + dt / .7); else { aim.on = false; if (aim.pow >= .1) fire(aimAng, aim.pow); } }
  kbHeld = hold;

  let ang = aimAng, pow = 0;
  if (aim.on) {
    aim.held += dt;
    if (aim.kb) pow = aim.pow; else { const p = pull(); pow = p.power; if (p.len > 12 * S) aimAng = p.ang; }
    const trem = clamp((aim.held - 2.2) / 2.5, 0, 1) * pow; ang = aimAng + Math.sin(t * 27) * .014 * trem + Math.sin(t * 11.3) * .01 * trem;
    const st = Math.floor(pow * 9); if (st !== lastStep) { if (st > lastStep) { Lab.audio.tone({ f: 150 + st * 26, dur: .05, type: "triangle", vol: .05 + st * .006 }); Lab.audio.noise({ dur: .03, vol: .03, bp: 900 + st * 160, q: 3 }); } lastStep = st; }
  }
  shownAng = Lab.damp(shownAng, ang, 26, dt); shownPow = aim.on ? Lab.damp(shownPow, pow, 30, dt) : Lab.damp(shownPow, 0, 40, dt);

  Lab.music.intensity(clamp(.28 + level * .07 + (quiver <= 1 ? .22 : 0) + Math.min(streak, 5) * .04, 0, 1));

}

/* ---------- drawing ---------- */
function backdrop() {
  const W = Lab.W, H = Lab.H, gy = groundY;
  return Lab.sprite("wf-bg:" + W + "x" + H, W, H, g => {
    draw.vgrad(g, 0, 0, W, gy + 4, [[0, "#8ecde3"], [.55, "#c9e8e2"], [1, "#fbf0cf"]]);
    draw.glow(g, W * .8, Lab.play.y + (gy - Lab.play.y) * .2, 150 * S, "#fff7c9", .9); draw.circle(g, W * .8, Lab.play.y + (gy - Lab.play.y) * .2, 26 * S, "#fffbe0");
    const rnd = Lab.rng(11), hill = (base, amp, col, edge, f) => {
      g.beginPath(); g.moveTo(-10, gy + 10);
      for (let x = -10; x <= W + 10; x += 8) g.lineTo(x, base - amp * (Math.sin(x * f / S + base) * .6 + Math.sin(x * f * 2.3 / S + 1.7) * .4));
      g.lineTo(W + 10, gy + 10); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = edge; g.lineWidth = 2.5 * S; g.stroke();
    };
    hill(gy - 96 * S, 26 * S, "#b5d8a8", "#cfe8c0", .011); hill(gy - 58 * S, 20 * S, "#93c684", "#b2dba0", .017);
    for (let i = 0, n = Math.ceil(W / (90 * S)); i < n; i++) {   // round paper trees
      const x = (i + .2 + rnd() * .6) * W / n, y = gy - (44 + rnd() * 26) * S, r = (11 + rnd() * 9) * S;
      g.fillStyle = "#7a5a3a"; g.fillRect(x - 1.5 * S, y, 3 * S, r * 1.5); draw.circle(g, x, y, r, "#5fa35a"); draw.circle(g, x - r * .3, y - r * .3, r * .55, "#77b86c");
    }
    for (const [fx0, sc, c1] of [[.3, 1, "#e2572b"], [.62, .78, "#3f9c8f"]]) {   // fair tents
      const x = W * fx0, w = 46 * S * sc, h = 34 * S * sc, y = gy - 30 * S;
      g.fillStyle = "#fff6e2"; g.fillRect(x - w * .42, y - h * .5, w * .84, h * .5);
