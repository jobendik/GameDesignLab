  for (const [a, b] of [[0, 0], [1, 0], [0, 1], [1, 1]]) { const x = gx - pad + 5 + a * (bw + pad * 2 - 10), y = gy - pad + 5 + b * (bh + pad * 2 - 10); draw.circle(c, x, y, 5, "#d9b35a"); draw.circle(c, x, y, 2.2, "#0a2a24"); }

  }

    draw.circle(c, Lab.lerp(CX(p[i]), CX(p[i + 1]), k), Lab.lerp(CY(p[i]), CY(p[i + 1]), k), cell * .17, `rgba(255,255,255,${u > 1 ? (1.4 - u) * 1.2 : .5})`); }

    glyph(c, colr[e], x, y, r * .5);

  if (mode === "demo") return;
