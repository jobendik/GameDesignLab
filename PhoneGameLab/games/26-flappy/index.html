<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Flappy Tap", instructions:"Tap to flap. Pass through pipe gaps.", restart:start});
let bird,pipes,t,spawn,score,dead;
function start(){
  bird={x:Lab.W*0.3,y:Lab.H/2,vy:0,r:14};
  pipes=[]; t=0; spawn=0; score=0; dead=false; Lab.setScore(0);
  Lab.input.onTap=[()=>{ if(!dead){ bird.vy=-380; Lab.beep(700,.04);}}];
  Lab.loop(dt=>{
    if(dead) return;
    bird.vy+=1200*dt; bird.y+=bird.vy*dt;
    t+=dt; spawn-=dt;
    if(spawn<=0){ spawn=1.3; const gap=140; const cy=Lab.rand(140,Lab.H-200); pipes.push({x:Lab.W+30, cy, gap, scored:false});}
    for(const p of pipes) p.x-=170*dt;
    pipes=pipes.filter(p=>p.x>-80);
    for(const p of pipes){
      if(!p.scored && p.x<bird.x){ p.scored=true; score++; Lab.setScore(score); Lab.beep(900,.05);}
      if(Math.abs(p.x-bird.x)<35){
        if(bird.y-bird.r<p.cy-p.gap/2 || bird.y+bird.r>p.cy+p.gap/2){ dead=true; Lab.gameover({title:"Splat",message:"Score: "+score}); return; }
      }
    }
    if(bird.y<0||bird.y>Lab.H){ dead=true; Lab.gameover({title:"Splat",message:"Score: "+score}); return; }
    const c=Lab.ctx; c.fillStyle="#5dd"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const p of pipes){ c.fillStyle="#3a8a3a"; c.fillRect(p.x-35,0,70,p.cy-p.gap/2); c.fillRect(p.x-35,p.cy+p.gap/2,70,Lab.H-p.cy-p.gap/2);}
    c.beginPath(); c.fillStyle="#ffd35a"; c.arc(bird.x,bird.y,bird.r,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle="#fff"; c.arc(bird.x+5,bird.y-4,3,0,Lab.TAU); c.fill();
  });
}
start();
</script></body></html>
