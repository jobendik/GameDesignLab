<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Piano Tiles", instructions:"Tap black tiles as they fall. Don't miss, don't tap white.", restart:start});
let tiles, score, sp, t, dead;
function start(){
  tiles=[]; score=0; sp=180; t=0; dead=false; Lab.setScore(0);
  // pre-fill
  let y=0; for(let i=0;i<6;i++){ tiles.push({lane:Lab.randInt(0,3), y, hit:false}); y -= Lab.H/4;}
  Lab.input.onTap=[(x,y)=>{ if(dead) return;
    const lane=Math.floor(x/(Lab.W/4));
    // find tile in bottom band
    const hitY = Lab.H - Lab.H/4;
    let found=null;
    for(const t of tiles) if(!t.hit && t.lane===lane && t.y>hitY-20 && t.y<Lab.H+20){ found=t; break;}
    if(found){ found.hit=true; score++; Lab.setScore(score); Lab.beep(400+lane*100,.05); sp+=2;}
    else { dead=true; Lab.gameover({title:"Wrong tile",message:"Score: "+score});}
  }];
  Lab.loop(dt=>{ if(dead) return;
    for(const t of tiles){ t.y += sp*dt;}
    // remove missed
    for(const t of tiles){ if(t.y>Lab.H+20){ if(!t.hit){ dead=true; Lab.gameover({title:"Missed!",message:"Score: "+score}); return;}}}
    tiles=tiles.filter(t=>t.y<Lab.H+40);
    while(tiles.length<8){ const top=Math.min(...tiles.map(t=>t.y)); tiles.push({lane:Lab.randInt(0,3), y:top-Lab.H/4, hit:false});}
    draw();
  });
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#fff"; c.fillRect(0,0,Lab.W,Lab.H);
  // lane lines
  for(let i=1;i<4;i++){ c.fillStyle="#ddd"; c.fillRect(i*Lab.W/4-1, 0, 2, Lab.H);}
  // hit zone
  c.fillStyle="rgba(0,255,0,0.1)"; c.fillRect(0, Lab.H-Lab.H/4, Lab.W, Lab.H/4);
  for(const t of tiles){ c.fillStyle=t.hit?"#aaa":"#222"; c.fillRect(t.lane*Lab.W/4+2, t.y, Lab.W/4-4, Lab.H/4-4);}
}
start();
</script></body></html>
