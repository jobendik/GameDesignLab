<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Bow & Arrow", instructions:"Drag back from the bow, release to fire.", restart:start});
let bow,target,arrow,aiming,sx,sy,score,arrows,gravity=600;
function newTarget(){
  target={x:Lab.W-80, y:Lab.rand(120,Lab.H-160), r:42, vy:Lab.rand(-60,60)};
}
function start(){
  bow={x:60,y:Lab.H-160}; score=0; arrows=5; aiming=false; arrow=null;
  Lab.setScore(0); newTarget();
  Lab.input.onDown=[(x,y)=>{ if(arrow) return; aiming=true; sx=x; sy=y; }];
  Lab.input.onUp=[(x,y)=>{ if(!aiming) return; aiming=false;
    if(arrows<=0) return;
    const dx=sx-x, dy=sy-y; const pw=Math.min(Math.hypot(dx,dy),200);
    if(pw<10) return;
    arrows--;
    const ang=Math.atan2(dy,dx);
    arrow={x:bow.x,y:bow.y, vx:Math.cos(ang)*pw*6, vy:Math.sin(ang)*pw*6};
  }];
  Lab.loop(dt=>{
    target.y+=target.vy*dt; if(target.y<120||target.y>Lab.H-100) target.vy*=-1;
    if(arrow){ arrow.vy+=gravity*dt; arrow.x+=arrow.vx*dt; arrow.y+=arrow.vy*dt;
      if(Lab.dist(arrow.x,arrow.y,target.x,target.y)<target.r){
        const d=Lab.dist(arrow.x,arrow.y,target.x,target.y);
        const pts = d<12?30 : d<24?15 : 5;
        score+=pts; Lab.setScore(score); Lab.toast("+"+pts);
        Lab.beep(900,.06);
        arrow=null; newTarget();
      } else if(arrow.x>Lab.W||arrow.y>Lab.H||arrow.x<0){ arrow=null; }
    }
    if(arrows<=0 && !arrow) Lab.gameover({title:"Out of arrows",message:"Score: "+score});
    const c=Lab.ctx; c.fillStyle="#2c3a18"; c.fillRect(0,0,Lab.W,Lab.H);
    // target
    c.beginPath(); c.fillStyle="#fff"; c.arc(target.x,target.y,target.r,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle="#ff5577"; c.arc(target.x,target.y,target.r*0.72,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle="#fff"; c.arc(target.x,target.y,target.r*0.42,0,Lab.TAU); c.fill();
    c.beginPath(); c.fillStyle="#ff5577"; c.arc(target.x,target.y,target.r*0.18,0,Lab.TAU); c.fill();
    // bow
    c.strokeStyle="#cc8855"; c.lineWidth=5; c.beginPath(); c.arc(bow.x-10,bow.y,50,-1,1); c.stroke();
    if(aiming){
      const dx=sx-Lab.input.x, dy=sy-Lab.input.y; const ang=Math.atan2(dy,dx);
      const pw=Math.min(Math.hypot(dx,dy),200);
      c.strokeStyle="#ddd"; c.lineWidth=2; c.beginPath();
      c.moveTo(bow.x+50,bow.y-20); c.lineTo(bow.x-pw*0.5*Math.cos(ang), bow.y-pw*0.5*Math.sin(ang)); c.lineTo(bow.x+50,bow.y+20); c.stroke();
      // arrow nocked
      c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath();
      c.moveTo(bow.x-pw*0.5*Math.cos(ang), bow.y-pw*0.5*Math.sin(ang));
      c.lineTo(bow.x+50+Math.cos(ang)*40, bow.y+Math.sin(ang)*40); c.stroke();
    }
    if(arrow){ const a=Math.atan2(arrow.vy,arrow.vx);
      c.save(); c.translate(arrow.x,arrow.y); c.rotate(a);
      c.fillStyle="#fff"; c.fillRect(-20,-2,40,4); c.beginPath(); c.moveTo(20,-6); c.lineTo(30,0); c.lineTo(20,6); c.fill();
      c.restore();
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Arrows: "+arrows, Lab.W/2, 70);
  });
}
start();
</script></body></html>
