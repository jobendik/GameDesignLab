<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Merge Idle", instructions:"Drag same-tier items together to merge. Higher tiers earn more coins/sec.", restart:start});
const ROWS=4, COLS=4;
let g, coins, dragging, drag, lastT;
function start(){
  g=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  g[0][0]=1; g[0][1]=1;
  coins=0; lastT=performance.now(); Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{ const p=pick(x,y); if(p && g[p.r][p.c]){ dragging={...p}; drag={x,y};}}];
  Lab.input.onMove=[(x,y)=>{ if(dragging) drag={x,y};}];
  Lab.input.onUp=[(x,y)=>{ if(!dragging) return; const p=pick(x,y);
    if(p && !(p.r===dragging.r && p.c===dragging.c)){
      if(g[p.r][p.c]===g[dragging.r][dragging.c]){ g[p.r][p.c]+=1; g[dragging.r][dragging.c]=0; Lab.beep(700,.05); }
      else if(g[p.r][p.c]===0){ g[p.r][p.c]=g[dragging.r][dragging.c]; g[dragging.r][dragging.c]=0;}
    }
    dragging=null;
  }];
  // buy button is the score area "B" - tap empty cell to add tier 1 for 10 coins
  Lab.input.onTap=[(x,y)=>{ const p=pick(x,y); if(p && !g[p.r][p.c] && coins>=10){ coins-=10; g[p.r][p.c]=1; Lab.setScore(Math.floor(coins));}}];
  Lab.loop(dt=>{ let income=0; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(g[r][c]) income+=g[r][c]*g[r][c];
    coins+=income*dt; Lab.setScore(Math.floor(coins)); draw();
  });
}
function pick(x,y){ const cs=cellSize(), off=offset(cs); const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs); if(c<0||c>=COLS||r<0||r>=ROWS) return null; return {r,c};}
function cellSize(){ return Math.min((Lab.W-40)/COLS, (Lab.H-300)/ROWS);}
function offset(cs){ return {x:(Lab.W-cs*COLS)/2, y:170};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  c.fillStyle="#fff"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText("Tap empty cell to spawn (10c). Drag matching tiers to merge.", Lab.W/2, 140);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    c.fillStyle="#2a2e44"; c.fillRect(x+3,y+3,cs-6,cs-6);
    if(g[r][col]){ c.fillStyle=`hsl(${g[r][col]*40},70%,55%)`; c.fillRect(x+8,y+8,cs-16,cs-16);
      c.fillStyle="#fff"; c.font=`bold ${cs*0.4}px sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(g[r][col], x+cs/2, y+cs/2);}
  }
  if(dragging){ const v=g[dragging.r][dragging.c]; c.fillStyle=`hsl(${v*40},70%,55%)`; c.globalAlpha=0.7; c.fillRect(drag.x-cs/2+8, drag.y-cs/2+8, cs-16, cs-16); c.globalAlpha=1;}
}
start();
</script></body></html>
