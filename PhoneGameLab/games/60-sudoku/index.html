<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Mini Sudoku", instructions:"4x4 sudoku: each row/col/2x2 box has 1-4. Tap cell then number.", restart:start});
let g, fixed, sel, N=4;
function start(){
  const sol=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
  // shuffle rows within bands, cols within stacks for variation
  function shuffleBands(){ for(let b=0;b<2;b++){ if(Math.random()<0.5){ [sol[b*2],sol[b*2+1]]=[sol[b*2+1],sol[b*2]];}}
    for(let b=0;b<2;b++){ if(Math.random()<0.5){ for(let r=0;r<N;r++) [sol[r][b*2],sol[r][b*2+1]]=[sol[r][b*2+1],sol[r][b*2]];}}
  }
  shuffleBands();
  g=sol.map(r=>r.slice()); fixed=Array.from({length:N},()=>Array(N).fill(true));
  // remove some
  let removed=0; while(removed<8){ const r=Lab.randInt(0,N-1), c=Lab.randInt(0,N-1); if(g[r][c]){ g[r][c]=0; fixed[r][c]=false; removed++;}}
  sel=null; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(), off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c>=0&&c<N&&r>=0&&r<N){ if(!fixed[r][c]) sel={r,c}; return;}
    // number row
    const ny=off.y+cs*N+30;
    if(y>=ny&&y<=ny+50){ const nc=Math.floor((x-(Lab.W/2-N*30))/60); if(nc>=0&&nc<N&&sel){ g[sel.r][sel.c]=nc+1; Lab.beep(500,.03);
      if(solved()) Lab.win("Solved!");}}
  }];
  Lab.loop(()=>draw());
}
function solved(){ for(let r=0;r<N;r++){ const s=new Set(); for(let c=0;c<N;c++){ if(!g[r][c]) return false; s.add(g[r][c]);} if(s.size!==N) return false;}
  for(let c=0;c<N;c++){ const s=new Set(); for(let r=0;r<N;r++) s.add(g[r][c]); if(s.size!==N) return false;}
  for(let bi=0;bi<2;bi++) for(let bj=0;bj<2;bj++){ const s=new Set(); for(let r=0;r<2;r++) for(let c=0;c<2;c++) s.add(g[bi*2+r][bj*2+c]); if(s.size!==N) return false;}
  return true;
}
function cellSize(){ return Math.min((Lab.W-40)/N, (Lab.H-380)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:160};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    c.fillStyle = (sel&&sel.r===r&&sel.c===col) ? "#3a5a8a" : (fixed[r][col]?"#22253a":"#2a2e44");
    c.fillRect(x+1,y+1,cs-2,cs-2);
    if(g[r][col]){ c.fillStyle=fixed[r][col]?"#fff":"#7c6"; c.font=`bold ${cs*0.5}px sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(g[r][col], x+cs/2, y+cs/2);}
  }
  // thick lines
  c.strokeStyle="#fff"; c.lineWidth=3; c.strokeRect(off.x, off.y, cs*N, cs*N);
  c.beginPath(); c.moveTo(off.x+cs*2, off.y); c.lineTo(off.x+cs*2, off.y+cs*N); c.moveTo(off.x, off.y+cs*2); c.lineTo(off.x+cs*N, off.y+cs*2); c.stroke();
  // numbers
  const ny=off.y+cs*N+30; const startX=Lab.W/2-N*30;
  for(let i=0;i<N;i++){ c.fillStyle="#3a5a8a"; c.fillRect(startX+i*60, ny, 50, 50);
    c.fillStyle="#fff"; c.font="bold 24px sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText(i+1, startX+i*60+25, ny+25);}
}
start();
</script></body></html>
