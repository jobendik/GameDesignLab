(function(){ "use strict";
/* POCKET REEF — an idle game you can watch. Tap the clam for pearls, invite reef creatures that make pearls on their own.

 * tap polish, kelp (global), golden bubbles (lump sum or ×5 frenzy), and the prestige loop: TURN THE TIDE trades the reef

/* ------------------------------------------------------------------ lifecycle + input */

    get starGain() { return starGain(); }, get agents() { return agents.length; }, GEN, OFF_CAP, OFF_EFF,
