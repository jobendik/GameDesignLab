<title>Lantern Noodles</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* LANTERN NOODLES — a night-market noodle cart for hungry little spirits. Read the order bubble, tap the trays to build
 * the bowl (broth, noodles or rice, toppings — any order), then tap the bowl or the customer to hand it over.
 * Pressure: every customer has a patience bar; a walk-out costs a lantern (3 = cart closed). Quick service tips more.
 * Depth:    a combo that grows with every clean serve (+10 % each, broken by binning a bowl or losing a customer), and
 *           REGULARS: from day 2 one straw-hatted regular comes twice a day — the second time they just say "the
 *           usual". Remember it for a ×2 payout, or tap the bubble to peek at the cost of their patience.
 * Days:     each day adds a recipe part (mushroom, red broth, rice, chili, swirl cake), more customers and less
 *           patience, and ends with a receipt. A spotless day relights one lantern.                                  */
Lab.init({
  title: "Lantern Noodles", tagline: "Build bowls fast. Remember your regulars.", category: "Arcade & Action",
  howto: ["Tap trays to fill the bowl as ordered", "Tap the bowl to serve before patience runs out", "Remember a regular's \"usual\" for double pay"],
  theme: { bg: "#151a3d", bg2: "#3a2752", accent: "#ff8a3d", accent2: "#ffd166" },
  orient: "any", music: { style: "funk", key: "G", bpm: 96, vol: .3 }, restart: start, attract,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, INK = "#2a1c2e";
const ING = [{ n: "Gold broth", day: 1, grp: 1 }, { n: "Red broth", day: 3, grp: 1 }, { n: "Noodles", day: 1, grp: 2 }, { n: "Rice", day: 4, grp: 2 },
  { n: "Egg", day: 1 }, { n: "Scallion", day: 1 }, { n: "Mushroom", day: 2 }, { n: "Chili", day: 5 }, { n: "Swirl cake", day: 6 }];
const SKIN = ["#8fd3c8", "#f6a6b8", "#b9a4f0", "#ffd27a", "#9fd08a", "#f3ead8"];
let wide, area, bins, bowlP, trashP, seatW, headR, bub, counterY, day, phase, tallyT, seats, queue, dayCust, spawned, spawnT, bowl, bowlIn, bowlPop, flyer, coins, hearts, combo, bestCombo, served, ds, regOrder, regReturn, trashSq, ended, lanternLit, usualSeen;

function layout() {
  const P = Lab.play; wide = P.w > P.h * 1.2; bins = [];
  if (wide) {
    const bs = Math.min((P.h - 20) / 3, P.w * .4 / 3, 150), x0 = P.x + P.w - 12 - bs * 3, y0 = P.y + (P.h - bs * 3) / 2;
    for (let i = 0; i < 9; i++) bins.push({ x: x0 + (i % 3) * bs, y: y0 + Math.floor(i / 3) * bs, w: bs, h: bs });
    area = { x: P.x + 6, y: P.y + 2, w: x0 - P.x - 18, h: P.h - 6 };
  } else {
    const bs = Math.min((P.w - 12) / 5, P.h * .125, 98), y0 = P.y + P.h - bs * 2 - 12;
    for (let i = 0; i < 4; i++) bins.push({ x: P.x + P.w / 2 + (i - 2) * bs, y: y0, w: bs, h: bs });
    for (let i = 0; i < 5; i++) bins.push({ x: P.x + P.w / 2 + (i - 2.5) * bs, y: y0 + bs, w: bs, h: bs });
    area = { x: P.x, y: P.y + 2, w: P.w, h: y0 - P.y - 10 };
  }
  seatW = area.w / 3; headR = clamp(Math.min(seatW * .34, area.h * .1), 20, 64);
  bub = { w: Math.min(seatW - 10, 210), h: clamp(area.h * .21, 60, 130), y: area.y + 28 };
  const headY = bub.y + bub.h + 12 + headR; counterY = headY + headR * 1.15;
  const room = area.y + area.h - counterY, R = Math.min(area.w * .27, room * .37, 170);
  bowlP = { x: area.x + area.w / 2, y: counterY + room * .46, r: R };
  trashP = { x: area.x + area.w - Math.max(36, R * .5), y: bowlP.y + R * .3, r: clamp(R * .3, 22, 34) };
  Lab.sprite.clear("ln:");
}
Lab.onResize(() => { if (seats) layout(); });
const seatX = k => area.x + seatW * (k + .5), headY = () => counterY - headR * 1.15;
const unlocked = id => ING[id].day <= day, same = (a, b) => a.length === b.length && a.slice().sort().join() === b.join();

function makeOrder(d, minTop) {
  const un = id => ING[id].day <= d, tops = Lab.shuffle([4, 5, 6, 7, 8].filter(un));
  const lo = Math.max(minTop || 0, d >= 6 ? 2 : d >= 2 ? 1 : 0), hi = Math.min(tops.length, d >= 4 ? 3 : d >= 2 ? 2 : 1);
  return [un(1) && Lab.chance(.45) ? 1 : 0, un(3) && Lab.chance(.4) ? 3 : 2, ...tops.slice(0, Lab.randInt(lo, hi))].sort();
}
function startDay(d) {
  day = d; phase = "serve"; dayCust = Math.min(21, 5 + d * 2); queue = dayCust; spawned = 0; spawnT = .6; seats = [null, null, null]; bowl = []; bowlIn = 0; flyer = null;
  ds = { served: 0, lost: 0, tips: 0, earned: 0, binned: 0, remembered: 0 }; regOrder = makeOrder(d, 1); regReturn = 4 + Lab.randInt(0, 2);
  Lab.banner("Day " + d, { color: "#ffd166", ms: 1100, y: .34 }); Lab.sfx("chime", { pitch: .9 });
  const nu = ING.filter(g => g.day === d && d > 1).map(g => g.n); if (nu.length) Lab.toast("New: " + nu.join(" + "), 1800, { y: .46 });
}
function start() {
  layout(); coins = 0; hearts = 3; combo = 0; bestCombo = 0; served = 0; trashSq = 0; bowlPop = 0; ended = false; usualSeen = false; lanternLit = [1, 1, 1];
  for (const b of bins) { b.sq = 0; b.wig = 0; }
  Lab.setScore(0); startDay(1);
  Lab.input.onDown = [(x, y) => {
    if (ended) return;

    const bi = bins.findIndex(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h); if (bi >= 0) { add(bi); return; }
    if (Lab.dist(x, y, trashP.x, trashP.y) < trashP.r + 10) { bin(); return; }
    if (Math.abs(x - bowlP.x) < bowlP.r * 1.08 && y > bowlP.y - bowlP.r * .6 && y < bowlP.y + bowlP.r * .95) { serveBest(); return; }
    for (const cu of seats) { if (!cu || cu.state !== "wait") continue; const cx = seatX(cu.k), inB = Math.abs(x - cx) < bub.w / 2 + 4 && y > bub.y - 6 && y < bub.y + bub.h + 8;
      if (inB || Lab.dist(x, y, cx, headY()) < headR + 8) { if (cu.hidden && inB) peek(cu); else if (same(bowl, cu.order)) serve(cu); else { cu.wig = 1; Lab.sfx("tick", { pitch: .7 }); } return; } }
  }];

  Lab.expose({
    get coins() { return coins; }, get hearts() { return hearts; }, get day() { return day; }, get phase() { return phase; }, get combo() { return combo; }, get served() { return served; }, get left() { return queue; }, get bowl() { return bowl.slice(); },
    get bins() { return bins.map((b, i) => ({ x: b.x + b.w / 2, y: b.y + b.h / 2, locked: !unlocked(i) })); }, get bowlPos() { return { x: bowlP.x, y: bowlP.y }; }, get trash() { return { x: trashP.x, y: trashP.y }; },
    get customers() { return seats.map(c => c && c.state === "wait" ? { k: c.k, order: c.order.slice(), pat: c.pat, patMax: c.patMax, hidden: c.hidden, regular: c.regular, x: seatX(c.k), y: headY(), bx: seatX(c.k), by: bub.y + bub.h / 2 } : null); },
    setPatience(k, v) { if (seats[k]) seats[k].pat = v; }, spawn(usual) { return spawn(usual); }, finishDay() { queue = 0; for (let k = 0; k < 3; k++) seats[k] = null; }, setDay(d) { startDay(d); },
  });
  Lab.loop((dt, t) => { update(dt); render(t); });
}

/* ---------- customers */
function spawn(forceUsual) {

  const idx = spawned++, k = idx === 0 ? free[0] : Lab.choose(free); let order, regular = false, hidden = false;
  if (forceUsual || (day >= 2 && idx === regReturn)) { order = regOrder; regular = hidden = true; }
  else if (day >= 2 && idx === 1) { order = regOrder; regular = true; if (!usualSeen) { usualSeen = true; Lab.toast("A regular — remember this order!", 2200, { y: .46 }); } }
  else order = day === 1 && idx === 0 ? [0, 2] : day === 1 && idx === 1 ? [0, 2, 4] : makeOrder(day);
  const pm = Math.max(11, 25 - day * 1.6) + (order.length - 2) * 2;
  seats[k] = { k, kind: regular ? 5 : Lab.randInt(0, 4), order, pat: pm, patMax: pm, in: 0, out: 0, state: "wait", regular, hidden, peeked: false, ph: Lab.rand(0, 6), wig: 0, hop: 0 };
  if (!forceUsual) queue--; Lab.sfx("chime", { pitch: 1.2 + k * .12, vol: .5 }); return true;
}
function peek(cu) { cu.hidden = false; cu.peeked = true; cu.pat = Math.max(1.5, cu.pat - cu.patMax * .3); cu.wig = 1; Lab.sfx("flip"); fx.text(seatX(cu.k), bub.y - 4, "peek −30%", { color: "#ff9d9d", size: 14 }); }
function add(id) {
  const b = bins[id]; if (!b || phase !== "serve") return false;
  if (!unlocked(id)) { b.wig = 1; Lab.sfx("error", { vol: .4 }); return false; }
  if (bowl.includes(id) || (ING[id].grp && bowl.some(j => ING[j].grp === ING[id].grp))) { b.wig = 1; Lab.sfx("tick", { pitch: .6 }); return false; }
  bowl.push(id); b.sq = 1; bowlPop = 1; Lab.buzz(6);
  if (id < 2) { Lab.sfx("splash", { pitch: id ? .85 : 1.05, vol: .5 }); } else if (id < 4) Lab.sfx("swish", { pitch: id === 2 ? 1 : .7 }); else Lab.sfx("pop", { pitch: .8 + (id - 4) * .12, vol: .7 });
  fx.burst(bowlP.x, bowlP.y - bowlP.r * .1, { n: 6, colors: [["#f0b23e", "#d9482f", "#ffe08a", "#fff", "#fff3d0", "#8fd06a", "#a8693d", "#e0452f", "#ffb3c7"][id], "#fff"], speed: 110, life: .35, size: 3, gravity: 500, angle: -1.57, spread: 1.6 });
  return true;
}
function bin() { if (!bowl.length || phase !== "serve") return; bowl = []; combo = 0; ds.binned++; trashSq = 1; bowlIn = 0; Lab.sfx("crunch"); fx.text(trashP.x, trashP.y - trashP.r - 6, "binned", { color: "#ff9d9d", size: 14 }); }
function serveBest() {
  const m = seats.filter(c => c && c.state === "wait" && same(bowl, c.order)).sort((a, b) => a.pat - b.pat)[0];
  if (m) return serve(m); bowlPop = .6; Lab.sfx("tick", { pitch: .7 }); if (bowl.length) Lab.toast("No one ordered that — bin it?", 1100, { y: .5 }); return false;
}
function serve(cu) {
  const frac = clamp(cu.pat / cu.patMax, 0, 1), price = 4 + 2 * cu.order.length, tip = Math.round(price * frac * .8), rem = cu.regular && cu.hidden ? 2 : 1;
  combo++; bestCombo = Math.max(bestCombo, combo); served++; ds.served++; ds.tips += tip; if (rem > 1) ds.remembered++;
  const gain = Math.round((price + tip) * (1 + .1 * Math.min(combo - 1, 10)) * rem); coins += gain; ds.earned += gain; Lab.setScore(coins); Lab.bumpScore();
  const x = seatX(cu.k), y = headY(); cu.state = "happy"; cu.hop = 1; cu.hidden = false;

}
function walkOut(cu) {

}
function update(dt) {

/* ---------- art */

  else if (id === 7) { g.beginPath(); g.moveTo(-.5, -.52); g.bezierCurveTo(.3, -.6, .8, .1, .62, .74); g.bezierCurveTo(.3, .3, -.2, -.02, -.66, -.2); g.closePath(); g.fillStyle = "#e0452f"; g.fill(); g.stroke(); g.beginPath(); g.moveTo(-.56, -.36); g.lineTo(-.82, -.66); g.lineWidth = .2; g.stroke(); g.lineWidth = .1; g.strokeStyle = "#6fae4f"; g.stroke(); }
  else { g.beginPath(); for (let i = 0; i <= 48; i++) { const a = i / 48 * TAU, r = .7 + Math.cos(a * 8) * .07; g[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fillStyle = "#fffaf4"; g.fill(); g.stroke(); g.beginPath(); for (let i = 0; i <= 40; i++) { const a = i / 40 * TAU * 1.6, r = .06 + i / 40 * .42; g[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); } g.strokeStyle = "#ff7fa5"; g.lineWidth = .12; g.stroke(); }

function iconSprite(id, sz) { sz = Math.round(sz); return Lab.sprite("ln:i" + id + ":" + sz, sz, sz, g => { g.translate(sz / 2, sz / 2); g.scale(sz * .44, sz * .44); icon(g, id); }); }
function drawIcon(c, id, x, y, sz, a) { const s = iconSprite(id, sz); if (a != null) c.globalAlpha = a; c.drawImage(s, x - s.w / 2, y - s.h / 2, s.w, s.h); c.globalAlpha = 1; }
const SPOT = [[-.44, -.02], [.44, -.02], [0, .13], [-.2, -.17], [.22, -.17]];
function drawBowl(c, x, y, R, items, glow) {
  c.save(); c.translate(x, y); c.lineJoin = "round";
  draw.shadow(c, 0, R * .78, R * .8, R * .14, .3);
  if (glow) draw.glow(c, 0, 0, R * 1.5, "#ffd166", .35 + .15 * Math.sin(Lab.now() * 8));
  c.beginPath(); c.moveTo(-R, 0); c.bezierCurveTo(-R * .9, R * .7, -R * .4, R * .8, -R * .3, R * .8); c.lineTo(R * .3, R * .8); c.bezierCurveTo(R * .4, R * .8, R * .9, R * .7, R, 0); c.closePath(); c.fillStyle = "#2f4b8f"; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();

  if (broth) { c.fillStyle = "rgba(255,255,255,.18)"; c.beginPath(); c.ellipse(-R * .3, -R * .1, R * .4, R * .1, -.2, 0, TAU); c.fill(); }
  if (items.includes(2)) { c.lineCap = "round"; for (let pass = 0; pass < 2; pass++) for (let i = -2; i <= 2; i++) { c.beginPath(); for (let px = -R * .7; px <= R * .7; px += R * .05) c[px === -R * .7 ? "moveTo" : "lineTo"](px, i * R * .1 + R * .04 + Math.sin(px / R * 9 + i * 1.7) * R * .05); c.strokeStyle = pass ? "#ffd75e" : INK; c.lineWidth = pass ? R * .05 : R * .085; c.stroke(); } }
  if (items.includes(3)) { c.beginPath(); c.ellipse(0, R * .08, R * .6, R * .24, 0, 0, TAU); c.fillStyle = "#fffdf5"; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke(); }
  c.restore(); let n = 0; for (const id of items) if (id >= 4) { const p = SPOT[n++ % 5]; drawIcon(c, id, p[0] * R, p[1] * R, R * .42); }
