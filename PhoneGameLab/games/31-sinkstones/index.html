</head><body><script>
(function(){ "use strict";
/* SINKSTONES — a little flame crosses a night pond on stepping stones that only show themselves for a moment.
 * Watch the path rise (each stone sings a note), watch it sink, then hop it from memory before the stone under

Lab.init({
  title: "Sinkstones", tagline: "Remember the path. Cross before it sinks.", category: "Runner & Movement",
  howto: ["Watch the stones rise, then sink", "Tap, swipe or arrows: hop from memory", "Keep moving: your stone sinks too"],
  theme: { bg: "#06111d", bg2: "#123247", accent: "#ffb347", accent2: "#8fe3c0" },

  Lab.setScore(0);
  Lab.input.swipeEarly = true;

    const dc = c - pos.c, dr = r - pos.r; if (c >= 0 && c < cols && Math.abs(dc) + Math.abs(dr) === 1) { usedDown = true; tryHop(dc, dr); }

  Lab.input.onKey = [k => { const m = { ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0], ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1] }[k]; if (m) tryHop(m[0], m[1]); }];
  Lab.expose({
    get mode() { return mode; }, get round() { return round; }, get lives() { return lives; }, get score() { return score; }, get streak() { return streak; }, get flies() { return flies; },
    get pos() { return { c: pos.c, r: pos.r }; }, get grid() { return { cols, rows }; }, get path() { return path.map(p => p.slice()); }, get hopping() { return !!hop; },
    get patience() { return pT; }, get cfg() { return cfg; },
    type(c, r) { return c < 0 || c >= cols || r < 0 || r >= rows ? -1 : cells[r * cols + c].type; },   // 0 water, 1 path, 2 firefly stone, 3 cracked decoy

}
Lab.onResize(() => { if (cells) { layout(); if (!hop && pos) { wisp.x = CX(pos.c); wisp.y = CY(pos.r); } } });

/* ------------------------------------------------------------------ pond generation */
function build() {

}
function layout() {

}
const CX = c => gx + (c + .5) * cell, CY = r => r < 0 ? gy - 42 * S : r >= rows ? gy + gh + 44 * S : gy + (r + .5) * cell;

function note(i, vol, lowpass) { const f = Lab.audio.scaleFreq(i % 13, 57); Lab.audio.tone({ f, dur: .42, vol: vol || .16, type: "sine", a: .004 }); Lab.audio.tone({ f: f * 3, dur: .12, vol: (vol || .16) * .22, type: "sine" }); if (!lowpass) Lab.audio.tone({ f: f * 2, dur: .2, vol: (vol || .16) * .3, type: "triangle" }); }

/* ------------------------------------------------------------------ round flow */

    if (q.type === 3) { Lab.sfx("knock", { pitch: .6 }); } else note(q.type === 2 ? q.idx + 2 : q.idx, .15);
    fx.ring(x, y, { r0: cell * .2, r1: cell * .55, color: q.type === 3 ? "rgba(160,170,180,.5)" : "rgba(170,240,230,.7)", width: 3, life: .45 });
  }));

const mult = () => 1 + Math.min(5, Math.floor(streak / 5));

  Lab.sfx("splash"); Lab.audio.noise({ dur: .45, vol: .16, hp: 3200, a: .01 }); Lab.shake(6, .25); Lab.flash("#9fd8ff", .18, .22); Lab.buzz(40);

/* ------------------------------------------------------------------ frame */
