<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sparkmoth</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* SPARKMOTH — a bullet-hell where the bullets are a fireworks show and you are a moth who cannot stay away from the light.
 * Identity: dusk festival sky, paper lanterns, shells that whistle up to a marked point before they burst (the telegraph),
 * named firework patterns in three acts, then an encore that is faster and denser.
 * Controls: drag anywhere — the moth copies the thumb's motion (1.2×) so the finger never covers it; arrows/WASD, Shift = slow.
 * Depth: only the tiny bright heart can be hit. Skimming sparks raises a ×1–×5 multiplier and charges GLOW; a full glow
 * becomes a flare that turns the next hit into a screen-clearing burst of points.                                       */
Lab.init({
  title: "Sparkmoth", tagline: "Weave through the fireworks.", category: "Arcade & Action",
  howto: ["Drag anywhere to steer the moth", "Only its bright heart can be hit", "Skim sparks to charge a saving flare"],
  theme: { bg: "#0d0f2b", bg2: "#3a1f4f", accent: "#ffc857", accent2: "#ff6f91" },
  orient: "portrait", music: { style: "drive", key: "A", vol: .42 }, restart: start,
});
const { draw, fx, ease } = Lab, TAU = Lab.TAU, clamp = Lab.clamp, rand = Lab.rand;
const COL = ["#ffc857", "#ff6f91", "#7fe3ff", "#b6f27a", "#c9a0ff", "#8fd0ff", "#ffb38a"];   // gold rose aqua lime violet ice ember
const ROMAN = ["", "I", "II", "III"];
let S, PL, P, bullets, shells, emitters, warns, ev, pT, pDur, pIdx, tier, pName, nameT, score, lives, glow, shield, heat, heatIdle, grazes, flares,
  alive, grazeSnd, twinkles, hintT, patternsDone, gapX, dying;
const px = u => PL.x + u * PL.w, py = v => PL.y + v * PL.h, K = T => S * (1 + .13 * (T - 1));

function layout() { const p = Lab.play; PL = { x: p.x, y: p.y, w: p.w, h: p.h }; S = Math.min(Lab.W / 390, p.h / 740); }
Lab.onResize(() => { if (!P) return; layout(); P.x = clamp(P.x, PL.x + 10, PL.x + PL.w - 10); P.y = clamp(P.y, PL.y + 10, PL.y + PL.h - 10); bullets.length = 0; shells.length = 0; warns.length = 0; emitters.length = 0; });

function start() {
  layout();
  P = { x: px(.5), y: py(.8), r: 3.2 * S, inv: 1.2, tilt: 0, flap: 0, lx: px(.5) };
  bullets = []; shells = []; emitters = []; warns = []; ev = []; pT = 0; pDur = 0; pIdx = -1; tier = 1; pName = ""; nameT = 0; patternsDone = 0;
  score = 0; lives = 3; glow = 0; shield = false; heat = 0; heatIdle = 0; grazes = 0; flares = 0; alive = true; grazeSnd = 0; hintT = 5; dying = 0;
  twinkles = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random() * .7, p: rand(0, TAU), v: rand(1, 3) }));
  Lab.setScore(0);
  Lab.input.onDown = []; Lab.input.onUp = []; Lab.input.onTap = []; Lab.input.onSwipe = []; Lab.input.onKey = [];
  Lab.input.onMove = [(x, y, dx, dy) => { if (Lab.input.down && alive) { P.x = clamp(P.x + dx * 1.2, PL.x + 8, PL.x + PL.w - 8); P.y = clamp(P.y + dy * 1.2, PL.y + 8, PL.y + PL.h - 8); hintT = Math.min(hintT, .6); } }];
  Lab.expose({
    get player() { return P; }, get bullets() { return bullets; }, get score() { return Math.floor(score); }, get lives() { return lives; }, get glow() { return glow; },
    get shield() { return shield; }, get grazes() { return grazes; }, get mult() { return mult(); }, get pattern() { return pName; }, get index() { return pIdx; }, get tier() { return tier; }, get flares() { return flares; },
    get area() { return PL; }, get S() { return S; }, bullet(x, y, vx, vy, r) { const b = { x, y, vx, vy, ay: 0, vmax: 0, dr: 0, r: (r || 6) * S, c: 1, g: false, t: 0, split: null }; bullets.push(b); return b; },
    clear() { bullets.length = 0; shells.length = 0; emitters.length = 0; warns.length = 0; ev = []; pDur = 99; pT = 0; },
  });
  nextPattern();
  Lab.loop(frame);
}
const mult = () => 1 + Math.min(4, Math.floor(heat * 5));

/* ------------------------------------------------------------------ pattern toolkit */
function B(x, y, ang, sp, c, r, o) {
  if (bullets.length >= 520) return null;
  const b = { x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, ay: 0, vmax: 0, dr: 0, r: r * S, c, g: false, t: 0, split: null };
  if (o) Object.assign(b, o); bullets.push(b); return b;
}
function ring(x, y, n, sp, c, r, off, o) { for (let i = 0; i < n; i++) B(x, y, off + i / n * TAU, sp, c, r, o); }
const at = (t, fn) => ev.push({ t, fn });
function shell(t, u, v, c, burst) {
  at(t, () => { shells.push({ x0: px(u) + rand(-40, 40) * S, y0: PL.y + PL.h + 12, x: px(u), y: py(v), t: 0, dur: .9, c, burst }); Lab.audio.tone({ f: 420, f2: 1500, dur: .7, vol: .025, type: "sine", a: .1 }); });
}
function lantern(t, u, v, dur, c, every, fn) { at(t, () => { emitters.push({ x: px(u), y: py(v), t: 0, warm: 1, dur, c, every, acc: 0, fn, a: rand(0, TAU) }); Lab.sfx("chime", { pitch: .6 }); }); }
const aim = (x, y) => Math.atan2(P.y - y, P.x - x);
function boomSnd(p) { Lab.audio.noise({ dur: .28, vol: .1, lp: 2600 * p, f2: 180 }); Lab.audio.tone({ f: 170 * p, f2: 55, dur: .22, vol: .12 }); }

/* ------------------------------------------------------------------ the show: each pattern schedules events and returns its length */
function peony(T) {
  const n = 5 + Math.min(3, T);
  for (let i = 0; i < n; i++) { const c = i % 2; shell(i * 1.7, rand(.18, .82), rand(.14, .4), c, (x, y) => { const off = rand(0, TAU), k = 9 + T * 2; ring(x, y, k, 84 * K(T), c, 6, off); if (T > 1) ring(x, y, k, 58 * K(T), c, 5, off + Math.PI / k); }); }
  return n * 1.7 + 1.6;
}
function salute(T) {
  (T > 1 ? [.22, .78, .5] : [.5]).forEach((u, i) => lantern(i * .5, u, .1, 7.6, 2, T > 1 ? 1.3 : .95, e => { const a = aim(e.x, e.y), n = T > 2 ? 5 : 3; for (let j = 0; j < n; j++) B(e.x, e.y, a + (j - (n - 1) / 2) * .22, 150 * K(T), 2, 6); Lab.sfx("pop", { pitch: .8 }); }));
  return 10;
}
function willow(T) {
  for (let i = 0; i < 6; i++) shell(i * 1.4, rand(.15, .85), rand(.1, .22), 3, (x, y) => { for (let j = 0; j < 12 + T * 2; j++) B(x, y, -Math.PI / 2 + rand(-1.35, 1.35), rand(50, 150) * S, 3, 5.5, { ay: 72 * K(T), vmax: 150 * K(T), dr: .8 }); });
  return 10.4;
}
function pinwheel(T) {
  const arms = 3 + (T > 2 ? 1 : 0);
  lantern(0, .5, .26, 8, 4, .11, e => { e.a += (e.t < 5 ? 1 : -1) * .12; for (let k = 0; k < arms; k++) B(e.x, e.y, e.a + k * TAU / arms, 118 * K(T), 4, 5.5); });
  return 10.4;
}
function waterfall(T) {
  gapX = P.x;
  for (let i = 0; i < 8; i++) at(i * 1.3, () => {
    gapX = clamp(gapX + rand(-1, 1) * 115 * S, PL.x + 56 * S, PL.x + PL.w - 56 * S); const gw = Math.max(58, 88 - 7 * T) * S;
    for (let x = PL.x + 10 * S; x < PL.x + PL.w; x += 23 * S) if (Math.abs(x - gapX) > gw / 2) B(x, PL.y - 8, Math.PI / 2, 108 * K(T), 5, 6);
    Lab.sfx("swish", { pitch: .7 });
  });
  return 8 * 1.3 + 3;
}
function crossette(T) {
  for (let i = 0; i < 5; i++) shell(i * 1.85, rand(.2, .8), rand(.16, .38), 1, (x, y) => ring(x, y, 6 + (T > 2 ? 2 : 0), 108 * K(T), 1, 8.5, rand(0, TAU), { split: { t: .95, n: 4, sp: 96 * K(T), r: 5, c: 0 } }));
  return 10.8;
}
function comets(T) {
  const n = 7 + T;
  for (let i = 0; i < n; i++) at(i * 1.15, () => {
    const x = px(rand(.08, .92)), y = PL.y - 6, a = aim(x, y); warns.push({ x, y, a, t: 0, dur: .75 }); Lab.sfx("warn", { pitch: 1.6 });
    for (let j = 0; j < 5; j++) at(pT + .75 + j * .055, () => { B(x, y, a, 400 * S * (1 + .08 * (T - 1)), 6, 6.5); if (!j) Lab.sfx("whoosh", { pitch: 1.5 }); });
  });
  return n * 1.15 + 1.8;
}
function chrys(T) {
  [.5, .28, .72, .4, .6].forEach((u, i) => shell(i * 2.2, u, .27, 2, (x, y) => { const k = 14 + T * 2, off = rand(0, TAU); ring(x, y, k, 62 * K(T), 2, 5.5, off); ring(x, y, k, 88 * K(T), 1, 5.5, off + Math.PI / k); ring(x, y, k, 114 * K(T), 0, 5.5, off); }));
  return 12;
}
function finale(T) {
  lantern(0, .5, .2, 10, 4, .15, e => { e.a += .14; for (let k = 0; k < 2; k++) B(e.x, e.y, e.a + k * Math.PI, 112 * K(T), 4, 5.5); });
  for (let i = 0; i < 6; i++) { const c = i % 3; shell(.8 + i * 1.8, rand(.15, .85), rand(.3, .5), c, (x, y) => ring(x, y, 10 + T, 80 * K(T), c, 6, rand(0, TAU))); }
  if (T > 1) for (let i = 0; i < 4; i++) at(2 + i * 2.4, () => { const x = px(rand(.1, .9)), y = PL.y - 6, a = aim(x, y); warns.push({ x, y, a, t: 0, dur: .75 }); for (let j = 0; j < 4; j++) at(pT + .75 + j * .055, () => B(x, y, a, 400 * S, 6, 6.5)); });
  return 12.6;
}
const SHOW = [["Peony", peony, 1], ["Salute", salute, 1], ["Willow", willow, 1], ["Pinwheel", pinwheel, 2], ["Waterfall", waterfall, 2], ["Crossette", crossette, 2], ["Comets", comets, 3], ["Chrysanthemum", chrys, 3], ["Grand Finale", finale, 3]];
function nextPattern() {
  if (pIdx >= 0) { const bonus = 150 * tier * mult(); score += bonus; patternsDone++; fx.text(px(.5), py(.2), "+" + bonus, { color: "#ffe9a8", size: 20 }); Lab.sfx("star"); Lab.bumpScore(); }
  pIdx++;
  if (pIdx >= SHOW.length) { pIdx = 0; tier++; Lab.banner("ENCORE!", { color: "#ffc857", ms: 1500 }); Lab.sfx("levelup"); lives = Math.min(3, lives + 1); }
  else if (pIdx === 0 || SHOW[pIdx][2] !== SHOW[pIdx - 1][2]) { Lab.banner("ACT " + ROMAN[SHOW[pIdx][2]], { color: "#ffe9a8", ms: 1200 }); if (pIdx) Lab.sfx("levelup", { pitch: .8 }); }
  ev = []; pT = pIdx === 0 && tier === 1 ? -.9 : -1.7; pName = SHOW[pIdx][0]; nameT = 0; pDur = SHOW[pIdx][1](tier);
}

/* ------------------------------------------------------------------ hits, skims, flares */
function sweep(points) {
  for (const b of bullets) { if (points) score += 3 * mult(); fx.burst(b.x, b.y, { n: 1, color: points ? "#ffe9a8" : "#8c86b8", speed: 40, life: points ? .6 : .35, size: points ? 4 : 3, gravity: points ? -60 : 0, shape: points ? "star" : "circle" }); }
  bullets.length = 0;
}
function hit() {
  if (P.inv > 0 || !alive) return;
  if (shield) {
    shield = false; glow = 0; flares++; P.inv = 1.5; const n = bullets.length; sweep(true);
    Lab.flash("#fff3c4", .35, .55); Lab.shake(8, .3); Lab.slowmo(.4, .45); Lab.sfx("chime"); Lab.sfx("powerup", { pitch: 1.3 }); Lab.buzz(25);
    fx.ring(P.x, P.y, { r0: 10, r1: PL.h * .7, color: "#ffe9a8", width: 10, life: .6 }); fx.text(P.x, P.y - 34 * S, "FLARE! +" + n * 3 * mult(), { color: "#ffe9a8", size: 22 }); Lab.bumpScore();
    return;
  }
  lives--; heat = 0; glow = Math.max(0, glow - .25); P.inv = 2.3; sweep(false);
  Lab.flash("#ff6f91", .3, .4); Lab.shake(14, .4); Lab.hitstop(.09); Lab.sfx("hurt"); Lab.sfx("glass", { pitch: .7 }); Lab.buzz(60);
  fx.burst(P.x, P.y, { n: 22, colors: ["#fff3c4", "#ff6f91", "#f2e6d0"], speed: 260, life: .7, size: 4, gravity: 120 }); fx.ring(P.x, P.y, { r0: 8, r1: 180 * S, color: "#ff6f91", width: 6, life: .45 });
  if (lives <= 0) { alive = false; dying = .001; Lab.slowmo(.3, .7); }
}
function graze(b) {
  b.g = true; grazes++; heat = Math.min(1, heat + .07); heatIdle = 0; const m = mult(); score += 5 * m * (shield ? 2 : 1);
  if (!shield) { glow += .034; if (glow >= 1) { glow = 1; shield = true; Lab.sfx("unlock", { pitch: 1.3 }); fx.ring(P.x, P.y, { r0: 30 * S, r1: 8, color: "#ffe9a8", width: 4, life: .4 }); fx.text(P.x, P.y - 30 * S, "FLARE READY", { color: "#ffe9a8", size: 15 }); } }
  const a = Math.atan2(P.y - b.y, P.x - b.x); fx.burst(b.x, b.y, { n: 2, color: COL[b.c], speed: 170, spread: .5, angle: a, life: .22, size: 2.4, gravity: 0, drag: 1 });
  if (grazeSnd <= 0) { grazeSnd = .045; Lab.audio.tone({ f: 880 + heat * 900, dur: .045, vol: .05, type: "triangle" }); }
}

/* ------------------------------------------------------------------ frame */
function frame(dt, t) {
  // --- moth (touch drag is applied in onMove; keys here)
  if (alive) {
    const kx = Lab.input.axisX(), ky = Lab.input.axisY();
    if (kx || ky) { const sp = (Lab.input.keys.Shift ? 105 : 250) * S / (kx && ky ? Math.SQRT2 : 1); P.x = clamp(P.x + kx * sp * dt, PL.x + 8, PL.x + PL.w - 8); P.y = clamp(P.y + ky * sp * dt, PL.y + 8, PL.y + PL.h - 8); hintT = Math.min(hintT, .6); }
    P.tilt = Lab.damp(P.tilt, clamp((P.x - P.lx) / Math.max(dt, .001) / 500, -1, 1), 12, dt); P.lx = P.x; P.inv -= dt; P.flap += dt * (14 + heat * 10);
    score += 12 * mult() * tier * dt; Lab.setScore(Math.floor(score));
    heatIdle += dt; if (heatIdle > .9) heat = Math.max(0, heat - .14 * dt); grazeSnd -= dt; hintT -= dt;
  }
  // --- the show
  pT += dt; nameT += dt;
  for (let i = 0; i < ev.length; i++) { const e = ev[i]; if (!e.done && pT >= e.t) { e.done = true; e.fn(); } }
  if (pT >= pDur && alive) nextPattern();
  for (const s of shells) { s.t += dt; if (s.t >= s.dur) { s.dead = true; s.burst(s.x, s.y); boomSnd(rand(.8, 1.4)); fx.burst(s.x, s.y, { n: 12, color: COL[s.c], speed: 240, life: .32, size: 2, gravity: 80, drag: 3 }); fx.ring(s.x, s.y, { r0: 4, r1: 46 * S, color: COL[s.c], width: 3, life: .3 }); } }
  if (shells.some(s => s.dead)) shells = shells.filter(s => !s.dead);
  for (const e of emitters) { e.t += dt; if (e.t > e.warm && e.t < e.warm + e.dur) { e.acc += dt; while (e.acc >= e.every) { e.acc -= e.every; e.fn(e); } } }
  if (emitters.length && emitters[0].t > emitters[0].warm + emitters[0].dur + .5) emitters.shift();
  for (const w of warns) w.t += dt; if (warns.length && warns[0].t > warns[0].dur + .25) warns.shift();
  // --- sparks
  const gr = 21 * S, x0 = PL.x - 30, x1 = PL.x + PL.w + 30, y0 = PL.y - 40, y1 = PL.y + PL.h + 30; let kids = null;
  for (const b of bullets) {
    b.t += dt;
    if (b.ay) { b.vy = Math.min(b.vmax, b.vy + b.ay * dt); b.vx *= Math.exp(-b.dr * dt); }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < x0 || b.x > x1 || b.y < y0 || b.y > y1) { b.dead = true; continue; }
    if (b.split && b.t >= b.split.t) { b.dead = true; (kids || (kids = [])).push(b); continue; }
    if (!alive) continue;
    const dx = b.x - P.x, dy = b.y - P.y; if (Math.abs(dx) > 40 * S || Math.abs(dy) > 40 * S) continue;
    const d = Math.hypot(dx, dy);
    if (d < b.r * .62 + P.r) { if (P.inv <= 0) { hit(); break; } }
    else if (!b.g && d < b.r + gr && P.inv <= 0) graze(b);
  }

  if (bullets.some(b => b.dead)) bullets = bullets.filter(b => !b.dead);
  Lab.music.intensity(alive ? Math.min(1, .25 + SHOW[pIdx][2] * .2 + (tier - 1) * .2 + heat * .15) : .1);
  render(t);
  if (dying > 0) { dying += dt; if (dying > .55) { dying = 0; Lab.gameover({ title: "Singed!", score: Math.floor(score), stats: [[tier > 1 ? "Encore " + (tier - 1) : "Act " + ROMAN[SHOW[pIdx][2]], pName.split(" ").pop()], ["Skims", grazes], ["Flares", flares]] }); } }
}

/* ------------------------------------------------------------------ art */
function skySprite() {
  return Lab.sprite("sky:" + Lab.W + "x" + Lab.H, Lab.W, Lab.H, (g, W, H) => {
    draw.vgrad(g, 0, 0, W, H, [[0, "#0b0d28"], [.45, "#1d1642"], [.8, "#40214f"], [1, "#6b2f55"]]);
    const rnd = Lab.rng(5); g.fillStyle = "#fff"; for (let i = 0; i < 90; i++) { g.globalAlpha = .15 + rnd() * .5; const s = .6 + rnd() * 1.2; g.fillRect(rnd() * W, rnd() * H * .72, s, s); } g.globalAlpha = 1;
    const my = Math.max(H * .15, 112); draw.glow(g, W * .8, my, 90, "#ffe9c4", .22); g.fillStyle = "#f6e7c8"; g.beginPath(); g.arc(W * .8, my, 20, 0, TAU); g.fill(); g.fillStyle = "#171338"; g.beginPath(); g.arc(W * .8 + 9, my - 4, 18, 0, TAU); g.fill();
    draw.glow(g, W * .5, H * 1.02, W * .9, "#ff8a5c", .22);
    // rooftops with a few lit windows, and a lantern string
    let x = -10; g.fillStyle = "#150f2c";
    while (x < W + 10) { const w = 26 + rnd() * 44, h = 22 + rnd() * 46; g.fillRect(x, H - h, w, h); if (rnd() < .5) { g.beginPath(); g.moveTo(x - 6, H - h); g.lineTo(x + w / 2, H - h - 12 - rnd() * 10); g.lineTo(x + w + 6, H - h); g.fill(); } g.fillStyle = "rgba(255,200,120,.55)"; for (let j = 0; j < 3; j++) if (rnd() < .6) g.fillRect(x + 5 + rnd() * (w - 12), H - h + 6 + rnd() * Math.max(2, h - 16), 3, 4); g.fillStyle = "#150f2c"; x += w + 1; }
    g.strokeStyle = "rgba(255,220,170,.25)"; g.lineWidth = 1; g.beginPath(); for (let i = 0; i <= 30; i++) { const u = i / 30; g[i ? "lineTo" : "moveTo"](u * W, H - 78 + Math.sin(u * Math.PI * 3) * 9); } g.stroke();
    for (let i = 1; i < 12; i++) { const u = i / 12, lx = u * W, ly = H - 78 + Math.sin(u * Math.PI * 3) * 9 + 5; draw.glow(g, lx, ly, 10, i % 2 ? "#ff8a5c" : "#ffc857", .35); g.fillStyle = i % 2 ? "#ff8a5c" : "#ffc857"; g.globalAlpha = .7; g.beginPath(); g.ellipse(lx, ly, 3, 4, 0, 0, TAU); g.fill(); g.globalAlpha = 1; }
  });
}
function sparkSprite(c, r) {
  const R = Math.round(r * 2) / 2, sz = Math.ceil(R * 5.2);
  return Lab.sprite("sp:" + c + ":" + R, sz, sz, g => { const cx = sz / 2; draw.glow(g, cx, cx, R * 2.5, COL[c], .55); g.fillStyle = COL[c]; g.beginPath(); g.arc(cx, cx, R, 0, TAU); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.arc(cx, cx, R * .62, 0, TAU); g.fill(); });
}
function drawMoth(c, t) {
  if (!alive) return;
  const s = S, fl = Math.cos(P.flap), wing = .55 + .45 * Math.abs(fl), blink = P.inv > 0 && Math.sin(t * 30) > 0;
  // glow ring: fills as sparks are skimmed, turns into a halo when the flare is ready
  if (shield) { const pu = 1 + Math.sin(t * 7) * .08; draw.glow(c, P.x, P.y, 34 * s, "#ffe9a8", .3); c.strokeStyle = "#ffe9a8"; c.lineWidth = 2.6 * s; c.beginPath(); c.arc(P.x, P.y, 21 * s * pu, 0, TAU); c.stroke(); }
  else { c.strokeStyle = "rgba(255,233,168,.16)"; c.lineWidth = 2 * s; c.beginPath(); c.arc(P.x, P.y, 21 * s, 0, TAU); c.stroke(); if (glow > 0) { c.strokeStyle = "rgba(255,233,168,.85)"; c.lineWidth = 2.6 * s; c.lineCap = "round"; c.beginPath(); c.arc(P.x, P.y, 21 * s, -Math.PI / 2, -Math.PI / 2 + glow * TAU); c.stroke(); } }
  c.save(); c.translate(P.x, P.y); c.rotate(P.tilt * .3); c.globalAlpha = blink ? .35 : 1;
  for (const side of [-1, 1]) {
