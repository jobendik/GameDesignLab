<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"15 Puzzle", instructions:"Tap a tile next to the empty space to slide it.", restart:start});
let g, empty, moves, N=4;
function start(){
  g=Array.from({length:N*N},(_,i)=>i);
  empty={r:N-1,c:N-1};
  // shuffle by valid moves
  for(let i=0;i<200;i++){
    const opts=[[-1,0],[1,0],[0,-1],[0,1]].filter(([dr,dc])=>{const nr=empty.r+dr, nc=empty.c+dc; return nr>=0&&nr<N&&nc>=0&&nc<N;});
    const [dr,dc]=Lab.choose(opts); const ni=(empty.r+dr)*N+(empty.c+dc), ei=empty.r*N+empty.c;
    [g[ei],g[ni]]=[g[ni],g[ei]]; empty.r+=dr; empty.c+=dc;
  }
  moves=0; Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(), off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c<0||c>=N||r<0||r>=N) return;
    if(Math.abs(r-empty.r)+Math.abs(c-empty.c)===1){
      const ei=empty.r*N+empty.c, ti=r*N+c;
      [g[ei],g[ti]]=[g[ti],g[ei]]; empty={r,c};
      moves++; Lab.setScore(moves); Lab.beep(500,.03);
      if(g.every((v,i)=>v===i)) Lab.win("Solved in "+moves+" moves!");
    }
  }];
  Lab.loop(()=>draw());
}
function cellSize(){ return Math.min((Lab.W-40)/N, (Lab.H-280)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:160};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    const v=g[r*N+col]; const x=off.x+col*cs, y=off.y+r*cs;
    if(v===N*N-1) continue;
    c.fillStyle = v===r*N+col ? "#3a6a48" : "#3a4a6a"; c.fillRect(x+3,y+3,cs-6,cs-6);
    c.fillStyle="#fff"; c.font=`bold ${cs*0.4}px sans-serif`; c.textAlign="center"; c.textBaseline="middle";
    c.fillText(v+1, x+cs/2, y+cs/2);
  }
}
start();
</script></body></html>
