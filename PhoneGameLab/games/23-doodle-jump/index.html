<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Doodle Jump", instructions:"Drag to steer left/right. Auto-bounce on platforms.", restart:start});
let p,plats,t,height,maxH;
function newPlat(y){ return {x:Lab.rand(40,Lab.W-100), y, w:80, h:14, vx: Math.random()<0.3?Lab.rand(-60,60):0}; }
function start(){
  p={x:Lab.W/2,y:Lab.H-100,vx:0,vy:0,r:18};
  plats=[{x:Lab.W/2-40,y:Lab.H-60,w:80,h:14,vx:0}];
  for(let i=1;i<14;i++) plats.push(newPlat(Lab.H-60-i*60));
  height=0; maxH=0; Lab.setScore(0);
  Lab.input.onMove=[(x)=>{ if(Lab.input.down) p.vx = (x-p.x)*8; }];
  Lab.loop(dt=>{
    p.vy+=1400*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92;
    if(p.x<0)p.x=Lab.W; if(p.x>Lab.W)p.x=0;
    for(const pl of plats){ pl.x+=(pl.vx||0)*dt; if(pl.x<10||pl.x+pl.w>Lab.W-10)pl.vx*=-1;}
    if(p.vy>0){
      for(const pl of plats){
        if(p.x>pl.x&&p.x<pl.x+pl.w&&p.y+p.r>pl.y&&p.y+p.r<pl.y+pl.h+12){
          p.vy=-740; Lab.beep(700,.04); break;
        }
      }
    }
    // scroll
    if(p.y<Lab.H/2){ const dy=Lab.H/2-p.y; p.y=Lab.H/2; height+=dy; for(const pl of plats) pl.y+=dy;}
    plats=plats.filter(pl=>pl.y<Lab.H+20);
    while(plats.length<14) plats.push(newPlat(Math.min(...plats.map(p=>p.y))-Lab.rand(50,90)));
    if(p.y>Lab.H+40){ Lab.gameover({title:"Fell",message:"Height: "+Math.floor(height/10)}); return; }
    Lab.setScore(Math.floor(height/10));
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    for(const pl of plats){ c.fillStyle="#3df58a"; c.fillRect(pl.x,pl.y,pl.w,pl.h);}
    c.beginPath(); c.fillStyle="#ffd35a"; c.arc(p.x,p.y,p.r,0,Lab.TAU); c.fill();
  });
}
start();
</script></body></html>
