<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Helix Fall", instructions:"Drag to rotate the tower. Drop the ball through gaps.", restart:start});
let rings, ball, rot, dragX, level, score;
function makeLevel(){
  rings=[]; const N=10+level;
  for(let i=0;i<N;i++){
    const segs=[];
    const gaps=Lab.randInt(1,3);
    const arcs=4;
    for(let s=0;s<arcs;s++) segs.push(true);
    for(let g=0;g<gaps;g++){ segs[Lab.randInt(0,arcs-1)]=false; }
    rings.push({y: 200+i*70, segs, kill: Math.random()<0.2});
  }
  ball={x:Lab.W/2, y:120, vy:0, r:14};
  rot=0;
}
function start(){
  score=0; level=1; makeLevel();
  Lab.setScore(0);
  Lab.input.onMove=[(x,y,dx)=>{ if(Lab.input.down) rot+=dx*0.012;}];
  Lab.loop(dt=>{
    ball.vy+=900*dt; ball.y+=ball.vy*dt;
    // collision with first ring below ball
    for(const r of rings){
      if(Math.abs(r.y-ball.y)<14 && ball.vy>0){
        const arcs=r.segs.length;
        // angular position of ball relative to ring center
        // we treat ball as at angle = (rot) mod TAU
        const ang=((rot)%(Lab.TAU)+Lab.TAU)%Lab.TAU;
        const idx=Math.floor(ang/(Lab.TAU/arcs));
        if(r.segs[idx]){
          if(r.kill){ Lab.gameover({title:"Spike!",message:"Score: "+score}); return; }
          ball.vy=-380; Lab.beep(700,.05); break;
        } else { score++; Lab.setScore(score); Lab.beep(900,.04); break; }
      }
    }
    // scroll down
    if(ball.y>Lab.H*0.55){ const d=ball.y-Lab.H*0.55; ball.y-=d; for(const r of rings) r.y-=d; }
    rings=rings.filter(r=>r.y>50);
    if(!rings.length){ level++; Lab.toast("Level "+level); makeLevel();}
    const c=Lab.ctx; c.fillStyle="#10042a"; c.fillRect(0,0,Lab.W,Lab.H);
    const cx=Lab.W/2;
    for(const r of rings){
      const arcs=r.segs.length;
      for(let s=0;s<arcs;s++){ if(!r.segs[s]) continue;
        c.beginPath(); c.fillStyle=r.kill?"#ff5577":"#5af";
        c.arc(cx,r.y, 100, rot+s*Lab.TAU/arcs, rot+(s+1)*Lab.TAU/arcs);
        c.lineTo(cx,r.y); c.fill();
      }
    }
    c.beginPath(); c.fillStyle="#ffd35a"; c.arc(ball.x,ball.y,ball.r,0,Lab.TAU); c.fill();
  });
}
start();
</script></body></html>
