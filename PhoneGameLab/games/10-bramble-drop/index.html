<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bramble Drop</title>
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
(function(){ "use strict";
/* BRAMBLE DROP — a match-3 berry slinger under a bramble that never stops growing downward.
 * Identity: dusk garden. A dark, leafy bramble heavy with six kinds of berry (each with its own marking, so colour is
 * never the only cue) creeps toward the hedge; a twig catapult flings berries up into it; fireflies; lo-fi music.
 * Core: hex grid, drag-to-aim with a full bounce preview and landing ghost, clusters of 3+ pop, anything left hanging
 * from nothing tumbles into the hedge for doubling points.

 * dropped berry shoves it back up; (2) a streak multiplier (x1..x5) for consecutive shots that pop, while a wasted

Lab.init({
  title: "Bramble Drop", tagline: "Pick the bramble clean before it reaches the hedge.", category: "Puzzle & Match",
  howto: ["Drag to aim, let go to fling a berry", "Match 3+ and everything hanging below drops too", "Tap the nest to swap berries"],
  theme: { bg: "#1a1330", bg2: "#5e3370", accent: "#ff9a3c", accent2: "#ff4f6d" },
  orient: "portrait", music: { style: "chill", key: "A", vol: .5 }, restart: start,

const { draw, fx } = Lab, TAU = Lab.TAU, COLS = 10;
const BERRY = [
  { n: "Raspberry", c: "#ff4f6d" }, { n: "Blueberry", c: "#5b8cff" }, { n: "Lemon drop", c: "#ffd23f" },
  { n: "Gooseberry", c: "#7bd65a" }, { n: "Plum", c: "#b56bff" }, { n: "Kumquat", c: "#ff9a3c" },
];
let S, L, R, Rb, rowH, fieldTop, shootX, shootY, deadY, groundY, oy, cells, minRow, rows, shot, cur, next, aim, falling, pops, score, streak, bestStreak,

const key = (r, c) => (r + 4096) * 16 + c;
const odd = r => ((r % 2) + 2) % 2;
const colsIn = r => odd(r) ? COLS - 1 : COLS;
const cx = (r, c) => L + Rb + c * 2 * Rb + (odd(r) ? Rb : 0);

function neigh(r, c) { const o = odd(r) ? 0 : -1; return [[r, c - 1], [r, c + 1], [r - 1, c + o], [r - 1, c + o + 1], [r + 1, c + o], [r + 1, c + o + 1]]; }

function layout() {
  S = Math.min(Lab.W / 390, Lab.play.h / 700);
  L = Math.round(5 * S); R = Lab.W - L; Rb = (R - L) / (COLS * 2); rowH = Rb * 1.732;
  fieldTop = Lab.play.y + 2; shootX = Lab.W / 2; shootY = Lab.H - Lab.safe.bottom - 74 * S; deadY = shootY - 62 * S; groundY = shootY + 6 * S;
}
Lab.onResize(() => {
  if (!cells) return; const oT = fieldTop, oH = rowH, oL = L; layout(); const k = rowH / oH;
  oy = fieldTop + (oy - oT) * k; pend *= k; falling.length = 0; pops.length = 0;
  if (shot) { shot.x = L + (shot.x - oL) * k; shot.y = fieldTop + (shot.y - oT) * k; }
});

function start() {
  layout();
  cells = new Map(); minRow = 0; rows = 0; oy = fieldTop - Rb - 7 * rowH; shot = null; falling = []; pops = [];
  score = 0; streak = 0; bestStreak = 0; popped = 0; dropped = 0; pend = 0; overT = 0; alive = true; reloadT = 1; recoil = 0; queued = null;
  low = fieldTop; danger = 0; beatT = 0; swapT = 0; lungeT = 0; nColors = 4; frozen = false; bestDrop = 0; shots = 0; aimHint = 0;
  aim = { a: 0, show: false, valid: false, key: false };
  for (let r = 6; r >= 0; r--) fillRow(r); minRow = 0; rows = 0;
  cur = pickColor(); next = pickColor();
  flies = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), p: Lab.rand(0, TAU), v: Lab.rand(.3, .9), s: Lab.rand(1, 2.2) }));
  Lab.setScore(0);
  Lab.input.onDown = [(x, y) => { aim.key = false; setAim(x, y); aim.show = aim.valid; }];
  Lab.input.onMove = [(x, y) => { aim.key = false; setAim(x, y); aim.show = aim.valid; }];
  Lab.input.onUp = [(x, y) => {
    const tap = Lab.dist(x, y, Lab.input.startX, Lab.input.startY) < 14 * Math.max(1, S);
    if (tap && y > deadY + 8 * S) { swap(); aim.show = false; return; }
    setAim(x, y); if (aim.valid) fire(aim.a); aim.show = false;
  }];
  Lab.input.onKey = [k => { if (k === " " || k === "ArrowUp" || k === "Enter") fire(aim.a); else if (k === "ArrowDown" || k === "x" || k === "X" || k === "Shift") swap(); }];
  Lab.expose({
    get score() { return score; }, get streak() { return streak; }, get cur() { return cur; }, get next() { return next; }, get count() { return cells.size; },
    get low() { return low; }, get deadY() { return deadY; }, get rows() { return rows; }, get overT() { return overT; }, get flying() { return !!shot; },
    get shooter() { return { x: shootX, y: shootY }; }, get dropped() { return dropped; }, get popped() { return popped; }, get falling() { return falling.length; },
    get cells() { return [...cells.values()].map(b => ({ row: b.row, col: b.col, color: b.color, x: cx(b.row, b.col), y: cy(b.row) })); },
    trace(a) { const t = trace(a); return t.cell ? { row: t.cell[0], col: t.cell[1], x: cx(t.cell[0], t.cell[1]), y: cy(t.cell[0]), bounces: t.pts.length / 2 - 2, group: groupSize(t.cell[0], t.cell[1], cur) } : null; },
    fire, swap,
    /* test helper: replace the bramble with a hand-made one ("0".."5" berries, "." gaps), top row first; freezes the creep */
    setup(lines, c, n, drop) { cells = new Map(); minRow = 0; oy = fieldTop + Rb + (drop || 0) * rowH; lines.forEach((ln, r) => { for (let i = 0; i < colsIn(r); i++) if (ln[i] && ln[i] !== ".") cells.set(key(r, i), mk(r, i, +ln[i])); }); frozen = true; pend = 0; if (c != null) cur = c; if (n != null) next = n; },
    thaw() { frozen = false; },

}
function mk(row, col, color) { return { row, col, color, ox: 0, oy: 0, born: 0, h: Lab.hash(row + ":" + col) }; }
function fillRow(r) {

    const l = c > 0 && get(r, c - 1), below = get(r + 1, c + (odd(r) ? 0 : -1)) || get(r + 1, c + (odd(r) ? 1 : 0));

}
function growRow() {
  minRow--; rows++; fillRow(minRow);

  if (nc > nColors) { nColors = nc; Lab.banner(BERRY[nc - 1].n + "s ripen", { color: BERRY[nc - 1].c, ms: 1300 }); Lab.sfx("chime"); }
  else if (rows % 10 === 0) { fx.text(Lab.W / 2, deadY - 26 * S, "row " + rows + "  ·  growing faster", { color: "#ffe2b8", size: 15 * Math.max(.85, S), life: 1.4 }); Lab.sfx("whistle", { pitch: .7 }); }
}
function pickColor() {
  const seen = new Set(); for (const b of cells.values()) if (cy(b.row) > fieldTop - rowH) seen.add(b.color);
  const arr = seen.size ? [...seen] : [0, 1, 2, 3]; return Lab.choose(arr);
}
function group(r, c, color) { // connected same-colour set, pretending (r,c) holds `color`
  const seen = new Set([key(r, c)]), out = [[r, c, 0]];
  for (let i = 0; i < out.length; i++) for (const [nr, nc] of neigh(out[i][0], out[i][1])) { const k = key(nr, nc), b = cells.get(k); if (b && b.color === color && !seen.has(k)) { seen.add(k); out.push([nr, nc, out[i][2] + 1]); } }

}
const groupSize = (r, c, color) => group(r, c, color).length;
function orphans() {
  const seen = new Set(), st = [];

  while (st.length) { const [r, c] = st.pop(); for (const [nr, nc] of neigh(r, c)) { const k = key(nr, nc); if (cells.has(k) && !seen.has(k)) { seen.add(k); st.push([nr, nc]); } } }
  const out = []; for (const [k, b] of cells) if (!seen.has(k)) out.push(b); return out;
}

/* ---------------------------------------------------------------- aiming + flight */
function setAim(x, y) {
  const dx = x - shootX, dy = y - shootY;

  if (aim.valid) aim.a = Lab.clamp(Math.atan2(dx, -dy), -1.38, 1.38);
}
function hits(x, y) {
  if (y <= cy(minRow)) return true;

  for (let r = r0 - 1; r <= r0 + 1; r++) { const c0 = Math.round((x - L - Rb - (odd(r) ? Rb : 0)) / (2 * Rb)); for (let c = c0 - 1; c <= c0 + 1; c++) { if (!get(r, c)) continue; const dx = cx(r, c) - x, dy = cy(r) - y; if (dx * dx + dy * dy < lim) return true; } }

}
function snap(x, y) {

  for (let r = Math.max(minRow, r0 - 1); r <= r0 + 1; r++) { const c0 = Math.round((x - L - Rb - (odd(r) ? Rb : 0)) / (2 * Rb)); for (let c = c0 - 1; c <= c0 + 1; c++) {

function stepPath(p, dist, onWall) { // advances p {x,y,dx,dy}; returns true when it touches the bramble
  const st = Rb * .42; let rem = dist;

}
function trace(a) {

}

}

    falling.push({ x: cx(o.row, o.col), y: cy(o.row), vx: Lab.rand(-50, 50) * S, vy: Lab.rand(-120, -30) * S, rot: 0, vr: Lab.rand(-7, 7), color: o.color, delay: .12 + i * .035 + g.length * .03, val, i }); });

/* ---------------------------------------------------------------- frame */
function frame(dt, t) {

  Lab.gameover({ title: "Overgrown!", score, stats: [["Rows grown", rows], ["Best streak", "×" + Math.min(5, bestStreak) + " (" + bestStreak + ")"], ["Biggest drop", bestDrop]] });
}

/* ---------------------------------------------------------------- drawing */
function bgSprite() {
  return Lab.sprite("bg:" + Lab.W + "x" + Lab.H, Lab.W, Lab.H, (g, w, h) => {
    draw.vgrad(g, 0, 0, w, h, [[0, "#1c1436"], [.38, "#472a62"], [.72, "#a04a68"], [.86, "#e08a5b"], [1, "#f2b56b"]]);

    const hy = deadY + 22 * S; g.fillStyle = "#1b2a2f"; g.beginPath(); g.moveTo(0, h); g.lineTo(0, hy); const n = 13, sw = w / n; for (let i = 0; i < n; i++) g.arc(sw * (i + .5), hy + (i % 2) * 4 * S, sw * .56, Math.PI, 0); g.lineTo(w, h); g.fill();
    g.fillStyle = "#223b3a"; for (let i = 0; i < 70; i++) { const x = rnd() * w, y = hy + rnd() * (h - hy); g.beginPath(); g.ellipse(x, y, 7 * S, 3.4 * S, rnd() * 3, 0, TAU); g.fill(); }
    g.fillStyle = "rgba(10,14,22,.35)"; g.fillRect(0, h - 30 * S, w, 30 * S);
  });
}
function berrySprite(i) {

    const gr = g.createRadialGradient(c - r * .35, c - r * .4, r * .1, c, c, r); gr.addColorStop(0, lt); gr.addColorStop(.5, col); gr.addColorStop(1, Lab.color.shade(col, -.35));
