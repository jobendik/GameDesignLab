<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Fruit Slice", instructions:"Swipe to slice fruit. Avoid bombs!", restart:start});
let items, t, spawn, score, miss, trail;
const FRUITS=["🍎","🍊","🍉","🍌","🍇","🍓","🥝","🍍"];
function start(){
  items=[]; t=0; spawn=0; score=0; miss=0; trail=[];
  Lab.setScore(0);
  Lab.input.onMove=[(x,y)=>{ if(Lab.input.down){ trail.push({x,y,t:performance.now()}); }}];
  Lab.loop(dt=>{
    t+=dt; spawn-=dt;
    if(spawn<=0){
      spawn=Lab.rand(0.4,0.9);
      const isBomb=Math.random()<0.15;
      items.push({x:Lab.rand(60,Lab.W-60),y:Lab.H+20, vx:Lab.rand(-80,80), vy:-Lab.rand(700,900), kind:isBomb?'B':Lab.choose(FRUITS), r:30, sliced:false});
    }
    for(const it of items){ it.x+=it.vx*dt; it.y+=it.vy*dt; it.vy+=900*dt; }
    items=items.filter(it=>{ if(it.y>Lab.H+60 && !it.sliced && it.kind!=='B'){ miss++; if(miss>=3){ Lab.gameover({title:"Missed!",message:"Score: "+score}); return false;} } return it.y<Lab.H+60 && !it.sliced; });
    // trail collision
    const now=performance.now();
    trail=trail.filter(p=>now-p.t<200);
    for(let i=1;i<trail.length;i++){
      const a=trail[i-1], b=trail[i];
      for(const it of items){ if(it.sliced) continue;
        if(Lab.dist((a.x+b.x)/2,(a.y+b.y)/2,it.x,it.y)<it.r+10){
          it.sliced=true;
          if(it.kind==='B'){ Lab.gameover({title:"BOOM!",message:"Score: "+score}); return; }
          score++; Lab.setScore(score); Lab.beep(900,.05);
        }
      }
    }
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    c.font="44px sans-serif"; c.textAlign="center"; c.textBaseline="middle";
    for(const it of items){ c.save(); c.translate(it.x,it.y); c.rotate(t*2+it.x);
      c.fillText(it.kind==='B'?"💣":it.kind, 0, 0);
      c.restore();
    }
    c.strokeStyle="rgba(255,255,255,.7)"; c.lineWidth=4; c.lineCap="round";
    if(trail.length>1){ c.beginPath(); c.moveTo(trail[0].x,trail[0].y); for(let i=1;i<trail.length;i++) c.lineTo(trail[i].x,trail[i].y); c.stroke();}
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textBaseline="alphabetic";
    c.fillText("Miss: "+miss+"/3", Lab.W/2, 70);
  });
}
start();
</script></body></html>
