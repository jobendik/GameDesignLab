<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Balance Beam", instructions:"Tap LEFT / RIGHT side to nudge balance. Stay centered!", restart:start});
let angle, vel, push, t, gust;
function start(){
  angle=0; vel=0; push=0; t=0; gust=0;
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ if(x<Lab.W/2) push=-1; else push=1; setTimeout(()=>push=0,80);}];
  Lab.loop(dt=>{
    t+=dt;
    gust+=dt;
    if(gust>1.5){ gust=0; vel+=Lab.rand(-0.6,0.6); }
    // gravity-like: angle accelerates away from 0
    vel += angle*1.8*dt;
    vel += push*1.2*dt*30;
    vel *= 0.985;
    angle += vel*dt;
    if(Math.abs(angle)>Math.PI/3){ Lab.gameover({title:"Fell!",message:"Survived "+t.toFixed(1)+"s"}); return; }
    Lab.setScore(t.toFixed(1));
    const c=Lab.ctx; c.fillStyle="#0e1428"; c.fillRect(0,0,Lab.W,Lab.H);
    const cx=Lab.W/2, cy=Lab.H-100;
    c.save(); c.translate(cx,cy); c.rotate(angle);
    c.fillStyle="#cc8855"; c.fillRect(-160,-10,320,20);
    c.fillStyle="#5af"; c.fillRect(-20,-60,40,50);
    c.beginPath(); c.fillStyle="#5af"; c.arc(0,-80,18,0,Lab.TAU); c.fill();
    c.restore();
    c.strokeStyle="#aa3322"; c.beginPath(); c.moveTo(cx-30,cy+10); c.lineTo(cx-20,Lab.H); c.moveTo(cx+30,cy+10); c.lineTo(cx+20,Lab.H); c.stroke();
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("Tap "+(angle<0?"RIGHT":"LEFT")+" to balance!", Lab.W/2, 70);
  });
}
start();
</script></body></html>
