(function(){ "use strict";
/* RIBBON RODEO — fighter kites with long ribbon tails over a patchwork valley.
 * Core: free-steering "grow a tail" arena against eight AI kites. A kite whose nose touches another kite's ribbon is snipped
 * and bursts into bows. Dash burns your own tail for speed.
 * Twist (the hook): crossing your OWN ribbon is harmless — it closes a lasso. Every bow inside is collected double and every
 * rival nose inside is snipped. So the game is about drawing loops, not just blocking.
 * Arc: one 2:30 "festival". A storm front closes in from 0:25, hunters get bolder and respawn longer; score = bows + snips,

Lab.init({

  theme: { bg: "#8fd0ee", bg2: "#d8f1fb", fg: "#1f3550", muted: "#5a7892", accent: "#ff4f6d", accent2: "#ffb703", light: true },
  orient: "any", music: { style: "bounce", key: "G", bpm: 112, vol: .36 }, restart: start, attract,

const { draw, fx, clamp, lerp } = Lab, TAU = Lab.TAU, INK = "#1f3550";

const NAMES = ["Mango", "Pip", "Juno", "Tumble", "Biscuit", "Zephyr", "Clover", "Nimbus"];

  hunter: { id: "hunter", skill: .95, react: .13, aggr: 1, boosty: .75, wob: .08 },
  scav:   { id: "scav", skill: .8, react: .2, aggr: .4, boosty: .55, wob: .2 },

const OFFS = [0, .45, -.45, .9, -.9, 1.5, -1.5, 2.3, -2.3];
let S, kites, me, bows, cam, T, R, score, kills, lassoBest, lassoN, maxLen, streak, streakT, lassos, lassoCd, stick, boost2, mouseAim, mouseBoost, touchMode,

/* ------------------------------------------------------------------ setup */
function layout() { S = clamp(Math.sqrt(Lab.W * Lab.H) / 600, .85, 1.7); }
Lab.onResize(layout);
function start() {
  demo = false; reset();
  Lab.setScore(0); Lab.hint("Drag to steer · drag past the ring to dash");
  Lab.input.onDown = [(x, y, id) => {
    if (Lab.input.pointerType === "mouse") { mouseAim = { x, y }; mouseBoost = true; touchMode = false; return; }

    get me() { return me; }, get kites() { return kites; }, get bows() { return bows; }, get score() { return score; }, get time() { return T; }, get R() { return R; },
    get kills() { return kills; }, get lassos() { return lassoN; }, get over() { return over; }, ROUND, START, GAP,
    setTime(v) { T = v; }, grow(n) { me.len += n; }, aim(a) { me.want = a; me.ang = a; mouseAim = null; },

    addBow(x, y, v) { return addBow(x, y, v || 1, 0, true); },
    clearBots() { for (const k of kites) if (k !== me) { k.alive = false; k.dead = 1e9; k.pts.length = 0; } },
    /* a straight, non-thinking kite: head at (x,y) flying along ang, body trailing behind it */

  });

function reset() {

  mouseAim = null; mouseBoost = false; touchMode = false; over = false; wallT = 0; natural = 0; lbT = 0; bows = []; kites = []; me = null;
  if (!demo) { me = mkKite(0, 0, -Math.PI / 2, START, null, 0); me.safe = 2.5; me.name = "You"; kites.push(me); }
  for (let i = 0; i < 8; i++) { const k = mkKite(0, 0, 0, 12, KINDS.grazer, i + 1); k.name = NAMES[i]; place(k); kites.push(k); }
  maxLen = START;
  for (let i = 0; i < 330; i++) scatterBow();

function mkKite(x, y, ang, len, kind, ci) {

    think: Math.random() * .3, mood: "graze", prey: null, lockT: 0, tb: null, tbT: 0, look: 0, bb: { x0: 0, y0: 0, x1: 0, y1: 0 }, name: "", dumb: false, flap: Math.random() * TAU };

/* (re)spawn a bot somewhere calm; later in the round newcomers are longer and more likely to be predators */

/* ------------------------------------------------------------------ simulation */
function update(dt) {

function kill0(b) { if (!b.dead) { b.dead = true; if (!b.drop) natural--; } }

function rank() { let r = 1; for (const k of kites) if (k !== me && k.alive && !k.dumb && k.len > me.len) r++; return r; }
function sunset() {

function finish(title, message, survived, r) {

/* ------------------------------------------------------------------ rendering */
function w2s(x, y) { return { x: (x - cam.x) * cam.z + Lab.W / 2, y: (y - cam.y) * cam.z + Lab.play.y + Lab.play.h / 2 }; }
function fieldTile() {

function cloudSprite() {

}
function bowSprite(ci) {

}
function ribbonPath(c, k) {

  for (let i = 0; i < n - 1; i++) c.lineTo(p[i].x, p[i].y);

}
function drawKite(c, k, t) {

  c.lineCap = "round"; c.lineJoin = "round";
  ribbonPath(c, k); c.strokeStyle = Lab.color.shade(k.col, -.28); c.lineWidth = k.w * 2 + 3; c.stroke();

function render(t) {

  const vx0 = cam.x - cx / cam.z - 30, vx1 = cam.x + (W - cx) / cam.z + 30, vy0 = cam.y - cy / cam.z - 30, vy1 = cam.y + (H - cy) / cam.z + 30;
  // storm front outside the arena
  c.fillStyle = "rgba(58,64,104,.74)"; c.beginPath(); c.rect(vx0 - 60, vy0 - 60, vx1 - vx0 + 120, vy1 - vy0 + 120); c.arc(0, 0, R, 0, TAU, true); c.fill("evenodd");
  const step = 64 / R; c.fillStyle = "#565d92";
  for (let a = 0; a < TAU; a += step) { const x = Math.cos(a) * (R + 16), y = Math.sin(a) * (R + 16); if (x < vx0 - 50 || x > vx1 + 50 || y < vy0 - 50 || y > vy1 + 50) continue; c.beginPath(); c.arc(x, y, 34 + Math.sin(a * 37 + t * 1.5) * 6, 0, TAU); c.fill(); }
  c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 3; c.setLineDash([10, 14]); c.lineDashOffset = t * 30; c.beginPath(); c.arc(0, 0, R - 14, 0, TAU); c.stroke(); c.setLineDash([]);

    c.save(); c.translate(b.x, b.y); c.rotate(Math.sin(t * 2 + b.ph) * .5); c.drawImage(sp, -13 * s, -9 * s, 26 * s, 18 * s); c.restore();
  }

  for (const k of kites) if (k.alive && vis(k, vx0, vx1, vy0, vy1)) { ribbonPath(c, k); c.lineWidth = k.w * 2; c.stroke(); }

  for (const k of kites) if (k.alive && k !== me && vis(k, vx0, vx1, vy0, vy1)) drawKite(c, k, t);

  for (const k of kites) {
    if (!k.alive || k === me || !vis(k, vx0, vx1, vy0, vy1) || demo) continue;
    draw.text(c, k.name, k.x, k.y - k.w * 2.1 - 13, { size: 11 / cam.z * S, color: "#fff", stroke: "rgba(31,53,80,.55)", strokeW: 3 / cam.z });
    if (k.mood === "hunt" && k.prey === me) draw.text(c, "!", k.x, k.y - k.w * 2.1 - 30 / cam.z, { size: 20 / cam.z, color: "#ff3355", stroke: "#fff", strokeW: 4 / cam.z });

}
function vis(k, x0, x1, y0, y1) { const b = k.bb; return b.x1 > x0 && b.x0 < x1 && b.y1 > y0 && b.y0 < y1; }
function hud(c, t, heat) {

  draw.text(c, Math.floor(rem / 60) + ":" + String(Math.floor(rem % 60)).padStart(2, "0"), tx + 52, py + 20, { size: 15, color: urgent && Math.sin(t * 8) > 0 ? "#fff" : INK });

    draw.circle(c, lx + 13, y, 4.5, k.col); draw.text(c, pos + ". " + k.name, lx + 22, y + .5, { size: 11.5, color: col, align: "left", weight: k === me ? 800 : 600 });

    const r = ringR(), far = stick.far && me.len > 12; draw.circle(c, stick.ox, stick.oy, r, far ? "rgba(255,79,109,.16)" : "rgba(255,255,255,.14)", far ? "#ff4f6d" : "rgba(255,255,255,.75)", 3);
    const vx = stick.x - stick.ox, vy = stick.y - stick.oy, m = Math.hypot(vx, vy) || 1, q = Math.min(m, r * 1.25);
    draw.circle(c, stick.ox + vx / m * q, stick.oy + vy / m * q, 17, far ? "#ff4f6d" : "rgba(255,255,255,.9)");
    draw.text(c, "DASH", stick.ox, stick.oy - r - 11, { size: 10.5, color: far ? "#ff2f55" : "rgba(255,255,255,.85)", stroke: far ? "#fff" : "rgba(31,53,80,.4)", strokeW: 3 });
  }
}
function frame(dt, t) {

})();
