<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Maze", instructions:"Swipe to move to the goal.", restart:start});
let maze, hero, goal, N=11;
function start(){
  maze=genMaze(N,N);
  hero={r:1,c:1}; goal={r:N-2,c:N-2};
  Lab.setScore(0);
  Lab.input.onSwipe=[(dx,dy)=>{
    const [dr,dc] = Math.abs(dx)>Math.abs(dy)?[0,dx>0?1:-1]:[dy>0?1:-1,0];
    // move until wall (sliding)
    while(true){ const nr=hero.r+dr, nc=hero.c+dc; if(nr<0||nr>=N||nc<0||nc>=N||maze[nr][nc]===1) break; hero.r=nr; hero.c=nc;}
    Lab.beep(500,.03);
    if(hero.r===goal.r && hero.c===goal.c) Lab.win("Escaped!");
  }];
  Lab.loop(()=>draw());
}
function genMaze(rows,cols){
  const m=Array.from({length:rows},()=>Array(cols).fill(1));
  function carve(r,c){ m[r][c]=0;
    const dirs=[[-2,0],[2,0],[0,-2],[0,2]].sort(()=>Math.random()-0.5);
    for(const [dr,dc] of dirs){ const nr=r+dr, nc=c+dc; if(nr<=0||nr>=rows-1||nc<=0||nc>=cols-1) continue; if(m[nr][nc]===0) continue; m[r+dr/2][c+dc/2]=0; carve(nr,nc);}
  }
  carve(1,1);
  m[rows-2][cols-2]=0;
  return m;
}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=Math.min((Lab.W-20)/N, (Lab.H-220)/N); const off={x:(Lab.W-cs*N)/2, y:140};
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    c.fillStyle = maze[r][col]===1 ? "#3a4a6a" : "#15182a";
    c.fillRect(off.x+col*cs, off.y+r*cs, cs, cs);
  }
  c.fillStyle="#7c6"; c.fillRect(off.x+goal.c*cs+3, off.y+goal.r*cs+3, cs-6, cs-6);
  c.beginPath(); c.fillStyle="#fc4"; c.arc(off.x+hero.c*cs+cs/2, off.y+hero.r*cs+cs/2, cs*0.35, 0, Lab.TAU); c.fill();
}
start();
</script></body></html>
