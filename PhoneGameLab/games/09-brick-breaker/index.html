<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Brick Breaker", instructions:"Drag to move the paddle. Don't let the ball fall.", restart:start});
let ball,paddle,bricks,score,lives,launched;
function start(){
  score=0; lives=3; launched=false;
  paddle={x:Lab.W/2,w:120,h:14};
  ball={x:Lab.W/2,y:Lab.H-80,vx:0,vy:0,r:8};
  bricks=[];
  const cols=7, rows=5, mx=20, top=110;
  const bw=(Lab.W-mx*2)/cols, bh=22;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    bricks.push({x:mx+c*bw+4,y:top+r*bh,w:bw-8,h:bh-4,hue:Lab.randInt(0,360)});
  }
  Lab.setScore(0);
  Lab.input.onMove=[(x)=>{ paddle.x=Lab.clamp(x,paddle.w/2,Lab.W-paddle.w/2); }];
  Lab.input.onTap=[()=>{ if(!launched){ ball.vx=(Math.random()-0.5)*200; ball.vy=-340; launched=true; } }];
  Lab.loop(dt=>{
    const c=Lab.ctx; c.fillStyle="#0b0f1a"; c.fillRect(0,0,Lab.W,Lab.H);
    if(!launched){ ball.x=paddle.x; ball.y=Lab.H-90; }
    else{
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(ball.x<ball.r||ball.x>Lab.W-ball.r){ ball.vx*=-1; ball.x=Lab.clamp(ball.x,ball.r,Lab.W-ball.r);}
      if(ball.y<80+ball.r){ ball.vy*=-1; }
      // paddle
      if(ball.y+ball.r>Lab.H-40 && ball.y<Lab.H-30 && Math.abs(ball.x-paddle.x)<paddle.w/2+ball.r && ball.vy>0){
        ball.vy=-Math.abs(ball.vy);
        ball.vx += (ball.x-paddle.x)*4;
        Lab.beep(700,.04);
      }
      if(ball.y>Lab.H){ lives--; launched=false; ball.vx=0; ball.vy=0; if(lives<=0){ Lab.gameover({title:"Game Over",message:"Score: "+score}); return; } }
      // bricks
      for(let i=bricks.length-1;i>=0;i--){
        const b=bricks[i];
        if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){
          bricks.splice(i,1); ball.vy*=-1; score+=10; Lab.setScore(score); Lab.beep(1100,.04);
          if(!bricks.length){ Lab.win("Score: "+score); return; }
          break;
        }
      }
    }
    // draw bricks
    for(const b of bricks){ c.fillStyle=`hsl(${b.hue},70%,60%)`; c.fillRect(b.x,b.y,b.w,b.h); }
    // paddle
    c.fillStyle="#5af"; c.fillRect(paddle.x-paddle.w/2, Lab.H-40, paddle.w, paddle.h);
    // ball
    c.beginPath(); c.fillStyle="#fff"; c.arc(ball.x,ball.y,ball.r,0,Lab.TAU); c.fill();
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("❤️ "+lives, Lab.W/2, 70);
    if(!launched){ c.fillStyle="#ffd35a"; c.fillText("Tap to launch", Lab.W/2, Lab.H-60);}
  });
}
start();
</script></body></html>
