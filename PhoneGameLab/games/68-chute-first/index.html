(function(){ "use strict";
/* CHUTE FIRST — a toy-factory sorting table seen from above. A block drops on the turntable; flick it (or tap a chute,

 *          every 5 in a row raises the multiplier (max ×5); a spotless round pays a bonus. Three mistakes end the run.
