    ui.hold = { x: wx, y, w: 70 * T, h }; ui.next = { x: wx + w - 150 * T, y, w: 150 * T, h }; ui.tide = { x: wx + 78 * T, y, w: w - 236 * T, h: 40 * T }; ui.stat = { x: wx + 78 * T + (w - 236 * T) / 2, y: y + 54 * T };
  }
  btns.push({ id: "hold", fn: doHold, ...ui.hold }, { id: "tide", fn: tide, ...ui.tide });
  Lab.sprite.clear("bg:");
}
Lab.onResize(() => { if (board) layout(); });

/* ---------- art */
function cellSprite(i) {
  return Lab.sprite("c:" + i + ":" + cell, cell, cell, gx => {
    const col = COL[i], s = cell - 2, gd = gx.createLinearGradient(0, 0, cell, cell);
    if (i === STONE) { gd.addColorStop(0, "#bdb7ab"); gd.addColorStop(1, "#8a8479"); draw.rect(gx, 1, 1, s, s, cell * .34, gd, "#6f695f", 1.2); const r = Lab.rng(5); for (let k = 0; k < 6; k++) draw.circle(gx, 4 + r() * (s - 6), 4 + r() * (s - 6), 1 + r() * 1.2, "rgba(60,55,45,.35)"); return; }
    gd.addColorStop(0, shade(col, .3)); gd.addColorStop(1, shade(col, -.14)); draw.rect(gx, 1, 1, s, s, cell * .27, gd, shade(col, -.34), 1.3);
    draw.rect(gx, 1 + s * .15, 1 + s * .15, s * .7, s * .7, cell * .17, "rgba(255,255,255,.17)");
    gx.strokeStyle = "rgba(255,255,255,.75)"; gx.lineWidth = Math.max(1.5, cell * .075); gx.lineCap = "round"; gx.beginPath(); gx.arc(cell * .5, cell * .5, s * .31, Math.PI * 1.08, Math.PI * 1.42); gx.stroke();
  });
}
function drawMini(c, k, cx, cy, size, alpha) {
  const sh = SH[k][0], xs = sh.map(p => p[0]), ys = sh.map(p => p[1]), w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1, s = Math.min(size / Math.max(w, 2.6), size / 2.2), sp = cellSprite(k);
  c.globalAlpha = alpha == null ? 1 : alpha; for (const [x, y] of sh) c.drawImage(sp, cx + (x - Math.min(...xs) - w / 2) * s, cy + (y - Math.min(...ys) - h / 2) * s, s, s); c.globalAlpha = 1;
}
function panel(c, r, label, hot) { draw.rect(c, r.x, r.y + 3, r.w, r.h, 14, "rgba(120,90,40,.22)"); draw.rect(c, r.x, r.y, r.w, r.h, 14, hot || "#fbf3df", "#d9c391", 2); if (label) draw.text(c, label, r.x + 10 * T, r.y + 11 * T, { size: 9.5 * T, color: "#8a7a55", weight: 800, align: "left" }); }
function render(t) {
  const c = Lab.ctx, W = Lab.W, H = Lab.H, VR = ROWS - HID, ww = COLS * cell, wh = VR * cell;
  const bg = Lab.sprite("bg:" + W + "x" + H, W + 80, H + 80, gx => {
    draw.vgrad(gx, 0, 0, W + 80, H + 80, ["#f6ead0", "#e7d3a6"]); const r = Lab.rng(11);
    for (let i = 0; i < 260; i++) draw.circle(gx, r() * (W + 80), r() * (H + 80), .6 + r() * 1.3, r() < .5 ? "rgba(150,120,70,.2)" : "rgba(255,255,255,.5)");
    for (let i = 0; i < 5; i++) { const x = r() * (W + 80), y = r() * (H + 80), s = 8 + r() * 8; gx.strokeStyle = "rgba(190,150,100,.35)"; gx.lineWidth = 2; gx.beginPath(); gx.arc(x, y, s, 0, Math.PI); gx.stroke(); gx.beginPath(); gx.arc(x, y, s * .55, 0, Math.PI); gx.stroke(); }
    const x = wx + 40, y = wy + 40; draw.rect(gx, x - 9, y - 9, ww + 18, wh + 18, 18, "#d7bd86"); draw.rect(gx, x - 9, y - 9, ww + 18, wh + 18, 18, null, "#bfa26a", 2); draw.rect(gx, x - 3, y - 3, ww + 6, wh + 6, 10, "#0f6f86");
    gx.save(); draw.rr(gx, x, y, ww, wh, 7); gx.clip(); draw.vgrad(gx, x, y, ww, wh, ["#7fd3d8", "#3aa7b8", "#1c7f97"]);
    gx.strokeStyle = "rgba(255,255,255,.07)"; gx.lineWidth = 1; for (let i = 1; i < COLS; i++) { gx.beginPath(); gx.moveTo(x + i * cell, y); gx.lineTo(x + i * cell, y + wh); gx.stroke(); } for (let i = 1; i < VR; i++) { gx.beginPath(); gx.moveTo(x, y + i * cell); gx.lineTo(x + ww, y + i * cell); gx.stroke(); }
    gx.restore();
  });
  c.drawImage(bg, -40, -40, bg.w, bg.h);
  c.save(); draw.rr(c, wx, wy, ww, wh, 7); c.clip();
  c.strokeStyle = "rgba(255,255,255,.13)"; c.lineWidth = 2; for (let i = 0; i < 4; i++) { c.beginPath(); for (let x = 0; x <= ww; x += 12) { const y = wy + wh * (.15 + i * .23) + Math.sin(x * .03 + t * (.7 + i * .2) + i * 2) * 9 + Math.sin(x * .011 - t * .5 + i) * 14; x ? c.lineTo(wx + x, y) : c.moveTo(wx + x, y); } c.stroke(); }
  if (danger) { const a = .1 + .08 * Math.sin(t * 8); const gd = c.createLinearGradient(0, wy, 0, wy + cell * 6); gd.addColorStop(0, "rgba(255,90,70," + (a + .22) + ")"); gd.addColorStop(1, "rgba(255,90,70,0)"); c.fillStyle = gd; c.fillRect(wx, wy, ww, cell * 6); }
  const cp = clearT > 0 ? 1 - clearT / .26 : 0;
  for (let r = HID - 1; r < ROWS; r++) {
    const isC = clearT > 0 && clearing.includes(r);
    for (let col = 0; col < COLS; col++) {
      const v = board[r][col]; if (!v) continue; const sp = cellSprite(v - 1), x = wx + col * cell, y = wy + (r - HID) * cell + offs[r * COLS + col];
      if (isC) { const d = Math.abs(col - 4.5) / 5, k = clamp(1 - (cp * 1.6 - d * .6), 0, 1); c.globalAlpha = k; const s = cell * (.6 + .4 * k); c.drawImage(sp, x + (cell - s) / 2, y + (cell - s) / 2, s, s); c.globalAlpha = (1 - cp) * .8; c.fillStyle = "#fff"; c.fillRect(x, y + cell * .1, cell, cell * .8); c.globalAlpha = 1; }

  }
  for (const f of flashes) { const a = f.t / .18; if (f.trail) { const gd = c.createLinearGradient(0, wy + (f.y - HID) * cell, 0, wy + (f.y - HID + f.h) * cell); gd.addColorStop(0, "rgba(255,255,255,0)"); gd.addColorStop(1, "rgba(255,255,255," + a * .5 + ")"); c.fillStyle = gd; c.fillRect(wx + f.x * cell + 3, wy + (f.y - HID) * cell, cell - 6, f.h * cell); } else { c.fillStyle = "rgba(255,255,255," + a * .65 + ")"; draw.rr(c, wx + f.x * cell + 1, wy + (f.y - HID) * cell + 1, cell - 2, cell - 2, cell * .27); c.fill(); } }
  if (cur && alive) {
    const gy = ghostY(), sp = cellSprite(cur.k), sh = SH[cur.k][cur.rot], lk = grounded() ? .75 + .25 * Math.cos(lockT / LOCK * Math.PI * 3) : 1;
    if (gy > cur.y) for (const [cx, cy] of sh) { const x = wx + (cur.x + cx) * cell, y = wy + (gy + cy - HID) * cell; draw.rect(c, x + 2.5, y + 2.5, cell - 5, cell - 5, cell * .24, "rgba(255,255,255,.14)", "rgba(255,255,255,.62)", 1.6); }
    const n = DEF[cur.k][0], px = wx + (cur.x + n / 2) * cell + cur.ox, py = wy + (cur.y + n / 2 - HID) * cell + cur.oy;
    c.save(); c.translate(px, py); if (cur.spin) c.rotate(-cur.spin * Math.PI); c.globalAlpha = lk; for (const [cx, cy] of sh) c.drawImage(sp, (cx - n / 2) * cell, (cy - n / 2) * cell, cell, cell); c.restore();
  }
  if (ui.wave > 0) { const p = 1 - ui.wave, y0 = wy + wh * (1.15 - p * 1.5); c.fillStyle = "rgba(235,255,255," + (.5 * Math.sin(Math.min(1, p * 1.3) * Math.PI)) + ")"; c.beginPath(); c.moveTo(wx, wy + wh); for (let x = 0; x <= ww; x += 10) c.lineTo(wx + x, y0 + Math.sin(x * .06 + t * 12) * 7); c.lineTo(wx + ww, wy + wh); c.fill(); }
  c.restore();
  const pe = pebEvery(); if (pe && alive) { const left = pe - sincePeb; for (let i = 0; i < pe; i++) draw.circle(c, wx + ww / 2 + (i - (pe - 1) / 2) * 10 * T, wy + wh + 13 * T, 3 * T, i < left ? "#9a9488" : "rgba(150,140,120,.25)"); }
  // hold / tide / next / stats
  const hb = ui.hold, nb = ui.next, tb = ui.tide, pop = 1 + (ui.holdPop || 0) * .2;
  panel(c, hb, "HOLD"); if (hold >= 0) drawMini(c, hold, hb.x + hb.w / 2, hb.y + hb.h / 2 + 6 * T, Math.min(hb.w, hb.h) * .62 * pop, holdUsed ? .4 : 1);
  panel(c, nb, "NEXT"); if (queue.length) { if (nb.vert) for (let i = 0; i < 1; i++) drawMini(c, queue[0], nb.x + nb.w / 2, nb.y + nb.h / 2 + 6 * T, nb.h * .62); else { drawMini(c, queue[0], nb.x + nb.w * .24, nb.y + nb.h / 2 + 6 * T, nb.h * .62); drawMini(c, queue[1], nb.x + nb.w * .59, nb.y + nb.h / 2 + 7 * T, nb.h * .42, .8); drawMini(c, queue[2], nb.x + nb.w * .85, nb.y + nb.h / 2 + 7 * T, nb.h * .42, .6); } }
  if (nb.vert && queue.length > 2) for (let i = 1; i < 3; i++) { const r = { x: nb.x + 12 * T, y: nb.y + nb.h + 10 * T + (i - 1) * 62 * T, w: nb.w - 24 * T, h: 54 * T }; panel(c, r); drawMini(c, queue[i], r.x + r.w / 2, r.y + r.h / 2, r.h * .66, .85); }
  const full = charge >= NEED, glow = full ? .5 + .5 * Math.sin(t * 6) : 0, nox = ui.tideNo > 0 ? Math.sin(ui.tideNo * 50) * 3 : 0;
  c.save(); c.translate(nox, 0); draw.rect(c, tb.x, tb.y + 3, tb.w, tb.h, tb.h / 2, "rgba(20,90,110,.3)"); draw.rect(c, tb.x, tb.y, tb.w, tb.h, tb.h / 2, "#d9eef0", full ? shade("#1a9bb0", glow * .3) : "#9cc7cc", full ? 3 : 2);
  c.save(); draw.rr(c, tb.x + 3, tb.y + 3, tb.w - 6, tb.h - 6, tb.h / 2); c.clip(); const fw = (tb.w - 6) * charge / NEED; c.fillStyle = full ? Lab.color.mix("#1a9bb0", "#5fd0dc", glow) : "#7cc5cf"; c.beginPath(); c.moveTo(tb.x + 3, tb.y + tb.h); for (let y = tb.h; y >= 0; y -= 4) c.lineTo(tb.x + 3 + fw + Math.sin(y * .25 + t * 5) * (full ? 0 : 2.5), tb.y + y); c.lineTo(tb.x + 3, tb.y); c.fill(); c.restore();
  draw.text(c, full ? "TIDE!" : "TIDE " + charge + "/" + NEED, tb.x + tb.w / 2, tb.y + tb.h / 2 + 1, { size: (full ? 17 : 14) * T, color: full ? "#fff" : "#1f5a6c", weight: 800, stroke: full ? "rgba(15,80,100,.6)" : null }); c.restore();
  const sx = ui.stat.x, sy = ui.stat.y;
  if (ui.stat.col) { draw.text(c, "LEVEL " + level, sx, sy, { size: 15 * T, color: "#1f4a5c", weight: 800 }); draw.text(c, lines + " lines", sx, sy + 20 * T, { size: 13 * T, color: "#6f8a8c", weight: 700 }); }
  else draw.text(c, "LV " + level + "  ·  " + lines + " lines", sx, sy, { size: 12.5 * T, color: "#5f7a70", weight: 800 });
}
Lab.boot();
})();
