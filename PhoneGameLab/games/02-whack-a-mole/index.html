<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Whack-a-Mole", instructions:"Tap moles 🐹 — avoid bombs 💣. 30s.", restart:start});
let holes,t,timeLeft,score,life;
function start(){
  score=0; life=3; timeLeft=30;
  Lab.setScore(0);
  const cols=3, rows=4, gx=Lab.W/cols, gy=(Lab.H-160)/rows;
  holes=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    holes.push({x:gx*(c+.5), y:120+gy*(r+.5), st:'empty', tt:Lab.rand(.5,1.5), kind:'mole'});
  }
  Lab.input.onTap=[(x,y)=>{
    for(const h of holes){
      if(Lab.dist(x,y,h.x,h.y)<46 && h.st==='up'){
        if(h.kind==='bomb'){ life--; Lab.beep(80,.15,'sawtooth'); h.st='empty'; h.tt=Lab.rand(.6,1.5); if(life<=0)Lab.gameover({title:"Boom!",message:"Score: "+score});}
        else{ score++; Lab.setScore(score); Lab.beep(900,.05); h.st='empty'; h.tt=Lab.rand(.3,1); }
        return;
      }
    }
  }];
  Lab.loop(dt=>{
    timeLeft-=dt;
    if(timeLeft<=0){ Lab.gameover({title:"Time!",message:"Score: "+score}); return; }
    for(const h of holes){
      h.tt-=dt;
      if(h.tt<=0){
        if(h.st==='empty'){ h.st='up'; h.kind=Math.random()<0.18?'bomb':'mole'; h.tt=Lab.rand(.7,1.3); }
        else{ h.st='empty'; h.tt=Lab.rand(.5,1.8); }
      }
    }
    const c=Lab.ctx; c.clearRect(0,0,Lab.W,Lab.H);
    for(const h of holes){
      c.beginPath(); c.fillStyle="#1c2546"; c.ellipse(h.x,h.y+18,42,16,0,0,Lab.TAU); c.fill();
      if(h.st==='up'){
        c.beginPath();
        if(h.kind==='bomb'){ c.fillStyle="#222"; c.arc(h.x,h.y-2,34,0,Lab.TAU); c.fill();
          c.fillStyle="#ff5577"; c.font="28px sans-serif"; c.textAlign="center"; c.fillText("💣",h.x,h.y+10);
        } else { c.fillStyle="#c08858"; c.arc(h.x,h.y-2,34,0,Lab.TAU); c.fill();
          c.fillStyle="#fff"; c.font="30px sans-serif"; c.textAlign="center"; c.fillText("🐹",h.x,h.y+10);
        }
      }
    }
    c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
    c.fillText("⏱ "+timeLeft.toFixed(1)+"   ❤️ "+life, Lab.W/2, 60);
  });
}
start();
</script></body></html>
