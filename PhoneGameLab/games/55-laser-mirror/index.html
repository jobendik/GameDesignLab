<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Laser Mirror", instructions:"Tap mirrors to rotate. Aim laser at the target.", restart:start});
let g, src, target, N=6;
function start(){
  g=Array.from({length:N},()=>Array(N).fill(null));
  // place a few mirrors
  const positions=[]; while(positions.length<5){ const r=Lab.randInt(1,N-2), c=Lab.randInt(1,N-2); if(!positions.find(p=>p[0]===r&&p[1]===c)) positions.push([r,c]);}
  for(const [r,c] of positions) g[r][c]={kind:Math.random()<0.5?"/":"\\"};
  src={r:0,c:0,dir:[0,1]}; target={r:N-1,c:N-1};
  Lab.setScore(0);
  Lab.input.onTap=[(x,y)=>{ const cs=cellSize(), off=offset(cs);
    const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs);
    if(c<0||c>=N||r<0||r>=N||!g[r][c]) return;
    g[r][c].kind = g[r][c].kind==="/" ? "\\" : "/"; Lab.beep(400,.03);
    if(trace().hitTarget) Lab.win("Aligned!");
  }];
  Lab.loop(()=>draw());
}
function trace(){ const path=[]; let r=src.r, c=src.c, dr=src.dir[0], dc=src.dir[1];
  path.push([r,c]);
  for(let i=0;i<100;i++){
    r+=dr; c+=dc;
    if(r<0||r>=N||c<0||c>=N) return {path, hitTarget:false};
    path.push([r,c]);
    if(g[r][c]){ if(g[r][c].kind==="/"){ [dr,dc]=[-dc,-dr]; } else { [dr,dc]=[dc,dr]; }}
    if(r===target.r&&c===target.c) return {path, hitTarget:true};
  }
  return {path, hitTarget:false};
}
function cellSize(){ return Math.min((Lab.W-20)/N, (Lab.H-220)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:140};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){ c.strokeStyle="#3a3a52"; c.strokeRect(off.x+col*cs, off.y+r*cs, cs, cs);}
  // source
  c.fillStyle="#ff5577"; c.fillRect(off.x+src.c*cs+5, off.y+src.r*cs+5, cs-10, cs-10);
  c.fillStyle="#7c6"; c.fillRect(off.x+target.c*cs+5, off.y+target.r*cs+5, cs-10, cs-10);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){ if(!g[r][col]) continue;
    c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath();
    const x=off.x+col*cs, y=off.y+r*cs;
    if(g[r][col].kind==="/"){ c.moveTo(x+cs-5, y+5); c.lineTo(x+5, y+cs-5);}
    else { c.moveTo(x+5, y+5); c.lineTo(x+cs-5, y+cs-5);}
    c.stroke();
  }
  const tr=trace();
  c.strokeStyle="#ff5577"; c.lineWidth=2; c.beginPath();
  for(let i=0;i<tr.path.length;i++){ const [r,col]=tr.path[i]; const x=off.x+col*cs+cs/2, y=off.y+r*cs+cs/2; if(i===0) c.moveTo(x,y); else c.lineTo(x,y);}
  c.stroke();
}
start();
</script></body></html>
