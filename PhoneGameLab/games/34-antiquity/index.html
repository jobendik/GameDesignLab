(function(){ "use strict";
/* ANTIQUITY — a mason ant hauls sandstone blocks along a ruined desert causeway to the next shrine.

 * Core: drag to steer across five lanes; blocks on the road stack on the ant's head. A wall costs its height in blocks

 * Units: world x in lanes (0..5), world y in tiles; one tile = CW px.                                            */
Lab.init({
  title: "Antiquity", tagline: "Haul stone. Mind the wobble.", category: "Runner & Movement",
  howto: ["Drag to steer the ant", "Blocks pay for walls and canals", "Swerve gently — tall stacks topple"],
  theme: { bg: "#d99a4e", bg2: "#f0c987", fg: "#3b2140", muted: "#7a5a4a", accent: "#c9583a", accent2: "#1fa79b", light: true },
  orient: "portrait", music: { style: "drive", key: "D", bpm: 100, vol: .24 }, restart: start,

const { draw, fx, ease } = Lab, TAU = Lab.TAU, C = Lab.color, clamp = Lab.clamp;
const NC = 5, CAP = 12, OPEN = 99;

let W, H, S, CW, RX0, AY, BW, BH, TD;

function layout() {

  CW = Math.min((W - 96 * S) / NC, 62 * S); RX0 = (W - NC * CW) / 2; AY = Lab.play.y + Lab.play.h * .76;

}
Lab.onResize(() => { if (rows) layout(); });
const sx = x => RX0 + x * CW, sy = y => AY - (y - dist) * CW;
const speed = lv => Math.min(6.4, 3.3 + (lv - 1) * .3);

  Lab.input.onKey = [() => { dragged = true; }];

    get score() { return bank + Math.floor(dist); }, get stack() { return stack; }, get level() { return level; }, get dist() { return dist; }, get alive() { return alive; }, get x() { return ax; }, get tx() { return tx; },
    get delivered() { return delivered; }, get hauled() { return hauled; }, get shed() { return shed; }, get lean() { return lean; }, get CW() { return CW; }, get locked() { return dist < lockUntil; },
    steerTo(x) { if (alive) tx = clamp(x, .35, NC - .35); }, get carried() { return carried; }, get spent() { return spent; }, setStack(n) { stack = clamp(n, 0, CAP); }, auto() { tx = aiTarget(); },

/* ---------- world generation: a section = block stretches + toll rows, closed by a shrine */
function genSection() {

}

/* ---------- actions */

  if (over > 0) { bank += over * 5; fx.text(x, y - 20, "+" + over * 5, { color: INK, size: 15, outline: CREAM }); Lab.sfx("coin", { vol: .5 }); if (!told.cap) { told.cap = 1; Lab.toast("Full load! Extra blocks pay 5", 1600, { y: .2 }); } }
}

}

  if (r) { let best = 1e9; for (let c = 0; c < NC; c++) { const cost = (r.type === "beam" ? Math.max(0, stack - r.c[c]) : r.c[c] > stack ? 50 : r.c[c]) + Math.abs(c + .5 - ax) * .05; if (cost < best) { best = cost; goal = c + .5; } } }

/* ---------- drawing */
