<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../shared/style.css"><script src="../../shared/core.js"></script>
</head><body><script>
Lab.init({title:"Minesweeper", instructions:"Tap to reveal. Long-press (hold) to flag.", restart:start});
let g, revealed, flagged, N=9, MINES=10, dead, holdTimer;
function start(){
  g=Array.from({length:N},()=>Array(N).fill(0));
  revealed=Array.from({length:N},()=>Array(N).fill(false));
  flagged=Array.from({length:N},()=>Array(N).fill(false));
  let m=0; while(m<MINES){ const r=Lab.randInt(0,N-1), c=Lab.randInt(0,N-1); if(g[r][c]===-1) continue; g[r][c]=-1; m++;}
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(g[r][c]===-1) continue; let n=0; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const nr=r+dr, nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N) continue; if(g[nr][nc]===-1) n++;} g[r][c]=n;}
  dead=false; Lab.setScore(0);
  Lab.input.onDown=[(x,y)=>{ const p=pick(x,y); if(!p) return;
    holdTimer=setTimeout(()=>{ flagged[p.r][p.c]=!flagged[p.r][p.c]; Lab.beep(400,.05); holdTimer=null;},400);
  }];
  Lab.input.onTap=[(x,y)=>{ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null;} const p=pick(x,y); if(!p||dead||flagged[p.r][p.c]) return;
    if(g[p.r][p.c]===-1){ dead=true; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(g[r][c]===-1) revealed[r][c]=true; Lab.gameover({title:"Boom!"}); return;}
    flood(p.r,p.c);
    let safe=0; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(g[r][c]!==-1 && revealed[r][c]) safe++;
    Lab.setScore(safe);
    if(safe===N*N-MINES) Lab.win("Cleared!");
  }];
  Lab.loop(()=>draw());
}
function pick(x,y){ const cs=cellSize(), off=offset(cs); const c=Math.floor((x-off.x)/cs), r=Math.floor((y-off.y)/cs); if(c<0||c>=N||r<0||r>=N) return null; return {r,c};}
function flood(r,c){ if(revealed[r][c]||flagged[r][c]) return; revealed[r][c]=true; if(g[r][c]!==0) return;
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const nr=r+dr, nc=c+dc; if(nr<0||nr>=N||nc<0||nc>=N) continue; flood(nr,nc);}
}
function cellSize(){ return Math.min((Lab.W-20)/N, (Lab.H-220)/N);}
function offset(cs){ return {x:(Lab.W-cs*N)/2, y:160};}
function draw(){
  const c=Lab.ctx; c.fillStyle="#1c1c2c"; c.fillRect(0,0,Lab.W,Lab.H);
  const cs=cellSize(), off=offset(cs);
  for(let r=0;r<N;r++) for(let col=0;col<N;col++){
    const x=off.x+col*cs, y=off.y+r*cs;
    c.fillStyle = revealed[r][col] ? (g[r][col]===-1?"#a33":"#222a3a") : "#3a4a6a";
    c.fillRect(x+1,y+1,cs-2,cs-2);
    if(revealed[r][col] && g[r][col]>0){ c.fillStyle=["#fff","#7af","#7c6","#fc4","#e67","#a6e","#fa6","#fff","#f00"][g[r][col]]; c.font=`bold ${cs*0.5}px sans-serif`; c.textAlign="center"; c.textBaseline="middle"; c.fillText(g[r][col], x+cs/2, y+cs/2);}
    if(!revealed[r][col] && flagged[r][col]){ c.fillStyle="#ff5577"; c.fillRect(x+cs*0.3, y+cs*0.2, cs*0.4, cs*0.6);}
  }
  c.fillStyle="#7e89b3"; c.font="14px sans-serif"; c.textAlign="center";
  c.fillText("Tap to reveal, hold to flag", Lab.W/2, 130);
}
start();
</script></body></html>
