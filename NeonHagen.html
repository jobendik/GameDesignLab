<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Neon Hagen</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html,body,#root{height:100%;margin:0;background:#0b0f1a;color:#fff;overflow:hidden}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

/* ---------- React hooks ---------- */
const { useState, useEffect, useRef, useMemo, useLayoutEffect, useCallback } = React;

/* ---------- Firebase stubs (single-player, no network) ---------- */
const __firebase_config = '{"apiKey":"local"}';
const __app_id = 'local';
const initializeApp = () => ({});
const getAuth = () => ({});
let _authCb = null;
const signInAnonymously = async () => {
  setTimeout(() => _authCb && _authCb({ uid: 'local-' + Math.random().toString(36).slice(2, 8) }), 30);
};
const signInWithCustomToken = signInAnonymously;
const onAuthStateChanged = (_a, cb) => { _authCb = cb; return () => { _authCb = null; }; };
const getFirestore = () => ({});
const collection = (...a) => ({ __c: a });
const doc = (...a) => ({ __d: a });
const setDoc = async () => {};
const addDoc = async () => {};
const onSnapshot = (_ref, cb) => { cb({ forEach: () => {} }); return () => {}; };
const serverTimestamp = () => ({ seconds: Date.now() / 1000 });

/* ---------- lucide-react icon shim ---------- */
const _mk = (svg) => ({ size = 20, className = '', fill = 'none', style, ...rest }) =>
  React.createElement('svg', {
    width: size, height: size, viewBox: '0 0 24 24',
    fill, stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
    className, style, ...rest, dangerouslySetInnerHTML: { __html: svg }
  });
const Mic          = _mk('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>');
const MicOff       = _mk('<line x1="2" y1="2" x2="22" y2="22"/><path d="M18.9 13.2A7 7 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><line x1="12" y1="19" x2="12" y2="22"/>');
const MessageCircle= _mk('<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>');
const X            = _mk('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>');
const Send         = _mk('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>');
const Sparkles     = _mk('<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>');
const Sprout       = _mk('<path d="M7 20h10"/><path d="M10 20c0-4 3-6 3-6s3 1 3 6"/><path d="M13 14a6 6 0 0 0-6-6 6 6 0 0 0 6 6z"/>');
const Zap          = _mk('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>');
const Pickaxe      = _mk('<path d="M14 13l-8 8a2 2 0 0 1-3-3l8-8"/><path d="M17.6 6.4 22 2"/><path d="M11 14a8 8 0 0 0 8-8l-3-3a8 8 0 0 0-8 8z"/>');
const RotateCcw    = _mk('<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>');
const Play         = _mk('<polygon points="5 3 19 12 5 21 5 3"/>');
const Trophy       = _mk('<path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2"/><path d="M18 9h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"/><path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/><path d="M14 14.7V17c0 .6.5 1 1 1.2 1.2.6 2 2 2 3.8"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>');
const Lock         = _mk('<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>');
const AlertCircle  = _mk('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>');


/* ================= GAME CODE ================= */

// --- Firebase Setup ---
const firebaseConfig = JSON.parse(__firebase_config);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

// --- Helpers ---
const getRandomColor = () => {
  const colors = ['#f472b6', '#34d399', '#60a5fa', '#a78bfa', '#fbbf24'];
  return colors[Math.floor(Math.random() * colors.length)];
};

const getRandomName = () => {
  const prefix = ['Lykkelig', 'Svevende', 'Grønn', 'Blomstrende', 'Lysende'];
  const suffix = ['Gartner', 'Sjel', 'Vind', 'Spire', 'Bie'];
  return `${prefix[Math.floor(Math.random() * prefix.length)]} ${suffix[Math.floor(Math.random() * suffix.length)]}`;
};

// Flower Logic
class Flower {
  constructor(x, y, isGiant = false) {
    this.x = x;
    this.y = y;
    this.isGiant = isGiant;
    this.bloomLevel = 0; // 0 to 100
    this.maxBloom = 100;
    this.hue = Math.random() * 360;
    this.bloomed = false;
    this.playersContributing = 0;
  }
}

function NeonGarden() {
  const [user, setUser] = useState(null);
  const [otherPlayers, setOtherPlayers] = useState({});
  const [messages, setMessages] = useState([]);
  const [showGlobalChat, setShowGlobalChat] = useState(false);
  const [inputText, setInputText] = useState("");
  const [isMicOn, setIsMicOn] = useState(false);
  const [flowersBloomed, setFlowersBloomed] = useState(0);

  const canvasRef = useRef(null);
  const requestRef = useRef();
  
  // Game State
  const gameState = useRef({
    x: 1500, y: 1500,
    vx: 0, vy: 0,
    color: getRandomColor(),
    name: getRandomName(),
    trail: []
  });

  const flowersRef = useRef([]);
  const joystick = useRef({ active: false, originX: 0, originY: 0, currX: 0, currY: 0, dx: 0, dy: 0 });
  const WORLD_SIZE = 3000;

  // --- Init ---
  useEffect(() => {
    // Generate Flowers
    const flowers = [];
    // Small flowers (easy)
    for (let i = 0; i < 200; i++) {
        flowers.push(new Flower(Math.random() * WORLD_SIZE, Math.random() * WORLD_SIZE, false));
    }
    // Giant flowers (Co-op required)
    for (let i = 0; i < 15; i++) {
        flowers.push(new Flower(Math.random() * WORLD_SIZE, Math.random() * WORLD_SIZE, true));
    }
    flowersRef.current = flowers;

    const initAuth = async () => {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
        } else {
            await signInAnonymously(auth);
        }
    };
    initAuth();

    const unsubscribe = onAuthStateChanged(auth, u => { if (u) setUser(u); });
    return () => unsubscribe();
  }, []);

  // --- Sync ---
  useEffect(() => {
    if (!user) return;
    
    // Players Sync
    const unsubPlayers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'garden_players'), snap => {
      const p = {};
      snap.forEach(d => { if(d.id !== user.uid) p[d.id] = d.data(); });
      setOtherPlayers(p);
    });

    // Chat Sync
    const unsubChat = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'garden_chat'), snap => {
      const m = [];
      snap.forEach(d => m.push({id: d.id, ...d.data()}));
      m.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      setMessages(m.slice(-50));
    });

    // Broadcast Self
    const interval = setInterval(() => {
      setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'garden_players', user.uid), {
        x: gameState.current.x,
        y: gameState.current.y,
        color: gameState.current.color,
        name: gameState.current.name,
        lastSeen: serverTimestamp()
      }, { merge: true });
    }, 500);

    return () => { unsubPlayers(); unsubChat(); clearInterval(interval); };
  }, [user]);

  // --- Animation Loop ---
  const animate = () => {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const state = gameState.current;

    // 1. Physics (Floaty)
    if (joystick.current.active) {
        state.vx += joystick.current.dx * 0.4;
        state.vy += joystick.current.dy * 0.4;
    }
    state.vx *= 0.92; // High friction for control
    state.vy *= 0.92;
    state.x = Math.max(0, Math.min(state.x + state.vx, WORLD_SIZE));
    state.y = Math.max(0, Math.min(state.y + state.vy, WORLD_SIZE));

    // 2. Camera
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const offsetX = canvas.width / 2 - state.x;
    const offsetY = canvas.height / 2 - state.y;

    // 3. Draw Background
    const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
    bgGrad.addColorStop(0, '#111827'); // Gray/Black
    bgGrad.addColorStop(1, '#1f2937');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0, canvas.width, canvas.height);

    // Grid (Faint)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const gridSize = 200;
    const startX = Math.floor((state.x - canvas.width/2)/gridSize)*gridSize;
    const startY = Math.floor((state.y - canvas.height/2)/gridSize)*gridSize;
    for(let x=startX; x<startX+canvas.width+gridSize*2; x+=gridSize) {
        ctx.beginPath(); ctx.moveTo(x+offsetX, -1000); ctx.lineTo(x+offsetX, WORLD_SIZE+1000); ctx.stroke();
    }
    for(let y=startY; y<startY+canvas.height+gridSize*2; y+=gridSize) {
        ctx.beginPath(); ctx.moveTo(-1000, y+offsetY); ctx.lineTo(WORLD_SIZE+1000, y+offsetY); ctx.stroke();
    }

    // 4. Update & Draw Flowers
    let bloomedCount = 0;
    flowersRef.current.forEach(flower => {
        // Culling
        if (flower.x + offsetX < -100 || flower.x + offsetX > canvas.width+100 ||
            flower.y + offsetY < -100 || flower.y + offsetY > canvas.height+100) return;

        // Logic: Check proximity to ME
        const distToMe = Math.hypot(state.x - flower.x, state.y - flower.y);
        let myInfluence = 0;
        
        // Logic: Check proximity to OTHERS
        let nearbyPlayers = 0;
        if (distToMe < (flower.isGiant ? 150 : 80)) {
            nearbyPlayers++;
            myInfluence = 1;
        }

        Object.values(otherPlayers).forEach(p => {
            const dist = Math.hypot(p.x - flower.x, p.y - flower.y);
            if (dist < (flower.isGiant ? 150 : 80)) nearbyPlayers++;
        });

        // Blooming Logic
        let growSpeed = 0;
        if (flower.isGiant) {
            // Giant flowers ONLY grow if 2+ players are near
            if (nearbyPlayers >= 2) growSpeed = 2.0; 
            else if (nearbyPlayers === 1 && flower.bloomLevel < 30) growSpeed = 0.5; // Tease a little bit
            else if (nearbyPlayers === 0) growSpeed = -0.5; // Decay if ignored
        } else {
            // Small flowers grow easily
            if (nearbyPlayers >= 1) growSpeed = 3.0;
        }

        flower.bloomLevel = Math.max(0, Math.min(100, flower.bloomLevel + growSpeed));
        if (flower.bloomLevel >= 100) flower.bloomed = true;
        if (flower.bloomed) bloomedCount++;

        // Draw Flower
        const size = flower.isGiant ? 80 : 20;
        const currentSize = size * (0.2 + 0.8 * (flower.bloomLevel / 100));
        
        ctx.save();
        ctx.translate(flower.x + offsetX, flower.y + offsetY);
        
        // Glow if growing
        if (growSpeed > 0 && !flower.bloomed) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'white';
        }

        // Petals
        if (flower.bloomLevel > 10) {
            ctx.fillStyle = `hsla(${flower.hue}, ${flower.bloomLevel}%, 60%, ${flower.bloomLevel/100})`;
            const petals = flower.isGiant ? 12 : 5;
            for(let i=0; i<petals; i++) {
                ctx.rotate((Math.PI * 2) / petals);
                ctx.beginPath();
                ctx.ellipse(0, currentSize/2, currentSize/4, currentSize, 0, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        // Center
        ctx.beginPath();
        ctx.arc(0, 0, currentSize/3, 0, Math.PI*2);
        ctx.fillStyle = flower.bloomed ? '#fbbf24' : '#4b5563'; // Gold if bloomed, Grey if dead
        ctx.fill();

        // Lock Icon for Giant Flowers
        if (flower.isGiant && !flower.bloomed) {
            ctx.fillStyle = 'white';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            if (nearbyPlayers === 0) ctx.fillText("Trenger 2", 0, 5);
            else if (nearbyPlayers === 1) ctx.fillText("En til!", 0, 5);
        }

        ctx.restore();

        // Connection Line (Visual Magic)
        if (flower.isGiant && nearbyPlayers >= 2 && !flower.bloomed) {
            // Draw lines from flower to players to show "energy"
            ctx.beginPath();
            ctx.moveTo(flower.x + offsetX, flower.y + offsetY);
            ctx.lineTo(canvas.width/2, canvas.height/2); // To me
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });

    setFlowersBloomed(bloomedCount);

    // 5. Draw Other Players
    Object.values(otherPlayers).forEach(p => {
        const px = p.x + offsetX;
        const py = p.y + offsetY;
        
        // Aura
        ctx.beginPath();
        ctx.arc(px, py, 20, 0, Math.PI*2);
        ctx.fillStyle = p.color || '#ccc';
        ctx.globalAlpha = 0.6;
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Name
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, px, py - 25);
    });

    // 6. Draw Self
    ctx.beginPath();
    ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2);
    ctx.fillStyle = state.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = state.color;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Joystick
    if(joystick.current.active) {
        ctx.beginPath();
        ctx.arc(joystick.current.currX, joystick.current.currY, 30, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fill();
    }

    requestRef.current = requestAnimationFrame(animate);
  };

  useEffect(() => {
    requestRef.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(requestRef.current);
  }, [otherPlayers]);

  // --- Input ---
  const handleInput = (type, x, y) => {
      if (type === 'start') {
          joystick.current.active = true;
          joystick.current.originX = x; joystick.current.originY = y;
          joystick.current.currX = x; joystick.current.currY = y;
      } else if (type === 'move' && joystick.current.active) {
          const dx = x - joystick.current.originX;
          const dy = y - joystick.current.originY;
          const dist = Math.hypot(dx, dy);
          const max = 60;
          const clamp = Math.min(dist, max);
          const angle = Math.atan2(dy, dx);
          
          joystick.current.currX = joystick.current.originX + Math.cos(angle) * clamp;
          joystick.current.currY = joystick.current.originY + Math.sin(angle) * clamp;
          joystick.current.dx = Math.cos(angle) * (clamp/max);
          joystick.current.dy = Math.sin(angle) * (clamp/max);
      } else if (type === 'end') {
          joystick.current.active = false;
          joystick.current.dx = 0; joystick.current.dy = 0;
      }
  };

  const sendMessage = async (e) => {
    e.preventDefault();
    if (!inputText.trim()) return;
    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'garden_chat'), {
      text: inputText, senderId: user.uid, senderName: gameState.current.name, createdAt: serverTimestamp()
    });
    setInputText("");
  };

  if (!user) return <div className="h-screen bg-gray-900 text-white flex items-center justify-center">Går inn i hagen...</div>;

  return (
    <div className="fixed inset-0 bg-gray-900 overflow-hidden select-none font-sans">
        <canvas 
            ref={canvasRef}
            className="absolute inset-0"
            onTouchStart={e => handleInput('start', e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={e => handleInput('move', e.touches[0].clientX, e.touches[0].clientY)}
            onTouchEnd={() => handleInput('end')}
            onMouseDown={e => handleInput('start', e.clientX, e.clientY)}
            onMouseMove={e => handleInput('move', e.clientX, e.clientY)}
            onMouseUp={() => handleInput('end')}
        />

        {/* HUD */}
        <div className="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/50 to-transparent pointer-events-none flex justify-between items-start">
             <div>
                 <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">Neon Hagen</h1>
                 <p className="text-white/60 text-xs">Få verden til å blomstre sammen</p>
             </div>
             <div className="flex gap-2 pointer-events-auto">
                 <button onClick={() => setShowGlobalChat(!showGlobalChat)} className="bg-white/10 backdrop-blur p-3 rounded-full text-white">
                     <MessageCircle size={20} />
                 </button>
             </div>
        </div>

        {/* Progress */}
        <div className="absolute bottom-24 left-6 right-6 pointer-events-none">
            <div className="flex justify-between text-xs text-white mb-1 font-bold">
                <span>Hagens Liv</span>
                <span>{flowersBloomed} / {flowersRef.current.length}</span>
            </div>
            <div className="h-2 bg-gray-700 rounded-full overflow-hidden">
                <div 
                    className="h-full bg-gradient-to-r from-green-400 to-pink-500 transition-all duration-500"
                    style={{width: `${(flowersBloomed / flowersRef.current.length) * 100}%`}}
                ></div>
            </div>
        </div>

        {/* Controls */}
        <div className="absolute bottom-6 right-6 pointer-events-auto">
            <button 
                onClick={() => setIsMicOn(!isMicOn)}
                className={`w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-all ${isMicOn ? 'bg-green-500 text-white' : 'bg-white/10 backdrop-blur text-gray-300'}`}
            >
                {isMicOn ? <Mic size={24} /> : <MicOff size={24} />}
            </button>
        </div>

        {/* Hint for Giant Flowers */}
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none text-center">
             {flowersRef.current.some(f => f.isGiant && !f.bloomed && Math.hypot(gameState.current.x - f.x, gameState.current.y - f.y) < 150) && (
                 <div className="animate-bounce bg-black/60 backdrop-blur px-4 py-2 rounded-xl border border-pink-500 text-pink-300 text-sm font-bold">
                     <div className="flex items-center gap-2 justify-center">
                         <Sparkles size={16} />
                         Gigant-blomst!
                     </div>
                     <span className="text-white/80 text-xs font-normal">Finn en partner for å åpne den.</span>
                 </div>
             )}
        </div>

        {/* Chat Overlay */}
        {showGlobalChat && (
            <div className="absolute inset-0 bg-black/80 z-50 flex flex-col pointer-events-auto p-4">
                <div className="flex-1 bg-gray-800 rounded-xl overflow-hidden flex flex-col max-w-md mx-auto w-full border border-gray-700">
                    <div className="p-4 bg-gray-900 flex justify-between items-center border-b border-gray-700">
                        <span className="text-white font-bold">Gartner Prat</span>
                        <button onClick={() => setShowGlobalChat(false)}><X className="text-gray-400" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                         {messages.map(m => (
                             <div key={m.id} className="text-sm">
                                 <span className="text-pink-400 font-bold text-xs block">{m.senderName}</span>
                                 <span className="text-gray-200">{m.text}</span>
                             </div>
                         ))}
                    </div>
                    <form onSubmit={sendMessage} className="p-3 bg-gray-900 flex gap-2">
                        <input value={inputText} onChange={e=>setInputText(e.target.value)} className="flex-1 bg-gray-800 rounded-full px-4 text-white text-sm outline-none border border-gray-700 focus:border-pink-500" placeholder="Skriv melding..." />
                        <button className="bg-pink-600 text-white p-2 rounded-full"><Send size={16}/></button>
                    </form>
                </div>
            </div>
        )}
    </div>
  );
}

/* ================= MOUNT ================= */
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(NeonGarden));
</script>
</body>
</html>
