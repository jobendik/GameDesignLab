<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141110">
<title>GameDesignLab — a browser arcade</title>
<meta name="description" content="GameDesignLab is a browser-native arcade: standalone games plus two phone-first minigame collections. Instant play, no installs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffb347'/%3E%3Cpath d='M12.5 9.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L14 8.74a1 1 0 0 0-1.5.86z' fill='%23221503'/%3E%3Ccircle cx='7.6' cy='16' r='2' fill='%23221503'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#141110; --bg-2:#1a1614; --surface:#211c19; --surface-2:#2b2521; --surface-3:#3a322c;
  --line:rgba(255,236,214,.09); --line-2:rgba(255,236,214,.18);
  --ink:#f7f2ea; --ink-2:#d2c8bb; --ink-3:#a89d90;
  --accent:#ffb347; --accent-hi:#ffc670; --accent-ink:#221503; --accent-2:#6fdcc9;
  --r:14px; --r-sm:10px; --pad:clamp(16px,3.2vw,44px); --body-h:7.3rem;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;font:400 1rem/1.45 var(--font);color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(1100px 420px at 18% -80px,rgba(255,179,71,.085),transparent 70%),radial-gradient(900px 380px at 96% -60px,rgba(111,220,201,.05),transparent 70%);background-repeat:no-repeat}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
svg.i.solid{fill:currentColor;stroke:none}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:10px}
.wrap{max-width:1480px;margin:0 auto;padding-inline:var(--pad)}
.cq{container-type:inline-size}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:clamp(10px,2vw,22px);height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:1.12rem;letter-spacing:-.02em;font-weight:500;color:var(--ink);border-radius:10px;flex:none;min-height:44px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-weight:800}
.brand i{font-style:normal;color:var(--accent);font-weight:800}
.search{position:relative;flex:1;max-width:560px;margin-inline:auto}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 44px 0 42px;font-size:1rem;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3);opacity:1}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:hover{border-color:rgba(255,236,214,.3)}
.search input:focus-visible{outline-offset:0;border-color:transparent}
.search kbd{position:absolute;right:13px;top:50%;translate:0 -50%;font:600 .78rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:4px 7px;pointer-events:none}
.search .clr{position:absolute;right:2px;top:0;width:44px;height:44px;border:0;background:none;color:var(--ink-2);border-radius:999px;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:650;font-size:.95rem;text-decoration:none;white-space:nowrap;transition:background .14s,border-color .14s,transform .14s var(--ease)}
.btn:hover{background:var(--surface-2);border-color:rgba(255,236,214,.3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:750}
.btn.primary:hover{background:var(--accent-hi)}
.btn.primary:focus-visible{outline-color:var(--ink)}
.btn.quiet{background:none}
#lucky{flex:none}

/* ---------- section scaffolding ---------- */
main{padding-block:clamp(16px,2.4vw,28px) 56px}
section{margin-top:clamp(26px,3.4vw,44px)}
#home>section:first-child,main>section:first-child{margin-top:0}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;min-height:36px}
.head h2{font-size:clamp(1.15rem,1.2vw + .8rem,1.5rem);letter-spacing:-.02em;font-weight:780;line-height:1.2}
.head .sub{color:var(--ink-3);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head h2{white-space:nowrap}
@media (max-width:520px){.head .sub{display:none}}
.head .nav{margin-left:auto;display:flex;gap:6px;align-self:center}
.rb{width:36px;height:36px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);padding:0}
.rb:hover{background:var(--surface-2);color:var(--ink)}
.rb:disabled{opacity:.35;cursor:default}

/* ---------- grid + rail (shared mosaic maths) ---------- */
.grid,.rail{--cols:2;--wcols:1;--gap:12px;
  --cw:calc((100cqw - (var(--cols) - 1)*var(--gap))/var(--cols));
  --ww:calc((100cqw - (var(--wcols) - 1)*var(--gap))/var(--wcols))}
@container (min-width:480px){.grid,.rail{--cols:3;--wcols:2}}
@container (min-width:660px){.grid,.rail{--cols:4;--wcols:2;--gap:16px}}
@container (min-width:860px){.grid,.rail{--cols:5;--wcols:3;--gap:16px}}
@container (min-width:1060px){.grid,.rail{--cols:6;--wcols:3;--gap:18px}}
@container (min-width:1260px){.grid,.rail{--cols:7;--wcols:4;--gap:18px}}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:calc(var(--cw)*1.45 + var(--body-h));grid-auto-flow:dense}
.grid.wide{grid-template-columns:repeat(var(--wcols),minmax(0,1fr));grid-auto-rows:calc(var(--ww)/1.6 + var(--body-h))}
.grid.wide .card.l{grid-column:auto}
.rail{--rw:calc(var(--cw)*.88);display:grid;gap:var(--gap);grid-auto-flow:column;grid-auto-columns:var(--rw);grid-template-rows:calc(var(--rw)*1.45 + var(--body-h));
  overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;
  margin:-8px calc(var(--pad)*-1);padding:8px var(--pad);scroll-padding-inline:var(--pad)}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}

/* ---------- card ---------- */
.card{position:relative;display:flex;min-width:0;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--line);
  content-visibility:auto;contain-intrinsic-size:auto 180px auto 340px;transition:transform .16s var(--ease),box-shadow .16s,background .16s}
.card.l{grid-column:span 2}
.card>a{display:flex;flex-direction:column;flex:1;min-width:0;border-radius:inherit;overflow:hidden;text-decoration:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.card>a:focus-visible{outline:none}
.card:focus-within{box-shadow:0 0 0 2.5px var(--accent)}
@supports selector(:has(a)){.card:focus-within{box-shadow:0 0 0 1px var(--line)}.card:has(:focus-visible){box-shadow:0 0 0 2.5px var(--accent),0 14px 30px -14px rgba(0,0,0,.8)}}
@media (hover:hover){.card:hover{transform:translateY(-3px);background:var(--surface-2);box-shadow:0 0 0 1px var(--line-2),0 16px 32px -16px rgba(0,0,0,.85)}}
.card:active{transform:scale(.985)}
.thumb{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(155deg,hsl(var(--h,30) 34% 30%),hsl(var(--h2,60) 40% 14%));display:block}
.thumb img,.thumb .pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .pv{inset:auto;left:50%;top:50%;translate:-50% -50%;background-repeat:no-repeat;background-size:400% 100%;animation:pv 2.8s steps(4,jump-none) infinite;opacity:0;transition:opacity .2s}
.thumb .pv.on{opacity:1}
@keyframes pv{from{background-position:0 0}to{background-position:100% 0}}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.ph svg{position:absolute;inset:0;width:100%;height:100%}
.ph b{position:relative;font-weight:850;font-size:clamp(1.6rem,3cqw + 1rem,2.6rem);letter-spacing:.04em;color:rgba(255,255,255,.9);text-shadow:0 2px 14px rgba(0,0,0,.25)}
.tag{position:absolute;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;background:rgba(18,14,12,.82);color:var(--ink);font-size:.76rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tag svg{width:12px;height:12px}
.tag.q{left:8px;top:8px}.tag.q svg{color:var(--accent)}
.body{height:var(--body-h);padding:.6rem .75rem .6rem;display:flex;flex-direction:column;min-width:0}
.body .gn{font-size:.72rem;font-weight:650;letter-spacing:.02em;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body h3{margin-top:.1rem;font-size:.97rem;font-weight:720;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body p{margin-top:.12rem;font-size:.8rem;line-height:1.38;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--ink-3);min-width:0;min-height:1.1rem}
.meta .ct{display:flex;gap:6px;flex:none}
.meta .ct svg{width:15px;height:15px}
.meta .pb{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--accent-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .pb svg{width:13px;height:13px}
.fav{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:0 var(--r) 0 var(--r)}
.fav span{width:30px;height:30px;border-radius:999px;background:rgba(18,14,12,.78);display:grid;place-items:center;color:var(--ink);transition:transform .16s var(--ease),background .14s,color .14s}
.fav svg{width:16px;height:16px}
.fav:hover span{background:rgba(18,14,12,.95);transform:scale(1.1)}
.fav[aria-pressed=true] span{color:var(--accent)}
.fav[aria-pressed=true] svg{fill:currentColor}
.fav:focus-visible{outline:none}.fav:focus-visible span{outline:2.5px solid var(--accent);outline-offset:1px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(180deg,var(--surface),var(--bg-2));border-radius:22px;box-shadow:0 0 0 1px var(--line);padding:clamp(12px,2.2cqw,26px);display:grid;gap:clamp(14px,2.2cqw,28px);grid-template-columns:minmax(0,1fr);grid-template-areas:"shot" "copy" "picks"}
.shot{grid-area:shot;position:relative;display:block;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:linear-gradient(155deg,hsl(var(--h,30) 34% 26%),hsl(var(--h2,60) 40% 12%));text-decoration:none;isolation:isolate}
.shot .bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(22px) brightness(.5) saturate(1.25);z-index:-1}
.shot .fr{position:absolute;inset:0;overflow:hidden}
.shot.p .fr{inset:5% auto 5% 50%;translate:-50% 0;height:90%;aspect-ratio:300/477;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 18px 40px -8px rgba(0,0,0,.7)}
.shot .fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .go{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.7);transition:transform .16s var(--ease)}
.shot .go svg{width:22px;height:22px;margin-left:3px}
.shot:hover .go{transform:scale(1.08)}
.copy{grid-area:copy;display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding-inline:clamp(2px,1cqw,10px)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.78rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.eyebrow span{color:var(--ink-3);letter-spacing:.06em}
.copy h2{font-size:clamp(1.6rem,3.2cqw + .7rem,3.1rem);line-height:1.06;letter-spacing:-.03em;font-weight:820;margin-top:.5rem;text-wrap:balance;overflow-wrap:anywhere}
.copy .desc{margin-top:.7rem;color:var(--ink-2);font-size:clamp(1rem,.5cqw + .9rem,1.15rem);max-width:46ch;text-wrap:pretty}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0 0;padding:0;list-style:none;font-size:.84rem;color:var(--ink-2)}
.facts li{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:999px;background:rgba(255,236,214,.07);white-space:nowrap}
.facts .sc svg{color:var(--accent)}.facts .bs{color:var(--accent-2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.3rem}
.acts .btn.primary{min-height:50px;padding:0 26px;font-size:1.02rem}
.acts .favb[aria-pressed=true]{color:var(--accent)}.acts .favb[aria-pressed=true] svg{fill:currentColor}
.picks{grid-area:picks;display:flex;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;margin:-4px;padding:4px}
.picks::-webkit-scrollbar{display:none}
.pick{flex:1 0 148px;display:flex;align-items:center;gap:10px;min-width:0;min-height:60px;padding:6px 10px 6px 6px;border-radius:12px;border:0;background:rgba(255,236,214,.045);text-align:left;transition:background .14s}
.pick:hover{background:rgba(255,236,214,.09)}
.pick[aria-pressed=true]{background:var(--surface-3);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pick .pt{position:relative;width:48px;height:48px;border-radius:9px;overflow:hidden;flex:none;background:linear-gradient(155deg,hsl(var(--h,30) 34% 30%),hsl(var(--h2,60) 40% 14%))}
.pick .pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick .pt .ph b{font-size:1rem}
.pick .px{min-width:0;display:block}
.pick .px b{display:block;font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .px small{display:block;font-size:.76rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (min-width:700px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"copy shot" "picks picks";align-items:center}
  .copy{padding-left:clamp(6px,1.4cqw,18px)}
}
@container (min-width:1120px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(220px,.52fr);grid-template-areas:"copy shot picks";align-items:stretch}
  .copy{justify-content:center}
  .picks{flex-direction:column;overflow:visible;justify-content:space-between}
  .pick{flex:1 1 0}
}

/* ---------- library toolbar ---------- */
.filters{display:grid;gap:12px;margin-bottom:18px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-4px calc(var(--pad)*-1);padding:4px var(--pad)}
.scroller::-webkit-scrollbar{display:none}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);flex:none}
.seg button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:none;color:var(--ink-2);font-weight:650;font-size:.92rem;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .14s,color .14s}
.seg button small,.chip small{font-size:.76rem;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#1b1512}
.seg button[aria-pressed=true] small{color:#5d5146}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ink-2);font-size:.9rem;font-weight:600;white-space:nowrap;flex:none;transition:background .14s,color .14s,border-color .14s}
.chip:hover{background:var(--surface);color:var(--ink);border-color:rgba(255,236,214,.3)}
.chip[aria-pressed=true]{background:rgba(255,179,71,.14);border-color:var(--accent);color:var(--accent-hi)}
.chip[aria-pressed=true] small{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.tools .lbl{font-size:.84rem;color:var(--ink-3);margin-right:2px;white-space:nowrap}
#ctls{margin:0;padding:0;overflow:visible;align-items:center}
.sel{position:relative;display:inline-flex}
.sel select{-webkit-appearance:none;appearance:none;min-height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 38px 0 16px;font-size:.9rem;font-weight:600;cursor:pointer}
.sel select:hover{border-color:rgba(255,236,214,.3)}
.sel svg{position:absolute;right:13px;top:50%;translate:0 -50%;pointer-events:none;color:var(--ink-3)}
.sel option{background:#211c19;color:#f7f2ea}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:14px;min-height:30px;color:var(--ink-2);font-size:.92rem}
.status b{color:var(--ink);font-weight:700}
.status .link{border:0;background:none;padding:6px 2px;color:var(--accent-hi);font-weight:650;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 16px;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink-2);font-size:.92rem;margin-bottom:16px}
.note a{color:var(--accent-hi);font-weight:650;text-underline-offset:3px;white-space:nowrap}
.empty{padding:56px 20px;text-align:center;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.empty h3{font-size:1.3rem;letter-spacing:-.02em}
.empty p{color:var(--ink-2);margin:.5rem auto 1.3rem;max-width:44ch}
.empty .acts{justify-content:center;margin:0}

footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--ink-3);font-size:.86rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
footer a{color:var(--ink-2);text-underline-offset:3px;display:inline-block;padding:6px 0}
footer kbd{font:600 .76rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line-2);border-radius:5px;padding:2px 6px;color:var(--ink-2)}
footer .keys{display:flex;flex-wrap:wrap;gap:6px 16px;margin-left:auto}
@media (hover:none){footer .keys,.search kbd{display:none}}

/* ---------- surprise dialog ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:22px;width:min(440px,calc(100vw - 28px));max-height:calc(100dvh - 28px);box-shadow:0 0 0 1px var(--line-2),0 40px 80px -20px #000;overflow:auto}
dialog::backdrop{background:rgba(10,8,7,.72)}
dialog[open]{animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.dl{padding:14px}
.dl .shot{aspect-ratio:16/10}
.dl .copy{padding:14px 6px 6px}
.dl .copy h2{font-size:1.55rem}
.dl .acts{width:100%}
.dl .acts .btn.primary{flex:1}
.dl .x{position:absolute;right:8px;top:8px;z-index:2;width:44px;height:44px;border-radius:999px;border:0;background:rgba(18,14,12,.8);display:grid;place-items:center}
.roll{animation:roll .3s var(--ease)}
@keyframes roll{from{opacity:.2;transform:translateY(6px)}}

.fatal{max-width:560px;margin:14vh auto;padding:28px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.fatal h2{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:.6rem}
.fatal p{color:var(--ink-2)}.fatal code{background:var(--surface-3);padding:2px 7px;border-radius:6px;font-size:.9em;color:var(--ink)}

@media (max-width:640px){
  .brand .word{display:none}
  #lucky{width:44px;padding:0}#lucky .tx{display:none}
  .bar{height:60px}
  .tools{margin-left:0;width:100%}
  .tools .sel{margin-left:auto}
  .tools .chip{padding:0 12px}.tools .sel select{padding:0 34px 0 14px;max-width:9.5rem;text-overflow:ellipsis}
  .tools .lbl{display:none}
  .genres{flex-wrap:nowrap}
}
@media (min-width:641px){.genres{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
@view-transition{navigation:auto}
::view-transition-group(root){animation-duration:.16s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .card:hover,.btn:active,.card:active{transform:none}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var icon = function (n, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; };

var CAT = window.GDL_CATALOG;
if (!CAT || !Array.isArray(CAT.games) || !CAT.games.length) {
  $('#main').innerHTML = '<div class="fatal" role="alert"><h2>The game catalog didn’t load</h2><p>This page builds itself from <code>catalog.js</code>, which is missing or empty. Regenerate it with <code>node tools/build-catalog.js</code> and reload.</p></div>';
  $('#searchform').hidden = true; $('#lucky').hidden = true;
  return;
}

/* ------------------------------------------------------------------ storage (never throws) */
var store = (function () {
  var mem = {}, ls = null;
  try { ls = window.localStorage; ls.getItem('gdl:favs'); } catch (e) { ls = null; }
  return {
    get: function (k, d) { if (k in mem) return mem[k]; if (!ls) return d; try { var v = ls.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { if (ls) { try { ls.setItem(k, JSON.stringify(v)); delete mem[k]; return; } catch (e) { } } mem[k] = v; }
  };
})();
var session = { get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } } };

/* ------------------------------------------------------------------ data model (everything derives from the catalog) */
var COLL = {
  arcade: { name: 'Arcade', blurb: function (n) { return n + ' standalone games — bigger ideas with room to breathe on a full screen.'; } },
  PhoneGameLab: { name: 'Phone Game Lab', home: 'PhoneGameLab/index.html', blurb: function (n) { return n + ' phone-first takes on classic genres, built for one thumb.'; } },
  PhoneGameLab2: { name: 'Pocket Pals', home: 'PhoneGameLab2/index.html', blurb: function (n) { return n + ' cozy, character-driven minigames with an original mascot cast.'; } }
};
var CTL = { touch: 'Touch', mouse: 'Mouse', keyboard: 'Keyboard', gamepad: 'Gamepad' };
var collName = function (c) { return (COLL[c] && COLL[c].name) || c; };
var ctlName = function (c) { return CTL[c] || (c.charAt(0).toUpperCase() + c.slice(1)); };
function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function norm(s) { s = String(s || '').toLowerCase(); if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); return s.replace(/[^a-z0-9.]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function plural(n, w) { return n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's'); }
function fmt(n) { return Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : (Math.round(n * 100) / 100).toLocaleString(); }

var seen = {}, tagLabel = {};
var games = CAT.games.filter(function (g) { return g && typeof g.id === 'string' && g.path && !seen[g.id] && (seen[g.id] = 1); }).map(function (g) {
  var genre = Array.isArray(g.genre) ? g.genre.filter(Boolean).map(String) : [], controls = Array.isArray(g.controls) ? g.controls.map(String) : [];
  var tags = [];
  genre.forEach(function (x) { x.split(/\s*(?:&|\/|,|\+)\s*/).forEach(function (t) { t = t.trim(); var k = norm(t); if (k && tags.indexOf(k) < 0) { tags.push(k); if (!tagLabel[k]) tagLabel[k] = t; } }); });
  var title = String(g.title || g.id.split('/').pop()), ntitle = norm(title), h = hash(g.id);
  var arcade = g.collection === 'arcade';
  return {
    id: g.id, path: g.path, collection: String(g.collection || 'arcade'), title: title, desc: String(g.desc || ''), genre: genre, tags: tags, controls: controls,
    score: typeof g.score === 'number' && g.score > 0 ? g.score : 0, fresh: !!g.v2 || g.status === 'transformed', thumb: g.thumb || '', strip: g.strip || '',
    portrait: !arcade, h: h, hue: h % 360, hue2: (h % 360 + 28 + (h >>> 9) % 70) % 360,
    href: arcade ? 'play.html?g=' + encodeURIComponent(g.id).replace(/%2F/gi, '/') : g.path,
    ntitle: ntitle, twords: ntitle.split(' '), ntags: norm(genre.join(' ') + ' ' + collName(g.collection)), ndesc: norm(g.desc),
    words: (ntitle + ' ' + norm(genre.join(' ')) + ' ' + norm(g.desc)).split(' ').filter(function (w) { return w.length > 2; })
  };
});
var byId = {}; games.forEach(function (g) { byId[g.id] = g; });
var collections = []; games.forEach(function (g) { if (collections.indexOf(g.collection) < 0) collections.push(g.collection); });
var ctlKinds = []; games.forEach(function (g) { g.controls.forEach(function (c) { if (ctlKinds.indexOf(c) < 0) ctlKinds.push(c); }); });
ctlKinds.sort(function (a, b) { var o = ['touch', 'mouse', 'keyboard', 'gamepad']; return (o.indexOf(a) + 9) % 9 - (o.indexOf(b) + 9) % 9; });
/* a control kind that (almost) every game supports is not a useful filter → its chip only appears when deep-linked */
var ctlMinor = {}; ctlKinds.forEach(function (c) { ctlMinor[c] = games.filter(function (g) { return g.controls.indexOf(c) >= 0; }).length > games.length * .97; });
/* "featured" order: reviewed score first, then rebuilt games, then games with real thumbnails, then a stable shuffle that mixes the collections */
games.slice().sort(function (a, b) { return b.score - a.score || (b.fresh - a.fresh) || (!!b.thumb - !!a.thumb) || a.h - b.h; }).forEach(function (g, i) { g.rank = i; });

/* ------------------------------------------------------------------ player data */
var P = { favs: [], recent: [], plays: {}, best: {} };
function loadPersonal() {
  var f = store.get('gdl:favs', []), r = store.get('gdl:recent', []), pl = store.get('gdl:plays', {});
  P.favs = (Array.isArray(f) ? f : []).filter(function (x) { return typeof x === 'string'; });
  P.recent = (Array.isArray(r) ? r : []).filter(function (x) { return typeof x === 'string'; });
  P.plays = pl && typeof pl === 'object' ? pl : {};
  P.best = {};
  games.forEach(function (g) { var b = store.get('gdl:best:' + g.id, null); if (typeof b === 'number' && isFinite(b)) P.best[g.id] = b; });
}
var isFav = function (id) { return P.favs.indexOf(id) >= 0; };

/* ------------------------------------------------------------------ rendering helpers */
function placeholder(g) {
  var h = g.h, m = (h >>> 5) % 5, a = 20 + (h >>> 8) % 60, b = 20 + (h >>> 14) % 60, s = '', i;
  if (m === 0) for (i = 1; i < 5; i++) s += '<circle cx="' + a + '" cy="' + b + '" r="' + i * 17 + '" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="7"/>';
  else if (m === 1) for (i = -2; i < 6; i++) s += '<rect x="' + (i * 26 + a % 20) + '" y="-40" width="11" height="180" fill="#fff" fill-opacity=".08" transform="rotate(' + (20 + b % 30) + ' 50 50)"/>';
  else if (m === 2) for (i = 0; i < 36; i++) s += '<circle cx="' + (i % 6 * 18 + 5) + '" cy="' + ((i / 6 | 0) * 18 + 5) + '" r="' + (2 + (h >>> (i % 20)) % 4) + '" fill="#fff" fill-opacity=".11"/>';
  else if (m === 3) s = '<circle cx="' + a + '" cy="' + (b * .6) + '" r="34" fill="#fff" fill-opacity=".09"/><circle cx="' + (100 - a * .7) + '" cy="' + (60 + b * .4) + '" r="26" fill="#fff" fill-opacity=".07"/><circle cx="' + b + '" cy="92" r="16" fill="#000" fill-opacity=".14"/>';
  else for (i = 0; i < 5; i++) s += '<path d="M-10 ' + (i * 24 + b % 20) + ' l20 -12 20 12 20 -12 20 12 20 -12 20 12" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="5" stroke-linejoin="round"/>';
  var w = g.title.replace(/[^A-Za-z0-9À-ÿ ]+/g, ' ').trim().split(/\s+/).filter(Boolean), ini = (w.length > 1 ? w[0].charAt(0) + w[1].charAt(0) : (w[0] || '?').slice(0, 2)).toUpperCase();
  return '<span class="ph" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">' + s + '</svg><b>' + esc(ini) + '</b></span>';
}
function shotImg(g, eager, alt) {
  if (!g.thumb) return placeholder(g);
  return '<img src="' + esc(g.thumb) + '" alt="' + esc(alt == null ? g.title + ' — gameplay screenshot' : alt) + '" width="' + (g.portrait ? 300 : 480) + '" height="' + (g.portrait ? 477 : 300) + '" decoding="async"' + (eager ? '' : ' loading="lazy"') + '>';
}
var hues = function (g) { return ' style="--h:' + g.hue + ';--h2:' + g.hue2 + '"'; };
function ctlIcons(g) { return g.controls.map(function (c) { return '<svg class="i" role="img" aria-label="' + esc(ctlName(c)) + '"><title>' + esc(ctlName(c)) + '</title><use href="#i-' + (CTL[c] ? c : 'gamepad') + '"/></svg>'; }).join(''); }
function favLabel(g) { return (isFav(g.id) ? 'Remove ' : 'Add ') + g.title + (isFav(g.id) ? ' from favorites' : ' to favorites'); }
function cardHTML(g) {
  var best = P.best[g.id];
  return '<article class="card ' + (g.portrait ? 'p' : 'l') + '" data-id="' + esc(g.id) + '">' +
    '<a href="' + esc(g.href) + '" title="' + esc(g.title + (g.desc ? ' — ' + g.desc : '')) + '">' +
      '<span class="thumb"' + hues(g) + '>' + shotImg(g) +
        (g.score ? '<span class="tag q" title="Reviewed quality: ' + g.score + ' out of 10">' + icon('star', 'solid') + '<span class="sr">Reviewed quality </span>' + g.score + '<span class="sr"> out of 10</span></span>' : '') +
      '</span>' +
      '<span class="body"><span class="gn">' + esc(g.genre.join(' · ') || collName(g.collection)) + '</span><h3>' + esc(g.title) + '</h3><p>' + esc(g.desc) + '</p>' +
        '<span class="meta"><span class="ct">' + ctlIcons(g) + '</span>' +
        '<span class="pb"' + (best == null ? ' hidden' : '') + ' title="Your personal best">' + icon('trophy') + '<span class="sr">Your best </span><span class="pbv">' + (best == null ? '' : fmt(best)) + '</span></span></span></span>' +
    '</a>' +
    '<button class="fav" type="button" tabindex="-1" data-fav="' + esc(g.id) + '" aria-pressed="' + isFav(g.id) + '" aria-keyshortcuts="f" aria-label="' + esc(favLabel(g)) + '"><span>' + icon('heart') + '</span></button>' +
  '</article>';
}
function spotlightHTML(g, eyebrow, headingId) {
  var best = P.best[g.id], plays = +P.plays[g.id] || 0;
  return '<a class="shot ' + (g.portrait ? 'p' : 'l') + '" href="' + esc(g.href) + '" tabindex="-1" aria-hidden="true"' + hues(g) + '>' +
      (g.thumb && g.portrait ? '<img class="bg" src="' + esc(g.thumb) + '" alt="" decoding="async">' : '') +
      '<span class="fr">' + shotImg(g, true, '') + '</span><span class="go">' + icon('play', 'solid') + '</span></a>' +
    '<div class="copy">' +
      '<p class="eyebrow">' + esc(eyebrow) + '<span>' + esc(collName(g.collection)) + '</span></p>' +
      '<h2' + (headingId ? ' id="' + headingId + '"' : '') + '>' + esc(g.title) + '</h2>' +
      (g.desc ? '<p class="desc">' + esc(g.desc) + '</p>' : '') +
      '<ul class="facts">' +
        (g.genre.length ? '<li>' + esc(g.genre.join(' · ')) + '</li>' : '') +
        (g.controls.length ? '<li>' + ctlIcons(g) + '<span class="sr">Plays with ' + esc(g.controls.map(ctlName).join(', ')) + '</span></li>' : '') +
        (g.score ? '<li class="sc" title="Reviewed quality score">' + icon('star', 'solid') + g.score + '/10 reviewed</li>' : '') +
        (best != null ? '<li class="bs">' + icon('trophy') + 'Your best ' + fmt(best) + '</li>' : '') +
        (plays > 0 ? '<li>Played ' + plural(plays, 'time') + '</li>' : '') +
      '</ul>' +
      '<div class="acts"><a class="btn primary" data-play href="' + esc(g.href) + '">' + icon('play', 'solid') + 'Play now</a>' +
        '<button class="btn favb" type="button" data-fav="' + esc(g.id) + '" aria-pressed="' + isFav(g.id) + '" aria-label="' + esc(favLabel(g)) + '">' + icon('heart') + '<span aria-hidden="true">' + (isFav(g.id) ? 'Favorited' : 'Favorite') + '</span></button>' +
        '<span data-extra></span></div>' +
    '</div>';
}

/* ------------------------------------------------------------------ featured (curated from review scores; unreviewed slots rotate daily) */
var day = Math.floor(Date.now() / 864e5), picks = [], pickAt = 0;
function buildPicks() {
  var scored = games.filter(function (g) { return g.score; }).sort(function (a, b) { return b.score - a.score || (hash(a.id + day) - hash(b.id + day)); });
  picks = scored.slice(0, 5).map(function (g) { return { g: g, why: 'Top rated' }; });
  if (picks.length < 5) {
    var rest = games.filter(function (g) { return !g.score; }).sort(function (a, b) { return (b.fresh - a.fresh) || (!!b.thumb - !!a.thumb) || (hash(a.id + day) - hash(b.id + day)); });
    var usedColl = {};
    picks.forEach(function (p) { usedColl[p.g.collection] = (usedColl[p.g.collection] || 0) + 1; });
    for (var pass = 0; pass < 2 && picks.length < 5; pass++) rest.forEach(function (g) {
      if (picks.length >= 5 || picks.some(function (p) { return p.g === g; })) return;
      if (pass === 0 && (usedColl[g.collection] || 0) >= 2) return;           // keep the spotlight varied across collections
      usedColl[g.collection] = (usedColl[g.collection] || 0) + 1; picks.push({ g: g, why: g.fresh ? 'Fresh from the lab' : 'Today’s pick' });
    });
  }
}
function renderHero() {
  var sec = $('#featured'); if (!picks.length) { sec.hidden = true; return; }
  pickAt = Math.min(pickAt, picks.length - 1);
  var p = picks[pickAt];
