<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Burst - Dopamine Rush</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            touch-action: none; /* Prevents mobile scrolling/zooming */
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ff00ff;
            animation: pulse 1s infinite alternate;
        }
        p { font-size: 1.2rem; margin-bottom: 30px;}
        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.9); }
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px #ff00ff; }
            100% { transform: scale(1.1); text-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff; }
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1>Neon Burst</h1>
        <p>Tap the orbs. Build the combo. Don't stop.</p>
        <button id="startBtn">TAP TO PLAY</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');

        let width, height;
        let isPlaying = false;
        
        // Game State
        let score = 0;
        let combo = 1;
        let comboTimer = 100; // Drops to 0
        let shake = 0;
        let flashAlpha = 0;

        // Entities
        let targets = [];
        let particles = [];
        let texts = [];

        // Audio Context for synthetic dopamine hits
        let audioCtx;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                // Pitch goes up with combo for ultimate satisfaction
                osc.frequency.setValueAtTime(400 + (combo * 50), audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800 + (combo * 50), audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        class Target {
            constructor() {
                this.r = Math.random() * 20 + 30; // 30 to 50
                this.x = Math.random() * (width - this.r * 2) + this.r;
                this.y = Math.random() * (height - this.r * 2) + this.r;
                this.hue = Math.random() * 360;
                this.life = 100; // Decreases over time
                this.maxLife = 100;
                this.scale = 0;
            }
            update() {
                this.life -= 0.5 + (score / 10000); // gets faster
                if (this.scale < 1) this.scale += 0.1;
                return this.life > 0;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                
                // Pulsing effect
                let pulse = 1 + Math.sin(Date.now() / 100) * 0.1;
                ctx.scale(pulse, pulse);

                ctx.beginPath();
                ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.shadowBlur = 20;
                ctx.fill();
                
                // Inner core
                ctx.beginPath();
                ctx.arc(0, 0, this.r * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue + (Math.random() * 40 - 20); // Slight hue variation
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 15 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.r = Math.random() * 6 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.gravity = 0.2;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95; // friction
                this.vy *= 0.95;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color, size) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.size = size;
                this.alpha = 1;
                this.vy = -3;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
                return this.alpha > 0;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = `bold ${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnTarget() {
            if (targets.length < 5 + Math.floor(score / 5000)) {
                targets.push(new Target());
            }
            let nextSpawn = 1000 - (score / 100);
            setTimeout(spawnTarget, Math.max(nextSpawn, 200));
        }

        function explode(x, y, hue) {
            let count = 30 + (combo * 5); // More particles for higher combo!
            if (count > 100) count = 100; // Cap to save performance
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, hue));
            }
        }

        // Input Handling
        function handleInput(x, y) {
            if (!isPlaying) return;
            
            let hit = false;
            // Iterate backwards to click the top-most target
            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let dist = Math.hypot(t.x - x, t.y - y);
                
                if (dist < t.r + 20) { // +20 for generous mobile hitboxes
                    hit = true;
                    
                    // The Juice!
                    explode(t.x, t.y, t.hue);
                    playSound('hit');
                    shake = Math.min(shake + 5 + (combo), 30);
                    
                    // Score & Combo
                    let points = 100 * combo;
                    score += points;
                    combo++;
                    comboTimer = 100;
                    flashAlpha = 0.3; // Screen flash
                    
                    // Visual feedback
                    texts.push(new FloatingText(t.x, t.y, `+${points}`, `hsl(${t.hue}, 100%, 70%)`, 30 + combo * 2));
                    if (combo % 5 === 0) {
                        texts.push(new FloatingText(width/2, height/2, `${combo}x COMBO!`, '#fff', 50));
                    }

                    targets.splice(i, 1);
                    break; 
                }
            }

            if (!hit) {
                // Punishment for missing
                combo = 1;
                playSound('miss');
                texts.push(new FloatingText(x, y, "MISS", "#ff0000", 20));
            }
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                handleInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, {passive: false});

        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.style.display = 'none';
            isPlaying = true;
            score = 0;
            combo = 1;
            targets = [];
            particles = [];
            texts = [];
            spawnTarget();
            gameLoop();
        });

        // Main Loop
        function gameLoop() {
            if (!isPlaying) return;
            requestAnimationFrame(gameLoop);

            // Screen Shake calculation
            let dx = (Math.random() - 0.5) * shake;
            let dy = (Math.random() - 0.5) * shake;
            if (shake > 0) shake *= 0.9; // decay shake

            ctx.save();
            ctx.translate(dx, dy);

            // Clear screen with trail effect
            ctx.fillStyle = `rgba(5, 5, 5, 0.2)`; 
            ctx.fillRect(0, 0, width, height);

            // Flash effect for high combos
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, width, height);
                flashAlpha -= 0.05;
            }

            // Update & Draw Targets
            for (let i = targets.length - 1; i >= 0; i--) {
                if (!targets[i].update()) {
                    targets.splice(i, 1);
                    combo = 1; // Dropped a target, lose combo
                    playSound('miss');
                    shake = 10;
                    flashAlpha = 0.2;
                    ctx.fillStyle = "rgba(255,0,0,0.3)"; // Red flash on miss
                    ctx.fillRect(0,0,width,height);
                } else {
                    targets[i].draw();
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }

            // Update & Draw Texts
            for (let i = texts.length - 1; i >= 0; i--) {
                if (!texts[i].update()) {
                    texts.splice(i, 1);
                } else {
                    texts[i].draw();
                }
            }

            ctx.restore(); // Undo screen shake translation

            // Draw HUD (Heads Up Display) over everything
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'left';
            ctx.font = 'bold 30px Arial';
            ctx.fillText(`SCORE: ${score}`, 20, 40);
            
            ctx.textAlign = 'right';
            ctx.fillStyle = combo > 5 ? `hsl(${Date.now()%360}, 100%, 50%)` : '#fff';
            ctx.fillText(`${combo}x`, width - 20, 40);

            // Combo Drain Bar
            if (combo > 1) {
                comboTimer -= 0.2 + (combo * 0.05);
                if (comboTimer <= 0) {
                    combo = 1; // Time ran out
                }
                ctx.fillStyle = `hsl(${Date.now()%360}, 100%, 50%)`;
                ctx.fillRect(0, height - 10, width * (comboTimer / 100), 10);
            }
        }
    </script>
</body>
</html>
