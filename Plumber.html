/* ══════════════════════════════════════════════════════════════════════

const PHYS={walk:6.2,run:10.6,jump:14.8,highJump:16.3,stomp:11.8,acc:22,airAcc:14,dec:18,coyote:.1,jumpBuf:.13,apexZone:2.7,apexGrav:.48,fallMul:1.38,lowJumpMul:2.18};
const FX={freeze:{stomp:.05,brick:.04,power:.07,dmg:.1,bounce:.04},shake:{stomp:.16,brick:.18,dmg:.24,bounce:.1}};
const WORLD_ORDER=['w1','w2','w3','w4','w5'];

const isTouch=matchMedia('(pointer:coarse)').matches || innerWidth<960;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
function hashString(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function seeded(id){return mulberry32(hashString(id));}
function fmtTime(v){return String(Math.ceil(Math.max(0,v))).padStart(3,'0');}
function rankBetter(a,b){return RANK_ORDER[a||'C']>RANK_ORDER[b||'C']?a:b;}
function pad(n,len=2){return String(n).padStart(len,'0');}

/* ══════════════════════════════════════════════════════════════════════
   2. SAVE / PROGRESSION
   ══════════════════════════════════════════════════════════════════════ */
const defaultSave=()=>({
  version:1,
  bestScore:0,
  totalCoinsLifetime:0,
  unlockedWorlds:['w1'],
  currentWorld:'w1',
  currentNode:'w1_1',
  stages:{},
  gameCompleted:false,
  started:false
});
let SAVE=defaultSave();
function loadSave(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){SAVE={...defaultSave(),...JSON.parse(raw)}}}catch(e){}
  if(!SAVE.unlockedWorlds.includes('w1'))SAVE.unlockedWorlds.unshift('w1');
  ensureStageRecord('w1_1').unlocked=true;
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
function wipeSave(){SAVE=defaultSave();ensureStageRecord('w1_1').unlocked=true;persist();}
function ensureStageRecord(id){
  if(!SAVE.stages[id])SAVE.stages[id]={unlocked:false,completed:false,normalExit:false,secretExit:false,rank:null,bestCoins:0,maxCoins:0,bestTime:0,bestScore:0,lastExit:null};
  return SAVE.stages[id];
}
function stageRecord(id){return ensureStageRecord(id)}
function unlockNode(id){if(!id)return;ensureStageRecord(id).unlocked=true;const node=NODE_INDEX[id];if(node && !SAVE.unlockedWorlds.includes(node.world)){SAVE.unlockedWorlds.push(node.world)}persist();}
function nodeUnlocked(id){return !!stageRecord(id).unlocked;}
function nodeVisible(id){const n=NODE_INDEX[id];if(!n)return false;return !n.hidden || nodeUnlocked(id) || stageRecord(id).completed;}
function worldCompletion(worldId){
  const world=WORLD_INDEX[worldId];
  const visibleStages=world.nodes.filter(n=>n.playable!==false);
  const completed=visibleStages.filter(n=>stageRecord(n.id).completed).length;
  const exitsFound=visibleStages.reduce((a,n)=>a+(stageRecord(n.id).normalExit?1:0)+(n.secretTo && stageRecord(n.id).secretExit?1:0),0);
  const exitMax=visibleStages.reduce((a,n)=>a+1+(n.secretTo?1:0),0);
  const rankable=visibleStages.filter(n=>n.kind!==NODE_TYPES.bonus || true);
  const highRanks=rankable.filter(n=>['A','S'].includes(stageRecord(n.id).rank)).length;
  return {completed,total:visibleStages.length,exitMax,exitsFound,highRanks,rankTotal:rankable.length};
}
function totalCompletionPercent(){
  const all=ALL_NODES.filter(n=>n.playable!==false);
  const done=all.filter(n=>stageRecord(n.id).completed).length;
  const exitFound=all.reduce((a,n)=>a+(stageRecord(n.id).normalExit?1:0)+(n.secretTo&&stageRecord(n.id).secretExit?1:0),0);
  const exitTotal=all.reduce((a,n)=>a+1+(n.secretTo?1:0),0);
  const ratio=((done/all.length)*.65)+((exitFound/exitTotal)*.35);
  return Math.round(ratio*100);
}

function startMusic(mode){

  const token=++musicToken;
  const worldIndex=WORLD_INDEX[G.worldId]?.index||0;
  const root=[262,220,294,247,196][worldIndex]||262;
  const pattern=(MUSIC_PATTERNS[mode]||MUSIC_PATTERNS.map0).slice();
  const tempo=mode==='title'?124:mode==='fortress'?138:mode==='victory'?150:G.mode==='map'?116:132;
  const stepDur=60000/tempo/2;
  let step=0;
  function tick(){
    if(token!==musicToken||!AC)return;
    const now=AC.currentTime;
    const note=pattern[step%pattern.length];
    const freq=root*Math.pow(2,note/12);
    const bass=root*Math.pow(2,((pattern[(step+4)%pattern.length]-12)/12));
    const o1=AC.createOscillator(),g1=AC.createGain();o1.connect(g1);g1.connect(AC.destination);o1.type=mode==='fortress'?'triangle':'square';o1.frequency.setValueAtTime(freq,now);g1.gain.setValueAtTime(mode==='map0'||G.mode==='map'?.035:.03,now);g1.gain.exponentialRampToValueAtTime(.001,now+.18);o1.start(now);o1.stop(now+.2);

function updateMapHud(){

  const comp=worldCompletion(world.id);
  const stars=(comp.completed===comp.total?1:0)+(comp.exitsFound===comp.exitMax?1:0)+(comp.highRanks===comp.rankTotal?1:0);
  el.mapWorldName.textContent=`WORLD ${world.index+1} · ${world.name.toUpperCase()}`;
  el.mapWorldMeta.innerHTML=`${world.subtitle.toUpperCase()}<br>STAGES CLEARED: ${comp.completed}/${comp.total} · EXITS: ${comp.exitsFound}/${comp.exitMax} · WORLD EMBLEMS: ${stars}/3`;

  el.mapStageName.textContent=node.name.toUpperCase();
  el.mapStageMeta.innerHTML=`TYPE: ${node.kind.toUpperCase()}<br>${locked?'STATUS: LOCKED':'STATUS: '+(rec.completed?'CLEARED':'READY')}<br>RANK: ${rec.rank||'-'} · EXITS: ${rec.normalExit?'★':'○'}${node.secretTo?(rec.secretExit?' ✦':' ◇'):''}<br>${node.secretTo?'THIS STAGE HAS A SECRET EXIT.':''}`;
}
function nodePos(node, padX, padY, scale){return {x:padX+node.x*scale, y:padY+node.y*scale};}
function drawMap(){
  if(G.mode!=='map')return;
  mapPulse+=0.016;
  const world=currentWorld();
  const nodes=world.nodes.filter(n=>nodeVisible(n.id) || n.id===world.entry);
  mapCtx.clearRect(0,0,innerWidth,innerHeight);
  const pad=34;
  const baseW=640, baseH=380;
  const scale=Math.min((innerWidth-pad*2)/baseW,(innerHeight-pad*2)/baseH);
  const offX=(innerWidth-baseW*scale)/2;
  const offY=(innerHeight-baseH*scale)/2 + 20;
  const p=world.palette;

  const bgGrad=mapCtx.createLinearGradient(0,0,0,innerHeight);
  bgGrad.addColorStop(0,p.top);bgGrad.addColorStop(.5,p.mid);bgGrad.addColorStop(1,p.bot);
  mapCtx.fillStyle=bgGrad;mapCtx.fillRect(0,0,innerWidth,innerHeight);

  drawMapDecor(world, offX, offY, scale);

  for(const path of world.paths){
    const a=NODE_INDEX[path.a], b=NODE_INDEX[path.b];
    const aVisible=nodeVisible(a.id)||a.id===world.entry, bVisible=nodeVisible(b.id)||b.id===world.entry;
    if(!aVisible || !bVisible)continue;
    const pa=nodePos(a,offX,offY,scale), pb=nodePos(b,offX,offY,scale);
    const aUnlocked=nodeUnlocked(a.id), bUnlocked=nodeUnlocked(b.id);
    mapCtx.lineWidth=path.mode==='secret'?3:6;
    mapCtx.setLineDash(path.mode==='secret'?[12,10]:[]);
    mapCtx.strokeStyle=aUnlocked&&bUnlocked?(path.mode==='secret'?'rgba(255,210,255,.95)':'rgba(255,245,180,.95)'):'rgba(255,255,255,.26)';
    mapCtx.beginPath();mapCtx.moveTo(pa.x,pa.y);mapCtx.lineTo(pb.x,pb.y);mapCtx.stroke();
    mapCtx.setLineDash([]);
  }

  for(const node of world.nodes){
    if(!(nodeVisible(node.id)||node.id===world.entry))continue;
    const rec=stageRecord(node.id);
    const unlocked=nodeUnlocked(node.id);
    const pos=nodePos(node,offX,offY,scale);
    const color=NODE_COLORS[node.kind]||'#fff';
    const pulse=1+Math.sin(mapPulse*2+hashString(node.id)%20)*.04;
    mapCtx.save();
    mapCtx.translate(pos.x,pos.y);
    mapCtx.scale(pulse,pulse);
    mapCtx.shadowBlur=unlocked?18:0;
    mapCtx.shadowColor=color;
    mapCtx.fillStyle=unlocked?color:'rgba(120,120,120,.55)';
    mapCtx.strokeStyle='rgba(0,0,0,.55)';
    mapCtx.lineWidth=3;
    drawNodeShape(node.kind, unlocked);
    mapCtx.fill();mapCtx.stroke();
    if(rec.completed){mapCtx.fillStyle='rgba(255,255,255,.96)';mapCtx.font='10px "Press Start 2P"';mapCtx.textAlign='center';mapCtx.fillText(rec.rank||'C',0,3)}
    if(node.id===G.selectedNodeId){mapCtx.strokeStyle='#ffffff';mapCtx.lineWidth=4;mapCtx.beginPath();mapCtx.arc(0,0,22,0,Math.PI*2);mapCtx.stroke();}
    if(node.id===SAVE.currentNode&&G.selectedNodeId!==SAVE.currentNode){mapCtx.strokeStyle='rgba(255,255,255,.42)';mapCtx.lineWidth=3;mapCtx.beginPath();mapCtx.arc(0,0,18,0,Math.PI*2);mapCtx.stroke();}
    mapCtx.restore();

    mapCtx.fillStyle='rgba(0,0,0,.42)';
    mapCtx.fillRect(pos.x-58,pos.y+20,116,16);
    mapCtx.fillStyle='#fff';
    mapCtx.font='8px "Press Start 2P"';
    mapCtx.textAlign='center';
    mapCtx.fillText(node.name.replace(/^\d-\d\s*/,'').toUpperCase().slice(0,18),pos.x,pos.y+31);
    if(rec.secretExit){mapCtx.fillStyle='#ffd3ff';mapCtx.fillText('SECRET',pos.x,pos.y+43)}
  }

  const cur=NODE_INDEX[SAVE.currentNode]||NODE_INDEX[world.entry];
  if((nodeVisible(cur.id)||cur.id===world.entry) && cur.world===world.id){
    const pos=nodePos(cur,offX,offY,scale);
    mapCtx.save();
    mapCtx.translate(pos.x,pos.y-30-3*Math.sin(mapPulse*3));
    mapCtx.fillStyle='#fff5a1';
    mapCtx.beginPath();mapCtx.moveTo(0,-10);mapCtx.lineTo(9,5);mapCtx.lineTo(-9,5);mapCtx.closePath();mapCtx.fill();
    mapCtx.restore();
  }
  updateMapHud();
}
function drawNodeShape(kind, unlocked){
  switch(kind){
    case'bonus': mapCtx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;const r=i%2===0?16:7;const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)mapCtx.moveTo(x,y);else mapCtx.lineTo(x,y);const a2=a+Math.PI/5;mapCtx.lineTo(Math.cos(a2)*7,Math.sin(a2)*7);}mapCtx.closePath();break;
    case'secret': mapCtx.beginPath();mapCtx.moveTo(0,-16);mapCtx.lineTo(14,0);mapCtx.lineTo(0,16);mapCtx.lineTo(-14,0);mapCtx.closePath();break;
    case'challenge': mapCtx.beginPath();mapCtx.rect(-14,-14,28,28);break;
    case'vertical': mapCtx.beginPath();mapCtx.moveTo(0,-17);mapCtx.lineTo(16,10);mapCtx.lineTo(-16,10);mapCtx.closePath();break;
    case'fortress': mapCtx.beginPath();mapCtx.rect(-18,-14,36,28);break;
    default: mapCtx.beginPath();mapCtx.arc(0,0,15,0,Math.PI*2);
  }
}
function drawMapDecor(world, offX, offY, scale){
  const p=world.palette;
  if(p.deco==='meadow'){
    mapCtx.fillStyle='rgba(255,255,255,.24)';
    for(let i=0;i<8;i++){const x=offX+(40+i*70+Math.sin(mapPulse+i)*10)*scale;const y=offY+(60+(i%3)*18)*scale;mapCtx.beginPath();mapCtx.arc(x,y,16*scale,0,Math.PI*2);mapCtx.arc(x+15*scale,y+2*scale,14*scale,0,Math.PI*2);mapCtx.arc(x-15*scale,y+3*scale,13*scale,0,Math.PI*2);mapCtx.fill();}
    mapCtx.fillStyle='rgba(62,160,72,.85)';mapCtx.fillRect(0,innerHeight-110,innerWidth,120);
  } else if(p.deco==='factory'){
    mapCtx.fillStyle='rgba(40,28,16,.6)';mapCtx.fillRect(0,innerHeight-120,innerWidth,140);
    for(let i=0;i<11;i++){const x=offX+(45+i*54)*scale;const h=(40+((i*11)%40))*scale;mapCtx.fillStyle='rgba(90,70,50,.9)';mapCtx.fillRect(x,innerHeight-120-h,24*scale,h);mapCtx.fillStyle='rgba(160,140,120,.25)';mapCtx.fillRect(x+8*scale,innerHeight-120-h-42*scale,8*scale,42*scale);} 
  } else if(p.deco==='sky'){
    mapCtx.fillStyle='rgba(255,255,255,.88)';
    for(let i=0;i<10;i++){const x=offX+(60+i*58+Math.sin(mapPulse*1.2+i)*16)*scale;const y=offY+(40+i%4*48)*scale;mapCtx.beginPath();mapCtx.arc(x,y,13*scale,0,Math.PI*2);mapCtx.arc(x+18*scale,y+4*scale,16*scale,0,Math.PI*2);mapCtx.arc(x-14*scale,y+5*scale,12*scale,0,Math.PI*2);mapCtx.fill();}
  } else if(p.deco==='crystal'){
    for(let i=0;i<22;i++){const x=offX+(20+(i*29)%620)*scale;const y=offY+(100+(i*47)%240)*scale;mapCtx.fillStyle=`rgba(${110+i*4},${180+i*2},255,.35)`;mapCtx.beginPath();mapCtx.moveTo(x,y-16*scale);mapCtx.lineTo(x+12*scale,y);mapCtx.lineTo(x,y+20*scale);mapCtx.lineTo(x-12*scale,y);mapCtx.closePath();mapCtx.fill();}
    mapCtx.fillStyle='rgba(52,24,88,.68)';mapCtx.fillRect(0,innerHeight-100,innerWidth,110);
  } else if(p.deco==='fortress'){
    mapCtx.fillStyle='rgba(18,16,28,.82)';mapCtx.fillRect(0,innerHeight-124,innerWidth,140);
    for(let i=0;i<14;i++){const x=offX+(24+i*44)*scale;mapCtx.fillStyle='rgba(70,64,82,.92)';mapCtx.fillRect(x,innerHeight-124-(30+(i%4)*16)*scale,28*scale,(36+(i%4)*16)*scale);} 
    for(let i=0;i<40;i++){mapCtx.fillStyle='rgba(255,120,90,.3)';mapCtx.fillRect(Math.random()*innerWidth,innerHeight-120+Math.random()*90,2,2);}
  }
}
function moveMapSelection(dir){
  const from=currentNode();
  const neighbors=from.neighbors.map(id=>NODE_INDEX[id]).filter(Boolean).filter(n=>nodeUnlocked(n.id)||stageRecord(n.id).completed);
  if(!neighbors.length){toast('No unlocked path that way');return;}
  let best=null,bestScore=-999;
  for(const n of neighbors){
    const vx=n.x-from.x, vy=n.y-from.y;
    const len=Math.hypot(vx,vy)||1;
    const score=(vx/len)*dir.x + (vy/len)*dir.y - len*0.0007;
    if(score>bestScore){bestScore=score;best=n;}
  }
  if(best&&bestScore>-.1){G.selectedNodeId=best.id;toast(best.name,700);}else toast('Path blocked',700);
}
function cycleWorld(step=1){
  const unlocked=WORLD_ORDER.filter(id=>SAVE.unlockedWorlds.includes(id));
  const idx=unlocked.indexOf(G.worldId);
  const next=unlocked[(idx+step+unlocked.length)%unlocked.length];
  G.worldId=next;
  const entry=WORLD_INDEX[next].entry;
  const worldNodes=WORLD_INDEX[next].nodes.filter(n=>nodeUnlocked(n.id));
  G.selectedNodeId=(worldNodes.find(n=>n.id===SAVE.currentNode && n.world===next)?.id)||worldNodes[0]?.id||entry;
  startMapBackdrop(next);
  startMusic('map'+WORLD_INDEX[next].index);
}
mapCanvas.addEventListener('pointerdown',e=>{
  if(G.mode!=='map')return;
  const rect=mapCanvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const world=currentWorld();
  const baseW=640, baseH=380; const pad=34; const scale=Math.min((innerWidth-pad*2)/baseW,(innerHeight-pad*2)/baseH); const offX=(innerWidth-baseW*scale)/2; const offY=(innerHeight-baseH*scale)/2+20;
  let hit=null, dist=1e9;
  for(const node of world.nodes){
    if(!(nodeVisible(node.id)||node.id===world.entry))continue;
    const p=nodePos(node,offX,offY,scale);const d=Math.hypot(mx-p.x,my-p.y);if(d<26&&d<dist){dist=d;hit=node;}
  }
  if(hit){if(G.selectedNodeId===hit.id)enterSelectedNode();else G.selectedNodeId=hit.id;}
});

function buildStageForNode(node){
  clearAllWorldStuff();
  const world=WORLD_INDEX[node.world];
  const theme=world.palette;
  stageTopMat=new THREE.MeshStandardMaterial({color:theme.grass,roughness:.82});
  stageGroundMat=new THREE.MeshStandardMaterial({color:theme.ground,roughness:.88});
  decorateBackdrop(world.id,120);
  const rnd=seeded(node.id);
  const type=node.kind;
  const length=Math.round((type===NODE_TYPES.bonus?54:type===NODE_TYPES.fortress?108:type===NODE_TYPES.vertical?86:type===NODE_TYPES.challenge?96:88)+(node.diff||1)*4);
  const baseY=0;
  const meta={length, baseY, exitType:node.secretTo?'both':'normal', world:world.id};
  G.currentStage={nodeId:node.id,length,worldId:world.id,vertical:type===NODE_TYPES.vertical,time:node.kind===NODE_TYPES.bonus?170:node.kind===NODE_TYPES.fortress?340:300,node};
  G.totalCoins=0;G.foundCoins=0;G.totalSecrets=node.secretTo?1:0;G.foundSecrets=0;
  const stageFlavor=world.id+'_'+type;

  const ground=[]; let cursor=0; let y=0;
  ground.push([0,12,0]); cursor=13;
  const maxRise=type===NODE_TYPES.vertical?2:1;
  const gapChance=type===NODE_TYPES.bonus?.06:type===NODE_TYPES.challenge?.18:type===NODE_TYPES.fortress?.22:.12;
  const riseChance=type===NODE_TYPES.vertical?.82:.22;
  while(cursor<length-18){
    const gap=(rnd()<gapChance?1+Math.floor(rnd()*2):0) + (type===NODE_TYPES.fortress&&rnd()<.16?1:0);
    cursor+=gap;
    if(cursor>=length-18)break;
    if(rnd()<riseChance){y+=Math.floor(rnd()*(maxRise+1)); if(type!==NODE_TYPES.vertical) y=clamp(y,0,4); else y=clamp(y,0,10);} 
    else if(rnd()<.2){y-=1; y=clamp(y,0,type===NODE_TYPES.vertical?10:4);} 
    const segLen=Math.floor(6+rnd()*(type===NODE_TYPES.bonus?5:8));
    ground.push([cursor,cursor+segLen,y]);
    cursor+=segLen+1;
  }
  const endY=type===NODE_TYPES.vertical?Math.max(5,ground[ground.length-1][2]+2):ground[ground.length-1][2];
  ground.push([length-14,length-4,endY]);

  for(const [a,b,gy] of ground)addGroundSegment(a,b,gy,theme);

  // optional hazards in pits
  if(type===NODE_TYPES.fortress || world.id==='w5'){
    for(let i=0;i<ground.length-1;i++){
      const cur=ground[i], next=ground[i+1];
      const gapStart=cur[1]+1, gapEnd=next[0]-1;
      if(gapEnd>=gapStart) addHazard(gapStart,-.02,(gapEnd-gapStart)+1,.32);
    }
  }

  // features per segment
  for(let i=0;i<ground.length;i++){
    const [a,b,gy]=ground[i];
    const segW=b-a+1;
    const prev=ground[i-1], next=ground[i+1];
    const leftGap=!!prev && a-prev[1]>1;
    const rightGap=!!next && next[0]-b>1;
    const edgeBuffer=(leftGap||rightGap)?3:2;
    const safeA=a+edgeBuffer;
    const safeB=b-edgeBuffer;
    const safeCenter=Math.floor((safeA+safeB)/2);

    if(segW>=4 && rnd()<.75){
      const coinStart=leftGap?a+2.2:a+1.2;
      const cCount=clamp(Math.floor((segW-(leftGap?1:0)-(rightGap?1:0))/2),2,5);
      addCoinArc(coinStart,gy+2.2,cCount,1,.7+rnd()*1.2);
    }
    if(segW>=5 && rnd()<.55){
      const enemyMin=Math.max(a+1,leftGap?a+2:a+1);
      const enemyMax=Math.min(b-1,rightGap?b-2:b-1);
      if(enemyMax>=enemyMin){
        const ex=enemyMin+Math.floor(rnd()*(enemyMax-enemyMin+1));
        addEnemy(ex,gy,'goomba');
        if(node.diff>2 && rnd()<.4 && ex+2<=enemyMax) addEnemy(ex+2,gy,rnd()<.5?'goomba':'koopa');
      }
    }
    const canPlaceOverhead=segW>=7 && safeB-safeA>=1;
    if(canPlaceOverhead && rnd()<.46){
      const bx=safeA+Math.floor(rnd()*(safeB-safeA+1));
      addQuestion(bx,gy+4,rnd()<.25?'mush':rnd()<.1?'star':'coin');
      if(rnd()<.5 && bx+1<=b-1)addSolidBlock(bx+1,gy+4,M.block,'brick');
      if(rnd()<.5 && bx-1>=a+1)addSolidBlock(bx-1,gy+4,M.block,'brick');
      if(rnd()<.22 && !(leftGap||rightGap))addQuestion(bx,gy+7,rnd()<.5?'1up':'star',true);
    }
    if(world.id==='w1' && rnd()<.18 && segW>=7 && safeB>=safeA){
      const px=safeA+Math.floor(rnd()*(safeB-safeA+1));
      const ph=(leftGap||rightGap)?1:1+Math.floor(rnd()*2);
      addPipe(px,gy,ph);
    }
    if(world.id==='w2' && rnd()<.24 && segW>=6) addMovingPlatform(a+Math.floor(segW/2),gy+3,3,0,1.5,.9+rnd()*.4);
    if(world.id==='w3' && rnd()<.26){addMovingPlatform(a+Math.max(2,Math.floor(segW/2)),gy+3.4,3+rnd()*2,1.8,0,.95+rnd()*.5); if(rnd()<.45)addBounce(a+1,gy+1);} 
    if(world.id==='w4' && rnd()<.24){addCrumble(a+Math.floor(segW/2),gy+2,1+(rnd()<.5?1:0)); if(rnd()<.3)addMovingPlatform(a+Math.floor(segW/2),gy+4,3,0,1.6,1);} 
    if((world.id==='w5'||type===NODE_TYPES.challenge) && rnd()<.22 && segW>=5){addBounce(a+2,gy+1);}
  }

  // type specials
  if(type===NODE_TYPES.bonus){
    for(let x=8;x<length-8;x+=4){addCoinArc(x,2+(x%8===0?1.2:.5),4,1,1.4); if(x%12===0)addQuestion(x+1,5,'coin');}
    if(world.id!=='w5')addQuestion(Math.floor(length*.5),7,'1up',true);
  }
  if(type===NODE_TYPES.vertical){
    let vx=Math.floor(length*.32), vy=3;
    for(let i=0;i<7;i++){const w=3+(i%2);for(let k=0;k<w;k++)addSolidBlock(vx+k,vy,M.block,'brick');if(i%2===0)addCoinArc(vx,vy+2,3,1,1); if(i===2||i===5)addMovingPlatform(vx+w+2,vy+1.5,3,1.6,0,.9+i*.05); vx+=5-(i%2?3:0); vy+=1+(i%3===0?2:1);} 
    addCheckpoint(Math.floor(length*.48),Math.max(2,vy-3));
  }
  if(type===NODE_TYPES.challenge){
    for(let x=14;x<length-20;x+=15){addCrumble(x,3+((x/5)%2|0),2);addCoinArc(x-1,6,4,1,1);} 
  }
  if(type===NODE_TYPES.fortress){
    for(let x=18;x<length-16;x+=18){addMovingPlatform(x,4+(x%3),3.4,2,0,1.15);addHazard(x+5,-.02,4,.32);addCrumble(x+11,5,2);if(x+2<length-10){ const gy=(ground.find(g=>x>=g[0]&&x<=g[1])||ground[0])[2]; addEnemy(x+2,gy,'koopa'); }}
    for(let x=10;x<length-12;x+=12){addEnemy(x,ground[Math.min(ground.length-1,Math.floor(x/12))]?.[2]||0,rnd()<.5?'goomba':'koopa');}
  }
  if(world.id==='w4' && type!==NODE_TYPES.bonus){for(let i=0;i<8;i++){const cx=12+i*10;addStageMesh(Object.assign(new THREE.Mesh(new THREE.OctahedronGeometry(.45+((i%3)*.12),0),M.crystal.clone()),{position:new THREE.Vector3(cx,2.2+(i%4),-1.1)}));}}

  // checkpoint
  addCheckpoint(Math.floor(length*.52), Math.max(ground[Math.floor(ground.length*.55)]?.[2]||0,0));

  // secret exit branch
  if(node.secretTo){
    const sx=Math.floor(length*.64); const sy=(type===NODE_TYPES.vertical?8:5)+(world.index%2);
    for(let i=0;i<4;i++)addSolidBlock(sx+i,sy+i%2,M.block,'brick');
    addMovingPlatform(sx-4,sy-1,3,0,1.4,1.05);
    addCoinArc(sx-1,sy+2,5,1,.7);
    addSecretDoor(sx+6,sy+.5, world.id==='w1'?'door':world.id==='w3'?'pipe':'door');
  }

  // normal exit and end set piece
  addFlagGoal(length-6,endY,node.kind===NODE_TYPES.fortress);

  // start spawn
  P.lastSpawn={x:2,y:2};
  G.checkpoint=null;
  G.time=G.currentStage.time;
  G.currentStage.length=length;
  G.totalCoins=coins.length;

  buildPlayerSpawn();
  setStageAudioMode();
}

  P.x=2;P.y=2;P.vx=0;P.vy=0;P.face=1;P.state='idle';P.onGround=false;P.coyote=0;P.jumpBuf=0;P.sqx=1;P.sqy=1;P.h=G.power>0?1.6:.92;P.riding=null;

function unlockRoutesForExit(node, exitType){
  const unlocked=[];
  if(exitType==='normal' || exitType==='secret'){
    (node.normalTo||[]).forEach(id=>{const was=nodeUnlocked(id);unlockNode(id);if(!was)unlocked.push(id);});
  }
  if(exitType==='secret' && node.secretTo){const was=nodeUnlocked(node.secretTo);unlockNode(node.secretTo);if(!was)unlocked.push(node.secretTo);}
  if(node.worldUnlock && (exitType==='normal' || exitType==='secret')){
    if(!SAVE.unlockedWorlds.includes(node.worldUnlock)){SAVE.unlockedWorlds.push(node.worldUnlock);unlockNode(WORLD_INDEX[node.worldUnlock].entry);unlocked.push(WORLD_INDEX[node.worldUnlock].entry);}
  }
  persist();
  return unlocked;
}
function computeRank(node, exitType){
  const coinPct=G.totalCoins?G.foundCoins/G.totalCoins:1;
  const timePct=G.currentStage?Math.max(0,G.time/G.currentStage.time):0;
  const safe=G.noDamage?1:0;
  const secretBonus=(exitType==='secret'||!node.secretTo)?1:0;
  const score=coinPct*.34+timePct*.22+safe*.28+secretBonus*.16;
  return score>.91?'S':score>.76?'A':score>.56?'B':'C';
}
function applyStageResult(node, exitType){
  const rec=stageRecord(node.id);
  rec.unlocked=true;rec.completed=true;rec.normalExit = rec.normalExit || exitType==='normal' || exitType==='secret';
  if(exitType==='secret')rec.secretExit=true;
  const rank=computeRank(node,exitType);
  rec.rank=rec.rank?rankBetter(rank,rec.rank):rank;
  rec.bestCoins=Math.max(rec.bestCoins,G.foundCoins);
  rec.maxCoins=Math.max(rec.maxCoins,G.totalCoins);
  rec.bestTime=Math.max(rec.bestTime,Math.ceil(G.time));
  rec.bestScore=Math.max(rec.bestScore,G.score);
  rec.lastExit=exitType;
  const unlocked=unlockRoutesForExit(node,exitType);
  SAVE.bestScore=Math.max(SAVE.bestScore,G.score);
  persist();
  return {rank, unlocked};
}
async function clearStage(exitType='normal'){
  if(G.mode!=='playing')return;
  const node=currentNode();
  G.mode='clearing';
  stopMusic();
  sound(exitType==='secret'?'secret':'clear');
  const result=applyStageResult(node,exitType);
  showRank(result.rank);
  const worldDone=node.kind===NODE_TYPES.fortress && node.worldUnlock;
  const finalDone=node.final===true;
  let body=`RANK: ${result.rank}\nCOINS: ${G.foundCoins}/${G.totalCoins}\nTIME LEFT: ${Math.ceil(G.time)}\n`;
  if(exitType==='secret')body+=`\nSECRET ROUTE DISCOVERED!`;
  if(result.unlocked.length){body+=`\n\nUNLOCKED:`;result.unlocked.forEach(id=>body+=`\n- ${NODE_INDEX[id].name}`);sound('unlock');}
  if(worldDone){body+=`\n\nNEW WORLD OPENED: ${WORLD_INDEX[node.worldUnlock].name.toUpperCase()}`;sound('world');}
  if(finalDone){body+=`\n\nTHE FINAL FORTRESS HAS FALLEN.`;sound('victory');}
  showCard(exitType==='secret'?'SECRET EXIT!':'STAGE CLEAR!',node.name.toUpperCase(),body);
  const nextNode=exitType==='secret'&&node.secretTo?node.secretTo:(node.normalTo?.[0]||node.id);
  if(finalDone){
    SAVE.gameCompleted=true;persist();
    setTimeout(()=>showFinalVictory(),2300);
    return;
  }
  if(worldDone){G.worldId=node.worldUnlock;G.selectedNodeId=WORLD_INDEX[node.worldUnlock].entry;SAVE.currentWorld=G.worldId;SAVE.currentNode=G.selectedNodeId;persist();}
  else if(nodeUnlocked(nextNode)){G.selectedNodeId=nextNode;SAVE.currentNode=nextNode;SAVE.currentWorld=NODE_INDEX[nextNode].world;persist();}
  setTimeout(async()=>{hideCard();await goToMap(true, exitType==='secret'?'Secret path appeared on the map':'Route updated on the map');},2200);
}
async function showFinalVictory(){
  await fadeIn();

  el.hudMap.classList.remove('show');

  showCard('FINAL VICTORY','THE STAR TRAIL IS COMPLETE',`TOTAL COMPLETION: ${pct}%\nBEST SCORE: ${pad(Math.max(SAVE.bestScore,G.score),6)}\n\n${worldLines}\n\nPRESS ENTER ON THE TITLE SCREEN TO EXPLORE AGAIN.`);

}
function stompEnemy(enemy){
  enemy.alive=false;enemy.squash=.35;P.vy=PHYS.stomp;G.shakeT=FX.shake.stomp;G.shakeI=2;sound('stomp');P.sqy=.72;P.sqx=1.28;addScore(enemy.type==='koopa'?200:100,enemy.x,enemy.y+1);addParticle(enemy.x,enemy.y+.3,enemy.type==='koopa'?0x44aa55:0x8b4c25,5,3);if(enemy.type==='koopa'){enemy.isShell=true;enemy.alive=true;enemy.squash=0;enemy.shellV=0;enemy.mesh.scale.y=.56;enemy.mesh.children.forEach(c=>{if(c.position.y>.8)c.visible=false;});}
}
function shootFireball(){
  sound('fire');
  const m=addStageMesh(new THREE.Mesh(GEO.fire,M.fireball.clone()));
  m.position.set(P.x+P.face*.45,P.y+.56,0);
  fireballs.push({mesh:m,x:m.position.x,y:m.position.y,vx:P.face*11,vy:2.5,life:3});

function revealBlock(block){
  block.used=true;block.bounce=.2;
  if(block.mesh.userData.sign){stageGroup.remove(block.mesh.userData.sign);}
  block.mesh.material.color.setHex(0x8b6d3e);block.mesh.material.roughness=.9;
  if(block.content==='coin'){collectCoinAt(block.x+.5,block.y+1.5);} 
  else if(block.content==='1up'){G.lives++;sound('pow');floatingText(block.x+.5,block.y+1.2,'1UP','#71ff7c');}
  else spawnPowerup(block.x+.5,block.y+1.2,block.content==='mush'?'mush':block.content);
}
function revealHiddenBlock(block){
  block.hidden=false;block.used=true;block.bounce=.2;G.foundSecrets=Math.min(G.totalSecrets,G.foundSecrets+1);block.mesh.material.opacity=1;block.mesh.material.transparent=false;block.mesh.material.color.setHex(0x8b6d3e);sound('secret');
  if(block.content==='coin')collectCoinAt(block.x+.5,block.y+1.5);
  else if(block.content==='1up'){G.lives++;floatingText(block.x+.5,block.y+1.3,'1UP','#71ff7c');}
  else spawnPowerup(block.x+.5,block.y+1.2,block.content==='star'?'star':'mush');
}
function breakBrick(block){sound('bump');addParticle(block.mesh.position.x,block.mesh.position.y,0xc37638,8,5);stageGroup.remove(block.mesh);solids.splice(solids.indexOf(block),1);if(block.mesh.userData.sign)stageGroup.remove(block.mesh.userData.sign);addScore(50,block.mesh.position.x,block.mesh.position.y);}
function updatePlayer(dt){
  if(G.mode==='dead'){P.vy+=GRAV*dt;P.y+=P.vy*dt;return;}
  if(G.mode!=='playing')return;
  P.h=G.power>0?1.6:.92;
  if(P.onGround)P.coyote=PHYS.coyote;else P.coyote-=dt;
  const jumpPressed=action('jump'); if(jumpPressed&&!lastJump)P.jumpBuf=PHYS.jumpBuf; P.jumpBuf-=dt; lastJump=jumpPressed;
  const run=action('run');
  const maxSpeed=run?PHYS.run:PHYS.walk;
  let target=0; if(action('left'))target=-maxSpeed; if(action('right'))target=maxSpeed;
  const accel=P.onGround?PHYS.acc:PHYS.airAcc;
  if(target!==0){P.face=target>0?1:-1; P.vx+=(target-P.vx)*Math.min(1,accel*dt);} else {P.vx*=Math.max(0,1-PHYS.dec*dt); if(Math.abs(P.vx)<.08)P.vx=0;}
  P.vx=clamp(P.vx,-maxSpeed,maxSpeed);
  if(P.jumpBuf>0 && P.coyote>0){P.vy=run?PHYS.highJump:PHYS.jump;P.onGround=false;P.coyote=0;P.jumpBuf=0;P.sqy=.78;P.sqx=1.22;sound('jump');addParticle(P.x,P.y,0xdddddd,2,2);} 
  let gravMul=1; if(P.vy>0&&Math.abs(P.vy)<PHYS.apexZone)gravMul=PHYS.apexGrav; else if(P.vy<0)gravMul=PHYS.fallMul; else if(P.vy>0&&!jumpPressed)gravMul=PHYS.lowJumpMul; P.vy+=GRAV*gravMul*dt; P.vy=Math.max(P.vy,-24);
  fireCooldown-=dt;
  if(G.power===2 && action('fire') && !lastFire && fireCooldown<=0){shootFireball();fireCooldown=.28;} lastFire=action('fire');
  P.riding=null;
  let nx=P.x+P.vx*dt, ny=P.y+P.vy*dt;
  const vb=playerBox(P.x,ny); P.onGround=false;
  for(const s of solids){
    if(s.hidden && s.type==='hidden' && P.vy<=0)continue;
    if(s.falling)continue;
    if(aabb(vb.x+.08,vb.y,vb.w-.16,vb.h,s.x,s.y,s.w,s.h)){
      if(P.vy<=0){
        P.y=s.y+s.h; P.vy=0; P.onGround=true;
        if(s.type==='bounce'){P.vy=20;P.onGround=false;s.ref.bounce=.2;sound('bounce');G.shakeT=FX.shake.bounce;G.shakeI=1.5;P.sqy=.66;P.sqx=1.33;}
        else if(s.type==='crumble'&&s.timer<0){s.timer=.52;s.shake=.52;}
        if(s.type==='moving')P.riding=s;
      }else{
        P.y=s.y-P.h; P.vy=0;
        if(s.type==='question'&&!s.used)revealBlock(s);
        else if(s.type==='hidden'&&!s.used)revealHiddenBlock(s);
        else if(s.type==='solid'&&G.power>0&&s.mesh)breakBrick(s);
        else {s.bounce=.16;sound('bump');}
      }
      ny=P.y; break;
    }
  }
  if(!P.onGround)P.y=ny;
  const hb=playerBox(nx,P.y);
  for(const s of solids){
    if(s.hidden&&s.type==='hidden')continue;
    if(s.falling)continue;
    if(aabb(hb.x,hb.y+.05,hb.w,hb.h-.1,s.x,s.y,s.w,s.h)){nx=P.x;P.vx=0;break;}
  }
  P.x=nx;
  if(P.riding){const parent=movingPlatforms.find(mp=>mp.rect===P.riding); if(parent){P.x+=parent.dxStep||0; P.y+=parent.dyStep||0;}}
  if(P.x<.5){P.x=.5;P.vx=0;}
  if(P.y<-8 || P.x>G.currentStage.length+8)playerHit();
  for(const hz of hazards){if(aabb(playerBox().x,playerBox().y,playerBox().w,playerBox().h,hz.x,hz.y,hz.w,hz.h))playerHit();}
  for(const cp of checkpoints){if(!cp.active && Math.abs(P.x-cp.x)<.9 && P.y>=cp.y){cp.active=true;cp.flag.material=M.checkpointOn.clone();G.checkpoint={x:cp.x,y:cp.y+2};sound('ckpt');toast('Checkpoint!',900);} }
  if(goalSecret && aabb(playerBox().x,playerBox().y,playerBox().w,playerBox().h,goalSecret.x,goalSecret.y,goalSecret.w,goalSecret.h))clearStage('secret');
  if(goalNormal && aabb(playerBox().x,playerBox().y,playerBox().w,playerBox().h,goalNormal.x,goalNormal.y,goalNormal.w,goalNormal.h))clearStage('normal');
  if(P.onGround&&Math.abs(P.vx)>.5)P.state='run'; else if(!P.onGround)P.state=P.vy>0?'jump':'fall'; else P.state='idle';
  G.invT=Math.max(0,G.invT-dt); G.starT=Math.max(0,G.starT-dt);
}

/* ══════════════════════════════════════════════════════════════════════
   16. WORLD OBJECT UPDATES
   ══════════════════════════════════════════════════════════════════════ */
function updateCoins(dt){const b=playerBox(); for(const c of coins){if(c.collected)continue; c.mesh.position.y=c.y+Math.sin(performance.now()*.003+c.phase)*.17; c.mesh.rotation.y+=dt*4; if(aabb(b.x,b.y,b.w,b.h,c.x-.3,c.mesh.position.y-.3,.6,.6)){c.collected=true;stageGroup.remove(c.mesh);collectCoinAt(c.x,c.y);addParticle(c.x,c.y,0xffdd55,6,4);}}}
function updatePowerups(dt){const b=playerBox(); for(let i=powerups.length-1;i>=0;i--){const p=powerups[i]; if(p.pending){spawnPowerup(p.spawnX,p.spawnY,p.type); powerups.splice(i,1); continue;} if(!p.active)continue; if(p.rise>0){p.rise-=dt; p.y+=(1.6*dt);} else {if(p.type==='star'){p.vy=(p.vy||0)+GRAV*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;} else {p.vy+=GRAV*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;} for(const s of solids){if(s.hidden&&s.type==='hidden')continue;if(s.falling)continue;if(aabb(p.x-.3,p.y,.6,.6,s.x,s.y,s.w,s.h)&&p.vy<0){p.y=s.y+s.h;p.vy=p.type==='star'?8:0;} if(aabb(p.x-.3,p.y+.1,.6,.4,s.x,s.y,s.w,s.h)){if(p.type!=='star'||s.type!=='moving')p.vx*=-1;}}
        if(p.type==='star')p.mesh.rotation.y+=dt*5;
      }
      p.mesh.position.set(p.x,p.y,0);
      if(aabb(b.x,b.y,b.w,b.h,p.x-.3,p.y,.6,.6)){p.active=false;stageGroup.remove(p.mesh);powerups.splice(i,1);sound('pow');addParticle(p.x,p.y,0xffd860,8,4); if(p.type==='mush'){G.power=Math.max(G.power,1);addScore(1000,p.x,p.y);} else if(p.type==='1up'){G.lives++;floatingText(p.x,p.y,'1UP','#71ff7c');} else if(p.type==='fire'){G.power=2;addScore(1000,p.x,p.y);} else if(p.type==='star'){G.starT=10;addScore(1000,p.x,p.y);} }
    }}
function updateEnemies(dt){const b=playerBox(); for(const e of enemies){if(!e.alive&&!e.isShell){if(e.squash>0){e.squash-=dt;e.mesh.scale.y=Math.max(.1,e.squash*2.6);if(e.squash<=0)stageGroup.remove(e.mesh);}continue;} if(e.isShell){e.x+=e.shellV*dt; e.mesh.rotation.z+=e.shellV*dt*3; if(Math.abs(e.shellV)>.1){for(const o of enemies){if(o===e||(!o.alive&&!o.isShell))continue; if(Math.abs(e.x-o.x)<.75&&Math.abs(e.y-o.y)<.7){o.alive=false;o.squash=.02;addScore(200,o.x,o.y+1);addParticle(o.x,o.y,0xff8844,5,4);}}
        for(const s of solids){if(s.hidden&&s.type==='hidden')continue; if(aabb(e.x-.35,e.y,.7,.5,s.x,s.y,s.w,s.h)){e.shellV*=-1;break;}}
      }
      if(aabb(b.x,b.y,b.w,b.h,e.x-.42,e.y,.84,.56)){if(Math.abs(e.shellV)<.1){e.shellV=P.face*12;sound('bump');} else if(P.vy<-1 && P.y>e.y+.18){e.shellV=0;P.vy=PHYS.stomp;sound('stomp');} else if(G.starT>0){e.alive=false;e.isShell=false;addScore(200,e.x,e.y+1);} else playerHit();}
      e.mesh.position.set(e.x,e.y,0); continue;
    }
    e.vy+=GRAV*dt; let ny=e.y+e.vy*dt; let onSurface=false;
    for(const s of solids){if(s.hidden&&s.type==='hidden')continue;if(s.falling)continue; if(aabb(e.x-.32,ny,.64,.05,s.x,s.y,s.w,s.h)){e.y=s.y+s.h; e.vy=0; onSurface=true; break;}}
    if(!onSurface)e.y=ny; e.x+=e.vx*dt; for(const s of solids){if(s.hidden&&s.type==='hidden')continue;if(s.falling)continue; if(aabb(e.x-.32,e.y+.05,.64,.55,s.x,s.y,s.w,s.h)){e.vx*=-1; e.x+=e.vx*dt*2; break;}}
    if(onSurface){let support=false; for(const s of solids){if(s.hidden&&s.type==='hidden')continue;if(s.falling)continue; if(aabb(e.x+Math.sign(e.vx)*.35,e.y-.5,.2,.45,s.x,s.y,s.w,s.h)){support=true; break;}} if(!support)e.vx*=-1;}
    e.mesh.position.set(e.x,e.y,0); e.mesh.scale.x=e.vx>0?-1:1;
    if(aabb(b.x,b.y,b.w,b.h,e.x-.42,e.y,.84,.82)){
      if(G.starT>0){e.alive=false;e.squash=.02;addScore(200,e.x,e.y+1);addParticle(e.x,e.y,0xffda55,6,4);sound('stomp');}
      else if(P.vy<-1 && P.y>e.y+.25)stompEnemy(e); else playerHit();
    }
  }}
function updateFireballs(dt){for(let i=fireballs.length-1;i>=0;i--){const f=fireballs[i];f.life-=dt;f.vy+=GRAV*dt;f.x+=f.vx*dt;f.y+=f.vy*dt; for(const s of solids){if(s.hidden&&s.type==='hidden')continue;if(s.falling)continue;if(aabb(f.x-.1,f.y-.1,.2,.2,s.x,s.y,s.w,s.h)){if(f.vy<0){f.y=s.y+s.h+.12;f.vy=6;} else f.vx*=-1;}}
    for(const e of enemies){if(!e.alive&&!e.isShell)continue; if(Math.abs(f.x-e.x)<.5&&Math.abs(f.y-e.y)<.55){e.alive=false;e.isShell=false;e.squash=.02;addScore(200,e.x,e.y+1);addParticle(e.x,e.y,0xff6a00,6,4);f.life=0;}}
    f.mesh.position.set(f.x,f.y,0);f.mesh.rotation.x+=dt*14;f.mesh.rotation.z+=dt*14; if(f.life<=0||f.y<-3||f.x<0||f.x>G.currentStage.length+10){stageGroup.remove(f.mesh);fireballs.splice(i,1);} }}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt; if(p.text){p.mesh.position.y+=p.vy*dt; p.mesh.material.opacity=Math.max(0,p.life/1.2);} else {p.vy+=GRAV*dt*.45; p.mesh.position.x+=p.vx*dt; p.mesh.position.y+=p.vy*dt; p.mesh.position.z+=(p.vz||0)*dt; p.mesh.rotation.x+=dt*4; p.mesh.rotation.z+=dt*3; } if(p.life<=0){stageGroup.remove(p.mesh); particles.splice(i,1);} }}
function updateMovingPlatforms(dt){for(const mp of movingPlatforms){mp.t+=dt*mp.speed; const nx=mp.ox+Math.sin(mp.t)*mp.rangeX; const ny=mp.oy+Math.sin(mp.t)*mp.rangeY; mp.dxStep=nx-mp.mesh.position.x; mp.dyStep=ny-mp.mesh.position.y; mp.mesh.position.set(nx,ny,0); mp.rect.x=nx-mp.w/2; mp.rect.y=ny-.18;}}
function updateBouncePads(dt){for(const b of bouncePads){if(b.bounce>0){b.bounce-=dt; b.mesh.scale.y=Math.max(.56,1-b.bounce*2.6);} else b.mesh.scale.y+=(1-b.mesh.scale.y)*8*dt;}}
function updateCrumbles(dt){for(const c of crumblePlatforms){if(c.falling){c.respawn-=dt; if(c.respawn<=0){c.falling=false;c.timer=-1;c.mesh.visible=true;c.mesh.position.set(c.homeX,c.homeY,0);c.x=c.homeX-.5;c.y=c.homeY-.5;} continue;} if(c.timer>0){c.timer-=dt; c.mesh.position.x=c.homeX+(Math.random()-.5)*.08; if(c.timer<=0){c.falling=true;c.respawn=4;c.mesh.visible=false;c.x=-999;c.y=-999;sound('crumble');}} else c.mesh.position.x+=(c.homeX-c.mesh.position.x)*10*dt;}}
function updateSolidBumps(dt){for(const s of solids){if(s.bounce>0&&s.mesh){s.bounce-=dt; s.mesh.position.y=s.homeY+Math.sin((s.bounce/.2)*Math.PI)*.34; if(s.mesh.userData.sign)s.mesh.userData.sign.position.y=s.mesh.position.y;}}}
function updateClouds(dt){for(const c of bgClouds){c.position.x+=dt*.22;if(c.position.x>camera.position.x+50)c.position.x=c.position.x-100;}}

/* ══════════════════════════════════════════════════════════════════════
   17. PLAYER VISUAL / CAMERA / HUD
   ══════════════════════════════════════════════════════════════════════ */
function updatePlayerVisual(dt){
  if(!P.mesh)return;
  const sc=G.power>0?1.4:1; P.mesh.scale.set(sc*P.face*P.sqx,sc*P.sqy,sc); P.mesh.position.set(P.x,P.y+.02,0);
  const legL=P.mesh.getObjectByName('legL'), legR=P.mesh.getObjectByName('legR'), armL=P.mesh.getObjectByName('armL'), armR=P.mesh.getObjectByName('armR');
  if(P.state==='run'){const t=performance.now()*.009*Math.max(1,Math.abs(P.vx)); if(legL)legL.rotation.x=Math.sin(t)*.65; if(legR)legR.rotation.x=Math.sin(t+Math.PI)*.65; if(armL)armL.rotation.x=Math.sin(t+Math.PI)*.45; if(armR)armR.rotation.x=Math.sin(t)*.45; P.mesh.rotation.z=-P.vx*.012;}
  else if(P.state==='jump'){if(legL)legL.rotation.x=-.25; if(legR)legR.rotation.x=.25; if(armL)armL.rotation.x=-.8; if(armR)armR.rotation.x=-.8; P.mesh.rotation.z=0;}
  else if(P.state==='fall'){if(legL)legL.rotation.x=.18; if(legR)legR.rotation.x=-.18; if(armL)armL.rotation.x=-.5; if(armR)armR.rotation.x=-.5; P.mesh.rotation.z=0;}
  else {[legL,legR,armL,armR].forEach(m=>{if(m)m.rotation.x+=(0-m.rotation.x)*Math.min(1,12*dt)});P.mesh.rotation.z+=(0-P.mesh.rotation.z)*Math.min(1,8*dt);}
  if(G.invT>0)P.mesh.visible=Math.sin(G.invT*22)>0; else P.mesh.visible=true;
  if(G.starT>0){const hue=(performance.now()*.002)%1; const col=new THREE.Color().setHSL(hue,1,.55); P.mesh.traverse(m=>{if(m.isMesh){m.material.emissive?.copy?.(col); if('emissiveIntensity' in m.material)m.material.emissiveIntensity=.55;}});} else {P.mesh.traverse(m=>{if(m.isMesh && m.material.emissive){m.material.emissive.setHex(0x000000); if('emissiveIntensity' in m.material)m.material.emissiveIntensity=0;}});} 
  P.sqx+=(1-P.sqx)*Math.min(1,14*dt); P.sqy+=(1-P.sqy)*Math.min(1,14*dt);
}
function updateCamera(dt){
  if(G.mode==='map'||G.mode==='title'||G.mode==='victory'){
    const targetWorld=currentWorld();
    camera.position.x+=(24-camera.position.x)*2*dt; camera.position.y+=(10-camera.position.y)*2*dt; camera.position.z=24; camera.lookAt(24,2,0); return;
  }
  const lookX=P.x+P.vx*.35; const lookY=Math.max(3,P.y+3+(P.vy>3?P.vy*.07:P.vy<-3?P.vy*.04:0));
  camera.position.x+=(lookX-camera.position.x)*3.3*dt; camera.position.y+=(lookY+3-camera.position.y)*2.6*dt; camera.position.z=18;
  let sx=0,sy=0; if(G.shakeT>0){G.shakeT-=dt; const i=G.shakeI*(G.shakeT/.24); sx=(Math.random()-.5)*i*.08; sy=(Math.random()-.5)*i*.06; if(G.shakeT<=0)G.shakeI=0;}
  camera.position.x+=sx; camera.position.y+=sy; camera.lookAt(camera.position.x,camera.position.y-3,0); sun.position.x=camera.position.x+18; sun.target.position.set(camera.position.x,0,0); sun.target.updateMatrixWorld();
}
function updateHud(){
  el.hs.textContent=String(G.score).padStart(6,'0');
  el.hc.textContent='x'+pad(G.coins,2);
  el.hw.textContent=currentNode().name.split(' ')[0] || currentNode().name;
  el.ht.textContent=fmtTime(G.time);
  el.hlv.textContent='x'+pad(Math.max(0,G.lives),2);
}

/* ══════════════════════════════════════════════════════════════════════
   18. GAME LOOP
   ══════════════════════════════════════════════════════════════════════ */
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  let dt=Math.min(clock.getDelta(),.05);
  if(G.freezeT>0){G.freezeT-=dt; renderer.render(scene,camera); return;}
  if(G.mode==='map')updateMapInput(dt);
  if(G.mode==='playing'){
    G.time-=dt; if(G.time<=0){G.time=0; playerHit();}
    updateMovingPlatforms(dt);
    updatePlayer(dt);
    updateCoins(dt);
    updatePowerups(dt);
    updateEnemies(dt);
    updateFireballs(dt);
    updateBouncePads(dt);
    updateCrumbles(dt);
    updateSolidBumps(dt);
    updateHud();
  }
  if(G.mode==='dead'){updatePlayer(dt);} 
  updateParticles(dt);
  updatePlayerVisual(dt);
  updateClouds(dt);
  updateCamera(dt);
  renderer.render(scene,camera);
  drawMap();
}

/* ══════════════════════════════════════════════════════════════════════
   19. INITIAL BOOT
   ══════════════════════════════════════════════════════════════════════ */
showTitle();
tick();
</script>
