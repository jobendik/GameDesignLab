<!doctype html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Arcade Football</title>
<style>

canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hint{position:fixed;left:12px;right:12px;bottom:10px;padding:8px 10px;border-radius:12px;background:#0006;color:#fff9;text-align:center;font-size:12px;pointer-events:none}
@media(orientation:landscape){#hint{display:none}}
</style></head><body><canvas id="c"></canvas><div id="hint">Snu mobilen. Desktop: WASD + J pass/takle, K skudd, L sprint</div>
<script>
(()=>{"use strict";
const can=document.getElementById("c"),ctx=can.getContext("2d",{alpha:false});
const VW=960,VH=540,TAU=Math.PI*2,F={x:70,y:86,w:820,h:370,l:70,r:890,t:86,b:456,mx:480,my:271,gw:94};
let dpr=1,sc=1,ox=0,oy=0,t=0,last=performance.now(),shake=0,flash=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d),rnd=(a,b)=>a+Math.random()*(b-a),ir=(a,b)=>Math.floor(rnd(a,b+1));
const norm=(x,y)=>{let l=Math.hypot(x,y);return l>.001?{x:x/l,y:y/l}:{x:0,y:0}};
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));can.width=innerWidth*dpr|0;can.height=innerHeight*dpr|0;sc=Math.min(innerWidth/VW,innerHeight/VH);ox=(innerWidth-VW*sc)/2;oy=(innerHeight-VH*sc)/2}
addEventListener("resize",resize,{passive:true});resize();
const pt=e=>({x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc});

let ac=null;function audio(){if(ac)return;try{ac=new(AudioContext||webkitAudioContext)}catch(e){}}
function beep(type){if(!ac)return;let n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),a=[420,250,.07,"sine",.04];
if(type=="pass")a=[560,820,.08,"triangle",.055]; if(type=="shoot")a=[180,80,.12,"sawtooth",.07]; if(type=="goal")a=[260,1000,.42,"triangle",.09]; if(type=="hit")a=[220,110,.08,"square",.05]; if(type=="save")a=[120,260,.12,"sawtooth",.06]; if(type=="bad")a=[140,70,.18,"sawtooth",.05];
o.type=a[3];o.frequency.setValueAtTime(a[0],n);o.frequency.exponentialRampToValueAtTime(Math.max(40,a[1]),n+a[2]);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(a[4],n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+a[2]);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+a[2]+.03)}
let G={state:"menu",time:120,maxTime:120,hs:0,as:0,active:4,kick:0,banner:"",bt:0,diff:2,coins:0},P=[],B=null,parts=[],texts=[],buttons=[];
let inp={x:0,y:0,pass:false,shoot:false,sprint:false,passP:false,shootP:false,joy:null,js:{x:0,y:0},jp:{x:0,y:0},touch:false},keys=new Set();

function player(team,role,x,y,n){return{team,role,x,y,vx:0,vy:0,r:role=="gk"?14:12,spd:role=="gk"?150:188,num:n,homeX:x,homeY:y,has:false,cd:0,tc:0,stun:0,stam:1,bob:rnd(0,TAU),skill:role=="st"?1.15:role=="mid"?1.05:.95,name:(team?["Ari","Ben","Kai","Tom","Jon"]:["Leo","Max","Sam","Nico","Rio"])[n-1]}}
function reset(kick=0){P=[];
P.push(player(0,"gk",F.l+35,F.my,1),player(0,"def",F.l+170,F.my-78,2),player(0,"def",F.l+170,F.my+78,3),player(0,"mid",F.l+310,F.my,4),player(0,"st",F.l+430,F.my,5));
P.push(player(1,"gk",F.r-35,F.my,1),player(1,"def",F.r-170,F.my-78,2),player(1,"def",F.r-170,F.my+78,3),player(1,"mid",F.r-310,F.my,4),player(1,"st",F.r-430,F.my,5));
B={x:F.mx+(kick?-18:18),y:F.my,vx:0,vy:0,r:7,own:null,last:kick,trail:[],spin:0};give(P[kick?9:4]);G.active=kick?9:4;G.kick=1.1;txt(F.mx,135,"KICK OFF!","#fff",24,1)}
function give(p){if(B.own!=null&&P[B.own])P[B.own].has=false;B.own=P.indexOf(p);p.has=true;B.last=p.team;B.vx=B.vy=0}
function loose(vx,vy){if(B.own!=null&&P[B.own]){P[B.own].has=false;B.last=P[B.own].team}B.own=null;B.vx=vx;B.vy=vy}
function start(){G.state="play";G.time=G.maxTime;G.hs=G.as=0;G.banner="";G.bt=0;parts=[];texts=[];reset(0);beep("pass")}
function nearest(team,keep=true){let bi=-1,bd=1e9;for(let i=0;i<P.length;i++){let p=P[i];if(p.team!=team||(!keep&&p.role=="gk"))continue;let d=dist(p.x,p.y,B.x,B.y);if(d<bd){bd=d;bi=i}}return bi}
function oppDist(p){let d=1e9;for(let o of P)if(o.team!=p.team)d=Math.min(d,dist(p.x,p.y,o.x,o.y));return d}
function passTarget(p){let best=null,bs=-1e9;for(let m of P){if(m.team!=p.team||m==p||m.role=="gk")continue;let fw=p.team? p.x-m.x:m.x-p.x,sp=dist(p.x,p.y,m.x,m.y),pr=oppDist(m),s=fw*.9+sp*.15+pr*.8+(m.role=="st"?35:0);if(sp<55)s-=90;if(s>bs){bs=s;best=m}}return best}
function doPass(p){if(p.cd>0)return;let m=passTarget(p);if(!m)return shoot(p,.75);let d=norm(m.x-p.x,m.y-p.y),pow=380+Math.min(170,dist(p.x,p.y,m.x,m.y)*.5);loose(d.x*pow,d.y*pow);p.cd=.32;txt(p.x,p.y-35,"PASS","#7ae7ff",16,.45);burst(p.x,p.y,12,"#7ae7ff");beep("pass")}
function shoot(p,mul=1){if(p.cd>0)return;let gx=p.team?F.l-22:F.r+22,ky=P.find(q=>q.team!=p.team&&q.role=="gk"),ty=F.my+rnd(-F.gw*.34,F.gw*.34);if(ky)ty=ky.y<F.my?F.my+rnd(12,F.gw*.42):F.my-rnd(12,F.gw*.42);if(Math.abs(inp.y)>.25)ty+=inp.y*40;let d=norm(gx-p.x,ty-p.y),close=clamp(1.2-Math.abs((p.team?F.l:F.r)-p.x)/720,.75,1.2),pow=(530+p.skill*60)*close*mul;loose(d.x*pow,d.y*pow);p.cd=.52;txt(p.x,p.y-38,"SHOOT!","#ffd166",20,.5);burst(p.x,p.y,18,"#ffd166");shake=.08;beep("shoot")}
function tackle(p,strong=false){if(p.tc>0)return;p.tc=strong?.55:.38;let target=B.own!=null&&P[B.own].team!=p.team?P[B.own]:null;txt(p.x,p.y-32,strong?"SLIDE":"TACKLE","#fff",14,.32);beep("hit");if(target&&dist(p.x,p.y,target.x,target.y)<(strong?36:31)){if(Math.random()<(strong?.75:.6)){target.has=false;target.stun=.22;give(p);txt(p.x,p.y-48,"STEAL!","#72ff9b",17,.45);burst(p.x,p.y,20,"#72ff9b")}else p.stun=.14}else if(B.own==null&&dist(p.x,p.y,B.x,B.y)<34)give(p)}
function aiPass(p){let m=passTarget(p);if(!m)return aiShoot(p);let d=norm(m.x-p.x-30,m.y-p.y+rnd(-25,25)),pow=340+G.diff*30;loose(d.x*pow,d.y*pow);p.cd=.45;txt(p.x,p.y-32,"PASS","#ff9b63",13,.32);beep("pass")}
function aiShoot(p){let d=norm(F.l-22-p.x,F.my+rnd(-42,42)-p.y),pow=480+G.diff*45;loose(d.x*pow,d.y*pow);p.cd=.6;txt(p.x,p.y-34,"SHOT!","#ff6077",17,.35);beep("shoot")}
let aiT=0;function aiBrain(dt){aiT-=dt;if(aiT>0||G.kick>0)return;aiT=Math.max(.24,.72-G.diff*.1);if(B.own!=null&&P[B.own].team==1){let p=P[B.own],dg=p.x-F.l,pr=oppDist(p),sc=dg<230?.52:dg<310?.23:.05;if(Math.random()<sc)aiShoot(p);else if(pr<58||Math.random()<.46)aiPass(p)}}
function selectActive(){if(B.own!=null&&P[B.own].team==0){G.active=B.own;return}let cur=P[G.active],n=nearest(0,false);if(!cur||cur.team||cur.role=="gk"||dist(cur.x,cur.y,B.x,B.y)>92)G.active=n}
function target(p){let teamBall=B.own!=null&&P[B.own].team==p.team, enemyBall=B.own!=null&&P[B.own].team!=p.team, looseB=B.own==null;if(p.role=="gk"){let x=p.team?F.r-24:F.l+24,y=clamp(B.y,F.my-F.gw/2+10,F.my+F.gw/2-10);if(Math.abs(B.x-x)>240)y=(y+F.my*2)/3;return{x,y,f:1.2}}if(looseB&&P[nearest(p.team,false)]==p)return{x:B.x,y:B.y,f:1.2};if(teamBall){let o=P[B.own],dir=p.team?-1:1;if(p==o)return{x:p.team?F.l+85:F.r-85,y:F.my+Math.sin(t+p.num)*80,f:.9};let x=p.homeX+dir*120,y=p.homeY;if(o){if(p.role=="st"){x=o.x+dir*120;y=o.y+Math.sin(p.num)*70}if(p.role=="mid"){x=o.x+dir*70;y=F.my+Math.sin(p.num*2.3)*90}if(p.role=="def"){x=o.x-dir*90;y=p.homeY}}return{x:clamp(x,F.l+35,F.r-35),y:clamp(y,F.t+25,F.b-25),f:.72}}if(enemyBall){let o=P[B.own],n=nearest(p.team,false);if(P[n]==p)return{x:o.x,y:o.y,f:1.25};let gx=p.team?F.r-55:F.l+55;return{x:(o.x+gx)/2,y:(o.y+p.homeY)/2,f:.85}}return{x:p.homeX,y:p.homeY,f:.6}}
function steer(p,x,y,dt,f=1){if(p.stun>0)return;let d=norm(x-p.x,y-p.y);p.vx+=d.x*p.spd*4.8*f*dt;p.vy+=d.y*p.spd*4.8*f*dt}
function updatePlayers(dt){let a=P[G.active];for(let p of P){p.cd=Math.max(0,p.cd-dt);p.tc=Math.max(0,p.tc-dt);p.stun=Math.max(0,p.stun-dt);p.bob+=dt*8;let tar=target(p);if(p==a&&p.team==0&&p.stun<=0){if(Math.abs(inp.x)+Math.abs(inp.y)>.05){let sp=p.spd*(inp.sprint?1.42:1);p.vx+=inp.x*sp*7.5*dt;p.vy+=inp.y*sp*7.5*dt;p.stam=clamp(p.stam+(inp.sprint?-.35:.22)*dt,.1,1)}else steer(p,tar.x,tar.y,dt,.55)}else steer(p,tar.x,tar.y,dt,tar.f);let mx=p.spd*(p.has?.82:1)*(p.stam<.25?.82:1),v=Math.hypot(p.vx,p.vy);if(v>mx){p.vx=p.vx/v*mx;p.vy=p.vy/v*mx}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.035,dt);p.vy*=Math.pow(.035,dt);keep(p)}aiBrain(dt)}
function keep(p){if(p.role=="gk"){p.x=p.team?clamp(p.x,F.r-92,F.r-12):clamp(p.x,F.l+12,F.l+92);p.y=clamp(p.y,F.my-F.gw/2-25,F.my+F.gw/2+25)}else{p.x=clamp(p.x,F.l+14,F.r-14);p.y=clamp(p.y,F.t+14,F.b-14)}}
function updateBall(dt){if(B.own!=null){let p=P[B.own],n=norm(p.vx,p.vy),fw=p.team?-1:1;B.x=p.x+(Math.abs(n.x)+Math.abs(n.y)>.05?n.x*15:fw*14);B.y=p.y+(Math.abs(n.x)+Math.abs(n.y)>.05?n.y*15:4);B.vx=p.vx;B.vy=p.vy}else{B.x+=B.vx*dt;B.y+=B.vy*dt;B.vx*=Math.pow(.20,dt);B.vy*=Math.pow(.20,dt);if(B.y-B.r<F.t){B.y=F.t+B.r;B.vy=Math.abs(B.vy)*.75}if(B.y+B.r>F.b){B.y=F.b-B.r;B.vy=-Math.abs(B.vy)*.75}if(B.x-B.r<F.l&&!(B.y>F.my-F.gw/2&&B.y<F.my+F.gw/2)){B.x=F.l+B.r;B.vx=Math.abs(B.vx)*.75}if(B.x+B.r>F.r&&!(B.y>F.my-F.gw/2&&B.y<F.my+F.gw/2)){B.x=F.r-B.r;B.vx=-Math.abs(B.vx)*.75}for(let p of P){if(p.stun>0)continue;if(dist(p.x,p.y,B.x,B.y)<p.r+(p.role=="gk"?20:16)){let sp=Math.hypot(B.vx,B.vy);if(sp>430&&p.role!="gk")continue;if(p.role=="gk"&&sp>330&&p.team!=B.last){B.vx=(p.team? -1:1)*rnd(180,260);B.vy=rnd(-120,120);txt(p.x,p.y-38,"SAVE!","#fff",18,.5);burst(B.x,B.y,28,"#fff");beep("save");shake=.15}else give(p);break}}}B.spin+=Math.hypot(B.vx,B.vy)*dt*.035;B.trail.push({x:B.x,y:B.y,life:.2});if(B.trail.length>12)B.trail.shift();for(let tr of B.trail)tr.life-=dt;B.trail=B.trail.filter(tr=>tr.life>0)}
function collide(){for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){let a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r-1;if(d>0&&d<m){let nx=dx/d,ny=dy/d,p=(m-d)/2;if(a.role!="gk"){a.x-=nx*p;a.y-=ny*p}if(b.role!="gk"){b.x+=nx*p;b.y+=ny*p}}}if(B.own!=null){let p=P[B.own];for(let o of P){if(o.team==p.team||o.stun>0||o.tc>0)continue;if(dist(p.x,p.y,o.x,o.y)<p.r+o.r+3&&Math.random()<(.035+(o.role=="def"?.02:0))*(G.diff+.4)){p.stun=.18;o.tc=.45;give(o);txt(o.x,o.y-35,"STEAL","#fff",13,.32);burst(o.x,o.y,12,o.team?"#ff6077":"#7ae7ff");beep("hit");break}}}}
function goal(team){if(team==0)G.hs++;else G.as++;G.banner=team==0?"GOOOAL!":"OPPONENT GOAL";G.bt=2;txt(F.mx,F.my-80,G.banner,team?"#ff6077":"#ffd166",38,1.1);burst(B.x,B.y,80,team?"#ff6077":"#ffd166");flash=.42;shake=.45;beep("goal");setTimeout(()=>{if(G.state=="play")reset(team?0:1)},900)}
function checkGoal(){if(B.x<F.l-18&&B.y>F.my-F.gw/2&&B.y<F.my+F.gw/2)goal(1);if(B.x>F.r+18&&B.y>F.my-F.gw/2&&B.y<F.my+F.gw/2)goal(0)}
function end(){G.state="result";G.coins+=G.hs>G.as?50+(G.hs-G.as)*10:G.hs==G.as?25:12;beep("pass")}
function match(dt){if(G.kick>0)G.kick-=dt;else{G.time-=dt;if(G.time<=0){G.time=0;end();return}}selectActive();let a=P[G.active];if(a&&G.kick<=0){if(inp.passP)a.has?doPass(a):tackle(a,false);if(inp.shootP)a.has?shoot(a):tackle(a,true)}updatePlayers(dt);updateBall(dt);collide();checkGoal()}

addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault()},{passive:false});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()),{passive:true});
can.addEventListener("pointerdown",e=>{e.preventDefault();audio();let p=pt(e);if(G.state=="menu"){menuTap(p);return}if(G.state=="result"){resultTap(p);return}inp.touch=true;let b=btn(p.x,p.y);if(b){if(b=="pass")inp.passP=true;if(b=="shoot")inp.shootP=true;if(b=="sprint")inp.sprint=true;return}if(p.x<VW*.48){inp.joy=e.pointerId;inp.js=p;inp.jp=p}}, {passive:false});
can.addEventListener("pointermove",e=>{if(inp.joy==e.pointerId)inp.jp=pt(e)},{passive:false});
can.addEventListener("pointerup",e=>{let p=pt(e);if(inp.joy==e.pointerId){inp.joy=null;inp.x=inp.y=0}if(btn(p.x,p.y)=="sprint")inp.sprint=false},{passive:false});
function btn(x,y){if(dist(x,y,795,375)<50)return"pass";if(dist(x,y,850,260)<52)return"shoot";if(dist(x,y,695,382)<48)return"sprint";return null}
function controls(){let x=0,y=0;if(keys.has("a")||keys.has("arrowleft"))x--;if(keys.has("d")||keys.has("arrowright"))x++;if(keys.has("w")||keys.has("arrowup"))y--;if(keys.has("s")||keys.has("arrowdown"))y++;let n=norm(x,y);if(!inp.touch||inp.joy==null){inp.x=n.x;inp.y=n.y}if(inp.joy!=null){let dx=inp.jp.x-inp.js.x,dy=inp.jp.y-inp.js.y,n=norm(dx,dy),l=Math.min(54,Math.hypot(dx,dy));inp.x=n.x*l/54;inp.y=n.y*l/54}let j=keys.has("j"),k=keys.has("k")||keys.has(" ");if(j&&!inp.jw)inp.passP=true;if(k&&!inp.kw)inp.shootP=true;inp.jw=j;inp.kw=k;inp.sprint=inp.sprint||keys.has("l")||keys.has("shift")}
function tick(dt){t+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);if(G.bt>0)G.bt-=dt;for(let p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy+=(p.g||0)*dt}parts=parts.filter(p=>p.life>0);for(let f of texts){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}texts=texts.filter(f=>f.life>0);if(G.state=="play"){controls();match(dt)}inp.passP=inp.shootP=false}
function burst(x,y,n,c){for(let i=0;i<n;i++){let a=Math.random()*TAU;parts.push({x,y,vx:Math.cos(a)*rnd(25,180),vy:Math.sin(a)*rnd(25,180),r:rnd(1.4,4),life:rnd(.22,.75),color:c,g:rnd(0,80)})}}
function txt(x,y,text,color,size,life){texts.push({x,y,text,color,size,life,maxLife:life,vx:rnd(-10,10),vy:-38})}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#06101b";ctx.fillRect(0,0,can.width/dpr,can.height/dpr);let sx=shake?rnd(-1,1)*shake*12:0,sy=shake?rnd(-1,1)*shake*12:0;ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx),dpr*(oy+sy));bg();if(G.state=="menu")menu();else{stadium();field();if(B)ballShadow();players();ballDraw();fx();hud();if(G.state=="play")touchUI();if(G.state=="result")result()}frame();if(flash){ctx.globalAlpha=flash*.28;ctx.fillStyle="#fff";ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1}}
