<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumberjack Idle Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #558B2F; /* Deep grass green */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent browser zooming/scrolling on mobile */
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom UI shadows and animations */
        .text-shadow {
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .panel-shadow {
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.2);
        }
        .btn-upgrade {
            transition: transform 0.1s, filter 0.1s;
        }
        .btn-upgrade:active {
            transform: scale(0.95);
            filter: brightness(0.8);
        }
        .frenzy-glow {
            animation: pulse-glow 1s infinite alternate;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px #fbbf24; }
            to { box-shadow: 0 0 30px #f59e0b, 0 0 10px #f59e0b inset; }
        }
        
        /* Floating text animation for DOM elements */
        .floating-money {
            position: absolute;
            color: #4ade80;
            font-weight: 900;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
            text-shadow: 2px 2px 0px #000;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="select-none">

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay: Top Left (Stats) -->
    <div class="absolute top-4 left-4 flex flex-col gap-2 pointer-events-none z-10">
        <div class="bg-slate-900/80 border-2 border-slate-700 rounded-xl px-4 py-2 flex items-center gap-3 panel-shadow">
            <div class="w-8 h-8 rounded-full bg-yellow-400 border-2 border-yellow-200 flex items-center justify-center font-bold text-yellow-900">
                $
            </div>
            <span id="ui-money" class="text-white font-black text-2xl tracking-wide text-shadow">0</span>
        </div>
        
        <div class="bg-slate-900/80 border-2 border-slate-700 rounded-xl px-4 py-2 flex items-center gap-3 panel-shadow">
            <div class="w-8 h-8 rounded-full bg-amber-700 border-2 border-amber-500 flex items-center justify-center">
                <div class="w-4 h-4 bg-amber-400 rounded-sm"></div>
            </div>
            <div class="flex flex-col">
                <span class="text-xs text-slate-300 font-bold uppercase tracking-wider">Backpack</span>
                <span id="ui-capacity" class="text-white font-bold text-lg text-shadow">0 / 10</span>
            </div>
        </div>
    </div>

    <!-- UI Overlay: Top Right (Monetization / Frenzy) -->
    <div class="absolute top-4 right-4 z-10">
        <button id="btn-frenzy" class="frenzy-glow bg-gradient-to-b from-yellow-300 to-yellow-600 border-2 border-yellow-100 rounded-xl px-4 py-3 flex flex-col items-center panel-shadow btn-upgrade pointer-events-auto cursor-pointer">
            <span class="text-yellow-900 font-black text-lg">WATCH AD</span>
            <span class="text-white font-bold text-sm text-shadow">2X CHOP SPEED (60s)</span>
        </button>
    </div>

    <!-- UI Overlay: Bottom Right (Upgrades Button) -->
    <div class="absolute bottom-6 right-6 z-10">
        <button id="btn-open-upgrades" class="bg-gradient-to-b from-blue-500 to-blue-700 border-2 border-blue-300 rounded-full w-20 h-20 flex items-center justify-center panel-shadow btn-upgrade pointer-events-auto cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
        </button>
    </div>

    <!-- Upgrade Menu Modal (Hidden by default) -->
    <div id="upgrade-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center pointer-events-auto">
        <div class="bg-slate-800 border-4 border-slate-600 rounded-3xl w-11/12 max-w-md flex flex-col overflow-hidden panel-shadow transform transition-transform scale-95" id="upgrade-panel">
            
            <!-- Header -->
            <div class="bg-slate-900 py-4 px-6 flex justify-between items-center border-b-2 border-slate-700">
                <h2 class="text-2xl font-black text-white tracking-wider text-shadow">UPGRADES</h2>
                <button id="btn-close-upgrades" class="text-slate-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Content -->
            <div class="p-6 flex flex-col gap-4">
                
                <!-- Upgrade: Axe Power -->
                <div class="bg-slate-700 rounded-xl p-3 flex justify-between items-center border-2 border-slate-600">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center text-2xl border border-slate-500">🪓</div>
                        <div>
                            <div class="text-white font-bold text-lg">Axe Power</div>
                            <div id="lvl-power" class="text-slate-300 text-sm">Lvl 1</div>
                        </div>
                    </div>
                    <button id="upg-power" class="bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-4 rounded-lg shadow-[0_4px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-1 transition-all">
                        $<span id="cost-power">50</span>
                    </button>
                </div>

                <!-- Upgrade: Move Speed -->
                <div class="bg-slate-700 rounded-xl p-3 flex justify-between items-center border-2 border-slate-600">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center text-2xl border border-slate-500">👟</div>
                        <div>
                            <div class="text-white font-bold text-lg">Move Speed</div>
                            <div id="lvl-speed" class="text-slate-300 text-sm">Lvl 1</div>
                        </div>
                    </div>
                    <button id="upg-speed" class="bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-4 rounded-lg shadow-[0_4px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-1 transition-all">
                        $<span id="cost-speed">50</span>
                    </button>
                </div>

                <!-- Upgrade: Backpack Capacity -->
                <div class="bg-slate-700 rounded-xl p-3 flex justify-between items-center border-2 border-slate-600">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center text-2xl border border-slate-500">🎒</div>
                        <div>
                            <div class="text-white font-bold text-lg">Capacity</div>
                            <div id="lvl-capacity" class="text-slate-300 text-sm">Lvl 1</div>
                        </div>
                    </div>
                    <button id="upg-capacity" class="bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-4 rounded-lg shadow-[0_4px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-1 transition-all">
                        $<span id="cost-capacity">50</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Virtual Joystick (Mobile only, handles input via JS) -->
    <div id="joystick-zone" class="absolute inset-0 z-0 touch-none pointer-events-auto sm:pointer-events-none"></div>
    <div id="joystick-base" class="hidden absolute w-24 h-24 bg-white/20 border-2 border-white/40 rounded-full pointer-events-none z-20 transition-opacity duration-200">
        <div id="joystick-stick" class="absolute w-10 h-10 bg-white/80 rounded-full shadow-lg left-7 top-7"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base canvas
        
        // UI Elements
        const uiMoney = document.getElementById('ui-money');
        const uiCapacity = document.getElementById('ui-capacity');
        
        // Global Game State
        const GAME = {
            width: window.innerWidth,
            height: window.innerHeight,
            lastTime: 0,
            money: 0,
            worldSize: 2000,
            frenzyMultiplier: 1,
            frenzyTimer: 0
        };

        // Camera State
        const Camera = {
            x: GAME.worldSize / 2,
            y: GAME.worldSize / 2,
            zoom: 1
        };

        // Resize handler
        window.addEventListener('resize', () => {
            GAME.width = window.innerWidth;
            GAME.height = window.innerHeight;
            canvas.width = GAME.width;
            canvas.height = GAME.height;
        });
        // Trigger initial resize
        window.dispatchEvent(new Event('resize'));

        const Input = {
            keys: { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false },
            joyX: 0,
            joyY: 0,
            isTouch: false,
            
            init() {
                // Keyboard
                window.addEventListener('keydown', e => { if(this.keys.hasOwnProperty(e.key)) this.keys[e.key] = true; });
                window.addEventListener('keyup', e => { if(this.keys.hasOwnProperty(e.key)) this.keys[e.key] = false; });

                // Virtual Joystick
                const zone = document.getElementById('joystick-zone');
                const base = document.getElementById('joystick-base');
                const stick = document.getElementById('joystick-stick');
                let touchId = null;
                let baseX = 0, baseY = 0;

                const startJoystick = (x, y, id) => {
                    this.isTouch = true;
                    touchId = id;
                    baseX = x;
                    baseY = y;
                    base.style.left = `${x - 48}px`; // center of 96px width
                    base.style.top = `${y - 48}px`;
                    base.classList.remove('hidden');
                    this.updateJoystick(x, y);
                };

                const updateJoystick = (x, y) => {
                    let dx = x - baseX;
                    let dy = y - baseY;
                    const maxDist = 35; // Max pull distance
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    
                    // Normalize for engine
                    this.joyX = dx / maxDist;
                    this.joyY = dy / maxDist;
                };

                const endJoystick = () => {
                    touchId = null;
                    this.joyX = 0;
                    this.joyY = 0;
                    base.classList.add('hidden');
                    stick.style.transform = `translate(0px, 0px)`;
                };

                // Touch Events
                zone.addEventListener('touchstart', e => {
                    e.preventDefault();
                    if (touchId !== null) return;
                    const touch = e.changedTouches[0];
                    startJoystick(touch.clientX, touch.clientY, touch.identifier);
                }, {passive: false});

                zone.addEventListener('touchmove', e => {
                    e.preventDefault();
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) {
                            updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        }
                    }
                }, {passive: false});

                zone.addEventListener('touchend', e => {
                    e.preventDefault();
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === touchId) endJoystick();
                    }
                }, {passive: false});
            },
            
            getVector() {
                let vx = 0, vy = 0;
                // Keyboard takes priority
                if (this.keys.w || this.keys.ArrowUp) vy -= 1;
                if (this.keys.s || this.keys.ArrowDown) vy += 1;
                if (this.keys.a || this.keys.ArrowLeft) vx -= 1;
                if (this.keys.d || this.keys.ArrowRight) vx += 1;

                if (vx !== 0 || vy !== 0) {
                    const len = Math.hypot(vx, vy);
                    return { x: vx/len, y: vy/len };
                }
                
                // Fallback to joystick
                return { x: this.joyX, y: this.joyY };
            }
        };
        Input.init();

        const Utils = {
            dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
            random: (min, max) => Math.random() * (max - min) + min,
            drawCircle: (ctx, x, y, r, color, strokeColor, lineWidth) => {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                if (strokeColor) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = lineWidth || 2;
                    ctx.stroke();
                }
            },
            spawnFloatingText: (x, y, text, color) => {
                // DOM based floating text for crisp rendering over canvas
                const el = document.createElement('div');
                el.className = 'floating-money';
                el.textContent = text;
                el.style.color = color || '#4ade80'; // Default green
                
                // Map world coords to screen coords
                const screenX = x - Camera.x + GAME.width / 2;
                const screenY = y - Camera.y + GAME.height / 2;
                
                el.style.left = `${screenX}px`;
                el.style.top = `${screenY}px`;
                
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }
        };

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = Utils.random(-100, 100);
                this.vy = Utils.random(-100, 100);
                this.life = 1.0;
                this.color = color;
                this.size = Utils.random(3, 7);
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt * 2; // Die in 0.5s
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                Utils.drawCircle(ctx, this.x - Camera.x + GAME.width/2, this.y - Camera.y + GAME.height/2, this.size, this.color);
                ctx.globalAlpha = 1.0;
            }
        }

        class Log {
            constructor(x, y) {
                this.x = x + Utils.random(-30, 30);
                this.y = y + Utils.random(-30, 30);
                this.target = null;
                this.collected = false;
            }
            update(dt) {
                if (this.target) {
                    // Fly towards player
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 10) {
                        this.collected = true;
                        this.target.addLog();
                    } else {
                        const speed = 500 * dt;
                        this.x += (dx / dist) * speed;
                        this.y += (dy / dist) * speed;
                    }
                } else {
                    // Check magnet radius
                    if (Player.inventory < Player.stats.capacity && Utils.dist(this.x, this.y, Player.x, Player.y) < Player.magnetRadius) {
                        this.target = Player;
                    }
                }
            }
            draw(ctx) {
                const screenX = this.x - Camera.x + GAME.width/2;
                const screenY = this.y - Camera.y + GAME.height/2;
                
                // Draw a small log (brown rectangle)
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(Math.PI / 4);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-2, 2, 16, 8);
                
                // Log
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-8, -4, 16, 8);
                ctx.strokeStyle = '#5c2e0b';
                ctx.lineWidth = 1;
                ctx.strokeRect(-8, -4, 16, 8);
                
                ctx.restore();
            }
        }

        class Tree {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.maxHealth = 100;
                this.health = this.maxHealth;
                this.radius = 40;
                this.isDead = false;
                this.respawnTimer = 0;
                this.wobble = 0;
            }
            hit(power) {
                if (this.isDead) return;
                this.health -= power;
                this.wobble = 0.2; // Wiggle effect
                
                // Particles
                for(let i=0; i<3; i++) Particles.push(new Particle(this.x, this.y, '#65a30d'));
                
                if (this.health <= 0) {
                    this.die();
                }
            }
            die() {
                this.isDead = true;
                this.respawnTimer = 5; // 5 seconds to respawn
                
                // Spawn Logs
                const logCount = Math.floor(Utils.random(3, 6));
                for(let i=0; i<logCount; i++) {
                    Logs.push(new Log(this.x, this.y));
                }
                
                // Big Explosion Particles
                for(let i=0; i<15; i++) Particles.push(new Particle(this.x, this.y, '#8B4513'));
                for(let i=0; i<15; i++) Particles.push(new Particle(this.x, this.y, '#65a30d'));
            }
            update(dt) {
                if (this.isDead) {
                    this.respawnTimer -= dt;
                    if (this.respawnTimer <= 0) {
                        this.isDead = false;
                        this.health = this.maxHealth;
                    }
                }
                if (this.wobble > 0) {
                    this.wobble -= dt;
                    if(this.wobble < 0) this.wobble = 0;
                }
            }
            draw(ctx) {
                const screenX = this.x - Camera.x + GAME.width/2;
                const screenY = this.y - Camera.y + GAME.height/2;

                // Don't draw if completely off screen
                if (screenX < -100 || screenX > GAME.width+100 || screenY < -100 || screenY > GAME.height+100) return;

                if (this.isDead) {
                    // Draw Stump
                    Utils.drawCircle(ctx, screenX, screenY + 10, 20, '#5c2e0b');
                    Utils.drawCircle(ctx, screenX, screenY + 8, 18, '#8B4513');
                    return;
                }

                ctx.save();
                ctx.translate(screenX, screenY);
                
                if (this.wobble > 0) {
                    ctx.rotate(Math.sin(Date.now() * 0.05) * 0.1);
                }

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 30, 30, 15, 0, 0, Math.PI*2);
                ctx.fill();

                // Trunk
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(-10, 0, 20, 30);
                
                // Leaves (3 overlapping circles)
                Utils.drawCircle(ctx, 0, -20, 35, '#4d7c0f', '#3f6212', 3); // Top
                Utils.drawCircle(ctx, -20, 0, 30, '#4d7c0f', '#3f6212', 3);  // Left
                Utils.drawCircle(ctx, 20, 0, 30, '#4d7c0f', '#3f6212', 3);   // Right

                // Health bar if damaged
                if (this.health < this.maxHealth) {
                    const pct = this.health / this.maxHealth;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-26, -66, 52, 8);
                    ctx.fillStyle = pct > 0.5 ? '#4ade80' : '#ef4444';
                    ctx.fillRect(-25, -65, 50 * pct, 6);
                }

                ctx.restore();
            }
        }

        const Player = {
            x: GAME.worldSize / 2,
            y: GAME.worldSize / 2 + 200, // Start slightly below center
            radius: 20,
            inventory: 0,
            magnetRadius: 100,
            
            // Stats controlled by upgrades
            stats: {
                power: 20,
                speed: 250,
                capacity: 10,
                chopCooldown: 0.5 // Base hits per second (inverted)
            },
            
            chopTimer: 0,
            targetTree: null,
            facing: 1, // 1 for right, -1 for left
            swinging: 0,
            
            update(dt) {
                // Movement
                const input = Input.getVector();
                let isMoving = input.x !== 0 || input.y !== 0;

                if (isMoving) {
                    this.x += input.x * this.stats.speed * dt;
                    this.y += input.y * this.stats.speed * dt;
                    if (input.x !== 0) this.facing = input.x > 0 ? 1 : -1;
                    
                    // Clamp to world
                    this.x = Math.max(0, Math.min(GAME.worldSize, this.x));
                    this.y = Math.max(0, Math.min(GAME.worldSize, this.y));
                }

                // Chopping Logic (Auto-chop nearest tree if not moving or if standing near one)
                this.targetTree = null;
                let minDist = 80; // Chop range
                
                for (let tree of Trees) {
                    if (tree.isDead) continue;
                    let d = Utils.dist(this.x, this.y, tree.x, tree.y);
                    if (d < minDist) {
                        minDist = d;
                        this.targetTree = tree;
                    }
                }

                if (this.targetTree && this.inventory < this.stats.capacity) {
                    // Turn towards tree
                    this.facing = this.targetTree.x > this.x ? 1 : -1;
                    
                    this.chopTimer -= dt;
                    if (this.chopTimer <= 0) {
                        // Apply frenzy multiplier
                        const power = this.stats.power * GAME.frenzyMultiplier;
                        this.targetTree.hit(power);
                        
                        // Base cooldown divided by frenzy
                        this.chopTimer = this.stats.chopCooldown / GAME.frenzyMultiplier;
                        this.swinging = 0.2; // Animation timer
                    }
                } else {
                    this.chopTimer = 0; // Ready to chop immediately
                }

                if (this.swinging > 0) {
                    this.swinging -= dt;
                }
            },
            
            addLog() {
                if (this.inventory < this.stats.capacity) {
                    this.inventory++;
                    UpdateUI();
                }
            },

            draw(ctx) {
                const screenX = this.x - Camera.x + GAME.width/2;
                const screenY = this.y - Camera.y + GAME.height/2;

                ctx.save();
                ctx.translate(screenX, screenY);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 20, 20, 10, 0, 0, Math.PI*2);
                ctx.fill();

                // Player Body (Yellow hard hat worker)
                Utils.drawCircle(ctx, 0, 0, 20, '#3b82f6', '#1d4ed8', 3); // Blue overalls
                Utils.drawCircle(ctx, 0, -15, 16, '#fbbf24', '#d97706', 3); // Yellow hat
                
                // Backpack visual
                if (this.inventory > 0) {
                    ctx.fillStyle = '#8B4513';
                    ctx.strokeStyle = '#5c2e0b';
                    ctx.lineWidth = 2;
                    let packWidth = 10 + (this.inventory/this.stats.capacity)*20;
                    let packHeight = 20 + (this.inventory/this.stats.capacity)*20;
                    ctx.fillRect(-packWidth/2, -5, packWidth, packHeight);
                    ctx.strokeRect(-packWidth/2, -5, packWidth, packHeight);
                }

                // Axe / Arm
                ctx.save();
                ctx.scale(this.facing, 1); // Flip based on facing
                ctx.translate(15, 0); // Position arm
                
                if (this.swinging > 0) {
                    // Swing animation
                    const progress = this.swinging / 0.2;
                    ctx.rotate(Math.sin(progress * Math.PI) * Math.PI/2);
                } else {
                    ctx.rotate(Math.PI / 6); // Idle hold
                }

                // Arm
                ctx.fillStyle = '#fca5a5';
                ctx.fillRect(0, -5, 20, 10);
                
                // Axe Handle
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(15, -20, 6, 40);
                
                // Axe Head
                ctx.fillStyle = '#94a3b8';
                ctx.beginPath();
                ctx.moveTo(10, -15);
                ctx.lineTo(25, -25);
                ctx.lineTo(30, -5);
                ctx.lineTo(15, 0);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#64748b';
                ctx.stroke();

                ctx.restore();
                ctx.restore();
            }
        };

        const SellZone = {
            x: GAME.worldSize / 2,
            y: GAME.worldSize / 2 + 100,
            radius: 80,
            sellTimer: 0,
            
            update(dt) {
                const dist = Utils.dist(Player.x, Player.y, this.x, this.y);
                if (dist < this.radius && Player.inventory > 0) {
                    this.sellTimer -= dt;
                    if (this.sellTimer <= 0) {
                        // Sell 1 log
                        Player.inventory--;
                        const logValue = 5;
                        GAME.money += logValue;
                        
                        // Juice
                        Utils.spawnFloatingText(Player.x, Player.y - 40, `+$${logValue}`);
                        UpdateUI();
                        
                        // Faster selling
                        this.sellTimer = 0.05; 
                    }
                } else {
                    this.sellTimer = 0.2; // Initial delay
                }
            },
            
            draw(ctx) {
                const screenX = this.x - Camera.x + GAME.width/2;
                const screenY = this.y - Camera.y + GAME.height/2;
                
                if (screenX < -this.radius || screenX > GAME.width+this.radius || screenY < -this.radius || screenY > GAME.height+this.radius) return;

                // Pulsing zone
                const pulse = Math.sin(Date.now() * 0.003) * 10;
                
                ctx.beginPath();
                ctx.arc(screenX, screenY, this.radius + pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(250, 204, 21, 0.2)'; // Tailwind yellow-400
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
                ctx.setLineDash([10, 10]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Icon in center
                Utils.drawCircle(ctx, screenX, screenY, 30, '#fef08a', '#ca8a04', 3);
                ctx.fillStyle = '#ca8a04';
                ctx.font = 'bold 30px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', screenX, screenY+2);
                
                // Label
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Inter';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 4;
                ctx.fillText('SELL ZONE', screenX, screenY - 45);
                ctx.shadowBlur = 0; // reset
            }
        };

        let Trees = [];
        let Logs = [];
        let Particles = [];

        // Generate World Map
        function InitWorld() {
            Trees = [];
            Logs = [];
            Particles = [];
            
            // Create a forest around the center, leaving spawn/sell area clear
            for (let i = 0; i < 150; i++) {
                let tx, ty;
                let safe = false;
                while (!safe) {
                    tx = Utils.random(100, GAME.worldSize - 100);
                    ty = Utils.random(100, GAME.worldSize - 100);
                    // Keep clear of center sell zone area
                    if (Utils.dist(tx, ty, GAME.worldSize/2, GAME.worldSize/2) > 250) {
                        safe = true;
                    }
                }
                Trees.push(new Tree(tx, ty));
            }
            
            UpdateUI();
            UpdateUpgradesUI();
        }

        // UI Updater
        function UpdateUI() {
            uiMoney.innerText = GAME.money;
            uiCapacity.innerText = `${Player.inventory} / ${Player.stats.capacity}`;
            
            if (Player.inventory >= Player.stats.capacity) {
                uiCapacity.classList.add('text-red-400');
            } else {
                uiCapacity.classList.remove('text-red-400');
            }
        }

        const Upgrades = {
            power: { level: 1, baseCost: 50, statMod: 10 },
            speed: { level: 1, baseCost: 50, statMod: 20 },
            capacity: { level: 1, baseCost: 50, statMod: 5 },
            
            getCost(type) {
                return Math.floor(this[type].baseCost * Math.pow(1.5, this[type].level - 1));
            },
            
            buy(type) {
                const cost = this.getCost(type);
                if (GAME.money >= cost) {
                    GAME.money -= cost;
                    this[type].level++;
                    
                    // Apply stat
                    if (type === 'power') Player.stats.power += this.statMod;
                    if (type === 'speed') Player.stats.speed += this.statMod;
                    if (type === 'capacity') Player.stats.capacity += this.statMod;
                    
                    UpdateUI();
                    UpdateUpgradesUI();
                    
                    // Visual feedback
                    Utils.spawnFloatingText(Player.x, Player.y - 50, 'UPGRADED!', '#60a5fa');
                }
            }
        };

        function UpdateUpgradesUI() {
            const types = ['power', 'speed', 'capacity'];
            types.forEach(type => {
                const cost = Upgrades.getCost(type);
                document.getElementById(`lvl-${type}`).innerText = `Lvl ${Upgrades[type].level}`;
                document.getElementById(`cost-${type}`).innerText = cost;
                
                const btn = document.getElementById(`upg-${type}`);
                if (GAME.money >= cost) {
                    btn.classList.remove('bg-slate-500', 'text-slate-300');
                    btn.classList.add('bg-green-500', 'hover:bg-green-400', 'text-white');
                    btn.style.boxShadow = "0 4px 0 #166534";
                } else {
                    btn.classList.add('bg-slate-500', 'text-slate-300');
                    btn.classList.remove('bg-green-500', 'hover:bg-green-400', 'text-white');
                    btn.style.boxShadow = "0 4px 0 #334155";
                }
            });
        }

        // DOM Event Listeners for Upgrades
        document.getElementById('btn-open-upgrades').addEventListener('click', () => {
            UpdateUpgradesUI();
            const modal = document.getElementById('upgrade-modal');
            const panel = document.getElementById('upgrade-panel');
            modal.classList.remove('hidden');
            setTimeout(() => panel.classList.remove('scale-95'), 10);
        });

        document.getElementById('btn-close-upgrades').addEventListener('click', () => {
            const modal = document.getElementById('upgrade-modal');
            const panel = document.getElementById('upgrade-panel');
            panel.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        });

        ['power', 'speed', 'capacity'].forEach(type => {
            document.getElementById(`upg-${type}`).addEventListener('click', () => Upgrades.buy(type));
        });

        document.getElementById('btn-frenzy').addEventListener('click', () => {
            // In a real CrazyGames integration, this triggers SDK ad call:
            // crazygames.sdk.ad.requestAd('rewarded', callbacks...)
            // For prototype, we just simulate the reward success:
            
            const btn = document.getElementById('btn-frenzy');
            if (GAME.frenzyTimer <= 0) {
                // Activate Frenzy
                GAME.frenzyMultiplier = 2;
                GAME.frenzyTimer = 60; // 60 seconds
                btn.classList.remove('frenzy-glow', 'from-yellow-300', 'to-yellow-600');
                btn.classList.add('bg-slate-700', 'border-slate-500');
                btn.innerHTML = `<span class="text-white font-black text-lg">FRENZY ACTIVE</span><span class="text-yellow-400 font-bold text-sm text-shadow" id="frenzy-clock">60s</span>`;
                
                // Global particle burst
                for(let i=0; i<50; i++) Particles.push(new Particle(Player.x, Player.y, '#fde047'));
                Utils.spawnFloatingText(Player.x, Player.y - 60, 'FRENZY 2X!', '#fde047');
            }
        });

        function GameLoop(timestamp) {
            if (!GAME.lastTime) GAME.lastTime = timestamp;
            let dt = (timestamp - GAME.lastTime) / 1000;
            GAME.lastTime = timestamp;
            
            // Cap dt to prevent massive jumps if tab is inactive
            if (dt > 0.1) dt = 0.1;

            Update(dt);
            Draw();

            requestAnimationFrame(GameLoop);
        }

        function Update(dt) {
            Player.update(dt);
            SellZone.update(dt);
            
            // Smooth Camera Follow
            Camera.x += (Player.x - Camera.x) * 5 * dt;
            Camera.y += (Player.y - Camera.y) * 5 * dt;

            // Clamp camera to map bounds
            const halfW = GAME.width / 2;
            const halfH = GAME.height / 2;
            Camera.x = Math.max(halfW, Math.min(GAME.worldSize - halfW, Camera.x));
            Camera.y = Math.max(halfH, Math.min(GAME.worldSize - halfH, Camera.y));

            // Update Entities
            Trees.forEach(t => t.update(dt));
            
            for (let i = Logs.length - 1; i >= 0; i--) {
                Logs[i].update(dt);
                if (Logs[i].collected) Logs.splice(i, 1);
            }
            
            for (let i = Particles.length - 1; i >= 0; i--) {
                Particles[i].update(dt);
                if (Particles[i].life <= 0) Particles.splice(i, 1);
            }

            // Update Frenzy
            if (GAME.frenzyTimer > 0) {
                GAME.frenzyTimer -= dt;
                const clock = document.getElementById('frenzy-clock');
                if(clock) clock.innerText = `${Math.ceil(GAME.frenzyTimer)}s left`;

                if (GAME.frenzyTimer <= 0) {
                    // Reset
                    GAME.frenzyMultiplier = 1;
                    const btn = document.getElementById('btn-frenzy');
                    btn.classList.add('frenzy-glow', 'from-yellow-300', 'to-yellow-600');
                    btn.classList.remove('bg-slate-700', 'border-slate-500');
                    btn.innerHTML = `<span class="text-yellow-900 font-black text-lg">WATCH AD</span><span class="text-white font-bold text-sm text-shadow">2X CHOP SPEED (60s)</span>`;
                }
            }
        }

        function Draw() {
            // Clear Background (Grass)
            ctx.fillStyle = '#558B2F'; // Base grass
            ctx.fillRect(0, 0, GAME.width, GAME.height);

            // Draw Checkerboard Grid pattern for ground texture context
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            const gridSize = 100;
            const startX = Math.floor((Camera.x - GAME.width/2) / gridSize) * gridSize;
            const startY = Math.floor((Camera.y - GAME.height/2) / gridSize) * gridSize;
            
            for (let x = startX; x < Camera.x + GAME.width/2; x += gridSize) {
                for (let y = startY; y < Camera.y + GAME.height/2; y += gridSize) {
                    if ((x/gridSize + y/gridSize) % 2 === 0) {
                        ctx.fillRect(x - Camera.x + GAME.width/2, y - Camera.y + GAME.height/2, gridSize, gridSize);
                    }
                }
            }

            // Draw World Bounds (Fence simulation)
            ctx.strokeStyle = '#27272a'; // dark bound
            ctx.lineWidth = 10;
            ctx.strokeRect(-Camera.x + GAME.width/2, -Camera.y + GAME.height/2, GAME.worldSize, GAME.worldSize);

            SellZone.draw(ctx);
            
            // Draw Entities (Z-sorting based on Y coordinate)
            const renderables = [Player, ...Trees, ...Logs].sort((a, b) => a.y - b.y);
            
            for (let obj of renderables) {
                obj.draw(ctx);
            }

            Particles.forEach(p => p.draw(ctx));
        }

        // Start Game
        InitWorld();
        requestAnimationFrame(GameLoop);

    </script>
</body>
</html>
