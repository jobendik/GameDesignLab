<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>COSMIC DEVOURER ARENA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family: "Arial Black", system-ui, sans-serif; }
    canvas { display:block; cursor:none; }

    #hud {
      position:absolute; top:20px; left:20px;
      color:#fff; font-size:20px; font-weight:900;
      text-shadow:0 0 10px #00ffff;
      pointer-events:none; z-index:10;
      line-height: 1.2;
    }

    #level-up {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%) scale(0);
      color:#ffff00; font-size:140px; font-weight:900;
      text-shadow:0 0 50px #ff0000, 0 0 100px #ff0000;
      pointer-events:none; z-index:100;
    }
    #level-up.show { animation: levelup 0.5s ease-out; }
    @keyframes levelup {
      0% { transform:translate(-50%,-50%) scale(0); }
      50% { transform:translate(-50%,-50%) scale(1.25); }
      100% { transform:translate(-50%,-50%) scale(1); }
    }

    #leaderboard {
      position:absolute; top:20px; right:20px;
      background:rgba(0,0,0,0.8);
      padding:14px; border-radius:12px;
      border:3px solid #00ffff;
      color:#fff; min-width:260px;
      font-size:14px;
      box-shadow:0 0 30px rgba(0,255,255,0.5);
      z-index: 10;
    }
    #leaderboard h3 {
      margin-bottom:10px;
      color:#ffff00; text-align:center;
      text-shadow:0 0 10px #ffff00;
      font-size:18px;
    }
    .lb-entry {
      padding:8px; margin:5px 0;
      display:flex; justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,0.22);
      font-size:15px;
    }
    .lb-entry.you {
      background:linear-gradient(90deg, rgba(0,255,255,0.25), rgba(255,0,255,0.25));
      border-radius:6px;
      border:2px solid #00ffff;
      box-shadow:0 0 20px rgba(0,255,255,0.45);
    }
    .lb-entry.top1 { color:#FFD700; }
    .lb-entry.top2 { color:#C0C0C0; }
    .lb-entry.top3 { color:#CD7F32; }

    #kill-feed {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:99;
      width:min(900px, 95vw);
      text-align:center;
    }
    .kill-msg {
      color:#ff2b2b;
      font-size:54px;
      font-weight:900;
      text-shadow:0 0 20px #ff0000, 0 0 40px #ff0000;
      animation: kill-fade 1.9s ease-out forwards;
      letter-spacing: 1px;
      margin: 6px 0;
    }
    @keyframes kill-fade {
      0% { opacity:1; transform:scale(0.55); filter:blur(0px); }
      20% { transform:scale(1.18); }
      100% { opacity:0; transform:scale(1) translateY(-110px); filter:blur(0.6px); }
    }

    #xp-bar-container {
      position:absolute; bottom:26px; left:50%;
      transform:translateX(-50%);
      width:min(460px, 90vw);
      height:32px;
      background:rgba(0,0,0,0.82);
      border:3px solid #00ffff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 0 22px rgba(0,255,255,0.55);
      z-index: 10;
    }
    #xp-bar {
      height:100%;
      background:linear-gradient(90deg, #00ffff, #ff00ff, #ffff00);
      width:0%;
      transition:width 0.18s linear;
      box-shadow:0 0 20px rgba(255,255,255,0.8);
      transform-origin:left center;
    }
    #xp-bar.pop { animation: xppop 0.22s ease-out; }
    @keyframes xppop { 0% { transform:scaleY(1); } 50% { transform:scaleY(1.18); } 100% { transform:scaleY(1); } }

    #xp-text {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      color:#fff; font-weight:900;
      text-shadow:0 0 6px #000;
      font-size:16px;
      white-space: nowrap;
    }

    .loot-number {
      position:absolute;
      color:#ffff00;
      font-size:32px;
      font-weight:900;
      pointer-events:none;
      text-shadow:0 0 10px #ff0000;
      animation: loot-float 1s ease-out forwards;
      z-index: 50;
      will-change: transform, opacity;
    }
    @keyframes loot-float {
      0% { opacity:1; transform:translate3d(0,0,0) scale(0.55); }
      50% { transform:translate3d(0,-30px,0) scale(1.22); }
      100% { opacity:0; transform:translate3d(0,-80px,0) scale(1); }
    }
    .jackpot {
      font-size:64px !important;
      color:#ff00ff !important;
      text-shadow:0 0 30px #ffff00 !important;
      animation: jackpot-float 1.5s ease-out forwards !important;
    }
    @keyframes jackpot-float {
      0% { opacity:1; transform:translate3d(0,0,0) scale(0.55) rotate(0deg); }
      50% { transform:translate3d(0,-50px,0) scale(1.55) rotate(180deg); }
      100% { opacity:0; transform:translate3d(0,-120px,0) scale(1) rotate(360deg); }
    }

    /* Minimal friction entry */
    #start-overlay {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at center, rgba(0,255,255,0.12), rgba(0,0,0,0.92) 60%);
      z-index: 200;
      cursor:pointer;
      user-select:none;
    }
    #start-card {
      padding: 26px 26px 22px;
      border-radius: 18px;
      border: 3px solid rgba(0,255,255,0.85);
      background: rgba(0,0,0,0.72);
      box-shadow: 0 0 45px rgba(0,255,255,0.35);
      text-align:center;
      width: min(560px, 92vw);
    }
    #start-title {
      font-size: 44px;
      color: #ffff00;
      text-shadow: 0 0 16px rgba(255,255,0,0.75);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    #start-sub {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      line-height: 1.45;
      text-shadow: 0 0 10px rgba(0,255,255,0.25);
      margin-bottom: 16px;
      font-weight: 800;
    }
    #start-cta {
      display:inline-block;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(0,255,255,0.9), rgba(255,0,255,0.9));
      color: #000;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 0 28px rgba(255,255,255,0.18);
      transform: translateZ(0);
      animation: ctaPulse 1.1s ease-in-out infinite;
    }
    @keyframes ctaPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>💰 LOOT: <span id="score">0</span></div>
    <div>⚡ LVL: <span id="level">1</span></div>
    <div>🌟 SIZE: <span id="size">15</span></div>
    <div>🔥 COMBO: <span id="combo">x1</span></div>
  </div>

  <div id="level-up">LEVEL UP!</div>

  <div id="leaderboard">
    <h3>🏆 THIS ARENA</h3>
    <div id="lb-content"></div>
  </div>

  <div id="kill-feed"></div>

  <div id="xp-bar-container">
    <div id="xp-bar"></div>
    <div id="xp-text">XP: <span id="xp-current">0</span> / <span id="xp-needed">100</span></div>
  </div>

  <div id="start-overlay">
    <div id="start-card">
      <div id="start-title">COSMIC DEVOURER</div>
      <div id="start-sub">
        Move = mouse. Devour smaller. Avoid larger.<br/>
        Chain kills for <span style="color:#ff00ff">COMBO</span> multiplier.
      </div>
      <div id="start-cta">CLICK TO ENTER</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Crisp rendering
    let DPR = Math.min(2, window.devicePixelRatio || 1);
    function resize() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(window.innerWidth * DPR);
      canvas.height = Math.floor(window.innerHeight * DPR);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();

    // Audio (safe)
    const AudioContextRef = window.AudioContext || window.webkitAudioContext;
    const audioCtx = AudioContextRef ? new AudioContextRef() : null;

    function playSound(freq, duration, type = 'sine', volume = 0.2) {
      if (!audioCtx) return;
      if (audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        const t = audioCtx.currentTime;
        gain.gain.setValueAtTime(Math.max(0.0001, volume), t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.start(t);
        osc.stop(t + duration);
      } catch {}
    }

    function playLevelUpSound() {
      playSound(420, 0.09, 'square', 0.28);
      setTimeout(() => playSound(640, 0.09, 'square', 0.28), 90);
      setTimeout(() => playSound(880, 0.09, 'square', 0.28), 180);
      setTimeout(() => playSound(1280, 0.26, 'sine', 0.32), 260);
    }

    // Game State
    const game = {
      score: 0,
      xp: 0,
      level: 1,
      xpNeeded: 100,
      kills: 0,
      screenShake: 0,
      hue: 180,
      time: 0,
      freeze: 0,
      started: false,

      // Dopamine glue: combo
      combo: 1,
      comboTimer: 0,     // frames remaining
      comboMax: 12,
    };

    // Bot names
    const botNames = [
      'NEBULA_KING','VOID_HUNTER','STAR_EATER','COSMIC_ACE',
      'DARK_MATTER','QUASAR_LORD','NOVA_BLAST','BLACK_HOLE',
      'ASTEROID_GOD','METEOR_STORM','GALAXY_REAPER','SPACE_DEMON',
      'STELLAR_BEAST','ORBIT_KILLER','WARP_MASTER','QUANTUM_RAGE',
      'PHOTON_STRIKE','ECLIPSE_SHADOW','COMET_FURY','PLASMA_WOLF',
      'GRAVITY_BEAST','PULSAR_DOOM','NEUTRON_FANG','COSMOS_KING'
    ];

    // Player
    const player = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      vx: 0,
      vy: 0,
      radius: 15,
      speed: 5,
      trail: [],
      name: 'YOU',
      damageBoost: 1,
      sizeBoost: 1
    };

    // Mouse
    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    // Particles (soft cap)
    const particles = [];
    const MAX_PARTICLES = 900;

    class Particle {
      constructor(x, y, vx, vy, color, life = 60, radius = 3) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.life = life; this.maxLife = life;
        this.radius = radius;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.life--;
      }
      draw() {
        const alpha = this.life / this.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 14;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    // Gems
    const gems = [];
    class Gem {
      constructor(x, y, value = 1) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8 - 2;
        this.radius = 4 + value * 2;
        this.value = value;
        this.life = 320;
        this.hue = value > 5 ? 280 : (value > 2 ? 45 : 120);
        this.gravity = 0.15;
        this.bounce = 0.7;
        this.magnetRange = 155;
      }
      update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98;

        const W = window.innerWidth, H = window.innerHeight;

        if (this.y > H - this.radius) { this.y = H - this.radius; this.vy *= -this.bounce; this.vx *= 0.9; }
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -this.bounce; }
        if (this.x > W - this.radius) { this.x = W - this.radius; this.vx *= -this.bounce; }

        // Magnet
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (dist < this.magnetRange) {
          const force = (this.magnetRange - dist) / this.magnetRange * 0.55;
          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;
        }

        this.life--;
        return this.life > 0;
      }
      draw() {
        const pulse = Math.sin((Date.now() + this.value * 97) * 0.012) * 0.22 + 1;
        const r = this.radius * pulse;

        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r * 2);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 1)`);
        gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 50%, 0.82)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r * 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.beginPath();
        ctx.arc(this.x - r * 0.32, this.y - r * 0.32, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Enemies
    const enemies = [];
    class Enemy {
      constructor(isBot = false) {
        const W = window.innerWidth, H = window.innerHeight;
        const side = (Math.random() * 4) | 0;
        if (side === 0) { this.x = Math.random() * W; this.y = -50; }
        else if (side === 1) { this.x = W + 50; this.y = Math.random() * H; }
        else if (side === 2) { this.x = Math.random() * W; this.y = H + 50; }
        else { this.x = -50; this.y = Math.random() * H; }

        // Rubber band: keep arena spicy
        const base = 10 + Math.random() * 15;
        const levelBias = Math.min(18, game.level * 0.8);
        this.radius = base + (Math.random() < 0.35 ? levelBias : 0);
        this.mass = this.radius;
        this.speed = 2.6 - (this.radius / 34);
        this.hue = Math.random() * 360;
        this.vx = 0; this.vy = 0;
        this.isBot = isBot;
        this.name = isBot ? botNames[(Math.random() * botNames.length) | 0] : 'PLAYER';
        this.score = Math.floor(this.radius * 50);
      }
      update() {
        const W = window.innerWidth, H = window.innerHeight;

        // Target logic: chase what you can eat, flee what can eat you, else farm gems
        let targetX = player.x, targetY = player.y;
        let mode = "CHASE";

        if (this.radius < player.radius * 0.82) {
          // Too small: farm nearest gem
          mode = "FARM";
          if (gems.length > 0) {
            let nearest = null;
            let best = 1e9;
            for (let i = 0; i < gems.length; i++) {
              const g = gems[i];
              const d = Math.hypot(g.x - this.x, g.y - this.y);
              if (d < best) { best = d; nearest = g; }
            }
            if (nearest) { targetX = nearest.x; targetY = nearest.y; }
          }
        } else if (this.radius < player.radius * 1.12) {
          // Similar size: orbit slightly (adds chaos)
          mode = "ORBIT";
          const dx = player.x - this.x, dy = player.y - this.y;
          const ang = Math.atan2(dy, dx) + (this.hue % 2 ? 0.65 : -0.65);
          targetX = player.x + Math.cos(ang) * 140;
          targetY = player.y + Math.sin(ang) * 140;
        } else {
          // Bigger: chase harder
          mode = "CHASE";
          targetX = player.x; targetY = player.y;
        }

        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.hypot(dx, dy) || 1;

        const accel = (mode === "CHASE" ? 0.17 : mode === "ORBIT" ? 0.145 : 0.14);
        this.vx += (dx / dist) * accel;
        this.vy += (dy / dist) * accel;

        const vel = Math.hypot(this.vx, this.vy) || 1;
        const maxV = Math.max(1.15, this.speed);
        if (vel > maxV) { this.vx = (this.vx / vel) * maxV; this.vy = (this.vy / vel) * maxV; }

        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;

        if (this.x < -this.radius) this.x = W + this.radius;
        if (this.x > W + this.radius) this.x = -this.radius;
        if (this.y < -this.radius) this.y = H + this.radius;
        if (this.y > H + this.radius) this.y = -this.radius;
      }
      draw() {
        const glowR = this.radius * 1.55;
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
        gradient.addColorStop(0, `hsl(${this.hue}, 100%, 62%)`);
        gradient.addColorStop(0.7, `hsl(${this.hue}, 100%, 38%)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 38%, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `hsl(${this.hue}, 100%, 82%)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        if (this.radius > 20) {
          ctx.fillStyle = 'rgba(0,0,0,0.62)';
          ctx.font = '900 12px Arial';
          ctx.textAlign = 'center';
          const text = this.name;
          const w = ctx.measureText(text).width;
          ctx.fillRect(this.x - w/2 - 4, this.y - this.radius - 25, w + 8, 16);
          ctx.fillStyle = '#fff';
          ctx.fillText(text, this.x, this.y - this.radius - 12);
        }
      }
    }

    function checkCollision(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx, dy);
      return dist < a.radius + b.radius;
    }

    function createExplosion(x, y, color, count = 30, size = 1) {
      const budget = Math.max(0, MAX_PARTICLES - particles.length);
      const n = Math.min(count, budget);
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 10 + 5;
        particles.push(new Particle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          color,
          34 + Math.random() * 24,
          size * (3 + Math.random() * 4)
        ));
      }
    }

    function createLootShower(x, y, value) {
      // Slightly more jackpots as combo rises (feels “hot”)
      const jackpotChance = Math.min(0.28, 0.12 + game.combo * 0.012);
      const isJackpot = Math.random() < jackpotChance;

      const gemCount = isJackpot ? 16 + ((Math.random() * 10) | 0) : 3 + ((Math.random() * 5) | 0);
      const gemValue = isJackpot ? 5 + ((Math.random() * 5) | 0) : 1 + ((Math.random() * 2) | 0);

      for (let i = 0; i < gemCount; i++) gems.push(new Gem(x, y, gemValue));

      if (isJackpot) {
        playSound(1200, 0.24, 'sine', 0.32);
        playSound(1600, 0.24, 'sine', 0.30);
      } else {
        playSound(820 + Math.random() * 420, 0.085, 'triangle', 0.22);
      }
    }

    function showKillFeed(enemyName, gained) {
      const feed = document.getElementById('kill-feed');
      const msg = document.createElement('div');
      msg.className = 'kill-msg';
      msg.textContent = `☠ DEVOUR ${enemyName} ☠  +${gained}  🔥 x${game.combo}`;
      feed.appendChild(msg);
      setTimeout(() => msg.remove(), 1900);
    }

    function showLootNumber(x, y, value) {
      const isJackpot = value >= 120;
      const popup = document.createElement('div');
      popup.className = isJackpot ? 'loot-number jackpot' : 'loot-number';
      popup.textContent = isJackpot ? `💎 JACKPOT +${value} 💎` : `+${value}`;
      popup.style.left = (x | 0) + 'px';
      popup.style.top = (y | 0) + 'px';
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), isJackpot ? 1500 : 1000);
    }

    function updateComboUI() {
      document.getElementById('combo').textContent = 'x' + game.combo;
    }

    function bumpCombo() {
      game.combo = Math.min(game.comboMax, game.combo + 1);
      game.comboTimer = 240; // ~4s at 60fps
      updateComboUI();
    }

    function decayCombo() {
      if (game.comboTimer > 0) {
        game.comboTimer--;
        if (game.comboTimer === 0) {
          game.combo = 1;
          updateComboUI();
        }
      }
    }

    function levelUp() {
      game.level++;
      game.freeze = 12; // short hit-stop (feels powerful without feeling like lag)

      const levelUpEl = document.getElementById('level-up');
      levelUpEl.classList.remove('show');
      void levelUpEl.offsetWidth;
      levelUpEl.classList.add('show');

      playLevelUpSound();

      // Upgrade: slightly biased towards "size" early, "speed" later
      const r = Math.random() + Math.min(0.4, game.level * 0.02);
      let upgrade = 'damage';
      if (r < 0.38) upgrade = 'size';
      else if (r < 0.72) upgrade = 'speed';

      if (upgrade === 'damage') player.damageBoost += 0.2;
      else if (upgrade === 'size') { player.sizeBoost += 0.1; player.radius += 2; }
      else player.speed += 0.32;

      game.screenShake = Math.max(game.screenShake, 22);
      document.getElementById('level').textContent = game.level;

      setTimeout(() => levelUpEl.classList.remove('show'), 520);
    }

    function updateLeaderboard() {
      const lb = document.getElementById('lb-content');
      const allPlayers = [
        { name: player.name, score: game.score, isYou: true },
        ...enemies.map(e => ({ name: e.name, score: e.score, isYou: false }))
      ].sort((a,b) => b.score - a.score).slice(0, 10);

      lb.innerHTML = allPlayers.map((p,i) => {
        let className = 'lb-entry';
        if (p.isYou) className += ' you';
        else if (i === 0) className += ' top1';
        else if (i === 1) className += ' top2';
        else if (i === 2) className += ' top3';
        return `<div class="${className}">
          <span>#${i+1} ${p.name}</span>
          <span>${Math.floor(p.score)}</span>
        </div>`;
      }).join('');
    }

    function updateXPBar() {
      const percent = Math.min(100, (game.xp / game.xpNeeded) * 100);
      const bar = document.getElementById('xp-bar');
      bar.style.width = percent + '%';
      document.getElementById('xp-current').textContent = Math.floor(game.xp);
      document.getElementById('xp-needed').textContent = game.xpNeeded;

      bar.classList.remove('pop');
      void bar.offsetWidth;
      bar.classList.add('pop');

      if (game.xp >= game.xpNeeded) {
        game.xp = 0;
        game.xpNeeded = Math.floor(game.xpNeeded * 1.52);
        levelUp();
      }
    }

    function addXP(amount) {
      game.xp += amount;
      updateXPBar();
    }

    function growPlayer(amount) {
      player.radius += amount * player.sizeBoost;
      player.radius = Math.max(15, Math.min(player.radius, 82));
      document.getElementById('size').textContent = Math.floor(player.radius);
    }

    // “HUNT” arrow: points to best devourable enemy nearby
    function drawHuntArrow() {
      // Find best target you can eat (not too tiny, not offscreen)
      let best = null;
      let bestScore = -1;

      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (player.radius > e.radius * 1.12) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          // Reward: closer + bigger prey
          const s = (e.radius * 10) - d * 0.06;
          if (s > bestScore) { bestScore = s; best = e; }
        }
      }
      if (!best) return;

      const dx = best.x - player.x;
      const dy = best.y - player.y;
      const ang = Math.atan2(dy, dx);

      const arrowDist = Math.min(110, 40 + player.radius);
      const ax = player.x + Math.cos(ang) * arrowDist;
      const ay = player.y + Math.sin(ang) * arrowDist;

      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      const pulse = 0.85 + Math.sin(Date.now() * 0.012) * 0.15;

      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255, 255, 0, 0.85)';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(255,255,0,0.85)';
      ctx.beginPath();
      ctx.moveTo(18 * pulse, 0);
      ctx.lineTo(-10 * pulse, -8 * pulse);
      ctx.lineTo(-5 * pulse, 0);
      ctx.lineTo(-10 * pulse, 8 * pulse);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.restore();

      // label
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.font = '900 12px Arial';
      ctx.textAlign = 'center';
      const lx = ax + Math.cos(ang) * 22;
      const ly = ay + Math.sin(ang) * 22 - 14;
      ctx.fillRect(lx - 26, ly - 12, 52, 16);
      ctx.fillStyle = '#ffff00';
      ctx.fillText('HUNT', lx, ly);
      ctx.restore();
    }

    // Init bots
    for (let i = 0; i < 22; i++) enemies.push(new Enemy(true));

    function spawnEnemy() {
      const cap = 26 + Math.min(10, (game.level / 2) | 0);
      if (enemies.length < cap) enemies.push(new Enemy(true));
    }

    // Start overlay: low friction
    const overlay = document.getElementById('start-overlay');
    overlay.addEventListener('click', async () => {
      game.started = true;
      overlay.style.display = 'none';

      // Pointer lock (optional; gives “arcade focus”)
      try { canvas.requestPointerLock?.(); } catch {}

      // Audio resume
      if (audioCtx && audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch {}
      }

      // Kickoff dopamine immediately
      game.screenShake = 16;
      playSound(880, 0.08, 'square', 0.22);
      playSound(1320, 0.12, 'sine', 0.18);
    }, { once: true });

    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      game.time++;

      // If not started, animate background lightly
      if (!game.started) {
        ctx.fillStyle = 'rgba(0,0,0,1)';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        requestAnimationFrame(gameLoop);
        return;
      }

      // Hit-stop freeze
      if (game.freeze > 0) {
        game.freeze--;
        requestAnimationFrame(gameLoop);
        return;
      }

      // Clear with trails
      ctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      // Screen shake curve
      if (game.screenShake > 0.5) {
        ctx.save();
        const s = game.screenShake;
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
        game.screenShake *= 0.86;
      }

      // Background pulse around player
      const bgGradient = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 560);
      bgGradient.addColorStop(0, `hsla(${game.hue}, 55%, 10%, 0.32)`);
      bgGradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      // Combo decay
      decayCombo();

      // Movement toward mouse
      const dx = mouse.x - player.x;
      const dy = mouse.y - player.y;
      const dist = Math.hypot(dx, dy) || 1;

      if (dist > 5) {
        player.vx += (dx / dist) * 0.62;
        player.vy += (dy / dist) * 0.62;

        const vel = Math.hypot(player.vx, player.vy) || 1;
        if (vel > player.speed) {
          player.vx = (player.vx / vel) * player.speed;
          player.vy = (player.vy / vel) * player.speed;
        }
      }

      player.vx *= 0.92;
      player.vy *= 0.92;
      player.x += player.vx;
      player.y += player.vy;

      const W = window.innerWidth, H = window.innerHeight;
      if (player.x < -player.radius) player.x = W + player.radius;
      if (player.x > W + player.radius) player.x = -player.radius;
      if (player.y < -player.radius) player.y = H + player.radius;
      if (player.y > H + player.radius) player.y = -player.radius;

      // Trail
      const pVel = Math.hypot(player.vx, player.vy);
      if (pVel > 1) {
        player.trail.push({ x: player.x, y: player.y, hue: game.hue });
        if (player.trail.length > 22) player.trail.shift();
      }

      // Update gems
      for (let i = gems.length - 1; i >= 0; i--) if (!gems[i].update()) gems.splice(i, 1);

      // Collect gems
      for (let i = gems.length - 1; i >= 0; i--) {
        if (checkCollision(player, gems[i])) {
          const value = gems[i].value;

          // Combo lightly boosts gem reward too (feels “hot”)
          const comboBonus = 1 + (game.combo - 1) * 0.08;
          const scoreGain = Math.floor(value * 10 * comboBonus);

          game.score += scoreGain;
          addXP(value * 5);
          growPlayer(value * 0.5);

          showLootNumber(gems[i].x, gems[i].y, scoreGain);
          createExplosion(gems[i].x, gems[i].y, `hsl(${gems[i].hue}, 100%, 60%)`, 10, 0.8);

          playSound(1000 + value * 220 + Math.random() * 100, 0.08, 'sine', 0.24);

          gems.splice(i, 1);
          game.hue = (game.hue + 6) % 360;
        }
      }

      // Update enemies
      for (let i = 0; i < enemies.length; i++) enemies[i].update();

      // Enemy collect gems
      for (let i = gems.length - 1; i >= 0; i--) {
        for (let j = 0; j < enemies.length; j++) {
          if (checkCollision(enemies[j], gems[i])) {
            enemies[j].score += gems[i].value * 10;
            enemies[j].radius += gems[i].value * 0.3;
            enemies[j].radius = Math.min(enemies[j].radius, 62);
            gems.splice(i, 1);
            break;
          }
        }
      }

      // Player vs enemy collisions
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (checkCollision(player, enemy)) {
          if (player.radius > enemy.radius * 1.15) {
            // DEVOUR
            bumpCombo();

            const base = Math.floor(enemy.radius * 5);
            const gained = Math.floor(base * (1 + (game.combo - 1) * 0.22));

            game.score += gained;
            game.kills++;

            addXP(enemy.radius * 2 + game.combo * 2);
            growPlayer(enemy.radius * 0.22);

            createExplosion(enemy.x, enemy.y, `hsl(${enemy.hue}, 100%, 60%)`, 46, 2.1);
            createLootShower(enemy.x, enemy.y, gained);
            showKillFeed(enemy.name, gained);

            // Hit-stop + shake = “power”
            game.freeze = 5;
            game.screenShake = Math.max(game.screenShake, 18);

            playSound(320 + player.radius * 5, 0.18, 'sawtooth', 0.28);
            playSound(720 + game.combo * 55, 0.08, 'square', 0.16);

            enemies.splice(i, 1);
            spawnEnemy();
          } else if (player.radius * 1.15 < enemy.radius) {
            // GET HIT
            game.screenShake = Math.max(game.screenShake, 26);
            playSound(150, 0.36, 'sawtooth', 0.30);

            // Combo breaks on getting hit (stakes)
            game.combo = 1;
            game.comboTimer = 0;
            updateComboUI();

            if (player.radius > 15) player.radius = Math.max(15, player.radius * 0.84);
          }
        }
      }

      // Enemy vs enemy absorption
      for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = i - 1; j >= 0; j--) {
          if (checkCollision(enemies[i], enemies[j])) {
            if (enemies[i].radius > enemies[j].radius * 1.2) {
              enemies[i].radius += enemies[j].radius * 0.2;
              enemies[i].score += enemies[j].score * 0.5;
              enemies.splice(j, 1);
              i--;
              spawnEnemy();
              break;
            } else if (enemies[j].radius > enemies[i].radius * 1.2) {
              enemies[j].radius += enemies[i].radius * 0.2;
              enemies[j].score += enemies[i].score * 0.5;
              enemies.splice(i, 1);
              spawnEnemy();
              break;
            }
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Spawn gems: scales with level, and spikes a bit when combo is high
      const gemRate = 0.028 + Math.min(0.02, game.level * 0.0015) + Math.min(0.02, (game.combo - 1) * 0.0025);
      if (Math.random() < gemRate) {
        const bigChance = Math.min(0.18, 0.06 + game.level * 0.004);
        const value = Math.random() < bigChance ? (2 + ((Math.random() * 3) | 0)) : 1;
        gems.push(new Gem(Math.random() * W, Math.random() * H, value));
      }

      // Spawn enemies: scales with level
      if (game.time % Math.max(90, 180 - game.level * 6) === 0) spawnEnemy();

      // Leaderboard
      if (game.time % 28 === 0) updateLeaderboard();

      // Draw player trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const alpha = (i / player.trail.length) * 0.52;
        const size = player.radius * (0.55 + (i / player.trail.length) * 0.55);

        ctx.globalAlpha = alpha;
        const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, size);
        grad.addColorStop(0, `hsl(${t.hue}, 100%, 60%)`);
        grad.addColorStop(1, `hsla(${t.hue}, 100%, 60%, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Draw gems
      for (let i = 0; i < gems.length; i++) gems[i].draw();

      // Draw enemies
      for (let i = 0; i < enemies.length; i++) enemies[i].draw();

      // Draw particles
      for (let i = 0; i < particles.length; i++) particles[i].draw();

      // Draw player glow
      const playerGradient = ctx.createRadialGradient(
        player.x, player.y, player.radius,
        player.x, player.y, player.radius * 2.6
      );
      playerGradient.addColorStop(0, `hsla(${game.hue}, 100%, 72%, 1)`);
      playerGradient.addColorStop(0.5, `hsla(${game.hue}, 100%, 50%, 0.62)`);
      playerGradient.addColorStop(1, `hsla(${game.hue}, 100%, 50%, 0)`);

      ctx.fillStyle = playerGradient;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius * 2.6, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Name tag
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.font = '900 14px Arial';
      ctx.textAlign = 'center';
      const tw = ctx.measureText('YOU').width;
      ctx.fillRect(player.x - tw/2 - 5, player.y - player.radius - 28, tw + 10, 18);
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ffff';
      ctx.fillText('YOU', player.x, player.y - player.radius - 13);
      ctx.shadowBlur = 0;

      // HUNT helper (goal clarity)
      drawHuntArrow();

      if (game.screenShake > 0.5) ctx.restore();

      // UI
      document.getElementById('score').textContent = Math.floor(game.score);

      requestAnimationFrame(gameLoop);
    }

    // Kick off
    updateLeaderboard();
    updateXPBar();
    updateComboUI();
    requestAnimationFrame(gameLoop);

    window.addEventListener('resize', () => { resize(); });

    // Optional: escape exits pointer lock
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        try { document.exitPointerLock?.(); } catch {}
      }
    });
  </script>
</body>
