<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonar.io - Silent Hunter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000510; /* Dypt hav */
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Radar scan effekt overlay */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 100, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 100, 0.2);
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .status-box {
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid #0044aa;
            padding: 10px 20px;
            border-radius: 5px;
            color: #00aaff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 68, 170, 0.3);
            text-shadow: 0 0 5px #00aaff;
        }

        .controls {
            padding: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            pointer-events: auto;
        }

        .action-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .btn-sonar {
            background: radial-gradient(circle, rgba(0,255,100,0.4) 0%, rgba(0,50,20,0.8) 100%);
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.3);
        }
        .btn-sonar:active { transform: scale(0.95); background: #00ff66; color: black; }
        .btn-sonar.cooldown { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        .btn-fire {
            background: radial-gradient(circle, rgba(255,50,50,0.4) 0%, rgba(50,0,0,0.8) 100%);
            border-color: #ff3333;
            box-shadow: 0 0 20px rgba(255, 50, 50, 0.3);
        }
        .btn-fire:active { transform: scale(0.95); background: #ff3333; color: white; }

        #alert-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            color: #ff3333;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 20px red;
            opacity: 0;
            transition: opacity 0.2s;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }

        #joystick-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%; /* Øvre del av skjermen er for styring */
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="scan-line"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="status-box">DEPTH: <span id="depth">240</span>m</div>
            <div class="status-box">HULL: <span id="health">100</span>%</div>
            <div class="status-box" style="color:#ffcc00">SCORE: <span id="score">0</span></div>
        </div>

        <div id="alert-msg">SONAR DETECTED!</div>

        <!-- Usynlig sone for å dra fingeren for å styre -->
        <div id="joystick-zone"></div>

        <div class="controls">
            <div class="action-btn btn-sonar" id="btn-sonar">
                PING<br><span style="font-size:0.7em">(Reveal)</span>
            </div>
            <div style="color:rgba(255,255,255,0.5); font-size: 0.8em; text-align: center;">
                DRA PÅ SKJERMEN<br>FOR Å STYRE
            </div>
            <div class="action-btn btn-fire" id="btn-fire">
                TORPEDO<br><span style="font-size:0.7em">(Fire)</span>
            </div>
        </div>
    </div>

    <script>
    (function() { // Start IIFE for å isolere scope
        // --- Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const joystickZone = document.getElementById('joystick-zone');
        
        let width, height;
        let lastTime = 0;
        
        // Spilltilstand
        const WORLD_SIZE = 3000;
        let camX = 0, camY = 0;
        let score = 0;
        
        // Input
        let inputX = 0, inputY = 0; // Virtuell joystick posisjon
        let isTouching = false;
        let touchStartX = 0, touchStartY = 0;

        // Farger og stiler
        const C = {
            sea: '#000510',
            grid: '#001133',
            player: '#00ccff',
            enemyHidden: 'rgba(0,0,0,0)', // Helt usynlig
            enemyPinged: '#ff3333',       // Rød når oppdaget
            sonarPulse: '#00ff66',
            enemyPulse: '#ff3333',
            torpedo: '#ffffaa'
        };

        // --- Klasser ---

        class Submarine {
            constructor(x, y, isPlayer) {
                this.x = x;
                this.y = y;
                this.isPlayer = isPlayer;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0;
                this.maxSpeed = isPlayer ? 100 : 80; // Piksler per sekund
                this.turnSpeed = 1.5;
                this.health = 100;
                
                // Stealth mechanics
                this.visibleTimer = 0; // Hvor lenge er denne synlig for spilleren?
                this.isPinged = false;
            }

            update(dt) {
                // Fysikk
                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;

                // Grenser
                if(this.x < -WORLD_SIZE) this.x = -WORLD_SIZE;
                if(this.x > WORLD_SIZE) this.x = WORLD_SIZE;
                if(this.y < -WORLD_SIZE) this.y = -WORLD_SIZE;
                if(this.y > WORLD_SIZE) this.y = WORLD_SIZE;

                // AI eller Input
                if(this.isPlayer) {
                    if(isTouching) {
                        // Enkel joystick logikk
                        const dx = inputX - touchStartX;
                        const dy = inputY - touchStartY;
                        const dist = Math.hypot(dx, dy);
                        
                        if(dist > 10) {
                            const targetAngle = Math.atan2(dy, dx);
                            // Myk sving
                            let diff = targetAngle - this.angle;
                            while (diff < -Math.PI) diff += Math.PI * 2;
                            while (diff > Math.PI) diff -= Math.PI * 2;
                            this.angle += diff * 5 * dt;
                            
                            // Fart basert på hvor langt man drar
                            const targetSpeed = Math.min(dist * 2, this.maxSpeed);
                            this.speed += (targetSpeed - this.speed) * 2 * dt;
                        }
                    } else {
                        // Sakte ned hvis man slipper
                        this.speed *= 0.95;
                    }
                } else {
                    // Bot AI
                    this.aiBehavior(dt);
                    
                    // Synlighet nedtelling
                    if(this.visibleTimer > 0) {
                        this.visibleTimer -= dt;
                        this.isPinged = true;
                    } else {
                        this.isPinged = false;
                    }
                }
            }

            aiBehavior(dt) {
                // Enkel patruljering
                this.speed = this.maxSpeed * 0.5;
                
                // Snu sakte
                this.angle += (Math.sin(Date.now() / 1000 + this.x) * 0.5) * dt;
                
                // Tilfeldig skyting og pinging for effekt
                if(Math.random() < 0.005) {
                    // Bot pinger (skaper en rød bølge spilleren kan se)
                    pulses.push(new Pulse(this.x, this.y, 600, false));
                }
            }

            draw(ctx) {
                // Hovedlogikk: Hvis det er en fiende, er den synlig?
                if(!this.isPlayer && !this.isPinged) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Skygge/Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.isPlayer ? C.player : C.enemyPinged;

                // Tegn Ubåt form
                ctx.fillStyle = this.isPlayer ? C.player : C.enemyPinged;
                
                // Kropp
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 8, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Tårn
                ctx.beginPath();
                ctx.rect(-5, -8, 8, 6);
                ctx.fill();

                // Periskop/Detaljer
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(5, -2, 10, 4);

                // Hvis fiende er pinged, tegn en "target" markør rundt
                if(!this.isPlayer && this.isPinged) {
                    ctx.strokeStyle = '#ff3333';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI*2);
                    ctx.stroke();
                    // Tekst
                    ctx.fillStyle = '#ff3333';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 0;
                    ctx.fillText(`TARGET LOCKED`, 0, -35);
                }

                ctx.restore();
            }
        }

        class Pulse {
            constructor(x, y, maxRadius, isPlayerOwner) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = maxRadius;
                this.isPlayerOwner = isPlayerOwner;
                this.speed = 300; // Piksler per sekund
                this.dead = false;
                this.color = isPlayerOwner ? C.sonarPulse : C.enemyPulse;
            }

            update(dt) {
                this.radius += this.speed * dt;
                if(this.radius >= this.maxRadius) {
                    this.dead = true;
                }

                // Sjekk treff
                if(this.isPlayerOwner) {
                    // Hvis dette er MIN ping, sjekk om den treffer fiender
                    enemies.forEach(e => {
                        const dist = Math.hypot(e.x - this.x, e.y - this.y);
                        // Hvis bølgen treffer fienden (med litt margin)
                        if(Math.abs(dist - this.radius) < 20) {
                            e.visibleTimer = 3.0; // Synlig i 3 sekunder
                        }
                    });
                } else {
                    // Fiendtlig ping treffer MEG
                    const dist = Math.hypot(player.x - this.x, player.y - this.y);
                    if(Math.abs(dist - this.radius) < 20) {
                        triggerAlert();
                    }
                }
            }

            draw(ctx) {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                // Fade out mot slutten
                ctx.globalAlpha = 1 - (this.radius / this.maxRadius);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.globalAlpha = 1;
            }
        }

        class Torpedo {
            constructor(x, y, angle, isPlayerOwner) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 200;
                this.vy = Math.sin(angle) * 200;
                this.isPlayerOwner = isPlayerOwner;
                this.life = 4.0;
                this.dead = false;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                if(this.life <= 0) this.dead = true;

                // Boble spor
                if(Math.random() < 0.3) {
                    particles.push(new Particle(this.x, this.y));
                }
                
                // Kollisjon
                if(this.isPlayerOwner) {
                    enemies.forEach(e => {
                        if(Math.hypot(e.x - this.x, e.y - this.y) < 20) {
                            // Hit!
                            this.dead = true;
                            createExplosion(e.x, e.y);
                            respawnEnemy(e);
                            score += 100;
                            document.getElementById('score').innerText = score;
                        }
                    });
                }
            }

            draw(ctx) {
                ctx.fillStyle = C.torpedo;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 1.0;
                this.dead = false;
            }
            update(dt) {
                this.life -= dt;
                if(this.life<=0) this.dead = true;
                this.y -= 10 * dt; // Bobler stiger
            }
            draw(ctx) {
                ctx.fillStyle = `rgba(255,255,255,${this.life * 0.5})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        class ExplosionParticle extends Particle {
            constructor(x, y) {
                super(x, y);
                this.vx = (Math.random()-0.5)*100;
                this.vy = (Math.random()-0.5)*100;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt * 2;
                if(this.life <= 0) this.dead = true;
            }
            draw(ctx) {
                ctx.fillStyle = `rgba(255,100,0,${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2 + Math.random()*2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- Globale lister ---
        let player;
        let enemies = [];
        let pulses = [];
        let torpedoes = [];
        let particles = [];

        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            // Player
            player = new Submarine(0, 0, true);
            
            // Enemies
            for(let i=0; i<10; i++) {
                enemies.push(new Submarine(Math.random()*1000 - 500, Math.random()*1000 - 500, false));
            }

            // Touch Joystick logic
            joystickZone.addEventListener('touchstart', e => {
                e.preventDefault();
                isTouching = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                inputX = touchStartX;
                inputY = touchStartY;
            }, {passive: false});

            joystickZone.addEventListener('touchmove', e => {
                e.preventDefault();
                inputX = e.touches[0].clientX;
                inputY = e.touches[0].clientY;
            }, {passive: false});

            joystickZone.addEventListener('touchend', () => {
                isTouching = false;
            });

            // Mus fallback
            joystickZone.addEventListener('mousedown', e => {
                isTouching = true;
                touchStartX = e.clientX;
                touchStartY = e.clientY;
                inputX = touchStartX;
                inputY = touchStartY;
            });
            window.addEventListener('mousemove', e => {
                if(isTouching) {
                    inputX = e.clientX;
                    inputY = e.clientY;
                }
            });
            window.addEventListener('mouseup', () => isTouching = false);

            // Knapper
            const sonarBtn = document.getElementById('btn-sonar');
            sonarBtn.addEventListener('click', activateSonar);
            sonarBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activateSonar(); });

            const fireBtn = document.getElementById('btn-fire');
            fireBtn.addEventListener('click', fireTorpedo);
            fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireTorpedo(); });

            requestAnimationFrame(loop);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        function activateSonar() {
            const btn = document.getElementById('btn-sonar');
            if(btn.classList.contains('cooldown')) return;
            
            // Lag bølge
            pulses.push(new Pulse(player.x, player.y, 500, true));
            
            // Cooldown visual
            btn.classList.add('cooldown');
            setTimeout(() => btn.classList.remove('cooldown'), 3000);
        }

        function fireTorpedo() {
            torpedoes.push(new Torpedo(player.x, player.y, player.angle, true));
        }

        function triggerAlert() {
            const msg = document.getElementById('alert-msg');
            msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, 1500);
        }
        
        function respawnEnemy(e) {
            e.x = player.x + (Math.random()-0.5)*1500;
            e.y = player.y + (Math.random()-0.5)*1500;
            if(Math.abs(e.x - player.x) < 300) e.x += 400; // Ikke spawn oppå spiller
            e.visibleTimer = 0;
            e.isPinged = false;
        }
        
        function createExplosion(x, y) {
            for(let i=0; i<20; i++) particles.push(new ExplosionParticle(x, y));
        }

        function drawGrid(ctx) {
            ctx.strokeStyle = C.grid;
            ctx.lineWidth = 1;
            const gridSize = 100;
            
            const startX = Math.floor((camX - width/2) / gridSize) * gridSize;
            const endX = startX + width + gridSize;
            const startY = Math.floor((camY - height/2) / gridSize) * gridSize;
            const endY = startY + height + gridSize;

            ctx.beginPath();
            for(let x=startX; x<endX; x+=gridSize) { ctx.moveTo(x, startY); ctx.lineTo(x, endY); }
            for(let y=startY; y<endY; y+=gridSize) { ctx.moveTo(startX, y); ctx.lineTo(endX, y); }
            ctx.stroke();
        }

        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            // Oppdater
            player.update(dt);
            enemies.forEach(e => e.update(dt));
            pulses.forEach(p => p.update(dt));
            torpedoes.forEach(t => t.update(dt));
            particles.forEach(p => p.update(dt));

            // Rydd
            pulses = pulses.filter(p => !p.dead);
            torpedoes = torpedoes.filter(t => !t.dead);
            particles = particles.filter(p => !p.dead);

            // Kamera
            camX += (player.x - camX) * 0.1;
            camY += (player.y - camY) * 0.1;

            // Render
            ctx.fillStyle = C.sea;
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width/2 - camX, height/2 - camY);

            drawGrid(ctx);

            particles.forEach(p => p.draw(ctx));
            enemies.forEach(e => e.draw(ctx)); // Tegnes KUN hvis visibleTimer > 0
            player.draw(ctx);
            torpedoes.forEach(t => t.draw(ctx));
            pulses.forEach(p => p.draw(ctx));

            ctx.restore();
            
            // Update HUD
            document.getElementById('depth').innerText = Math.floor(200 + Math.sin(time/1000)*10);
            document.getElementById('health').innerText = player.health;

            requestAnimationFrame(loop);
        }

        init();
    })(); // Slutt IIFE
    </script>
</body>
</html>
