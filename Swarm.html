<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swarm Logic</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas { display: block; }
        
        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .stats {
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #swarm-count { color: #ff3e3e; }
        #rank { color: #ffd700; font-size: 18px; margin-top: 5px;}

        #intro {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            pointer-events: auto;
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid #333;
        }

        h1 { margin: 0 0 10px 0; font-size: 48px; letter-spacing: -2px; }
        p { color: #aaa; margin-bottom: 30px; }
        
        button {
            background: #ff3e3e;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        .hidden { display: none !important; }
        
        #controls-hint {
            position: absolute; 
            bottom: 30px; 
            width: 100%; 
            text-align: center;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="top-left">
            <div class="stats">SWARM SIZE: <span id="swarm-count">1</span></div>
            <div id="rank">RANK: 1/10</div>
        </div>
        <div id="controls-hint">Mouse/Touch to Move • Click to Compact Swarm</div>
    </div>

    <div id="intro">
        <h1>SWARM LOGIC</h1>
        <p>Collect white bits. Crash into yellow swarms.<br>Size is everything.</p>
        <button id="start-btn">INITIALIZE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONFIG ---
        const WORLD_SIZE = 4000;
        const UNIT_SIZE = 6;
        const UNIT_SPEED = 0.15; // How fast units lerp to position
        const LEADER_SPEED = 4;
        const FOOD_COUNT = 800;
        const BOT_COUNT = 8;
        
        // --- COLORS ---
        const C_PLAYER = '#ff3e3e';
        const C_PLAYER_GLOW = 'rgba(255, 62, 62, 0.4)';
        const C_BOT = '#ffcc00';
        const C_FOOD = '#ffffff';
        const C_BG = '#1a1a1a';
        const C_GRID = '#2a2a2a';

        // --- STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Opt for speed
        
        let width, height;
        let gameState = 'MENU';
        let camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };
        let mouse = { x: 0, y: 0, down: false };
        
        // Entities
        let player = { x: 0, y: 0, units: [], targetRadius: 50, color: C_PLAYER };
        let bots = [];
        let food = [];
        let particles = [];
        
        // Spatial Grid for collision optimization
        let grid = {};
        const GRID_CELL = 100;

        // --- CLASSES ---

        class Unit {
            constructor(x, y, owner) {
                this.x = x;
                this.y = y;
                this.ox = x; // Old position for trail/lerp
                this.oy = y;
                this.owner = owner; // 'player' or bot object
                
                // Offset from leader center (formation)
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random(); 
                this.relX = Math.cos(angle) * dist;
                this.relY = Math.sin(angle) * dist;
            }
        }

        class Bot {
            constructor() {
                this.x = (Math.random() * WORLD_SIZE) - WORLD_SIZE/2;
                this.y = (Math.random() * WORLD_SIZE) - WORLD_SIZE/2;
                this.units = [];
                this.color = C_BOT;
                this.targetRadius = 50;
                this.angle = Math.random() * Math.PI * 2;
                this.timer = 0;
                
                // Start with some units
                let startSize = 10 + Math.floor(Math.random() * 50);
                for(let i=0; i<startSize; i++) {
                    this.units.push(new Unit(this.x, this.y, this));
                }
            }
            
            update() {
                this.timer++;
                
                // Simple AI: Wander and turn
                if (this.timer % 60 === 0) {
                    this.angle += (Math.random() - 0.5) * 2;
                }
                
                // Move Leader
                this.x += Math.cos(this.angle) * (LEADER_SPEED * 0.8);
                this.y += Math.sin(this.angle) * (LEADER_SPEED * 0.8);
                
                // Keep in bounds
                if (this.x < -WORLD_SIZE/2) this.angle = 0;
                if (this.x > WORLD_SIZE/2) this.angle = Math.PI;
                if (this.y < -WORLD_SIZE/2) this.angle = Math.PI/2;
                if (this.y > WORLD_SIZE/2) this.angle = -Math.PI/2;

                updateSwarmPhysics(this);
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.1;
            }
        }

        // --- CORE FUNCTIONS ---

        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            // Input
            window.addEventListener('mousemove', e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mousedown', () => mouse.down = true);
            window.addEventListener('mouseup', () => mouse.down = false);
            
            window.addEventListener('touchmove', e => {
                e.preventDefault();
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchstart', (e) => {
                mouse.down = true;
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            });
            window.addEventListener('touchend', () => mouse.down = false);

            document.getElementById('start-btn').addEventListener('click', startGame);
            
            loop();
        }

        function startGame() {
            gameState = 'PLAYING';
            document.getElementById('intro').classList.add('hidden');
            
            // Reset Entities
            player = { x: 0, y: 0, units: [], targetRadius: 50, color: C_PLAYER };
            // Start with 1 unit
            player.units.push(new Unit(0,0, player));
            
            bots = [];
            for(let i=0; i<BOT_COUNT; i++) bots.push(new Bot());
            
            food = [];
            for(let i=0; i<FOOD_COUNT; i++) spawnFood();
        }

        function spawnFood() {
            food.push({
                x: (Math.random() * WORLD_SIZE) - WORLD_SIZE/2,
                y: (Math.random() * WORLD_SIZE) - WORLD_SIZE/2,
                active: true
            });
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // --- PHYSICS ENGINE ---

        function updateSwarmPhysics(entity) {
            // Determine Swarm Radius based on count
            // Area = PI * r^2. Each unit needs area. 
            // r = sqrt(Area/PI). Area ~ count * unit_spacing
            let targetR = Math.sqrt(entity.units.length * 50) + 10;
            
            // If mouse down, compact the swarm
            if (entity === player && mouse.down) targetR *= 0.4;
            
            entity.targetRadius += (targetR - entity.targetRadius) * 0.1;

            entity.units.forEach((u, i) => {
                // Target Position relative to leader
                // u.relX/Y is a normalized random vector (0-1).
                // We map that to the current radius.
                let tx = entity.x + u.relX * entity.targetRadius;
                let ty = entity.y + u.relY * entity.targetRadius;

                // Move towards target (Lerp)
                u.x += (tx - u.x) * UNIT_SPEED;
                u.y += (ty - u.y) * UNIT_SPEED;
                
                // Simple Repulsion (very basic to prevent total stacking)
                // In a real optimized boids, this uses spatial hashing. 
                // Here we rely on the random relX/Y offsets to keep them separate naturally.
            });
        }

        function updatePlayer() {
            // Move Leader towards mouse
            // Mouse is screen space, need to convert to relative world direction
            let dx = mouse.x - width/2;
            let dy = mouse.y - height/2;
            
            let angle = Math.atan2(dy, dx);
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            // Deadzone
            if (dist > 10) {
                player.x += Math.cos(angle) * LEADER_SPEED;
                player.y += Math.sin(angle) * LEADER_SPEED;
            }

            // Bound Player
            player.x = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, player.x));
            player.y = Math.max(-WORLD_SIZE/2, Math.min(WORLD_SIZE/2, player.y));

            updateSwarmPhysics(player);
        }

        function resolveCollisions() {
            // 1. Food Collision (Spatial Hashing not strictly needed for 800 items but good practice, skipping for prototype brevity, just distance check relative to camera/player is faster)
            
            // Optimization: Only check food near player
            // Ideally we check all units, but that's expensive.
            // Simplified: If a food bit is inside the Player's Radius, we eat it.
            
            for (let f of food) {
                if (!f.active) continue;
                
                // Check vs Player
                let dx = player.x - f.x;
                let dy = player.y - f.y;
                if (dx*dx + dy*dy < player.targetRadius * player.targetRadius) {
                    // Eaten!
                    f.active = false;
                    player.units.push(new Unit(f.x, f.y, player));
                    createParticles(f.x, f.y, C_PLAYER);
                    // Respawn food elsewhere to keep game going
                    spawnFood();
                }
                
                // Check vs Bots (Optional, keeps them growing)
                for(let b of bots) {
                    let bdx = b.x - f.x;
                    let bdy = b.y - f.y;
                    if (bdx*bdx + bdy*bdy < b.targetRadius * b.targetRadius) {
                        f.active = false;
                        b.units.push(new Unit(f.x, f.y, b));
                        spawnFood();
                        break;
                    }
                }
            }
            food = food.filter(f => f.active);

            // 2. Unit vs Unit Collision (Combat)
            // This is O(N^2) if naive. We MUST use a grid or simplified check.
            // Simplified Combat:
            // Check distance between Leaders. If Leaders are close (radius + radius), then check individual units.
            
            for (let b of bots) {
                let dist = Math.hypot(player.x - b.x, player.y - b.y);
                if (dist < player.targetRadius + b.targetRadius + 50) {
                    // Close enough to fight
                    
                    // Brute force check only the units in this engagement
                    // Iterate backwards so we can splice
                    for (let i = player.units.length - 1; i >= 0; i--) {
                        let pu = player.units[i];
                        let hit = false;
                        
                        for (let j = b.units.length - 1; j >= 0; j--) {
                            let bu = b.units[j];
                            
                            // Distance check
                            if (Math.hypot(pu.x - bu.x, pu.y - bu.y) < UNIT_SIZE * 2) {
                                // COLLISION! Mutual destruction
                                createParticles(pu.x, pu.y, '#fff'); // Explosion
                                b.units.splice(j, 1); // Kill bot unit
                                hit = true;
                                break; // Player unit dies, stop checking this unit
                            }
                        }
                        
                        if (hit) {
                            player.units.splice(i, 1); // Kill player unit
                        }
                    }
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<3; i++) particles.push(new Particle(x, y, color));
        }

        // --- RENDER ---

        function draw() {
            // Clear
            ctx.fillStyle = C_BG;
            ctx.fillRect(0, 0, width, height);

            // Camera Transform
            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // Draw Grid
            ctx.strokeStyle = C_GRID;
            ctx.lineWidth = 2;
            ctx.beginPath();
            let gridSize = 200;
            // Optimize grid drawing to viewport
            let startX = Math.floor((camera.x - (width/2)/camera.zoom) / gridSize) * gridSize;
            let endX = startX + (width/camera.zoom) + gridSize*2;
            let startY = Math.floor((camera.y - (height/2)/camera.zoom) / gridSize) * gridSize;
            let endY = startY + (height/camera.zoom) + gridSize*2;

            for (let x = startX; x < endX; x+=gridSize) {
                ctx.moveTo(x, startY); ctx.lineTo(x, endY);
            }
            for (let y = startY; y < endY; y+=gridSize) {
                ctx.moveTo(startX, y); ctx.lineTo(endX, y);
            }
            ctx.stroke();

            // Draw World Borders
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 10;
            ctx.strokeRect(-WORLD_SIZE/2, -WORLD_SIZE/2, WORLD_SIZE, WORLD_SIZE);

            // Draw Food
            ctx.fillStyle = C_FOOD;
            for (let f of food) {
                // Cull offscreen
                if (Math.abs(f.x - camera.x) > (width/2)/camera.zoom + 50) continue;
                if (Math.abs(f.y - camera.y) > (height/2)/camera.zoom + 50) continue;
                
                ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
            }

            // Draw Bots
            for (let b of bots) {
                drawSwarm(b);
            }

            // Draw Player
            drawSwarm(player);

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        function drawSwarm(entity) {
            // Draw connections (optional, maybe too heavy)
            
            // Draw Units
            ctx.fillStyle = entity.color;
            if (entity === player) {
                ctx.shadowColor = C_PLAYER_GLOW;
                ctx.shadowBlur = 10;
            } else {
                ctx.shadowBlur = 0;
            }

            // Optimize drawing: batch rects?
            for (let u of entity.units) {
                ctx.fillRect(u.x - UNIT_SIZE/2, u.y - UNIT_SIZE/2, UNIT_SIZE, UNIT_SIZE);
            }
            ctx.shadowBlur = 0;
            
            // Draw Leader Indicator (faint circle)
            /*
            ctx.strokeStyle = entity.color;
            ctx.globalAlpha = 0.1;
            ctx.beginPath();
            ctx.arc(entity.x, entity.y, entity.targetRadius, 0, Math.PI*2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            */
        }

        function update() {
            updatePlayer();
            bots.forEach(b => b.update());
            resolveCollisions();
            
            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].update();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            
            // Camera Logic
            // Follow player
            camera.x += (player.x - camera.x) * 0.1;
            camera.y += (player.y - camera.y) * 0.1;
            
            // Zoom based on swarm size
            let idealZoom = 1.5 / Math.max(1, Math.log10(player.units.length + 10));
            camera.zoom += (idealZoom - camera.zoom) * 0.05;

            // Stats
            document.getElementById('swarm-count').innerText = player.units.length;
        }

        function loop() {
            if (gameState === 'PLAYING') {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
