<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>THE EXQUISITE CORPSE</title>
    <style>
        :root {
            --paper: #f4f1ea;
            --ink: #2a2a2a;
            --accent: #ff4444;
        }

        body {
            margin: 0;
            background-color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on mobile while drawing */
        }

        /* --- UI HEADER --- */
        #header {
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #prompt-box {
            text-align: center;
        }
        #prompt-label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        #prompt-text { font-size: 1.5rem; font-weight: bold; color: var(--accent); }

        #progress-dots {
            display: flex;
            gap: 5px;
        }
        .dot { width: 10px; height: 10px; background: #555; border-radius: 50%; }
        .dot.active { background: var(--accent); }
        .dot.done { background: #fff; }

        /* --- DRAWING AREA --- */
        #canvas-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            max-width: 600px;
            background: var(--paper);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* The "Fold" visual indicator */
        #fold-line {
            position: absolute;
            top: 60px; /* Guide Height */
            left: 0;
            width: 100%;
            height: 2px;
            border-bottom: 2px dashed #bbb;
            pointer-events: none;
            display: none; /* Hidden on first step */
        }
        
        #fold-label {
            position: absolute;
            top: 40px;
            right: 10px;
            font-size: 0.7rem;
            color: #bbb;
            pointer-events: none;
            display: none;
        }

        /* --- CONTROLS --- */
        #controls {
            width: 100%;
            max-width: 600px;
            background: #222;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            padding: 15px 20px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }

        #clear-btn { background: #444; color: white; }
        #next-btn { background: var(--accent); color: white; flex-grow: 1; }
        
        /* --- REVEAL SCREEN --- */
        #reveal-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
        }

        #corpse-container {
            background: var(--paper);
            box-shadow: 0 0 50px black;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .corpse-segment {
            width: 100%;
            display: block;
            /* Negative margin to overlap the guide lines slightly for smoother look */
            margin-bottom: -1px; 
        }

        #restart-btn {
            margin: 30px 0;
            background: white;
            color: black;
            box-shadow: 0 0 20px white;
        }

        /* Paper Texture Overlay */
        .texture {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <div id="header">
        <div id="prompt-box">
            <div id="prompt-label">Current Segment</div>
            <div id="prompt-text">THE HEAD</div>
        </div>
        <div id="progress-dots">
            <div class="dot active" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
        </div>
    </div>

    <div id="canvas-container">
        <div class="texture"></div>
        <div id="fold-line"></div>
        <div id="fold-label">CONNECT TO LINES ABOVE</div>
        <canvas id="drawing-board"></canvas>
    </div>

    <div id="controls">
        <button id="clear-btn">Clear</button>
        <button id="next-btn">FOLD & PASS</button>
    </div>

    <!-- REVEAL MODAL -->
    <div id="reveal-screen">
        <h1 style="color:white; text-align:center; margin-bottom: 20px;">IT'S ALIVE!</h1>
        <div id="corpse-container">
            <!-- Images will be injected here -->
        </div>
        <button id="restart-btn" onclick="location.reload()">CREATE ANOTHER MONSTROSITY</button>
    </div>

<script>
    /**
     * EXQUISITE CORPSE ENGINE
     */

    // Config
    const SEGMENTS = [
        { name: "THE HEAD", heightRatio: 1.0 },   // Relative visual weight if we wanted variable sizing
        { name: "THE TORSO", heightRatio: 1.2 },
        { name: "THE LEGS", heightRatio: 1.2 },
        { name: "THE FEET", heightRatio: 0.8 }
    ];
    
    const GUIDE_HEIGHT = 60; // Pixels of the previous drawing to show
    
    // State
    let currentStep = 0;
    let savedImages = [];
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // Elements
    const canvas = document.getElementById('drawing-board');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const promptText = document.getElementById('prompt-text');
    const nextBtn = document.getElementById('next-btn');
    const clearBtn = document.getElementById('clear-btn');
    const foldLine = document.getElementById('fold-line');
    const foldLabel = document.getElementById('fold-label');

    // --- INITIALIZATION ---
    
    function resizeCanvas() {
        // Set actual canvas resolution to match display size for sharpness
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        // Default brush styles
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#2a2a2a';
    }
    
    window.addEventListener('resize', resizeCanvas);
    // Init size immediately
    resizeCanvas();

    // --- DRAWING LOGIC ---

    function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = getCoords(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault(); // Stop scrolling on touch
        
        const [x, y] = getCoords(e);
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        
        [lastX, lastY] = [x, y];
    }

    function stopDrawing() {
        isDrawing = false;
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return [clientX - rect.left, clientY - rect.top];
    }

    // Events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    
    // Touch support
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    // Controls
    clearBtn.addEventListener('click', () => {
        // Clear logic depends on step
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // If not first step, redraw the guide from previous step
        if (currentStep > 0) {
            drawGuide(savedImages[currentStep - 1]);
        }
    });

    nextBtn.addEventListener('click', nextStep);

    // --- GAME FLOW ---

    function nextStep() {
        // 1. Save current canvas
        const dataUrl = canvas.toDataURL('image/png');
        savedImages.push(dataUrl);
        
        // Update UI Dots
        document.getElementById(`dot-${currentStep}`).classList.remove('active');
        document.getElementById(`dot-${currentStep}`).classList.add('done');

        currentStep++;

        // CHECK IF DONE
        if (currentStep >= SEGMENTS.length) {
            reveal();
            return;
        }

        // SETUP NEXT STEP
        // Update UI
        document.getElementById(`dot-${currentStep}`).classList.add('active');
        promptText.innerText = SEGMENTS[currentStep].name;
        
        // Show Fold UI
        foldLine.style.display = 'block';
        foldLabel.style.display = 'block';

        // Clear Canvas for new drawing
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // DRAW GUIDE (The Fold)
        drawGuide(dataUrl);
    }

    function drawGuide(prevImageDataUrl) {
        const img = new Image();
        img.src = prevImageDataUrl;
        img.onload = () => {
            // Source: The bottom slice of the previous image
            // We want the bottom GUIDE_HEIGHT pixels
            const sourceY = img.height - GUIDE_HEIGHT;
            const sourceH = GUIDE_HEIGHT;
            
            // Destination: The top of the new canvas
            // We draw it slightly faded to indicate it's the "past"
            ctx.globalAlpha = 0.5; // Fade it slightly
            
            // Draw image slice
            // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
            ctx.drawImage(img, 
                0, sourceY, img.width, sourceH, // Source Crop
                0, 0, canvas.width, GUIDE_HEIGHT // Dest Placement
            );
            
            ctx.globalAlpha = 1.0; // Reset alpha
        };
    }

    // --- REVEAL LOGIC ---

    function reveal() {
        const revealScreen = document.getElementById('reveal-screen');
        const corpseContainer = document.getElementById('corpse-container');
        
        revealScreen.style.display = 'flex';
        
        // Generate the full stack
        savedImages.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.className = 'corpse-segment';
            
            // Crop Logic for the reveal?
            // In a real exquisite corpse, the "fold" hides the connection. 
            // In digital, we usually just stack them.
            // However, since we painted the GUIDE at the top of steps 2,3,4,
            // We should technically crop the top GUIDE_HEIGHT off of images 2,3,4 
            // OR allow the overlap.
            
            // Let's use CSS Clip-path to crop the top "Guide" area from segments 2, 3, 4
            // so we don't see the faded guide lines, only the new ink.
            if (index > 0) {
                // Calculate percentage for clip-path
                // We want to cut off the top 60px (GUIDE_HEIGHT)
                // Since we don't know exact pixel height in CSS easily without JS calc,
                // let's just stack them. The user drew OVER the guide, so the guide is now part of the drawing.
                // Actually, since we drew the guide with 0.5 alpha, it might look messy if we keep it.
                // A cool trick: utilizing negative margin to pull them up.
                img.style.marginTop = `-${GUIDE_HEIGHT}px`;
                
                // Also, we need to ensure the background of the image is opaque (paper color) 
                // so it covers the guide below.
                // But `toDataURL` creates transparent PNGs.
                // We need to fill background before saving or handle it here.
                img.style.background = "#f4f1ea"; 
            }
            
            corpseContainer.appendChild(img);
        });
        
        // Auto scroll to top
        revealScreen.scrollTop = 0;
    }

</script>
</body>
</html>
